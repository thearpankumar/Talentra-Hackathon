# Talentra Prometheus. Shared by local + prod. Env-specific jobs live in scrape.d/{local,prod}/ (mounted at scrape.d/env/).
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    monitor: talentra

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_config_files:
  - /etc/prometheus/scrape.d/common/*.yml
  - /etc/prometheus/scrape.d/env/*.yml
