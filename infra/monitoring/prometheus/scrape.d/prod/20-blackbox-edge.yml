scrape_configs:
  - job_name: blackbox-http
    metrics_path: /probe
    params: {module: [http_2xx]}
    file_sd_configs:
      - files: [/etc/prometheus/targets/blackbox-http.yml]
        refresh_interval: 1m
    relabel_configs: &bb
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: "blackbox:9115"}
  - job_name: blackbox-tcp
    metrics_path: /probe
    params: {module: [tcp_connect]}
    file_sd_configs:
      - files: [/etc/prometheus/targets/blackbox-tcp.yml]
        refresh_interval: 1m
    relabel_configs: *bb

  - job_name: caddy
    metrics_path: /metrics
    file_sd_configs:
      - files: [/etc/prometheus/targets/caddy.yml]
        refresh_interval: 1m

  # Ingestion engine (placeholder: the engine does not expose /metrics yet; see README for expected metric names).
  - job_name: ingestion-engine
    metrics_path: /metrics
    file_sd_configs:
      - files: [/etc/prometheus/targets/ingestion-engine.yml]
        refresh_interval: 1m

  # Docker daemon metrics (opt-in: "metrics-addr" in daemon.json). Absent target is NOT paged (optional=true).
  - job_name: docker-daemon
    file_sd_configs:
      - files: [/etc/prometheus/targets/docker-daemon.yml]
        refresh_interval: 1m
