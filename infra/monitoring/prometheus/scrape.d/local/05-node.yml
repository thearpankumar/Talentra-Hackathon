# LOCAL (Docker Desktop): node_exporter in bridge mode; it still reads the Docker Desktop VM's /proc and /sys via the rootfs mount.
scrape_configs:
  - job_name: node
    static_configs: [{targets: ["node-exporter:9100"], labels: {host: talentra-host}}]
    relabel_configs:
      - {target_label: instance, replacement: talentra-host}
