# LOCAL: insecure CockroachDB (http). job label is normalised to "cockroachdb" (what the official dashboards expect).
scrape_configs:
  - job_name: cockroachdb-main
    metrics_path: /_status/vars
    scheme: http
    file_sd_configs:
      - files: [/etc/prometheus/targets/cockroach-main.yml, /etc/prometheus/targets-dyn/cockroach-demo.yml]
        refresh_interval: 30s
    relabel_configs:
      - {target_label: job, replacement: cockroachdb}
  - job_name: cockroachdb-backup
    metrics_path: /_status/vars
    scheme: http
    file_sd_configs:
      - files: [/etc/prometheus/targets/cockroach-backup.yml]
        refresh_interval: 30s
    relabel_configs:
      - {target_label: job, replacement: cockroachdb}
