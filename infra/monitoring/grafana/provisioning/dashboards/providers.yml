apiVersion: 1
providers:
  # sub-directories of /var/lib/grafana-dashboards become Grafana folders
  - name: talentra
    orgId: 1
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana-dashboards
      foldersFromFilesStructure: true
