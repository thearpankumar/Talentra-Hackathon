apiVersion: 1
# Grafana-managed alerts are forwarded to Alertmanager, so there is ONE routing/receiver config (alertmanager/).
contactPoints:
  - orgId: 1
    name: talentra-alertmanager
    receivers:
      - uid: talentra-am
        type: prometheus-alertmanager
        is_default: true
        settings:
          url: http://alertmanager:9093
        disableResolveMessage: false
policies:
  - orgId: 1
    receiver: talentra-alertmanager
    group_by: [grafana_folder, alertname]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
