# PROD standalone backup CockroachDB (EC2): secure (internal CA + password auth). SQL host port 26258, Console via Caddy (backup.talentra...).
# Sizing: infra/aws-scripts/EC2_SIZING.md (cache 4GiB, sql mem 3GiB, 3 cpus).
name: talentra-backup

services:
  certs:
    image: cockroachdb/cockroach:${CRDB_VERSION:-v26.2.8}
    restart: "no"
    entrypoint: ["/scripts/gen-certs.sh"]
    environment:
      CERT_HOSTS: ${CERT_HOSTS:-localhost 127.0.0.1 backup-crdb backup.talentra.thearpanhq.in 34.235.96.187}
    volumes: ["./scripts:/scripts:ro", "certs:/certs", "./certs-public:/certs-public"]

  backup-crdb:
    image: cockroachdb/cockroach:${CRDB_VERSION:-v26.2.8}
    restart: unless-stopped
    stop_grace_period: 60s
    hostname: backup-crdb
    command: start-single-node --certs-dir=/certs --advertise-addr=backup-crdb --cache=${BK_CACHE:-4GiB} --max-sql-memory=${BK_SQL_MEM:-3GiB}
    mem_limit: ${BK_MEM_LIMIT:-9g}
    cpus: ${BK_CPUS:-3.0}
    volumes: [backup_data:/cockroach/cockroach-data, backup_share:/cockroach/cockroach-data/extern, "certs:/certs:ro"]
    ports: ["${BACKUP_SQL_PORT:-26258}:26257"]
    depends_on: {certs: {condition: service_completed_successfully}}
    healthcheck:
      test: ["CMD-SHELL", "curl -skf https://localhost:8080/health?ready=1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 20s
    networks:
      default:
      edge: {aliases: [backup-crdb]}
    logging: {driver: json-file, options: {max-size: "20m", max-file: "5"}}

  bootstrap:
    image: cockroachdb/cockroach:${CRDB_VERSION:-v26.2.8}
    restart: "no"
    entrypoint: ["/scripts/bootstrap.sh"]
    env_file: [.env]
    environment: {CRDB_SECURE: "1"}
    volumes: ["./scripts:/scripts:ro", "certs:/certs:ro"]
    depends_on: {backup-crdb: {condition: service_healthy}}

networks:
  edge: {name: talentra-edge, external: true}

volumes:
  certs:
  backup_data:
  backup_share: {name: talentra_backup_share, external: true}
