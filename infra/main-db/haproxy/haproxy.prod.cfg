# Talentra HAProxy: two TCP frontends in front of the 3 CockroachDB nodes.
#   :26257 WRITE  -> node1 (leaseholder-preferred); nodes 2/3 are 'backup' servers used only if node1 fails its health check
#   :26259 READ   -> round-robin node2/node3 (follower reads); node1 only as last-resort fallback
# Health check: GET /health?ready=1 on the node's HTTP port 8080 (200 only when the node is live AND accepting SQL).
# Failover design (why there is NO `on-marked-down shutdown-sessions`):
#   A node that is merely SLOW (busy compaction / schema apply) can miss a few health checks. Shutting down every session
#   on a transient check failure kills healthy long-running transactions and imports. So: a server needs 4 consecutive
#   failures at 5s (about 20s; 2s while it is flapping) to be marked DOWN, 3 successes to come back (+20s slowstart); sessions that
#   are already open are left alone. If the node is really dead its TCP connections are reset by the kernel/Docker
#   immediately (srvtcpka detects half-open ones), and clients reconnect to the backup servers.
# Metrics: native Prometheus exporter on :8405/metrics (internal docker network only, never published on the host).
global
    maxconn 4096
    log stdout format raw local0 notice

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s

defaults
    mode tcp
    log global
    option tcplog
    option clitcpka
    option srvtcpka
    timeout connect 5s
    timeout client 30m
    timeout server 30m
    timeout check 4s

frontend monitor
    mode http
    bind :8404
    monitor-uri /healthz
    stats enable
    stats uri /stats
    stats refresh 5s

frontend prometheus
    mode http
    bind :8405
    http-request use-service prometheus-exporter if { path /metrics }
    http-request deny

frontend sql_write
    bind :26257
    default_backend be_write

frontend sql_read
    bind :26259
    default_backend be_read

backend be_write
    option httpchk
    http-check send meth GET uri /health?ready=1
    http-check expect status 200
    default-server inter 5s fastinter 2s downinter 5s fall 4 rise 3 slowstart 20s resolvers docker init-addr libc,none check-ssl verify none
    server n1 crdb1:26257 port 8080 check
    server n2 crdb2:26257 port 8080 check backup
    server n3 crdb3:26257 port 8080 check backup

backend be_read
    balance roundrobin
    option httpchk
    http-check send meth GET uri /health?ready=1
    http-check expect status 200
    default-server inter 5s fastinter 2s downinter 5s fall 4 rise 3 slowstart 20s resolvers docker init-addr libc,none check-ssl verify none
    server n2 crdb2:26257 port 8080 check
    server n3 crdb3:26257 port 8080 check
    server n1 crdb1:26257 port 8080 check backup
