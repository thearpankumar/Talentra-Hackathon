- name: reference_check_response
  kind: entity
  delete_policy: hard
  volume: medium
  tier: X
  milestones: []
  retention: Deleted with the request; responder_ip nulled after 90 days.
  description: Referee's answers (structured). Encrypted because free-text opinions are personal data about the candidate.
  columns:
  - name: reference_check_request_id
    type: UUID
    domain: identifier
    desc: Request answered (one response per request).
    sens: Internal
  - name: submitted_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Submission time.
    sens: Internal
    default: now()
  - name: overall_rating
    type: INT2
    domain: quantity
    desc: 1-5 overall recommendation.
    sens: Internal
    'null': true
    null_why: NULL = referee declined to rate
  - name: would_rehire
    type: BOOL
    domain: boolean
    desc: Referee would rehire; ignored when overall_rating is NULL.
    sens: Internal
    default: 'false'
  - name: tenure_confirmed
    type: BOOL
    domain: boolean
    desc: Referee confirmed stated dates/title.
    sens: Internal
    default: 'false'
  - name: answers_encrypted
    type: BYTES
    domain: encrypted
