- name: equal_opportunity_response
  kind: entity
  delete_policy: hard
  volume: medium
  tier: X
  milestones: []
  retention: Hard-deleted on purge_after_date or candidate erasure; only k-anonymous aggregates (min cell size 10) survive in reports.
  description: 'A candidate''s voluntary self-ID answers (race/ethnicity, gender identity, disability, veteran, caste category for statutory reporting). Special-category data: stored apart from application
    data, field-encrypted, readable only by the compliance role, NEVER joined to ranking, screening or recruiter views.'
  columns:
  - name: equal_opportunity_survey_id
    type: UUID
    domain: identifier
    desc: Survey answered.
    sens: Internal
  - name: candidate_profile_id
    type: UUID
    domain: identifier
    desc: Respondent (for erasure and dedupe only).
    sens: Internal
  - name: organisation_id
    type: UUID
    domain: identifier
    desc: Employer for which it was collected (aggregate reporting).
    sens: Internal
    'null': true
    null_why: NULL = platform-wide survey
  - name: job_application_id
    type: UUID
    domain: identifier
    desc: Application context; deliberately not exposed to recruiter roles.
    sens: Internal
    'null': true
    null_why: NULL = collected outside an application
  - name: user_consent_id
    type: UUID
    domain: identifier
    desc: Explicit consent record.
    sens: Internal
  - name: declined_to_answer
    type: BOOL
    domain: boolean
    desc: Respondent chose 'prefer not to say' for the whole form.
    sens: Internal
    default: 'false'
  - name: answers_encrypted
    type: BYTES
    domain: encrypted
    desc: Answers, AES-GCM envelope encrypted.
    sens: Sensitive
    'null': true
    null_why: NULL = declined_to_answer is true
    pii: App-layer AES-GCM with a dedicated compliance KMS key; separate DB role; every read audited; excluded from search/ML feature pipelines
  - name: submitted_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Submission.
    sens: Internal
  - name: purge_after_date
    type: DATE
    domain: date
    desc: Hard-delete date derived from the survey's retention.
    sens: Internal
  constraints:
  - name: uq_equal_opportunity_response_equal_opportunity_survey_id_candidate_profile_id
    type: unique
    columns:
    - equal_opportunity_survey_id
    - candidate_profile_id
    desc: Natural key ['equal_opportunity_survey_id', 'candidate_profile_id'].
  - name: ck_equal_opportunity_response_answer_or_decline
    type: check
    expr: (declined_to_answer AND answers_encrypted IS NULL) OR (NOT declined_to_answer AND answers_encrypted IS NOT NULL)
    desc: Rule answer_or_decline.
  indexes:
  - name: idx_equal_opportunity_response_candidate_profile_id
    columns:
    - candidate_profile_id
    desc: Access path on candidate_profile_id.
  - name: idx_equal_opportunity_response_organisation_id
    columns:
    - organisation_id
    desc: Access path on organisation_id.
