  - name: signed_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Signed.
    sens: Internal
    'null': true
    null_why: NULL = not signed
  - name: expires_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Signing deadline.
    sens: Internal
    'null': true
    null_why: NULL = no deadline
  - name: signed_object_ref
    type: STRING(500)
    domain: free_text
    desc: Object-storage key of the vendor's signed PDF copy.
    sens: Personal
