- name: background_check_order
  kind: entity
  delete_policy: soft
  volume: medium
  tier: X
  milestones: []
  retention: Outcome rows kept 12 months after the hiring decision, then deleted/anonymised; DPDP/GDPR erasure on request unless legal hold.
  description: Background-screening order to an external vendor. Platform stores order reference, consent proof and outcome only (boundary, like candidate_identity_verification); no raw criminal/credit
    reports.
  columns:
  - name: organisation_id
    type: UUID
    domain: identifier
    desc: Ordering employer.
    sens: Internal
  - name: candidate_profile_id
    type: UUID
