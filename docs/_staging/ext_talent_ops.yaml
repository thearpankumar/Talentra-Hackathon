    sens: Internal
  - name: package_code
    type: STRING(60)
    domain: code
    desc: Vendor package/bundle code.
    sens: Internal
  - name: vendor_order_ref
    type: STRING(120)
    domain: token
    desc: Vendor order id.
    sens: Sensitive
    'null': true
    null_why: NULL = vendor has not accepted the order yet
    pii: Vendor reference only; no report content
  - name: idempotency_key
    type: STRING(100)
    domain: code
    desc: Client-supplied key preventing duplicate orders on retry.
    sens: Internal
  - name: user_consent_id
    type: UUID
    domain: identifier
    desc: Candidate's recorded consent to the screen (mandatory).
    sens: Internal
  - name: ordered_by_app_user_id
