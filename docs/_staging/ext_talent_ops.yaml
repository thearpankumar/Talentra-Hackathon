    sens: Internal
    'null': true
    null_why: NULL = not adjudicated
  - name: adjudicated_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Review instant.
    sens: Internal
    'null': true
    null_why: NULL = not adjudicated
  - name: adverse_action_notice_sent_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Pre-adverse-action notice sent to candidate (FCRA-style fairness step).
    sens: Internal
    'null': true
    null_why: NULL = none sent
  constraints:
  - name: ck_background_check_order_completed_after_ordered
    type: check
    expr: completed_at IS NULL OR completed_at >= ordered_at
    desc: Rule completed_after_ordered.
  - name: ck_background_check_order_adjudication_pair
    type: check
    expr: (adjudicated_at IS NULL) = (adjudicated_by_app_user_id IS NULL)
