- name: reference_check_request
  kind: entity
  delete_policy: soft
  volume: medium
  tier: X
  milestones: []
  retention: Referee contact anonymised 6 months after the request closes; response kept per candidate record retention.
  description: Reference request sent to a candidate-nominated referee (Greenhouse/Checkster-style). Referee contact is third-party personal data.
  columns:
  - name: organisation_id
    type: UUID
    domain: identifier
    desc: Requesting employer.
    sens: Internal
  - name: candidate_profile_id
    type: UUID
    domain: identifier
    desc: Candidate the reference is about.
    sens: Internal
  - name: job_application_id
    type: UUID
    domain: identifier
    desc: Application context.
    sens: Internal
    'null': true
    null_why: NULL = no application
  - name: referee_name
    type: STRING(150)
    domain: person_name
    desc: Referee name.
    sens: Personal
    pii: Third-party personal data; minimal; erased with request
  - name: referee_email
    type: STRING(254)
    domain: email
    desc: Referee email.
    sens: Personal
    'null': true
    null_why: NULL = phone-only referee
    pii: Third-party contact; masked in UI; erased with request
  - name: referee_phone
    type: STRING(16)
    domain: phone
    desc: Referee phone.
    sens: Personal
    'null': true
    null_why: NULL = email-only referee
    pii: Third-party contact; masked in UI; erased with request
  - name: referee_phone_country_id
    type: UUID
    domain: identifier
    desc: Country calling-code context of referee_phone.
    sens: Internal
    'null': true
    null_why: NULL when referee_phone is NULL
  - name: referee_company
    type: STRING(200)
    domain: free_text
    desc: Referee's company.
    sens: Internal
    'null': true
    null_why: NULL = not stated
  - name: referee_relationship_id
    type: UUID
    domain: enum_ref
    desc: Relationship to the candidate.
    sens: Internal
  - name: reference_check_status_id
    type: UUID
    domain: enum_ref
    desc: State.
    sens: Internal
  - name: access_token_hash
    type: STRING(128)
    domain: secret_hash
    desc: SHA-256 of the one-time response link token (token itself only in the email).
    sens: Sensitive
    pii: SHA-256 hash of the one-time response-link token; the token itself exists only in the e-mail; compare in constant time; expire with the request
  - name: user_consent_id
    type: UUID
    domain: identifier
    desc: Candidate consent to contact the referee.
    sens: Internal
    'null': true
    null_why: NULL = consent captured in-product before consent record existed
  - name: requested_by_app_user_id
    type: UUID
    domain: identifier
    desc: Recruiter who requested.
    sens: Internal
  - name: sent_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Sent time.
    sens: Internal
    'null': true
    null_why: NULL = queued
  - name: expires_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Link expiry.
    sens: Internal
  - name: reminder_count
    type: INT2
    domain: quantity
    desc: Reminders sent.
    sens: Internal
    default: '0'
  constraints:
  - name: ck_reference_check_request_referee_email_lower
    type: check
    expr: referee_email IS NULL OR referee_email = lower(referee_email)
    desc: Lowercase email.
  - name: ck_reference_check_request_referee_phone_e164
    type: check
    expr: referee_phone IS NULL OR referee_phone ~ '^\+[1-9][0-9]{6,14}$'
    desc: E.164 phone.
  - name: ck_reference_check_request_referee_contact_present
    type: check
    expr: referee_email IS NOT NULL OR referee_phone IS NOT NULL
    desc: Rule referee_contact_present.
  - name: ck_reference_check_request_expiry_after_sent
    type: check
    expr: sent_at IS NULL OR expires_at > sent_at
    desc: Rule expiry_after_sent.
  indexes:
  - name: uq_reference_check_request_access_token_hash
    columns:
    - access_token_hash
    unique: true
    where: deleted_at IS NULL
    desc: Natural key ['access_token_hash'] among live rows.
  - name: idx_reference_check_request_candidate_profile_id_reference_check_status_id
    columns:
    - candidate_profile_id
    - reference_check_status_id
    desc: Access path on candidate_profile_id, reference_check_status_id.
