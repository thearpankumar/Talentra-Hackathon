  - name: signer_app_user_id
    type: UUID
    domain: identifier
    desc: Signer when a platform user.
    sens: Internal
    'null': true
    null_why: NULL = signer is a candidate or external
  - name: e_sign_vendor_id
    type: UUID
    domain: enum_ref
    desc: Vendor that holds the envelope.
    sens: Internal
  - name: vendor_envelope_ref
    type: STRING(200)
    domain: token
    desc: Vendor's envelope/transaction reference (opaque token).
