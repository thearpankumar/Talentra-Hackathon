- name: e_sign_request
  kind: entity
  delete_policy: soft
  volume: medium
  tier: X
  milestones: []
  retention: Kept with the signed document (7 years for employment contracts); signer_ip nulled after 1 year.
  description: Boundary record of an e-signature envelope (offer letter, joining forms, contract). Only vendor reference and status are stored - never signature images or keys.
  columns:
  - name: organisation_id
    type: UUID
