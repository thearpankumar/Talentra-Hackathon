views:
- name: vw_onboarding_progress
  kind: view
  tables:
  - onboarding_plan
  - onboarding_plan_task
  purpose: Per-plan count of required/completed/overdue tasks for HR dashboards.
  security: Tenant filter on organisation_id; security_invoker pattern via app role grants.
  sql_sketch: SELECT p.id, count(*) FILTER (WHERE t.is_required) required, count(*) FILTER (WHERE t.completed_at IS NOT NULL) done FROM onboarding_plan p JOIN onboarding_plan_task t ON t.onboarding_plan_id
    = p.id GROUP BY p.id
- name: vw_client_vendor_submission
  kind: view
  tables:
  - vendor_submission
  purpose: Client-facing submission list without pay rate or margin.
  security: Client role granted this view only; vendor_submission base table not granted to client roles (no column privileges in CockroachDB).
  sql_sketch: SELECT id, workforce_request_id, msp_vendor_id, candidate_profile_id, vendor_submission_status_id, proposed_bill_rate, currency_id, available_from_date FROM vendor_submission WHERE deleted_at
    IS NULL
- name: vw_staffing_margin
  kind: view
  tables:
  - staffing_assignment
  purpose: Agency-internal margin per assignment (bill_rate - pay_rate, margin percent).
  security: Agency finance role only; never granted to client or worker roles.
  sql_sketch: SELECT id, agency_organisation_id, bill_rate - pay_rate AS margin, (bill_rate - pay_rate) / NULLIF(bill_rate,0) * 100 AS margin_percent FROM staffing_assignment WHERE deleted_at IS NULL
- name: vw_timesheet_pending_approval
  kind: view
  tables:
  - timesheet
  - staffing_assignment
  purpose: Submitted timesheets awaiting the supervisor, with assignment and client.
  security: Supervisor sees own assignments (supervisor_app_user_id = current actor); finance sees client scope.
  sql_sketch: SELECT t.* , a.client_organisation_id, a.supervisor_app_user_id FROM timesheet t JOIN staffing_assignment a ON a.id = t.staffing_assignment_id WHERE t.submitted_at IS NOT NULL AND t.locked_at
    IS NULL
- name: vw_drive_funnel
  kind: view
  tables:
  - placement_drive
  - drive_registration
  - drive_result
  purpose: Registrations, shortlisted, selected per drive and institution for TPO reports.
  security: TPO sees own institution rows; employer sees own drives; counts only below 5 suppressed for individuals.
  sql_sketch: SELECT r.placement_drive_id, r.institution_id, count(*) registered, count(d.id) FILTER (WHERE d.drive_result_decision_id IS NOT NULL) decided FROM drive_registration r LEFT JOIN drive_result
    d ON d.drive_registration_id = r.id GROUP BY 1,2
- name: vw_active_account_restriction
  kind: view
  tables:
  - account_restriction
  purpose: Restrictions in force now, for request-time enforcement.
  security: Internal service role; user sees only own via API.
  sql_sketch: SELECT * FROM account_restriction WHERE lifted_at IS NULL AND starts_at <= now() AND (ends_at IS NULL OR ends_at > now())
- name: vw_eeo_aggregate_cell_count
  kind: view
  tables:
  - equal_opportunity_response
  - equal_opportunity_survey
  purpose: Response counts per survey/organisation only (no answers), so reporting can enforce the minimum cell size before decrypting in the compliance service.
  security: Compliance role only; no join to candidate_profile exposed; answers decrypted outside SQL.
  sql_sketch: SELECT equal_opportunity_survey_id, organisation_id, count(*) responses, count(*) FILTER (WHERE declined_to_answer) declined FROM equal_opportunity_response GROUP BY 1,2 HAVING count(*) >=
    10
business_rules:
- id: BR-OPS-01
  rule: A joining has at most one onboarding plan.
  mechanism_type: UNIQUE
  mechanism: UNIQUE (joining_id) on onboarding_plan.
  tables:
  - onboarding_plan
  milestone: X
- id: BR-OPS-02
  rule: An onboarding task belongs to the same organisation as its plan.
  mechanism_type: FK
  mechanism: Composite FK (onboarding_plan_id, organisation_id) -> onboarding_plan(id, organisation_id) backed by uq_onboarding_plan_id_organisation_id.
  tables:
  - onboarding_plan_task
  - onboarding_plan
  milestone: X
- id: BR-OPS-03
  rule: Each onboarding task has exactly one accountable assignee.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: Partial unique (onboarding_plan_task_id) WHERE is_primary; application sets the primary in the same txn that inserts assignments.
  tables:
  - onboarding_task_assignment
  milestone: X
- id: BR-OPS-04
  rule: A document of a given type is requested once per plan.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: Partial unique (onboarding_plan_id, document_type_id) WHERE deleted_at IS NULL.
  tables:
  - onboarding_document_request
  milestone: X
- id: BR-OPS-05
  rule: Plan completion percentage cannot leave 0..100 and is recomputed in the task-completion txn.
  mechanism_type: CHECK
  mechanism: 'ck_onboarding_plan_completion_percent_range plus TXN: UPDATE onboarding_plan_task, then SELECT ... FOR UPDATE onboarding_plan and recompute.'
  tables:
  - onboarding_plan
  - onboarding_plan_task
  milestone: X
- id: BR-OPS-06
  rule: A background check cannot be ordered without a candidate consent record.
  mechanism_type: FK
  mechanism: user_consent_id NOT NULL FK to user_consent on background_check_order.
  tables:
  - background_check_order
  milestone: X
- id: BR-OPS-07
  rule: Background-check orders are idempotent per client key and per vendor order reference.
  mechanism_type: UNIQUE
  mechanism: UNIQUE (idempotency_key); partial unique (background_check_vendor_id, vendor_order_ref) WHERE vendor_order_ref IS NOT NULL.
  tables:
  - background_check_order
  milestone: X
- id: BR-OPS-08
  rule: An adverse or consider outcome needs adjudication before any decision; the adjudicator pair is set together.
  mechanism_type: CHECK
  mechanism: ck_background_check_order_adjudication_pair; the decision API refuses while is_adjudication_required AND adjudicated_at IS NULL (APP_LAYER).
  tables:
  - background_check_order
  milestone: X
- id: BR-OPS-09
  rule: A background check has one result per check type.
  mechanism_type: UNIQUE
  mechanism: UNIQUE (background_check_order_id, background_check_type_id).
  tables:
  - background_check_result
  milestone: X
- id: BR-OPS-10
  rule: A reference request needs at least one referee contact channel and a one-time token.
  mechanism_type: CHECK
  mechanism: ck_reference_check_request_referee_contact_present; UNIQUE (access_token_hash) (hash of the emailed token).
  tables:
  - reference_check_request
  milestone: X
- id: BR-OPS-11
  rule: Reference responses are rated 1-5 and one per request.
  mechanism_type: CHECK
  mechanism: ck_reference_check_response_rating_range; UNIQUE (reference_check_request_id).
  tables:
  - reference_check_response
  milestone: X
- id: BR-OPS-12
  rule: Client roles never see vendor pay rate or margin.
  mechanism_type: PRIVILEGE
  mechanism: REVOKE ALL on vendor_submission and staffing_assignment from client roles; GRANT SELECT on vw_client_vendor_submission only (table-level grants because CockroachDB has no column privileges).
  tables:
  - vendor_submission
  - staffing_assignment
  milestone: X
- id: BR-OPS-13
  rule: Drive dates, registration window and round windows are ordered.
  mechanism_type: CHECK
  mechanism: ck_placement_drive_drive_dates, ck_placement_drive_registration_window, ck_drive_round_round_window.
  tables:
  - placement_drive
  - drive_round
  milestone: X
- id: BR-OPS-14
  rule: A student registers once per drive and has one final result.
  mechanism_type: UNIQUE
  mechanism: UNIQUE (placement_drive_id, candidate_profile_id) partial on live rows; UNIQUE (drive_registration_id) on drive_result; UNIQUE (drive_round_id, drive_registration_id).
  tables:
  - drive_registration
  - drive_result
  - drive_round_result
  milestone: X
- id: BR-OPS-15
  rule: Drive eligibility is evaluated only from academic/skill criteria, never protected attributes.
  mechanism_type: APP_LAYER
  mechanism: eligibility_rule_kind lookup contains no protected-attribute kinds; seed changes require compliance approval (admin_action_approval); evaluator reads only student_cohort_member academic columns
    and candidate_skill.
  tables:
  - drive_eligibility_rule
  - student_cohort_member
  milestone: X
- id: BR-OPS-16
  rule: Eligibility evaluation is frozen at registration for audit.
  mechanism_type: APP_LAYER
  mechanism: drive_registration.eligibility_snapshot written once in the registration txn; no later UPDATE of that column (application contract, audited).
  tables:
  - drive_registration
  milestone: X
- id: BR-OPS-17
  rule: A stipend instalment exists once per enrolment and due date and is non-negative.
  mechanism_type: UNIQUE
  mechanism: UNIQUE (apprentice_enrolment_id, due_date); ck_apprentice_stipend_schedule_amount_nonneg.
  tables:
  - apprentice_stipend_schedule
  milestone: X
- id: BR-OPS-18
  rule: A vendor is enrolled once per client at a time and client differs from vendor.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: Partial unique (client_organisation_id, vendor_organisation_id) WHERE effective_to_date IS NULL; ck_msp_vendor_client_not_vendor.
  tables:
  - msp_vendor
  milestone: X
- id: BR-OPS-19
  rule: A vendor submits a candidate once per workforce request and never below pay rate.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: Partial unique (workforce_request_id, msp_vendor_id, candidate_profile_id); ck_vendor_submission_no_negative_margin.
  tables:
  - vendor_submission
  milestone: X
- id: BR-OPS-20
  rule: Filled count never exceeds headcount; updated under row lock.
  mechanism_type: TXN_LOCK
  mechanism: ck_workforce_request_filled_bounds; placement txn runs SELECT ... FOR UPDATE on workforce_request then increments filled_count.
  tables:
  - workforce_request
  milestone: X
- id: BR-OPS-21
  rule: Assignment window is ordered, rates non-negative, and end reason/time set together.
  mechanism_type: CHECK
  mechanism: ck_staffing_assignment_assignment_window, _rates_positive, _end_reason_when_ended.
  tables:
  - staffing_assignment
  milestone: X
- id: BR-OPS-22
  rule: One timesheet per assignment and period; hours per entry 0 < h <= 24.
  mechanism_type: UNIQUE
  mechanism: UNIQUE (staffing_assignment_id, period_start_date); ck_timesheet_entry_hours_range.
  tables:
  - timesheet
  - timesheet_entry
  milestone: X
- id: BR-OPS-23
  rule: Timesheet approvals are immutable, one per submission and level.
  mechanism_type: UNIQUE
  mechanism: append_only privileges (INSERT/SELECT); UNIQUE (timesheet_id, submission_no, approval_level); approver differs from submitter by APP_LAYER check.
  tables:
  - timesheet_approval
  milestone: X
- id: BR-OPS-24
  rule: A locked timesheet cannot be edited.
  mechanism_type: TXN_LOCK
  mechanism: Edit txn does SELECT ... FOR UPDATE on timesheet and aborts when locked_at IS NOT NULL.
  tables:
  - timesheet
  - timesheet_entry
  milestone: X
- id: BR-OPS-25
  rule: Campaign enrolment requires a consent record and is unique per campaign and candidate.
  mechanism_type: FK
  mechanism: user_consent_id NOT NULL FK; UNIQUE (talent_campaign_id, candidate_profile_id); enrolment txn verifies consent type = talent_campaign.required_consent_type_id and that consent is not withdrawn
    (APP_LAYER).
  tables:
  - campaign_enrolment
  - talent_campaign
  milestone: X
- id: BR-OPS-26
  rule: A sequence step runs at most once per enrolment.
  mechanism_type: UNIQUE
  mechanism: UNIQUE (campaign_enrolment_id, talent_sequence_step_id) on campaign_step_execution (idempotent scheduler).
  tables:
  - campaign_step_execution
  milestone: X
