- name: student_cohort_member
  kind: entity
  delete_policy: hard
  volume: medium
  tier: X
  milestones: []
  retention: Deleted/anonymised on erasure; otherwise 3 years after graduation year.
  description: 'Student in a cohort with TPO-verified academic data used for drive eligibility. Academic data only: no caste/religion/gender fields are held here.'
  columns:
  - name: student_cohort_id
    type: UUID
    domain: identifier
    desc: Cohort.
    sens: Internal
  - name: candidate_profile_id
    type: UUID
    domain: identifier
    desc: Student's platform profile.
    sens: Internal
  - name: roll_number_hmac
    type: STRING(64)
    domain: code
    desc: HMAC-SHA256 blind index of the institution roll number (dedupe only).
    sens: Sensitive
    pii: HMAC with institution-scoped key; raw roll number never stored
  - name: cgpa
    type: DECIMAL(4,2)
    domain: measure
    desc: Cumulative grade point (0-10).
    sens: Personal
    'null': true
    null_why: NULL = not yet reported
    pii: 'Academic record: personal data; visible to TPO and to drives the student registered for'
  - name: tenth_percent
    type: DECIMAL(5,2)
    domain: percentage
    desc: Class X percentage.
    sens: Personal
    'null': true
    null_why: NULL = not provided
    pii: 'Academic record: personal; same access as cgpa'
  - name: twelfth_percent
    type: DECIMAL(5,2)
    domain: percentage
    desc: Class XII percentage.
    sens: Personal
    'null': true
    null_why: NULL = not provided
    pii: 'Academic record: personal; same access as cgpa'
  - name: current_backlog_count
    type: INT2
    domain: quantity
    desc: Open backlogs.
    sens: Internal
    'null': true
    null_why: NULL = unknown
  - name: is_verified_by_tpo
    type: BOOL
    domain: boolean
    desc: TPO attested the figures.
    sens: Internal
    default: 'false'
  - name: verified_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Attestation instant.
    sens: Internal
    'null': true
    null_why: NULL = not verified
  constraints:
  - name: uq_student_cohort_member_student_cohort_id_candidate_profile_id
    type: unique
    columns:
    - student_cohort_id
    - candidate_profile_id
    desc: Natural key ['student_cohort_id', 'candidate_profile_id'].
  - name: ck_student_cohort_member_tenth_percent_range
    type: check
    expr: tenth_percent IS NULL OR (tenth_percent >= 0 AND tenth_percent <= 100)
    desc: Percentage 0..100.
  - name: ck_student_cohort_member_twelfth_percent_range
    type: check
    expr: twelfth_percent IS NULL OR (twelfth_percent >= 0 AND twelfth_percent <= 100)
    desc: Percentage 0..100.
  - name: ck_student_cohort_member_cgpa_range
    type: check
    expr: cgpa IS NULL OR cgpa BETWEEN 0 AND 10
    desc: Rule cgpa_range.
  - name: ck_student_cohort_member_backlog_nonneg
    type: check
    expr: current_backlog_count IS NULL OR current_backlog_count >= 0
    desc: Rule backlog_nonneg.
  indexes:
  - name: idx_student_cohort_member_candidate_profile_id
    columns:
    - candidate_profile_id
    desc: Access path on candidate_profile_id.
  fks:
  - name: fk_student_cohort_member_student_cohort_id
    columns:
    - student_cohort_id
    ref: student_cohort
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
