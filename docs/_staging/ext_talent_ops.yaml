tables:
- name: onboarding_plan_template
  kind: entity
  delete_policy: soft
  volume: medium
  tier: X
  milestones: []
  retention: Kept while the employer is live; soft-deleted templates purged 2 years after deletion (plans hold their own copied tasks).
  description: Employer's reusable onboarding checklist template (Workday Onboarding / Greenhouse Onboarding task templates).
  columns:
  - name: organisation_id
    type: UUID
    domain: identifier
    desc: Owning employer (tenant).
    sens: Internal
  - name: name
    type: STRING(150)
    domain: free_text
    desc: Template name, e.g. 'Engineering - India - Permanent'.
    sens: Internal
  - name: employment_type_id
    type: UUID
    domain: enum_ref
    desc: Employment type the template applies to.
    sens: Internal
    'null': true
    null_why: NULL = template applies to every employment type
  - name: is_active
    type: BOOL
    domain: boolean
    desc: false hides the template from new plans; existing plans keep their copy.
    sens: Internal
    default: 'true'
  - name: description_text
    type: STRING(500)
    domain: free_text
    desc: What the template covers.
    sens: Internal
    'null': true
    null_why: NULL = no description
  constraints:
  - name: uq_onboarding_plan_template_id_organisation_id
    type: unique
    columns:
    - id
    - organisation_id
    desc: Target of a composite FK (tenant/parent consistency, D-11/D-19).
  indexes:
  - name: uq_onboarding_plan_template_organisation_id_name
    columns:
    - organisation_id
    - name
    unique: true
    where: deleted_at IS NULL
    desc: Natural key ['organisation_id', 'name'] among live rows.
  - name: idx_onboarding_plan_template_employment_type_id
    columns:
    - employment_type_id
    desc: FK support index for employment_type_id.
  fks:
  - name: fk_onboarding_plan_template_organisation_id
    columns:
    - organisation_id
    ref: organisation
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: organisation_id -> organisation; delete rule CASCADE.
  - name: fk_onboarding_plan_template_employment_type_id
    columns:
    - employment_type_id
    ref: employment_type
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: employment_type_id -> employment_type; delete rule RESTRICT.
- name: onboarding_plan_template_task
  kind: entity
  delete_policy: hard
  volume: medium
  tier: X
  milestones: []
  retention: Deleted with the template; templates are configuration.
  description: One checklist item inside a template; copied into onboarding_plan_task when a plan is instantiated.
  columns:
  - name: onboarding_plan_template_id
    type: UUID
    domain: identifier
    desc: Parent template.
    sens: Internal
  - name: sequence_no
    type: INT2
    domain: quantity
    desc: Order of the task inside the template (1-based).
    sens: Internal
  - name: title
    type: STRING(200)
    domain: free_text
    desc: Task title shown to the owner.
    sens: Internal
  - name: onboarding_task_type_id
    type: UUID
    domain: enum_ref
    desc: Kind of task (reuses the jobs_applications lookup).
    sens: Internal
  - name: onboarding_assignee_role_id
    type: UUID
    domain: enum_ref
    desc: Function that normally owns the task.
    sens: Internal
  - name: due_offset_days
    type: INT2
    domain: quantity
    desc: Due date relative to the joining date; negative = before joining.
    sens: Internal
  - name: is_required
    type: BOOL
    domain: boolean
    desc: true = plan cannot complete without it.
    sens: Internal
    default: 'true'
  - name: document_type_id
    type: UUID
    domain: enum_ref
    desc: Document the joiner must upload for this task.
    sens: Internal
    'null': true
    null_why: NULL = task needs no document
  constraints:
  - name: uq_onboarding_plan_template_task_onboarding_plan_template_id_sequence_no
    type: unique
    columns:
    - onboarding_plan_template_id
    - sequence_no
    desc: Natural key ['onboarding_plan_template_id', 'sequence_no'].
  - name: ck_onboarding_plan_template_task_seq_positive
    type: check
    expr: sequence_no >= 1
    desc: Rule seq_positive.
  - name: ck_onboarding_plan_template_task_due_offset_range
    type: check
    expr: due_offset_days BETWEEN -365 AND 365
    desc: Rule due_offset_range.
  indexes:
  - name: idx_onboarding_plan_template_task_onboarding_task_type_id
    columns:
    - onboarding_task_type_id
    desc: FK support index for onboarding_task_type_id.
  - name: idx_onboarding_plan_template_task_onboarding_assignee_role_id
    columns:
    - onboarding_assignee_role_id
    desc: FK support index for onboarding_assignee_role_id.
  - name: idx_onboarding_plan_template_task_document_type_id
    columns:
    - document_type_id
    desc: FK support index for document_type_id.
  fks:
  - name: fk_onboarding_plan_template_task_onboarding_plan_template_id
    columns:
    - onboarding_plan_template_id
    ref: onboarding_plan_template
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: onboarding_plan_template_id -> onboarding_plan_template; delete rule CASCADE.
  - name: fk_onboarding_plan_template_task_onboarding_task_type_id
    columns:
    - onboarding_task_type_id
    ref: onboarding_task_type
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: onboarding_task_type_id -> onboarding_task_type; delete rule RESTRICT.
  - name: fk_onboarding_plan_template_task_onboarding_assignee_role_id
    columns:
    - onboarding_assignee_role_id
    ref: onboarding_assignee_role
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: onboarding_assignee_role_id -> onboarding_assignee_role; delete rule RESTRICT.
  - name: fk_onboarding_plan_template_task_document_type_id
    columns:
    - document_type_id
    ref: document_type
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: document_type_id -> document_type; delete rule RESTRICT.
- name: onboarding_plan
  kind: entity
  delete_policy: soft
  volume: medium
  tier: X
  milestones: []
  retention: Kept while the employment/engagement exists plus 7 years for HR audit; personal fields anonymised on erasure request after statutory retention.
  description: Per-joiner onboarding plan created after offer acceptance/joining record (Greenhouse Onboarding 'new hire', Workday onboarding event). Distinct from the flat jobs_applications.onboarding_task
    checklist, which it supersedes for employers that opt in.
  columns:
  - name: organisation_id
    type: UUID
    domain: identifier
    desc: Tenant owning the plan (equals the joining's organisation).
    sens: Internal
  - name: joining_id
    type: UUID
    domain: identifier
    desc: Joining outcome this plan belongs to; one plan per joining.
    sens: Internal
  - name: candidate_profile_id
    type: UUID
    domain: identifier
    desc: The joiner.
    sens: Internal
  - name: onboarding_plan_template_id
    type: UUID
    domain: identifier
    desc: Template used; kept for traceability.
    sens: Internal
    'null': true
    null_why: NULL = plan built ad hoc
  - name: onboarding_plan_status_id
    type: UUID
    domain: enum_ref
    desc: Plan lifecycle state.
    sens: Internal
  - name: hiring_manager_app_user_id
    type: UUID
    domain: identifier
    desc: Manager of the joiner.
    sens: Internal
    'null': true
    null_why: NULL = not yet assigned
  - name: buddy_app_user_id
    type: UUID
    domain: identifier
    desc: Onboarding buddy.
    sens: Internal
    'null': true
    null_why: NULL = no buddy
  - name: plan_start_date
    type: DATE
    domain: date
    desc: First day tasks become visible.
    sens: Internal
  - name: plan_end_date
    type: DATE
    domain: date
    desc: Target completion (typically end of probation window).
    sens: Internal
    'null': true
    null_why: NULL = open-ended
  - name: completion_percent
    type: DECIMAL(5,2)
    domain: percentage
    desc: Share of required tasks completed, maintained by the task-completion transaction.
    sens: Internal
    default: '0'
  - name: completed_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: When the last required task completed.
    sens: Internal
    'null': true
    null_why: NULL = not yet complete
  constraints:
  - name: uq_onboarding_plan_id_organisation_id
    type: unique
    columns:
    - id
    - organisation_id
    desc: Target of a composite FK (tenant/parent consistency, D-11/D-19).
  - name: ck_onboarding_plan_completion_percent_range
    type: check
    expr: completion_percent IS NULL OR (completion_percent >= 0 AND completion_percent <= 100)
    desc: Percentage 0..100.
  - name: ck_onboarding_plan_dates
    type: check
    expr: plan_end_date IS NULL OR plan_end_date >= plan_start_date
    desc: Rule dates.
  indexes:
  - name: uq_onboarding_plan_joining_id
    columns:
    - joining_id
    unique: true
    where: deleted_at IS NULL
    desc: Natural key ['joining_id'] among live rows.
  - name: idx_onboarding_plan_organisation_id_onboarding_plan_status_id
    columns:
    - organisation_id
    - onboarding_plan_status_id
    desc: Access path on organisation_id, onboarding_plan_status_id.
  - name: idx_onboarding_plan_candidate_profile_id
    columns:
    - candidate_profile_id
    desc: Access path on candidate_profile_id.
  - name: idx_onboarding_plan_onboarding_plan_template_id
    columns:
    - onboarding_plan_template_id
    desc: FK support index for onboarding_plan_template_id.
  - name: idx_onboarding_plan_onboarding_plan_status_id
    columns:
    - onboarding_plan_status_id
    desc: FK support index for onboarding_plan_status_id.
  - name: idx_onboarding_plan_hiring_manager_app_user_id
    columns:
    - hiring_manager_app_user_id
    desc: FK support index for hiring_manager_app_user_id.
  - name: idx_onboarding_plan_buddy_app_user_id
    columns:
    - buddy_app_user_id
    desc: FK support index for buddy_app_user_id.
  fks:
  - name: fk_onboarding_plan_joining_id
    columns:
    - joining_id
    ref: joining
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: joining_id -> joining; delete rule RESTRICT.
  - name: fk_onboarding_plan_candidate_profile_id
    columns:
    - candidate_profile_id
    ref: candidate_profile
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: candidate_profile_id -> candidate_profile; delete rule RESTRICT.
  - name: fk_onboarding_plan_onboarding_plan_template_id
    columns:
    - onboarding_plan_template_id
    ref: onboarding_plan_template
    ref_columns:
    - id
    on_delete: SET NULL
    on_update: RESTRICT
    desc: onboarding_plan_template_id -> onboarding_plan_template; delete rule SET NULL.
  - name: fk_onboarding_plan_onboarding_plan_status_id
    columns:
    - onboarding_plan_status_id
    ref: onboarding_plan_status
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: onboarding_plan_status_id -> onboarding_plan_status; delete rule RESTRICT.
  - name: fk_onboarding_plan_hiring_manager_app_user_id
