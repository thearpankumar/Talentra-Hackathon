  - name: place_type_id
    type: UUID
    domain: enum_ref
    sens: Public
    desc: Settlement class.
    'null': false
  - name: time_zone_id
    type: UUID
    domain: identifier
    sens: Public
    desc: Time zone of the place.
    'null': true
    null_why: NULL = inherit the country default time zone.
  - name: geo_source_id
    type: UUID
    domain: enum_ref
    sens: Public
    desc: Stated source of the coordinates.
    'null': true
    null_why: NULL when the city has no coordinates yet.
  - name: display_name
    type: STRING(150)
    domain: free_text
    sens: Public
    desc: Name as shown in English.
    'null': false
  - name: ascii_name
    type: STRING(150)
    domain: free_text
    sens: Public
    desc: Transliterated ASCII name for search and sorting.
    'null': false
  - name: native_name
    type: STRING(150)
    domain: free_text
    sens: Public
    desc: Local-script name.
    'null': true
    null_why: NULL = same as display_name.
  - name: name_search
    type: STRING(150)
    domain: free_text
    sens: Public
    desc: Lower-cased ascii_name, STORED computed for prefix and trigram search.
    'null': false
    computed: lower(ascii_name)
    stored: true
  - name: geoname_ref
    type: STRING(20)
    domain: code
    sens: Public
