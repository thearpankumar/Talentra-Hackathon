tables:
- name: time_zone
  kind: config
  delete_policy: hard
  volume: low
  tier: '1'
  milestones:
  - B2
  - B12
  retention: 'Reference data: retired via is_active, never deleted; changes audited via created/updated columns; no personal data.'
  description: IANA time zone catalogue used for display (store timestamps in UTC, show in zone).
  columns:
  - name: iana_name
    type: STRING(64)
    domain: time_zone
    sens: Public
    desc: IANA tz database name, e.g. Asia/Kolkata.
    'null': false
  - name: display_name
    type: STRING(100)
    domain: free_text
    sens: Public
    desc: English display label, e.g. India Standard Time.
    'null': false
  - name: standard_utc_offset_minutes
    type: INT4
    domain: quantity
    sens: Public
    desc: Standard (non-DST) offset from UTC in minutes, e.g. 330.
    'null': false
  - name: observes_dst
    type: BOOL
    domain: boolean
    sens: Public
    desc: True when the zone shifts for daylight saving time.
    'null': false
    default: 'false'
  - name: is_active
    type: BOOL
    domain: boolean
    sens: Public
    desc: False = retired/aliased zone, kept for old rows.
    'null': false
    default: 'true'
  constraints:
  - name: uq_time_zone_iana_name
    type: unique
    columns:
    - iana_name
    desc: Natural key.
  - name: ck_time_zone_offset_range
    type: check
    expr: standard_utc_offset_minutes BETWEEN -720 AND 840
    desc: Real-world UTC offsets.
  - name: ck_time_zone_iana_format
    type: check
    expr: iana_name ~ '^[A-Za-z0-9_+/-]{1,64}$'
    desc: IANA identifier characters only.
- name: currency
  kind: config
  delete_policy: hard
  volume: low
  tier: '1'
  milestones:
  - B2
  - B12
  - B14
  retention: 'Reference data: retired via is_active, never deleted; changes audited via created/updated columns; no personal data.'
  description: ISO 4217 currency; minor_unit drives rounding of every money column system-wide.
  columns:
  - name: currency_code
    type: STRING(3)
    domain: currency_code
    sens: Public
    desc: ISO 4217 alphabetic code, e.g. INR.
    'null': false
  - name: iso_numeric
    type: STRING(3)
    domain: free_text
    sens: Public
    desc: ISO 4217 numeric code, e.g. 356.
    'null': false
  - name: display_name
    type: STRING(100)
    domain: free_text
    sens: Public
    desc: English currency name.
    'null': false
  - name: name_i18n
    type: JSONB
    domain: json
    sens: Public
    desc: 'Display name per UI language {language_tag: text}; must contain ''en''; fallback chain applied by the application.'
    'null': false
  - name: symbol
    type: STRING(8)
    domain: free_text
    sens: Public
    desc: Display symbol, e.g. the rupee sign.
    'null': false
  - name: minor_unit
    type: INT2
    domain: quantity
    sens: Public
    desc: 'ISO 4217 minor-unit exponent: digits after the decimal point (JPY 0, INR 2, KWD 3).'
    'null': false
  - name: is_billable
    type: BOOL
    domain: boolean
    sens: Public
    desc: True when invoices and wallet balances may be denominated in this currency.
    'null': false
    default: 'false'
  - name: is_active
    type: BOOL
    domain: boolean
    sens: Public
    desc: False = retired currency (e.g. replaced by euro), kept for history.
    'null': false
    default: 'true'
  constraints:
  - name: uq_currency_currency_code
    type: unique
    columns:
    - currency_code
    desc: Natural key.
  - name: uq_currency_iso_numeric
    type: unique
    columns:
    - iso_numeric
    desc: ISO numeric is unique.
  - name: ck_currency_code_format
    type: check
    expr: currency_code ~ '^[A-Z]{3}$'
    desc: Three upper-case letters.
  - name: ck_currency_numeric_format
    type: check
    expr: iso_numeric ~ '^[0-9]{3}$'
    desc: Three digits.
  - name: ck_currency_minor_unit_range
    type: check
    expr: minor_unit BETWEEN 0 AND 4
    desc: ISO 4217 exponent 0-4.
  - name: ck_currency_name_i18n_en
    type: check
    expr: name_i18n ? 'en'
    desc: Default language present.
- name: language
  kind: config
  delete_policy: hard
  volume: low
  tier: '1'
  milestones:
  - B2
  - B12
  retention: 'Reference data: retired via is_active, never deleted; changes audited via created/updated columns; no personal data.'
  description: 'Languages known to the platform: UI languages, resume/content languages, proficiency languages. Drives i18n fallback.'
  columns:
  - name: language_tag
    type: STRING(35)
    domain: language_tag
    sens: Public
    desc: BCP 47 tag, e.g. en, hi, pt-BR; primary key of the i18n system.
    'null': false
  - name: iso639_1
    type: STRING(2)
    domain: free_text
    sens: Public
    desc: ISO 639-1 code.
    'null': true
    null_why: NULL = language has no ISO 639-1 two-letter code (only 639-3).
  - name: iso639_3
    type: STRING(3)
    domain: free_text
    sens: Public
    desc: ISO 639-3 three-letter code.
    'null': false
  - name: display_name
    type: STRING(100)
    domain: free_text
    sens: Public
    desc: English name of the language.
    'null': false
  - name: native_name
    type: STRING(100)
    domain: free_text
    sens: Public
    desc: Name in the language itself (autonym), e.g. Hindi in Devanagari.
    'null': false
  - name: script_code
    type: STRING(4)
    domain: free_text
    sens: Public
    desc: ISO 15924 script, e.g. Latn, Deva, Arab.
    'null': false
  - name: text_direction_id
    type: UUID
    domain: enum_ref
    sens: Public
    desc: Writing direction (ltr/rtl) for layout mirroring.
    'null': false
  - name: fallback_language_id
    type: UUID
    domain: identifier
    sens: Public
    desc: Next language to try when a translation is missing; chain ends at the default language (en).
    'null': true
    null_why: NULL only for the default language (end of fallback chain).
  - name: is_ui_supported
    type: BOOL
    domain: boolean
    sens: Public
    desc: True when the UI is translated into this language (selectable in preferences).
    'null': false
    default: 'false'
  - name: is_default
    type: BOOL
    domain: boolean
    sens: Public
    desc: True for the single platform default language (en); end of every fallback chain.
    'null': false
    default: 'false'
  - name: is_content_supported
    type: BOOL
    domain: boolean
    sens: Public
    desc: True when users may tag resumes/job text with this language.
    'null': false
    default: 'true'
  - name: sort_order
    type: INT4
    domain: quantity
    sens: Public
    desc: Display order in language pickers.
    'null': false
    default: '0'
  - name: is_active
    type: BOOL
    domain: boolean
    sens: Public
    desc: False = retired language, kept for history.
    'null': false
    default: 'true'
  constraints:
  - name: uq_language_language_tag
    type: unique
    columns:
    - language_tag
    desc: Natural key.
  - name: ck_language_tag_format
    type: check
    expr: language_tag ~ '^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$'
    desc: BCP 47 shape.
  - name: ck_language_fallback_not_self
    type: check
    expr: fallback_language_id IS NULL OR fallback_language_id <> id
    desc: A language cannot fall back to itself.
  - name: ck_language_default_is_root
    type: check
    expr: NOT is_default OR (is_ui_supported AND fallback_language_id IS NULL)
    desc: Default language is UI-supported and terminates the chain.
  - name: ck_language_nondefault_has_fallback
    type: check
    expr: is_default OR fallback_language_id IS NOT NULL
    desc: Every non-default language declares a fallback, so the chain always reaches the default.
  indexes:
  - name: uq_language_is_default
    columns:
    - is_default
    desc: Exactly one default language (partial unique).
    unique: true
    where: is_default
  - name: idx_language_is_ui_supported_sort_order
    columns:
    - is_ui_supported
    - sort_order
    desc: UI language picker.
    where: is_ui_supported AND is_active
  - name: idx_language_text_direction_id
    columns:
    - text_direction_id
    desc: Supports FK fk_language_text_direction_id (join and delete checks).
  - name: idx_language_fallback_language_id
    columns:
    - fallback_language_id
    desc: Supports FK fk_language_fallback_language_id (join and delete checks).
  fks:
  - name: fk_language_text_direction_id
    columns:
    - text_direction_id
    ref: text_direction
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Writing direction (ltr/rtl) for layout mirroring.
  - name: fk_language_fallback_language_id
    columns:
    - fallback_language_id
    ref: language
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Next language to try when a translation is missing; chain ends at the default language (en).
- name: country
  kind: config
  delete_policy: hard
  volume: low
  tier: '1'
  milestones:
  - B2
  - B12
  - B25
  retention: 'Reference data: retired via is_active, never deleted; changes audited via created/updated columns; no personal data.'
  description: ISO 3166-1 country with telephony, currency, language, privacy-regime and operating-market flags.
  columns:
  - name: iso2_code
    type: STRING(2)
    domain: code
    sens: Public
    desc: ISO 3166-1 alpha-2, e.g. IN.
    'null': false
  - name: iso3_code
    type: STRING(3)
    domain: code
    sens: Public
    desc: ISO 3166-1 alpha-3, e.g. IND.
    'null': false
  - name: iso_numeric_code
    type: STRING(3)
    domain: code
    sens: Public
    desc: ISO 3166-1 numeric, e.g. 356.
    'null': false
  - name: display_name
    type: STRING(100)
    domain: free_text
    sens: Public
    desc: English short name.
    'null': false
  - name: native_name
    type: STRING(100)
    domain: free_text
    sens: Public
    desc: Official/native name; may use non-Latin script.
    'null': false
  - name: name_i18n
    type: JSONB
    domain: json
    sens: Public
    desc: 'Display name per UI language {language_tag: text}; must contain ''en''; fallback chain applied by the application.'
    'null': false
  - name: calling_code
    type: STRING(6)
    domain: code
    sens: Public
    desc: International dialling prefix digits without plus, e.g. 91 (shared codes such as 1 allowed).
    'null': false
  - name: continent_code
    type: STRING(2)
    domain: free_text
    sens: Public
    desc: Continent code AF, AN, AS, EU, NA, OC, SA.
    'null': false
  - name: postal_code_regex
    type: STRING(200)
    domain: free_text
    sens: Public
    desc: Regex a postal code must match.
    'null': true
    null_why: NULL = country has no postal codes or format not curated.
  - name: is_eea
    type: BOOL
    domain: boolean
    sens: Public
    desc: True for EU/EEA/UK-style GDPR jurisdictions (drives consent defaults).
    'null': false
    default: 'false'
  - name: is_operating_market
    type: BOOL
    domain: boolean
    sens: Public
    desc: True when employers/candidates may register in this country.
    'null': false
    default: 'false'
  - name: centroid_latitude
    type: DECIMAL(9,6)
    domain: latitude
    sens: Public
    desc: Country centroid latitude (WGS84, 6 decimals ~ 0.1 m).
    'null': true
    null_why: NULL = centroid not curated.
  - name: centroid_longitude
    type: DECIMAL(9,6)
    domain: longitude
    sens: Public
    desc: Country centroid longitude (WGS84).
    'null': true
    null_why: NULL = centroid not curated.
  - name: geo_source_id
    type: UUID
    domain: enum_ref
    sens: Public
    desc: Source of the centroid coordinates.
    'null': true
    null_why: NULL when no centroid stored.
  - name: default_currency_id
    type: UUID
    domain: identifier
    sens: Public
    desc: Currency pre-selected for this country.
    'null': false
  - name: default_language_id
    type: UUID
    domain: identifier
    sens: Public
    desc: Language pre-selected for this country.
    'null': true
    null_why: NULL where no single dominant language is configured.
  - name: default_time_zone_id
    type: UUID
    domain: identifier
    sens: Public
    desc: Time zone pre-selected; countries with several zones keep the capital's.
    'null': true
    null_why: NULL if country spans many zones with no capital default.
  - name: is_active
    type: BOOL
    domain: boolean
    sens: Public
    desc: False = retired (e.g. dissolved country), kept for history.
    'null': false
    default: 'true'
  constraints:
  - name: uq_country_iso2_code
    type: unique
    columns:
    - iso2_code
    desc: ISO alpha-2 natural key.
  - name: uq_country_iso3_code
    type: unique
    columns:
    - iso3_code
    desc: ISO alpha-3 natural key.
  - name: uq_country_iso_numeric_code
    type: unique
    columns:
    - iso_numeric_code
    desc: ISO numeric natural key.
  - name: ck_country_iso2_format
    type: check
    expr: iso2_code ~ '^[A-Z]{2}$'
    desc: Two upper-case letters.
  - name: ck_country_iso3_format
    type: check
    expr: iso3_code ~ '^[A-Z]{3}$'
    desc: Three upper-case letters.
  - name: ck_country_calling_code_format
    type: check
    expr: calling_code ~ '^[1-9][0-9]{0,5}$'
    desc: E.164 country calling code digits.
  - name: ck_country_centroid_latitude_range
    type: check
    expr: centroid_latitude IS NULL OR centroid_latitude BETWEEN -90 AND 90
    desc: Latitude range.
  - name: ck_country_centroid_longitude_range
    type: check
    expr: centroid_longitude IS NULL OR centroid_longitude BETWEEN -180 AND 180
    desc: Longitude range.
  - name: ck_country_centroid_pair
    type: check
    expr: (centroid_latitude IS NULL) = (centroid_longitude IS NULL)
    desc: Both or neither coordinate.
  - name: ck_country_name_i18n_en
    type: check
    expr: name_i18n ? 'en'
    desc: Default language present.
  indexes:
  - name: idx_country_calling_code
    columns:
    - calling_code
    desc: 'Phone input: find countries by dialling prefix.'
  - name: idx_country_display_name
    columns:
    - display_name
    desc: Alphabetical country picker.
    where: is_active
  - name: idx_country_is_operating_market_display_name
    columns:
    - is_operating_market
    - display_name
    desc: Operating-market picker.
    where: is_operating_market
  - name: idx_country_geo_source_id
    columns:
    - geo_source_id
    desc: Supports FK fk_country_geo_source_id (join and delete checks).
  - name: idx_country_default_currency_id
    columns:
    - default_currency_id
    desc: Supports FK fk_country_default_currency_id (join and delete checks).
  - name: idx_country_default_language_id
    columns:
    - default_language_id
    desc: Supports FK fk_country_default_language_id (join and delete checks).
  - name: idx_country_default_time_zone_id
    columns:
    - default_time_zone_id
    desc: Supports FK fk_country_default_time_zone_id (join and delete checks).
  fks:
  - name: fk_country_geo_source_id
    columns:
    - geo_source_id
    ref: geo_source
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Source of the centroid coordinates.
  - name: fk_country_default_currency_id
    columns:
    - default_currency_id
    ref: currency
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Currency pre-selected for this country.
  - name: fk_country_default_language_id
    columns:
    - default_language_id
    ref: language
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Language pre-selected for this country.
  - name: fk_country_default_time_zone_id
    columns:
    - default_time_zone_id
    ref: time_zone
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Time zone pre-selected; countries with several zones keep the capital's.
