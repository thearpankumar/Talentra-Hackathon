  - B2
  - B12
  retention: 'Reference data: retired via is_active, never deleted; changes audited via created/updated columns; no personal data.'
  description: Hierarchical grouping of skills (e.g. IT > Databases); depth-limited tree.
  columns:
  - name: parent_skill_category_id
    type: UUID
    domain: identifier
    sens: Public
    desc: Parent node.
    'null': true
    null_why: NULL = root category.
  - name: slug
    type: STRING(100)
    domain: code
    sens: Public
    desc: Stable URL-safe identifier.
    'null': false
  - name: display_name
    type: STRING(150)
    domain: free_text
    sens: Public
    desc: English name.
    'null': false
  - name: name_i18n
    type: JSONB
    domain: json
    sens: Public
    desc: 'Display name per UI language {language_tag: text}; must contain ''en''; fallback chain applied by the application.'
    'null': false
  - name: depth
    type: INT2
    domain: quantity
    sens: Public
    desc: Tree depth, root = 1 (max 4).
    'null': false
  - name: sort_order
    type: INT4
    domain: quantity
    sens: Public
    desc: Order among siblings.
    'null': false
    default: '0'
  - name: is_active
    type: BOOL
    domain: boolean
    sens: Public
    desc: False = retired.
    'null': false
    default: 'true'
  constraints:
  - name: uq_skill_category_slug
    type: unique
    columns:
    - slug
    desc: Natural key.
  - name: ck_skill_category_depth_range
    type: check
    expr: depth BETWEEN 1 AND 4
    desc: Depth limit keeps tree browsable.
  - name: ck_skill_category_parent_not_self
    type: check
    expr: parent_skill_category_id IS NULL OR parent_skill_category_id <> id
    desc: No self-parent.
  - name: ck_skill_category_root_depth
    type: check
    expr: (parent_skill_category_id IS NULL) = (depth = 1)
    desc: Depth 1 iff root.
  - name: ck_skill_category_name_i18n_en
    type: check
    expr: name_i18n ? 'en'
    desc: Default language present.
  indexes:
  - name: idx_skill_category_parent_skill_category_id_sort_order
    columns:
    - parent_skill_category_id
    - sort_order
    desc: Children listing.
  fks:
  - name: fk_skill_category_parent_skill_category_id
    columns:
    - parent_skill_category_id
    ref: skill_category
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Parent node.
- name: skill
  kind: entity
  delete_policy: hard
  volume: medium
  tier: '1'
  milestones:
  - B2
  - B4
  - B12
  - B14
  retention: 'Reference data: retired via is_active, never deleted; changes audited via created/updated columns; no personal data.'
  description: Canonical skill entity (LinkedIn Skills Graph / Naukri key-skills style); free-text skills are mapped to it.
  columns:
  - name: skill_category_id
    type: UUID
    domain: identifier
    sens: Public
    desc: Primary category.
    'null': false
  - name: skill_type_id
    type: UUID
    domain: enum_ref
    sens: Public
    desc: Technical/soft/tool classification.
    'null': false
  - name: skill_taxonomy_source_id
    type: UUID
    domain: enum_ref
    sens: Public
    desc: Origin of the entry.
    'null': false
  - name: merged_into_skill_id
    type: UUID
    domain: identifier
    sens: Public
    desc: Survivor when this skill was de-duplicated; readers follow the pointer.
    'null': true
    null_why: NULL = skill not merged.
  - name: slug
    type: STRING(100)
    domain: code
    sens: Public
    desc: Stable URL-safe identifier.
    'null': false
  - name: canonical_name
    type: STRING(150)
    domain: free_text
    sens: Public
    desc: Preferred English display name, e.g. PostgreSQL.
    'null': false
  - name: canonical_name_lower
    type: STRING(150)
    domain: free_text
    sens: Public
    desc: Lower-cased canonical_name; case-insensitive uniqueness and typeahead.
    'null': false
    computed: lower(canonical_name)
    stored: true
  - name: name_i18n
    type: JSONB
    domain: json
    sens: Public
    desc: 'Display name per UI language {language_tag: text}; must contain ''en''; fallback chain applied by the application.'
    'null': false
  - name: description
    type: STRING(500)
    domain: free_text
    sens: Public
    desc: Short definition shown in tooltips.
    'null': true
    null_why: NULL = no description curated.
  - name: external_taxonomy_ref
    type: STRING(100)
    domain: code
    sens: Public
    desc: Id/URI in the external taxonomy (ESCO URI, O*NET code).
    'null': true
    null_why: NULL = internal skill with no external mapping.
  - name: is_assessable
    type: BOOL
    domain: boolean
    sens: Public
    desc: True when a skill test exists (Naukri/LinkedIn skill assessments).
    'null': false
    default: 'false'
  - name: is_active
    type: BOOL
    domain: boolean
    sens: Public
    desc: False = retired from pickers; kept for history.
    'null': false
    default: 'true'
  constraints:
  - name: uq_skill_slug
    type: unique
    columns:
    - slug
    desc: Natural key.
  - name: uq_skill_canonical_name_lower
    type: unique
    columns:
    - canonical_name_lower
    desc: One canonical skill per case-insensitive name.
  - name: ck_skill_merge_not_self
    type: check
    expr: merged_into_skill_id IS NULL OR merged_into_skill_id <> id
    desc: No self-merge.
  - name: ck_skill_merged_inactive
    type: check
    expr: merged_into_skill_id IS NULL OR NOT is_active
    desc: A merged skill is inactive.
  - name: ck_skill_name_i18n_en
    type: check
    expr: name_i18n ? 'en'
    desc: Default language present.
  indexes:
  - name: idx_skill_canonical_name_lower
    columns:
    - canonical_name_lower
    desc: Trigram GIN for skill typeahead/fuzzy match.
    inverted: true
    opclass: gin_trgm_ops
  - name: idx_skill_skill_category_id_canonical_name_lower
    columns:
    - skill_category_id
    - canonical_name_lower
    desc: Browse skills by category.
    where: is_active
  - name: uq_skill_external_taxonomy_ref
    columns:
    - external_taxonomy_ref
    desc: External taxonomy join, unique when present.
    unique: true
    where: external_taxonomy_ref IS NOT NULL
  - name: idx_skill_skill_type_id
    columns:
    - skill_type_id
    desc: Supports FK fk_skill_skill_type_id (join and delete checks).
  - name: idx_skill_skill_taxonomy_source_id
    columns:
    - skill_taxonomy_source_id
    desc: Supports FK fk_skill_skill_taxonomy_source_id (join and delete checks).
  - name: idx_skill_merged_into_skill_id
    columns:
    - merged_into_skill_id
    desc: Supports FK fk_skill_merged_into_skill_id (join and delete checks).
  fks:
  - name: fk_skill_skill_category_id
    columns:
    - skill_category_id
    ref: skill_category
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Primary category.
  - name: fk_skill_skill_type_id
    columns:
    - skill_type_id
    ref: skill_type
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Technical/soft/tool classification.
  - name: fk_skill_skill_taxonomy_source_id
    columns:
    - skill_taxonomy_source_id
    ref: skill_taxonomy_source
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Origin of the entry.
  - name: fk_skill_merged_into_skill_id
    columns:
    - merged_into_skill_id
    ref: skill
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Survivor when this skill was de-duplicated; readers follow the pointer.
