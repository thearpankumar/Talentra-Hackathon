  - name: ck_city_latitude_range
    type: check
    expr: latitude IS NULL OR latitude BETWEEN -90 AND 90
    desc: Latitude range.
  - name: ck_city_longitude_range
    type: check
    expr: longitude IS NULL OR longitude BETWEEN -180 AND 180
    desc: Longitude range.
  - name: ck_city_coordinate_pair
    type: check
    expr: (latitude IS NULL) = (longitude IS NULL)
    desc: Both or neither coordinate.
  - name: ck_city_geo_source_when_coordinates
    type: check
    expr: latitude IS NULL OR geo_source_id IS NOT NULL
    desc: Stated source required whenever coordinates exist.
  - name: ck_city_tier_range
    type: check
    expr: city_tier IS NULL OR city_tier BETWEEN 1 AND 3
    desc: Tier 1-3.
  - name: ck_city_population_nonneg
    type: check
    expr: population IS NULL OR population >= 0
    desc: Population non-negative.
  indexes:
  - name: uq_city_country_id_ascii_name
    columns:
    - country_id
    - ascii_name
    desc: No duplicate state-less city per country.
    unique: true
    where: state_region_id IS NULL
  - name: uq_city_geoname_ref
    columns:
    - geoname_ref
    desc: GeoNames id unique when present.
    unique: true
    where: geoname_ref IS NOT NULL
