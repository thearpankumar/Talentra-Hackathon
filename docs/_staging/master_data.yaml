  - name: population
    type: INT8
    domain: quantity
    sens: Public
    desc: Population estimate for ranking suggestions.
    'null': true
    null_why: NULL = unknown (not zero).
  - name: latitude
    type: DECIMAL(9,6)
    domain: latitude
    sens: Public
    desc: City centre latitude (WGS84, 6 decimals).
    'null': true
    null_why: NULL = coordinates not known.
  - name: longitude
    type: DECIMAL(9,6)
    domain: longitude
    sens: Public
    desc: City centre longitude (WGS84, 6 decimals).
    'null': true
    null_why: NULL = coordinates not known.
  - name: city_tier
    type: INT2
    domain: quantity
