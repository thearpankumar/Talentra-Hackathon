    on_update: RESTRICT
    desc: Translated label.
  - name: fk_ui_label_translation_language_id
    columns:
    - language_id
    ref: language
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Target language.
  - name: fk_ui_label_translation_translation_status_id
    columns:
    - translation_status_id
    ref: translation_status
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Workflow state.
business_rules:
- id: BR-MST-01
  rule: Every enumeration is a lookup table with code, name_i18n, sort_order, is_active; no CHECK-IN lists or free-text enums.
  mechanism_type: FK
  mechanism: Consumers declare `<lookup>_id UUID NOT NULL REFERENCES <lookup>(id) ON DELETE RESTRICT`; lookup unique(code) + CHECK code ~ '^[a-z0-9_]+$'.
  tables:
  - employment_type
  - work_type
  - gender
  - proficiency_level
  milestone: B12
- id: BR-MST-02
  rule: 'Reference rows are retired, never deleted: history keeps resolving.'
  mechanism_type: FK
  mechanism: All FKs to master tables are ON DELETE RESTRICT; the application role has no DELETE grant on master tables (GRANT SELECT, INSERT, UPDATE only); retirement = is_active=false. Pickers use partial
    indexes WHERE is_active.
  tables:
  - country
  - city
  - skill
  - job_role
  - qualification
  - industry
  milestone: B20
- id: BR-MST-03
  rule: Names are unique case-insensitively where a canonical row exists, so typeahead and parsing are deterministic.
  mechanism_type: UNIQUE
  mechanism: STORED computed column lower(name) + UNIQUE constraint (skill.canonical_name_lower, job_role.canonical_name_lower, institution (country_id,name_search), employer_name_canonical (country_id,name_search)
    + partial unique WHERE country_id IS NULL); alias tables UNIQUE (language_id, alias_lower).
  tables:
  - skill
  - job_role
  - institution
  - employer_name_canonical
  - skill_alias
  - job_role_alias
  milestone: B20
- id: BR-MST-04
  rule: 'i18n fallback always terminates at the default language: requested -> language.fallback_language_id chain -> en -> ui_label.source_text.'
  mechanism_type: CHECK
  mechanism: 'language: CHECK (is_default OR fallback_language_id IS NOT NULL), CHECK (NOT is_default OR (is_ui_supported AND fallback_language_id IS NULL)), CHECK (fallback_language_id <> id), partial
    UNIQUE INDEX on (is_default) WHERE is_default (exactly one default). Longer cycles (a->b->a) are rejected by the admin transaction that walks the chain (recursive CTE) before COMMIT and re-verified
    by a nightly JOB.'
  tables:
  - language
  milestone: B20
- id: BR-MST-05
  rule: One translation per UI label and language; labels have a default-language source text.
  mechanism_type: UNIQUE
  mechanism: UNIQUE (ui_label_id, language_id) on ui_label_translation; ui_label.source_text NOT NULL; ui_label_translation FK to language and ui_label (ON DELETE CASCADE from label). Coverage JOB flags
    missing/outdated rows via translation_status.
  tables:
  - ui_label
  - ui_label_translation
  milestone: B20
- id: BR-MST-06
  rule: Lookup and master display names must contain the default language en.
  mechanism_type: CHECK
  mechanism: CHECK (name_i18n ? 'en') on every lookup and on rich masters carrying name_i18n (JSONB key-exists operator supported by CockroachDB).
  tables:
  - country
  - skill
  - industry
  - job_category
  milestone: B20
- id: BR-MST-07
  rule: Tax identifier types define a validation regex and length range per country; values are validated before storage; individual identifiers are always Sensitive.
  mechanism_type: CHECK
  mechanism: tax_id_type UNIQUE (country_id, code); CHECK (min_length <= max_length AND min_length > 0); CHECK (NOT is_individual_identifier OR is_sensitive). Consumers validate value ~ validation_regex
    and checksum (tax_id_checksum) in the write path, store ciphertext/token + HMAC blind index only.
  tables:
  - tax_id_type
  milestone: B31
- id: BR-MST-08
  rule: 'No sentinel values: unknown is NULL with a stated meaning, never 0/''''/''NA''/''unknown''.'
  mechanism_type: CHECK
  mechanism: Nullable columns carry null_why in this dictionary; no lookup contains an 'unknown' or 'n/a' value (use NULL FK or an explicit not_applicable code where the module defines one); city.population/city_tier/institution.established_year
    are NULL when unknown, with CHECK ranges that reject 0 sentinels (population >= 0 with NULL=unknown; tier 1..3).
  tables:
  - city
  - institution
  - country
  milestone: B20
- id: BR-MST-09
  rule: Coordinates always state their source and come as a complete pair.
  mechanism_type: CHECK
  mechanism: CHECK ranges (lat -90..90, lon -180..180), CHECK ((latitude IS NULL) = (longitude IS NULL)), CHECK (latitude IS NULL OR geo_source_id IS NOT NULL) with FK geo_source_id -> geo_source.
  tables:
  - country
  - city
  - locality
  - postal_code
  milestone: B20
- id: BR-MST-10
  rule: A city's state belongs to the same country as the city.
  mechanism_type: FK
  mechanism: 'UNIQUE (country_id, id) on state_region; composite FK city (country_id, state_region_id) -> state_region (country_id, id) ON UPDATE RESTRICT (MATCH SIMPLE: skipped for NULL state); separate
    FK city.country_id -> country.'
  tables:
  - city
  - state_region
  milestone: B20
- id: BR-MST-11
  rule: Hierarchies are acyclic and depth-limited; roots have depth 1.
  mechanism_type: CHECK
  mechanism: CHECK (parent_id IS NULL OR parent_id <> id), CHECK ((parent_id IS NULL) = (depth = 1)), CHECK (depth BETWEEN 1 AND n); child depth = parent depth + 1 enforced in the admin write transaction
    (SELECT parent FOR UPDATE); industry_closure rebuilt by JOB with CHECK distance 0..3.
  tables:
  - skill_category
  - industry
  - job_category
  - industry_closure
  - field_of_study
  milestone: B20
- id: BR-MST-12
  rule: Merged duplicates keep a pointer to the survivor and are inactive; no self-merge.
  mechanism_type: CHECK
  mechanism: merged_into_<x>_id self-FK ON DELETE RESTRICT, CHECK (merged_into_<x>_id <> id), CHECK (merged_into_skill_id IS NULL OR NOT is_active); merge runs in one txn that repoints consumers (candidate_skill
    etc.) then sets the pointer; chains are flattened by JOB.
  tables:
  - skill
  - job_role
  - institution
  - employer_name_canonical
  milestone: B20
- id: BR-MST-13
  rule: Exactly one default language and at most one primary language per country.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: 'language: UNIQUE INDEX uq_language_is_default (is_default) WHERE is_default; country_language: UNIQUE INDEX uq_country_language_country_id (country_id) WHERE is_primary.'
  tables:
  - language
  - country_language
  milestone: B20
- id: BR-MST-14
  rule: Currency minor units drive money rounding; money columns elsewhere are DECIMAL(18,4) with a currency_id FK.
  mechanism_type: CHECK
  mechanism: currency.minor_unit CHECK BETWEEN 0 AND 4; currency_code CHECK ~ '^[A-Z]{3}$'; UNIQUE(currency_code), UNIQUE(iso_numeric); application rounds to minor_unit before ledger writes.
  tables:
  - currency
  milestone: B20
- id: BR-MST-15
  rule: A job_category is usable by jobs and/or gigs, never neither.
  mechanism_type: CHECK
  mechanism: CHECK (applies_to_jobs OR applies_to_gigs) on job_category; job/gig pickers filter on the flag via partial predicate.
  tables:
  - job_category
  milestone: B26
- id: BR-MST-16
  rule: Master data is written only by the admin role; reads are open to all application roles.
  mechanism_type: PRIVILEGE
  mechanism: GRANT SELECT on master tables to app roles; INSERT/UPDATE only to role master_admin; no DELETE grant; every change audited via updated_by/updated_at and audit_event.
  tables:
  - country
  - skill
  - language
  - ui_label
  milestone: B33
- id: BR-MST-17
  rule: Aliases and canonical names are normalised before comparison; one alias resolves to one entity per language.
  mechanism_type: UNIQUE
  mechanism: alias_lower STORED computed lower(alias_text); UNIQUE (language_id, alias_lower) on skill_alias and job_role_alias; UNIQUE (alias_lower) on institution_alias and employer_name_alias; trigram
    GIN indexes (alias_lower gin_trgm_ops) for fuzzy match.
  tables:
  - skill_alias
  - job_role_alias
  - institution_alias
  - employer_name_alias
  milestone: B20
- id: BR-MST-18
  rule: Sensitive demographic attributes (gender, marital_status) are optional, hidden by default and never used for ranking; no religion/caste/disability masters exist.
  mechanism_type: APP_LAYER
  mechanism: Consumers store these as nullable enum_ref FKs with default visibility private (visibility_level); search/ranking services exclude the columns; documented as a deliberate omission. Consumer
    tables classify the columns Personal/Sensitive.
  tables:
  - gender
  - marital_status
  - visibility_level
  milestone: B12
