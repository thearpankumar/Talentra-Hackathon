  description: Tax/registration identifier types per country (GSTIN, PAN, EIN, VAT) with validation rules; values themselves are stored elsewhere as Sensitive tokens.
  columns:
  - name: country_id
    type: UUID
    domain: identifier
    sens: Public
    desc: Country that issues the identifier.
    'null': false
  - name: tax_id_subject_id
    type: UUID
    domain: enum_ref
    sens: Public
    desc: Whether it identifies individuals, organisations or both.
    'null': false
  - name: tax_id_checksum_id
    type: UUID
    domain: enum_ref
    sens: Public
    desc: Checksum applied after the regex.
    'null': false
  - name: code
    type: STRING(40)
    domain: code
    sens: Public
    desc: Stable code, e.g. gstin, pan, ein, vat.
    'null': false
  - name: display_name
    type: STRING(150)
    domain: free_text
    sens: Public
    desc: English label, e.g. Goods and Services Tax Identification Number.
    'null': false
  - name: name_i18n
    type: JSONB
    domain: json
    sens: Public
    desc: 'Display name per UI language {language_tag: text}; must contain ''en''; fallback chain applied by the application.'
    'null': false
  - name: validation_regex
    type: STRING(500)
    domain: free_text
    sens: Public
    desc: Format regex (anchored) applied to the normalised value before storage.
    'null': false
  - name: format_example
    type: STRING(60)
    domain: free_text
    sens: Public
    desc: Synthetic example (never a real id) shown as input hint.
    'null': false
  - name: mask_pattern
    type: STRING(40)
    domain: free_text
    sens: Public
    desc: Display mask, e.g. XXXXXX####X.
    'null': true
    null_why: NULL = id never displayed even masked.
  - name: min_length
    type: INT2
    domain: quantity
    sens: Public
    desc: Minimum normalised length.
    'null': false
  - name: max_length
    type: INT2
    domain: quantity
    sens: Public
    desc: Maximum normalised length.
    'null': false
  - name: is_sensitive
    type: BOOL
    domain: boolean
    sens: Public
    desc: Value is Sensitive (tokenised/encrypted, masked on display). Always true for individual identifiers.
    'null': false
    default: 'true'
  - name: is_individual_identifier
    type: BOOL
    domain: boolean
    sens: Public
    desc: True when the id identifies a natural person (e.g. PAN, SSN, Aadhaar).
    'null': false
    default: 'false'
  - name: is_required_for_organisation
    type: BOOL
    domain: boolean
    sens: Public
    desc: Organisation must supply it to become verified in this country.
    'null': false
    default: 'false'
  - name: is_api_verifiable
    type: BOOL
    domain: boolean
    sens: Public
    desc: A registration/tax verification integration can validate it.
    'null': false
    default: 'false'
  - name: is_active
    type: BOOL
    domain: boolean
    sens: Public
    desc: False = retired type.
    'null': false
    default: 'true'
  constraints:
  - name: uq_tax_id_type_country_id_code
    type: unique
    columns:
    - country_id
    - code
    desc: Code unique per country.
  - name: ck_tax_id_type_length_order
    type: check
    expr: min_length <= max_length AND min_length > 0
    desc: Length range sane.
  - name: ck_tax_id_type_individual_is_sensitive
    type: check
    expr: NOT is_individual_identifier OR is_sensitive
    desc: Personal identifiers must be treated as Sensitive.
  - name: ck_tax_id_type_code_format
    type: check
    expr: code ~ '^[a-z0-9_]+$'
    desc: Lowercase snake_case.
  - name: ck_tax_id_type_name_i18n_en
    type: check
    expr: name_i18n ? 'en'
    desc: Default language present.
  indexes:
  - name: idx_tax_id_type_tax_id_subject_id
    columns:
    - tax_id_subject_id
    desc: Filter by subject.
  - name: idx_tax_id_type_tax_id_checksum_id
    columns:
    - tax_id_checksum_id
    desc: Supports FK fk_tax_id_type_tax_id_checksum_id (join and delete checks).
  fks:
  - name: fk_tax_id_type_country_id
    columns:
    - country_id
    ref: country
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Country that issues the identifier.
