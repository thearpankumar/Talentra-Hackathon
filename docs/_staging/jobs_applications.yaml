- name: job_syndication
  kind: entity
  delete_policy: soft
  volume: high
  tier: '1'
  milestones:
  - B6
  - B14
  - B22
  retention: Kept 2 years after posting end; external ids are references only.
  description: 'Posting of a requirement to an external channel (integration boundary: stores reference and status, not external content).'
  columns:
  - name: job_requirement_id
    type: UUID
    domain: identifier
    desc: Requirement.
    sens: Internal
  - name: job_posting_channel_id
    type: UUID
    domain: identifier
    desc: Channel.
    sens: Internal
  - name: syndication_status_id
    type: UUID
    domain: enum_ref
    desc: State.
    sens: Internal
  - name: external_posting_ref
    type: STRING(200)
    domain: free_text
    desc: Id at the external board (idempotency).
    sens: Internal
    'null': true
    null_why: NULL = not yet posted.
  - name: external_url
    type: STRING(500)
    domain: url
    desc: Public URL at the channel.
    sens: Public
    'null': true
    null_why: NULL = not posted.
  - name: posted_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: When posted.
    sens: Internal
    'null': true
    null_why: NULL = not yet posted.
  - name: removed_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: When removed.
    sens: Internal
    'null': true
    null_why: NULL = still posted or never posted.
  - name: last_synced_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Last reconciliation.
    sens: Internal
    'null': true
    null_why: NULL = never synced.
  - name: error_message
    type: STRING(500)
    domain: free_text
    desc: Last error.
    sens: Internal
    'null': true
    null_why: NULL = no error.
  - name: cost_amount
    type: DECIMAL(18,4)
    domain: money
    desc: Cost of the posting.
    sens: Internal
    'null': true
    null_why: NULL = free or unknown.
  - name: currency_id
    type: UUID
    domain: identifier
    desc: Currency of cost.
    sens: Internal
    'null': true
    null_why: NULL = no cost.
  no_hash_why: Random UUID PK; indexes lead with ids/status, not time.
  fks:
  - name: fk_job_syndication_job_requirement_id
    columns:
    - job_requirement_id
    ref: job_requirement
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: Follows the requirement.
  - name: fk_job_syndication_job_posting_channel_id
    columns:
    - job_posting_channel_id
    ref: job_posting_channel
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Channels are retired not deleted.
  - name: fk_job_syndication_syndication_status_id
    columns:
    - syndication_status_id
    ref: syndication_status
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Lookup never deleted.
  - name: fk_job_syndication_currency_id
    columns:
    - currency_id
    ref: currency
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Master data never deleted.
    index_exempt: referenced reference/lookup rows are retired via is_active and never deleted, so no child scan is needed
  constraints:
  - name: ck_job_syndication_removed_after_posted
    type: check
    expr: removed_at IS NULL OR posted_at IS NULL OR removed_at >= posted_at
    desc: Removed after posted.
  - name: ck_job_syndication_cost_companion
    type: check
    expr: cost_amount IS NULL OR currency_id IS NOT NULL
    desc: Cost has currency.
  indexes:
  - name: uq_job_syndication_job_requirement_id_channel
    columns:
    - job_requirement_id
    - job_posting_channel_id
    desc: One posting per requirement and channel among live rows.
    unique: true
    where: deleted_at IS NULL
  - name: uq_job_syndication_job_posting_channel_id_external_posting_ref
    columns:
    - job_posting_channel_id
    - external_posting_ref
    desc: Idempotent channel callbacks.
    unique: true
    where: external_posting_ref IS NOT NULL AND deleted_at IS NULL
  - name: idx_job_syndication_syndication_status_id_last_synced_at
    columns:
    - syndication_status_id
    - last_synced_at
    desc: Sync worker queue.
    where: syndication_status_id IS NOT NULL
