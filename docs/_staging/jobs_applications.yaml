  - name: fk_questionnaire_answer_requirement_questionnaire
    columns:
    - job_requirement_id
    - questionnaire_id
    ref: job_requirement
    ref_columns:
    - id
    - questionnaire_id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'Composite FK: the questionnaire must be the one currently attached to the requirement.'
  - name: fk_questionnaire_answer_question
    columns:
    - questionnaire_question_id
    - questionnaire_id
    ref: questionnaire_question
    ref_columns:
    - id
    - questionnaire_id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'Composite FK: the question must belong to that questionnaire.'
  constraints:
  - name: uq_questionnaire_answer_job_application_id_questionnaire_question_id
    type: unique
    columns:
    - job_application_id
    - questionnaire_question_id
