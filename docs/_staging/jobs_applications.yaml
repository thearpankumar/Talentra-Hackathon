- name: questionnaire_answer
  kind: entity
  delete_policy: hard
  volume: very_high
  tier: '1'
  milestones:
  - B6
  - B7
  - B14
  - B22
  retention: Active while candidate account lives; erased/anonymised on candidate erasure request (DPDP/GDPR) and 3 years after last activity per inactivity purge; aggregate funnel counts survive in analytics
    without identifiers; legal hold overrides.
  description: Candidate's answer to one questionnaire question within an application. Composite FKs prove that application, requirement, questionnaire and question all line up (BR-JOB-09).
  columns:
  - name: job_application_id
    type: UUID
    domain: identifier
    desc: Application.
    sens: Internal
  - name: job_requirement_id
    type: UUID
    domain: identifier
    desc: Requirement of the application.
    sens: Internal
  - name: questionnaire_id
    type: UUID
    domain: identifier
    desc: Questionnaire attached to the requirement.
    sens: Internal
  - name: questionnaire_question_id
    type: UUID
    domain: identifier
    desc: Question answered.
    sens: Internal
  - name: answer_text
    type: STRING(4000)
    domain: free_text
    desc: Free-text answer.
    sens: Personal
    'null': true
    null_why: NULL = answered via options/number/date or skipped.
    pii: candidate-supplied; access-controlled; erased with application
  - name: answer_number
    type: DECIMAL(18,4)
    domain: measure
    desc: Numeric answer.
    sens: Internal
    'null': true
    null_why: NULL = not a numeric question or skipped.
  - name: answer_date
    type: DATE
    domain: date
    desc: Date answer.
    sens: Internal
    'null': true
    null_why: NULL = not a date question or skipped.
