    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Evaluator kept for audit.
  - name: fk_application_scorecard_interview_recommendation_id
    columns:
    - interview_recommendation_id
    ref: interview_recommendation
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Lookup never deleted.
    index_exempt: referenced reference/lookup rows are retired via is_active and never deleted, so no child scan is needed
  constraints:
  - name: ck_application_scorecard_overall_score_range
