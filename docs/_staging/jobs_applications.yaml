  - name: location_text
    type: STRING(300)
    domain: free_text
    desc: Venue for onsite interviews.
    sens: Internal
    'null': true
    null_why: NULL = not onsite.
  - name: organisation_location_id
    type: UUID
    domain: identifier
    desc: Employer site for onsite interviews.
    sens: Internal
    'null': true
    null_why: NULL = not onsite or ad-hoc venue.
  - name: candidate_confirmed_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Candidate confirmation.
    sens: Internal
    'null': true
    null_why: NULL = not confirmed.
  - name: completed_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Actual completion.
    sens: Internal
    'null': true
    null_why: NULL = not completed.
  - name: cancelled_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Cancellation instant.
    sens: Internal
    'null': true
    null_why: NULL = not cancelled.
  - name: cancelled_by_actor_kind_id
    type: UUID
    domain: enum_ref
    desc: Who cancelled.
    sens: Internal
    'null': true
    null_why: NULL = not cancelled.
  - name: cancel_reason
    type: STRING(300)
    domain: free_text
    desc: Reason for cancellation.
    sens: Internal
    'null': true
    null_why: NULL = not cancelled or none given.
  - name: overall_interview_recommendation_id
    type: UUID
    domain: enum_ref
    desc: Consolidated recommendation after feedback.
    sens: Internal
    'null': true
    null_why: NULL = feedback pending.
  fks:
  - name: fk_interview_application
    columns:
    - job_application_id
    - job_requirement_id
    ref: job_application
    ref_columns:
    - id
    - job_requirement_id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Interviews follow application; erasure job deletes explicitly.
  - name: fk_interview_organisation_id
    columns:
    - organisation_id
    ref: organisation
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Tenant data.
  - name: fk_interview_panel
    columns:
    - interview_panel_id
    - organisation_id
    ref: interview_panel
    ref_columns:
    - id
    - organisation_id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'Composite FK: panel belongs to the interview''s organisation (skipped when ad-hoc).'
  - name: fk_interview_interview_round_type_id
    columns:
    - interview_round_type_id
    ref: interview_round_type
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Lookup never deleted.
    index_exempt: referenced reference/lookup rows are retired via is_active and never deleted, so no child scan is needed
  - name: fk_interview_interview_mode_id
    columns:
    - interview_mode_id
    ref: interview_mode
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Lookup never deleted.
    index_exempt: referenced reference/lookup rows are retired via is_active and never deleted, so no child scan is needed
  - name: fk_interview_interview_status_id
    columns:
    - interview_status_id
    ref: interview_status
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Lookup never deleted.
    index_exempt: referenced reference/lookup rows are retired via is_active and never deleted, so no child scan is needed
  - name: fk_interview_organisation_location_id
    columns:
    - organisation_location_id
    ref: organisation_location
    ref_columns:
    - id
    on_delete: SET NULL
    on_update: RESTRICT
    desc: Branch closure keeps the history.
  - name: fk_interview_cancelled_by_actor_kind_id
    columns:
    - cancelled_by_actor_kind_id
    ref: actor_kind
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Lookup never deleted.
    index_exempt: referenced reference/lookup rows are retired via is_active and never deleted, so no child scan is needed
  - name: fk_interview_overall_interview_recommendation_id
    columns:
    - overall_interview_recommendation_id
    ref: interview_recommendation
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Lookup never deleted.
    index_exempt: referenced reference/lookup rows are retired via is_active and never deleted, so no child scan is needed
  constraints:
  - name: uq_interview_id_job_application_id
    type: unique
    columns:
    - id
    - job_application_id
    desc: Target of composite FK from feedback.
  - name: ck_interview_schedule_range
    type: check
    expr: scheduled_end_at > scheduled_start_at
    desc: End after start (docket date-range rule).
  - name: ck_interview_max_duration
    type: check
    expr: scheduled_end_at <= scheduled_start_at + INTERVAL '12 hours'
    desc: Interview not longer than 12 hours.
  - name: ck_interview_round_pos
    type: check
    expr: round_no >= 1
    desc: Rounds start at 1.
  - name: ck_interview_cancel_consistency
    type: check
    expr: (cancelled_at IS NULL) = (cancelled_by_actor_kind_id IS NULL)
    desc: Cancellation time and actor go together.
  indexes:
  - name: uq_interview_job_application_id_round_no
    columns:
    - job_application_id
    - round_no
    desc: One live interview per round per application.
    unique: true
    where: deleted_at IS NULL AND cancelled_at IS NULL
  - name: idx_interview_job_requirement_id_scheduled_start_at
    columns:
    - job_requirement_id
    - scheduled_start_at
    desc: Requirement interview calendar.
  - name: idx_interview_organisation_id_scheduled_start_at
    columns:
    - organisation_id
    - scheduled_start_at DESC
    desc: Tenant calendar.
    where: cancelled_at IS NULL
    storing:
    - job_application_id
    - interview_status_id
  - name: idx_interview_scheduled_start_at_hash
    columns:
    - scheduled_start_at
    desc: 'Hash-sharded: reminder sweeps and time scans.'
    hash: true
    bucket_count: 16
  - name: idx_interview_interview_panel_id
    columns:
    - interview_panel_id
    desc: Panel usage.
    where: interview_panel_id IS NOT NULL
  - name: idx_interview_organisation_location_id
    columns:
