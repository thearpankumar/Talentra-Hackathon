    default: now()
  - name: applied_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: When the candidate applied.
    sens: Internal
    default: now()
  - name: resume_id
    type: UUID
    domain: identifier
    desc: Resume version submitted with the application (resume rows are immutable snapshots).
    sens: Internal
    'null': true
    null_why: NULL = applied with profile only, no resume.
  - name: candidate_message
    type: STRING(2000)
    domain: free_text
    desc: Cover note typed by the candidate.
    sens: Personal
    'null': true
    null_why: NULL = no cover note.
    pii: access-controlled and audited; visible only to the receiving organisation; erased on candidate erasure
  - name: expected_salary_amount
    type: DECIMAL(18,4)
    domain: money
    desc: Candidate's expected compensation for this job.
    sens: Internal
    'null': true
    null_why: NULL = candidate gave none.
  - name: currency_id
    type: UUID
    domain: identifier
    desc: Currency of expected salary.
    sens: Internal
    'null': true
    null_why: NULL = no expected salary.
  - name: salary_period_id
    type: UUID
    domain: enum_ref
    desc: Period of expected salary.
    sens: Internal
    'null': true
    null_why: NULL = no expected salary.
  - name: notice_period_days
    type: INT2
    domain: quantity
    desc: Candidate's notice period in days at application.
    sens: Internal
    'null': true
    null_why: NULL = not stated; 0 = immediate joiner.
  - name: match_score
    type: DECIMAL(5,2)
    domain: measure
    desc: Computed profile-to-job match score 0..100.
    sens: Internal
    'null': true
    null_why: NULL = not scored yet.
  - name: screening_score
    type: DECIMAL(5,2)
    domain: measure
    desc: Score from questionnaire/screening rules 0..100.
    sens: Internal
    'null': true
    null_why: NULL = no questionnaire or not scored.
  - name: is_screened_out
    type: BOOL
    domain: boolean
    desc: True when a knockout rule or question failed.
    sens: Internal
    default: 'false'
  - name: submitted_by_app_user_id
    type: UUID
    domain: identifier
    desc: Recruiter/consultant who submitted on the candidate's behalf (recruiters may contact, not register candidates; this is only a submission of an existing candidate).
    sens: Internal
    'null': true
    null_why: NULL = candidate applied themselves.
  - name: first_viewed_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: When an employer first opened the application.
    sens: Internal
    'null': true
    null_why: NULL = not yet viewed.
  - name: withdrawn_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: When the candidate withdrew.
    sens: Internal
    'null': true
    null_why: NULL = not withdrawn.
  - name: withdrawal_reason_id
    type: UUID
    domain: enum_ref
    desc: Why the candidate withdrew.
    sens: Internal
    'null': true
    null_why: NULL = not withdrawn or no reason given.
  fks:
  - name: fk_job_application_candidate_profile_id
    columns:
    - candidate_profile_id
    ref: candidate_profile
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Erasure job deletes/anonymises applications explicitly; CASCADE over 100M-row ranges would be an unbounded txn.
  - name: fk_job_application_requirement
    columns:
    - organisation_id
    - job_requirement_id
    ref: job_requirement
    ref_columns:
    - organisation_id
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'Composite FK: denormalised tenant must equal the requirement''s tenant; requirements are soft-deleted so history survives.'
  - name: fk_job_application_position
    columns:
    - job_requirement_id
    - job_position_id
    ref: job_position
    ref_columns:
    - job_requirement_id
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'Composite FK: a chosen position must belong to the same requirement (MATCH SIMPLE: skipped while position is NULL).'
  - name: fk_job_application_job_source_id
    columns:
    - job_source_id
    ref: job_source
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Lookup never deleted.
    index_exempt: referenced reference/lookup rows are retired via is_active and never deleted, so no child scan is needed
  - name: fk_job_application_application_status_id
    columns:
    - application_status_id
    ref: application_status
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Lookup never deleted.
    index_exempt: referenced reference/lookup rows are retired via is_active and never deleted, so no child scan is needed
  - name: fk_job_application_resume_id
    columns:
    - resume_id
    ref: resume
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: A submitted resume snapshot must not be deleted from under an application (profile module soft-deletes).
  - name: fk_job_application_currency_id
    columns:
    - currency_id
    ref: currency
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Master data never deleted.
    index_exempt: referenced reference/lookup rows are retired via is_active and never deleted, so no child scan is needed
  - name: fk_job_application_salary_period_id
    columns:
    - salary_period_id
    ref: salary_period
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Master data never deleted.
    index_exempt: referenced reference/lookup rows are retired via is_active and never deleted, so no child scan is needed
  - name: fk_job_application_submitted_by_app_user_id
    columns:
    - submitted_by_app_user_id
    ref: app_user
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Submitter kept for audit and consultant fee attribution.
  - name: fk_job_application_withdrawal_reason_id
    columns:
    - withdrawal_reason_id
    ref: withdrawal_reason
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Lookup never deleted.
    index_exempt: referenced reference/lookup rows are retired via is_active and never deleted, so no child scan is needed
  constraints:
  - name: uq_job_application_id_job_requirement_id
    type: unique
    columns:
    - id
    - job_requirement_id
    desc: 'Target of composite FKs from answers/history/interview/offer: children provably belong to the same requirement.'
  - name: ck_job_application_match_score_range
    type: check
    expr: match_score IS NULL OR (match_score >= 0 AND match_score <= 100)
    desc: Score 0..100.
  - name: ck_job_application_screening_score_range
    type: check
    expr: screening_score IS NULL OR (screening_score >= 0 AND screening_score <= 100)
    desc: Score 0..100.
  - name: ck_job_application_salary_companions
    type: check
    expr: expected_salary_amount IS NULL OR (currency_id IS NOT NULL AND salary_period_id IS NOT NULL AND expected_salary_amount >= 0)
    desc: Amount comes with currency and period.
  - name: ck_job_application_notice_period_range
    type: check
    expr: notice_period_days IS NULL OR (notice_period_days >= 0 AND notice_period_days <= 365)
    desc: 0..365 days.
  - name: ck_job_application_withdrawn_reason_requires_withdrawn
    type: check
    expr: withdrawn_at IS NOT NULL OR withdrawal_reason_id IS NULL
    desc: A reason implies withdrawal.
  - name: ck_job_application_status_sequence_pos
    type: check
    expr: status_sequence_no >= 1
    desc: Sequence starts at 1.
  - name: ck_job_application_viewed_after_applied
    type: check
    expr: first_viewed_at IS NULL OR first_viewed_at >= applied_at
    desc: Cannot view before applying.
  - name: ck_job_application_withdrawn_after_applied
    type: check
    expr: withdrawn_at IS NULL OR withdrawn_at >= applied_at
    desc: Cannot withdraw before applying.
  indexes:
  - name: uq_job_application_candidate_profile_id_job_requirement_id
    columns:
    - candidate_profile_id
    - job_requirement_id
    desc: One live application per candidate and requirement; withdrawn or deleted applications may be re-submitted (BR-JOB-07).
    unique: true
    where: withdrawn_at IS NULL AND deleted_at IS NULL
  - name: idx_job_application_job_requirement_id_status_applied
    columns:
    - job_requirement_id
    - application_status_id
    - applied_at DESC
    desc: 'Employer pipeline board: applicants of a requirement by stage, newest first.'
    storing:
    - candidate_profile_id
    - match_score
  - name: idx_job_application_candidate_profile_id_applied_at
    columns:
    - candidate_profile_id
    - applied_at DESC
    desc: Candidate's 'My applications' list.
    storing:
    - application_status_id
    - job_requirement_id
  - name: idx_job_application_organisation_id_application_status_id_status_changed_at
    columns:
    - organisation_id
    - application_status_id
    - status_changed_at DESC
    desc: Tenant-wide pipeline reports and recruiter work queues.
  - name: idx_job_application_applied_at_hash
    columns:
    - applied_at
    desc: 'Hash-sharded: time-ordered scans/changefeed/analytics extraction at 100M rows without a hot range.'
    hash: true
    bucket_count: 32
  - name: idx_job_application_status_changed_at_hash
    columns:
    - status_changed_at
    desc: 'Hash-sharded: SLA/stale-stage sweeps by time.'
    hash: true
    bucket_count: 32
  - name: idx_job_application_resume_id
    columns:
    - resume_id
    desc: FK support / where-used for resumes.
    where: resume_id IS NOT NULL
  - name: idx_job_application_submitted_by_app_user_id_applied_at
    columns:
    - submitted_by_app_user_id
    - applied_at DESC
    desc: Consultant/recruiter submissions.
    where: submitted_by_app_user_id IS NOT NULL
- name: application_status_transition
  kind: config
  delete_policy: hard
  volume: low
  tier: '1'
  milestones:
  - B6
  - B14
  - B22
  retention: Reference configuration, versioned in git seed; changes audited.
  description: 'Allowed pipeline transitions (state machine). job_application_status_history has a composite FK to this table, so an illegal from->to pair cannot be inserted (decision: DB-enforced transitions,
    no triggers).'
  columns:
  - name: from_application_status_id
    type: UUID
    domain: enum_ref
    desc: Status being left.
    sens: Internal
  - name: to_application_status_id
    type: UUID
    domain: enum_ref
    desc: Status being entered.
    sens: Internal
  - name: requires_reason
    type: BOOL
    domain: boolean
    desc: Rejection reason mandatory (app layer + CHECK on history).
    sens: Internal
    default: 'false'
  - name: requires_comment
    type: BOOL
    domain: boolean
    desc: Free-text comment mandatory.
    sens: Internal
    default: 'false'
  - name: allowed_for_candidate
    type: BOOL
    domain: boolean
    desc: Candidate may trigger (withdraw, accept offer).
    sens: Internal
    default: 'false'
  - name: allowed_for_employer
    type: BOOL
    domain: boolean
    desc: Employer/recruiter may trigger.
    sens: Internal
    default: 'true'
  - name: is_automatic
    type: BOOL
    domain: boolean
    desc: System-only transition (e.g. viewed on first open).
    sens: Internal
    default: 'false'
  - name: is_active
    type: BOOL
    domain: boolean
    desc: Retired transitions stay for history validity.
    sens: Internal
    default: 'true'
  fks:
  - name: fk_application_status_transition_from_application_status_id
    columns:
    - from_application_status_id
    ref: application_status
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Lookup never deleted.
  - name: fk_application_status_transition_to_application_status_id
    columns:
    - to_application_status_id
    ref: application_status
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Lookup never deleted.
  constraints:
  - name: uq_application_status_transition_from_application_status_id_to_application_status_id
    type: unique
    columns:
    - from_application_status_id
    - to_application_status_id
    desc: Each pair defined once; target of composite FK from history.
  - name: ck_application_status_transition_no_self_transition
    type: check
    expr: from_application_status_id <> to_application_status_id
    desc: No self loops.
  indexes:
  - name: idx_application_status_transition_to_application_status_id
    columns:
    - to_application_status_id
    desc: Reverse lookup of how a status is reached.
- name: job_application_status_history
  kind: event
  delete_policy: append_only
  volume: very_high
  tier: '1'
  milestones:
  - B6
  - B7
  - B10
  - B14
  - B22
  - B23
  retention: Retained with the application; deleted by the erasure job together with the application; summary kept as anonymous analytics facts. Never updated.
  description: 'Append-only stage transition log: who moved which application from which status to which, with reason and comment. Enforces legal transitions (FK to application_status_transition) and a
    gap-free chain (self composite FK).'
  columns:
  - name: job_application_id
    type: UUID
    domain: identifier
    desc: Application.
    sens: Internal
  - name: job_requirement_id
    type: UUID
    domain: identifier
    desc: Requirement (same as application's; composite FK) for funnel queries without a join.
    sens: Internal
  - name: sequence_no
    type: INT4
    domain: quantity
    desc: 1-based order within the application.
    sens: Internal
  - name: prior_sequence_no
    type: INT4
    domain: quantity
    desc: sequence_no of the previous row.
    sens: Internal
    'null': true
    null_why: NULL = first row (application created).
  - name: from_application_status_id
    type: UUID
    domain: enum_ref
    desc: Status left.
    sens: Internal
    'null': true
    null_why: NULL = first row; the application was created in to_application_status_id.
  - name: to_application_status_id
    type: UUID
    domain: enum_ref
    desc: Status entered.
    sens: Internal
  - name: actor_kind_id
    type: UUID
    domain: enum_ref
    desc: Kind of actor; the actor user is created_by (D-04).
    sens: Internal
  - name: rejection_reason_id
    type: UUID
    domain: enum_ref
    desc: Reason when entering rejected.
    sens: Internal
    'null': true
    null_why: NULL = not a rejection.
  - name: comment_text
    type: STRING(1000)
    domain: free_text
    desc: Actor's comment on the transition.
    sens: Personal
    'null': true
    null_why: NULL = no comment.
    pii: may name the candidate; access-controlled to hiring team; erased with application
  - name: idempotency_key
    type: STRING(100)
    domain: free_text
    desc: Client-supplied key making retries of the same transition idempotent.
    sens: Internal
    'null': true
    null_why: NULL = system job without key.
  fks:
  - name: fk_job_application_status_history_application
    columns:
    - job_application_id
    - job_requirement_id
    ref: job_application
    ref_columns:
    - id
    - job_requirement_id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: 'Composite FK: history belongs to the application and its requirement; CASCADE only fires from the erasure job (applications are soft-deleted otherwise).'
  - name: fk_job_application_status_history_chain
    columns:
    - job_application_id
    - prior_sequence_no
    - from_application_status_id
    ref: job_application_status_history
    ref_columns:
    - job_application_id
    - sequence_no
    - to_application_status_id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'Self composite FK: the status left must equal the status entered by the previous row, so the chain has no gaps or forks (skipped when first row).'
  - name: fk_job_application_status_history_transition
    columns:
    - from_application_status_id
    - to_application_status_id
    ref: application_status_transition
    ref_columns:
    - from_application_status_id
    - to_application_status_id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'Composite FK to the transition table: only configured transitions can be recorded.'
    index_exempt: application_status_transition rows are configuration and never deleted; no child scan needed
  - name: fk_job_application_status_history_to_application_status_id
    columns:
    - to_application_status_id
    ref: application_status
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Lookup never deleted; also covers the first row with no from-status.
    index_exempt: referenced reference/lookup rows are retired via is_active and never deleted, so no child scan is needed
  - name: fk_job_application_status_history_actor_kind_id
    columns:
    - actor_kind_id
    ref: actor_kind
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Lookup never deleted.
    index_exempt: referenced reference/lookup rows are retired via is_active and never deleted, so no child scan is needed
  - name: fk_job_application_status_history_rejection_reason_id
    columns:
    - rejection_reason_id
    ref: rejection_reason
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Lookup never deleted.
    index_exempt: referenced reference/lookup rows are retired via is_active and never deleted, so no child scan is needed
  constraints:
  - name: uq_job_application_status_history_job_application_id_sequence_no
    type: unique
    columns:
    - job_application_id
    - sequence_no
    desc: 'One row per sequence number: serialises concurrent moves on one application.'
  - name: uq_job_application_status_history_job_application_id_sequence_no_to_application_status_id
    type: unique
    columns:
    - job_application_id
    - sequence_no
    - to_application_status_id
    desc: Target of the self composite chain FK.
  - name: ck_job_application_status_history_first_row
    type: check
    expr: (prior_sequence_no IS NULL) = (sequence_no = 1)
    desc: Only sequence 1 has no predecessor.
  - name: ck_job_application_status_history_prior_adjacent
    type: check
    expr: prior_sequence_no IS NULL OR prior_sequence_no = sequence_no - 1
    desc: Predecessor is the immediately preceding row.
  - name: ck_job_application_status_history_from_null_iff_first
    type: check
    expr: (from_application_status_id IS NULL) = (prior_sequence_no IS NULL)
    desc: from-status absent only on the first row.
  - name: ck_job_application_status_history_distinct_states
    type: check
    expr: from_application_status_id IS NULL OR from_application_status_id <> to_application_status_id
    desc: A transition changes status.
  indexes:
  - name: idx_job_application_status_history_created_at_hash
    columns:
    - created_at
    desc: 'Hash-sharded: time-ordered export/changefeed/SLA scans without hotspot.'
    hash: true
    bucket_count: 32
  - name: idx_job_application_status_history_job_requirement_id_funnel
    columns:
    - job_requirement_id
    - to_application_status_id
    - created_at
    desc: Funnel counts and time-in-stage per requirement.
  - name: uq_job_application_status_history_idempotency_key
    columns:
    - idempotency_key
    desc: Idempotent retries.
    unique: true
    where: idempotency_key IS NOT NULL
- name: application_note
  kind: entity
  delete_policy: soft
  volume: high
  tier: '1'
  milestones:
  - B6
  - B14
  - B22
  retention: Active while candidate account lives; erased/anonymised on candidate erasure request (DPDP/GDPR) and 3 years after last activity per inactivity purge; aggregate funnel counts survive in analytics
    without identifiers; legal hold overrides.
  description: Internal recruiter/hiring-team note on an application (Greenhouse activity feed notes).
  columns:
  - name: job_application_id
    type: UUID
    domain: identifier
    desc: Application.
    sens: Internal
  - name: job_requirement_id
    type: UUID
    domain: identifier
    desc: Requirement (composite FK).
    sens: Internal
  - name: note_text
    type: STRING(4000)
    domain: free_text
    desc: Note body.
    sens: Personal
    pii: contains opinions about a person; visible per note_visibility; masked from candidate; erased with application
  - name: note_visibility_id
    type: UUID
    domain: enum_ref
    desc: Who can read.
    sens: Internal
  - name: is_pinned
    type: BOOL
    domain: boolean
    desc: Pinned to the top of the application.
    sens: Internal
    default: 'false'
  no_hash_why: Reads always by job_application_id; random UUID PK; modest write rate.
  fks:
  - name: fk_application_note_application
    columns:
    - job_application_id
    - job_requirement_id
    ref: job_application
    ref_columns:
    - id
    - job_requirement_id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: Notes follow the application; CASCADE only from erasure job.
  - name: fk_application_note_note_visibility_id
    columns:
    - note_visibility_id
    ref: note_visibility
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Lookup never deleted.
    index_exempt: referenced reference/lookup rows are retired via is_active and never deleted, so no child scan is needed
  constraints: []
  indexes:
  - name: idx_application_note_job_application_id_created_at
    columns:
    - job_application_id
    - created_at DESC
    desc: Notes of an application, newest first.
  - name: idx_application_note_job_requirement_id
    columns:
    - job_requirement_id
    desc: FK support / per-requirement note review.
- name: application_scorecard
