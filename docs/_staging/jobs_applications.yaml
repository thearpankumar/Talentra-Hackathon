- name: offer
  kind: entity
  delete_policy: soft
  volume: high
  tier: '1'
  milestones:
  - B6
  - B7
  - B10
  - B14
  - B22
  retention: Active while candidate account lives; erased/anonymised on candidate erasure request (DPDP/GDPR) and 3 years after last activity per inactivity purge; aggregate funnel counts survive in analytics
    without identifiers; legal hold overrides.
  description: Job offer to a candidate for an application. Terms are versioned in offer_revision; at most one open offer per application.
  columns:
  - name: job_application_id
    type: UUID
    domain: identifier
    desc: Application.
    sens: Internal
  - name: job_requirement_id
    type: UUID
    domain: identifier
    desc: Requirement (composite FK).
    sens: Internal
  - name: organisation_id
    type: UUID
    domain: identifier
    desc: Tenant.
    sens: Internal
  - name: offer_status_id
    type: UUID
    domain: enum_ref
    desc: Lifecycle state.
    sens: Internal
  - name: is_open
    type: BOOL
    domain: boolean
    desc: True until accepted, declined, expired or withdrawn; drives the partial unique index.
    sens: Internal
    default: 'true'
  - name: current_revision_no
    type: INT4
    domain: quantity
    desc: Latest revision number.
    sens: Internal
    'null': true
    null_why: NULL = revision not yet created (draft being initialised).
  - name: sent_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: When sent to the candidate.
    sens: Internal
    'null': true
    null_why: NULL = not sent.
  - name: expires_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Acceptance deadline.
    sens: Internal
    'null': true
    null_why: NULL = no deadline.
  - name: responded_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Candidate response time.
    sens: Internal
    'null': true
    null_why: NULL = no response yet.
  - name: offer_decline_reason_id
    type: UUID
    domain: enum_ref
    desc: Why declined.
    sens: Internal
    'null': true
    null_why: NULL = not declined.
  - name: proposed_joining_date
    type: DATE
    domain: date
    desc: Joining date in the current revision (denormalised).
    sens: Internal
    'null': true
    null_why: NULL = not fixed.
  - name: approved_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Internal approval complete.
    sens: Internal
    'null': true
    null_why: NULL = no approval required or pending.
  no_hash_why: ~5M offers at full scale; all list indexes lead with tenant/requirement ids; no sequential hotspot.
  fks:
  - name: fk_offer_application
    columns:
    - job_application_id
    - job_requirement_id
    ref: job_application
    ref_columns:
    - id
    - job_requirement_id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Offers survive for audit; erasure job deletes explicitly.
  - name: fk_offer_organisation_id
    columns:
    - organisation_id
    ref: organisation
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Tenant.
  - name: fk_offer_offer_status_id
    columns:
    - offer_status_id
    ref: offer_status
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Lookup never deleted.
    index_exempt: referenced reference/lookup rows are retired via is_active and never deleted, so no child scan is needed
  - name: fk_offer_offer_decline_reason_id
    columns:
    - offer_decline_reason_id
    ref: offer_decline_reason
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Lookup never deleted.
    index_exempt: referenced reference/lookup rows are retired via is_active and never deleted, so no child scan is needed
  - name: fk_offer_revision
    columns:
    - id
    - current_revision_no
    ref: offer_revision
    ref_columns:
    - offer_id
    - revision_no
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'Composite FK: the current revision number must exist for this offer (skipped while NULL).'
    index_exempt: id is the primary key of this table
  constraints:
  - name: uq_offer_id_job_application_id
    type: unique
    columns:
    - id
    - job_application_id
    desc: Target of composite FKs.
  - name: ck_offer_expiry_after_sent
    type: check
    expr: expires_at IS NULL OR sent_at IS NULL OR expires_at > sent_at
    desc: Deadline after sending.
  - name: ck_offer_response_after_sent
    type: check
    expr: responded_at IS NULL OR sent_at IS NULL OR responded_at >= sent_at
    desc: Response after sending.
  - name: ck_offer_decline_reason_requires_response
    type: check
    expr: offer_decline_reason_id IS NULL OR responded_at IS NOT NULL
    desc: Reason implies a response.
  indexes:
  - name: uq_offer_job_application_id_open
    columns:
    - job_application_id
    desc: At most one open offer per application.
    unique: true
    where: is_open AND deleted_at IS NULL
  - name: idx_offer_organisation_id_offer_status_id_sent_at
    columns:
    - organisation_id
    - offer_status_id
    - sent_at DESC
    desc: Tenant offer board.
  - name: idx_offer_job_requirement_id_offer_status_id
    columns:
    - job_requirement_id
    - offer_status_id
    desc: Offers per requirement.
  - name: idx_offer_expires_at
    columns:
    - expires_at
    desc: Expiry sweep over open offers.
    where: is_open AND expires_at IS NOT NULL
