- name: rejection
  kind: entity
  delete_policy: soft
  volume: high
  tier: '1'
  milestones:
  - B6
  - B7
  - B14
  - B22
  retention: Active while candidate account lives; erased/anonymised on candidate erasure request (DPDP/GDPR) and 3 years after last activity per inactivity purge; aggregate funnel counts survive in analytics
    without identifiers; legal hold overrides.
  description: Rejection of an application with reason, optional message to the candidate. Reinstatement soft-deletes the row.
  columns:
  - name: job_application_id
    type: UUID
    domain: identifier
    desc: Application.
    sens: Internal
  - name: job_requirement_id
    type: UUID
    domain: identifier
    desc: Requirement (composite FK).
    sens: Internal
  - name: rejection_reason_id
    type: UUID
    domain: enum_ref
    desc: Reason.
    sens: Internal
  - name: rejected_from_application_status_id
    type: UUID
    domain: enum_ref
    desc: Stage from which it was rejected.
    sens: Internal
  - name: rejected_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: When rejected.
    sens: Internal
    default: now()
  - name: internal_comment
    type: STRING(1000)
    domain: free_text
    desc: Internal remark.
    sens: Personal
    'null': true
    null_why: NULL = none.
    pii: opinion about a person; hiring team only; erased with application
  - name: candidate_message
    type: STRING(1000)
    domain: free_text
    desc: Message shown to the candidate.
    sens: Personal
    'null': true
    null_why: NULL = no message.
    pii: addressed to a person; erased with application
  - name: notify_candidate
    type: BOOL
    domain: boolean
    desc: Send a notification.
    sens: Internal
    default: 'true'
  - name: reinstated_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Reinstatement time.
    sens: Internal
    'null': true
    null_why: NULL = still rejected.
  no_hash_why: Random UUID PK; secondary indexes lead with ids, not time.
  fks:
  - name: fk_rejection_application
    columns:
    - job_application_id
    - job_requirement_id
    ref: job_application
    ref_columns:
    - id
    - job_requirement_id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Rejections follow application.
  - name: fk_rejection_rejection_reason_id
    columns:
    - rejection_reason_id
    ref: rejection_reason
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Lookup never deleted.
    index_exempt: referenced reference/lookup rows are retired via is_active and never deleted, so no child scan is needed
  - name: fk_rejection_rejected_from_application_status_id
    columns:
    - rejected_from_application_status_id
    ref: application_status
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Lookup never deleted.
    index_exempt: referenced reference/lookup rows are retired via is_active and never deleted, so no child scan is needed
  constraints:
  - name: ck_rejection_reinstated_after_rejected
    type: check
    expr: reinstated_at IS NULL OR reinstated_at >= rejected_at
    desc: Reinstatement after rejection.
  indexes:
  - name: uq_rejection_job_application_id_active
    columns:
    - job_application_id
    desc: At most one active rejection per application.
    unique: true
    where: reinstated_at IS NULL AND deleted_at IS NULL
  - name: idx_rejection_job_requirement_id_rejection_reason_id
    columns:
    - job_requirement_id
    - rejection_reason_id
    desc: Rejection reason analytics per requirement.
