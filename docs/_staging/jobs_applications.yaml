- name: job_template
  kind: entity
  delete_policy: soft
  volume: low
  tier: '1'
  milestones:
  - B6
  - B14
  retention: Retained while the organisation exists; soft-deleted templates purged after 2 years; no personal data.
  description: 'Reusable posting template owned by an organisation (LinkedIn/Naukri job templates, Greenhouse job templates): pre-fills a new requirement.'
  columns:
  - name: organisation_id
    type: UUID
    domain: identifier
    desc: Owning organisation (tenant).
    sens: Internal
  - name: name
    type: STRING(150)
    domain: free_text
    desc: Template name shown in the posting wizard.
    sens: Internal
  - name: job_role_id
    type: UUID
    domain: identifier
    desc: Standard job role pre-selected.
    sens: Internal
    'null': true
    null_why: NULL = template not tied to a standard role.
  - name: job_category_id
    type: UUID
    domain: identifier
    desc: Job category pre-selected (permanent, staffing, apprentice, campus, consultant marketplace, managed remote).
    sens: Internal
  - name: employment_type_id
    type: UUID
    domain: enum_ref
    desc: Employment type default.
    sens: Internal
  - name: work_type_id
    type: UUID
    domain: enum_ref
    desc: Work type default (onsite/hybrid/remote).
    sens: Internal
  - name: title_template
    type: STRING(200)
    domain: free_text
    desc: Default job title text.
    sens: Public
  - name: description_template
    type: STRING
    domain: long_text
    desc: Template job description body.
    sens: Public
    unbounded_why: Free-form rich text authored by the employer; length cannot be bounded (docket Rule 3 allows JD text).
  - name: questionnaire_id
    type: UUID
    domain: identifier
    desc: Default screening questionnaire.
    sens: Internal
    'null': true
    null_why: NULL = template carries no questionnaire.
  - name: default_attributes
    type: JSONB
    domain: json
    desc: Default skills, benefits and screening rules as JSON for the wizard.
    sens: Internal
    'null': true
    null_why: NULL = no extra defaults.
  - name: language_id
    type: UUID
    domain: identifier
    'null': true
    null_why: NULL = language of the free text is unknown (not stated by the author, not detected).
    sens: Internal
    desc: Language the free text of this row was written in, where known (Rule 7); the text is stored once in that language.
  fks:
  - name: fk_job_template_organisation_id
    columns:
    - organisation_id
    ref: organisation
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: Templates belong to the tenant and vanish with it.
  - name: fk_job_template_job_role_id
    columns:
    - job_role_id
    ref: job_role
    ref_columns:
    - id
    on_delete: SET NULL
    on_update: RESTRICT
    desc: Role retired from master data keeps the template usable.
    index_exempt: referenced reference/lookup rows are retired via is_active and never deleted, so no child scan is needed
  - name: fk_job_template_job_category_id
    columns:
    - job_category_id
    ref: job_category
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Master data never deleted.
    index_exempt: referenced reference/lookup rows are retired via is_active and never deleted, so no child scan is needed
  - name: fk_job_template_employment_type_id
    columns:
    - employment_type_id
    ref: employment_type
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Master data never deleted.
    index_exempt: referenced reference/lookup rows are retired via is_active and never deleted, so no child scan is needed
  - name: fk_job_template_work_type_id
    columns:
    - work_type_id
    ref: work_type
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Master data never deleted.
    index_exempt: referenced reference/lookup rows are retired via is_active and never deleted, so no child scan is needed
  - name: fk_job_template_questionnaire
    columns:
    - organisation_id
    - questionnaire_id
    ref: questionnaire
    ref_columns:
    - organisation_id
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'Composite FK: the questionnaire must belong to the same organisation as the template.'
  - name: fk_job_template_language_id
    columns:
    - language_id
    ref: language
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Language master data is never deleted (retired via is_active).
    index_exempt: master data language rows are never deleted, so no child scan is needed
  constraints: []
  indexes:
  - name: uq_job_template_organisation_id_name
    columns:
    - organisation_id
    - name
    desc: Unique template name per organisation among live rows.
    unique: true
    where: deleted_at IS NULL
  - name: idx_job_template_questionnaire_id
    columns:
    - questionnaire_id
    desc: FK support / where-used lookup.
    where: questionnaire_id IS NOT NULL
- name: questionnaire
  kind: entity
  delete_policy: soft
  volume: medium
  tier: '1'
  milestones:
  - B6
  - B14
  - B22
  retention: Kept while any requirement references it; soft-deleted unreferenced questionnaires purged after 2 years; no candidate data.
  description: Employer-authored screening questionnaire (LinkedIn screening questions, Naukri questionnaires, Indeed screener questions). Reusable by many requirements of the same organisation.
  columns:
  - name: organisation_id
    type: UUID
    domain: identifier
    desc: Owning organisation (tenant).
    sens: Internal
  - name: title
    type: STRING(200)
    domain: free_text
    desc: Questionnaire title.
    sens: Internal
  - name: description_text
    type: STRING(1000)
    domain: free_text
    desc: Purpose or instructions.
    sens: Internal
    'null': true
    null_why: NULL = no description.
  - name: language_id
    type: UUID
    domain: identifier
    desc: Language the questions were authored in (user content stored once, Rule 7).
    sens: Internal
  - name: version_no
    type: INT4
    domain: quantity
    desc: Version counter; a locked questionnaire is cloned into a new version rather than edited.
    sens: Internal
    default: '1'
  - name: is_locked
    type: BOOL
    domain: boolean
    desc: True once attached to a published requirement; questions become immutable.
    sens: Internal
    default: 'false'
  - name: is_template
    type: BOOL
    domain: boolean
    desc: True when offered as a reusable template to the organisation's recruiters.
    sens: Internal
    default: 'false'
  fks:
  - name: fk_questionnaire_organisation_id
    columns:
    - organisation_id
    ref: organisation
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: Tenant data follows the organisation.
  - name: fk_questionnaire_language_id
    columns:
    - language_id
    ref: language
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Master data never deleted.
    index_exempt: referenced reference/lookup rows are retired via is_active and never deleted, so no child scan is needed
  constraints:
  - name: uq_questionnaire_organisation_id_id
    type: unique
    columns:
    - organisation_id
    - id
    desc: Target of composite FKs proving tenant ownership.
  indexes:
  - name: uq_questionnaire_organisation_id_title_version_no
    columns:
    - organisation_id
    - title
    - version_no
    desc: One version number per title and organisation among live rows.
    unique: true
    where: deleted_at IS NULL
- name: questionnaire_question
  kind: entity
  delete_policy: hard
  volume: high
  tier: '1'
  milestones:
  - B6
  - B14
  - B22
  retention: Deleted only while the questionnaire is unlocked; locked questions kept as long as answers exist (answers FK RESTRICT).
  description: One question of a questionnaire with answer type, required and knockout flags.
  columns:
  - name: questionnaire_id
    type: UUID
    domain: identifier
    desc: Parent questionnaire.
    sens: Internal
  - name: sequence_no
    type: INT4
    domain: quantity
    desc: Display order, 1-based.
    sens: Internal
  - name: question_text
    type: STRING(1000)
    domain: free_text
    desc: Question wording.
    sens: Public
  - name: question_type_id
    type: UUID
    domain: enum_ref
    desc: Answer type.
    sens: Internal
  - name: help_text
    type: STRING(500)
    domain: free_text
    desc: Optional helper text.
    sens: Public
    'null': true
    null_why: NULL = none.
  - name: is_required
    type: BOOL
    domain: boolean
    desc: Candidate must answer.
    sens: Internal
    default: 'true'
  - name: is_knockout
    type: BOOL
    domain: boolean
    desc: A non-acceptable answer fails screening automatically.
    sens: Internal
    default: 'false'
  - name: min_number
    type: DECIMAL(18,4)
    domain: measure
    desc: Lower bound for number/rating answers.
    sens: Internal
    'null': true
    null_why: NULL = unbounded or not a numeric question.
  - name: max_number
    type: DECIMAL(18,4)
    domain: measure
    desc: Upper bound for number/rating answers.
    sens: Internal
    'null': true
    null_why: NULL = unbounded or not a numeric question.
  no_hash_why: Reads are always by questionnaire_id; inserts are UUID-random, no sequential hotspot; ~20M rows at full scale.
  fks:
  - name: fk_questionnaire_question_questionnaire_id
    columns:
    - questionnaire_id
    ref: questionnaire
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: Questions are owned by their questionnaire.
  - name: fk_questionnaire_question_question_type_id
    columns:
    - question_type_id
    ref: question_type
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Lookup never deleted.
    index_exempt: referenced reference/lookup rows are retired via is_active and never deleted, so no child scan is needed
  constraints:
  - name: uq_questionnaire_question_questionnaire_id_sequence_no
    type: unique
    columns:
    - questionnaire_id
    - sequence_no
    desc: Order is unique inside a questionnaire.
  - name: uq_questionnaire_question_questionnaire_id_id
    type: unique
    columns:
    - questionnaire_id
    - id
    desc: Target of composite FK from answers (answer's question must belong to the requirement's questionnaire).
  - name: uq_questionnaire_question_id_questionnaire_id
    type: unique
    columns:
    - id
    - questionnaire_id
    desc: Target of composite FK with question first so answers can lead with question id.
  - name: ck_questionnaire_question_numeric_bounds
    type: check
    expr: min_number IS NULL OR max_number IS NULL OR min_number <= max_number
    desc: Numeric bounds ordered.
  indexes: []
- name: questionnaire_question_option
  kind: entity
  delete_policy: hard
  volume: high
  tier: '1'
  milestones:
  - B6
  - B14
  retention: Follows its question.
  description: Selectable option of a choice question, with knockout acceptability and scoring points.
  columns:
  - name: questionnaire_question_id
    type: UUID
    domain: identifier
    desc: Parent question.
    sens: Internal
  - name: sequence_no
    type: INT4
    domain: quantity
    desc: Display order.
    sens: Internal
  - name: option_text
    type: STRING(500)
    domain: free_text
    desc: Option label.
    sens: Public
  - name: is_acceptable
    type: BOOL
    domain: boolean
    desc: False = choosing this option fails a knockout question.
    sens: Internal
    default: 'true'
  - name: score_points
    type: INT2
    domain: quantity
    desc: Points awarded for ranking applicants.
    sens: Internal
    default: '0'
  no_hash_why: Reads by question id; random UUID inserts; small rows.
  fks:
  - name: fk_questionnaire_question_option_questionnaire_question_id
    columns:
    - questionnaire_question_id
    ref: questionnaire_question
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: Options die with the question.
  constraints:
  - name: uq_questionnaire_question_option_questionnaire_question_id_sequence_no
    type: unique
    columns:
    - questionnaire_question_id
    - sequence_no
    desc: Order unique inside a question.
  - name: uq_questionnaire_question_option_questionnaire_question_id_id
    type: unique
    columns:
    - questionnaire_question_id
    - id
    desc: Target of the composite FK from selected-option rows.
  indexes: []
- name: job_requirement
  kind: entity
  delete_policy: soft
  volume: high
  tier: '1'
  milestones:
  - B6
  - B7
  - B10
  - B11
  - B14
  - B15
  - B18
  - B19
  - B22
  - B23
  retention: Closed/expired requirements retained 5 years for hiring audit and analytics, then archived to cold storage and anonymised (posted_by detached); legal hold overrides. Holds no candidate personal
    data.
  description: 'A job requirement (posting) of an organisation: the central demand entity. Covers permanent, staffing, apprentice, campus, consultant-marketplace and managed-remote categories (gigs are
    a separate subsystem, D-15).'
  columns:
  - name: organisation_id
    type: UUID
    domain: identifier
    desc: Owning organisation (tenant); recruiters see it only through recruiter_organisation_mapping.
    sens: Internal
  - name: posted_by_app_user_id
    type: UUID
    domain: identifier
    desc: User who created the requirement (employer or recruiter).
    sens: Internal
  - name: job_template_id
    type: UUID
    domain: identifier
    desc: Template the requirement was created from.
    sens: Internal
    'null': true
    null_why: NULL = created from scratch.
  - name: parent_job_requirement_id
    type: UUID
    domain: identifier
    desc: Requirement this one was cloned or reposted from.
    sens: Internal
    'null': true
    null_why: NULL = original posting.
  - name: reference_code
    type: STRING(40)
    domain: free_text
    desc: Employer's own requisition number.
    sens: Public
    'null': true
    null_why: NULL = employer gave none.
  - name: external_job_ref
    type: STRING(100)
    domain: free_text
    desc: Id of this job in the legacy/ATS system named by legacy_source_system_id; unique per source system among live jobs.
    sens: Internal
    'null': true
    null_why: NULL = native posting, not migrated.
  - name: title
    type: STRING(200)
    domain: free_text
    desc: Job title as advertised.
    sens: Public
  - name: title_search
    type: STRING(200)
    domain: free_text
    desc: Lowercased title for case-insensitive prefix/trigram search.
    sens: Public
    computed: lower(title)
    stored: true
  - name: short_summary
    type: STRING(500)
    domain: free_text
    desc: One-paragraph summary for list cards.
    sens: Public
    'null': true
    null_why: NULL = not provided.
  - name: description
    type: STRING
    domain: long_text
    desc: Full job description (rich text).
    sens: Public
    unbounded_why: User-authored job description; docket Rule 3 allows unbounded JD content.
  - name: description_language_id
    type: UUID
    domain: identifier
    desc: Language the title/description were written in (Rule 7).
    sens: Internal
  - name: job_role_id
    type: UUID
    domain: identifier
    desc: Standard job role.
    sens: Internal
    'null': true
    null_why: NULL = free-form role not mapped to master data.
  - name: job_category_id
    type: UUID
    domain: identifier
    desc: 'Business category: permanent, staffing, apprentice, campus, consultant marketplace, managed remote (never gig).'
    sens: Internal
  - name: employment_type_id
    type: UUID
    domain: enum_ref
    desc: Employment type.
    sens: Internal
  - name: work_type_id
    type: UUID
    domain: enum_ref
    desc: Work type (onsite/hybrid/remote).
    sens: Internal
  - name: seniority_level_id
    type: UUID
    domain: enum_ref
    desc: Seniority level.
    sens: Internal
    'null': true
    null_why: NULL = not specified.
  - name: industry_id
    type: UUID
    domain: identifier
    desc: Industry of the hiring business.
    sens: Internal
    'null': true
    null_why: NULL = not specified.
  - name: shift_type_id
    type: UUID
    domain: enum_ref
    desc: Shift pattern.
    sens: Internal
    'null': true
    null_why: NULL = not specified / not shift based.
  - name: hiring_urgency_id
    type: UUID
    domain: enum_ref
    desc: Urgency.
    sens: Internal
    'null': true
    null_why: NULL = not specified.
  - name: apply_mode_id
    type: UUID
    domain: enum_ref
    desc: How candidates apply.
    sens: Internal
  - name: external_apply_url
    type: STRING(500)
    domain: url
    desc: Employer's own apply URL when apply_mode is external_url.
    sens: Internal
    'null': true
    null_why: NULL = applications taken on platform.
  - name: primary_country_id
    type: UUID
    domain: identifier
    desc: Country of the primary hiring location (denormalised from job_requirement_location for filters).
    sens: Internal
  - name: primary_city_id
    type: UUID
    domain: identifier
    desc: City of the primary location.
    sens: Internal
    'null': true
    null_why: NULL = remote/anywhere in country.
  - name: salary_min
