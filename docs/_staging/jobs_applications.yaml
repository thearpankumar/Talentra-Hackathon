    type: TIMESTAMPTZ
    domain: timestamp
    desc: Planned start (UTC).
    sens: Internal
  - name: scheduled_end_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Planned end (UTC).
    sens: Internal
  - name: time_zone
    type: STRING(64)
    domain: time_zone
    desc: IANA time zone name used to display the instant to the participants.
    sens: Internal
