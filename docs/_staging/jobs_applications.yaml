  retention: Active while candidate account lives; erased/anonymised on candidate erasure request (DPDP/GDPR) and 3 years after last activity per inactivity purge; aggregate funnel counts survive in analytics
    without identifiers; legal hold overrides.
  description: A scheduled interview round for an application (Greenhouse scheduled interviews, LinkedIn Talent interview scheduling).
  columns:
  - name: job_application_id
    type: UUID
    domain: identifier
    desc: Application.
    sens: Internal
  - name: job_requirement_id
    type: UUID
    domain: identifier
    desc: Requirement (composite FK).
    sens: Internal
  - name: organisation_id
    type: UUID
    domain: identifier
    desc: Tenant of the interview.
    sens: Internal
  - name: interview_panel_id
    type: UUID
    domain: identifier
    desc: Panel used.
    sens: Internal
    'null': true
    null_why: NULL = ad-hoc interviewers.
  - name: round_no
    type: INT2
    domain: quantity
    desc: Round number within the application.
    sens: Internal
  - name: interview_round_type_id
    type: UUID
    domain: enum_ref
    desc: Type of round.
    sens: Internal
  - name: interview_mode_id
    type: UUID
    domain: enum_ref
    desc: Medium.
    sens: Internal
