views:
- name: vw_live_job_requirement
  kind: view
  tables:
  - job_requirement
  - job_requirement_location
  - job_requirement_stat
  purpose: 'Public search/browse surface: live, public jobs only.'
  security: Granted to candidate/guest roles; hides organisation when is_confidential_employer; excludes soft-deleted and private visibility.
  sql_sketch: SELECT ... FROM job_requirement r WHERE r.is_live AND r.deleted_at IS NULL AND r.visibility_level_id = <public>
- name: vw_consultant_job_requirement
  kind: view
  tables:
  - job_requirement
  - job_consultant_openness
  purpose: 'Docket rule: consultants only see requirements open to consultants.'
  security: Only access path for the consultant role; requires an open window and is_live.
  sql_sketch: SELECT r.* FROM job_requirement r JOIN job_consultant_openness o ON o.job_requirement_id=r.id AND o.valid_from<=now() AND (o.valid_to IS NULL OR o.valid_to>now()) AND o.deleted_at IS NULL
    WHERE r.is_open_to_consultants AND r.is_live
- name: vw_application_pipeline
  kind: view
  tables:
  - job_application
  - application_status
  purpose: Employer pipeline board by stage for a requirement.
  security: Tenant filter on organisation_id; excludes candidates that blocked the viewer (user_block anti-join).
  sql_sketch: SELECT job_requirement_id, application_status_id, count(*) FROM job_application WHERE deleted_at IS NULL AND withdrawn_at IS NULL GROUP BY 1,2
business_rules:
- id: BR-JOB-01
  rule: Salary minimum must not exceed maximum; amounts always carry currency and period.
  mechanism_type: CHECK
  mechanism: ck_job_requirement_salary_range (salary_min <= salary_max when both present), ck_job_requirement_salary_companions, ck_job_requirement_salary_amounts_nonneg.
  tables:
  - job_requirement
  milestone: B22
- id: BR-JOB-02
  rule: An undisclosed or negotiable salary is stored as salary_disclosure_id, never as 0 or a sentinel.
  mechanism_type: FK
  mechanism: salary_disclosure_id NOT NULL FK to salary_disclosure lookup; salary_min/max nullable; the public view hides amounts unless the code is 'disclosed' (D-09).
  tables:
  - job_requirement
  milestone: B22
- id: BR-JOB-03
  rule: Experience range must be ordered and non-negative; openings >= 1 and filled <= openings.
  mechanism_type: CHECK
  mechanism: ck_job_requirement_experience_range, ck_job_requirement_experience_nonneg, ck_job_requirement_openings.
  tables:
  - job_requirement
  milestone: B22
- id: BR-JOB-04
  rule: A live job is published, not closed; expiry/closing dates are consistent with publish time.
  mechanism_type: CHECK
  mechanism: ck_job_requirement_live_requires_published, ck_job_requirement_expiry_after_publish, ck_job_requirement_closing_after_publish; is_live is set only by the publish/close service in the same txn
    as the state-history row.
  tables:
  - job_requirement
  milestone: B22
- id: BR-JOB-05
  rule: Job categories exclude gig; gig requests live in gig_request (separate subsystem).
  mechanism_type: FK
  mechanism: job_requirement.job_category_id FK to master job_category whose seed excludes gig; gig_* tables never reference job_requirement (D-15).
  tables:
  - job_requirement
  milestone: B18
- id: BR-JOB-06
  rule: Requirement employer reference code is unique per organisation.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: uq_job_requirement_organisation_id_reference_code WHERE reference_code IS NOT NULL AND deleted_at IS NULL.
  tables:
  - job_requirement
  milestone: B22
- id: BR-JOB-07
  rule: A candidate has at most one live application per requirement; a withdrawn application may be re-submitted.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: 'uq_job_application_candidate_profile_id_job_requirement_id on (candidate_profile_id, job_requirement_id) WHERE withdrawn_at IS NULL AND deleted_at IS NULL. Concurrent double-click: second
    INSERT fails with unique violation; client retries as idempotent read.'
  tables:
  - job_application
  milestone: B22
- id: BR-JOB-08
  rule: An application's position and tenant always belong to its requirement.
  mechanism_type: FK
  mechanism: Composite FKs fk_job_application_requirement (organisation_id, job_requirement_id) -> job_requirement(organisation_id, id) and fk_job_application_position (job_requirement_id, job_position_id)
    -> job_position(job_requirement_id, id).
  tables:
  - job_application
  - job_position
  milestone: B22
- id: BR-JOB-09
  rule: Questionnaire answers belong to the same requirement as their application and to the questionnaire attached to that requirement.
  mechanism_type: CHAIN_FK
  mechanism: 'questionnaire_answer composite FKs: (job_application_id, job_requirement_id) -> job_application; (job_requirement_id, questionnaire_id) -> job_requirement(id, questionnaire_id); (questionnaire_question_id,
    questionnaire_id) -> questionnaire_question(id, questionnaire_id). Selected options chained via questionnaire_answer_option composite FKs.'
  tables:
  - questionnaire_answer
  - questionnaire_answer_option
  milestone: B22
- id: BR-JOB-10
  rule: Pipeline transitions must be legal.
  mechanism_type: FK
  mechanism: 'job_application_status_history FK (from_application_status_id, to_application_status_id) -> application_status_transition (MATCH SIMPLE, first row has NULL from). Seed matrix: applied->viewed|shortlisted|rejected|withdrawn|on_hold;
    viewed->shortlisted|rejected|withdrawn|on_hold; shortlisted->interview_scheduled|offered|rejected|withdrawn|on_hold; interview_scheduled->interviewed|rejected|withdrawn|on_hold; interviewed->interview_scheduled|offered|rejected|withdrawn|on_hold;
    offered->offer_accepted|rejected|withdrawn; offer_accepted->joined|no_show|withdrawn; on_hold->any earlier active stage; terminal statuses have no outgoing rows.'
  tables:
  - job_application_status_history
  - application_status_transition
  milestone: B22
- id: BR-JOB-11
  rule: Status history is a gap-free, fork-free chain per application; the status left equals the status last entered.
  mechanism_type: CHAIN_FK
  mechanism: Unique (job_application_id, sequence_no) plus self composite FK (job_application_id, prior_sequence_no, from_application_status_id) -> (job_application_id, sequence_no, to_application_status_id);
    CHECKs ck_..._first_row, _prior_adjacent, _from_null_iff_first.
  tables:
  - job_application_status_history
  milestone: B22
- id: BR-JOB-12
  rule: job_application.application_status_id always equals the latest history row.
  mechanism_type: TXN_LOCK
  mechanism: 'Transition txn: SELECT ... FROM job_application WHERE id=$1 FOR UPDATE; read status_sequence_no; INSERT history (sequence_no = n+1); UPDATE job_application SET application_status_id, status_sequence_no=n+1
    WHERE status_sequence_no=n. A concurrent mover loses on the history unique key. Nightly JOB compares application vs MAX(history) and alerts. Declarative twin impossible without deferred FKs (not in
    CRDB).'
  tables:
  - job_application
  - job_application_status_history
  milestone: B22
- id: BR-JOB-13
  rule: Status history is append-only and records the actor.
  mechanism_type: PRIVILEGE
  mechanism: App roles hold INSERT/SELECT only on job_application_status_history; actor user in created_by, actor type in actor_kind_id; erasure job uses a separate privileged role (P5).
  tables:
  - job_application_status_history
  milestone: B22
- id: BR-JOB-14
  rule: Rejection requires a reason; reinstatement soft-deletes it.
  mechanism_type: APP_LAYER
  mechanism: application_status_transition.requires_reason enforced by the transition service; history.rejection_reason_id populated; at most one active rejection via uq_rejection_job_application_id_active.
  tables:
  - rejection
  - application_status_transition
  milestone: B22
- id: BR-JOB-15
  rule: A requirement is open to consultants only inside an open window; consultants see only such requirements.
  mechanism_type: VIEW
  mechanism: vw_consultant_job_requirement (is_open_to_consultants AND is_live AND open job_consultant_openness window); consultant role has no grant on job_requirement itself. Flag is flipped by the same
    txn that opens/closes a window; JOB closes windows at valid_to.
  tables:
  - job_requirement
  - job_consultant_openness
  milestone: B10
- id: BR-JOB-16
  rule: Only one open-ended consultant window per requirement; window end not before start.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: uq_job_consultant_openness_job_requirement_id_open WHERE valid_to IS NULL AND deleted_at IS NULL; ck_job_consultant_openness_valid_range. Overlap of bounded windows is prevented by TXN_LOCK
    on the requirement row at window creation (no exclusion constraints).
  tables:
  - job_consultant_openness
  milestone: B22
- id: BR-JOB-17
  rule: A recruiter acts only on requirements assigned to them whose organisation they are mapped to.
  mechanism_type: VIEW
  mechanism: 'vw_recruiter_job_requirement joins job_requirement_assignment (open) and recruiter_organisation_mapping with organisation equality; recruiter role has SELECT only on the view; write paths
    run through SECURITY-checked procedures that re-check the join. Open question: organisation module should expose UNIQUE(id, organisation_id) on recruiter_organisation_mapping so the equality becomes
    a composite FK.'
  tables:
  - job_requirement_assignment
  - job_requirement
  milestone: B10
- id: BR-JOB-18
  rule: At most one open primary recruiter per requirement and one open assignment per recruiter+requirement.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: uq_job_requirement_assignment_job_requirement_id_primary WHERE is_primary AND effective_to IS NULL AND deleted_at IS NULL; uq_job_requirement_assignment_job_requirement_id_recruiter.
  tables:
  - job_requirement_assignment
  milestone: B22
- id: BR-JOB-19
  rule: At most one open offer per application; offer revisions are immutable and numbered.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: uq_offer_job_application_id_open WHERE is_open AND deleted_at IS NULL; offer_revision append-only with UNIQUE(offer_id, revision_no); offer.current_revision composite FK.
  tables:
  - offer
  - offer_revision
  milestone: B22
- id: BR-JOB-20
  rule: Offer deadline is after sending and a decline reason implies a response.
  mechanism_type: CHECK
  mechanism: ck_offer_expiry_after_sent, ck_offer_response_after_sent, ck_offer_decline_reason_requires_response.
  tables:
  - offer
  milestone: B22
- id: BR-JOB-21
  rule: Interview end after start; at most one live interview per round per application.
  mechanism_type: CHECK
  mechanism: ck_interview_schedule_range, ck_interview_max_duration; uq_interview_job_application_id_round_no WHERE deleted_at IS NULL AND cancelled_at IS NULL.
  tables:
  - interview
  milestone: B22
- id: BR-JOB-22
  rule: Only assigned interviewers can submit feedback, once per interview.
  mechanism_type: FK
  mechanism: interview_feedback composite FK (interview_id, interviewer_app_user_id) -> interview_interviewer; partial unique on the pair.
  tables:
  - interview_feedback
  - interview_interviewer
  milestone: B22
- id: BR-JOB-23
  rule: One joining record per application; joined and no-show are exclusive.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: uq_joining_job_application_id WHERE deleted_at IS NULL; ck_joining_no_show_vs_joined.
  tables:
  - joining
  milestone: B22
- id: BR-JOB-24
  rule: One position fills at most one application and a filled position records both time and application.
  mechanism_type: CHECK
  mechanism: ck_job_position_fill_consistency; uq_job_position_filled_by_job_application_id WHERE filled_by_job_application_id IS NOT NULL AND deleted_at IS NULL.
  tables:
  - job_position
  milestone: B22
- id: BR-JOB-25
  rule: Position count and filled count stay consistent with openings.
  mechanism_type: TXN_LOCK
  mechanism: Position fill txn locks the job_requirement row FOR UPDATE, increments filled_count (CHECK filled_count <= openings_count), sets job_requirement_status to filled when equal.
  tables:
  - job_requirement
  - job_position
  milestone: B22
- id: BR-JOB-26
  rule: Blocked parties cannot see or act on the blocking candidate's applications; candidates cannot be shortlisted by parties they blocked.
  mechanism_type: VIEW
  mechanism: Employer/recruiter/consultant read paths use vw_application_pipeline with NOT EXISTS anti-join to user_block/organisation_block; shortlist insert path checks the same predicate in the txn.
  tables:
  - job_application
  - job_shortlist_item
  milestone: B10
- id: BR-JOB-27
  rule: Recruiters cannot register candidates; consultant/recruiter submission references an existing candidate only.
  mechanism_type: FK
  mechanism: job_application.candidate_profile_id FK to candidate_profile; submitted_by_app_user_id records the submitter; no recruiter-writable path to candidate_profile creation (administration privileges).
  tables:
  - job_application
  milestone: B10
- id: BR-JOB-28
  rule: Shortlist belongs to the same tenant as its requirement; one entry per candidate per list.
  mechanism_type: FK
  mechanism: job_shortlist composite FK (organisation_id, job_requirement_id) -> job_requirement; UNIQUE(job_shortlist_id, candidate_profile_id).
  tables:
  - job_shortlist
  - job_shortlist_item
  milestone: B22
- id: BR-JOB-29
  rule: Per-view counters never update job_requirement rows.
  mechanism_type: JOB
  mechanism: job_requirement_stat is refreshed by a batch job from job_view_event/job_share_event/job_bookmark/job_application aggregates; avoids SERIALIZABLE contention on hot requirements.
  tables:
  - job_requirement_stat
  milestone: B22
- id: BR-JOB-30
  rule: 'Retention: search/view/share events auto-expire; applications are anonymised on erasure or inactivity.'
  mechanism_type: TTL
  mechanism: Row-level TTL (ttl_expire_after) 395/400 days on candidate_job_search_history, job_view_event, job_share_event, application_view_event; erasure job deletes application children then anonymises/deletes
    the application in bounded batches.
  tables:
  - candidate_job_search_history
  - job_view_event
  - job_application
  milestone: B22
- id: BR-JOB-31
  rule: One report per user per job; one boost ledger entry consumed once.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: uq_job_report_job_requirement_id_reporter WHERE deleted_at IS NULL; uq_job_boost_wallet_ledger_entry_id.
  tables:
  - job_report
  - job_boost
  milestone: B22
- id: BR-JOB-32
  rule: External syndication is idempotent per channel.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: uq_job_syndication_job_posting_channel_id_external_posting_ref and one posting per requirement/channel.
  tables:
  - job_syndication
  milestone: B22
- id: BR-JOB-33
  rule: Tenant-scoped children carry organisation_id and must match the parent's tenant.
  mechanism_type: FK
  mechanism: Composite FKs to job_requirement(organisation_id, id) from job_application, job_shortlist, job_requirement_assignment, interview_panel; to questionnaire(organisation_id, id) from job_requirement
    and job_template.
  tables:
  - job_requirement
  - job_application
  - questionnaire
  milestone: B22
