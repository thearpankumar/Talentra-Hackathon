    type: UUID
    domain: enum_ref
    desc: Salary period (year/month/hour).
    sens: Internal
    'null': true
    null_why: NULL = no salary amounts present.
  - name: salary_disclosure_id
    type: UUID
    domain: enum_ref
    desc: 'Disclosure semantics: disclosed, undisclosed, negotiable, as per standard, not applicable (D-09).'
    sens: Internal
  - name: experience_min_months
    type: INT4
    domain: quantity
    desc: Minimum experience in months.
    sens: Internal
    'null': true
    null_why: NULL = no minimum stated (fresher friendly when 0 is not implied).
  - name: experience_max_months
    type: INT4
    domain: quantity
    desc: Maximum experience in months.
    sens: Internal
    'null': true
    null_why: NULL = no maximum stated.
  - name: openings_count
    type: INT4
    domain: quantity
    desc: Number of positions approved (sum of live job_position rows).
    sens: Internal
    default: '1'
  - name: filled_count
    type: INT4
    domain: quantity
    desc: Positions filled so far.
    sens: Internal
    default: '0'
  - name: max_applications
    type: INT4
    domain: quantity
    desc: Cap on applications after which applying closes.
    sens: Internal
    'null': true
    null_why: NULL = no cap.
  - name: is_open_to_freshers
    type: BOOL
    domain: boolean
    desc: Freshers may apply.
    sens: Internal
    default: 'false'
  - name: is_walk_in
    type: BOOL
    domain: boolean
    desc: Has walk-in sessions (see job_walk_in_session).
    sens: Internal
    default: 'false'
  - name: is_confidential_employer
    type: BOOL
    domain: boolean
    desc: Hide company name until application (confidential posting).
    sens: Internal
    default: 'false'
  - name: is_open_to_consultants
    type: BOOL
    domain: boolean
    desc: Consultants may work on it; backed by job_consultant_openness windows (BR-JOB-12).
    sens: Internal
    default: 'false'
  - name: visibility_level_id
    type: UUID
    domain: enum_ref
    desc: 'Who can see the job: public, platform members, private/invite only.'
    sens: Internal
  - name: job_publish_state_id
    type: UUID
    domain: enum_ref
    desc: Publish state.
    sens: Internal
  - name: job_requirement_status_id
    type: UUID
    domain: enum_ref
    desc: Hiring status.
    sens: Internal
  - name: job_close_reason_id
    type: UUID
    domain: enum_ref
    desc: Reason when closed or cancelled.
    sens: Internal
    'null': true
    null_why: NULL = still open.
  - name: is_live
    type: BOOL
    domain: boolean
    desc: 'Derived-by-service flag: published, not closed, not expired. Powers partial search indexes.'
    sens: Internal
    default: 'false'
  - name: published_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: When the posting went live.
    sens: Internal
    'null': true
    null_why: NULL = never published yet (draft).
  - name: expires_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Automatic expiry instant of the posting.
    sens: Internal
    'null': true
    null_why: NULL = no automatic expiry.
  - name: closing_date
    type: DATE
    domain: date
    desc: Last date to apply, as shown to candidates.
    sens: Internal
    'null': true
    null_why: NULL = open until filled.
  - name: closed_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: When hiring was closed or cancelled.
    sens: Internal
    'null': true
    null_why: NULL = not closed.
  - name: questionnaire_id
    type: UUID
    domain: identifier
    desc: Screening questionnaire used for applications.
    sens: Internal
    'null': true
    null_why: NULL = no questionnaire.
  - name: attributes
    type: JSONB
    domain: json
    desc: Extra structured attributes (perks, certifications, travel %) for inverted-index filtering.
    sens: Internal
    'null': true
    null_why: NULL = no extra attributes.
  - name: legacy_source_system_id
    type: UUID
    domain: identifier
    'null': true
    null_why: NULL = native posting (not imported from a legacy or ATS system).
    sens: Internal
    desc: Registered source system (legacy_source_system) that external_job_ref belongs to; together they identify the imported job.
  fks:
  - name: fk_job_requirement_organisation_id
