    columns:
    - document_type_id
    ref: document_type
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Master data never deleted.
    index_exempt: referenced reference/lookup rows are retired via is_active and never deleted, so no child scan is needed
  constraints:
  - name: ck_job_application_document_size_pos
    type: check
