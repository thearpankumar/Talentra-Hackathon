  - name: fk_job_requirement_questionnaire
    columns:
    - organisation_id
    - questionnaire_id
    ref: questionnaire
    ref_columns:
    - organisation_id
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'Composite FK: only a questionnaire of the same organisation can be attached (tenant-safe).'
  - name: fk_job_requirement_legacy_source_system_id
    columns:
    - legacy_source_system_id
    ref: legacy_source_system
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: A source system with imported jobs cannot be hard-deleted (it is soft-deleted/disabled).
  constraints:
  - name: uq_job_requirement_organisation_id_id
    type: unique
    columns:
    - organisation_id
    - id
    desc: Target of composite FKs proving same-tenant ownership in children.
  - name: uq_job_requirement_id_questionnaire_id
    type: unique
    columns:
    - id
    - questionnaire_id
    desc: 'Target of composite FK from questionnaire_answer: the question must belong to the requirement''s questionnaire.'
  - name: ck_job_requirement_salary_range
    type: check
    expr: salary_min IS NULL OR salary_max IS NULL OR salary_min <= salary_max
    desc: Minimum salary must not exceed maximum (docket Rule 2).
  - name: ck_job_requirement_salary_amounts_nonneg
    type: check
    expr: (salary_min IS NULL OR salary_min >= 0) AND (salary_max IS NULL OR salary_max >= 0)
    desc: No negative salaries.
  - name: ck_job_requirement_salary_companions
    type: check
    expr: (salary_min IS NULL AND salary_max IS NULL) OR (currency_id IS NOT NULL AND salary_period_id IS NOT NULL)
    desc: Amounts always come with currency and period.
  - name: ck_job_requirement_experience_range
    type: check
    expr: experience_min_months IS NULL OR experience_max_months IS NULL OR experience_min_months <= experience_max_months
    desc: Experience range ordered.
  - name: ck_job_requirement_experience_nonneg
    type: check
    expr: (experience_min_months IS NULL OR experience_min_months >= 0) AND (experience_max_months IS NULL OR experience_max_months >= 0)
    desc: Non-negative experience.
  - name: ck_job_requirement_openings
    type: check
    expr: openings_count >= 1 AND filled_count >= 0 AND filled_count <= openings_count
    desc: At least one opening; filled cannot exceed openings.
  - name: ck_job_requirement_max_applications_pos
    type: check
    expr: max_applications IS NULL OR max_applications > 0
    desc: Cap, when set, is positive.
  - name: ck_job_requirement_live_requires_published
    type: check
    expr: NOT is_live OR (published_at IS NOT NULL AND closed_at IS NULL)
    desc: A live job is published and not closed.
  - name: ck_job_requirement_expiry_after_publish
    type: check
    expr: expires_at IS NULL OR published_at IS NULL OR expires_at > published_at
    desc: Expiry after publication.
  - name: ck_job_requirement_closing_after_publish
    type: check
    expr: closing_date IS NULL OR published_at IS NULL OR closing_date >= published_at::DATE
    desc: Closing date not before publication.
  - name: ck_job_requirement_closed_has_reason_or_state
    type: check
    expr: closed_at IS NOT NULL OR job_close_reason_id IS NULL
    desc: A close reason implies closed_at.
  - name: ck_job_requirement_external_apply_url_format
    type: check
    expr: external_apply_url IS NULL OR external_apply_url ~ '^https?://'
    desc: Apply URL is http(s).
  - name: ck_job_requirement_title_not_blank
    type: check
    expr: length(btrim(title)) > 0
    desc: Title not empty.
  - name: ck_job_requirement_external_job_ref_source
    type: check
    expr: external_job_ref IS NULL OR legacy_source_system_id IS NOT NULL
    desc: An external job reference is only meaningful together with the system it comes from.
  indexes:
  - name: idx_job_requirement_organisation_id_publish_state
    columns:
    - organisation_id
    - job_publish_state_id
    - published_at DESC
    desc: 'Employer dashboard: own postings by publish state, newest first.'
  - name: uq_job_requirement_organisation_id_reference_code
    columns:
    - organisation_id
    - reference_code
    desc: Unique employer requisition number per organisation among live rows.
    unique: true
    where: reference_code IS NOT NULL AND deleted_at IS NULL
  - name: idx_job_requirement_posted_by_app_user_id_created_at
    columns:
    - posted_by_app_user_id
    - created_at DESC
    desc: A recruiter's own postings.
  - name: idx_job_requirement_primary_city_id_published_at
    columns:
    - primary_city_id
    - published_at DESC
    desc: Candidate search by city, live jobs only.
    where: is_live
    storing:
    - job_category_id
    - employment_type_id
    - title
  - name: idx_job_requirement_job_category_id_employment_type_id
    columns:
    - job_category_id
    - employment_type_id
    - published_at DESC
    desc: Browse by category and employment type, live jobs only.
    where: is_live
  - name: idx_job_requirement_job_category_id_consultant_feed
    columns:
    - job_category_id
    - published_at DESC
    desc: 'Consultant marketplace feed: live jobs open to consultants.'
    where: is_live AND is_open_to_consultants
  - name: idx_job_requirement_title_search_trgm
    columns:
    - title_search
    desc: 'Trigram index: CREATE INDEX ... USING GIN (title_search gin_trgm_ops) for ILIKE/similarity title search (D-16).'
    inverted: true
    opclass: gin_trgm_ops
  - name: idx_job_requirement_attributes
    columns:
    - attributes
    desc: JSONB inverted index for attribute filters.
    inverted: true
  - name: idx_job_requirement_published_at_hash
    columns:
    - published_at
    desc: 'Hash-sharded: global recent-jobs feed and indexer changefeed catch-up without a hot range.'
    hash: true
    bucket_count: 16
  - name: idx_job_requirement_closing_date
    columns:
    - closing_date
    desc: Expiry/closing sweep over live jobs.
    where: is_live AND closing_date IS NOT NULL
  - name: idx_job_requirement_parent_job_requirement_id
    columns:
    - parent_job_requirement_id
    desc: Lineage lookup / FK support.
    where: parent_job_requirement_id IS NOT NULL
  - name: idx_job_requirement_job_template_id
    columns:
    - job_template_id
    desc: Where-used for templates / FK support.
    where: job_template_id IS NOT NULL
  - name: idx_job_requirement_questionnaire_id
    columns:
    - questionnaire_id
    desc: Where-used for questionnaires.
    where: questionnaire_id IS NOT NULL
  - name: uq_job_requirement_legacy_source_system_id_external_job_ref
    unique: true
    columns:
    - legacy_source_system_id
    - external_job_ref
    where: external_job_ref IS NOT NULL AND deleted_at IS NULL
    desc: 'Idempotent job import: one live job per (source system, external reference); re-running a sync cannot create duplicates (gap L-01).'
- name: job_position
  kind: entity
  delete_policy: soft
  volume: high
  tier: '1'
  milestones:
  - B6
  - B14
  - B22
  retention: Retained with its requirement (5 years); no personal data.
  description: One position/opening (headcount slot) of a requirement with its own status; Greenhouse 'openings'. Fill points to the winning application.
  columns:
  - name: job_requirement_id
    type: UUID
    domain: identifier
    desc: Parent requirement.
    sens: Internal
  - name: position_number
    type: INT4
    domain: quantity
    desc: 1-based slot number within the requirement.
    sens: Internal
  - name: job_position_status_id
    type: UUID
    domain: enum_ref
    desc: Position state.
    sens: Internal
  - name: city_id
    type: UUID
    domain: identifier
    desc: Posting city for this slot when different from the requirement.
    sens: Internal
    'null': true
    null_why: NULL = same as requirement.
  - name: requisition_ref
    type: STRING(100)
    domain: free_text
    desc: HRIS/budget headcount reference.
    sens: Internal
    'null': true
    null_why: NULL = no external headcount id.
  - name: hiring_manager_app_user_id
    type: UUID
    domain: identifier
    desc: Hiring manager of the slot.
    sens: Internal
    'null': true
    null_why: NULL = not assigned.
  - name: target_joining_date
    type: DATE
    domain: date
    desc: Desired start date.
    sens: Internal
    'null': true
    null_why: NULL = no target date.
  - name: opened_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: When the slot opened.
    sens: Internal
    default: now()
  - name: filled_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: When the slot was filled.
    sens: Internal
    'null': true
    null_why: NULL = not filled.
  - name: filled_by_job_application_id
    type: UUID
    domain: identifier
    desc: Application whose candidate fills this slot.
    sens: Internal
    'null': true
    null_why: NULL = not filled.
  no_hash_why: ~3M rows at full scale; reads by requirement; random UUID PK.
  fks:
  - name: fk_job_position_job_requirement_id
    columns:
    - job_requirement_id
    ref: job_requirement
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: Slots are owned by the requirement.
  - name: fk_job_position_job_position_status_id
    columns:
    - job_position_status_id
    ref: job_position_status
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Lookup never deleted.
    index_exempt: referenced reference/lookup rows are retired via is_active and never deleted, so no child scan is needed
  - name: fk_job_position_city_id
    columns:
    - city_id
    ref: city
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Master data never deleted.
    index_exempt: referenced reference/lookup rows are retired via is_active and never deleted, so no child scan is needed
  - name: fk_job_position_hiring_manager_app_user_id
    columns:
    - hiring_manager_app_user_id
    ref: app_user
    ref_columns:
    - id
    on_delete: SET NULL
    on_update: RESTRICT
    desc: Manager account removal leaves slot unassigned.
  - name: fk_job_position_filled_by_job_application_id
    columns:
    - filled_by_job_application_id
    ref: job_application
    ref_columns:
    - id
    on_delete: SET NULL
    on_update: RESTRICT
    desc: Cyclic reference with job_application; nullable so inserts are ordered.
  constraints:
  - name: uq_job_position_job_requirement_id_position_number
    type: unique
    columns:
    - job_requirement_id
    - position_number
    desc: Slot number unique per requirement.
  - name: uq_job_position_job_requirement_id_id
    type: unique
    columns:
    - job_requirement_id
    - id
    desc: 'Target of composite FK from job_application: application''s position must belong to the same requirement.'
  - name: ck_job_position_fill_consistency
    type: check
    expr: (filled_at IS NULL) = (filled_by_job_application_id IS NULL)
    desc: Filled time and filling application go together.
  - name: ck_job_position_position_number_pos
    type: check
    expr: position_number >= 1
    desc: Positive slot numbers.
  indexes:
  - name: uq_job_position_filled_by_job_application_id
    columns:
    - filled_by_job_application_id
    desc: One application can fill one slot.
    unique: true
    where: filled_by_job_application_id IS NOT NULL AND deleted_at IS NULL
  - name: idx_job_position_job_requirement_id_job_position_status_id
    columns:
    - job_requirement_id
    - job_position_status_id
    desc: Open slots of a requirement.
  - name: idx_job_position_hiring_manager_app_user_id
    columns:
    - hiring_manager_app_user_id
    desc: Manager workload / FK support.
    where: hiring_manager_app_user_id IS NOT NULL
- name: job_requirement_skill
  kind: link
  delete_policy: hard
  volume: high
  tier: '1'
  milestones:
  - B6
  - B14
  retention: Follows the requirement; hard-deleted when edited.
  description: Skills sought by a requirement with importance and minimum proficiency (LinkedIn skills, Naukri key skills).
  columns:
  - name: job_requirement_id
    type: UUID
    domain: identifier
    desc: Requirement.
    sens: Internal
  - name: skill_id
    type: UUID
    domain: identifier
    desc: Skill from master data.
    sens: Internal
  - name: requirement_importance_id
    type: UUID
    domain: enum_ref
    desc: Mandatory/preferred/bonus.
    sens: Internal
  - name: proficiency_level_id
    type: UUID
    domain: enum_ref
    desc: Minimum proficiency.
    sens: Internal
    'null': true
    null_why: NULL = no minimum.
  - name: min_experience_months
    type: INT4
    domain: quantity
    desc: Minimum months of experience with this skill.
    sens: Internal
    'null': true
    null_why: NULL = not stated.
  - name: display_order
    type: INT2
    domain: quantity
    desc: Display order.
