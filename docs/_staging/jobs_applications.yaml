    without identifiers; legal hold overrides.
  description: Structured evaluation of an application by one evaluator, optionally tied to an interview (Greenhouse scorecards; Lever feedback).
  columns:
  - name: job_application_id
    type: UUID
    domain: identifier
    desc: Application.
    sens: Internal
  - name: job_requirement_id
    type: UUID
    domain: identifier
    desc: Requirement (composite FK).
    sens: Internal
  - name: interview_id
    type: UUID
    domain: identifier
    desc: Interview evaluated.
    sens: Internal
    'null': true
    null_why: NULL = resume/screening evaluation without interview.
  - name: evaluator_app_user_id
    type: UUID
    domain: identifier
    desc: Evaluating user.
