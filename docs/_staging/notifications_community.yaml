tables:
- name: notification_type
  kind: config
  delete_policy: hard
  volume: low
  tier: '1'
  milestones:
  - B48
  - B51
  - B54
  - B57
  retention: Reference/config data; retired with is_active=false, never deleted (history rows reference it).
  description: Catalogue of notification kinds (e.g. job_alert_match, application_status_changed, interview_scheduled, message_received). Preferences, templates and notifications all key on it.
  columns:
  - name: type_code
    type: STRING(60)
    domain: code
    sens: Internal
    desc: Stable machine code of the notification kind (lowercase snake_case).
  - name: notification_category_id
    type: UUID
    domain: enum_ref
    sens: Internal
    desc: Preference-screen / unsubscribe group of this kind.
  - name: default_notification_priority_id
    type: UUID
    domain: enum_ref
    sens: Internal
    desc: Priority applied unless the producer overrides it.
  - name: title_label_key
    type: STRING(150)
    domain: ui_label_key
    sens: Public
    desc: ui_label key of the user-visible name of this kind (translations in ui_label_translation).
  - name: description_label_key
    type: STRING(150)
    domain: ui_label_key
    sens: Public
    desc: ui_label key of the one-line description shown on the preference screen.
  - name: is_transactional
    type: BOOL
    domain: boolean
    sens: Internal
    desc: True = service message (OTP, security, receipts) that ignores opt-out and quiet hours.
    default: 'false'
  - name: is_user_configurable
    type: BOOL
    domain: boolean
    sens: Internal
    desc: True = the user can switch this kind off per channel.
    default: 'true'
  - name: supports_digest
    type: BOOL
    domain: boolean
    sens: Internal
    desc: True = the kind can be folded into a daily/weekly digest.
    default: 'false'
  - name: retention_days
    type: INT2
    domain: quantity
    sens: Internal
    desc: Days an in-app notification of this kind is kept before TTL expiry.
    default: '180'
  - name: is_active
    type: BOOL
    domain: boolean
    sens: Internal
    desc: False = kind retired; no new notifications produced.
    default: 'true'
  constraints:
  - name: uq_notification_type_type_code
    type: unique
    columns:
    - type_code
    desc: Natural key.
  - name: ck_notification_type_retention_days
    type: check
    expr: retention_days BETWEEN 7 AND 730
    desc: Bounded retention.
  - name: ck_notification_type_transactional_locked
    type: check
    expr: NOT is_transactional OR NOT is_user_configurable
    desc: A transactional kind cannot be opt-out configurable.
  indexes:
  - columns:
    - notification_category_id
    desc: List kinds per preference-screen group.
    name: idx_notification_type_notification_category_id
  fks:
  - name: fk_notification_type_notification_category_id
    columns:
    - notification_category_id
    ref: notification_category
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: referenced row must outlive this row
  - name: fk_notification_type_default_notification_priority_id
    columns:
    - default_notification_priority_id
    ref: notification_priority
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: referenced row must outlive this row
    index_exempt: lookup/config row is never deleted; low-cardinality filter column, a dedicated index would only add write cost
- name: notification_provider
  kind: config
  delete_policy: hard
  volume: low
  tier: '1'
  milestones:
  - B48
  - B51
  - B54
  - B57
  - B77
  retention: Reference/config; retired with is_active=false. Webhook secret is a vault reference only.
  description: External messaging provider account per channel (e.g. email ESP, SMS gateway, WhatsApp Business API, FCM/APNs). Platform stores delivery status only; provider owns message bodies after hand-off
    (docket Section 6).
  columns:
  - name: notification_channel_id
    type: UUID
    domain: enum_ref
    sens: Internal
    desc: Delivery channel (email, SMS, WhatsApp, push, in-app).
  - name: provider_code
    type: STRING(40)
    domain: code
    sens: Internal
    desc: Stable provider code, e.g. ses, sendgrid, twilio_sms, meta_whatsapp, fcm, apns.
  - name: display_name
    type: STRING(100)
    domain: free_text
    sens: Internal
    desc: Operator-facing name.
  - name: routing_weight
    type: INT2
    domain: quantity
    sens: Internal
    desc: Share of traffic routed here when several providers serve one channel (0-100).
    default: '100'
  - name: rate_limit_per_second
    type: INT4
    domain: quantity
    sens: Internal
    desc: Provider send ceiling used by the dispatcher; NULL means no local ceiling.
    'null': true
    null_why: NULL = provider imposes no documented ceiling.
  - name: failover_notification_provider_id
    type: UUID
    domain: identifier
    sens: Internal
    desc: Provider used when this one is unavailable.
    'null': true
    null_why: NULL = no failover configured.
  - name: supports_webhook
    type: BOOL
    domain: boolean
    sens: Internal
    desc: True = provider posts delivery receipts to provider_webhook_event.
    default: 'true'
  - name: supports_read_receipts
    type: BOOL
    domain: boolean
    sens: Internal
    desc: True = provider reports opened/read events (email open pixel, WhatsApp read).
    default: 'false'
  - name: webhook_secret_ref
    type: STRING(120)
    domain: token
    sens: Sensitive
    desc: Vault path/ARN of the webhook signing secret.
    pii: Reference to a secret held in the key vault; the secret itself is never stored in the database.
  - name: is_active
    type: BOOL
    domain: boolean
    sens: Internal
    desc: False = excluded from routing.
    default: 'true'
  constraints:
  - name: uq_notification_provider_provider_code
    type: unique
    columns:
    - provider_code
    desc: Natural key.
  - name: ck_notification_provider_routing_weight
    type: check
    expr: routing_weight BETWEEN 0 AND 100
    desc: Weight is a percentage.
  - name: ck_notification_provider_rate_limit
    type: check
    expr: rate_limit_per_second IS NULL OR rate_limit_per_second > 0
    desc: Positive ceiling.
  indexes:
  - columns:
    - notification_channel_id
    - is_active
    desc: 'Routing: active providers of a channel.'
    name: idx_notification_provider_notification_channel_id_is_active
  - name: idx_notification_provider_failover_notification_provider_id
    columns:
    - failover_notification_provider_id
    desc: FK lookup path for failover_notification_provider_id.
  fks:
  - name: fk_notification_provider_notification_channel_id
    columns:
    - notification_channel_id
    ref: notification_channel
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: referenced row must outlive this row
  - name: fk_notification_provider_failover_notification_provider_id
    columns:
    - failover_notification_provider_id
    ref: notification_provider
    ref_columns:
    - id
    on_delete: SET NULL
    on_update: RESTRICT
    desc: keep this row when the reference is removed
- name: notification_template
  kind: config
  delete_policy: soft
  volume: low
  tier: '1'
  milestones:
  - B48
  - B51
  - B54
  - B57
  retention: Versioned config; old versions kept (notifications and deliveries reference the version used). Soft-deleted after 2 years unused.
  description: Per notification kind x channel template version. Bodies live in notification_template_translation (per language); short UI strings use ui_label keys.
  columns:
  - name: notification_type_id
    type: UUID
    domain: identifier
    sens: Internal
    desc: Kind this template renders.
  - name: notification_channel_id
    type: UUID
    domain: enum_ref
    sens: Internal
    desc: Delivery channel (email, SMS, WhatsApp, push, in-app).
  - name: notification_provider_id
    type: UUID
    domain: identifier
    sens: Internal
    desc: Provider the template is registered with (e.g. WhatsApp pre-approved template).
    'null': true
    null_why: NULL = provider-neutral template.
  - name: template_code
    type: STRING(80)
    domain: code
    sens: Internal
    desc: Human-readable template code, unique per version.
  - name: version_no
    type: INT4
    domain: quantity
    sens: Internal
    desc: Monotonic version of the template for the kind and channel.
    default: '1'
  - name: provider_template_ref
    type: STRING(120)
    domain: free_text
    sens: Internal
    desc: Template identifier at the provider (e.g. SendGrid dynamic template, WhatsApp template name).
    'null': true
    null_why: NULL = rendered locally; nothing registered at the provider.
  - name: payload_schema
    type: JSONB
    domain: json
    sens: Internal
    desc: JSON schema of the payload placeholders the template accepts.
    'null': true
    null_why: NULL = no placeholders / schema not yet declared.
  - name: is_active
    type: BOOL
    domain: boolean
    sens: Internal
    desc: True = selectable for new sends.
    default: 'true'
  - name: valid_from
    type: TIMESTAMPTZ
    domain: timestamp
    sens: Internal
    desc: Start of validity.
    default: now()
  - name: valid_to
    type: TIMESTAMPTZ
    domain: timestamp
    sens: Internal
    desc: End of validity.
    'null': true
    null_why: NULL = open-ended.
  constraints:
  - name: ck_notification_template_version_no
    type: check
    expr: version_no >= 1
    desc: Positive version.
  - name: ck_notification_template_valid_range
    type: check
    expr: valid_to IS NULL OR valid_to >= valid_from
    desc: End not before start.
  indexes:
  - columns:
    - notification_type_id
    - notification_channel_id
    - version_no
    unique: true
    where: deleted_at IS NULL
    desc: One row per version.
    name: uq_notification_template_notification_type_id_notification_channel_id_version_no
  - columns:
    - notification_type_id
    - notification_channel_id
    unique: true
    where: is_active AND deleted_at IS NULL
    desc: Exactly one active template per kind and channel (P3).
    name: uq_notification_template_notification_type_id_notification_channel_id_active
  - columns:
    - template_code
    unique: true
    where: deleted_at IS NULL
    desc: Natural key.
    name: uq_notification_template_template_code
  - name: idx_notification_template_notification_provider_id
    columns:
    - notification_provider_id
    desc: FK lookup path for notification_provider_id.
  fks:
  - name: fk_notification_template_notification_type_id
    columns:
    - notification_type_id
    ref: notification_type
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: referenced row must outlive this row
  - name: fk_notification_template_notification_channel_id
    columns:
    - notification_channel_id
    ref: notification_channel
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: referenced row must outlive this row
    index_exempt: lookup/config row is never deleted; low-cardinality filter column, a dedicated index would only add write cost
  - name: fk_notification_template_notification_provider_id
    columns:
    - notification_provider_id
    ref: notification_provider
    ref_columns:
    - id
    on_delete: SET NULL
    on_update: RESTRICT
    desc: keep this row when the reference is removed
- name: notification_template_translation
  kind: config
  delete_policy: hard
  volume: low
  tier: '1'
  milestones:
  - B48
  - B51
  - B54
  - B57
  - B54
  retention: Follows the template; removed with it.
  description: 'Subject/title/body of a template in one language. Fallback: requested language, language.fallback, then English.'
  columns:
  - name: notification_template_id
    type: UUID
    domain: identifier
    sens: Internal
    desc: Template translated.
  - name: language_id
    type: UUID
    domain: identifier
    sens: Internal
    desc: Language of this text.
  - name: title_text
    type: STRING(200)
    domain: free_text
    sens: Internal
    desc: Push/in-app title.
    'null': true
    null_why: NULL = channel has no title (SMS).
  - name: subject_text
    type: STRING(300)
    domain: free_text
    sens: Internal
    desc: Email subject.
    'null': true
    null_why: NULL = channel has no subject.
  - name: body_text
    type: STRING
    domain: long_text
    sens: Internal
    desc: Template body with {{placeholders}} (HTML/markdown/plain per channel).
    unbounded_why: Email HTML templates routinely exceed 8 KB; bounded by the 256 KB application check.
  - name: is_machine_translated
    type: BOOL
    domain: boolean
    sens: Internal
    desc: True = awaiting human review.
    default: 'false'
  - name: reviewed_at
    type: TIMESTAMPTZ
    domain: timestamp
    sens: Internal
    desc: When a human reviewed the translation.
    'null': true
    null_why: NULL = not reviewed yet.
  constraints:
  - name: uq_notification_template_translation_notification_template_id_language_id
    type: unique
    columns:
    - notification_template_id
    - language_id
    desc: One translation per language.
  - name: ck_notification_template_translation_body_size
    type: check
    expr: length(body_text) <= 262144
    desc: Hard size bound.
  indexes:
  - columns:
    - language_id
    desc: Translations per language (coverage report).
    name: idx_notification_template_translation_language_id
  fks:
  - name: fk_notification_template_translation_notification_template_id
    columns:
    - notification_template_id
    ref: notification_template
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: child data follows the parent row
  - name: fk_notification_template_translation_language_id
    columns:
    - language_id
    ref: language
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: referenced row must outlive this row
- name: notification
  kind: event
  delete_policy: hard
  volume: very_high
  tier: '1'
  milestones:
  - B48
  - B51
  - B54
  - B57
  - B77
  retention: 'In-app inbox row purged by row-level TTL at expires_at (default 180 days, per notification_type.retention_days). Erasure: rows of an erased user are deleted (CASCADE).'
  description: Logical notification per recipient (the inbox item). One row per recipient and business event; physical sends per channel live in notification_delivery. Payload is minimal ids/params only;
    rendered text is never stored.
  ttl:
    expire_after: 180 days
    column: expires_at
  columns:
  - name: recipient_app_user_id
    type: UUID
    domain: identifier
    sens: Internal
    desc: Recipient user.
  - name: notification_type_id
    type: UUID
    domain: identifier
    sens: Internal
    desc: Kind of notification.
  - name: notification_priority_id
    type: UUID
    domain: enum_ref
    sens: Internal
    desc: Dispatch priority.
  - name: payload
    type: JSONB
    domain: json
    sens: Internal
    desc: Minimal template parameters (ids, counts, names already public); capped at 2 KB.
    default: '''{}'''
  - name: source_object_type
    type: STRING(40)
    domain: code
    sens: Internal
    desc: Kind of object the notification is about (job_requirement, job_application, community_post...).
    'null': true
    null_why: NULL = system notice without a source object.
  - name: source_object_ref
    type: UUID
    domain: identifier
    sens: Internal
    desc: Id of the source object (polymorphic soft reference, not an FK by design).
    'null': true
    null_why: NULL when source_object_type is NULL.
  - name: dedupe_key
    type: STRING(100)
    domain: code
    sens: Internal
    desc: Business idempotency key, e.g. job_alert_run:<uuid>; unique per recipient.
  - name: language_id
    type: UUID
    domain: identifier
    sens: Internal
    desc: Language the text is rendered in.
    'null': true
    null_why: NULL = render at read time in the recipient's preferred language.
  - name: seen_at
    type: TIMESTAMPTZ
    domain: timestamp
    sens: Internal
    desc: When the notification first appeared on screen.
    'null': true
    null_why: NULL = not yet seen.
  - name: read_at
    type: TIMESTAMPTZ
    domain: timestamp
    sens: Internal
    desc: When the user opened/read it.
    'null': true
    null_why: NULL = unread.
  - name: expires_at
    type: TIMESTAMPTZ
    domain: timestamp
    sens: Internal
    desc: TTL expiry instant.
    default: now() + INTERVAL '180 days'
  constraints:
  - name: uq_notification_recipient_app_user_id_dedupe_key
    type: unique
    columns:
    - recipient_app_user_id
    - dedupe_key
    desc: 'Producer-side idempotency: replays of the same event insert nothing.'
  - name: ck_notification_payload_size
    type: check
    expr: length(payload::STRING) <= 2048
    desc: Payload stays minimal.
  - name: ck_notification_read_after_seen
    type: check
    expr: read_at IS NULL OR seen_at IS NULL OR read_at >= seen_at
    desc: Read not before seen.
  indexes:
  - columns:
    - recipient_app_user_id
    - created_at DESC
    storing:
    - notification_type_id
    - read_at
    desc: 'Inbox page: newest first per user.'
    name: idx_notification_recipient_app_user_id_created_at
  - columns:
    - recipient_app_user_id
    - created_at DESC
    where: read_at IS NULL
    desc: Unread badge count and unread tab (partial, small).
    name: idx_notification_recipient_app_user_id_created_at_unread
  - columns:
    - expires_at
    hash: true
    bucket_count: 16
    desc: 'TTL job scan: hash-sharded so the expiry sweep does not hammer one range.'
    name: idx_notification_expires_at
  - columns:
    - created_at
    hash: true
    bucket_count: 16
    desc: Time-ordered sweeps (rollups) without a hot range.
    name: idx_notification_created_at
  - name: idx_notification_notification_type_id
    columns:
    - notification_type_id
    desc: FK lookup path for notification_type_id.
  fks:
  - name: fk_notification_recipient_app_user_id
    columns:
    - recipient_app_user_id
    ref: app_user
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: child data follows the parent row
  - name: fk_notification_notification_type_id
    columns:
    - notification_type_id
    ref: notification_type
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: referenced row must outlive this row
  - name: fk_notification_notification_priority_id
    columns:
