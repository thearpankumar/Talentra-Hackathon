- id: BR-NTF-37
  rule: Feed items are a rebuildable cache and expire.
  mechanism_type: TTL
  mechanism: ttl_expiration_expression='expires_at' (14 days); UNIQUE (recipient_app_user_id, community_post_id) makes fan-out replays no-ops.
