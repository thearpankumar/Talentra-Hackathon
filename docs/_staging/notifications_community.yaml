  - name: notification_provider_id
    type: UUID
    domain: identifier
    sens: Internal
    desc: Provider.
  - name: notification_type_id
    type: UUID
    domain: identifier
    sens: Internal
    desc: Kind.
  - name: attempted_count
    type: INT8
    domain: quantity
    sens: Internal
    desc: Delivery attempts.
  - name: sent_count
    type: INT8
    domain: quantity
    sens: Internal
    desc: Accepted by provider.
  - name: delivered_count
    type: INT8
    domain: quantity
    sens: Internal
    desc: Confirmed delivered.
  - name: opened_count
    type: INT8
    domain: quantity
    sens: Internal
    desc: Opened/read.
  - name: clicked_count
    type: INT8
    domain: quantity
    sens: Internal
    desc: Clicked.
  - name: bounced_count
    type: INT8
    domain: quantity
    sens: Internal
    desc: Bounced.
  - name: failed_count
    type: INT8
    domain: quantity
    sens: Internal
    desc: Failed.
  - name: suppressed_count
    type: INT8
    domain: quantity
    sens: Internal
    desc: Suppressed before send.
  - name: rows_digest
    type: STRING(64)
    domain: free_text
    sens: Internal
    desc: SHA-256 over the sorted delivery ids of the day slice (tamper evidence).
  - name: prev_summary_hash
    type: STRING(64)
    domain: free_text
    sens: Internal
    desc: Hash of the previous day's row for this slice.
    'null': true
    null_why: NULL = first summary of the slice.
  - name: row_hash
    type: STRING(64)
    domain: free_text
    sens: Internal
    desc: SHA-256 of this row's content plus prev_summary_hash (P5 hash chain).
  constraints:
  - name: uq_notification_delivery_daily_summary_summary_date_notification_channel_id_notification_provider_id_notification_type_id
    type: unique
    columns:
