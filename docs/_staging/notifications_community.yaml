  delete_policy: hard
  volume: high
  tier: '1'
  milestones:
  - B48
  - B51
  - B54
  - B57
  retention: Deleted with the user.
  description: Do-not-disturb window per user in the user's own time zone; the dispatcher defers non-critical sends into the window's end.
