- name: notification_delivery
  kind: event
  delete_policy: append_only
  volume: very_high
  tier: '1'
  milestones:
  - B48
  - B51
  - B54
  - B57
  - B77
  retention: Insert-only; row-level TTL at expires_at (30 days). Before expiry the daily rollup writes notification_delivery_daily_summary (audit summary row). Recipient only as HMAC.
  description: 'B57 HIGH-VOLUME WRITE PATH. One immutable row per dispatch attempt (notification x channel x attempt_no), inserted by the dispatcher in batches of ~500-1000 AFTER the provider accepted/rejected
    the send. Never updated: later receipts (delivered/bounced/opened) are inserted into notification_delivery_event. No message body is stored, only a SHA-256 digest of the rendered body for audit.'
  ttl:
    expire_after: 30 days
    column: expires_at
  columns:
  - name: notification_id
    type: UUID
    domain: identifier
    sens: Internal
    desc: Inbox notification this send belongs to.
  - name: notification_channel_id
    type: UUID
    domain: enum_ref
    sens: Internal
    desc: Delivery channel (email, SMS, WhatsApp, push, in-app).
  - name: notification_provider_id
    type: UUID
    domain: identifier
    sens: Internal
    desc: Provider selected for the attempt.
  - name: notification_template_id
    type: UUID
    domain: identifier
    sens: Internal
    desc: Template version rendered.
  - name: attempt_no
    type: INT2
    domain: quantity
    sens: Internal
    desc: 1 for the first attempt; retries increment.
    default: '1'
  - name: delivery_status_id
    type: UUID
    domain: enum_ref
    sens: Internal
    desc: 'Outcome at dispatch time only: queued, sent, deferred, failed or suppressed. Later states live in notification_delivery_event.'
  - name: idempotency_key
    type: STRING(64)
    domain: code
    sens: Internal
    desc: SHA-256 hex of notification_id|channel|attempt_no; makes the batch insert replay-safe (ON CONFLICT DO NOTHING).
  - name: provider_message_ref
    type: STRING(200)
    domain: free_text
    sens: Internal
    desc: Provider message id (SendGrid sg_message_id, Twilio MessageSid, SES MessageId); used to correlate webhooks.
    'null': true
    null_why: NULL = provider never accepted the message (failed or suppressed before hand-off).
  - name: recipient_hash
    type: STRING(64)
    domain: token
    sens: Personal
    desc: HMAC-SHA256 (keyed, peppered) of the normalised address/phone/push token, for suppression matching and audit.
    pii: Keyed hash only; the address itself is never copied here (resolved from user contact tables at send time). B77 tokenisation.
  - name: error_code
    type: STRING(60)
    domain: code
    sens: Internal
    desc: Normalised provider error code.
    'null': true
    null_why: NULL = no error.
  - name: dispatch_batch_ref
    type: UUID
    domain: identifier
    sens: Internal
    desc: Id of the worker batch (one transaction) that inserted the row; groups rows for tracing and replay.
  - name: body_digest
    type: STRING(64)
    domain: free_text
    sens: Internal
    desc: SHA-256 hex of the rendered body (audit proof without storing the body).
    'null': true
    null_why: NULL = failed before rendering.
  - name: dispatched_at
    type: TIMESTAMPTZ
    domain: timestamp
    sens: Internal
    desc: When the dispatcher sent the attempt.
    default: now()
  - name: expires_at
    type: TIMESTAMPTZ
    domain: timestamp
    sens: Internal
    desc: TTL expiry instant.
    default: now() + INTERVAL '30 days'
  constraints:
  - name: uq_notification_delivery_idempotency_key
    type: unique
    columns:
    - idempotency_key
    desc: Idempotency of the insert path (R1).
  - name: uq_notification_delivery_notification_id_notification_channel_id_attempt_no
    type: unique
    columns:
    - notification_id
    - notification_channel_id
    - attempt_no
    desc: 'Natural key: one row per attempt.'
  - name: ck_notification_delivery_attempt_no
    type: check
    expr: attempt_no BETWEEN 1 AND 10
    desc: Bounded retries.
  indexes:
  - columns:
    - notification_provider_id
    - provider_message_ref
    unique: true
    where: provider_message_ref IS NOT NULL
    desc: 'Webhook correlation: provider message id -> delivery (unique per provider).'
    name: uq_notification_delivery_notification_provider_id_provider_message_ref
  - columns:
    - dispatched_at
    hash: true
    bucket_count: 16
    desc: Time-ordered scans (rollup, ops dashboards) without a hot range.
    name: idx_notification_delivery_dispatched_at
  - columns:
    - expires_at
    hash: true
    bucket_count: 16
    desc: TTL sweep.
    name: idx_notification_delivery_expires_at
  - name: idx_notification_delivery_notification_template_id
    columns:
    - notification_template_id
    desc: FK lookup path for notification_template_id.
  fks:
  - name: fk_notification_delivery_notification_id
    columns:
    - notification_id
    ref: notification
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: child data follows the parent row
  - name: fk_notification_delivery_notification_channel_id
    columns:
    - notification_channel_id
    ref: notification_channel
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: referenced row must outlive this row
    index_exempt: lookup/config row is never deleted; low-cardinality filter column, a dedicated index would only add write cost
  - name: fk_notification_delivery_notification_provider_id
    columns:
    - notification_provider_id
    ref: notification_provider
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: referenced row must outlive this row
  - name: fk_notification_delivery_notification_template_id
    columns:
    - notification_template_id
    ref: notification_template
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: referenced row must outlive this row
  - name: fk_notification_delivery_delivery_status_id
    columns:
    - delivery_status_id
    ref: delivery_status
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: referenced row must outlive this row
    index_exempt: lookup/config row is never deleted; low-cardinality filter column, a dedicated index would only add write cost
- name: notification_delivery_event
  kind: event
  delete_policy: append_only
  volume: very_high
  tier: '1'
  milestones:
  - B48
  - B51
  - B54
  - B57
  retention: Insert-only; TTL at expires_at (30 days) together with its delivery; rolled up first into notification_delivery_daily_summary.
  description: 'One row per state change reported for a delivery (delivered, opened, clicked, bounced, complained...). Replaces UPDATE-in-place of a status column: duplicates and out-of-order callbacks
    collapse via the unique key; latest/best status = max(delivery_status.precedence).'
  ttl:
    expire_after: 30 days
    column: expires_at
  columns:
  - name: notification_delivery_id
    type: UUID
    domain: identifier
    sens: Internal
    desc: Delivery the event refers to.
  - name: delivery_status_id
    type: UUID
    domain: enum_ref
    sens: Internal
    desc: State reported.
  - name: occurred_at
    type: TIMESTAMPTZ
    domain: timestamp
    sens: Internal
    desc: Provider-reported time of the state change.
  - name: provider_event_ref
    type: STRING(128)
    domain: free_text
    sens: Internal
    desc: Provider event id (SendGrid sg_event_id; for Twilio MessageSid:MessageStatus).
    'null': true
    null_why: NULL = state set by the platform itself (e.g. expired).
  - name: expires_at
    type: TIMESTAMPTZ
    domain: timestamp
    sens: Internal
    desc: TTL expiry instant.
    default: now() + INTERVAL '30 days'
  constraints:
  - name: uq_notification_delivery_event_notification_delivery_id_delivery_status_id
    type: unique
    columns:
    - notification_delivery_id
    - delivery_status_id
    desc: 'A status is recorded once per delivery: duplicate/replayed callbacks are no-ops (R2).'
  indexes:
  - columns:
    - occurred_at
    hash: true
    bucket_count: 16
    desc: Time-ordered rollups without a hot range.
    name: idx_notification_delivery_event_occurred_at
  - columns:
    - expires_at
    hash: true
    bucket_count: 16
    desc: TTL sweep.
    name: idx_notification_delivery_event_expires_at
  fks:
  - name: fk_notification_delivery_event_notification_delivery_id
    columns:
    - notification_delivery_id
    ref: notification_delivery
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: child data follows the parent row
  - name: fk_notification_delivery_event_delivery_status_id
    columns:
    - delivery_status_id
    ref: delivery_status
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: referenced row must outlive this row
    index_exempt: lookup/config row is never deleted; low-cardinality filter column, a dedicated index would only add write cost
- name: provider_webhook_event
  kind: event
  delete_policy: append_only
  volume: very_high
  tier: '1'
  milestones:
  - B48
  - B51
  - B54
  - B57
  - B77
  retention: Insert-only; raw payload removed by TTL after 7 days; durable facts live in notification_delivery_event and the daily summary.
  description: 'Inbound delivery receipts from messaging providers, verified and stored raw for replay/forensics. Idempotency: unique (provider, provider_event_ref); SendGrid supplies sg_event_id, Twilio
    does not, so the key is MessageSid:MessageStatus.'
  ttl:
    expire_after: 7 days
    column: expires_at
  columns:
  - name: notification_provider_id
    type: UUID
    domain: identifier
    sens: Internal
    desc: Provider that sent the callback.
  - name: provider_event_ref
    type: STRING(160)
    domain: free_text
    sens: Internal
    desc: Provider event id or composed dedupe key.
  - name: event_type_code
    type: STRING(60)
    domain: code
    sens: Internal
    desc: Provider's raw event name (processed, delivered, bounce, undelivered, read...).
  - name: delivery_status_id
    type: UUID
    domain: enum_ref
    sens: Internal
    desc: Mapped platform status.
    'null': true
    null_why: NULL = event type not mapped (kept for forensics).
  - name: provider_message_ref
    type: STRING(200)
    domain: free_text
    sens: Internal
    desc: Provider message id used to find the delivery.
    'null': true
    null_why: NULL = provider omitted it (e.g. asynchronous bounce).
  - name: notification_delivery_id
    type: UUID
    domain: identifier
    sens: Internal
    desc: Matched delivery.
    'null': true
    null_why: NULL = not matched (yet); matcher retries.
  - name: occurred_at
    type: TIMESTAMPTZ
    domain: timestamp
    sens: Internal
    desc: Event time per provider.
  - name: received_at
    type: TIMESTAMPTZ
    domain: timestamp
    sens: Internal
    desc: Arrival time at the platform.
    default: now()
  - name: signature_valid
    type: BOOL
    domain: boolean
    sens: Internal
    desc: False = HMAC/signature check failed (row kept, never applied).
    default: 'true'
  - name: payload
    type: JSONB
    domain: json
    sens: Internal
    desc: Provider JSON minus message content and recipient address.
    default: '''{}'''
  - name: payload_hash
    type: STRING(64)
    domain: free_text
    sens: Internal
    desc: SHA-256 of the raw request body.
  - name: expires_at
    type: TIMESTAMPTZ
    domain: timestamp
    sens: Internal
    desc: TTL expiry instant.
    default: now() + INTERVAL '7 days'
  constraints:
  - name: uq_provider_webhook_event_notification_provider_id_provider_event_ref
    type: unique
    columns:
    - notification_provider_id
    - provider_event_ref
    desc: 'Inbound idempotency: a replayed webhook inserts nothing (R3).'
  indexes:
  - columns:
    - provider_message_ref
    where: notification_delivery_id IS NULL
    desc: Unmatched receipts awaiting correlation.
    name: idx_provider_webhook_event_provider_message_ref
  - columns:
    - received_at
    hash: true
    bucket_count: 16
    desc: Time-ordered intake without a hot range.
    name: idx_provider_webhook_event_received_at
  - columns:
    - expires_at
    hash: true
    bucket_count: 16
    desc: TTL sweep.
    name: idx_provider_webhook_event_expires_at
  - name: idx_provider_webhook_event_notification_delivery_id
    columns:
    - notification_delivery_id
    desc: FK lookup path for notification_delivery_id.
  fks:
  - name: fk_provider_webhook_event_notification_provider_id
    columns:
    - notification_provider_id
    ref: notification_provider
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: referenced row must outlive this row
  - name: fk_provider_webhook_event_delivery_status_id
    columns:
    - delivery_status_id
    ref: delivery_status
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: referenced row must outlive this row
    index_exempt: lookup/config row is never deleted; low-cardinality filter column, a dedicated index would only add write cost
  - name: fk_provider_webhook_event_notification_delivery_id
    columns:
    - notification_delivery_id
    ref: notification_delivery
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: child data follows the parent row
- name: notification_delivery_daily_summary
  kind: snapshot
  delete_policy: append_only
  volume: medium
  tier: '1'
  milestones:
  - B48
  - B57
  retention: Audit summary kept 7 years (compliance evidence that messages were sent), written before delivery rows expire; never updated.
  description: Per day x channel x provider x notification kind counts of deliveries by outcome, with a digest of the underlying delivery ids. This is the durable audit record once row-level TTL has removed
    the detail.
  no_hash_why: Medium volume (rows per day = channels x providers x kinds, < 10k)
  columns:
  - name: summary_date
    type: DATE
    domain: date
    sens: Internal
