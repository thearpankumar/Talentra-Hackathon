- name: notification_suppression
  kind: entity
  delete_policy: hard
  volume: high
  tier: '1'
  milestones:
  - B48
  - B51
  - B54
  - B57
  - B77
  retention: Held while the reason applies; lifted_at set when re-subscribed. Address stored as HMAC only; erased with the user on request (anonymised, kept as hash to honour opt-out).
  description: 'Do-not-send list per channel: hard bounces, spam complaints, unsubscribes. Checked before every send. Keyed on the recipient hash, never the clear address.'
  no_hash_why: Lookups are by uniformly distributed HMAC, so writes spread across ranges naturally
  columns:
  - name: notification_channel_id
    type: UUID
    domain: enum_ref
    sens: Internal
    desc: Delivery channel (email, SMS, WhatsApp, push, in-app).
  - name: recipient_hash
    type: STRING(64)
    domain: token
    sens: Personal
    desc: HMAC-SHA256 of the normalised address/phone.
    pii: Keyed hash only (B77); the clear address is not recoverable from this table.
  - name: suppression_reason_id
    type: UUID
    domain: enum_ref
    sens: Internal
    desc: Why it is suppressed.
  - name: notification_provider_id
    type: UUID
    domain: identifier
    sens: Internal
    desc: Provider that reported it.
    'null': true
    null_why: NULL = platform/manual entry.
  - name: app_user_id
    type: UUID
    domain: identifier
    sens: Internal
    desc: Owning user when known.
    'null': true
    null_why: NULL = address not linked to a user (e.g. invited contact).
  - name: suppressed_at
    type: TIMESTAMPTZ
    domain: timestamp
    sens: Internal
    desc: When suppression began.
    default: now()
  - name: expires_at
    type: TIMESTAMPTZ
    domain: timestamp
    sens: Internal
    desc: Auto-lift for soft suppression.
    'null': true
    null_why: NULL = permanent until lifted.
  - name: lifted_at
    type: TIMESTAMPTZ
    domain: timestamp
    sens: Internal
    desc: When it was lifted.
    'null': true
    null_why: NULL = still active.
  constraints:
  - name: ck_notification_suppression_lift_order
    type: check
    expr: lifted_at IS NULL OR lifted_at >= suppressed_at
    desc: Lifted after it began.
  indexes:
  - columns:
    - notification_channel_id
    - recipient_hash
    unique: true
    where: lifted_at IS NULL
    desc: One active suppression per channel and address; send-time point lookup (P3).
    name: uq_notification_suppression_notification_channel_id_recipient_hash
  - name: idx_notification_suppression_notification_provider_id
    columns:
    - notification_provider_id
    desc: FK lookup path for notification_provider_id.
  - name: idx_notification_suppression_app_user_id
    columns:
    - app_user_id
    desc: FK lookup path for app_user_id.
  fks:
  - name: fk_notification_suppression_notification_channel_id
    columns:
    - notification_channel_id
    ref: notification_channel
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: referenced row must outlive this row
  - name: fk_notification_suppression_suppression_reason_id
    columns:
    - suppression_reason_id
    ref: suppression_reason
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: referenced row must outlive this row
    index_exempt: lookup/config row is never deleted; low-cardinality filter column, a dedicated index would only add write cost
  - name: fk_notification_suppression_notification_provider_id
    columns:
    - notification_provider_id
    ref: notification_provider
    ref_columns:
