    - notification_channel_id
    - notification_provider_id
    - notification_type_id
    desc: One summary per slice and day; rollup job is idempotent.
  - name: ck_notification_delivery_daily_summary_counts
    type: check
    expr: sent_count <= attempted_count AND delivered_count <= sent_count
    desc: Counts are consistent.
  indexes:
