- name: job_alert_preference
  kind: entity
  delete_policy: soft
  volume: high
  tier: '1'
  milestones:
  - B48
  - B51
  - B54
  - B57
  - B54
  retention: Soft-deleted on user delete; purged 30 days after; alerts inactive for 12 months auto-paused (is_active=false). Erased with the user.
  description: 'Saved job-alert criteria (Naukri ''Job alerts'', LinkedIn ''job alert'', Monster ''search agent''): keywords, locations, skills, salary, experience, frequency and channel. Skills and locations
    are child rows so matching can use FK indexes.'
  columns:
  - name: app_user_id
    type: UUID
    domain: identifier
    sens: Internal
    desc: Alert owner.
  - name: alert_name
    type: STRING(100)
    domain: free_text
    sens: Internal
    desc: Label chosen by the user.
  - name: keyword_list
    type: JSONB
    domain: json
    sens: Internal
    desc: Up to 10 keyword/title phrases (lowercased).
    default: '''[]'''
  - name: job_category_id
    type: UUID
    domain: identifier
    sens: Internal
    desc: Restrict to a job category.
    'null': true
    null_why: NULL = any category.
  - name: industry_id
    type: UUID
    domain: identifier
    sens: Internal
    desc: Restrict to an industry.
    'null': true
    null_why: NULL = any industry.
  - name: employment_type_id
    type: UUID
    domain: enum_ref
    sens: Internal
    desc: Restrict to an employment type.
    'null': true
    null_why: NULL = any employment type.
  - name: work_type_id
    type: UUID
    domain: enum_ref
    sens: Internal
    desc: Onsite/remote/hybrid filter.
    'null': true
    null_why: NULL = any work type.
  - name: min_salary
    type: DECIMAL(18,4)
    domain: money
    sens: Internal
    desc: Lower salary bound.
    'null': true
    null_why: NULL = user set no lower bound (not zero).
  - name: max_salary
    type: DECIMAL(18,4)
    domain: money
    sens: Internal
    desc: Upper salary bound.
    'null': true
    null_why: NULL = user set no upper bound.
  - name: currency_id
    type: UUID
    domain: identifier
    sens: Internal
    desc: Currency of the salary bounds.
    'null': true
    null_why: NULL when no salary bound is set.
  - name: salary_period_id
    type: UUID
    domain: enum_ref
    sens: Internal
    desc: Per month/year etc. for the bounds.
    'null': true
    null_why: NULL when no salary bound is set.
  - name: min_experience_years
    type: INT2
    domain: quantity
    sens: Internal
    desc: Minimum experience in years.
    'null': true
    null_why: NULL = no lower bound.
  - name: max_experience_years
    type: INT2
    domain: quantity
    sens: Internal
    desc: Maximum experience in years.
    'null': true
    null_why: NULL = no upper bound.
  - name: alert_frequency_id
    type: UUID
    domain: enum_ref
    sens: Internal
    desc: Instant/daily/weekly/monthly.
  - name: notification_channel_id
    type: UUID
    domain: enum_ref
    sens: Internal
    desc: Primary delivery channel for matches.
  - name: is_active
    type: BOOL
    domain: boolean
    sens: Internal
    desc: False = paused/disabled.
    default: 'true'
  - name: paused_until_at
    type: TIMESTAMPTZ
    domain: timestamp
    sens: Internal
    desc: Snooze until.
    'null': true
    null_why: NULL = not snoozed.
  - name: last_run_at
    type: TIMESTAMPTZ
    domain: timestamp
    sens: Internal
    desc: Last completed matching run.
    'null': true
    null_why: NULL = never ran.
  constraints:
  - name: ck_job_alert_preference_salary_range
    type: check
    expr: min_salary IS NULL OR max_salary IS NULL OR min_salary <= max_salary
    desc: Min not above max.
  - name: ck_job_alert_preference_salary_context
    type: check
    expr: (min_salary IS NULL AND max_salary IS NULL) OR (currency_id IS NOT NULL AND salary_period_id IS NOT NULL)
    desc: Salary bounds need currency and period.
  - name: ck_job_alert_preference_experience_range
    type: check
    expr: min_experience_years IS NULL OR max_experience_years IS NULL OR min_experience_years <= max_experience_years
    desc: Experience range ordered.
  - name: ck_job_alert_preference_keyword_limit
    type: check
    expr: jsonb_array_length(keyword_list) <= 10
    desc: Max 10 keywords.
  - name: ck_job_alert_preference_paused_after_created
    type: check
    expr: paused_until_at IS NULL OR is_active
    desc: Snoozed only while active.
  indexes:
  - columns:
    - app_user_id
    - alert_name
    unique: true
    where: deleted_at IS NULL
    desc: One alert name per user.
    name: uq_job_alert_preference_app_user_id_alert_name
  - columns:
    - last_run_at
    hash: true
    bucket_count: 16
    where: is_active AND deleted_at IS NULL
    desc: 'Scheduler: alerts due for a run, no hot range.'
    name: idx_job_alert_preference_last_run_at
  - columns:
    - keyword_list
    inverted: true
    desc: Keyword-to-alert reverse matching when a job is published (instant alerts).
    name: idx_job_alert_preference_keyword_list
  fks:
  - name: fk_job_alert_preference_app_user_id
    columns:
    - app_user_id
    ref: app_user
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: child data follows the parent row
  - name: fk_job_alert_preference_job_category_id
    columns:
    - job_category_id
    ref: job_category
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: referenced row must outlive this row
    index_exempt: Rarely queried reverse; a dedicated index would only add write cost
  - name: fk_job_alert_preference_industry_id
    columns:
    - industry_id
    ref: industry
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
