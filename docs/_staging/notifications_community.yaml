- name: feed_item
  kind: snapshot
  delete_policy: hard
  volume: very_high
  tier: '1'
  milestones:
  - B48
  - B51
  - B54
  - B57
  retention: Row-level TTL 14 days (expires_at); a feed is a cache and can be rebuilt from follows and posts.
  description: 'Materialised feed entry. Design: hybrid fan-out. Authors with <= 5,000 followers fan out on write into this table; celebrities/company pages are merged at read time (fan-out-on-read) from
    community_post, so no author write explodes into millions of rows.'
  ttl:
    expire_after: 14 days
    column: expires_at
  columns:
  - name: recipient_app_user_id
    type: UUID
    domain: identifier
    sens: Internal
    desc: Feed owner.
  - name: community_post_id
    type: UUID
    domain: identifier
    sens: Internal
    desc: Post shown.
  - name: feed_item_source_id
    type: UUID
    domain: enum_ref
    sens: Internal
    desc: Why shown.
  - name: rank_score
    type: DECIMAL(7,4)
    domain: measure
    sens: Internal
    desc: Ranking score at insert.
  - name: expires_at
    type: TIMESTAMPTZ
    domain: timestamp
    sens: Internal
    desc: TTL expiry instant.
    default: now() + INTERVAL '14 days'
  constraints:
  - name: uq_feed_item_recipient_app_user_id_community_post_id
    type: unique
    columns:
    - recipient_app_user_id
    - community_post_id
    desc: A post appears once per feed (fan-out replays are no-ops).
  indexes:
  - columns:
    - recipient_app_user_id
    - created_at DESC
    desc: Feed page.
    name: idx_feed_item_recipient_app_user_id_created_at
  - columns:
    - community_post_id
    desc: Remove a deleted post from all feeds.
    name: idx_feed_item_community_post_id
  - columns:
    - expires_at
    hash: true
    bucket_count: 16
    desc: TTL sweep without a hot range.
    name: idx_feed_item_expires_at
  fks:
  - name: fk_feed_item_recipient_app_user_id
    columns:
    - recipient_app_user_id
    ref: app_user
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: child data follows the parent row
  - name: fk_feed_item_community_post_id
    columns:
    - community_post_id
    ref: community_post
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: child data follows the parent row
  - name: fk_feed_item_feed_item_source_id
    columns:
    - feed_item_source_id
    ref: feed_item_source
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: referenced row must outlive this row
    index_exempt: lookup/config row is never deleted; low-cardinality filter column, a dedicated index would only add write cost
