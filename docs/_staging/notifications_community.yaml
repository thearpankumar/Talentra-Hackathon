- name: message
  kind: entity
  delete_policy: soft
  volume: very_high
  tier: '1'
  milestones:
  - B48
  - B51
  - B54
  - B57
  - B77
  retention: Body ciphertext nulled (tombstone row kept) after 24 months of thread inactivity, on 'delete for everyone', or on erasure request; row-level metadata kept 5 years.
  description: Direct message. Body is envelope-encrypted at the application layer (AES-GCM, key id in body_key_ref) in addition to storage-layer encryption; DB never sees plaintext (D-17, B77). Idempotent
    on client_message_ref.
  columns:
  - name: message_thread_id
    type: UUID
    domain: identifier
    sens: Internal
    desc: Thread.
  - name: sender_app_user_id
    type: UUID
    domain: identifier
    sens: Internal
    desc: Sender.
  - name: reply_to_message_id
    type: UUID
    domain: identifier
    sens: Internal
    desc: Message being replied to.
    'null': true
    null_why: NULL = not a reply.
  - name: body_encrypted
    type: BYTES
    domain: encrypted
    sens: Personal
    desc: Ciphertext of the message body.
    'null': true
    null_why: NULL = body purged (retention, delete-for-everyone, erasure) or message is attachment-only.
    pii: AES-256-GCM envelope encryption in the application; key per thread; plaintext never stored (B77).
  - name: body_key_ref
    type: STRING(100)
    domain: code
    sens: Internal
    desc: KMS key version used to encrypt the body.
    'null': true
    null_why: NULL when body_encrypted is NULL.
  - name: client_message_ref
    type: STRING(64)
    domain: code
    sens: Internal
    desc: Client-generated idempotency token.
  - name: is_system
    type: BOOL
    domain: boolean
    sens: Internal
    desc: True = system-generated message.
    default: 'false'
  - name: edited_at
    type: TIMESTAMPTZ
    domain: timestamp
    sens: Internal
    desc: Last edit.
    'null': true
    null_why: NULL = never edited.
  - name: moderation_state_id
    type: UUID
    domain: enum_ref
    sens: Internal
    desc: Moderation state (reported messages).
  constraints:
  - name: uq_message_message_thread_id_sender_app_user_id_client_message_ref
    type: unique
    columns:
    - message_thread_id
    - sender_app_user_id
    - client_message_ref
    desc: Retried send does not duplicate the message.
  - name: ck_message_key_with_body
    type: check
    expr: body_encrypted IS NULL OR body_key_ref IS NOT NULL
    desc: Ciphertext always carries its key id.
  indexes:
  - columns:
    - message_thread_id
    - created_at DESC
    desc: Thread timeline, newest first.
    name: idx_message_message_thread_id_created_at
  - columns:
    - sender_app_user_id
    - created_at
    hash: true
    bucket_count: 16
    desc: Sender activity / abuse scans without a hot range.
    name: idx_message_sender_app_user_id_created_at
  - columns:
    - reply_to_message_id
    where: reply_to_message_id IS NOT NULL
    desc: Replies.
    name: idx_message_reply_to_message_id
  fks:
  - name: fk_message_message_thread_id
    columns:
    - message_thread_id
    ref: message_thread
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: child data follows the parent row
  - name: fk_message_sender_app_user_id
    columns:
    - sender_app_user_id
    ref: app_user
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: referenced row must outlive this row
  - name: fk_message_reply_to_message_id
    columns:
    - reply_to_message_id
    ref: message
    ref_columns:
    - id
    on_delete: SET NULL
    on_update: RESTRICT
    desc: keep this row when the reference is removed
  - name: fk_message_moderation_state_id
    columns:
    - moderation_state_id
    ref: moderation_state
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: referenced row must outlive this row
    index_exempt: lookup/config row is never deleted; low-cardinality filter column, a dedicated index would only add write cost
