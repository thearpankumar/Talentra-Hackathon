- name: job_alert_run
  kind: event
  delete_policy: append_only
  volume: very_high
  tier: '1'
  milestones:
  - B48
  - B51
  - B54
  - B57
  - B77
  retention: Insert-only; TTL 90 days (expires_at).
  description: One row per executed matching run of an alert (written at run completion, never updated). Idempotent per alert and scheduled slot.
  ttl:
    expire_after: 90 days
    column: expires_at
  columns:
  - name: job_alert_preference_id
    type: UUID
    domain: identifier
    sens: Internal
    desc: Alert executed.
  - name: scheduled_for_at
    type: TIMESTAMPTZ
    domain: timestamp
    sens: Internal
    desc: Slot the run was scheduled for.
  - name: started_at
    type: TIMESTAMPTZ
    domain: timestamp
    sens: Internal
    desc: Run start.
  - name: finished_at
    type: TIMESTAMPTZ
    domain: timestamp
    sens: Internal
    desc: Run end.
  - name: alert_run_status_id
    type: UUID
    domain: enum_ref
    sens: Internal
    desc: Outcome.
  - name: candidate_job_count
    type: INT4
    domain: quantity
    sens: Internal
    desc: Jobs scanned.
    default: '0'
  - name: match_count
    type: INT4
    domain: quantity
    sens: Internal
    desc: Matches found.
    default: '0'
  - name: notification_id
    type: UUID
    domain: identifier
    sens: Internal
    desc: Notification produced.
    'null': true
    null_why: NULL = no match or run failed.
  - name: error_code
    type: STRING(60)
    domain: code
    sens: Internal
    desc: Failure code.
    'null': true
    null_why: NULL = no error.
  - name: expires_at
    type: TIMESTAMPTZ
    domain: timestamp
    sens: Internal
    desc: TTL expiry instant.
    default: now() + INTERVAL '90 days'
  constraints:
  - name: uq_job_alert_run_job_alert_preference_id_scheduled_for_at
    type: unique
    columns:
    - job_alert_preference_id
    - scheduled_for_at
    desc: A slot runs once (idempotent scheduler).
  - name: ck_job_alert_run_run_order
    type: check
    expr: finished_at >= started_at
    desc: Run ends after it starts.
  - name: ck_job_alert_run_counts
    type: check
    expr: match_count >= 0 AND candidate_job_count >= match_count
    desc: Counts consistent.
  indexes:
  - columns:
    - scheduled_for_at
    hash: true
    bucket_count: 16
    desc: Time-ordered monitoring without a hot range.
    name: idx_job_alert_run_scheduled_for_at
  - columns:
    - expires_at
    hash: true
    bucket_count: 16
    desc: TTL sweep.
    name: idx_job_alert_run_expires_at
  - name: idx_job_alert_run_notification_id
    columns:
    - notification_id
    desc: FK lookup path for notification_id.
  fks:
  - name: fk_job_alert_run_job_alert_preference_id
    columns:
    - job_alert_preference_id
    ref: job_alert_preference
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: child data follows the parent row
  - name: fk_job_alert_run_alert_run_status_id
    columns:
    - alert_run_status_id
    ref: alert_run_status
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: referenced row must outlive this row
    index_exempt: lookup/config row is never deleted; low-cardinality filter column, a dedicated index would only add write cost
  - name: fk_job_alert_run_notification_id
    columns:
    - notification_id
    ref: notification
    ref_columns:
    - id
    on_delete: SET NULL
    on_update: RESTRICT
    desc: keep this row when the reference is removed
- name: job_alert_match
  kind: event
  delete_policy: append_only
  volume: very_high
  tier: '1'
  milestones:
  - B48
  - B51
  - B54
  - B57
  - B77
  retention: Insert-only; TTL 120 days; the unique (alert, job) key only needs to outlive the job's open period.
  description: 'Matching log: which job matched which alert in which run, with score and whether it made it into the notification. Unique per alert and job so a job is never alerted twice.'
  ttl:
    expire_after: 120 days
    column: expires_at
  columns:
  - name: job_alert_run_id
    type: UUID
    domain: identifier
    sens: Internal
    desc: Run that found it.
  - name: job_alert_preference_id
    type: UUID
    domain: identifier
    sens: Internal
    desc: Alert matched.
  - name: job_requirement_id
    type: UUID
    domain: identifier
    sens: Internal
    desc: Job matched.
  - name: match_score
    type: DECIMAL(7,4)
    domain: measure
    sens: Internal
    desc: Relevance score 0-100 from the matcher.
  - name: rank_position
    type: INT2
    domain: quantity
    sens: Internal
    desc: Position in the notification (1 = top).
  - name: included_in_notification
    type: BOOL
    domain: boolean
    sens: Internal
    desc: False = matched but cut by the per-notification cap.
    default: 'true'
  - name: expires_at
    type: TIMESTAMPTZ
    domain: timestamp
    sens: Internal
    desc: TTL expiry instant.
    default: now() + INTERVAL '120 days'
  constraints:
  - name: uq_job_alert_match_job_alert_preference_id_job_requirement_id
    type: unique
    columns:
    - job_alert_preference_id
    - job_requirement_id
    desc: A job alerts a given alert at most once.
  - name: ck_job_alert_match_score
    type: check
    expr: match_score BETWEEN 0 AND 100
    desc: Score range.
  - name: ck_job_alert_match_rank
    type: check
    expr: rank_position >= 1
    desc: Rank positive.
  indexes:
  - columns:
    - expires_at
    hash: true
    bucket_count: 16
    desc: TTL sweep.
    name: idx_job_alert_match_expires_at
  - columns:
    - created_at
    hash: true
    bucket_count: 16
    desc: Time-ordered analytics reads without a hot range.
    name: idx_job_alert_match_created_at
  - name: idx_job_alert_match_job_alert_run_id
    columns:
    - job_alert_run_id
    desc: FK lookup path for job_alert_run_id.
  - name: idx_job_alert_match_job_requirement_id
    columns:
    - job_requirement_id
    desc: FK lookup path for job_requirement_id.
  fks:
  - name: fk_job_alert_match_job_alert_run_id
    columns:
    - job_alert_run_id
    ref: job_alert_run
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: child data follows the parent row
  - name: fk_job_alert_match_job_alert_preference_id
    columns:
    - job_alert_preference_id
    ref: job_alert_preference
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: child data follows the parent row
  - name: fk_job_alert_match_job_requirement_id
    columns:
    - job_requirement_id
    ref: job_requirement
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: child data follows the parent row
