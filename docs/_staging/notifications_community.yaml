- name: community_post
  kind: entity
  delete_policy: soft
  volume: high
  tier: '1'
  milestones:
  - B48
  - B51
  - B54
  - B57
  - B77
  - B77
  retention: 'Erasure request: author columns anonymised (author_app_user_id retained as pseudonymous id, content text removed on request). Soft-deleted posts purged after 90 days; moderation evidence copied
    to moderation_case before purge.'
  description: Community feed post (text, article, media, poll, shared job). Body stored once in the author's language. Public content, but message-style PII in free text is classified Personal.
  columns:
  - name: author_app_user_id
    type: UUID
    domain: identifier
    sens: Internal
    desc: Author.
  - name: community_group_id
    type: UUID
    domain: identifier
    sens: Internal
    desc: Group posted in.
    'null': true
    null_why: NULL = personal feed post.
  - name: organisation_id
    type: UUID
    domain: identifier
    sens: Internal
    desc: Company page the post is published as.
    'null': true
    null_why: NULL = posted as an individual.
  - name: post_type_id
    type: UUID
    domain: enum_ref
    sens: Internal
    desc: Kind of post.
  - name: body_text
    type: STRING
    domain: long_text
    sens: Personal
    desc: Post body (markdown).
    pii: Free text may contain contact details; access-controlled, hidden when moderation_state hides it; erased on request.
    unbounded_why: User-authored articles; bounded to 100,000 characters by CHECK.
  - name: language_id
    type: UUID
    domain: identifier
    sens: Internal
    desc: Language the body was written in.
    'null': true
    null_why: NULL = language not detected.
  - name: visibility_level_id
    type: UUID
    domain: enum_ref
    sens: Internal
    desc: Audience of the post.
  - name: moderation_state_id
    type: UUID
    domain: enum_ref
    sens: Internal
    desc: Moderation state.
  - name: original_community_post_id
    type: UUID
    domain: identifier
    sens: Internal
    desc: Post being reshared.
    'null': true
    null_why: NULL = original post.
  - name: link_url
    type: STRING(1000)
    domain: url
    sens: Internal
    desc: Outbound link attached to the post.
    'null': true
    null_why: NULL = no link.
  - name: published_at
    type: TIMESTAMPTZ
    domain: timestamp
    sens: Internal
    desc: When the post became visible.
    'null': true
    null_why: NULL = draft.
  - name: edited_at
    type: TIMESTAMPTZ
    domain: timestamp
    sens: Internal
    desc: Last user edit.
    'null': true
    null_why: NULL = never edited.
  - name: is_pinned
    type: BOOL
    domain: boolean
    sens: Internal
    desc: Pinned at the top of its group.
    default: 'false'
  constraints:
  - name: ck_community_post_body_size
    type: check
    expr: length(body_text) <= 100000
    desc: Bounded body.
  - name: ck_community_post_published_state
    type: check
    expr: published_at IS NOT NULL OR NOT is_pinned
    desc: Drafts cannot be pinned.
  indexes:
  - columns:
    - author_app_user_id
    - published_at DESC
    where: deleted_at IS NULL
    desc: Profile activity list.
    name: idx_community_post_author_app_user_id_published_at
  - columns:
    - community_group_id
    - published_at DESC
    where: deleted_at IS NULL AND published_at IS NOT NULL
    desc: Group timeline.
    name: idx_community_post_community_group_id_published_at
  - columns:
    - published_at
    hash: true
    bucket_count: 16
    where: deleted_at IS NULL
    desc: Global recent/trending scans without a hot range.
    name: idx_community_post_published_at
  - columns:
    - body_text
    inverted: true
    opclass: gin_trgm_ops
    desc: Trigram post search (search service handles ranking, D-16).
    name: idx_community_post_body_text
  - columns:
    - original_community_post_id
    where: original_community_post_id IS NOT NULL
    desc: Reshares of a post.
    name: idx_community_post_original_community_post_id
  - name: idx_community_post_organisation_id
    columns:
    - organisation_id
    desc: FK lookup path for organisation_id.
  fks:
  - name: fk_community_post_author_app_user_id
    columns:
    - author_app_user_id
    ref: app_user
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: referenced row must outlive this row
  - name: fk_community_post_community_group_id
    columns:
    - community_group_id
    ref: community_group
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: child data follows the parent row
  - name: fk_community_post_organisation_id
    columns:
    - organisation_id
    ref: organisation
    ref_columns:
    - id
    on_delete: SET NULL
    on_update: RESTRICT
    desc: keep this row when the reference is removed
  - name: fk_community_post_post_type_id
    columns:
    - post_type_id
    ref: post_type
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: referenced row must outlive this row
    index_exempt: lookup/config row is never deleted; low-cardinality filter column, a dedicated index would only add write cost
  - name: fk_community_post_language_id
    columns:
    - language_id
    ref: language
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: referenced row must outlive this row
    index_exempt: Never queried by language; a dedicated index would only add write cost
  - name: fk_community_post_visibility_level_id
    columns:
    - visibility_level_id
    ref: visibility_level
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: referenced row must outlive this row
    index_exempt: lookup/config row is never deleted; low-cardinality filter column, a dedicated index would only add write cost
  - name: fk_community_post_moderation_state_id
    columns:
    - moderation_state_id
    ref: moderation_state
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: referenced row must outlive this row
    index_exempt: lookup/config row is never deleted; low-cardinality filter column, a dedicated index would only add write cost
  - name: fk_community_post_original_community_post_id
    columns:
    - original_community_post_id
    ref: community_post
    ref_columns:
    - id
    on_delete: SET NULL
    on_update: RESTRICT
    desc: keep this row when the reference is removed
- name: community_post_stat
  kind: snapshot
  delete_policy: hard
  volume: high
  tier: '1'
  milestones:
  - B48
  - B51
  - B54
  - B57
  retention: Rebuildable counters; deleted with the post.
  description: Denormalised counters per post, updated by a batch job from reactions/comments/shares. Keeps hot counter updates off community_post.
  no_hash_why: Keyed by random post UUID
  columns:
  - name: community_post_id
    type: UUID
    domain: identifier
    sens: Internal
    desc: Post.
  - name: reaction_count
    type: INT4
    domain: quantity
    sens: Internal
    desc: Reactions.
    default: '0'
  - name: comment_count
    type: INT4
    domain: quantity
    sens: Internal
    desc: Comments.
    default: '0'
  - name: share_count
    type: INT4
    domain: quantity
    sens: Internal
    desc: Share events.
    default: '0'
  - name: view_count
    type: INT8
    domain: quantity
    sens: Internal
    desc: Impressions (sampled).
    default: '0'
  - name: refreshed_at
    type: TIMESTAMPTZ
    domain: timestamp
    sens: Internal
    desc: Last counter refresh.
    default: now()
  constraints:
  - name: uq_community_post_stat_community_post_id
    type: unique
    columns:
    - community_post_id
    desc: One row per post.
  - name: ck_community_post_stat_non_negative
    type: check
    expr: reaction_count >= 0 AND comment_count >= 0 AND share_count >= 0 AND view_count >= 0
