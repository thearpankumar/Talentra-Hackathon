    - notification_provider_id
    desc: Provider SLA reports.
    name: idx_notification_delivery_daily_summary_notification_provider_id
  - columns:
    - notification_type_id
    desc: Per-kind reports.
    name: idx_notification_delivery_daily_summary_notification_type_id
  fks:
  - name: fk_notification_delivery_daily_summary_notification_channel_id
