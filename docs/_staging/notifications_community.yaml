views:
- name: vw_notification_delivery_latest
  kind: view
  tables:
  - notification_delivery
  - notification_delivery_event
  - delivery_status
  purpose: Best-known status per delivery (max precedence over dispatch outcome and receipt events).
  security: Staff/ops only; no recipient data.
  sql_sketch: SELECT d.id, d.notification_id, d.notification_channel_id, (array_agg(s.code ORDER BY s.precedence DESC))[1] AS status_code FROM notification_delivery d JOIN (SELECT notification_delivery_id,
    delivery_status_id FROM notification_delivery_event UNION ALL SELECT id, delivery_status_id FROM notification_delivery) e ON e.notification_delivery_id = d.id JOIN delivery_status s ON s.id = e.delivery_status_id
    GROUP BY d.id, d.notification_id, d.notification_channel_id
- name: vw_unread_notification_count
  kind: view
  tables:
  - notification
  purpose: Unread badge per recipient.
  security: Row owner only via application predicate on recipient_app_user_id.
  sql_sketch: SELECT recipient_app_user_id, count(*) AS unread_count FROM notification WHERE read_at IS NULL AND expires_at > now() GROUP BY recipient_app_user_id
- name: vw_recruiter_searchable_candidate
  kind: view
  tables:
  - privacy_setting
  - privacy_hidden_organisation
  - candidate_profile
  purpose: 'Candidates a given recruiter organisation may see in search: searchable, visibility allows it, and not hidden from that organisation.'
  security: Search and download queries must use this view; owner role has no direct SELECT on privacy_setting for recruiter roles.
  sql_sketch: SELECT p.app_user_id, h.organisation_id AS hidden_from FROM privacy_setting p LEFT JOIN privacy_hidden_organisation h ON h.app_user_id = p.app_user_id WHERE p.is_searchable_by_recruiters
- name: vw_support_ticket_sla_breach
  kind: view
  tables:
  - support_ticket
  purpose: Open tickets past their resolution or first-response deadline.
  security: Support leads.
  sql_sketch: SELECT id, ticket_number, resolution_due_at FROM support_ticket WHERE resolved_at IS NULL AND deleted_at IS NULL AND (resolution_due_at < now() OR (first_responded_at IS NULL AND first_response_due_at
    < now()))
business_rules:
- id: BR-NTF-01
  rule: A delivery attempt is recorded at most once; batch retries and worker restarts never duplicate it.
  mechanism_type: UNIQUE
  mechanism: UNIQUE (idempotency_key) = sha256(notification_id|channel|attempt_no) plus UNIQUE (notification_id, notification_channel_id, attempt_no); writers use INSERT ... ON CONFLICT DO NOTHING.
  tables:
  - notification_delivery
  milestone: B57
- id: BR-NTF-02
  rule: A provider callback is applied at most once.
  mechanism_type: UNIQUE
  mechanism: UNIQUE (notification_provider_id, provider_event_ref); webhook handler uses ON CONFLICT DO NOTHING; Twilio key is MessageSid:MessageStatus, SendGrid key is sg_event_id.
  tables:
  - provider_webhook_event
  milestone: B57
- id: BR-NTF-03
  rule: A delivery moves through each status at most once; duplicate and out-of-order receipts are harmless.
  mechanism_type: UNIQUE
  mechanism: UNIQUE (notification_delivery_id, delivery_status_id) on the insert-only event table; latest status resolved by delivery_status.precedence.
  tables:
  - notification_delivery_event
  milestone: B57
- id: BR-NTF-04
  rule: Delivery rows are never updated or deleted by application roles; detail expires by TTL only after the daily summary exists.
  mechanism_type: PRIVILEGE
  mechanism: app role gets INSERT, SELECT only on notification_delivery, notification_delivery_event, provider_webhook_event, notification_delivery_daily_summary; TTL job runs as the system owner.
  tables:
  - notification_delivery
  - notification_delivery_event
  - provider_webhook_event
  milestone: B57
- id: BR-NTF-05
  rule: Delivery detail is purged 30 days after dispatch (7 days for raw webhook payloads) and an audit summary row per day/channel/provider/kind survives 7 years.
  mechanism_type: TTL
  mechanism: ALTER TABLE ... SET (ttl_expiration_expression='expires_at', ttl_job_cron='@daily', ttl_select_batch_size=500, ttl_delete_batch_size=500); daily JOB writes notification_delivery_daily_summary
    (UNIQUE slice-day, idempotent) before expiry.
  tables:
  - notification_delivery
  - notification_delivery_event
  - provider_webhook_event
  - notification_delivery_daily_summary
  milestone: B57
- id: BR-NTF-06
  rule: Summary rows are tamper-evident.
  mechanism_type: APP_LAYER
  mechanism: row_hash = sha256(content || prev_summary_hash) hash chain per slice; INSERT/SELECT-only grants (P5); changefeed to an immutable sink.
  tables:
  - notification_delivery_daily_summary
  milestone: B57
- id: BR-NTF-07
  rule: Time-ordered high-volume indexes must not create hot ranges.
  mechanism_type: APP_LAYER
  mechanism: CREATE INDEX ... USING HASH WITH (bucket_count = 16) on dispatched_at, occurred_at, received_at, expires_at, created_at of the very-high-volume tables; primary keys are random UUIDs.
  tables:
  - notification
  - notification_delivery
  - notification_delivery_event
  - provider_webhook_event
  - job_alert_match
  - feed_item
  milestone: B57
- id: BR-NTF-08
  rule: The same business event notifies a recipient once.
  mechanism_type: UNIQUE
  mechanism: UNIQUE (recipient_app_user_id, dedupe_key) on notification; producers use ON CONFLICT DO NOTHING.
  tables:
  - notification
  milestone: B57
- id: BR-NTF-09
  rule: Notification payloads stay minimal (ids/params only).
  mechanism_type: CHECK
  mechanism: 'ck_notification_payload_size: length(payload::STRING) <= 2048.'
  tables:
  - notification
  milestone: B54
- id: BR-NTF-10
  rule: One preference per user, kind and channel.
  mechanism_type: UNIQUE
  mechanism: UNIQUE (app_user_id, notification_type_id, notification_channel_id).
  tables:
  - notification_preference
  milestone: B51
- id: BR-NTF-11
  rule: Transactional kinds (OTP, security, receipts) cannot be switched off by users.
  mechanism_type: CHECK
  mechanism: 'ck_notification_type_transactional_locked: NOT is_transactional OR NOT is_user_configurable; send path ignores notification_preference for is_transactional kinds.'
  tables:
  - notification_type
  - notification_preference
  milestone: B48
- id: BR-NTF-12
  rule: No message is sent to a suppressed address or an opted-out user.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: uq_notification_suppression_notification_channel_id_recipient_hash WHERE lifted_at IS NULL gives one active row per address; dispatcher checks it (and the preference) in the same read transaction;
    blocked sends are recorded with status suppressed.
  tables:
  - notification_suppression
  - notification_delivery
  milestone: B57
- id: BR-NTF-13
  rule: Quiet hours defer non-critical sends; critical priority bypasses when allow_critical.
  mechanism_type: APP_LAYER
  mechanism: Dispatcher converts now() to quiet_period.time_zone and defers to quiet_to_time; weekday_mask CHECK 0..127; one row per user via UNIQUE (app_user_id).
  tables:
  - quiet_period
  milestone: B48
- id: BR-NTF-14
  rule: Unsubscribe links are single-purpose, hashed and expire.
  mechanism_type: UNIQUE
  mechanism: UNIQUE (token_hash); only the SHA-256 is stored; row TTL after expires_at.
  tables:
  - unsubscribe_token
  milestone: B77
- id: BR-NTF-15
  rule: Recipient addresses and phone numbers are never stored in notification tables.
  mechanism_type: APP_LAYER
  mechanism: recipient_hash/endpoint_hash are keyed HMAC-SHA256 (pepper in KMS); push endpoints envelope-encrypted; addresses resolved from contact tables at send time.
  tables:
  - notification_delivery
  - notification_suppression
  - push_subscription
  milestone: B77
- id: BR-NTF-16
  rule: A job alert has at most 10 keywords and consistent salary/experience filters.
  mechanism_type: CHECK
  mechanism: ck_job_alert_preference_keyword_limit, _salary_range, _salary_context (currency and period required when a bound exists), _experience_range.
  tables:
  - job_alert_preference
  milestone: B54
- id: BR-NTF-17
  rule: A user cannot exceed the alert limit of their entitlement.
  mechanism_type: TXN_LOCK
  mechanism: 'Txn: SELECT id FROM job_alert_preference WHERE app_user_id=$1 AND deleted_at IS NULL FOR UPDATE; compare row count with the plan entitlement; INSERT; SERIALIZABLE blocks the concurrent phantom
    insert.'
  tables:
  - job_alert_preference
  milestone: B57
- id: BR-NTF-18
  rule: An alert slot is executed once, and a job alerts the same alert once.
  mechanism_type: UNIQUE
  mechanism: UNIQUE (job_alert_preference_id, scheduled_for_at) on job_alert_run; UNIQUE (job_alert_preference_id, job_requirement_id) on job_alert_match.
  tables:
  - job_alert_run
  - job_alert_match
  milestone: B57
- id: BR-NTF-19
  rule: Exactly one language preference and one privacy setting per user.
  mechanism_type: UNIQUE
  mechanism: UNIQUE (app_user_id) on language_preference and on privacy_setting.
  tables:
  - language_preference
  - privacy_setting
  milestone: B51
- id: BR-NTF-20
  rule: Candidates not searchable or hidden from an organisation never appear in that organisation's recruiter search.
  mechanism_type: VIEW
  mechanism: Search/download queries run through vw_recruiter_searchable_candidate; recruiter roles lack direct SELECT on privacy_setting; privacy_hidden_organisation anti-join.
  tables:
  - privacy_setting
  - privacy_hidden_organisation
  milestone: B77
- id: BR-NTF-21
  rule: A user has one reaction per post.
  mechanism_type: UNIQUE
  mechanism: UNIQUE (community_post_id, app_user_id); change of reaction is an UPDATE of reaction_type_id.
  tables:
  - community_reaction
  milestone: B51
- id: BR-NTF-22
  rule: A voter may vote once in single-choice polls and once per option in multi-choice polls; the option belongs to the poll.
  mechanism_type: UNIQUE
  mechanism: UNIQUE (app_user_id, choice_slot_ref) with choice_slot_ref = poll id or option id (set in the voting txn); composite FK (community_poll_id, community_poll_option_id) -> community_poll_option(community_poll_id,
    id).
  tables:
  - community_poll_vote
  milestone: B51
- id: BR-NTF-23
  rule: A follow targets exactly one person or organisation, once.
  mechanism_type: CHECK
  mechanism: ck_community_follow_one_target num_nonnulls(...) = 1 plus two partial unique indexes (person, org).
  tables:
  - community_follow
  milestone: B51
- id: BR-NTF-24
  rule: At most one open moderation case exists per target.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: UNIQUE (report_target_type_id, target_ref) WHERE resolved_at IS NULL AND deleted_at IS NULL.
  tables:
  - moderation_case
  milestone: B51
- id: BR-NTF-25
  rule: Moderation actions are immutable.
  mechanism_type: PRIVILEGE
  mechanism: INSERT/SELECT-only on moderation_action_log; row_hash chain.
  tables:
  - moderation_action_log
  milestone: B57
- id: BR-NTF-26
  rule: Share events store only an outbound tracked link, never external post content.
  mechanism_type: APP_LAYER
  mechanism: community_share has no content columns by design; share_token UNIQUE resolves clicks; 2-year retention job.
  tables:
  - community_share
  milestone: B77
- id: BR-NTF-27
  rule: Message bodies exist only as ciphertext and a retried send never duplicates a message.
  mechanism_type: UNIQUE
  mechanism: body_encrypted BYTES (AES-GCM, key id in body_key_ref via ck_message_key_with_body); UNIQUE (message_thread_id, sender_app_user_id, client_message_ref).
  tables:
  - message
  milestone: B77
- id: BR-NTF-28
  rule: A blocked user cannot start a thread or send a message to the blocker, and message_permission is honoured.
  mechanism_type: APP_LAYER
  mechanism: Same SERIALIZABLE txn that inserts the thread/message SELECTs administration.user_block both directions and privacy_setting.message_permission_id; aborts on a hit.
  tables:
  - message_thread
  - message
  - message_thread_participant
  milestone: B51
- id: BR-NTF-29
  rule: One participation per user per thread.
  mechanism_type: UNIQUE
  mechanism: UNIQUE (message_thread_id, app_user_id).
  tables:
  - message_thread_participant
  milestone: B51
- id: BR-NTF-30
  rule: Ticket numbers are unique; exactly one active SLA policy applies per priority (and category).
  mechanism_type: PARTIAL_UNIQUE
  mechanism: Partial unique on ticket_number WHERE deleted_at IS NULL; partial unique on support_sla_policy (priority, category) and (priority) WHERE category IS NULL, active, not deleted.
  tables:
  - support_ticket
  - support_sla_policy
  milestone: B54
- id: BR-NTF-31
  rule: A ticket is rated once, 1-5, and cannot close before resolution.
  mechanism_type: CHECK
  mechanism: UNIQUE (support_ticket_id) and ck_support_csat_response_rating on support_csat_response; ck_support_ticket_resolved_order.
  tables:
  - support_csat_response
  - support_ticket
  milestone: B54
- id: BR-NTF-32
  rule: Ticket transitions are append-only history.
  mechanism_type: PRIVILEGE
  mechanism: INSERT/SELECT-only on support_ticket_status_history; app inserts a row in the same txn as every ticket_status_id change.
  tables:
  - support_ticket_status_history
  - support_ticket
  milestone: B57
- id: BR-NTF-33
  rule: FAQ and announcement text exists once per language with fallback to English.
  mechanism_type: UNIQUE
  mechanism: UNIQUE (faq_item_id, language_id); UNIQUE (announcement_id, language_id); reader falls back language.fallback -> en.
  tables:
  - faq_item_translation
  - announcement_translation
  milestone: B54
- id: BR-NTF-34
  rule: Announcement and survey windows are ordered.
  mechanism_type: CHECK
  mechanism: ends_at IS NULL OR ends_at >= starts_at.
  tables:
  - announcement
  - in_app_survey
  milestone: B54
- id: BR-NTF-35
  rule: A survey answer's question and response belong to the same survey.
  mechanism_type: FK
  mechanism: Composite FKs (survey, question)->in_app_survey_question(in_app_survey_id,id) and (response, survey)->in_app_survey_response(id,in_app_survey_id).
  tables:
  - in_app_survey_answer
  milestone: B51
- id: BR-NTF-36
  rule: A referral event is recorded once.
  mechanism_type: UNIQUE
  mechanism: UNIQUE (idempotency_key).
  tables:
  - referral_event
