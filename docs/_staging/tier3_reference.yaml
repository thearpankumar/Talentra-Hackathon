  tier: '3'
  milestones: []
  retention: Reference snapshots kept 3 years for trend analysis, then deleted by the monthly purge job; contain no personal data.
  description: 'OPTIONAL Tier 3. Grain: one row per salary benchmark x contributing source. Gives per-source attribution, sample size, median and retrieval time behind each blended row.'
