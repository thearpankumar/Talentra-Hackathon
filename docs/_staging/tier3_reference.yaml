tables:
- name: reference_data_source
  kind: entity
  delete_policy: soft
  volume: low
  tier: '3'
  milestones: []
  retention: Soft-deleted when a provider contract ends; rows kept for the life of any snapshot that cites them (7 years).
  description: 'OPTIONAL Tier 3. Grain: one row per external or internal provider of reference data (salary, company ratings, trends, cost index). Holds licence, attribution text and refresh cadence so
    every reference row can show source attribution and a refresh date (docket Section 6: ''Company review and salary data: reference only'').'
  columns:
  - name: source_code
    type: STRING(64)
    domain: code
    desc: Natural key, for example 'govt_labour_survey' or 'internal_analytics'.
    sens: Internal
  - name: source_name
    type: STRING(200)
    domain: free_text
    desc: Display name of the provider.
    sens: Public
  - name: reference_data_source_kind_id
    type: UUID
    domain: enum_ref
    desc: Kind of data the provider supplies.
    sens: Internal
  - name: publisher_name
    type: STRING(200)
    domain: free_text
    desc: Legal name of the publisher.
    sens: Public
  - name: source_url
    type: STRING(500)
    domain: url
    desc: Provider landing page or API documentation.
    sens: Public
    'null': true
    null_why: NULL = internal source with no public page
  - name: licence_name
    type: STRING(150)
    domain: free_text
    desc: Licence or terms under which the data is used.
    sens: Internal
  - name: licence_url
    type: STRING(500)
    domain: url
    desc: Link to the licence text.
    sens: Internal
    'null': true
    null_why: NULL = bilateral contract with no public text
  - name: attribution_text
    type: STRING(500)
    domain: free_text
    desc: Text that MUST be shown next to the data in the UI.
    sens: Public
  - name: requires_attribution
    type: BOOL
    domain: boolean
    desc: Attribution must be displayed.
    sens: Internal
    default: 'true'
  - name: is_commercial_use_allowed
    type: BOOL
    domain: boolean
    desc: Licence permits commercial use.
    sens: Internal
    default: 'false'
  - name: is_internal
    type: BOOL
    domain: boolean
    desc: Computed from Talentra's own analytics (no third party).
    sens: Internal
    default: 'false'
  - name: refresh_cadence_days
    type: INT4
    domain: duration
    desc: Planned days between refreshes.
    sens: Internal
  - name: max_staleness_days
    type: INT4
    domain: duration
    desc: Beyond this age the UI hides the data instead of showing stale values (failure behaviour when the provider is unavailable).
    sens: Internal
  - name: last_refreshed_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Last successful refresh.
    sens: Internal
    'null': true
    null_why: NULL = never refreshed yet
  - name: contract_end_date
    type: DATE
    domain: date
    desc: End of the licence/contract.
    sens: Internal
    'null': true
    null_why: NULL = perpetual or internal source
  - name: is_active
    type: BOOL
    domain: boolean
    desc: Source is in use.
    sens: Internal
    default: 'true'
  constraints:
  - name: ck_reference_data_source_cadence_positive
    type: check
    expr: refresh_cadence_days >= 1 AND max_staleness_days >= refresh_cadence_days
    desc: Staleness limit must cover at least one refresh cycle
  indexes:
  - name: uq_reference_data_source_source_code
    columns:
    - source_code
    desc: Natural key among live rows.
    unique: true
    where: deleted_at IS NULL
  - name: idx_reference_data_source_reference_data_source_kind_id_is_active
    columns:
    - reference_data_source_kind_id
    - is_active
    desc: Active sources by kind.
  fks:
  - name: fk_reference_data_source_reference_data_source_kind_id
    columns:
    - reference_data_source_kind_id
    ref: reference_data_source_kind
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: lookup values are retired, never deleted'
    index_exempt: lookup with a handful of values; no reverse lookup needed
- name: reference_data_refresh
  kind: event
  delete_policy: append_only
  volume: low
  tier: '3'
  milestones: []
  retention: Kept 2 years then deleted.
  description: 'OPTIONAL Tier 3. Grain: one row per refresh run of one reference source. Gives idempotency (run_key), failure behaviour (status, error) and audit of the integration boundary.'
  columns:
  - name: reference_data_source_id
    type: UUID
    domain: identifier
    desc: Source refreshed.
    sens: Internal
  - name: run_key
    type: STRING(150)
    domain: code
    desc: 'Idempotency key: source_code|retrieval window; a repeated delivery finds the same run.'
    sens: Internal
  - name: reference_refresh_status_id
    type: UUID
    domain: enum_ref
    desc: Outcome of the run.
    sens: Internal
  - name: started_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Run start.
    sens: Internal
    default: now()
  - name: finished_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Run end.
    sens: Internal
    'null': true
    null_why: NULL while running
  - name: rows_loaded
    type: INT8
    domain: quantity
    desc: Rows inserted or updated.
    sens: Internal
    default: '0'
  - name: rows_rejected
    type: INT8
    domain: quantity
    desc: Rows rejected by validation (negative salaries, ratings out of range).
    sens: Internal
    default: '0'
  - name: error_message
    type: STRING(1000)
    domain: free_text
    desc: Failure reason, no payloads.
    sens: Internal
    'null': true
    null_why: NULL when the run did not fail
  constraints:
  - name: ck_reference_data_refresh_finished_range
    type: check
    expr: finished_at IS NULL OR finished_at >= started_at
    desc: Run cannot finish before it starts
  - name: uq_reference_data_refresh_run_key
    type: unique
    columns:
    - run_key
    desc: Idempotent registration of a run.
  - name: ck_reference_data_refresh_counts_nonneg
    type: check
    expr: rows_loaded >= 0 AND rows_rejected >= 0
    desc: Counters are never negative
  indexes:
  - name: idx_reference_data_refresh_reference_data_source_id
    columns:
    - reference_data_source_id
    desc: 'Foreign-key leading index: parent-to-children lookups for this star key.'
  fks:
  - name: fk_reference_data_refresh_reference_data_source_id
    columns:
    - reference_data_source_id
    ref: reference_data_source
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: reference snapshots must not silently lose the entity they describe'
  - name: fk_reference_data_refresh_reference_refresh_status_id
    columns:
    - reference_refresh_status_id
    ref: reference_refresh_status
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: lookup values are retired, never deleted'
    index_exempt: lookup with a handful of values; no reverse lookup needed
- name: salary_benchmark
  kind: snapshot
  delete_policy: hard
  volume: medium
  tier: '3'
  milestones: []
  retention: Reference snapshots kept 3 years for trend analysis, then deleted by the monthly purge job; contain no personal data.
  description: 'OPTIONAL Tier 3. Grain: one row per job role x place (city, state or country) x experience band x industry x reference period. Blended percentile bands of annual salary; reference data only
    (never a promise of pay). Sources are listed in salary_benchmark_source.'
  columns:
  - name: benchmark_key
    type: STRING(200)
    domain: code
    desc: 'Natural key: role|industry|country|state|city|experience band|period start, built by the loader; NULL parts are written as ''-''.'
    sens: Internal
  - name: job_role_id
    type: UUID
    domain: identifier
    desc: Job role benchmarked.
    sens: Internal
  - name: industry_id
    type: UUID
    domain: identifier
    desc: Industry filter.
    sens: Internal
    'null': true
    null_why: NULL = all industries
  - name: country_id
    type: UUID
    domain: identifier
    desc: Country of the salary market.
    sens: Internal
  - name: state_region_id
    type: UUID
    domain: identifier
    desc: State or region.
    sens: Internal
    'null': true
    null_why: NULL = whole country
  - name: city_id
    type: UUID
    domain: identifier
    desc: City.
    sens: Internal
    'null': true
    null_why: NULL = state or country level
  - name: salary_experience_band_id
    type: UUID
    domain: enum_ref
    desc: Experience band.
    sens: Internal
  - name: reference_period_start_date
    type: DATE
    domain: date
    desc: Start of the period the data describes.
    sens: Internal
  - name: reference_period_end_date
    type: DATE
    domain: date
    desc: End of the period the data describes.
    sens: Internal
  - name: p10_amount
    type: DECIMAL(18,4)
    domain: money
    desc: 10th percentile of annual pay.
    sens: Internal
  - name: p25_amount
    type: DECIMAL(18,4)
    domain: money
    desc: 25th percentile.
    sens: Internal
  - name: p50_amount
    type: DECIMAL(18,4)
    domain: money
    desc: Median annual pay.
    sens: Internal
  - name: p75_amount
    type: DECIMAL(18,4)
    domain: money
    desc: 75th percentile.
    sens: Internal
  - name: p90_amount
    type: DECIMAL(18,4)
    domain: money
    desc: 90th percentile.
    sens: Internal
  - name: sample_size
    type: INT4
    domain: quantity
    desc: Observations behind the bands (minimum 30 enforced for publication).
    sens: Internal
    default: '0'
  - name: confidence_ratio
    type: DECIMAL(9,6)
    domain: ratio
    desc: Share of weight from sources with a sample size above 30 (0..1).
    sens: Internal
    'null': true
    null_why: NULL = confidence not computed
  - name: is_publishable
    type: BOOL
    domain: boolean
    desc: Meets minimum sample size and licence conditions; unpublishable rows are never shown.
    sens: Internal
    default: 'false'
  - name: refreshed_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: When this blended row was last recomputed from its sources.
    sens: Internal
  - name: currency_id
    type: UUID
    domain: identifier
    desc: Currency of every money column in this row (FK currency).
    sens: Internal
  constraints:
  - name: ck_salary_benchmark_confidence_ratio_range
    type: check
    expr: confidence_ratio IS NULL OR (confidence_ratio >= 0 AND confidence_ratio <= 1)
    desc: confidence_ratio within 0..1
  - name: ck_salary_benchmark_period_range
    type: check
    expr: reference_period_end_date >= reference_period_start_date
    desc: Period cannot end before it starts
  - name: ck_salary_benchmark_percentile_order
    type: check
    expr: p10_amount <= p25_amount AND p25_amount <= p50_amount AND p50_amount <= p75_amount AND p75_amount <= p90_amount
    desc: Percentile bands must be non-decreasing
  - name: ck_salary_benchmark_sample_nonneg
    type: check
    expr: sample_size >= 0
    desc: Sample size cannot be negative
  - name: uq_salary_benchmark_benchmark_key
    type: unique
    columns:
    - benchmark_key
    desc: One benchmark per dimensional key and period.
  - name: ck_salary_benchmark_counts_nonneg
    type: check
    expr: sample_size >= 0
    desc: Counters are never negative
  indexes:
  - name: idx_salary_benchmark_job_role_id_country_id_reference_period_start_date
    columns:
    - job_role_id
    - country_id
    - reference_period_start_date DESC
    desc: Salary lookup for a role in a market, newest first.
    storing:
    - p25_amount
    - p50_amount
    - p75_amount
    - is_publishable
    where: is_publishable
  - name: idx_salary_benchmark_country_id
    columns:
    - country_id
    desc: 'Foreign-key leading index: parent-to-children lookups for this star key.'
  fks:
  - name: fk_salary_benchmark_job_role_id
    columns:
    - job_role_id
    ref: job_role
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: reference snapshots must not silently lose the entity they describe'
  - name: fk_salary_benchmark_industry_id
    columns:
    - industry_id
    ref: industry
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: reference snapshots must not silently lose the entity they describe'
    index_exempt: industry roll-ups use the benchmark_key; no reverse lookup
  - name: fk_salary_benchmark_country_id
    columns:
    - country_id
    ref: country
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: reference snapshots must not silently lose the entity they describe'
  - name: fk_salary_benchmark_state_region_id
    columns:
    - state_region_id
    ref: state_region
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: reference snapshots must not silently lose the entity they describe'
    index_exempt: optional geographic filter; covered by benchmark_key
  - name: fk_salary_benchmark_city_id
    columns:
    - city_id
    ref: city
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: reference snapshots must not silently lose the entity they describe'
    index_exempt: optional geographic filter; covered by benchmark_key
  - name: fk_salary_benchmark_salary_experience_band_id
    columns:
    - salary_experience_band_id
    ref: salary_experience_band
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: lookup values are retired, never deleted'
    index_exempt: lookup with a handful of values; no reverse lookup needed
  - name: fk_salary_benchmark_currency_id
    columns:
    - currency_id
    ref: currency
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: currencies are never deleted'
