    ref: city
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: reference snapshots must not silently lose the entity they describe'
    index_exempt: rare base-city lookups
  - name: fk_location_cost_index_reference_data_source_id
    columns:
    - reference_data_source_id
    ref: reference_data_source
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: reference snapshots must not silently lose the entity they describe'
    index_exempt: covered by the unique key or a composite index that leads with another column; reverse lookups by this column are rare
- name: dashboard_aggregate
  kind: snapshot
  delete_policy: hard
  volume: medium
  tier: '3'
  milestones: []
  retention: Tiles are overwritten on refresh and expire 30 days after as_of_at (row-level TTL); no personal data beyond the scope key.
  description: 'OPTIONAL Tier 3. Grain: one row per dashboard tile x audience scope (platform, one organisation, one recruiter, one candidate). Pre-computed tile payload with as_of time so dashboards load
    without running aggregates; fed from the analytics layer by a scheduled job.'
  ttl:
    expire_after: 30 days
    column: as_of_at
  columns:
  - name: tile_code
    type: STRING(64)
    domain: code
    desc: Tile identifier, for example 'funnel_90d' or 'wallet_cover'.
    sens: Internal
  - name: dashboard_scope_id
    type: UUID
    domain: enum_ref
    desc: Audience scope of the tile.
    sens: Internal
  - name: scope_key
    type: STRING(80)
    domain: code
    desc: '''platform'' or ''<scope>:<uuid>'' of the organisation/recruiter/candidate; part of the natural key.'
    sens: Internal
  - name: organisation_id
    type: UUID
    domain: identifier
    desc: Organisation the tile belongs to.
    sens: Internal
    'null': true
    null_why: NULL unless the scope is organisation
  - name: tile_payload
    type: JSONB
    domain: json
    desc: Pre-computed tile content (series, totals, labels).
    sens: Internal
  - name: as_of_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Instant as of which the payload was computed (AS OF SYSTEM TIME instant of the source read).
    sens: Internal
  - name: source_dim_etl_run_id
    type: UUID
    domain: identifier
    desc: Analytics run that produced the data.
    sens: Internal
    'null': true
    null_why: NULL = tile computed outside the analytics pipeline
  - name: schema_version
    type: INT4
    domain: quantity
    desc: Payload schema version for front-end compatibility.
    sens: Internal
    default: '1'
  constraints:
  - name: uq_dashboard_aggregate_tile_scope
    type: unique
    columns:
    - tile_code
    - scope_key
    desc: One current tile per code and audience.
  indexes:
  - name: idx_dashboard_aggregate_source_dim_etl_run_id
    columns:
    - source_dim_etl_run_id
    desc: 'Foreign-key leading index: parent-to-children lookups for this star key.'
  fks:
  - name: fk_dashboard_aggregate_dashboard_scope_id
    columns:
    - dashboard_scope_id
    ref: dashboard_scope
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: lookup values are retired, never deleted'
    index_exempt: lookup with a handful of values; no reverse lookup needed
  - name: fk_dashboard_aggregate_organisation_id
    columns:
    - organisation_id
    ref: organisation
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: reference snapshots must not silently lose the entity they describe'
    index_exempt: tile reads go through the unique (tile_code, scope_key)
  - name: fk_dashboard_aggregate_source_dim_etl_run_id
    columns:
    - source_dim_etl_run_id
    ref: dim_etl_run
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: dimension members are retained for the life of the facts that reference them'
- name: feature_flag
  kind: config
  delete_policy: soft
  volume: low
  tier: '3'
  milestones: []
  retention: Soft-deleted when archived; kept 7 years for audit.
  description: 'OPTIONAL Tier 3. Grain: one row per feature flag (release toggle, kill switch, experiment, entitlement toggle). Evaluated by the application; rules, overrides and every change are in the
    child tables.'
  columns:
  - name: flag_key
    type: STRING(80)
    domain: code
    desc: Natural key used in code, for example 'gig_marketplace_v2'.
    sens: Internal
  - name: flag_name
    type: STRING(150)
    domain: free_text
    desc: Human name.
    sens: Public
  - name: description
    type: STRING(1000)
    domain: free_text
    desc: What the flag controls and the rollback plan.
    sens: Internal
  - name: feature_flag_type_id
    type: UUID
    domain: enum_ref
    desc: Purpose of the flag.
    sens: Internal
  - name: feature_flag_status_id
    type: UUID
    domain: enum_ref
    desc: Lifecycle state.
    sens: Internal
  - name: default_enabled
    type: BOOL
    domain: boolean
    desc: Value when no rule or override matches.
    sens: Internal
    default: 'false'
  - name: rollout_percent
    type: DECIMAL(5,2)
    domain: percentage
    desc: Share of the audience that gets the flag when percentage rules apply.
    sens: Internal
  - name: owner_team
    type: STRING(100)
    domain: free_text
    desc: Team accountable for removing the flag.
    sens: Internal
  - name: review_by_date
    type: DATE
    domain: date
    desc: Date by which a release flag must be removed or re-justified.
    sens: Internal
    'null': true
    null_why: NULL = permanent operational flag
  constraints:
  - name: ck_feature_flag_rollout_percent_range
    type: check
    expr: rollout_percent IS NULL OR (rollout_percent >= 0 AND rollout_percent <= 100)
    desc: rollout_percent within 0..100
  indexes:
  - name: uq_feature_flag_flag_key
    columns:
    - flag_key
    desc: Natural key among live flags.
    unique: true
    where: deleted_at IS NULL
  - name: idx_feature_flag_feature_flag_status_id
    columns:
    - feature_flag_status_id
    desc: Active flags for the evaluation cache.
    where: deleted_at IS NULL
  fks:
  - name: fk_feature_flag_feature_flag_type_id
    columns:
    - feature_flag_type_id
    ref: feature_flag_type
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: lookup values are retired, never deleted'
    index_exempt: lookup with a handful of values; no reverse lookup needed
  - name: fk_feature_flag_feature_flag_status_id
    columns:
    - feature_flag_status_id
    ref: feature_flag_status
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: lookup values are retired, never deleted'
    index_exempt: lookup with a handful of values; no reverse lookup needed
- name: feature_flag_rule
  kind: config
  delete_policy: hard
  volume: low
  tier: '3'
  milestones: []
  retention: Deleted with the flag's retirement after 7 years via the archive job.
  description: 'OPTIONAL Tier 3. Grain: one row per ordered targeting rule of a feature flag (attribute operator value). First matching rule by rule_order wins.'
  columns:
  - name: feature_flag_id
    type: UUID
    domain: identifier
    desc: Flag the rule belongs to.
    sens: Internal
  - name: rule_order
    type: INT4
    domain: quantity
    desc: Evaluation order, 1 = first.
    sens: Internal
  - name: feature_flag_attribute_id
    type: UUID
    domain: enum_ref
    desc: Attribute evaluated.
    sens: Internal
  - name: feature_flag_operator_id
    type: UUID
    domain: enum_ref
    desc: Comparison operator.
    sens: Internal
  - name: match_value
    type: JSONB
    domain: json
    desc: Value or list compared with (for percentage_bucket the percentage).
    sens: Internal
  - name: result_enabled
    type: BOOL
    domain: boolean
    desc: Flag value when the rule matches.
    sens: Internal
    default: 'true'
  - name: effective_from
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Rule active from.
    sens: Internal
    default: now()
  - name: effective_to
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Rule active until.
    sens: Internal
    'null': true
    null_why: NULL = open-ended
  constraints:
  - name: ck_feature_flag_rule_effective_range
    type: check
    expr: effective_to IS NULL OR effective_to >= effective_from
    desc: Rule window cannot be inverted
  - name: ck_feature_flag_rule_order_positive
    type: check
    expr: rule_order >= 1
    desc: Order starts at 1
  - name: uq_feature_flag_rule_order
    type: unique
    columns:
    - feature_flag_id
    - rule_order
    desc: Rule order is unique inside a flag.
  fks:
  - name: fk_feature_flag_rule_feature_flag_id
    columns:
    - feature_flag_id
    ref: feature_flag
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: 'CASCADE: child configuration rows have no meaning without the parent'
  - name: fk_feature_flag_rule_feature_flag_attribute_id
    columns:
    - feature_flag_attribute_id
    ref: feature_flag_attribute
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: lookup values are retired, never deleted'
    index_exempt: lookup with a handful of values; no reverse lookup needed
  - name: fk_feature_flag_rule_feature_flag_operator_id
    columns:
    - feature_flag_operator_id
    ref: feature_flag_operator
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: lookup values are retired, never deleted'
    index_exempt: lookup with a handful of values; no reverse lookup needed
- name: feature_flag_override
  kind: config
  delete_policy: soft
  volume: low
  tier: '3'
  milestones: []
  retention: Soft-deleted when revoked or expired; kept 2 years.
  description: 'OPTIONAL Tier 3. Grain: one row per manual override of a flag for one user or one organisation (support, canary, opt-out).'
  columns:
  - name: feature_flag_id
    type: UUID
    domain: identifier
    desc: Flag overridden.
    sens: Internal
  - name: app_user_id
    type: UUID
    domain: identifier
    desc: User the override applies to.
    sens: Internal
    'null': true
    null_why: NULL when the override targets an organisation
  - name: organisation_id
    type: UUID
    domain: identifier
    desc: Organisation the override applies to.
    sens: Internal
    'null': true
    null_why: NULL when the override targets a user
  - name: is_enabled
    type: BOOL
    domain: boolean
    desc: Forced flag value.
    sens: Internal
    default: 'true'
  - name: reason
    type: STRING(500)
    domain: free_text
    desc: Why the override was set (ticket reference).
    sens: Internal
  - name: expires_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Override end.
    sens: Internal
    'null': true
    null_why: NULL = until revoked
  constraints:
  - name: ck_feature_flag_override_one_target
    type: check
    expr: (app_user_id IS NULL) <> (organisation_id IS NULL)
    desc: Exactly one of user or organisation
  indexes:
  - name: uq_feature_flag_override_feature_flag_id_app_user_id
    columns:
    - feature_flag_id
    - app_user_id
    desc: One live override per flag and user.
    unique: true
    where: app_user_id IS NOT NULL AND deleted_at IS NULL
  - name: uq_feature_flag_override_feature_flag_id_organisation_id
    columns:
    - feature_flag_id
    - organisation_id
    desc: One live override per flag and organisation.
    unique: true
    where: organisation_id IS NOT NULL AND deleted_at IS NULL
  fks:
  - name: fk_feature_flag_override_feature_flag_id
    columns:
    - feature_flag_id
    ref: feature_flag
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: 'CASCADE: child configuration rows have no meaning without the parent'
  - name: fk_feature_flag_override_app_user_id
    columns:
    - app_user_id
    ref: app_user
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: reference snapshots must not silently lose the entity they describe'
    index_exempt: covered by the partial unique index (feature_flag_id, app_user_id)
  - name: fk_feature_flag_override_organisation_id
    columns:
    - organisation_id
    ref: organisation
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: reference snapshots must not silently lose the entity they describe'
    index_exempt: covered by the partial unique index (feature_flag_id, organisation_id)
- name: feature_flag_audit
  kind: audit
  delete_policy: append_only
  volume: low
  tier: '3'
  milestones: []
  retention: Append-only; kept 7 years with the audit trail.
  description: 'OPTIONAL Tier 3. Grain: one row per change to a feature flag, linking the flag to the platform-wide audit_event row (the single append-only audit trail) with the before and after value.'
  columns:
  - name: feature_flag_id
    type: UUID
    domain: identifier
    desc: Flag changed.
    sens: Internal
  - name: audit_event_id
    type: UUID
    domain: identifier
    desc: Entry in the platform audit trail that records who did it.
    sens: Internal
    'null': true
    null_why: NULL = the audit_event row aged out of its 400-day TTL; the flag change record is self-describing.
  - name: feature_flag_change_kind_id
    type: UUID
    domain: enum_ref
    desc: Kind of change.
    sens: Internal
  - name: before_value
    type: JSONB
    domain: json
    desc: Flag definition before the change.
    sens: Internal
    'null': true
    null_why: NULL = creation
  - name: after_value
    type: JSONB
    domain: json
    desc: Flag definition after the change.
    sens: Internal
  constraints:
  - name: uq_feature_flag_audit_audit_event
    type: unique
    columns:
    - audit_event_id
    desc: An audit event describes at most one flag change.
  indexes:
  - name: idx_feature_flag_audit_feature_flag_id
    columns:
    - feature_flag_id
    desc: 'Foreign-key leading index: parent-to-children lookups for this star key.'
  fks:
  - name: fk_feature_flag_audit_feature_flag_id
    columns:
    - feature_flag_id
    ref: feature_flag
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: reference snapshots must not silently lose the entity they describe'
  - name: fk_feature_flag_audit_audit_event_id
    columns:
    - audit_event_id
    ref: audit_event
    ref_columns:
    - id
    on_delete: SET NULL
    on_update: RESTRICT
    desc: 'SET NULL: the parent is removed by its row-level TTL (CockroachDB TTL jobs fail while a RESTRICT child exists); the child row survives with the reference cleared (decision F-01).'
    index_exempt: covered by the unique key or a composite index that leads with another column; reverse lookups by this column are rare
  - name: fk_feature_flag_audit_feature_flag_change_kind_id
    columns:
    - feature_flag_change_kind_id
    ref: feature_flag_change_kind
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: lookup values are retired, never deleted'
    index_exempt: lookup with a handful of values; no reverse lookup needed
views:
- name: vw_salary_benchmark_published
  kind: view
  tables:
  - salary_benchmark
  - reference_data_source
  purpose: Publishable salary benchmarks with attribution text and age, for the candidate and recruiter UI.
  security: readable by all authenticated roles; no personal data
  sql_sketch: SELECT b.*, s.attribution_text FROM salary_benchmark b JOIN salary_benchmark_source x ON x.salary_benchmark_id = b.id JOIN reference_data_source s ON s.id = x.reference_data_source_id WHERE
    b.is_publishable AND now() - b.refreshed_at <= make_interval(days => s.max_staleness_days)
- name: vw_company_rating_latest
  kind: view
  tables:
  - company_rating_snapshot
  - reference_data_source
  purpose: Latest displayable rating per organisation and source with attribution.
  security: authenticated roles
  sql_sketch: SELECT DISTINCT ON (organisation_id, reference_data_source_id) * FROM company_rating_snapshot WHERE is_displayable ORDER BY organisation_id, reference_data_source_id, snapshot_date DESC
- name: vw_feature_flag_effective
  kind: view
  tables:
  - feature_flag
  - feature_flag_rule
  - feature_flag_override
  purpose: Flag definitions with their live rules and overrides, read by the evaluation cache.
  security: application service role only
  sql_sketch: SELECT f.flag_key, f.default_enabled, r.* FROM feature_flag f LEFT JOIN feature_flag_rule r ON r.feature_flag_id = f.id WHERE f.deleted_at IS NULL
business_rules:
- id: BR-T3-01
  rule: Tier 3 is an optional module; nothing outside it depends on it.
  mechanism_type: FK
  mechanism: FKs point only from tier3_reference tables to other modules; no other module references a tier3_reference table; dropping the module requires no change elsewhere.
  tables:
  - salary_benchmark
  - feature_flag
  milestone: B49
- id: BR-T3-02
  rule: Every reference row shows source attribution and a refresh date.
  mechanism_type: FK
  mechanism: NOT NULL reference_data_source_id FK (RESTRICT) and NOT NULL refreshed_at/retrieved_at on benchmarks, ratings, trends, indexes.
  tables:
  - salary_benchmark_source
  - company_rating_snapshot
  - location_cost_index
  - industry_growth_snapshot
  milestone: B49
- id: BR-T3-03
  rule: Salary percentile bands are ordered and unpublished below the minimum sample.
  mechanism_type: CHECK
  mechanism: CHECK (p10_amount <= p25_amount AND ... <= p90_amount); loader sets is_publishable = (sample_size >= 30 AND source licence allows); views read is_publishable only.
  tables:
  - salary_benchmark
  milestone: B49
- id: BR-T3-04
  rule: Ratings stay in 1..5 and review counts are non-negative.
  mechanism_type: CHECK
  mechanism: CHECK (overall_rating >= 1 AND overall_rating <= 5) and sub-rating range check; recommend_percent 0..100.
  tables:
  - company_rating_snapshot
  milestone: B49
- id: BR-T3-05
  rule: One snapshot per organisation, source and date; one benchmark per key.
  mechanism_type: UNIQUE
  mechanism: UNIQUE (organisation_id, reference_data_source_id, snapshot_date); UNIQUE (benchmark_key); makes re-import an upsert.
  tables:
  - company_rating_snapshot
  - salary_benchmark
  milestone: B49
- id: BR-T3-06
  rule: A refresh run is registered once per source window.
  mechanism_type: UNIQUE
  mechanism: UNIQUE (run_key) on reference_data_refresh; INSERT ... ON CONFLICT DO NOTHING returns the existing run.
  tables:
  - reference_data_refresh
  milestone: B49
- id: BR-T3-07
  rule: Stale reference data is hidden, not shown.
  mechanism_type: VIEW
  mechanism: Views filter on now() - refreshed_at <= max_staleness_days; reference_data_source.max_staleness_days >= refresh_cadence_days by CHECK.
  tables:
  - reference_data_source
  - salary_benchmark
  milestone: B49
- id: BR-T3-08
  rule: A trending row ranks exactly one subject.
  mechanism_type: CHECK
  mechanism: CHECK that exactly one of job_role_id, skill_id, city_id, industry_id is non-NULL; unique (snapshot_date, trending_scope_id, subject_key).
  tables:
  - trending_job_snapshot
  milestone: B49
- id: BR-T3-09
  rule: Dashboard tiles are unique per code and audience and expire.
  mechanism_type: TTL
  mechanism: UNIQUE (tile_code, scope_key); ttl_expiration_expression on as_of_at + 30 days.
  tables:
  - dashboard_aggregate
  milestone: B49
- id: BR-T3-10
  rule: Feature flag keys are unique among live flags.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: CREATE UNIQUE INDEX uq_feature_flag_flag_key ON feature_flag (flag_key) WHERE deleted_at IS NULL.
  tables:
  - feature_flag
  milestone: B49
- id: BR-T3-11
  rule: Rule order is unique within a flag and rule windows are valid.
  mechanism_type: UNIQUE
  mechanism: UNIQUE (feature_flag_id, rule_order); CHECK (effective_to IS NULL OR effective_to >= effective_from).
  tables:
  - feature_flag_rule
  milestone: B49
- id: BR-T3-12
  rule: An override targets exactly one user or one organisation, one live override each.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: CHECK ((app_user_id IS NULL) <> (organisation_id IS NULL)); partial unique indexes (feature_flag_id, app_user_id) and (feature_flag_id, organisation_id) WHERE deleted_at IS NULL.
  tables:
  - feature_flag_override
  milestone: B49
- id: BR-T3-13
  rule: Every feature flag change is audited in the platform audit trail.
  mechanism_type: FK
  mechanism: feature_flag_audit.audit_event_id NOT NULL FK to audit_event (UNIQUE); the app writes both rows in one transaction; feature_flag_audit is INSERT-only.
  tables:
  - feature_flag_audit
  milestone: B49
