- name: trending_job_snapshot
  kind: snapshot
  delete_policy: hard
  volume: medium
  tier: '3'
  milestones: []
  retention: Reference snapshots kept 3 years for trend analysis, then deleted by the monthly purge job; contain no personal data.
  description: 'OPTIONAL Tier 3. Grain: one row per snapshot date x scope (role, skill, location or industry) x subject: ranked list of what is trending. Computed from Talentra analytics (reference_data_source
    ''internal_analytics'') or imported from an external trend feed.'
  columns:
  - name: snapshot_date
    type: DATE
    domain: date
    desc: Date of the ranking.
    sens: Internal
  - name: trending_scope_id
    type: UUID
    domain: enum_ref
    desc: What kind of subject is ranked.
    sens: Internal
  - name: subject_key
    type: STRING(120)
    domain: code
    desc: Natural key of the subject inside the scope (id text), used for the unique key.
    sens: Internal
  - name: job_role_id
    type: UUID
    domain: identifier
    desc: Ranked role.
    sens: Internal
    'null': true
    null_why: NULL unless scope is job_role
  - name: skill_id
    type: UUID
    domain: identifier
    desc: Ranked skill.
    sens: Internal
    'null': true
    null_why: NULL unless scope is skill
  - name: city_id
    type: UUID
    domain: identifier
    desc: Ranked location.
    sens: Internal
    'null': true
    null_why: NULL unless scope is location
  - name: industry_id
    type: UUID
    domain: identifier
    desc: Ranked industry.
    sens: Internal
    'null': true
    null_why: NULL unless scope is industry
  - name: reference_data_source_id
    type: UUID
    domain: identifier
    desc: Provider of the ranking.
    sens: Internal
  - name: rank_position
    type: INT4
    domain: quantity
    desc: Rank, 1 = hottest.
    sens: Internal
    default: '0'
  - name: previous_rank_position
    type: INT4
    domain: quantity
    desc: Rank in the previous snapshot.
    sens: Internal
    'null': true
    null_why: NULL = not ranked previously (new entrant)
  - name: postings_count
    type: INT4
    domain: quantity
    desc: Open postings supporting the rank.
    sens: Internal
    default: '0'
  - name: applications_count
    type: INT4
    domain: quantity
    desc: Applications supporting the rank.
    sens: Internal
    default: '0'
  - name: growth_ratio
    type: DECIMAL(9,4)
    domain: measure
    desc: Relative growth of postings versus the prior window (can be negative).
    sens: Internal
    'null': true
    null_why: NULL = no prior window to compare
  - name: window_days
    type: INT4
    domain: duration
    desc: Length of the measured window in days.
    sens: Internal
    default: '30'
  constraints:
  - name: ck_trending_job_snapshot_rank_positive
    type: check
    expr: rank_position >= 1 AND (previous_rank_position IS NULL OR previous_rank_position >= 1)
    desc: Ranks start at 1
  - name: ck_trending_job_snapshot_one_subject
    type: check
    expr: (CASE WHEN job_role_id IS NULL THEN 0 ELSE 1 END) + (CASE WHEN skill_id IS NULL THEN 0 ELSE 1 END) + (CASE WHEN city_id IS NULL THEN 0 ELSE 1 END) + (CASE WHEN industry_id IS NULL THEN 0 ELSE
      1 END) = 1
    desc: Exactly one subject reference is set
  - name: ck_trending_job_snapshot_window_positive
    type: check
    expr: window_days >= 1
    desc: Window of at least one day
  - name: uq_trending_job_snapshot_grain
    type: unique
    columns:
    - snapshot_date
    - trending_scope_id
    - subject_key
    desc: One row per date, scope and subject.
  - name: ck_trending_job_snapshot_counts_nonneg
    type: check
    expr: rank_position >= 0 AND postings_count >= 0 AND applications_count >= 0
    desc: Counters are never negative
  indexes:
  - name: idx_trending_job_snapshot_trending_scope_id_snapshot_date_rank_position
    columns:
    - trending_scope_id
    - snapshot_date DESC
    - rank_position
    desc: Top-N list of a scope for the latest date.
  - name: idx_trending_job_snapshot_reference_data_source_id
    columns:
    - reference_data_source_id
    desc: 'Foreign-key leading index: parent-to-children lookups for this star key.'
  fks:
  - name: fk_trending_job_snapshot_trending_scope_id
    columns:
    - trending_scope_id
    ref: trending_scope
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: lookup values are retired, never deleted'
    index_exempt: lookup with a handful of values; no reverse lookup needed
  - name: fk_trending_job_snapshot_job_role_id
    columns:
    - job_role_id
    ref: job_role
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: reference snapshots must not silently lose the entity they describe'
    index_exempt: subject lookups go through subject_key
  - name: fk_trending_job_snapshot_skill_id
    columns:
    - skill_id
    ref: skill
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: reference snapshots must not silently lose the entity they describe'
    index_exempt: subject lookups go through subject_key
  - name: fk_trending_job_snapshot_city_id
    columns:
    - city_id
    ref: city
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: reference snapshots must not silently lose the entity they describe'
    index_exempt: subject lookups go through subject_key
  - name: fk_trending_job_snapshot_industry_id
    columns:
    - industry_id
    ref: industry
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: reference snapshots must not silently lose the entity they describe'
    index_exempt: subject lookups go through subject_key
  - name: fk_trending_job_snapshot_reference_data_source_id
    columns:
    - reference_data_source_id
    ref: reference_data_source
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: reference snapshots must not silently lose the entity they describe'
