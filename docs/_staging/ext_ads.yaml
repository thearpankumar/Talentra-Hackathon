- name: sponsored_job
  kind: entity
  delete_policy: soft
  volume: medium
  tier: X
  milestones:
  - B6
  - B14
  - B38
  retention: Kept 8 years (billing evidence).
  description: Promotion of a job_requirement inside an ad group (Indeed Sponsored Jobs / LinkedIn Job Slots style). Complements jobs_applications.job_boost (flat boost product) for auction-based promotion.
  columns:
  - name: ad_account_id
    type: UUID
    domain: identifier
    desc: Ad account.
    sens: Internal
