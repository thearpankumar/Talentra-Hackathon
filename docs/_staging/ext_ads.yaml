tables:
- name: ad_account
  kind: entity
  delete_policy: soft
  volume: low
  tier: X
  milestones:
  - B6
  - B14
  - B38
  retention: Kept while the organisation exists plus 8 years after closure (billing evidence); closed accounts retain aggregates only.
  description: 'Advertiser account of an organisation: owns campaigns, funds spend from a wallet (prepaid) or an invoice credit limit (postpaid). Billing is not duplicated: money moves through subscriptions_payments
    wallet/invoice.'
  columns:
  - name: organisation_id
    type: UUID
    domain: identifier
    desc: Advertiser organisation (tenant).
    sens: Internal
  - name: account_id
    type: UUID
    domain: identifier
    desc: Commercial account used for invoicing, if postpaid.
    sens: Internal
    'null': true
    null_why: NULL = prepaid wallet account without commercial account.
  - name: wallet_id
    type: UUID
    domain: identifier
    desc: Wallet funding prepaid spend.
    sens: Internal
    'null': true
    null_why: NULL = postpaid invoice account.
  - name: currency_id
    type: UUID
    domain: identifier
    desc: Billing currency of the ad account (must equal wallet currency).
    sens: Internal
  - name: ad_account_status_id
    type: UUID
    domain: enum_ref
    desc: Account standing.
    sens: Internal
  - name: ad_funding_mode_id
    type: UUID
    domain: enum_ref
    desc: Funding mode.
    sens: Internal
  - name: time_zone_id
    type: UUID
    domain: identifier
    desc: Time zone for daily budgets, schedules and reports.
    sens: Internal
  - name: display_name
    type: STRING(150)
    domain: free_text
    desc: Account name shown in the console.
    sens: Internal
  - name: daily_spend_cap_amount
    type: DECIMAL(18,4)
    domain: money
    desc: Platform-level risk cap on total daily spend.
    sens: Internal
    'null': true
    null_why: NULL = no platform cap beyond budgets.
  - name: credit_limit_amount
    type: DECIMAL(18,4)
    domain: money
    desc: Postpaid credit limit.
    sens: Internal
    'null': true
    null_why: NULL = prepaid account.
  - name: strike_points
    type: INT2
    domain: quantity
    desc: Active strike points (cache of ad_advertiser_policy_strike).
    sens: Internal
    default: '0'
  - name: verified_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: When business verification completed.
    sens: Internal
    'null': true
    null_why: NULL = not yet verified (cannot spend).
  - name: restricted_until_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: End of a temporary restriction.
    sens: Internal
    'null': true
    null_why: NULL = no restriction in force.
  - name: suspended_for_ad_policy_id
    type: UUID
    domain: enum_ref
    desc: Policy that triggered suspension.
    sens: Internal
    'null': true
    null_why: NULL = not suspended for policy.
  constraints:
  - name: uq_ad_account_id_organisation_id
    type: unique
    columns:
    - id
    - organisation_id
    desc: Target of composite FKs proving tenant consistency.
  - name: ck_ad_account_credit_or_wallet
    type: check
    expr: wallet_id IS NOT NULL OR credit_limit_amount IS NOT NULL
    desc: Funded by a wallet or a credit limit.
  - name: ck_ad_account_amounts_nonneg
    type: check
    expr: (daily_spend_cap_amount IS NULL OR daily_spend_cap_amount >= 0) AND (credit_limit_amount IS NULL OR credit_limit_amount >= 0) AND strike_points >= 0
