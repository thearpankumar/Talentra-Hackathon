- name: sponsored_candidate_slot
  kind: entity
  delete_policy: soft
  volume: low
  tier: X
  milestones:
  - B6
  - B14
  retention: Kept 3 years after end; erased on candidate erasure.
  description: Candidate-purchased promoted profile in recruiter search (opt-in, always labelled 'Promoted'). Never shown without explicit consent.
  columns:
