    type: UUID
    domain: identifier
    desc: Creative.
    sens: Internal
  - name: ad_placement_id
    type: UUID
    domain: enum_ref
    desc: Placement.
    sens: Internal
  - name: expected_ctr_ratio
    type: DECIMAL(6,5)
    domain: ratio
    desc: Predicted click-through rate 0..1.
    sens: Internal
  - name: relevance_pct
    type: DECIMAL(5,2)
    domain: percentage
    desc: Relevance score.
    sens: Internal
  - name: landing_quality_pct
    type: DECIMAL(5,2)
    domain: percentage
    desc: Landing page quality.
    sens: Internal
  - name: quality_score
    type: INT2
    domain: quantity
    desc: Composite 1..10.
    sens: Internal
  - name: model_version
    type: STRING(50)
    domain: free_text
    desc: Model version.
    sens: Internal
  - name: computed_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Computed at.
    sens: Internal
    default: now()
  constraints:
  - name: uq_ad_creative_quality_score_ad_creative_id_ad_placement_id
    type: unique
    columns:
    - ad_creative_id
    - ad_placement_id
    desc: Latest score per pair.
  - name: ck_ad_creative_quality_score_ctr_range
    type: check
    expr: expected_ctr_ratio >= 0 AND expected_ctr_ratio <= 1
    desc: 0..1.
  - name: ck_ad_creative_quality_score_score_range
    type: check
    expr: quality_score BETWEEN 1 AND 10
    desc: 1..10.
  - name: ck_ad_creative_quality_score_relevance_pct_range
    type: check
    expr: relevance_pct >= 0 AND relevance_pct <= 100
    desc: Percentage range 0..100.
  - name: ck_ad_creative_quality_score_landing_quality_pct_range
    type: check
    expr: landing_quality_pct >= 0 AND landing_quality_pct <= 100
    desc: Percentage range 0..100.
  indexes: []
  fks:
  - name: fk_ad_creative_quality_score_ad_creative_id
    columns:
    - ad_creative_id
    ref: ad_creative
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: parent row; delete rule per retention
  - name: fk_ad_creative_quality_score_ad_placement_id
    columns:
    - ad_placement_id
    ref: ad_placement
    ref_columns:
    - id
