  - name: starts_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Start.
    sens: Internal
  - name: ends_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: End.
    sens: Internal
    'null': true
    null_why: NULL = until campaign end/budget exhausted.
  - name: impressions_total
    type: INT8
    domain: quantity
    desc: Cached impressions.
    sens: Internal
    default: '0'
  - name: clicks_total
    type: INT8
    domain: quantity
    desc: Cached clicks.
    sens: Internal
    default: '0'
  - name: applications_total
    type: INT8
    domain: quantity
    desc: Cached sponsored applications.
    sens: Internal
    default: '0'
  - name: spent_amount
    type: DECIMAL(18,4)
    domain: money
    desc: Cached spend.
    sens: Internal
    default: '0'
  constraints:
  - name: ck_sponsored_job_window
    type: check
    expr: ends_at IS NULL OR ends_at >= starts_at
    desc: End not before start.
  - name: ck_sponsored_job_amounts
    type: check
    expr: (budget_amount IS NULL OR budget_amount > 0) AND (bid_amount IS NULL OR bid_amount > 0) AND (cpa_target_amount IS NULL OR cpa_target_amount > 0) AND spent_amount >= 0
    desc: Positive amounts.
  - name: ck_sponsored_job_money_companion
    type: check
    expr: (budget_amount IS NULL AND bid_amount IS NULL AND cpa_target_amount IS NULL) OR currency_id IS NOT NULL
    desc: Money has currency.
  - name: ck_sponsored_job_counters
    type: check
    expr: impressions_total >= 0 AND clicks_total >= 0 AND applications_total >= 0 AND (max_applications IS NULL OR max_applications > 0)
    desc: Counters non-negative.
