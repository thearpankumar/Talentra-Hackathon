  - name: fk_ad_performance_hourly_ad_group_id
    columns:
    - ad_group_id
    ref: ad_group
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: parent row; delete rule per retention
  - name: fk_ad_performance_hourly_ad_creative_id
    columns:
