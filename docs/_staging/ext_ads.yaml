    desc: Job function.
    sens: Internal
    'null': true
    null_why: NULL = rule targets another dimension.
  - name: language_id
    type: UUID
    domain: identifier
    desc: Language.
    sens: Internal
    'null': true
    null_why: NULL = rule targets another dimension.
  - name: qualification_id
    type: UUID
    domain: identifier
    desc: Qualification.
    sens: Internal
    'null': true
    null_why: NULL = rule targets another dimension.
  - name: min_value
    type: INT4
    domain: quantity
    desc: Range minimum (years of experience).
    sens: Internal
    'null': true
    null_why: NULL = not a range rule / open lower bound.
  - name: max_value
    type: INT4
    domain: quantity
    desc: Range maximum.
    sens: Internal
    'null': true
    null_why: NULL = not a range rule / open upper bound.
  constraints:
  - name: ck_ad_audience_rule_one_target
    type: check
    expr: (CASE WHEN country_id IS NOT NULL THEN 1 ELSE 0 END) + (CASE WHEN state_region_id IS NOT NULL THEN 1 ELSE 0 END) + (CASE WHEN city_id IS NOT NULL THEN 1 ELSE 0 END) + (CASE WHEN skill_id IS NOT
      NULL THEN 1 ELSE 0 END) + (CASE WHEN industry_id IS NOT NULL THEN 1 ELSE 0 END) + (CASE WHEN seniority_level_id IS NOT NULL THEN 1 ELSE 0 END) + (CASE WHEN job_function_id IS NOT NULL THEN 1 ELSE
      0 END) + (CASE WHEN language_id IS NOT NULL THEN 1 ELSE 0 END) + (CASE WHEN qualification_id IS NOT NULL THEN 1 ELSE 0 END) + (CASE WHEN min_value IS NOT NULL OR max_value IS NOT NULL THEN 1 ELSE
      0 END) = 1
    desc: Exactly one target kind per row.
  - name: ck_ad_audience_rule_range
    type: check
    expr: min_value IS NULL OR max_value IS NULL OR max_value >= min_value
    desc: Range ordered.
