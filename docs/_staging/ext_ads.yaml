views:
- name: vw_sponsored_job_serving
  kind: view
  tables:
  - sponsored_job
  - ad_campaign
  - ad_group
  - ad_account
  - job_requirement
  purpose: 'Serving candidates: running sponsored jobs of active accounts with live jobs.'
  security: Service role only; excludes suspended/restricted accounts.
  sql_sketch: SELECT sj.* FROM sponsored_job sj JOIN ad_campaign c ON c.id=sj.ad_campaign_id JOIN ad_account a ON a.id=sj.ad_account_id WHERE sj.deleted_at IS NULL AND now() BETWEEN sj.starts_at AND coalesce(sj.ends_at,'infinity')
    AND a.verified_at IS NOT NULL AND c.spent_amount < c.budget_amount
- name: vw_ad_campaign_pacing
  kind: view
  tables:
  - ad_campaign
  - ad_budget_shard
  purpose: Campaign spend = ledger cache plus un-flushed shard totals, for pacing decisions.
  security: Service role only.
  sql_sketch: SELECT c.id, c.spent_amount + coalesce(sum(s.pending_spend_amount),0) AS spend_estimate FROM ad_campaign c LEFT JOIN ad_budget_shard s ON s.ad_campaign_id=c.id GROUP BY c.id
- name: vw_ad_campaign_report
  kind: view
  tables:
  - ad_performance_daily
  - ad_campaign
  purpose: Advertiser campaign report with CTR and cost per conversion.
  security: Filtered by ad_account membership.
  sql_sketch: SELECT campaign, performance_date, sum(clicks)::decimal/nullif(sum(impressions),0) ctr, sum(spend_amount)/nullif(sum(conversions),0) cpa FROM ad_performance_daily GROUP BY ...
- name: vw_ad_audience_rule_public
  kind: view
  tables:
  - ad_audience_rule
  - ad_audience
  purpose: Audience definition without list data for the console.
  security: Hashed list tables never exposed.
  sql_sketch: SELECT r.* FROM ad_audience_rule r JOIN ad_audience a ON a.id=r.ad_audience_id WHERE a.deleted_at IS NULL
business_rules:
- id: BR-ADS-01
  rule: An ad campaign's end is not before its start; a lifetime-budget campaign must have an end.
  mechanism_type: CHECK
  mechanism: ck_ad_campaign_window; lifetime requires ends_at enforced by APP_LAYER as the budget type is a lookup.
  tables:
  - ad_campaign
  milestone: B6
- id: BR-ADS-02
  rule: Sponsored job may only promote a job of the advertiser's own organisation, under the account and campaign of the same tenant.
  mechanism_type: FK
  mechanism: Composite FKs (organisation_id, job_requirement_id)->job_requirement(organisation_id,id), (ad_account_id, organisation_id)->ad_account, (ad_campaign_id, ad_account_id)->ad_campaign, (ad_group_id,
    ad_campaign_id)->ad_group.
  tables:
  - sponsored_job
  milestone: B6
- id: BR-ADS-03
  rule: A job appears at most once per ad group.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: uq_sponsored_job_ad_group_id_job_requirement_id WHERE deleted_at IS NULL.
  tables:
  - sponsored_job
  milestone: B6
- id: BR-ADS-04
  rule: Spend never drives a campaign's recorded spend negative and ledger sequence is gapless.
  mechanism_type: CHAIN_FK
  mechanism: UNIQUE(ad_campaign_id, sequence_no) plus composite self-FK (ad_campaign_id, prev_sequence_no) and CHECK spent_after >= 0.
  tables:
  - ad_budget_ledger
  milestone: B38
- id: BR-ADS-05
  rule: 'Budget pacing and ledger writes for a campaign are serialised: pacing job runs SELECT ... FOR UPDATE on the ad_campaign row, sums ad_budget_shard.pending_spend_amount, inserts the spend_accrual
    entry (idempotency key accrue:{campaign}:{hour}), updates spent_amount/ledger_sequence, zeroes the shards, commits; retry on 40001.'
  mechanism_type: TXN_LOCK
  mechanism: 'Single txn: FOR UPDATE campaign; INSERT ad_budget_ledger; UPDATE ad_campaign; UPDATE ad_budget_shard. Serve path never locks the campaign row.'
  tables:
  - ad_campaign
  - ad_budget_ledger
  - ad_budget_shard
  milestone: B38
- id: BR-ADS-06
  rule: Click-time charges go to one of 16 random shards to avoid a hot row; overspend is bounded by flush lag and is credited or absorbed (never charged above the budget).
  mechanism_type: SLOT_TABLE
  mechanism: ad_budget_shard UNIQUE(ad_campaign_id, shard_no) with CHECK shard_no BETWEEN 0 AND 15; serving picks shard_no = random 0..15.
  tables:
  - ad_budget_shard
  milestone: B38
- id: BR-ADS-07
  rule: Ledger entries are immutable; a correction is a reversal entry reversing an entry at most once.
  mechanism_type: PRIVILEGE
  mechanism: INSERT/SELECT only grants; UNIQUE partial index on reverses_ad_budget_ledger_id; row_hash chain.
  tables:
  - ad_budget_ledger
  milestone: B38
- id: BR-ADS-08
  rule: Each ledger entry is settled into billing exactly once; settlement is idempotent.
  mechanism_type: UNIQUE
  mechanism: UNIQUE(ad_billing_event_item.ad_budget_ledger_id); UNIQUE(ad_billing_event.idempotency_key); billing event row inserted in the same txn as wallet_ledger_entry (UNIQUE wallet_ledger_entry_id).
  tables:
  - ad_billing_event
  - ad_billing_event_item
  milestone: B41
- id: BR-ADS-09
  rule: 'Ads never bypass the wallet: prepaid spend settles via wallet_ledger_entry with wallet balance >= 0.'
  mechanism_type: TXN_LOCK
  mechanism: Settlement txn does SELECT wallet FOR UPDATE then wallet_ledger_entry insert per D-14, then ad_billing_event.
  tables:
  - ad_billing_event
  milestone: B41
- id: BR-ADS-10
  rule: Audience targeting cannot use protected attributes.
  mechanism_type: APP_LAYER
  mechanism: ad_targeting_dimension lookup has no gender/age/religion/caste/disability values; typed target columns in ad_audience_rule only reference non-protected master tables.
  tables:
  - ad_audience_rule
  milestone: B6
- id: BR-ADS-11
  rule: Each rule row targets exactly one thing.
  mechanism_type: CHECK
  mechanism: ck_ad_audience_rule_one_target (sum of non-null targets = 1).
  tables:
  - ad_audience_rule
  milestone: B6
- id: BR-ADS-12
  rule: Uploaded lists store only keyed hashes, no duplicates, and expire.
  mechanism_type: TTL
  mechanism: identifier_hash BYTES CHECK octet_length=32, UNIQUE(list,hash), row TTL on expires_at.
  tables:
  - ad_audience_list_entry
  - ad_audience_member_list
  milestone: B6
- id: BR-ADS-13
  rule: Exactly one open approval request per subject; one subject per request.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: Partial uniques WHERE is_open per subject column; CHECK one_subject; CHECK is_open = (decided_at IS NULL).
  tables:
  - ad_approval_request
  milestone: B6
- id: BR-ADS-14
  rule: Only approved creatives serve; edits to an approved creative create a new version.
  mechanism_type: APP_LAYER
  mechanism: Serving view filters ad_review_status approved; ad_creative.supersedes_ad_creative_id unique successor.
  tables:
  - ad_creative
  milestone: B6
- id: BR-ADS-15
  rule: Dayparting windows cannot overlap.
  mechanism_type: SLOT_TABLE
  mechanism: ad_schedule_slot hour grid UNIQUE(schedule, weekday, hour_of_day), hour 0..23.
  tables:
  - ad_schedule_slot
  milestone: B6
- id: BR-ADS-16
  rule: Frequency cap is defined for exactly one scope and one window.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: CHECK one scope; partial uniques per campaign/group and window.
  tables:
  - ad_frequency_cap
  milestone: B6
- id: BR-ADS-17
  rule: Raw events are idempotent and expire; long-term figures live in rollups.
  mechanism_type: TTL
  mechanism: UNIQUE(serve_ref)/UNIQUE(click_ref)/UNIQUE(campaign, dedupe_key); TTL on expires_at (30/90/760 days).
  tables:
  - ad_impression
  - ad_click
  - ad_conversion
  milestone: B14
- id: BR-ADS-18
  rule: Hourly rollups are upserted per grain and are final only after the late-event window.
  mechanism_type: JOB
  mechanism: UNIQUE(ad_creative_id, ad_placement_id, hour_start_at); rollup job upserts, sets is_final after 6h; daily rollup recomputes from final hours.
  tables:
  - ad_performance_hourly
  - ad_performance_daily
  milestone: B14
- id: BR-ADS-19
  rule: Advertisers are not billed for invalid traffic.
  mechanism_type: JOB
  mechanism: Fraud job inserts ad_fraud_flag and ad_invalid_traffic_adjustment plus invalid_traffic_credit ledger entry (UNIQUE credit entry).
  tables:
  - ad_fraud_flag
  - ad_invalid_traffic_adjustment
  milestone: B38
- id: BR-ADS-20
  rule: Viewer identity in events is pseudonymous only; IPs truncated; no link to app_user.
  mechanism_type: APP_LAYER
  mechanism: viewer_ref keyed HMAC rotating; client_ip_truncated stored; no app_user_id column on event tables.
  tables:
  - ad_impression
  - ad_click
  - ad_conversion
  milestone: B14
- id: BR-ADS-21
  rule: Policy strikes accumulate points; reaching thresholds restricts or suspends the account.
  mechanism_type: JOB
  mechanism: Strike insert txn updates ad_account.strike_points and ad_account_status under FOR UPDATE on ad_account.
  tables:
  - ad_advertiser_policy_strike
  - ad_account
  milestone: B6
- id: BR-ADS-22
  rule: Account is funded by a wallet or credit limit; an unverified account cannot serve.
  mechanism_type: CHECK
  mechanism: ck_ad_account_credit_or_wallet; serving view requires verified_at IS NOT NULL.
  tables:
  - ad_account
  milestone: B38
- id: BR-ADS-23
  rule: Promoted candidate slots require consent and are always labelled.
  mechanism_type: CHECK
  mechanism: user_consent_id NOT NULL; CHECK is_labelled_promoted.
  tables:
  - sponsored_candidate_slot
  milestone: B6
- id: BR-ADS-24
  rule: Only one open grant per user per ad account.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: uq_ad_account_member_ad_account_id_app_user_id_open WHERE effective_to IS NULL.
  tables:
  - ad_account_member
  milestone: B6
- id: BR-ADS-25
  rule: A campaign has at most one primary conversion goal.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: uq_ad_conversion_goal_ad_campaign_id_primary WHERE is_primary.
  tables:
  - ad_conversion_goal
  milestone: B14
