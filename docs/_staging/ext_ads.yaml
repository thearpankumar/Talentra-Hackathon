- name: ad_approval_request
  kind: entity
  delete_policy: hard
  volume: medium
  tier: X
  milestones:
  - B6
  - B14
  retention: Kept 3 years after decision.
  description: Submission of a campaign/creative/sponsored job into an approval workflow; exactly one subject, one open request per subject.
  columns:
  - name: ad_account_id
    type: UUID
    domain: identifier
    desc: Submitting account.
    sens: Internal
  - name: ad_approval_workflow_id
    type: UUID
    domain: identifier
    desc: Workflow applied.
    sens: Internal
  - name: ad_approval_subject_kind_id
    type: UUID
    domain: enum_ref
    desc: Subject kind.
    sens: Internal
  - name: ad_campaign_id
    type: UUID
    domain: identifier
    desc: Campaign subject.
    sens: Internal
    'null': true
    null_why: NULL = other subject kind.
  - name: ad_creative_id
    type: UUID
    domain: identifier
    desc: Creative subject.
    sens: Internal
    'null': true
    null_why: NULL = other subject kind.
  - name: sponsored_job_id
    type: UUID
    domain: identifier
    desc: Sponsored job subject.
    sens: Internal
    'null': true
    null_why: NULL = other subject kind.
  - name: current_step_no
    type: INT2
    domain: quantity
    desc: Step awaiting decision.
    sens: Internal
  - name: is_open
    type: BOOL
    domain: boolean
    desc: Awaiting final decision.
    sens: Internal
    default: 'true'
  - name: final_ad_approval_decision_kind_id
    type: UUID
    domain: enum_ref
    desc: Final outcome.
    sens: Internal
    'null': true
    null_why: NULL = still open.
  - name: submitted_by_app_user_id
    type: UUID
    domain: identifier
    desc: Submitter.
    sens: Internal
  - name: submitted_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Submission time.
    sens: Internal
    default: now()
  - name: decided_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Final decision time.
    sens: Internal
    'null': true
    null_why: NULL = still open.
  constraints:
  - name: ck_ad_approval_request_one_subject
    type: check
    expr: (CASE WHEN ad_campaign_id IS NOT NULL THEN 1 ELSE 0 END) + (CASE WHEN ad_creative_id IS NOT NULL THEN 1 ELSE 0 END) + (CASE WHEN sponsored_job_id IS NOT NULL THEN 1 ELSE 0 END) = 1
    desc: Exactly one subject.
  - name: ck_ad_approval_request_open_state
    type: check
    expr: is_open = (decided_at IS NULL)
    desc: Open iff undecided.
  - name: ck_ad_approval_request_decided_order
    type: check
    expr: decided_at IS NULL OR decided_at >= submitted_at
    desc: Decision after submission.
  indexes:
  - name: uq_ad_approval_request_ad_campaign_id_open
    columns:
    - ad_campaign_id
    desc: One open request per campaign (P3).
    unique: true
    where: is_open AND ad_campaign_id IS NOT NULL
  - name: uq_ad_approval_request_ad_creative_id_open
    columns:
    - ad_creative_id
    desc: One open request per creative.
    unique: true
    where: is_open AND ad_creative_id IS NOT NULL
  - name: uq_ad_approval_request_sponsored_job_id_open
    columns:
    - sponsored_job_id
    desc: One open request per sponsored job.
    unique: true
    where: is_open AND sponsored_job_id IS NOT NULL
  - name: idx_ad_approval_request_ad_account_id_submitted_at
    columns:
    - ad_account_id
    - submitted_at DESC
    desc: Account queue.
  - name: idx_ad_approval_request_ad_approval_workflow_id_current_step_no
    columns:
    - ad_approval_workflow_id
    - current_step_no
    desc: Reviewer queue per step.
    where: is_open
  - name: idx_ad_approval_request_submitted_by_app_user_id
    columns:
    - submitted_by_app_user_id
    desc: Submitter lookup.
  fks:
  - name: fk_ad_approval_request_ad_account_id
    columns:
    - ad_account_id
    ref: ad_account
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: parent row; delete rule per retention
  - name: fk_ad_approval_request_ad_approval_workflow_id
    columns:
    - ad_approval_workflow_id
    ref: ad_approval_workflow
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: parent row; delete rule per retention
  - name: fk_ad_approval_request_ad_approval_subject_kind_id
    columns:
    - ad_approval_subject_kind_id
    ref: ad_approval_subject_kind
    ref_columns:
