- name: ad_budget_shard
  kind: entity
  delete_policy: hard
  volume: medium
  tier: X
  milestones:
  - B6
  - B14
  retention: Reset/zeroed by the pacing flush; deleted with campaign purge.
  description: 'Sharded spend accumulator: click-time charges UPDATE one of 16 random shards per campaign instead of the single hot campaign row.'
  columns:
  - name: ad_campaign_id
    type: UUID
    domain: identifier
    desc: Campaign.
    sens: Internal
  - name: shard_no
    type: INT2
    domain: quantity
    desc: Shard 0..15.
    sens: Internal
  - name: pending_spend_amount
    type: DECIMAL(18,6)
    domain: money
    desc: Spend charged since last flush into ad_budget_ledger.
    sens: Internal
    default: '0'
  - name: currency_id
    type: UUID
    domain: identifier
    desc: Currency of the money columns of this row (FK currency); replaces the former unchecked ISO text code (decision D-06).
    sens: Internal
  - name: event_count
    type: INT8
    domain: quantity
    desc: Charged events since last flush.
    sens: Internal
    default: '0'
  - name: last_flushed_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Last flush.
    sens: Internal
    'null': true
    null_why: NULL = never flushed.
  constraints:
  - name: uq_ad_budget_shard_ad_campaign_id_shard_no
    type: unique
    columns:
    - ad_campaign_id
    - shard_no
    desc: One row per shard.
  - name: ck_ad_budget_shard_shard_range
    type: check
    expr: shard_no BETWEEN 0 AND 15
    desc: 16 shards.
  - name: ck_ad_budget_shard_nonneg
    type: check
    expr: pending_spend_amount >= 0 AND event_count >= 0
    desc: Non-negative.
  indexes: []
  fks:
  - name: fk_ad_budget_shard_ad_campaign_id
    columns:
    - ad_campaign_id
    ref: ad_campaign
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: parent row; delete rule per retention
  - name: fk_ad_budget_shard_currency_id
    columns:
    - currency_id
    ref: currency
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Master data currency rows are never deleted (retired via is_active).
    index_exempt: master data currency rows are never deleted, so no child scan is needed
- name: ad_budget_ledger
  kind: ledger
  delete_policy: append_only
  volume: high
  tier: X
  milestones:
  - B6
  - B38
  - B41
  retention: Append-only 8 years (legal hold aware); cold-archived after 2 years via changefeed.
  description: Append-only ad spend ledger per campaign (single entry, signed). Gapless per-campaign sequence; corrections by reversal; settlement into the wallet via ad_billing_event.
  audit: created_only
  columns:
  - name: ad_account_id
    type: UUID
    domain: identifier
    desc: Ad account.
    sens: Internal
  - name: ad_campaign_id
    type: UUID
    domain: identifier
    desc: Campaign.
    sens: Internal
  - name: sponsored_job_id
    type: UUID
    domain: identifier
    desc: Sponsored job attribution.
    sens: Internal
    'null': true
    null_why: NULL = campaign-level entry.
  - name: sequence_no
    type: INT8
    domain: quantity
    desc: Per-campaign gapless sequence.
    sens: Internal
  - name: prev_sequence_no
    type: INT8
    domain: quantity
    desc: Previous sequence (composite self-FK).
    sens: Internal
    'null': true
    null_why: NULL only for sequence_no = 1.
  - name: ad_ledger_entry_type_id
    type: UUID
    domain: enum_ref
    desc: Entry type.
    sens: Internal
  - name: amount_delta
    type: DECIMAL(18,4)
    domain: money
    desc: Signed change to campaign spend (+ spend, - credit).
    sens: Internal
  - name: currency_id
    type: UUID
    domain: identifier
    desc: Currency of the money columns.
    sens: Internal
  - name: spent_after
    type: DECIMAL(18,4)
    domain: money
    desc: Campaign spend after this entry.
    sens: Internal
  - name: usage_hour_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Hour bucket of the usage accrued.
    sens: Internal
    'null': true
    null_why: NULL = not usage based (adjustment).
  - name: idempotency_key
    type: STRING(120)
    domain: token
    desc: e.g. accrue:{campaign}:{hour}; replays return the original row.
    sens: Internal
  - name: reverses_ad_budget_ledger_id
    type: UUID
    domain: identifier
    desc: Entry reversed.
    sens: Internal
    'null': true
    null_why: NULL = not a reversal.
  - name: source_ad_performance_hourly_id
    type: UUID
    domain: identifier
    desc: Rollup row the accrual derives from.
    sens: Internal
    'null': true
    null_why: NULL = not from a rollup.
  - name: prev_hash
    type: BYTES
    domain: token
    desc: Row hash of the previous entry (tamper evidence P5).
    sens: Internal
    'null': true
    null_why: NULL only for sequence_no = 1.
  - name: row_hash
    type: BYTES
    domain: token
    desc: SHA-256 over this row plus prev_hash.
    sens: Internal
  constraints:
  - name: uq_ad_budget_ledger_ad_campaign_id_sequence_no
    type: unique
    columns:
    - ad_campaign_id
    - sequence_no
    desc: Gapless per-campaign sequence.
  - name: uq_ad_budget_ledger_idempotency_key
    type: unique
    columns:
    - idempotency_key
    desc: Idempotent writes.
  - name: ck_ad_budget_ledger_first_or_prev
    type: check
    expr: (sequence_no = 1 AND prev_sequence_no IS NULL) OR (sequence_no > 1 AND prev_sequence_no = sequence_no - 1)
    desc: Chain continuity.
  - name: ck_ad_budget_ledger_spent_nonneg
    type: check
    expr: spent_after >= 0
    desc: Spend never negative.
