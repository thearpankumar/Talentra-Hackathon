- name: ad_audience_list_entry
  kind: entity
  delete_policy: hard
  volume: high
  tier: X
  milestones:
  - B6
  - B14
  retention: TTL with the list (180 days); deleted on list removal.
  description: One HMAC-hashed identifier of an uploaded list. Raw email/phone is never stored; matching hashes the platform side with the same pepper.
  ttl:
    expire_after: 180 days (ttl_expiration_expression expires_at)
    column: expires_at
  columns:
  - name: ad_audience_member_list_id
    type: UUID
    domain: identifier
    desc: List.
    sens: Internal
  - name: identifier_hash
    type: BYTES
    domain: token
    desc: HMAC-SHA256 (32 bytes) of the normalised identifier.
    sens: Personal
    pii: keyed HMAC-SHA256 with rotating pepper held in KMS; irreversible; no raw identifier stored; excluded from exports
  - name: is_matched
    type: BOOL
    domain: boolean
    desc: Hash matched a platform user at processing time.
    sens: Internal
    default: 'false'
  - name: expires_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: TTL expiry (= list expiry).
    sens: Internal
  constraints:
  - name: uq_ad_audience_list_entry_ad_audience_member_list_id_identifier_hash
    type: unique
    columns:
    - ad_audience_member_list_id
    - identifier_hash
    desc: No duplicate hashes in a list.
  - name: ck_ad_audience_list_entry_hash_len
    type: check
    expr: octet_length(identifier_hash) = 32
    desc: HMAC-SHA256 length.
  indexes:
  - name: idx_ad_audience_list_entry_expires_at
    columns:
    - expires_at
    desc: TTL scan, hash-sharded for time order.
    hash: true
    bucket_count: 16
  - name: idx_ad_audience_list_entry_identifier_hash
    columns:
    - identifier_hash
    desc: Serve-time membership lookup.
    where: is_matched
    storing:
    - ad_audience_member_list_id
  fks:
  - name: fk_ad_audience_list_entry_ad_audience_member_list_id
    columns:
    - ad_audience_member_list_id
    ref: ad_audience_member_list
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: parent row; delete rule per retention
