- name: ad_performance_hourly
  kind: agg
  delete_policy: hard
  volume: very_high
  tier: X
  milestones:
  - B6
  - B14
  retention: TTL 120 days after hour closes; ad_performance_daily keeps long-term.
  description: Hourly rollup of impressions/clicks/conversions/spend per creative and placement; owned by ads (billing-grade), distinct from analytics agg_*. Rewritten until is_final.
  ttl:
    expire_after: 120 days (expires_at set at insert)
    column: expires_at
  columns:
  - name: ad_campaign_id
    type: UUID
    domain: identifier
    desc: Campaign.
    sens: Internal
  - name: ad_group_id
    type: UUID
    domain: identifier
    desc: Group.
    sens: Internal
  - name: ad_creative_id
    type: UUID
    domain: identifier
    desc: Creative.
    sens: Internal
  - name: ad_placement_id
    type: UUID
    domain: enum_ref
    desc: Placement.
    sens: Internal
  - name: hour_start_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Hour bucket (UTC).
    sens: Internal
  - name: impressions
    type: INT8
    domain: quantity
    desc: Impressions.
    sens: Internal
    default: '0'
  - name: viewable_impressions
    type: INT8
    domain: quantity
    desc: Viewable impressions.
    sens: Internal
    default: '0'
  - name: clicks
    type: INT8
    domain: quantity
    desc: Clicks.
    sens: Internal
    default: '0'
  - name: conversions
    type: INT8
    domain: quantity
    desc: Attributed conversions.
    sens: Internal
    default: '0'
  - name: spend_amount
    type: DECIMAL(18,6)
    domain: money
    desc: Billable spend.
    sens: Internal
    default: '0'
  - name: currency_id
    type: UUID
    domain: identifier
    desc: Currency of the money columns of this row (FK currency); replaces the former unchecked ISO text code (decision D-06).
    sens: Internal
  - name: invalid_impressions
    type: INT8
    domain: quantity
    desc: Filtered invalid impressions.
    sens: Internal
    default: '0'
  - name: invalid_clicks
    type: INT8
    domain: quantity
    desc: Filtered invalid clicks.
    sens: Internal
    default: '0'
  - name: invalid_spend_amount
    type: DECIMAL(18,6)
    domain: money
    desc: Spend credited for invalid traffic.
    sens: Internal
    default: '0'
  - name: is_final
    type: BOOL
    domain: boolean
    desc: Late-event window closed.
    sens: Internal
    default: 'false'
  - name: rollup_run_ref
    type: STRING(64)
    domain: token
    desc: Producing job run.
    sens: Internal
  - name: computed_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Computed.
    sens: Internal
  - name: expires_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: TTL expiry.
    sens: Internal
  constraints:
  - name: uq_ad_performance_hourly_ad_creative_id_ad_placement_id_hour_start_at
    type: unique
    columns:
    - ad_creative_id
    - ad_placement_id
    - hour_start_at
    desc: One row per grain; upsert target.
  - name: ck_ad_performance_hourly_counts_nonneg
    type: check
    expr: impressions >= 0 AND viewable_impressions <= impressions AND clicks >= 0 AND conversions >= 0 AND spend_amount >= 0 AND invalid_impressions >= 0 AND invalid_clicks >= 0 AND invalid_spend_amount
      >= 0
    desc: Counters consistent.
  - name: ck_ad_performance_hourly_hour_aligned
    type: check
    expr: date_trunc('hour', hour_start_at) = hour_start_at
    desc: Aligned to the hour.
  indexes:
  - name: idx_ad_performance_hourly_hour_start_at
    columns:
