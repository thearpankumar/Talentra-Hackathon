- name: ad_billing_event
  kind: event
  delete_policy: append_only
  volume: medium
  tier: X
  milestones:
  - B6
  - B38
  - B41
  retention: Append-only 8 years (financial).
  description: 'Idempotent settlement/posting event: converts accrued ad spend into a wallet debit (prepaid) or an invoice posting (postpaid). Inserted in the same txn as the wallet ledger entry.'
  audit: created_only
  columns:
  - name: ad_account_id
    type: UUID
    domain: identifier
    desc: Ad account.
    sens: Internal
  - name: ad_billing_event_type_id
    type: UUID
    domain: enum_ref
    desc: Type.
    sens: Internal
  - name: idempotency_key
    type: STRING(120)
    domain: token
    desc: e.g. settle:{account}:{period_end}; unique.
    sens: Internal
  - name: period_start_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Spend window start (inclusive).
    sens: Internal
  - name: period_end_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Spend window end (exclusive).
    sens: Internal
  - name: spend_amount
    type: DECIMAL(18,4)
    domain: money
    desc: Spend settled in ad currency.
    sens: Internal
  - name: currency_id
    type: UUID
    domain: identifier
    desc: Currency of the money columns.
    sens: Internal
  - name: credit_rate
    type: DECIMAL(18,6)
    domain: measure
    desc: Money per wallet credit used.
    sens: Internal
    'null': true
    null_why: NULL = postpaid (no credits).
  - name: credits_debited
    type: INT8
    domain: quantity
    desc: Wallet credits debited.
    sens: Internal
    'null': true
    null_why: NULL = postpaid.
  - name: wallet_ledger_entry_id
    type: UUID
    domain: identifier
    desc: Wallet debit entry.
    sens: Internal
    'null': true
    null_why: NULL = postpaid or invoice-only posting.
  - name: posted_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Posting time.
    sens: Internal
    default: now()
  constraints:
  - name: uq_ad_billing_event_idempotency_key
    type: unique
    columns:
    - idempotency_key
    desc: Replay-safe.
  - name: ck_ad_billing_event_period
    type: check
    expr: period_end_at > period_start_at
    desc: Positive period.
  - name: ck_ad_billing_event_wallet_link
    type: check
    expr: credits_debited IS NULL OR wallet_ledger_entry_id IS NOT NULL
    desc: Credits imply wallet entry.
  indexes:
  - name: uq_ad_billing_event_wallet_ledger_entry_id
    columns:
    - wallet_ledger_entry_id
    desc: One billing event per wallet entry.
    unique: true
    where: wallet_ledger_entry_id IS NOT NULL
  - name: idx_ad_billing_event_ad_account_id_period_end_at
    columns:
    - ad_account_id
    - period_end_at DESC
    desc: Account billing history.
  fks:
  - name: fk_ad_billing_event_ad_account_id
    columns:
    - ad_account_id
    ref: ad_account
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: parent row; delete rule per retention
  - name: fk_ad_billing_event_ad_billing_event_type_id
    columns:
    - ad_billing_event_type_id
    ref: ad_billing_event_type
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: lookup value, never deleted (retired via is_active)
    index_exempt: referenced reference/lookup/master rows are retired via is_active and never deleted, so no child scan is needed
  - name: fk_ad_billing_event_currency_id
    columns:
    - currency_id
    ref: currency
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: master data never deleted
    index_exempt: referenced reference/lookup/master rows are retired via is_active and never deleted, so no child scan is needed
  - name: fk_ad_billing_event_wallet_ledger_entry_id
    columns:
