- name: duplicate_candidate_match
  kind: entity
  delete_policy: hard
  volume: high
  tier: X
  milestones:
  - B24
  - B60
  retention: Reviewed non-duplicates kept 12 months to suppress re-flagging, then purged; deleted with the accounts on erasure.
  description: Detected pair of possibly duplicate accounts (candidates seeded with duplicates, B60). Pair stored once in canonical order (primary id < duplicate id) per rule.
  no_hash_why: Pair keys are random UUIDs; review queue is a small partial index.
  columns:
  - name: primary_app_user_id
    type: UUID
    domain: identifier
    desc: Account with the smaller id of the pair.
    sens: Internal
  - name: duplicate_app_user_id
    type: UUID
    domain: identifier
    desc: Account with the larger id of the pair.
    sens: Internal
  - name: duplicate_match_rule_id
    type: UUID
    domain: enum_ref
    desc: Rule that produced the match.
    sens: Internal
  - name: match_confidence
    type: DECIMAL(5,2)
    domain: percentage
    desc: Confidence 0..100.
    sens: Internal
    default: '0'
  - name: duplicate_match_status_id
    type: UUID
    domain: enum_ref
    desc: Review state.
    sens: Internal
  - name: evidence
    type: JSONB
    domain: json
    desc: Matched attributes as hashes/tokens only (no raw PII).
    sens: Internal
    'null': true
    null_why: NULL = rule stores no evidence (exact key match).
  - name: reviewed_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: When a reviewer decided.
    sens: Internal
    'null': true
    null_why: NULL = not yet reviewed.
  - name: reviewed_by_app_user_id
    type: UUID
    domain: identifier
    desc: Reviewer.
    sens: Internal
    'null': true
    null_why: NULL = not yet reviewed.
  constraints:
  - name: uq_duplicate_candidate_match_pair_rule
    type: unique
    columns:
    - primary_app_user_id
    - duplicate_app_user_id
    - duplicate_match_rule_id
    desc: One match per pair and rule.
  - name: ck_duplicate_candidate_match_canonical_order
    type: check
    expr: primary_app_user_id < duplicate_app_user_id
    desc: Canonical ordering prevents (a,b)/(b,a) duplicates and self-pairs.
  - name: ck_duplicate_candidate_match_confidence_range
    type: check
    expr: match_confidence BETWEEN 0 AND 100
    desc: Percentage range.
  - name: ck_duplicate_candidate_match_review_pair
    type: check
    expr: (reviewed_at IS NULL) = (reviewed_by_app_user_id IS NULL)
    desc: Reviewer recorded with review time.
  indexes:
  - name: idx_duplicate_candidate_match_duplicate_app_user_id
    columns:
    - duplicate_app_user_id
    desc: Matches where the account is the second member.
  - name: idx_duplicate_candidate_match_duplicate_match_status_id_match_confidence
    columns:
    - duplicate_match_status_id
    - match_confidence DESC
    desc: Review queue ordered by confidence.
    where: reviewed_at IS NULL
  - name: idx_duplicate_candidate_match_reviewed_by_app_user_id
    columns:
    - reviewed_by_app_user_id
    desc: Reviewer workload.
    where: reviewed_by_app_user_id IS NOT NULL
  fks:
  - name: fk_duplicate_candidate_match_primary_app_user_id
    columns:
    - primary_app_user_id
    ref: app_user
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: accounts are never hard-deleted'
  - name: fk_duplicate_candidate_match_duplicate_app_user_id
    columns:
    - duplicate_app_user_id
    ref: app_user
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: accounts are never hard-deleted'
