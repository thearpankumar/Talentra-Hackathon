  - name: ck_purge_job_run_finished_after_start
    type: check
    expr: finished_at IS NULL OR finished_at >= started_at
    desc: Finish after start.
  - name: ck_purge_job_run_counts
    type: check
    expr: rows_scanned >= 0 AND rows_purged >= 0 AND rows_held >= 0 AND rows_purged + rows_held <= rows_scanned
