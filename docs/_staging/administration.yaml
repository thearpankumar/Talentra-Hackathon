- name: admin_action_approval
  kind: event
  delete_policy: hard
  volume: medium
  tier: X
  milestones:
  - B33
  - B59
  - B78
  retention: Kept 7 years (evidence for audit_event rows).
  description: 'Four-eyes approval: a sensitive action (permission.requires_four_eyes) is requested by one admin and must be approved by a different admin before the executing service role performs it.
    The approval row is referenced from the resulting audit_event.'
  columns:
  - name: permission_id
    type: UUID
    domain: identifier
    desc: Permission that required approval.
    sens: Internal
  - name: requested_by_app_user_id
    type: UUID
    domain: identifier
    desc: Requester.
    sens: Internal
  - name: approver_app_user_id
    type: UUID
    domain: identifier
    desc: Approving/rejecting admin.
    sens: Internal
    'null': true
    null_why: NULL while pending.
  - name: approval_status_id
    type: UUID
    domain: enum_ref
    desc: Pending/approved/rejected/executed.
    sens: Internal
  - name: audit_entity_type_id
    type: UUID
    domain: enum_ref
    desc: Kind of entity the action targets.
    sens: Internal
  - name: target_entity_ref
    type: UUID
    domain: identifier
    desc: Target row id (polymorphic).
    sens: Internal
    'null': true
    null_why: NULL for actions without a single target (bulk export).
  - name: proposed_change
    type: JSONB
    domain: json
    desc: Proposed change, PII-minimised.
    sens: Internal
    'null': true
    null_why: NULL when the permission needs no payload.
  - name: request_note
    type: STRING(500)
    domain: free_text
    desc: Requester's justification.
    sens: Internal
  - name: decision_note
    type: STRING(500)
    domain: free_text
    desc: Approver's note.
    sens: Internal
    'null': true
    null_why: NULL while pending.
  - name: requested_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Request time.
    sens: Internal
    default: now()
  - name: decided_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Decision time.
    sens: Internal
    'null': true
    null_why: NULL while pending.
  - name: expires_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Approval lapses if not executed by then.
    sens: Internal
  constraints:
  - name: ck_admin_action_approval_different_people
    type: check
    expr: approver_app_user_id IS NULL OR approver_app_user_id <> requested_by_app_user_id
    desc: 'Four-eyes: approver differs from requester.'
  - name: ck_admin_action_approval_decision_pair
    type: check
