- name: audit_chain_head
  kind: config
  delete_policy: hard
  volume: low
  tier: '1'
  milestones:
  - B33
  - B59
  retention: Permanent (32 rows); history lives in audit_chain_checkpoint.
  description: Head pointer of each of 32 parallel audit hash chains. The audit writer locks one row (SELECT ... FOR UPDATE) to take the next chain_seq and previous hash, so chains are tamper-evident without
    one global serialisation point.
  columns:
  - name: chain_no
    type: INT2
    domain: quantity
    desc: Chain number 0..31 (request_ref hash modulo 32).
    sens: Internal
  - name: last_chain_seq
    type: INT8
    domain: quantity
    desc: Sequence number of the newest audit_event in this chain.
    sens: Internal
    default: '0'
  - name: last_row_hash
    type: BYTES
    domain: blob
    desc: row_hash of the newest event (chain tip).
    sens: Internal
    'null': true
    null_why: NULL = chain still empty.
  constraints:
  - name: uq_audit_chain_head_chain_no
    type: unique
    columns:
    - chain_no
    desc: One head per chain.
  - name: ck_audit_chain_head_chain_no_range
    type: check
    expr: chain_no BETWEEN 0 AND 31
    desc: 32 chains.
  - name: ck_audit_chain_head_seq_nonneg
    type: check
    expr: last_chain_seq >= 0 AND (last_chain_seq = 0) = (last_row_hash IS NULL)
    desc: Empty chain has no hash.
  indexes: []
  fks: []
- name: audit_event
  kind: audit
  delete_policy: append_only
  volume: very_high
  tier: '1'
  milestones:
  - B24
  - B33
  - B50
  - B53
  - B56
  - B59
  - B64
  - B71
  - B75
  - B79
  retention: 'Append-only. Hot table: row-level TTL 400 days AFTER the changefeed sink confirms the row (audit_chain_checkpoint.sink_confirmed_at); immutable sink (WORM, object lock) keeps 7 years; TTL
    job is paused (ttl_pause) while an audit-scoped legal_hold is active. Never anonymised: PII was minimised at write time.'
  description: 'Append-only, hash-chained audit trail of sensitive actions (docket Tier 1 ''audit and error logging''). Application roles have INSERT+SELECT only; UPDATE/DELETE are revoked. row_hash = SHA-256(canonical
    row fields || prev_hash); prev_hash = row_hash of (chain_no, chain_seq-1). A changefeed streams every row to an immutable (object-lock) sink before the hot-table TTL may delete it. before/after JSON
    is PII-minimised: only changed fields; Personal values replaced by HMAC token or masked.'
  ttl:
    expire_after: 400 days
    column: occurred_at
  columns:
  - name: occurred_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Event time at the source service (UTC).
    sens: Internal
    default: now()
  - name: actor_app_user_id
    type: UUID
    domain: identifier
    desc: Acting user (the system actor for batch jobs).
    sens: Internal
    'null': true
    null_why: NULL = unauthenticated guest caller.
  - name: actor_type_id
    type: UUID
    domain: enum_ref
    desc: Actor type at the time (snapshot; survives later role changes).
    sens: Internal
  - name: impersonator_app_user_id
    type: UUID
    domain: identifier
    desc: Support user acting as the actor.
    sens: Internal
    'null': true
    null_why: NULL = no impersonation.
  - name: audit_action_id
    type: UUID
    domain: enum_ref
    desc: What happened.
    sens: Internal
  - name: audit_entity_type_id
    type: UUID
    domain: enum_ref
    desc: Kind of entity affected.
    sens: Internal
  - name: entity_ref
    type: UUID
    domain: identifier
    desc: Affected row id (polymorphic, hence *_ref and no FK).
    sens: Internal
    'null': true
    null_why: NULL for actions without a single target (e.g. login_override, config scan).
  - name: organisation_ref
    type: UUID
    domain: identifier
    desc: 'Tenant of the action (no FK: audit must outlive organisation purge).'
    sens: Internal
    'null': true
    null_why: NULL for platform-level actions.
  - name: audit_outcome_id
    type: UUID
    domain: enum_ref
    desc: Success, denied or failed.
    sens: Internal
  - name: before_state
    type: JSONB
    domain: json
    desc: Changed fields before the action (PII-minimised).
    sens: Internal
    'null': true
    null_why: NULL for create/read actions.
  - name: after_state
    type: JSONB
    domain: json
    desc: Changed fields after the action (PII-minimised).
    sens: Internal
    'null': true
    null_why: NULL for delete/read actions.
  - name: reason_text
    type: STRING(500)
    domain: free_text
    desc: Reason supplied for the action (e.g. break-glass justification).
    sens: Internal
    'null': true
    null_why: NULL = none required.
  - name: request_ref
    type: UUID
    domain: identifier
    desc: Request/trace correlation id (no FK).
    sens: Internal
  - name: identity_session_ref
    type: UUID
    domain: identifier
    desc: 'identity_session.id in force (no FK: avoids a check per audit write).'
    sens: Internal
    'null': true
    null_why: NULL for system jobs.
  - name: ip_address
    type: INET
    domain: ip_address
    desc: Caller IP.
    sens: Personal
    'null': true
    null_why: NULL for system jobs.
    pii: 'IP address is personal data: access-controlled; truncated to /24 (v4) or /48 (v6) by the retention job after 90 days'
  - name: user_agent
    type: STRING(512)
    domain: free_text
    desc: Caller user agent.
    sens: Personal
    'null': true
    null_why: NULL for system jobs.
    pii: access-controlled; set to NULL by sink-side redaction after 90 days (hot table only, hash unaffected because excluded from row_hash)
  - name: chain_no
    type: INT2
    domain: quantity
    desc: Parallel chain number 0..31.
    sens: Internal
  - name: chain_seq
    type: INT8
    domain: quantity
    desc: Position within the chain (from audit_chain_head).
    sens: Internal
  - name: prev_hash
    type: BYTES
    domain: blob
    desc: row_hash of the previous event in the chain.
    sens: Internal
    'null': true
    null_why: NULL for chain_seq = 1.
  - name: row_hash
    type: BYTES
    domain: blob
    desc: SHA-256 over canonical (id, occurred_at, actor, action, entity, before, after, request_ref, chain_no, chain_seq, prev_hash).
    sens: Internal
  constraints:
  - name: uq_audit_event_chain_position
    type: unique
    columns:
    - chain_no
    - chain_seq
    desc: One event per chain position; gap/duplicate detection.
  - name: ck_audit_event_chain_first
    type: check
    expr: (chain_seq = 1) = (prev_hash IS NULL)
    desc: Only the first event of a chain lacks a predecessor hash.
  - name: ck_audit_event_chain_no_range
    type: check
    expr: chain_no BETWEEN 0 AND 31
    desc: 32 chains.
  - name: ck_audit_event_hash_len
    type: check
    expr: length(row_hash) = 32
    desc: SHA-256 digest.
  indexes:
  - name: idx_audit_event_occurred_at
    columns:
    - occurred_at
    desc: Time-ordered scans, changefeed catch-up and TTL without a single hot range.
    hash: true
    bucket_count: 16
  - name: idx_audit_event_actor_app_user_id_occurred_at
    columns:
    - actor_app_user_id
    - occurred_at DESC
    desc: What did this user do (B53 audit event to actor).
    where: actor_app_user_id IS NOT NULL
  - name: idx_audit_event_audit_entity_type_id_entity_ref_occurred_at
    columns:
    - audit_entity_type_id
    - entity_ref
    - occurred_at DESC
    desc: History of one entity.
    where: entity_ref IS NOT NULL
  - name: idx_audit_event_request_ref
    columns:
    - request_ref
    desc: Reassemble one request.
  - name: idx_audit_event_impersonator_app_user_id_occurred_at
    columns:
    - impersonator_app_user_id
    - occurred_at DESC
    desc: Everything done under impersonation by a support user.
    where: impersonator_app_user_id IS NOT NULL
  fks:
  - name: fk_audit_event_actor_app_user_id
    columns:
    - actor_app_user_id
    ref: app_user
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: audit rows never cascade; users are anonymised, not deleted'
  - name: fk_audit_event_actor_type_id
    columns:
    - actor_type_id
    ref: actor_type
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: a lookup value in use cannot be removed (retire with is_active)'
    index_exempt: lookup rows are never deleted (RESTRICT cannot fire) and the column is low-cardinality; a dedicated index would only add write cost
  - name: fk_audit_event_impersonator_app_user_id
    columns:
    - impersonator_app_user_id
    ref: app_user
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: audit rows never cascade'
  - name: fk_audit_event_audit_action_id
    columns:
    - audit_action_id
    ref: audit_action
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: a lookup value in use cannot be removed (retire with is_active)'
    index_exempt: lookup rows are never deleted (RESTRICT cannot fire) and the column is low-cardinality; a dedicated index would only add write cost
  - name: fk_audit_event_audit_entity_type_id
    columns:
    - audit_entity_type_id
    ref: audit_entity_type
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: a lookup value in use cannot be removed (retire with is_active)'
    index_exempt: lookup rows are never deleted (RESTRICT cannot fire) and the column is low-cardinality; a dedicated index would only add write cost
  - name: fk_audit_event_audit_outcome_id
    columns:
    - audit_outcome_id
    ref: audit_outcome
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: a lookup value in use cannot be removed (retire with is_active)'
    index_exempt: lookup rows are never deleted (RESTRICT cannot fire) and the column is low-cardinality; a dedicated index would only add write cost
- name: audit_chain_checkpoint
  kind: snapshot
  delete_policy: append_only
  volume: medium
  tier: '1'
  milestones:
  - B33
  - B59
  - B78
  retention: Kept for the life of the audit sink (7 years).
  description: 'Periodic (every 5 minutes) anchor of a chain segment: first/last sequence and the tip hash, shipped to the immutable sink. Lets an auditor verify the chain without trusting the live database
    and gates TTL deletion of hot rows.'
  columns:
  - name: audit_chain_head_id
    type: UUID
    domain: identifier
    desc: Chain the segment belongs to.
    sens: Internal
  - name: from_chain_seq
    type: INT8
    domain: quantity
    desc: First sequence in the segment.
    sens: Internal
  - name: to_chain_seq
    type: INT8
    domain: quantity
    desc: Last sequence in the segment.
    sens: Internal
  - name: tip_hash
    type: BYTES
    domain: blob
    desc: row_hash of the last event in the segment.
    sens: Internal
  - name: signature
    type: BYTES
    domain: blob
    desc: Detached signature of (chain, from, to, tip_hash) by the audit signing key.
    sens: Internal
    'null': true
    null_why: NULL until the signer service processes the checkpoint.
  - name: sink_object_ref
    type: STRING(500)
    domain: url
    desc: Object-store key of the immutable (object-lock) segment file.
    sens: Internal
    'null': true
    null_why: NULL until the changefeed segment is written.
  - name: sink_confirmed_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: When the sink acknowledged durable WORM storage.
    sens: Internal
    'null': true
    null_why: NULL = not yet confirmed; hot rows must not be TTL-deleted.
  - name: verified_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Last time the verifier recomputed the segment hash.
    sens: Internal
    'null': true
    null_why: NULL = not yet verified.
  constraints:
  - name: ck_audit_chain_checkpoint_seq_order
    type: check
    expr: to_chain_seq >= from_chain_seq
    desc: Segment well-formed.
  - name: uq_audit_chain_checkpoint_segment
    type: unique
    columns:
    - audit_chain_head_id
    - from_chain_seq
    desc: One checkpoint per segment start.
  indexes: []
  fks:
  - name: fk_audit_chain_checkpoint_audit_chain_head_id
    columns:
    - audit_chain_head_id
    ref: audit_chain_head
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: heads are permanent'
- name: user_block
  kind: entity
  delete_policy: hard
  volume: high
  tier: '1'
  milestones:
  - B24
  - B50
  - B53
  - B59
  - B62
  - B71
  retention: Rows kept 3 years after effective_to for dispute handling, then hard-purged; both parties' rows anonymised on erasure of either.
  description: 'Block of one user by another. Main use: a candidate blocks employers, recruiters and consultants; a blocked party must not see the blocker''s candidate (vw_candidate_visible_to_user). Effective-dated:
    unblock closes the row, re-block opens a new one.'
  no_hash_why: Keys are random UUIDs of users; there is no time-ordered access path.
  columns:
  - name: blocker_app_user_id
    type: UUID
    domain: identifier
    desc: User who blocks.
    sens: Internal
  - name: blocked_app_user_id
    type: UUID
    domain: identifier
    desc: User who is blocked.
    sens: Internal
  - name: blocker_actor_type_id
    type: UUID
    domain: enum_ref
    desc: Blocker's actor type (pinned to app_user by composite FK).
    sens: Internal
  - name: blocked_actor_type_id
    type: UUID
    domain: enum_ref
    desc: Blocked user's actor type (pinned to app_user by composite FK).
    sens: Internal
  - name: block_reason_id
    type: UUID
    domain: enum_ref
    desc: Reason category.
    sens: Internal
  - name: note
    type: STRING(500)
    domain: free_text
    desc: Optional free-text note by the blocker.
    sens: Personal
    'null': true
    null_why: NULL = no note given.
    pii: visible only to the blocker and support under impersonation approval; cleared on erasure
  - name: effective_from
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Block starts.
    sens: Internal
    default: now()
  - name: effective_to
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Block lifted.
    sens: Internal
    'null': true
    null_why: NULL = open-ended/ongoing.
  constraints:
  - name: ck_user_block_not_self
    type: check
    expr: blocker_app_user_id <> blocked_app_user_id
    desc: A user cannot block themselves.
  - name: ck_user_block_range
    type: check
