- name: user_merge_request
  kind: entity
  delete_policy: hard
  volume: medium
  tier: X
  milestones:
  - B24
  - B60
  - B33
  retention: Kept 7 years as evidence of account history.
  description: Workflow to merge a duplicate account into a surviving one (child rows re-pointed by a controlled job). Requires a four-eyes approval.
  columns:
  - name: surviving_app_user_id
    type: UUID
    domain: identifier
    desc: Account that remains.
    sens: Internal
  - name: merged_app_user_id
    type: UUID
    domain: identifier
    desc: Account folded into the survivor (status becomes merged).
    sens: Internal
  - name: duplicate_candidate_match_id
    type: UUID
    domain: identifier
    desc: Detection that triggered the request.
    sens: Internal
    'null': true
    null_why: NULL = merge requested manually without detection.
  - name: admin_action_approval_id
    type: UUID
    domain: identifier
    desc: Four-eyes approval.
    sens: Internal
    'null': true
    null_why: NULL until approval is requested.
  - name: approval_status_id
    type: UUID
    domain: enum_ref
    desc: Workflow state.
    sens: Internal
  - name: merge_plan
    type: JSONB
    domain: json
    desc: Per-table re-pointing plan and row counts (no PII).
    sens: Internal
    'null': true
    null_why: NULL until the planning step runs.
  - name: executed_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: When child rows were moved.
    sens: Internal
    'null': true
    null_why: NULL = not yet executed.
  - name: undo_until_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Reversal window end (30 days).
    sens: Internal
    'null': true
    null_why: NULL until executed.
