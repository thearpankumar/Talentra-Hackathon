  - name: idx_data_subject_request_app_user_id_received_at
    columns:
    - app_user_id
    - received_at DESC
    desc: Requests of a user.
  - name: idx_data_subject_request_assigned_to_app_user_id_due_at
    columns:
    - assigned_to_app_user_id
    - due_at
    desc: Officer queue.
    where: completed_at IS NULL AND assigned_to_app_user_id IS NOT NULL
  - name: idx_data_subject_request_country_id
    columns:
