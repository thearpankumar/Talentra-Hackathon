- name: audit_export
  kind: event
  delete_policy: hard
  volume: medium
  tier: X
  milestones:
  - B33
  - B59
  - B78
  retention: Request row kept 7 years; file destroyed at expires_at (7 days).
  description: Request to export audit events (regulator, internal investigation). Large exports and PII exports need four-eyes approval; output is an encrypted file with a SHA-256 for chain of custody.
  columns:
  - name: requested_by_app_user_id
    type: UUID
    domain: identifier
    desc: Requester.
    sens: Internal
  - name: admin_action_approval_id
    type: UUID
    domain: identifier
    desc: Approval.
    sens: Internal
    'null': true
    null_why: NULL for exports below the approval threshold.
  - name: purpose
    type: STRING(500)
    domain: free_text
    desc: Why the export is needed.
    sens: Internal
  - name: filter_criteria
    type: JSONB
    domain: json
    desc: Time range, actor, entity and action filters.
    sens: Internal
  - name: period_from_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Export window start.
    sens: Internal
  - name: period_to_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Export window end.
    sens: Internal
  - name: job_run_status_id
    type: UUID
    domain: enum_ref
    desc: Run state.
    sens: Internal
  - name: row_count
    type: INT8
    domain: quantity
    desc: Rows exported.
    sens: Internal
    'null': true
    null_why: NULL until the job finishes.
  - name: file_ref
    type: STRING(500)
    domain: url
    desc: Encrypted file location.
    sens: Internal
    'null': true
    null_why: NULL until produced.
  - name: file_sha256
    type: BYTES
    domain: blob
    desc: SHA-256 of the file.
    sens: Internal
    'null': true
    null_why: NULL until produced.
  - name: expires_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: File destruction time.
    sens: Internal
  - name: downloaded_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: First download.
    sens: Internal
    'null': true
    null_why: NULL = not downloaded.
  constraints:
  - name: ck_audit_export_period
    type: check
    expr: period_to_at >= period_from_at
    desc: Window ordered (period_from_at, period_to_at).
  - name: ck_audit_export_expiry
    type: check
    expr: expires_at > created_at
    desc: Expiry after creation.
  indexes:
  - name: idx_audit_export_requested_by_app_user_id_created_at
    columns:
    - requested_by_app_user_id
    - created_at DESC
    desc: Exports by user.
  - name: idx_audit_export_admin_action_approval_id
    columns:
    - admin_action_approval_id
    desc: From approval to export.
    where: admin_action_approval_id IS NOT NULL
  fks:
  - name: fk_audit_export_requested_by_app_user_id
    columns:
    - requested_by_app_user_id
    ref: app_user
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: accountability'
  - name: fk_audit_export_admin_action_approval_id
    columns:
    - admin_action_approval_id
    ref: admin_action_approval
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: evidence'
  - name: fk_audit_export_job_run_status_id
    columns:
    - job_run_status_id
    ref: job_run_status
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: a lookup value in use cannot be removed (retire with is_active)'
    index_exempt: lookup rows are never deleted (RESTRICT cannot fire) and the column is low-cardinality; a dedicated index would only add write cost
views:
- name: vw_candidate_visible_to_user
  kind: view
  tables:
  - user_block
  - organisation_block
  - app_user
  - candidate_profile
  - recruiter_organisation_mapping
  purpose: 'Exact visibility predicate for ''a blocked party must not see the blocker''s candidate'': one row per (viewer, candidate) pair that is NOT blocked. WARNING: the view is a CROSS JOIN of all employer-side
    viewers with all candidates; it is only usable with the viewer filter `viewer_app_user_id = $1` (or via fn_candidate_visible_to_user(p_viewer_app_user_id)). The viewer filter is mandatory.'
  security: 'SELECT granted to app_rw/search_export roles instead of base candidate tables for employer/recruiter/consultant calls. The data-access layer injects the viewer id as a function/query ARGUMENT
    from the authenticated session, never from client input and not through a custom session variable (unverified, crdb_capabilities row 10). An unfiltered query is a Cartesian product (viewers x candidates)
    and a denial-of-service vector: pool roles run with a short statement_timeout, and the CI lint rejects SQL that references this view without a viewer_app_user_id predicate (AT-05).'
  sql_sketch: |-
    CREATE VIEW vw_candidate_visible_to_user AS
    SELECT v.id AS viewer_app_user_id, cp.id AS candidate_profile_id, cp.app_user_id AS candidate_app_user_id
    FROM app_user v
    JOIN actor_type vt ON vt.id = v.actor_type_id AND vt.code IN ('employer','recruiter','consultant','placement_officer')
    CROSS JOIN candidate_profile cp
    WHERE v.deleted_at IS NULL AND cp.deleted_at IS NULL
      AND NOT EXISTS (SELECT 1 FROM user_block ub
                      WHERE ub.blocker_app_user_id = cp.app_user_id AND ub.blocked_app_user_id = v.id AND ub.effective_to IS NULL)
      AND NOT EXISTS (SELECT 1 FROM organisation_block ob
                      JOIN recruiter_organisation_mapping rom ON rom.organisation_id = ob.organisation_id
                      WHERE ob.candidate_profile_id = cp.id AND ob.effective_to IS NULL
                        AND rom.app_user_id = v.id AND rom.effective_to IS NULL);
    -- usage: SELECT ... FROM vw_candidate_visible_to_user WHERE viewer_app_user_id = $1 AND candidate_profile_id IN (...);
    -- The optimizer pushes viewer_app_user_id into the view (no cross-join materialisation); probes use
    -- uq_user_block_blocker_app_user_id_blocked_app_user_id_open and uq_organisation_block_organisation_id_candidate_profile_id_block_direction_id_open.
    -- preferred access path (viewer id is an argument):
    -- CREATE FUNCTION fn_candidate_visible_to_user(p_viewer_app_user_id UUID) RETURNS SETOF vw_candidate_visible_to_user
    --   LANGUAGE SQL STABLE AS $$ SELECT * FROM vw_candidate_visible_to_user WHERE viewer_app_user_id = p_viewer_app_user_id $$;
- name: vw_user_consent_current
  kind: view
  tables:
  - user_consent
  - consent_action
  purpose: Current consent state per user and consent type = latest event; 'granted' or 'renewed' means consent in force.
  security: Owner and privacy staff only; marketing senders read this view, never user_consent.
  sql_sketch: SELECT DISTINCT ON (app_user_id, consent_type_id) app_user_id, consent_type_id, consent_document_id, consent_action_id, occurred_at FROM user_consent ORDER BY app_user_id, consent_type_id,
    occurred_at DESC, id DESC;
- name: vw_user_effective_permission
  kind: view
  tables:
  - app_user_role
  - app_role
  - app_role_inheritance
  - app_role_permission
  - permission
  purpose: Effective permissions of each user (optionally per organisation) after resolving role inheritance with a recursive CTE and filtering effective-dated grants.
  security: Read by the authorisation service; cached per session.
  sql_sketch: WITH RECURSIVE r(app_user_id, organisation_id, app_role_id) AS (SELECT app_user_id, organisation_id, app_role_id FROM app_user_role WHERE effective_from <= now() AND (effective_to IS NULL
    OR effective_to > now()) UNION SELECT r.app_user_id, r.organisation_id, i.parent_app_role_id FROM r JOIN app_role_inheritance i ON i.child_app_role_id = r.app_role_id) SELECT r.app_user_id, r.organisation_id,
    p.code, rp.data_scope_id FROM r JOIN app_role_permission rp ON rp.app_role_id = r.app_role_id JOIN permission p ON p.id = rp.permission_id AND p.deleted_at IS NULL;
- name: vw_app_user_public
  kind: view
  tables:
  - app_user
  purpose: 'Masked projection of app_user for staff screens: masked email/phone, no erasure internals.'
  security: Default read path for support roles; unmasked email/phone requires the app_user.view_pii permission (audited).
  sql_sketch: SELECT id, display_name, actor_type_id, user_status_id, regexp_replace(email, '(^.).*(@.*$)', '\1***\2') AS email_masked, '***' || right(phone, 4) AS phone_masked, last_login_at FROM app_user
    WHERE deleted_at IS NULL;
- name: vw_audit_event_redacted
  kind: view
  tables:
  - audit_event
  purpose: Audit trail for auditors without IP/user agent and with before/after states removed (field names only).
  security: audit_reader role; full table access only via audit_export with approval.
  sql_sketch: SELECT id, occurred_at, actor_app_user_id, audit_action_id, audit_entity_type_id, entity_ref, audit_outcome_id, request_ref FROM audit_event;
business_rules:
- id: BR-ADM-01
  rule: Recruiters (and employers) cannot register candidates; accounts exist only for permitted (actor, registrar, channel) combinations.
  mechanism_type: FK
  mechanism: app_user composite FK (actor_type_id, registrar_actor_type_id, registration_channel_id) -> registration_policy(uq combo); no (candidate, recruiter|employer, *) row is seeded.
  tables:
  - app_user
  - registration_policy
  milestone: B33
- id: BR-ADM-02
  rule: E-mail and phone identify at most one live account.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: uq_app_user_email_live / uq_app_user_phone_live WHERE ... AND deleted_at IS NULL; CHECK email = lower(email); phone E.164 regex.
  tables:
  - app_user
  milestone: B30
- id: BR-ADM-03
  rule: Exactly one active password credential per user.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: uq_user_credential_app_user_id_active UNIQUE (app_user_id) WHERE is_active; CHECK is_active = (deactivated_at IS NULL); change = txn that deactivates old row and inserts new.
  tables:
  - user_credential
  milestone: B59
- id: BR-ADM-04
  rule: Credentials are stored only as argon2id hashes and readable only by the auth service role.
  mechanism_type: PRIVILEGE
  mechanism: GRANT SELECT,INSERT,UPDATE ON user_credential, mfa_factor, password_reset_token, email_verification_token, identity_session TO auth_svc only; no grant to app_rw; password_hash excluded from
    every view and audit JSON.
  tables:
  - user_credential
  - mfa_factor
  milestone: B56
- id: BR-ADM-05
  rule: A user holds a role at most once per scope while open; organisation-scoped roles require an organisation, platform roles forbid one.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: uq_app_user_role_app_user_id_app_role_id_platform_open (WHERE organisation_id IS NULL AND effective_to IS NULL), ..._org_open; composite FK (app_role_id,is_organisation_scoped)->app_role +
    CHECK is_organisation_scoped = (organisation_id IS NOT NULL).
  tables:
  - app_user_role
  - app_role
  milestone: B27
- id: BR-ADM-06
  rule: Only eligible actor types can hold a role (a candidate can never hold admin).
  mechanism_type: FK
  mechanism: app_user_role composite FKs (app_user_id,actor_type_id)->app_user(id,actor_type_id) and (app_role_id,actor_type_id)->app_role_eligibility.
  tables:
  - app_user_role
  - app_role_eligibility
  milestone: B33
- id: BR-ADM-07
  rule: Role hierarchy has no self-edge and no duplicate edges; longer cycles are rejected in the admin txn.
  mechanism_type: CHECK
  mechanism: ck_app_role_inheritance_not_self; uq pair; admin API checks cycles under SERIALIZABLE.
  tables:
  - app_role_inheritance
  milestone: B27
- id: BR-ADM-08
  rule: Audit trail is append-only for application roles.
  mechanism_type: PRIVILEGE
  mechanism: REVOKE UPDATE, DELETE ON audit_event, user_consent, user_credential_history, audit_chain_checkpoint FROM app_rw, audit_writer; only INSERT/SELECT granted; no UPDATE/DELETE trigger needed.
  tables:
  - audit_event
  - user_consent
  milestone: B33
- id: BR-ADM-09
  rule: Audit rows are tamper-evident.
  mechanism_type: CHAIN_FK
  mechanism: chain_no/chain_seq unique; row_hash = SHA-256(fields||prev_hash); audit_chain_head locked FOR UPDATE per write; CHECK (chain_seq=1) = (prev_hash IS NULL); signed checkpoints in WORM sink; verifier
    job raises security_event(audit_chain_break).
  tables:
  - audit_event
  - audit_chain_head
  - audit_chain_checkpoint
  milestone: B59
- id: BR-ADM-10
  rule: Audit hot rows are removed only after the immutable sink confirmed them.
  mechanism_type: TTL
  mechanism: Row-level TTL on audit_event (400 days) gated by audit_chain_checkpoint.sink_confirmed_at (job pauses TTL via ttl_pause otherwise) and by legal_hold on entity_table_name='audit_event'; changefeed
    to object-lock bucket.
  tables:
  - audit_event
  - audit_chain_checkpoint
  - legal_hold
  milestone: B33
- id: BR-ADM-11
  rule: Every sensitive permission use is audited.
  mechanism_type: APP_LAYER
  mechanism: permission.is_sensitive=true -> authorisation layer writes audit_event in the same transaction as the action (outbox if cross-service); test B79 asserts one audit row per sensitive call.
  tables:
  - permission
  - audit_event
  milestone: B79
- id: BR-ADM-12
  rule: A blocked party must not see the blocker's candidate.
  mechanism_type: VIEW
  mechanism: vw_candidate_visible_to_user (NOT EXISTS user_block, NOT EXISTS organisation_block); all employer/recruiter/consultant candidate reads go through it; search export excludes blocked viewers
    at query time.
  tables:
  - user_block
  - organisation_block
  milestone: B59
- id: BR-ADM-13
  rule: At most one open block per pair; blocker and blocked differ; block types follow block_policy.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: uq_user_block_..._open WHERE effective_to IS NULL; ck_user_block_not_self; composite FKs to app_user(id,actor_type_id) and block_policy.
  tables:
  - user_block
  - block_policy
  milestone: B59
- id: BR-ADM-14
  rule: At most one open organisation block per company, candidate and direction.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: uq_organisation_block_..._open WHERE effective_to IS NULL.
  tables:
  - organisation_block
  milestone: B59
- id: BR-ADM-15
  rule: Consent is event-sourced; withdrawal never deletes the grant; event type matches its document.
  mechanism_type: CHAIN_FK
  mechanism: user_consent append-only; composite FK (consent_document_id, consent_type_id) -> consent_document(id, consent_type_id); current state view vw_user_consent_current.
  tables:
  - user_consent
  - consent_document
  milestone: B50
- id: BR-ADM-16
  rule: Refresh tokens are single use; reuse revokes the family.
  mechanism_type: TXN_LOCK
  mechanism: 'Refresh txn: SELECT ... FROM identity_session WHERE refresh_token_hash=$1 FOR UPDATE; if revoked_at set -> revoke WHERE token_family_ref=$2 and insert security_event; else insert child row
    and set revoked_at (reason rotated).'
  tables:
  - identity_session
  - security_event
  milestone: B56
- id: BR-ADM-17
  rule: Expired sessions and tokens disappear automatically.
  mechanism_type: TTL
  mechanism: Row-level TTL on identity_session (expires_at + 7 days), password_reset_token and email_verification_token (30 days), error_log (90 days).
  tables:
  - identity_session
  - password_reset_token
  - error_log
  milestone: B50
- id: BR-ADM-18
  rule: 'Four-eyes: approver differs from requester; break-glass window max 4 hours and approver differs.'
  mechanism_type: CHECK
  mechanism: ck_admin_action_approval_different_people; ck_privileged_access_request_different_people and _window.
  tables:
  - admin_action_approval
  - privileged_access_request
  milestone: B33
- id: BR-ADM-19
  rule: One open impersonation per support user; write mode needs approval; impersonator recorded in audit.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: uq_impersonation_session_support_app_user_id_open WHERE ended_at IS NULL; ck_impersonation_session_write_needs_approval; audit_event.impersonator_app_user_id.
  tables:
  - impersonation_session
  - audit_event
  milestone: B33
- id: BR-ADM-20
  rule: Erasure and purge respect legal holds; each hold has exactly one scope.
  mechanism_type: CHECK
  mechanism: ck_legal_hold_exactly_one_scope; purge_svc and DSR workflow check active holds (released_at IS NULL) before acting; data_retention_policy.honours_legal_hold.
  tables:
  - legal_hold
  - data_subject_request
  - purge_job_run
  milestone: B24
- id: BR-ADM-21
  rule: Retention is data-driven and evidenced.
  mechanism_type: JOB
  mechanism: purge jobs read data_retention_policy (one live rule per table/trigger/jurisdiction, partial unique) and write purge_job_run counts; inactivity purge uses idx_app_user_last_login_at.
  tables:
  - data_retention_policy
  - purge_job_run
  - app_user
  milestone: B24
- id: BR-ADM-22
  rule: 'Merged accounts: an account is merged at most once and never into itself.'
  mechanism_type: PARTIAL_UNIQUE
  mechanism: uq_user_merge_request_merged_app_user_id WHERE executed_at IS NOT NULL; ck_user_merge_request_not_self; duplicate pairs stored once via ck primary < duplicate.
  tables:
  - user_merge_request
  - duplicate_candidate_match
  milestone: B24
- id: BR-ADM-23
  rule: PII in administration columns is classified and protected.
  mechanism_type: APP_LAYER
  mechanism: 'Sensitive (hashes, MFA ciphertext, tokens): auth_svc only, hash/ciphertext at rest. Personal (email, phone, IP, user agent, names): access-controlled, masked via vw_app_user_public, IP truncated
    after 90 days, anonymised in place on erasure.'
  tables:
  - app_user
  - user_credential
  milestone: B75
- id: BR-ADM-24
  rule: API keys are stored only as hashes and are revocable per client.
  mechanism_type: UNIQUE
  mechanism: uq_api_key_key_hash; key_prefix for identification; revoked_at/expires_at checked at auth.
  tables:
  - api_key
  - api_client
  milestone: B56
- id: BR-ADM-25
  rule: Dates in effective-dated administration rows are ordered.
  mechanism_type: CHECK
  mechanism: end >= start CHECKs on app_user_role, user_block, organisation_block, trusted_ip, consent_document.
  tables:
  - app_user_role
  - user_block
  milestone: B33
