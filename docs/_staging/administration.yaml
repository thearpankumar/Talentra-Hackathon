    desc: Rows with trigger time before this were eligible.
    sens: Internal
  - name: started_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Run start.
    sens: Internal
    default: now()
  - name: finished_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Run end.
    sens: Internal
    'null': true
    null_why: NULL while running.
  - name: rows_scanned
    type: INT8
    domain: quantity
    desc: Rows examined.
    sens: Internal
    default: '0'
  - name: rows_purged
    type: INT8
    domain: quantity
    desc: Rows anonymised/deleted.
    sens: Internal
    default: '0'
  - name: rows_held
    type: INT8
    domain: quantity
    desc: Rows skipped by legal hold.
    sens: Internal
    default: '0'
  - name: is_dry_run
    type: BOOL
