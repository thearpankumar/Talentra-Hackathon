- name: app_user_role
  kind: link
  delete_policy: hard
  volume: medium
  tier: '1'
  milestones:
  - B24
  - B27
  - B30
  - B33
  - B62
  retention: Rows are never deleted; revocation sets effective_to. Kept 7 years after revocation, then archived with the user.
  description: User-to-role assignment, effective-dated. Platform roles have organisation_id NULL; organisation-scoped roles carry the tenant (D-11). Actor-type eligibility and scope-consistency are enforced
    by composite FKs, not application code.
  columns:
  - name: app_user_id
    type: UUID
    domain: identifier
    desc: Holder.
    sens: Internal
  - name: app_role_id
    type: UUID
    domain: identifier
    desc: Role granted.
    sens: Internal
  - name: organisation_id
    type: UUID
    domain: identifier
    desc: Tenant the grant is limited to.
    sens: Internal
    'null': true
    null_why: NULL = platform-wide grant.
  - name: actor_type_id
    type: UUID
    domain: enum_ref
    desc: Copy of holder's actor type (pinned by composite FK to app_user).
    sens: Internal
  - name: is_organisation_scoped
    type: BOOL
    domain: boolean
    desc: Copy of role scope flag (pinned by composite FK to app_role); must equal (organisation_id IS NOT NULL).
    sens: Internal
    default: 'false'
  - name: effective_from
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Grant start.
    sens: Internal
    default: now()
  - name: effective_to
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Grant end.
    sens: Internal
    'null': true
    null_why: NULL = open-ended/ongoing.
  - name: revoke_reason
    type: STRING(300)
    domain: free_text
    desc: Why the grant ended.
    sens: Internal
    'null': true
    null_why: NULL while active or when no reason recorded.
  constraints:
  - name: ck_app_user_role_range
    type: check
    expr: effective_to IS NULL OR effective_to >= effective_from
    desc: End not before start.
  - name: ck_app_user_role_scope_matches_org
    type: check
    expr: is_organisation_scoped = (organisation_id IS NOT NULL)
    desc: Org-scoped roles require an organisation; platform roles forbid one.
  indexes:
  - name: uq_app_user_role_app_user_id_app_role_id_platform_open
    columns:
    - app_user_id
    - app_role_id
    desc: One open platform-wide grant per user and role.
    where: organisation_id IS NULL AND effective_to IS NULL
    unique: true
  - name: uq_app_user_role_app_user_id_app_role_id_organisation_id_org_open
    columns:
    - app_user_id
    - app_role_id
    - organisation_id
    desc: One open org-scoped grant per user, role and organisation.
    where: organisation_id IS NOT NULL AND effective_to IS NULL
    unique: true
  - name: idx_app_user_role_app_role_id_organisation_id
    columns:
    - app_role_id
    - organisation_id
    desc: Members of a role within a tenant.
    where: effective_to IS NULL
  - name: idx_app_user_role_organisation_id_app_user_id
    columns:
    - organisation_id
    - app_user_id
    desc: Tenant staff list.
    where: organisation_id IS NOT NULL AND effective_to IS NULL
  fks:
  - name: fk_app_user_role_app_user_id
    columns:
    - app_user_id
    ref: app_user
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: users are never hard-deleted; history must survive'
  - name: fk_app_user_role_app_role_id
    columns:
    - app_role_id
    ref: app_role
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: roles are retired, not deleted'
  - name: fk_app_user_role_organisation_id
    columns:
    - organisation_id
    ref: organisation
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: organisation soft-deleted, history kept'
  - name: fk_app_user_role_actor_type_id
    columns:
    - actor_type_id
    ref: actor_type
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: a lookup value in use cannot be removed (retire with is_active)'
    index_exempt: lookup rows are never deleted (RESTRICT cannot fire) and the column is low-cardinality; a dedicated index would only add write cost
  - name: fk_app_user_role_app_user_actor_type
    columns:
    - app_user_id
    - actor_type_id
    ref: app_user
    ref_columns:
    - id
    - actor_type_id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: actor type snapshot must equal the user''s actual (immutable) type'
  - name: fk_app_user_role_app_role_scope
    columns:
    - app_role_id
    - is_organisation_scoped
    ref: app_role
    ref_columns:
    - id
    - is_organisation_scoped
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: scope flag must equal the role''s definition'
  - name: fk_app_user_role_app_role_eligibility
    columns:
    - app_role_id
    - actor_type_id
    ref: app_role_eligibility
    ref_columns:
    - app_role_id
    - actor_type_id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: only eligible actor types can hold the role'
    index_exempt: leading app_role_id is covered by idx_app_user_role_app_role_id_organisation_id
- name: user_credential
  kind: entity
  delete_policy: hard
  volume: high
  tier: '1'
  milestones:
  - B24
  - B30
  - B33
  - B50
  - B56
  - B59
  - B75
  retention: Active row kept while the account lives; superseded rows beyond the last 5 (reuse check) purged after 24 months by purge_job_run; all rows destroyed on erasure.
  description: 'Password credential. Every password set inserts a new row and deactivates the previous (is_active=false); a partial unique index guarantees exactly one active credential per user. SENSITIVE
    class: hash only, readable solely by the auth_svc DB role.'
  no_hash_why: Access is by app_user_id (random UUID); no time-ordered scan path exists.
  columns:
  - name: app_user_id
    type: UUID
    domain: identifier
    desc: Owner.
    sens: Internal
  - name: password_hash
    type: STRING(255)
    domain: secret_hash
    desc: Self-describing PHC string $argon2id$v=19$m=..,t=..,p=..$salt$hash (salt embedded; optional server-side pepper applied before hashing).
    sens: Sensitive
    pii: argon2id one-way hash (OWASP 2024 minimum m=19 MiB,t=2,p=1; Talentra default m=64 MiB,t=3,p=4); column grant limited to auth_svc; never logged or in audit before/after JSON
  - name: hash_algorithm_id
    type: UUID
    domain: enum_ref
    desc: Algorithm used; non-argon2id rows are legacy imports forced to rehash at next login.
    sens: Internal
  - name: argon2_memory_kib
    type: INT4
    domain: quantity
    desc: argon2 memory cost parameter (query key for 'needs rehash').
    sens: Internal
    'null': true
    null_why: NULL for non-argon2 legacy algorithms.
  - name: argon2_iterations
    type: INT2
    domain: quantity
    desc: argon2 time cost.
    sens: Internal
    'null': true
    null_why: NULL for non-argon2 legacy algorithms.
  - name: argon2_parallelism
    type: INT2
    domain: quantity
    desc: argon2 lanes.
    sens: Internal
    'null': true
    null_why: NULL for non-argon2 legacy algorithms.
  - name: pepper_version
    type: INT2
    domain: quantity
    desc: Version of the server-side pepper in the KMS used before hashing.
    sens: Internal
    'null': true
    null_why: NULL = no pepper (legacy import).
  - name: is_active
    type: BOOL
    domain: boolean
    desc: Exactly one active row per user.
    sens: Internal
    default: 'true'
  - name: credential_change_reason_id
    type: UUID
    domain: enum_ref
    desc: Why this credential was created.
    sens: Internal
  - name: password_set_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: When the password was set.
    sens: Internal
    default: now()
  - name: expires_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Policy expiry (admin accounts only).
    sens: Internal
    'null': true
    null_why: NULL = never expires.
  - name: must_change
    type: BOOL
    domain: boolean
    desc: Force change at next login (admin reset, breach).
    sens: Internal
    default: 'false'
  - name: breach_checked_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Last k-anonymity breached-password check.
    sens: Internal
    'null': true
    null_why: NULL = never checked (legacy import).
  - name: breach_detected_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: When the password was found in a breach corpus.
    sens: Internal
    'null': true
    null_why: NULL = not flagged.
  - name: deactivated_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: When superseded.
    sens: Internal
    'null': true
    null_why: NULL while active.
  constraints:
  - name: ck_user_credential_active_state
    type: check
    expr: is_active = (deactivated_at IS NULL)
    desc: Active iff not deactivated.
  - name: ck_user_credential_argon_params
    type: check
    expr: hash_algorithm_id IS NOT NULL AND (argon2_memory_kib IS NULL OR argon2_memory_kib >= 19456)
    desc: Floor on argon2 memory cost (OWASP minimum 19 MiB).
  - name: ck_user_credential_expiry_after_set
    type: check
    expr: expires_at IS NULL OR expires_at > password_set_at
    desc: Expiry after set.
  indexes:
  - name: uq_user_credential_app_user_id_active
    columns:
    - app_user_id
    desc: Exactly one active credential per user (docket B59).
    where: is_active
    unique: true
  - name: idx_user_credential_app_user_id_password_set_at
    columns:
    - app_user_id
    - password_set_at DESC
    desc: Last-N password reuse check and history.
  - name: idx_user_credential_breach_detected_at
    columns:
    - breach_detected_at
    desc: Forced-rotation sweep.
    where: breach_detected_at IS NOT NULL AND is_active
  fks:
  - name: fk_user_credential_app_user_id
    columns:
    - app_user_id
    ref: app_user
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: credential rows are purged by job, not cascaded from user'
  - name: fk_user_credential_hash_algorithm_id
    columns:
    - hash_algorithm_id
    ref: hash_algorithm
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: a lookup value in use cannot be removed (retire with is_active)'
    index_exempt: lookup rows are never deleted (RESTRICT cannot fire) and the column is low-cardinality; a dedicated index would only add write cost
  - name: fk_user_credential_credential_change_reason_id
    columns:
    - credential_change_reason_id
    ref: credential_change_reason
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: a lookup value in use cannot be removed (retire with is_active)'
    index_exempt: lookup rows are never deleted (RESTRICT cannot fire) and the column is low-cardinality; a dedicated index would only add write cost
- name: user_credential_history
  kind: event
  delete_policy: append_only
  volume: high
  tier: '1'
  milestones:
  - B30
  - B56
  - B59
  retention: 7 years (security evidence); IP/user agent cleared after 90 days; actor pseudonymised on erasure.
  description: Append-only log of credential lifecycle events (set, change, reset, rotation, MFA enrolment, lock-out). No secrets stored.
  columns:
  - name: app_user_id
    type: UUID
    domain: identifier
    desc: Subject user.
    sens: Internal
  - name: user_credential_id
    type: UUID
    domain: identifier
    desc: Credential row the event relates to.
    sens: Internal
    'null': true
    null_why: NULL for events without a credential row (reset requested, lock-out).
  - name: credential_event_type_id
    type: UUID
    domain: enum_ref
    desc: Event kind.
    sens: Internal
  - name: ip_address
    type: INET
    domain: ip_address
    desc: Caller IP.
    sens: Personal
    'null': true
    null_why: NULL for system-initiated events.
    pii: 'IP address is personal data: access-controlled; truncated to /24 (v4) or /48 (v6) by the retention job after 90 days'
  - name: user_agent
    type: STRING(512)
    domain: free_text
    desc: Caller user agent.
    sens: Personal
    'null': true
    null_why: NULL for system-initiated events.
    pii: access-controlled; dropped after 90 days by retention job
  - name: request_ref
    type: UUID
    domain: identifier
    desc: Request correlation id (matches audit_event.request_ref).
    sens: Internal
    'null': true
    null_why: NULL for batch jobs.
  constraints: []
  indexes:
  - name: idx_user_credential_history_app_user_id_created_at
    columns:
    - app_user_id
    - created_at DESC
    desc: Per-user credential timeline.
  - name: idx_user_credential_history_created_at
    columns:
    - created_at
    desc: Time-ordered scan for security review.
    hash: true
    bucket_count: 16
  - name: idx_user_credential_history_user_credential_id
    columns:
    - user_credential_id
    desc: Leading index for FK fk_user_credential_history_user_credential_id (parent-side delete check and child lookup).
  fks:
  - name: fk_user_credential_history_app_user_id
    columns:
    - app_user_id
    ref: app_user
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: evidence outlives credential rows'
  - name: fk_user_credential_history_user_credential_id
    columns:
    - user_credential_id
    ref: user_credential
    ref_columns:
    - id
    on_delete: SET NULL
    on_update: RESTRICT
    desc: 'SET NULL: credential rows are purged by retention job; the event stays'
  - name: fk_user_credential_history_credential_event_type_id
    columns:
    - credential_event_type_id
    ref: credential_event_type
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: a lookup value in use cannot be removed (retire with is_active)'
    index_exempt: lookup rows are never deleted (RESTRICT cannot fire) and the column is low-cardinality; a dedicated index would only add write cost
- name: mfa_factor
  kind: entity
  delete_policy: hard
  volume: medium
  tier: '1'
  milestones:
  - B30
  - B56
  retention: Destroyed (hard delete) 30 days after revocation and on erasure.
  description: Registered second factor. TOTP/OTP shared secret stored encrypted (envelope encryption; key id recorded), WebAuthn stores public key only.
  columns:
  - name: app_user_id
    type: UUID
    domain: identifier
    desc: Owner.
    sens: Internal
  - name: mfa_method_id
    type: UUID
    domain: enum_ref
    desc: Factor type.
    sens: Internal
  - name: label
    type: STRING(100)
    domain: free_text
    desc: User-chosen name ('Pixel 8').
    sens: Internal
  - name: secret_encrypted
    type: BYTES
    domain: encrypted
    desc: TOTP seed / WebAuthn public key, AES-256-GCM ciphertext.
    sens: Sensitive
    'null': true
    null_why: NULL for sms_otp/email_otp (destination read from app_user).
    pii: AES-256-GCM envelope encryption; data key wrapped by KMS key encryption_key_ref; decrypted only inside auth_svc
  - name: encryption_key_ref
    type: STRING(64)
    domain: code
    desc: KMS key id/version that wrapped the data key.
    sens: Internal
    'null': true
    null_why: NULL when secret_encrypted is NULL.
  - name: verified_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: First successful use proving enrolment.
    sens: Internal
    'null': true
    null_why: NULL = enrolment not completed.
  - name: last_used_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Last successful challenge.
    sens: Internal
    'null': true
    null_why: NULL = never used.
  - name: failed_attempts
    type: INT2
    domain: quantity
    desc: Consecutive failed challenges (reset on success).
    sens: Internal
    default: '0'
  - name: revoked_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Removal time.
    sens: Internal
    'null': true
    null_why: NULL = active.
  constraints:
  - name: ck_mfa_factor_secret_present
    type: check
    expr: (mfa_method_id IS NOT NULL) AND (secret_encrypted IS NULL OR encryption_key_ref IS NOT NULL)
    desc: Ciphertext always has its key reference.
  - name: ck_mfa_factor_attempts
    type: check
    expr: failed_attempts >= 0
    desc: Non-negative.
  indexes:
  - name: uq_mfa_factor_app_user_id_label_live
    columns:
    - app_user_id
    - label
    desc: A user cannot register two live factors with the same label.
    where: revoked_at IS NULL
    unique: true
  fks:
  - name: fk_mfa_factor_app_user_id
    columns:
    - app_user_id
    ref: app_user
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: user never hard-deleted'
  - name: fk_mfa_factor_mfa_method_id
    columns:
    - mfa_method_id
    ref: mfa_method
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: a lookup value in use cannot be removed (retire with is_active)'
    index_exempt: lookup rows are never deleted (RESTRICT cannot fire) and the column is low-cardinality; a dedicated index would only add write cost
- name: mfa_recovery_code
  kind: entity
  delete_policy: hard
  volume: medium
  tier: '1'
  milestones:
  - B56
  retention: Deleted on regeneration, on use + 30 days, and on erasure.
  description: One-time MFA recovery codes, stored only as hashes.
  columns:
  - name: app_user_id
    type: UUID
    domain: identifier
    desc: Owner.
    sens: Internal
  - name: code_hash
    type: STRING(128)
    domain: secret_hash
    desc: argon2id hash of the recovery code.
    sens: Sensitive
    pii: stored only as a one-way hash; plaintext never persisted
  - name: used_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: When consumed.
    sens: Internal
    'null': true
    null_why: NULL = unused.
  constraints: []
  indexes:
  - name: idx_mfa_recovery_code_app_user_id_created_at
    columns:
    - app_user_id
    - created_at DESC
    desc: Codes of a user.
    where: used_at IS NULL
  fks:
  - name: fk_mfa_recovery_code_app_user_id
    columns:
    - app_user_id
    ref: app_user
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: 'CASCADE: recovery codes are meaningless without the user (hard delete only at erasure)'
- name: password_reset_token
  kind: entity
  delete_policy: hard
  volume: high
  tier: '1'
  milestones:
  - B56
  retention: Row-level TTL 30 days after creation (forensics window), earlier on erasure.
  description: Single-use, short-lived password reset token (hash only).
  no_hash_why: Lookups are by unique token_hash/app_user_id; TTL deletes are spread by UUID PK.
  ttl:
    expire_after: 30 days
    column: created_at
  columns:
  - name: app_user_id
    type: UUID
    domain: identifier
    desc: Requesting user.
    sens: Internal
  - name: token_hash
    type: STRING(128)
    domain: secret_hash
    desc: SHA-256 of the 256-bit random token e-mailed to the user.
    sens: Sensitive
    pii: SHA-256 of high-entropy token; plaintext only in the e-mail link
  - name: expires_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Expiry (30 minutes).
    sens: Internal
  - name: consumed_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: When used.
    sens: Internal
    'null': true
    null_why: NULL = unused.
  - name: requested_ip
    type: INET
    domain: ip_address
    desc: IP that requested the reset.
    sens: Personal
    'null': true
    null_why: NULL = requested by admin/system.
    pii: 'IP address is personal data: access-controlled; truncated to /24 (v4) or /48 (v6) by the retention job after 90 days'
  constraints:
  - name: ck_password_reset_token_expiry
    type: check
    expr: expires_at > created_at
    desc: Expiry after creation.
  indexes:
  - name: uq_password_reset_token_token_hash
    columns:
    - token_hash
    desc: Token lookup.
    unique: true
  - name: idx_password_reset_token_app_user_id_created_at
    columns:
    - app_user_id
    - created_at DESC
    desc: Rate limit and abuse check per user.
  fks:
  - name: fk_password_reset_token_app_user_id
    columns:
    - app_user_id
    ref: app_user
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: 'CASCADE: tokens die with the user'
- name: email_verification_token
  kind: entity
  delete_policy: hard
  volume: high
  tier: '1'
  milestones:
  - B56
  retention: Row-level TTL 30 days after creation; erased with user.
  description: Single-use token proving control of an e-mail address (sign-up, address change, invitation).
  no_hash_why: Lookups are by unique token_hash; TTL deletes are spread by UUID PK.
  ttl:
    expire_after: 30 days
    column: created_at
  columns:
  - name: app_user_id
    type: UUID
    domain: identifier
    desc: User verifying.
    sens: Internal
  - name: email_verification_purpose_id
    type: UUID
    domain: enum_ref
    desc: Why the token was issued.
    sens: Internal
  - name: target_email
    type: STRING(254)
    domain: email
    desc: Address being verified (lowercase).
    sens: Personal
    pii: access-controlled; deleted with token by TTL
  - name: token_hash
    type: STRING(128)
    domain: secret_hash
    desc: SHA-256 of the random token.
    sens: Sensitive
    pii: SHA-256 of high-entropy token
  - name: expires_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Expiry (24 hours).
    sens: Internal
  - name: consumed_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: When used.
    sens: Internal
    'null': true
    null_why: NULL = unused.
  constraints:
  - name: ck_email_verification_token_target_lower
    type: check
    expr: target_email = lower(target_email)
    desc: Lowercase address.
  - name: ck_email_verification_token_expiry
    type: check
    expr: expires_at > created_at
    desc: Expiry after creation.
  indexes:
  - name: uq_email_verification_token_token_hash
    columns:
    - token_hash
    desc: Token lookup.
    unique: true
  - name: idx_email_verification_token_app_user_id_created_at
    columns:
    - app_user_id
    - created_at DESC
    desc: Per-user issuance rate limit.
  fks:
  - name: fk_email_verification_token_app_user_id
    columns:
    - app_user_id
    ref: app_user
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: 'CASCADE: tokens die with the user'
  - name: fk_email_verification_token_email_verification_purpose_id
    columns:
    - email_verification_purpose_id
    ref: email_verification_purpose
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: a lookup value in use cannot be removed (retire with is_active)'
    index_exempt: lookup rows are never deleted (RESTRICT cannot fire) and the column is low-cardinality; a dedicated index would only add write cost
- name: identity_session
  kind: event
  delete_policy: hard
  volume: very_high
  tier: '1'
  milestones:
  - B24
  - B30
  - B50
  - B53
  - B56
  - B59
  retention: 'Row-level TTL: deleted 7 days after expires_at (reuse-detection window). Revoked sessions follow the same TTL. All sessions revoked on erasure.'
  description: Authentication session = refresh-token family member. Refresh tokens rotate on every use (new row, parent_identity_session_id chain, same token_family_ref); reuse of a rotated token revokes
    the whole family. Device-limit slots are owned by licences_devices.device_session; this table is the identity/token side only.
  ttl:
    expire_after: 7 days
    column: expires_at
    expression: expires_at + INTERVAL '7 days'
  columns:
  - name: app_user_id
    type: UUID
    domain: identifier
    desc: Session owner.
    sens: Internal
  - name: refresh_token_hash
    type: STRING(128)
    domain: secret_hash
    desc: SHA-256 of the opaque refresh token.
    sens: Sensitive
    pii: SHA-256 of 256-bit random token; plaintext only on the client
  - name: token_family_ref
    type: UUID
    domain: identifier
    desc: Groups all rotations of one login (no FK; equals id of the first session).
    sens: Internal
  - name: parent_identity_session_id
    type: UUID
    domain: identifier
    desc: Previous token in the rotation chain.
    sens: Internal
    'null': true
    null_why: NULL = first token of the family (fresh login).
  - name: auth_method_id
    type: UUID
    domain: enum_ref
    desc: How the session was authenticated.
    sens: Internal
  - name: mfa_satisfied
    type: BOOL
    domain: boolean
    desc: True when a second factor was verified for this family.
    sens: Internal
    default: 'false'
  - name: acting_organisation_id
    type: UUID
    domain: identifier
    desc: Tenant context the user switched into (recruiter of several companies).
    sens: Internal
    'null': true
    null_why: NULL = no tenant context (candidate, platform admin).
  - name: device_session_id
    type: UUID
    domain: identifier
    desc: Licence/device slot session this token belongs to.
    sens: Internal
    'null': true
    null_why: NULL for first-party flows without device registration (candidate web).
  - name: issued_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Issue time.
    sens: Internal
    default: now()
  - name: expires_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: 'Sliding expiry (rotated tokens: 30 days, admin 8 hours).'
    sens: Internal
  - name: absolute_expires_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Hard cap regardless of rotation (90 days).
    sens: Internal
  - name: last_used_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Last refresh.
    sens: Internal
    'null': true
    null_why: NULL = never used after issue.
  - name: revoked_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Revocation time.
    sens: Internal
    'null': true
    null_why: NULL = not revoked.
  - name: session_revoke_reason_id
    type: UUID
    domain: enum_ref
    desc: Why it ended early.
    sens: Internal
    'null': true
    null_why: NULL while not revoked.
  - name: ip_address
    type: INET
    domain: ip_address
    desc: IP at issue.
    sens: Personal
    pii: 'IP address is personal data: access-controlled; truncated to /24 (v4) or /48 (v6) by the retention job after 90 days'
  - name: user_agent
    type: STRING(512)
    domain: free_text
    desc: User agent at issue.
    sens: Personal
    pii: access-controlled; cleared after 90 days
  constraints:
  - name: ck_identity_session_expiry_order
    type: check
    expr: expires_at > issued_at AND absolute_expires_at >= expires_at
    desc: Sliding expiry within the absolute cap.
  - name: ck_identity_session_revoke_pair
    type: check
    expr: (revoked_at IS NULL) = (session_revoke_reason_id IS NULL)
    desc: Reason iff revoked.
  indexes:
  - name: uq_identity_session_refresh_token_hash
    columns:
    - refresh_token_hash
    desc: Token lookup on refresh.
    unique: true
  - name: idx_identity_session_app_user_id_expires_at
    columns:
    - app_user_id
    - expires_at DESC
    desc: Active sessions of a user.
    where: revoked_at IS NULL
    storing:
    - token_family_ref
  - name: idx_identity_session_token_family_ref
    columns:
    - token_family_ref
    desc: Revoke a whole family on reuse detection.
  - name: idx_identity_session_expires_at
    columns:
    - expires_at
    desc: Expiry sweeper / TTL scan on a time-ordered key without range hotspot.
    hash: true
    bucket_count: 16
  - name: idx_identity_session_parent_identity_session_id
    columns:
    - parent_identity_session_id
    desc: Children of a token.
    where: parent_identity_session_id IS NOT NULL
  - name: idx_identity_session_acting_organisation_id
    columns:
    - acting_organisation_id
    desc: Leading index for FK fk_identity_session_acting_organisation_id (parent-side delete check and child lookup).
  - name: idx_identity_session_device_session_id
    columns:
    - device_session_id
    desc: Leading index for FK fk_identity_session_device_session_id (parent-side delete check and child lookup).
  fks:
  - name: fk_identity_session_app_user_id
    columns:
    - app_user_id
    ref: app_user
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: 'CASCADE: sessions are ephemeral and die with the user row at erasure'
  - name: fk_identity_session_parent_identity_session_id
    columns:
    - parent_identity_session_id
    ref: identity_session
    ref_columns:
    - id
    on_delete: SET NULL
    on_update: RESTRICT
    desc: 'SET NULL: parents expire earlier via TTL'
  - name: fk_identity_session_auth_method_id
    columns:
    - auth_method_id
    ref: auth_method
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: a lookup value in use cannot be removed (retire with is_active)'
    index_exempt: lookup rows are never deleted (RESTRICT cannot fire) and the column is low-cardinality; a dedicated index would only add write cost
  - name: fk_identity_session_acting_organisation_id
    columns:
    - acting_organisation_id
    ref: organisation
    ref_columns:
    - id
    on_delete: SET NULL
    on_update: RESTRICT
    desc: 'SET NULL: session survives organisation soft delete'
  - name: fk_identity_session_device_session_id
    columns:
    - device_session_id
    ref: device_session
    ref_columns:
    - id
    on_delete: SET NULL
    on_update: RESTRICT
    desc: 'SET NULL: device_session TTL independent'
  - name: fk_identity_session_session_revoke_reason_id
    columns:
    - session_revoke_reason_id
    ref: session_revoke_reason
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
