  volume: high
  tier: X
  milestones:
  - B24
  - B78
  - B79
  retention: Kept 2 years; IP cleared after 90 days.
  description: Detected security anomaly (impossible travel, credential stuffing, mass download, refresh-token reuse, audit chain break). Raised by detectors, triaged by security staff.
  columns:
  - name: occurred_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Detection time.
    sens: Internal
    default: now()
  - name: security_event_type_id
    type: UUID
    domain: enum_ref
    desc: Anomaly type.
    sens: Internal
  - name: event_severity_id
    type: UUID
    domain: enum_ref
    desc: Severity.
    sens: Internal
  - name: app_user_id
    type: UUID
    domain: identifier
    desc: Subject user.
    sens: Internal
    'null': true
    null_why: NULL = no identifiable user (IP-level event).
  - name: ip_address
    type: INET
    domain: ip_address
    desc: Source IP.
    sens: Personal
    'null': true
    null_why: NULL = not IP related.
    pii: 'IP address is personal data: access-controlled; truncated to /24 (v4) or /48 (v6) by the retention job after 90 days'
  - name: details
    type: JSONB
    domain: json
