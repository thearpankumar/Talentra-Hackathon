  delete_policy: hard
  volume: medium
  tier: '1'
  milestones:
  - B24
  - B62
  - B66
  retention: Kept 7 years; counts only, no personal data.
  description: 'Execution log of a retention purge: counts of rows scanned, purged and skipped due to legal hold, plus error status. Provides the evidence for B66 retention validation.'
  columns:
  - name: data_retention_policy_id
