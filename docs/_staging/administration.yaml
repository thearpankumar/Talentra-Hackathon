    desc: User under hold.
    sens: Internal
    'null': true
    null_why: NULL unless the scope is a user.
  - name: organisation_id
    type: UUID
    domain: identifier
    desc: Organisation under hold.
    sens: Internal
    'null': true
    null_why: NULL unless the scope is an organisation.
  - name: entity_table_name
    type: STRING(64)
    domain: code
    desc: Table under hold (e.g. audit_event).
    sens: Internal
    'null': true
