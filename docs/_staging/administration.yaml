tables:
- name: registration_policy
  kind: config
  delete_policy: hard
  volume: low
  tier: '1'
  milestones:
  - B24
  - B33
  - B59
  retention: Reference configuration; changes are audited and never deleted while any app_user references the combination.
  description: 'Allow-list of (target actor type, registrar actor type, registration channel) combinations. app_user carries a composite FK into this table, so an account whose combination is absent cannot
    exist. This is the database mechanism for ''recruiters cannot register candidates'': no row (candidate, recruiter, *) is ever seeded.'
  columns:
  - name: actor_type_id
    type: UUID
    domain: enum_ref
    desc: Actor type of the account being created.
    sens: Internal
  - name: registrar_actor_type_id
    type: UUID
    domain: enum_ref
    desc: Actor type of whoever creates the account (equals the target type for self sign-up).
    sens: Internal
  - name: registration_channel_id
    type: UUID
    domain: enum_ref
    desc: Channel used.
    sens: Internal
  - name: rationale
    type: STRING(300)
    domain: free_text
    desc: Why this combination is permitted (shown in the security design note).
    sens: Internal
  constraints:
  - name: uq_registration_policy_combo
    type: unique
    columns:
    - actor_type_id
    - registrar_actor_type_id
    - registration_channel_id
    desc: Natural key; also the target of app_user's composite FK (D-19).
  indexes: []
  fks:
  - name: fk_registration_policy_actor_type_id
    columns:
    - actor_type_id
    ref: actor_type
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: a lookup value in use cannot be removed (retire with is_active)'
    index_exempt: lookup rows are never deleted (RESTRICT cannot fire) and the column is low-cardinality; a dedicated index would only add write cost
  - name: fk_registration_policy_registrar_actor_type_id
    columns:
    - registrar_actor_type_id
    ref: actor_type
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: a lookup value in use cannot be removed (retire with is_active)'
    index_exempt: lookup rows are never deleted (RESTRICT cannot fire) and the column is low-cardinality; a dedicated index would only add write cost
  - name: fk_registration_policy_registration_channel_id
    columns:
    - registration_channel_id
    ref: registration_channel
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: a lookup value in use cannot be removed (retire with is_active)'
    index_exempt: lookup rows are never deleted (RESTRICT cannot fire) and the column is low-cardinality; a dedicated index would only add write cost
- name: block_policy
  kind: config
  delete_policy: hard
  volume: low
  tier: '1'
  milestones:
  - B50
  - B59
  retention: Reference configuration; changes audited.
  description: 'Allow-list of (blocker actor type, blocked actor type) pairs that user_block accepts: candidates may block employers, recruiters and consultants; those parties may block candidates (do-not-contact).
    Enforced by composite FK from user_block.'
  columns:
  - name: blocker_actor_type_id
    type: UUID
    domain: enum_ref
    desc: Actor type of the blocking user.
    sens: Internal
  - name: blocked_actor_type_id
    type: UUID
    domain: enum_ref
    desc: Actor type of the blocked user.
    sens: Internal
  constraints:
  - name: uq_block_policy_pair
    type: unique
    columns:
    - blocker_actor_type_id
    - blocked_actor_type_id
    desc: Natural key; target of user_block composite FK.
  indexes: []
  fks:
  - name: fk_block_policy_blocker_actor_type_id
    columns:
    - blocker_actor_type_id
    ref: actor_type
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: a lookup value in use cannot be removed (retire with is_active)'
    index_exempt: lookup rows are never deleted (RESTRICT cannot fire) and the column is low-cardinality; a dedicated index would only add write cost
  - name: fk_block_policy_blocked_actor_type_id
    columns:
    - blocked_actor_type_id
    ref: actor_type
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: a lookup value in use cannot be removed (retire with is_active)'
    index_exempt: lookup rows are never deleted (RESTRICT cannot fire) and the column is low-cardinality; a dedicated index would only add write cost
- name: app_user
  kind: entity
  delete_policy: soft
  volume: high
  tier: '1'
  milestones:
  - B24
  - B27
  - B30
  - B33
  - B50
  - B56
  - B62
  - B75
  retention: Soft-deleted only on admin closure. Inactivity (no login 36 months, no active licence) -> anonymise-in-place job; erasure request -> anonymise within 30 days unless legal_hold; row and id kept
    so audit_event/ledger FKs stay valid.
  description: 'The single identity table. Candidate, employer, recruiter, consultant, placement officer and admin are roles plus profile extensions hanging off app_user (candidate_profile, recruiter_organisation_mapping,
    account_admin ...). Holds only identity, status and lifecycle; profile data lives in the profile module. Rows are never hard-deleted: erasure anonymises in place.'
  no_hash_why: Keys are random UUIDs and email/phone uniques are hash-distributed by value; there is no time-ordered index on this table.
  columns:
  - name: email
    type: STRING(254)
    domain: email
    desc: Login and contact e-mail, lowercase.
    sens: Personal
    'null': true
    null_why: NULL = account identified by phone only (OTP login) or anonymised after erasure.
    pii: access-controlled and audited; masked for non-owner staff in vw_app_user_public; anonymised to NULL on erasure
  - name: email_verified_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: When the e-mail was verified.
    sens: Internal
    'null': true
    null_why: NULL = e-mail not (yet) verified.
  - name: phone
    type: STRING(16)
    domain: phone
    desc: Mobile number in E.164.
    sens: Personal
    'null': true
    null_why: NULL = no phone supplied.
    pii: access-controlled and audited; masked (+91*****1234) for non-owner staff; anonymised on erasure
  - name: phone_country_id
    type: UUID
    domain: identifier
    desc: Country of the phone number (dialling prefix).
    sens: Internal
    'null': true
    null_why: NULL when phone is NULL.
  - name: phone_verified_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: When the phone was verified by OTP.
    sens: Internal
    'null': true
    null_why: NULL = phone not verified.
  - name: display_name
    type: STRING(150)
    domain: person_name
    desc: Name shown in UI and audit screens (profile module owns the legal/full name).
    sens: Personal
    pii: access-controlled; replaced by 'Erased user' on erasure
  - name: actor_type_id
    type: UUID
    domain: enum_ref
    desc: Primary actor class; immutable (composite-FK target for user_role/user_block).
    sens: Internal
  - name: registrar_actor_type_id
    type: UUID
    domain: enum_ref
    desc: Actor class of the creator (self for sign-up).
    sens: Internal
  - name: registration_channel_id
    type: UUID
    domain: enum_ref
    desc: How the account was created.
    sens: Internal
  - name: registrar_app_user_id
    type: UUID
    domain: identifier
    desc: Creating user for admin_created / employer_invited channels.
    sens: Internal
    'null': true
    null_why: NULL = self sign-up, import or system seed with no human registrar.
  - name: user_status_id
    type: UUID
    domain: enum_ref
    desc: Current account state (history in user_status_history).
    sens: Internal
  - name: preferred_language_id
    type: UUID
    domain: identifier
    desc: UI/communication language preference (FK language); notification preferences live in the notifications module.
    sens: Internal
  - name: time_zone
    type: STRING(64)
    domain: time_zone
    desc: IANA time zone for display.
    sens: Internal
    default: '''UTC'''
  - name: is_system
    type: BOOL
    domain: boolean
    desc: True for built-in machine actors (system actor 00000000-0000-0000-0000-000000000001); cannot log in, cannot be deactivated.
    sens: Internal
    default: 'false'
  - name: last_login_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Last successful authentication (denormalised from licences_devices login history for inactivity purge).
    sens: Internal
    'null': true
    null_why: NULL = never logged in.
  - name: erasure_state_id
    type: UUID
    domain: enum_ref
    desc: Right-to-erasure progress.
    sens: Internal
  - name: erasure_requested_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: When erasure was requested.
    sens: Internal
    'null': true
    null_why: NULL = no erasure requested.
  - name: anonymised_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: When PII was anonymised in place.
    sens: Internal
    'null': true
    null_why: NULL = PII intact.
  - name: merged_into_app_user_id
    type: UUID
    domain: identifier
    desc: Surviving account when this one was merged as a duplicate.
    sens: Internal
    'null': true
    null_why: NULL = not merged.
  constraints:
  - name: uq_app_user_id_actor_type_id
    type: unique
    columns:
    - id
    - actor_type_id
    desc: Composite-FK target so user_role/user_block can pin the actor type of the referenced user (D-19).
  - name: ck_app_user_email_lower
    type: check
    expr: email IS NULL OR email = lower(email)
    desc: E-mail stored lowercase (D-07).
  - name: ck_app_user_phone_e164
    type: check
    expr: phone IS NULL OR phone ~ '^\+[1-9][0-9]{6,14}$'
    desc: E.164 format.
  - name: ck_app_user_phone_country
    type: check
    expr: (phone IS NULL) = (phone_country_id IS NULL)
    desc: Phone and its country travel together.
  - name: ck_app_user_contact_present
    type: check
    expr: email IS NOT NULL OR phone IS NOT NULL OR is_system OR anonymised_at IS NOT NULL
    desc: An account must be reachable unless system or anonymised.
  - name: ck_app_user_registrar_not_self
    type: check
    expr: registrar_app_user_id IS NULL OR registrar_app_user_id <> id
    desc: Cannot register oneself as registrar.
  - name: ck_app_user_merge_not_self
    type: check
    expr: merged_into_app_user_id IS NULL OR merged_into_app_user_id <> id
    desc: Merge target differs.
  - name: ck_app_user_anonymised_after_request
    type: check
    expr: anonymised_at IS NULL OR erasure_requested_at IS NOT NULL OR is_system
    desc: Anonymisation implies an erasure request (or admin action recorded in audit).
  indexes:
  - name: uq_app_user_email_live
    columns:
    - email
    desc: Login lookup by e-mail; live accounts only.
    where: email IS NOT NULL AND deleted_at IS NULL
    unique: true
  - name: uq_app_user_phone_live
    columns:
    - phone
    desc: Login/OTP lookup by phone; live accounts only.
    where: phone IS NOT NULL AND deleted_at IS NULL
    unique: true
  - name: idx_app_user_actor_type_id_user_status_id_created_at
    columns:
    - actor_type_id
    - user_status_id
    - created_at DESC
    desc: Admin user lists by type and status, newest first (also leads the composite FK to registration_policy).
    where: deleted_at IS NULL
  - name: idx_app_user_last_login_at
    columns:
    - last_login_at
    desc: 'Inactivity purge scan: oldest last login first.'
    where: deleted_at IS NULL AND anonymised_at IS NULL
  - name: idx_app_user_erasure_state_id_erasure_requested_at
    columns:
    - erasure_state_id
    - erasure_requested_at
    desc: Erasure queue.
    where: erasure_state_id IS NOT NULL AND anonymised_at IS NULL
    storing:
    - actor_type_id
  - name: idx_app_user_registrar_app_user_id
    columns:
    - registrar_app_user_id
    desc: Accounts created by a given registrar.
    where: registrar_app_user_id IS NOT NULL
  - name: idx_app_user_merged_into_app_user_id
    columns:
    - merged_into_app_user_id
    desc: Find accounts folded into a survivor.
    where: merged_into_app_user_id IS NOT NULL
  - name: idx_app_user_phone_country_id
    columns:
    - phone_country_id
    desc: Leading index for FK fk_app_user_phone_country_id (parent-side delete check and child lookup).
  - name: idx_app_user_user_status_id
    columns:
    - user_status_id
    desc: Leading index for FK fk_app_user_user_status_id (parent-side delete check and child lookup).
  - name: idx_app_user_preferred_language_id
