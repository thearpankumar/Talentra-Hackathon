    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: evidence'
  - name: fk_moderation_case_action_moderation_action_id
    columns:
    - moderation_action_id
    ref: moderation_action
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: a lookup value in use cannot be removed (retire with is_active)'
    index_exempt: lookup rows are never deleted (RESTRICT cannot fire) and the column is low-cardinality; a dedicated index would only add write cost
  - name: fk_moderation_case_action_approval_app_user_id
    columns:
