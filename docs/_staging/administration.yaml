- name: app_role_inheritance
  kind: link
  delete_policy: hard
  volume: low
  tier: '1'
  milestones:
  - B27
  - B33
  retention: Configuration; removed with either role; changes audited.
  description: 'Role hierarchy: a child role inherits every permission of its parent (admin inherits account_admin read set; recruiter inherits employer-user read set). Resolved by vw_user_effective_permission
    with a recursive CTE; depth is capped at 5 by application validation.'
  columns:
  - name: child_app_role_id
    type: UUID
    domain: identifier
    desc: Inheriting role.
    sens: Internal
  - name: parent_app_role_id
    type: UUID
    domain: identifier
    desc: Role whose permissions are inherited.
    sens: Internal
  constraints:
  - name: uq_app_role_inheritance_pair
    type: unique
    columns:
    - child_app_role_id
    - parent_app_role_id
    desc: One inheritance edge per pair.
  - name: ck_app_role_inheritance_not_self
    type: check
    expr: child_app_role_id <> parent_app_role_id
    desc: No direct self-inheritance; longer cycles rejected by the admin API (cycle check in the same SERIALIZABLE txn).
  indexes:
  - name: idx_app_role_inheritance_parent_app_role_id
    columns:
    - parent_app_role_id
    desc: Descendants of a role.
  fks:
  - name: fk_app_role_inheritance_child_app_role_id
    columns:
    - child_app_role_id
    ref: app_role
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: 'CASCADE: link row meaningless without the role'
  - name: fk_app_role_inheritance_parent_app_role_id
    columns:
    - parent_app_role_id
    ref: app_role
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: 'CASCADE: link row meaningless without the role'
