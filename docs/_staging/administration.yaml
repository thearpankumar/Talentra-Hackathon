- name: data_subject_request
  kind: entity
  delete_policy: soft
  volume: medium
  tier: '2'
  milestones:
  - B24
  - B50
  - B56
  - B75
  retention: Kept 6 years after completion (compliance evidence); export bundle destroyed after 14 days; requester detail anonymised if the user is later erased.
  description: 'Data subject request (GDPR Art.15-21, India DPDP s.11-14): erasure, export, rectification, restriction, objection. Tracks identity verification and the statutory deadline (SLA).'
