- name: privileged_access_request
  kind: entity
  delete_policy: hard
  volume: medium
  tier: X
  milestones:
  - B33
  - B59
  - B78
  retention: Kept 7 years.
  description: 'Break-glass: time-boxed elevation of a user to a privileged role with justification, approver and mandatory post-use review. On approval an app_user_role row with effective_to is created.'
  columns:
  - name: requesting_app_user_id
    type: UUID
    domain: identifier
    desc: Requester.
    sens: Internal
  - name: requested_app_role_id
    type: UUID
    domain: identifier
    desc: Role requested.
    sens: Internal
  - name: justification
    type: STRING(1000)
    domain: free_text
    desc: Business justification.
    sens: Internal
  - name: incident_ref
    type: STRING(64)
    domain: code
    desc: Incident/ticket reference.
    sens: Internal
    'null': true
    null_why: NULL = no ticket (emergency; reviewed within 24 h).
  - name: approval_status_id
    type: UUID
    domain: enum_ref
    desc: Workflow state.
    sens: Internal
  - name: approver_app_user_id
    type: UUID
    domain: identifier
    desc: Approver (must differ).
    sens: Internal
    'null': true
    null_why: NULL while pending.
  - name: requested_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Request time.
    sens: Internal
    default: now()
  - name: access_starts_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Granted window start.
    sens: Internal
    'null': true
    null_why: NULL until approved.
  - name: access_ends_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Granted window end (max 4 hours).
    sens: Internal
    'null': true
    null_why: NULL until approved.
  - name: granted_app_user_role_id
    type: UUID
    domain: identifier
    desc: Role grant created on approval.
    sens: Internal
    'null': true
    null_why: NULL until approved.
  - name: revoked_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Early revocation.
    sens: Internal
    'null': true
    null_why: NULL = not revoked early.
  - name: reviewed_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Post-use review completed.
    sens: Internal
    'null': true
    null_why: NULL = review pending.
  - name: reviewed_by_app_user_id
    type: UUID
    domain: identifier
    desc: Reviewer.
    sens: Internal
    'null': true
    null_why: NULL = review pending.
  constraints:
  - name: ck_privileged_access_request_different_people
    type: check
    expr: approver_app_user_id IS NULL OR approver_app_user_id <> requesting_app_user_id
    desc: Cannot approve own request.
  - name: ck_privileged_access_request_window
    type: check
    expr: access_starts_at IS NULL OR (access_ends_at > access_starts_at AND access_ends_at <= access_starts_at + INTERVAL '4 hours')
    desc: access_ends_at after access_starts_at, max 4 h.
  - name: ck_privileged_access_request_window_pair
    type: check
    expr: (access_starts_at IS NULL) = (access_ends_at IS NULL)
    desc: Window both or neither.
  indexes:
  - name: idx_privileged_access_request_requesting_app_user_id_requested_at
    columns:
    - requesting_app_user_id
    - requested_at DESC
    desc: Requests by user.
  - name: idx_privileged_access_request_requested_app_role_id
    columns:
    - requested_app_role_id
    desc: Requests per role.
  - name: idx_privileged_access_request_approver_app_user_id
    columns:
    - approver_app_user_id
    desc: Approvals by approver.
    where: approver_app_user_id IS NOT NULL
  - name: idx_privileged_access_request_granted_app_user_role_id
    columns:
    - granted_app_user_role_id
    desc: From grant to request.
    where: granted_app_user_role_id IS NOT NULL
  - name: idx_privileged_access_request_reviewed_by_app_user_id
    columns:
    - reviewed_by_app_user_id
    desc: Reviews by reviewer.
    where: reviewed_by_app_user_id IS NOT NULL
  - name: idx_privileged_access_request_approval_status_id_access_ends_at
    columns:
    - approval_status_id
    - access_ends_at
    desc: Open elevations to expire.
    where: revoked_at IS NULL AND access_ends_at IS NOT NULL
  fks:
  - name: fk_privileged_access_request_requesting_app_user_id
    columns:
    - requesting_app_user_id
    ref: app_user
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: accountability'
  - name: fk_privileged_access_request_requested_app_role_id
    columns:
    - requested_app_role_id
    ref: app_role
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: role in use'
  - name: fk_privileged_access_request_approval_status_id
    columns:
    - approval_status_id
    ref: approval_status
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: a lookup value in use cannot be removed (retire with is_active)'
  - name: fk_privileged_access_request_approver_app_user_id
    columns:
    - approver_app_user_id
    ref: app_user
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: accountability'
  - name: fk_privileged_access_request_granted_app_user_role_id
    columns:
    - granted_app_user_role_id
    ref: app_user_role
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: evidence'
  - name: fk_privileged_access_request_reviewed_by_app_user_id
    columns:
    - reviewed_by_app_user_id
    ref: app_user
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: accountability'
- name: impersonation_session
  kind: event
  delete_policy: hard
  volume: medium
  tier: X
  milestones:
  - B33
  - B59
  - B78
  retention: Kept 7 years.
  description: Support staff acting as a user ('view as'). Read-only by default, ticket-linked, time-boxed; every action under it carries impersonator_app_user_id in audit_event.
  columns:
  - name: support_app_user_id
    type: UUID
    domain: identifier
    desc: Support/admin user impersonating.
    sens: Internal
  - name: impersonated_app_user_id
    type: UUID
    domain: identifier
    desc: User being impersonated.
    sens: Internal
  - name: impersonation_reason_id
    type: UUID
    domain: enum_ref
    desc: Reason category.
    sens: Internal
  - name: support_ticket_id
    type: UUID
    domain: identifier
    desc: Ticket authorising the access.
    sens: Internal
    'null': true
    null_why: NULL for debugging/compliance reasons without a user ticket.
  - name: admin_action_approval_id
    type: UUID
    domain: identifier
    desc: Approval for write-mode or admin-target impersonation.
    sens: Internal
    'null': true
    null_why: NULL for read-only sessions.
  - name: is_read_only
    type: BOOL
    domain: boolean
    desc: Write operations are rejected when true.
    sens: Internal
    default: 'true'
  - name: started_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Start.
    sens: Internal
    default: now()
  - name: ended_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: End.
    sens: Internal
    'null': true
    null_why: NULL = still open.
  - name: expires_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Hard stop (30 minutes).
    sens: Internal
  - name: action_count
    type: INT4
    domain: quantity
    desc: Actions performed (updated at close).
    sens: Internal
    default: '0'
  constraints:
  - name: ck_impersonation_session_not_self
    type: check
    expr: support_app_user_id <> impersonated_app_user_id
    desc: Cannot impersonate oneself.
  - name: ck_impersonation_session_range
    type: check
    expr: ended_at IS NULL OR ended_at >= started_at
    desc: End not before start.
  - name: ck_impersonation_session_expiry
    type: check
    expr: expires_at > started_at
    desc: Expiry after start.
  - name: ck_impersonation_session_write_needs_approval
    type: check
    expr: is_read_only OR admin_action_approval_id IS NOT NULL
    desc: Write mode requires approval.
  indexes:
  - name: uq_impersonation_session_support_app_user_id_open
    columns:
    - support_app_user_id
    desc: One open impersonation per support user.
    where: ended_at IS NULL
    unique: true
  - name: idx_impersonation_session_impersonated_app_user_id_started_at
    columns:
    - impersonated_app_user_id
    - started_at DESC
    desc: Who impersonated this user (transparency report).
  - name: idx_impersonation_session_support_ticket_id
    columns:
    - support_ticket_id
    desc: Impersonations per ticket.
    where: support_ticket_id IS NOT NULL
  - name: idx_impersonation_session_admin_action_approval_id
    columns:
    - admin_action_approval_id
    desc: From approval to session.
    where: admin_action_approval_id IS NOT NULL
  fks:
  - name: fk_impersonation_session_support_app_user_id
    columns:
    - support_app_user_id
    ref: app_user
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: accountability'
  - name: fk_impersonation_session_impersonated_app_user_id
    columns:
    - impersonated_app_user_id
    ref: app_user
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: accountability'
  - name: fk_impersonation_session_impersonation_reason_id
    columns:
    - impersonation_reason_id
    ref: impersonation_reason
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: a lookup value in use cannot be removed (retire with is_active)'
    index_exempt: lookup rows are never deleted (RESTRICT cannot fire) and the column is low-cardinality; a dedicated index would only add write cost
  - name: fk_impersonation_session_support_ticket_id
    columns:
    - support_ticket_id
    ref: support_ticket
    ref_columns:
    - id
    on_delete: SET NULL
    on_update: RESTRICT
    desc: 'SET NULL: tickets may be purged; audit keeps reference'
  - name: fk_impersonation_session_admin_action_approval_id
