- name: search_query_normalised
  kind: entity
  delete_policy: hard
  volume: high
  tier: X
  milestones:
  - B6
  - B14
  retention: Aggregate only (no user id); queries with < 3 occurrences purged after 180 days; PII patterns (email/phone) scrubbed before insert.
  description: 'Canonical normalised query (query understanding): parsed intent, role/skill/city entities and aggregate counters; gives per-user logs (candidate_job_search_history, candidate_search_history)
    a shared vocabulary.'
  columns:
  - name: search_scope_id
    type: UUID
