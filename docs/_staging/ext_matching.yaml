    on_update: RESTRICT
    desc: Child/derived row follows its parent (erasure and retention purge).
  - name: fk_match_score_job_requirement_id
    columns:
    - job_requirement_id
    ref: job_requirement
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: Child/derived row follows its parent (erasure and retention purge).
  - name: fk_match_score_recommendation_model_version_id
    columns:
    - recommendation_model_version_id
    ref: recommendation_model_version
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
