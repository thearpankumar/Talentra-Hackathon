  - B14
  retention: Soft-deleted when retired; popularity refreshed daily by job; blocked terms retained for audit.
  description: Typeahead / autocomplete vocabulary (job titles, skills, companies, locations, popular queries) with popularity and blocklist.
  columns:
  - name: search_scope_id
    type: UUID
    domain: enum_ref
    desc: Scope.
    sens: Internal
  - name: language_id
    type: UUID
    domain: identifier
    desc: Language.
    sens: Internal
  - name: search_typeahead_kind_id
    type: UUID
    domain: enum_ref
    desc: Kind.
    sens: Internal
  - name: term_text
    type: STRING(150)
    domain: free_text
    desc: Suggestion text.
    sens: Internal
  - name: term_lower
    type: STRING(150)
    domain: free_text
    desc: Lowercase form for prefix match.
    sens: Internal
    computed: lower(term_text)
  - name: job_role_id
    type: UUID
    domain: identifier
    desc: Linked role.
    sens: Internal
    'null': true
    null_why: NULL = not a role term.
  - name: skill_id
    type: UUID
    domain: identifier
    desc: Linked skill.
    sens: Internal
    'null': true
    null_why: NULL = not a skill term.
  - name: organisation_id
    type: UUID
    domain: identifier
    desc: Linked company.
    sens: Internal
    'null': true
    null_why: NULL = not a company term.
  - name: city_id
    type: UUID
    domain: identifier
    desc: Linked city.
    sens: Internal
    'null': true
    null_why: NULL = not a location term.
  - name: popularity_score
    type: INT8
    domain: quantity
    desc: Ranking weight (recent search volume).
    sens: Internal
    default: '0'
  - name: is_blocked
    type: BOOL
    domain: boolean
    desc: Never suggest.
    sens: Internal
    default: 'false'
  - name: is_active
    type: BOOL
    domain: boolean
    desc: Served.
    sens: Internal
    default: 'true'
  constraints:
  - name: ck_search_typeahead_term_popularity_nonneg
    type: check
    expr: popularity_score >= 0
    desc: Non-negative.
  indexes:
  - name: uq_search_typeahead_term_search_scope_id_language_term_lower
    columns:
    - search_scope_id
    - language_id
    - term_lower
    desc: Natural key among live rows (prefix scan for typeahead).
    unique: true
    where: deleted_at IS NULL
  - name: idx_search_typeahead_term_term_lower_trgm
    columns:
    - term_lower
    desc: Trigram index (gin_trgm_ops) for fuzzy typeahead.
    inverted: true
    opclass: gin_trgm_ops
  - name: idx_search_typeahead_term_created_at
    columns:
    - created_at
    desc: 'Hash-sharded: refresh/purge scans.'
    hash: true
    bucket_count: 8
  - name: idx_search_typeahead_term_search_scope_id_prefix_popular
    columns:
    - search_scope_id
    - term_lower
    - popularity_score DESC
    desc: Prefix + popularity order.
    where: is_active AND NOT is_blocked AND deleted_at IS NULL
  - name: idx_search_typeahead_term_language_id
    columns:
    - language_id
    desc: 'FK support: child lookup/cascade by language_id.'
  - name: idx_search_typeahead_term_job_role_id
    columns:
    - job_role_id
    desc: 'FK support: child lookup/cascade by job_role_id.'
  - name: idx_search_typeahead_term_skill_id
    columns:
    - skill_id
    desc: 'FK support: child lookup/cascade by skill_id.'
  - name: idx_search_typeahead_term_organisation_id
    columns:
    - organisation_id
    desc: 'FK support: child lookup/cascade by organisation_id.'
  - name: idx_search_typeahead_term_city_id
    columns:
    - city_id
    desc: 'FK support: child lookup/cascade by city_id.'
  fks:
  - name: fk_search_typeahead_term_search_scope_id
    columns:
    - search_scope_id
    ref: search_scope
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Lookup rows are retired via is_active, never deleted.
    index_exempt: referenced lookup rows are retired via is_active and never deleted, so no child scan is needed
  - name: fk_search_typeahead_term_language_id
    columns:
    - language_id
    ref: language
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Referenced row cannot be removed while this row exists.
  - name: fk_search_typeahead_term_search_typeahead_kind_id
    columns:
    - search_typeahead_kind_id
    ref: search_typeahead_kind
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Lookup rows are retired via is_active, never deleted.
    index_exempt: referenced lookup rows are retired via is_active and never deleted, so no child scan is needed
  - name: fk_search_typeahead_term_job_role_id
    columns:
    - job_role_id
    ref: job_role
    ref_columns:
