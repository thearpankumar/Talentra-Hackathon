    domain: identifier
    desc: Query language.
    sens: Internal
  - name: normalised_text
    type: STRING(300)
    domain: free_text
    desc: Lowercased, stemmed/de-noised text.
    sens: Personal
    pii: aggregate vocabulary; email/phone/name patterns scrubbed; no user link
  - name: search_intent_kind_id
    type: UUID
    domain: enum_ref
