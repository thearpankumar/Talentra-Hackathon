- name: search_index_outbox
  kind: event
  delete_policy: hard
  volume: very_high
  tier: X
  milestones:
  - B6
  - B14
  - B30
  retention: Done rows expire 7 days after processing (TTL on expires_at, set by relay); dead-letter rows kept 90 days for replay; no PII in payload (ids only, fetched fresh by relay).
  description: 'Transactional outbox: rows written in the SAME transaction as the source change; a relay claims pending rows and syncs the external search engine. Idempotent via dedupe_key and monotonic
    payload_version.'
  ttl:
    expire_after: 0 seconds
    column: expires_at
  columns:
  - name: search_index_entity_kind_id
    type: UUID
    domain: enum_ref
    desc: Entity to index.
    sens: Internal
  - name: source_row_ref
    type: STRING(64)
    domain: code
    desc: UUID of the source row as text (polymorphic; row may be hard-deleted so not an FK).
    sens: Internal
  - name: outbox_operation_id
    type: UUID
    domain: enum_ref
    desc: Operation.
    sens: Internal
  - name: payload_version
    type: INT8
    domain: quantity
    desc: Source row version/epoch-micros; engine rejects older versions (external versioning).
    sens: Internal
  - name: dedupe_key
    type: STRING(120)
    domain: code
    desc: entity_kind:source_row:payload_version - makes relay writes idempotent.
    sens: Internal
  - name: outbox_status_id
    type: UUID
    domain: enum_ref
    desc: State.
    sens: Internal
  - name: is_done
    type: BOOL
    domain: boolean
    desc: Terminal success flag for partial indexes.
    sens: Internal
    default: 'false'
  - name: attempt_count
    type: INT2
    domain: quantity
    desc: Delivery attempts.
    sens: Internal
    default: '0'
  - name: next_attempt_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Earliest next try (exponential backoff).
    sens: Internal
    default: now()
  - name: claimed_by_ref
    type: STRING(80)
    domain: free_text
    desc: Relay worker id holding the claim.
    sens: Internal
    'null': true
    null_why: NULL = unclaimed.
  - name: claimed_until_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Claim lease expiry.
    sens: Internal
    'null': true
    null_why: NULL = unclaimed.
  - name: processed_at
    type: TIMESTAMPTZ
    domain: timestamp
