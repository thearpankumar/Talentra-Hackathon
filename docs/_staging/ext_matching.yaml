- name: match_score
  kind: snapshot
  delete_policy: hard
  volume: very_high
  tier: X
  milestones:
  - B14
  - B22
  retention: Rows expire 14 days after computation (TTL on expires_at); top-K only; erased with candidate/job (CASCADE).
  description: Pre-computed candidate x job match (explainable overall score; component rows in match_score_component). Only top-K pairs materialised.
  ttl:
    expire_after: 0 seconds
    column: expires_at
  columns:
  - name: candidate_profile_id
    type: UUID
    domain: identifier
    desc: Candidate.
    sens: Internal
  - name: job_requirement_id
    type: UUID
    domain: identifier
    desc: Job.
    sens: Internal
  - name: recommendation_model_version_id
    type: UUID
    domain: identifier
    desc: Scoring model version.
    sens: Internal
  - name: overall_score
    type: DECIMAL(7,6)
    domain: measure
    desc: Calibrated 0..1 match probability/score.
    sens: Internal
  - name: match_percent
    type: DECIMAL(5,2)
    domain: percentage
    desc: User-facing percent (0..100).
    sens: Internal
  - name: computed_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Computation time.
    sens: Internal
  - name: is_current
    type: BOOL
    domain: boolean
    desc: Latest for the pair+model.
    sens: Internal
    default: 'true'
  - name: expires_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: TTL expiry.
    sens: Internal
  constraints:
  - name: uq_match_score_pair_version
    type: unique
    columns:
