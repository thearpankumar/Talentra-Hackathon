    hash: true
    bucket_count: 16
    where: job_requirement_id IS NOT NULL
  - name: idx_recommendation_impression_app_user_id_impressed_at
    columns:
    - app_user_id
    - impressed_at DESC
    desc: User's recent exposure (frequency capping).
    where: app_user_id IS NOT NULL
  - name: idx_recommendation_impression_recommendation_model_version_id
    columns:
    - recommendation_model_version_id
    desc: 'FK support: child lookup/cascade by recommendation_model_version_id.'
  - name: idx_recommendation_impression_ab_variant_id
    columns:
    - ab_variant_id
    desc: 'FK support: child lookup/cascade by ab_variant_id.'
  - name: idx_recommendation_impression_candidate_profile_id
    columns:
    - candidate_profile_id
    desc: 'FK support: child lookup/cascade by candidate_profile_id.'
  fks:
