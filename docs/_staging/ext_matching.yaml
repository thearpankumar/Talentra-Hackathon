- name: search_zero_result_log
  kind: event
  delete_policy: append_only
  volume: high
  tier: X
  milestones:
  - B6
  - B14
  retention: TTL 180 days; user link erased with user (CASCADE); aggregates kept in search_query_normalised.
  description: Searches that returned zero results (candidate job search, recruiter search) with filters and attempted relaxations; drives synonym/taxonomy gaps and 'no results' recovery.
  audit: created_only
  ttl:
    expire_after: 180 days
  columns:
  - name: search_scope_id
    type: UUID
    domain: enum_ref
    desc: Search product.
    sens: Internal
  - name: search_query_normalised_id
    type: UUID
    domain: identifier
    desc: Normalised query.
    sens: Internal
    'null': true
    null_why: NULL = not normalisable.
  - name: app_user_id
    type: UUID
    domain: identifier
    desc: Searcher.
    sens: Internal
    'null': true
    null_why: NULL = anonymous visitor.
  - name: raw_query_text
    type: STRING(300)
    domain: free_text
    desc: Query as typed.
    sens: Personal
    pii: may contain personal data typed by user; TTL 180d; erased with user
  - name: filters
    type: JSONB
    domain: json
    desc: Filters/facets applied.
    sens: Internal
    'null': true
    null_why: NULL = no filters.
  - name: relaxed_query_text
    type: STRING(300)
    domain: free_text
    desc: Query after automatic relaxation.
    sens: Personal
    'null': true
    null_why: NULL = no relaxation attempted.
    pii: derived from raw query; same TTL
  - name: relaxed_result_count
    type: INT4
    domain: quantity
    desc: Results after relaxation.
    sens: Internal
    'null': true
    null_why: NULL = no relaxation attempted.
  - name: suggested_search_typeahead_term_id
    type: UUID
    domain: identifier
    desc: Alternative suggested.
    sens: Internal
    'null': true
    null_why: NULL = none suggested.
  - name: request_ref
    type: STRING(64)
    domain: code
    desc: Search request id.
    sens: Internal
  - name: searched_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Search time.
    sens: Internal
  constraints:
  - name: uq_search_zero_result_log_request_ref
    type: unique
    columns:
    - request_ref
    desc: Idempotent ingestion key.
  indexes:
  - name: idx_search_zero_result_log_searched_at
    columns:
    - searched_at
    desc: 'Hash-sharded: gap mining scans.'
    hash: true
    bucket_count: 16
  - name: idx_search_zero_result_log_search_query_normalised_id_searched_at
    columns:
    - search_query_normalised_id
    - searched_at DESC
    desc: Per-query zero-result history.
    where: search_query_normalised_id IS NOT NULL
  - name: idx_search_zero_result_log_app_user_id
    columns:
    - app_user_id
    desc: 'FK support: child lookup/cascade by app_user_id.'
  - name: idx_search_zero_result_log_suggested_search_typeahead_term_id
    columns:
    - suggested_search_typeahead_term_id
    desc: 'FK support: child lookup/cascade by suggested_search_typeahead_term_id.'
  fks:
  - name: fk_search_zero_result_log_search_scope_id
    columns:
    - search_scope_id
    ref: search_scope
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Lookup rows are retired via is_active, never deleted.
    index_exempt: referenced lookup rows are retired via is_active and never deleted, so no child scan is needed
  - name: fk_search_zero_result_log_search_query_normalised_id
    columns:
    - search_query_normalised_id
    ref: search_query_normalised
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: Child/derived row follows its parent (erasure and retention purge).
  - name: fk_search_zero_result_log_app_user_id
    columns:
    - app_user_id
    ref: app_user
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: Child/derived row follows its parent (erasure and retention purge).
  - name: fk_search_zero_result_log_suggested_search_typeahead_term_id
    columns:
    - suggested_search_typeahead_term_id
    ref: search_typeahead_term
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: Child/derived row follows its parent (erasure and retention purge).
