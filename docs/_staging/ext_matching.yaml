    - job_requirement_id
    - recommendation_model_version_id
    desc: One score per pair and model version.
  - name: ck_match_score_overall_score_range
    type: check
    expr: overall_score >= 0 AND overall_score <= 1
    desc: overall_score is a normalised 0..1 score.
  - name: ck_match_score_match_percent_range
    type: check
    expr: match_percent >= 0 AND match_percent <= 100
    desc: match_percent is on a 0..100 scale.
  indexes:
