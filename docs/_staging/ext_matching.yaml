- name: embedding_ref
  kind: entity
  delete_policy: hard
  volume: high
  tier: X
  milestones:
  - B14
  - B22
  retention: Superseded rows (is_current=false) purged 30 days after supersession via expires_at TTL; erased with candidate (CASCADE).
  description: Pointer to an embedding vector held in an external vector store (model, dims, object key); NO vector payload in the OLTP DB.
  ttl:
    expire_after: 0 seconds
    column: expires_at
  columns:
  - name: embedding_subject_kind_id
    type: UUID
    domain: enum_ref
    desc: Subject kind.
    sens: Internal
  - name: candidate_profile_id
    type: UUID
    domain: identifier
    desc: Subject candidate.
    sens: Internal
    'null': true
    null_why: NULL unless subject kind = candidate.
  - name: job_requirement_id
    type: UUID
    domain: identifier
    desc: Subject job.
    sens: Internal
    'null': true
    null_why: NULL unless subject kind = job.
  - name: skill_id
    type: UUID
    domain: identifier
    desc: Subject skill.
    sens: Internal
    'null': true
    null_why: NULL unless subject kind = skill.
  - name: recommendation_model_version_id
    type: UUID
    domain: identifier
    desc: Embedding model version.
    sens: Internal
  - name: dimensions
    type: INT4
    domain: quantity
    desc: Vector dimensionality.
    sens: Internal
  - name: vector_store_ref
    type: STRING(120)
    domain: free_text
    desc: Collection/index in the external vector store.
    sens: Internal
  - name: object_key
    type: STRING(500)
    domain: free_text
    desc: Key of the vector (or blob) in the store/object storage.
    sens: Internal
  - name: content_hash
    type: STRING(64)
    domain: code
    desc: Hash of the embedded text; skip re-embedding when unchanged.
    sens: Internal
  - name: embedded_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: When the embedding was produced.
    sens: Internal
  - name: is_current
    type: BOOL
    domain: boolean
    desc: Latest embedding for the subject/model.
    sens: Internal
    default: 'true'
  - name: expires_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Purge time once superseded.
    sens: Internal
    'null': true
    null_why: NULL = current, not expiring.
  constraints:
  - name: ck_embedding_ref_one_subject
    type: check
    expr: (CASE WHEN candidate_profile_id IS NOT NULL THEN 1 ELSE 0 END)+(CASE WHEN job_requirement_id IS NOT NULL THEN 1 ELSE 0 END)+(CASE WHEN skill_id IS NOT NULL THEN 1 ELSE 0 END) = 1
    desc: Exactly one subject FK is set.
  - name: ck_embedding_ref_dimensions_range
    type: check
    expr: dimensions >= 8 AND dimensions <= 8192
    desc: Sane dimensionality.
  indexes:
  - name: uq_embedding_ref_candidate_profile_id_current
    columns:
    - candidate_profile_id
    - recommendation_model_version_id
    desc: One current embedding per candidate+model.
    unique: true
    where: is_current AND candidate_profile_id IS NOT NULL
  - name: uq_embedding_ref_job_requirement_id_current
    columns:
    - job_requirement_id
    - recommendation_model_version_id
    desc: One current embedding per job+model.
    unique: true
    where: is_current AND job_requirement_id IS NOT NULL
  - name: uq_embedding_ref_skill_id_current
    columns:
    - skill_id
    - recommendation_model_version_id
    desc: One current embedding per skill+model.
    unique: true
    where: is_current AND skill_id IS NOT NULL
  - name: idx_embedding_ref_created_at
    columns:
    - created_at
    desc: 'Hash-sharded: backfill/export scans.'
    hash: true
    bucket_count: 16
  - name: idx_embedding_ref_recommendation_model_version_id
    columns:
    - recommendation_model_version_id
    desc: 'FK support: child lookup/cascade by recommendation_model_version_id.'
  fks:
  - name: fk_embedding_ref_embedding_subject_kind_id
    columns:
    - embedding_subject_kind_id
    ref: embedding_subject_kind
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Lookup rows are retired via is_active, never deleted.
    index_exempt: referenced lookup rows are retired via is_active and never deleted, so no child scan is needed
  - name: fk_embedding_ref_candidate_profile_id
    columns:
    - candidate_profile_id
    ref: candidate_profile
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: Child/derived row follows its parent (erasure and retention purge).
  - name: fk_embedding_ref_job_requirement_id
    columns:
    - job_requirement_id
    ref: job_requirement
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: Child/derived row follows its parent (erasure and retention purge).
  - name: fk_embedding_ref_skill_id
    columns:
    - skill_id
    ref: skill
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: Child/derived row follows its parent (erasure and retention purge).
  - name: fk_embedding_ref_recommendation_model_version_id
    columns:
