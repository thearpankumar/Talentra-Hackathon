views:
- name: vw_candidate_job_recommendation_live
  kind: view
  tables:
  - job_recommendation
  - job_requirement
  purpose: Unexpired, undismissed recommendations joined to live jobs for the feed API (hides expired TTL rows not yet deleted).
  security: Owner-scoped by application on candidate_profile_id; SELECT only for the feed role.
  sql_sketch: SELECT r.* FROM job_recommendation r JOIN job_requirement j ON j.id = r.job_requirement_id WHERE r.expires_at > now() AND r.dismissed_at IS NULL AND j.deleted_at IS NULL
- name: vw_recommendation_ctr_hourly
  kind: view
  tables:
  - recommendation_impression
  - recommendation_click_event
  purpose: Impression vs click counts per surface/model/hour for monitoring; production uses analytics fact tables, this is the 90-day operational view.
  security: Aggregates only; analytics role.
  sql_sketch: SELECT surface, model_version, date_trunc('hour', impressed_at), count(*) FROM recommendation_impression GROUP BY 1,2,3 (clicks joined on request_ref, rank_position)
- name: vw_search_index_lag
  kind: view
  tables:
  - search_index_outbox
  - search_index_state
  - search_index_watermark
  purpose: Pending outbox depth and oldest pending age per index/consumer (alerting).
  security: Ops role only.
  sql_sketch: SELECT search_index_entity_kind_id, count(*), min(next_attempt_at) FROM search_index_outbox WHERE is_done = false GROUP BY 1
- name: vw_zero_result_top_queries
  kind: view
  tables:
  - search_query_normalised
  purpose: Top zero-result normalised queries for synonym/taxonomy curation.
  security: Curation role.
  sql_sketch: SELECT normalised_text, zero_result_count, occurrence_count FROM search_query_normalised WHERE zero_result_count > 0 ORDER BY zero_result_count DESC
- name: vw_raw_title_review_queue
  kind: view
  tables:
  - raw_title_normalisation
  purpose: Titles needing human mapping ordered by frequency.
  security: Taxonomy curators.
  sql_sketch: SELECT * FROM raw_title_normalisation WHERE normalisation_status_id = <needs_review> ORDER BY seen_count DESC
- name: vw_experiment_readout
  kind: view
  tables:
  - ab_experiment
  - ab_variant
  - ab_experiment_metric_result
  - ab_metric
  purpose: Latest result per arm and metric.
  security: Product/analytics roles.
  sql_sketch: SELECT DISTINCT ON (ab_variant_id, ab_metric_id) * FROM ab_experiment_metric_result ORDER BY ab_variant_id, ab_metric_id, window_end_date DESC
business_rules:
- id: BR-MTH-01
  rule: One live primary model deployment per surface at a time.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: uq_recommendation_model_deployment_recommendation_surface_id_primary_open on (recommendation_surface_id) WHERE is_primary AND effective_to IS NULL.
  tables:
  - recommendation_model_deployment
  milestone: B14
- id: BR-MTH-02
  rule: An embedding reference points at exactly one subject and at most one current embedding per subject+model.
  mechanism_type: CHECK
  mechanism: ck_embedding_ref_one_subject + three partial unique indexes WHERE is_current. Vector payload lives in the external vector store.
  tables:
  - embedding_ref
  milestone: B14
- id: BR-MTH-03
  rule: Match score and similarity values are normalised to 0..1; percentages 0..100.
  mechanism_type: CHECK
  mechanism: ck_match_score_overall_score_range, ck_similar_job_similarity_score_range, ck_similar_candidate_similarity_score_range.
  tables:
  - match_score
  - similar_job
  - similar_candidate
  milestone: B14
- id: BR-MTH-04
  rule: A (candidate, job, model version) pair is scored at most once.
  mechanism_type: UNIQUE
  mechanism: uq_match_score_pair_version; batch writers use INSERT ... ON CONFLICT (pair) DO UPDATE.
  tables:
  - match_score
  milestone: B14
- id: BR-MTH-05
  rule: Recommendation impressions are ingested idempotently.
  mechanism_type: UNIQUE
  mechanism: uq_recommendation_impression_request_position on (request_ref, rank_position); writers use INSERT ... ON CONFLICT DO NOTHING in 500-row batches.
  tables:
  - recommendation_impression
  milestone: B22
- id: BR-MTH-06
  rule: Click events are ingested idempotently by client event id.
  mechanism_type: UNIQUE
  mechanism: uq_recommendation_click_event_event_ref.
  tables:
  - recommendation_click_event
  milestone: B22
- id: BR-MTH-07
  rule: Impression and click tables are insert-only; expiry only by TTL.
  mechanism_type: TTL
  mechanism: ttl_expire_after 90/180 days on created_at; app roles have INSERT/SELECT only; ttl_job_cron should not be less than gc.ttlseconds.
  tables:
  - recommendation_impression
  - recommendation_click_event
  milestone: B22
- id: BR-MTH-08
  rule: Recommendations and suggestions are ephemeral and expire.
  mechanism_type: TTL
  mechanism: ttl_expiration_expression = 'expires_at' on job_recommendation, candidate_suggestion, match_score, similar_*; readers also filter expires_at > now() since expired rows stay visible until the
    job runs.
  tables:
  - job_recommendation
  - candidate_suggestion
  - match_score
  milestone: B14
- id: BR-MTH-09
  rule: Each recommendation carries at most one row per reason code.
  mechanism_type: UNIQUE
  mechanism: uq_job_recommendation_reason_rec_reason, uq_candidate_suggestion_reason_sugg_reason.
  tables:
  - job_recommendation_reason
  - candidate_suggestion_reason
  milestone: B14
- id: BR-MTH-10
  rule: Search outbox rows are written in the same transaction as the source change and delivered at-least-once; the engine applies by version so replays are harmless.
  mechanism_type: TXN_LOCK
  mechanism: 'Application txn: UPDATE source; INSERT search_index_outbox (dedupe_key unique) atomically under SERIALIZABLE. Relay claims due rows with UPDATE ... SET claimed_by_ref, claimed_until_at = now()+lease
    WHERE is_done = false AND next_attempt_at <= now() (SELECT ... FOR UPDATE supported; SKIP LOCKED availability is version-gated, unverified).'
  tables:
  - search_index_outbox
  milestone: B30
- id: BR-MTH-11
  rule: 'Outbox idempotency: one row per entity/source/version.'
  mechanism_type: UNIQUE
  mechanism: uq_search_index_outbox_dedupe_key.
  tables:
  - search_index_outbox
  milestone: B30
- id: BR-MTH-12
  rule: Done flag mirrors processed_at.
  mechanism_type: CHECK
  mechanism: ck_search_index_outbox_done_matches_processed.
  tables:
  - search_index_outbox
  milestone: B30
- id: BR-MTH-13
  rule: One live search index per entity kind.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: uq_search_index_state_search_index_entity_kind_id_live WHERE is_live.
  tables:
  - search_index_state
  milestone: B30
- id: BR-MTH-14
  rule: Experiment has exactly one control arm and unique arm keys; a unit is assigned once per experiment.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: uq_ab_variant_ab_experiment_id_control WHERE is_control; uq_ab_assignment_ab_experiment_id_app_user / _visitor partial uniques; assignment written with INSERT ... ON CONFLICT DO NOTHING then
    re-read.
  tables:
  - ab_variant
  - ab_assignment
  milestone: B22
- id: BR-MTH-15
  rule: Variant must belong to the assignment's experiment.
  mechanism_type: APP_LAYER
  mechanism: Declarative composite FK omitted; ab_assignment writer resolves ab_variant by (ab_experiment_id, variant_key); nightly consistency job verifies ab_variant.ab_experiment_id = ab_assignment.ab_experiment_id.
  tables:
  - ab_assignment
  - ab_variant
  milestone: B22
- id: BR-MTH-16
  rule: A job belongs to at most one duplicate cluster and a cluster has at most one canonical member.
  mechanism_type: UNIQUE
  mechanism: uq_duplicate_job_cluster_member_job_requirement_id; uq_duplicate_job_cluster_member_duplicate_job_cluster_id_canonical WHERE is_canonical.
  tables:
  - duplicate_job_cluster_member
  milestone: B14
- id: BR-MTH-17
  rule: Quality/risk/salary scores keep one current row per subject.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: Partial unique indexes WHERE is_current on job_quality_score, candidate_quality_score, content_risk_score, salary_prediction; writer flips the old row is_current=false in the same txn.
  tables:
  - job_quality_score
  - candidate_quality_score
  - content_risk_score
  - salary_prediction
  milestone: B30
- id: BR-MTH-18
  rule: Raw titles are unique per language; low-confidence mappings need human review.
  mechanism_type: UNIQUE
  mechanism: uq_raw_title_normalisation_lang_title on (language_id, raw_title_lower); ck_raw_title_normalisation_review_pair; auto_accepted only above a threshold enforced by the mapper job.
  tables:
  - raw_title_normalisation
  milestone: B6
- id: BR-MTH-19
  rule: One inferred skill per candidate+skill; acceptance is copied to candidate_skill by the application.
  mechanism_type: UNIQUE
  mechanism: uq_skill_inference_candidate_skill; accept = one txn INSERT candidate_skill + UPDATE skill_inference.
  tables:
  - skill_inference
  milestone: B14
- id: BR-MTH-20
  rule: Behavioural profiling data (interest affinity, quality scores, inferred skills) is restricted by consent and erased/reset on request.
  mechanism_type: APP_LAYER
  mechanism: Writers check user_consent for the profiling consent_type before upsert; erasure job CASCADE-deletes by app_user/candidate_profile.
  tables:
  - user_interest_affinity
  - candidate_quality_score
  - skill_inference
  milestone: B30
- id: BR-MTH-21
  rule: Polymorphic score rows carry exactly one subject.
  mechanism_type: CHECK
  mechanism: ck_content_risk_score_one_subject, ck_salary_prediction_one_subject, ck_embedding_ref_one_subject.
  tables:
  - content_risk_score
  - salary_prediction
  - embedding_ref
  milestone: B30
- id: BR-MTH-22
  rule: Synonym groups have one canonical term and unique terms; stopwords stored lowercase.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: uq_search_synonym_term_search_synonym_group_id_canonical WHERE is_canonical; uq_search_synonym_term_group_term; ck_search_stopword_word_lower.
  tables:
  - search_synonym_term
  - search_stopword
  milestone: B6
