    columns:
    - computed_at
    desc: 'Hash-sharded: TTL/refresh scans.'
    hash: true
    bucket_count: 32
  - name: idx_match_score_recommendation_model_version_id
    columns:
    - recommendation_model_version_id
    desc: 'FK support: child lookup/cascade by recommendation_model_version_id.'
