tables:
- name: recommendation_model
  kind: config
  delete_policy: soft
  volume: low
  tier: X
  milestones:
  - B14
  - B22
  retention: Retained while any version/log references it; soft-deleted when retired; never purged (audit of what ranked users).
  description: Registry of recommendation / matching / ranking models (one row per logical model; versions in recommendation_model_version).
  columns:
  - name: model_key
    type: STRING(80)
    domain: code
    desc: Stable machine key, e.g. job_rec_two_tower.
    sens: Internal
  - name: model_name
    type: STRING(150)
    domain: free_text
    desc: Display name.
    sens: Internal
  - name: description
    type: STRING(1000)
    domain: free_text
    desc: What the model does and its training data.
    sens: Internal
    'null': true
    null_why: NULL = not documented.
  - name: recommendation_surface_id
    type: UUID
    domain: enum_ref
    desc: Primary surface served.
    sens: Internal
  - name: recommendation_objective_id
    type: UUID
    domain: enum_ref
    desc: Optimisation objective.
    sens: Internal
  - name: owner_team
    type: STRING(80)
    domain: free_text
    desc: Owning ML/product team.
    sens: Internal
  - name: is_active
    type: BOOL
    domain: boolean
    desc: Model may receive new deployments.
    sens: Internal
    default: 'true'
  constraints: []
  indexes:
  - name: uq_recommendation_model_model_key
    columns:
    - model_key
    desc: Natural key among live rows.
    unique: true
    where: deleted_at IS NULL
  - name: idx_recommendation_model_is_active_live
    columns:
    - is_active
    desc: Active models.
    where: is_active AND deleted_at IS NULL
  fks:
  - name: fk_recommendation_model_recommendation_surface_id
    columns:
    - recommendation_surface_id
    ref: recommendation_surface
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Lookup rows are retired via is_active, never deleted.
    index_exempt: referenced lookup rows are retired via is_active and never deleted, so no child scan is needed
  - name: fk_recommendation_model_recommendation_objective_id
    columns:
    - recommendation_objective_id
    ref: recommendation_objective
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Lookup rows are retired via is_active, never deleted.
    index_exempt: referenced lookup rows are retired via is_active and never deleted, so no child scan is needed
- name: recommendation_model_version
  kind: config
  delete_policy: hard
  volume: low
  tier: X
  milestones:
  - B14
  - B22
  retention: Kept indefinitely (small); referenced by logs for reproducibility; artifact object retention governed by object-store policy.
  description: Immutable trained version of a model with artifact pointer, offline metrics and approval.
  columns:
  - name: recommendation_model_id
    type: UUID
    domain: identifier
    desc: Parent model.
    sens: Internal
  - name: version_label
    type: STRING(40)
    domain: free_text
    desc: Semantic/date version label.
    sens: Internal
  - name: model_status_id
    type: UUID
    domain: enum_ref
    desc: Lifecycle state.
    sens: Internal
  - name: artifact_object_ref
    type: STRING(500)
    domain: free_text
    desc: Object-store key of the model artifact (not in DB).
    sens: Internal
    'null': true
    null_why: NULL = rule-based/no artifact.
  - name: feature_schema_version
    type: INT4
    domain: quantity
    desc: Feature schema this model expects (matches candidate_feature_snapshot/job_feature_snapshot).
    sens: Internal
  - name: training_data_cutoff_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Newest training data timestamp.
    sens: Internal
    'null': true
    null_why: NULL = rule-based, no training.
  - name: trained_at
