- name: recommendation_impression
  kind: event
  delete_policy: append_only
  volume: very_high
  tier: X
  milestones:
  - B14
  - B22
  retention: Row-level TTL 90 days on created_at; aggregated to analytics before purge; erased with user (CASCADE) or by TTL; no UPDATE/DELETE grants to app roles.
  description: One row per recommended item rendered to a user (billions of rows). Training label source and CTR denominator. Written by the serving layer in batches (multi-row INSERT, ON CONFLICT DO NOTHING
    on uq request/position).
  audit: created_only
  ttl:
    expire_after: 90 days
  columns:
  - name: app_user_id
    type: UUID
    domain: identifier
    desc: Viewing/acting user.
    sens: Internal
    'null': true
    null_why: NULL = anonymous visitor (see visitor_ref).
  - name: visitor_ref
    type: STRING(64)
    domain: free_text
    desc: Salted hash of anonymous visitor id.
    sens: Personal
    'null': true
    null_why: NULL = signed-in user.
    pii: salted HMAC rotated monthly; no raw IP/cookie stored
  - name: recommendation_surface_id
    type: UUID
    domain: enum_ref
    desc: Surface.
    sens: Internal
  - name: recommendation_model_version_id
    type: UUID
    domain: identifier
    desc: Model that ranked the item.
    sens: Internal
  - name: ab_variant_id
    type: UUID
    domain: identifier
    desc: Variant under test.
    sens: Internal
    'null': true
    null_why: NULL = no experiment.
  - name: job_requirement_id
    type: UUID
    domain: identifier
    desc: Job shown/clicked.
    sens: Internal
    'null': true
    null_why: NULL = candidate-subject item.
  - name: candidate_profile_id
    type: UUID
    domain: identifier
    desc: Candidate shown/clicked (recruiter surfaces).
    sens: Internal
    'null': true
    null_why: NULL = job-subject item.
  - name: rank_position
    type: INT2
    domain: quantity
    desc: Position on the list (1-based).
    sens: Internal
  - name: request_ref
    type: STRING(64)
    domain: code
    desc: Serving request id grouping a page of results.
    sens: Internal
  - name: impressed_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Client-confirmed render time.
    sens: Internal
  - name: is_viewable
    type: BOOL
    domain: boolean
    desc: Item was in viewport long enough (viewability).
    sens: Internal
    default: 'false'
  constraints:
  - name: uq_recommendation_impression_request_position
    type: unique
    columns:
    - request_ref
    - rank_position
    desc: Idempotent ingestion key.
  - name: ck_recommendation_impression_one_subject
    type: check
    expr: job_requirement_id IS NOT NULL OR candidate_profile_id IS NOT NULL
    desc: An item subject is required.
  - name: ck_recommendation_impression_actor_present
    type: check
    expr: app_user_id IS NOT NULL OR visitor_ref IS NOT NULL
    desc: Signed-in or visitor.
  indexes:
  - name: idx_recommendation_impression_impressed_at
    columns:
    - impressed_at
    desc: Hash-sharded time index for training export (changefeed sink is the primary reader).
    hash: true
    bucket_count: 32
  - name: idx_recommendation_impression_job_requirement_id_impressed_at
