- name: gig_price_type
  description: Pricing model of a gig request or offering. is_rate_based is the machine flag enforced by composite FK so price columns stay consistent.
  values:
  - code: fixed
    en: Fixed price
    hi: निश्चित मूल्य
    sort: 10
  - code: rate_based
    en: Rate based (per hour/day)
    hi: दर आधारित
    sort: 20
  milestones:
  - B26
  - B32
  extra_columns:
  - name: is_rate_based
    type: BOOL
    domain: boolean
    'null': false
    default: 'false'
    sens: Public
    desc: True for rate_based; false for fixed. Referenced by composite FK (id, is_rate_based).
  constraints:
  - name: uq_gig_price_type_id_is_rate_based
    type: unique
    columns:
    - id
    - is_rate_based
    desc: Target of composite FKs that pin the flag to the type.
