- name: gig_slot
  kind: link
  delete_policy: hard
  volume: very_high
  tier: '1'
  milestones:
  - B26
  - B29
  - B32
  - B35
  retention: Hard delete on cancel/edit; row TTL 90 days after slot_start_at (ttl_expiration_expression = slot_start_at + 90 days).
  description: 15-minute slot rows owned by an assignment or a time-off block; UNIQUE (worker, slot_start_at) enforces no overlap per worker (pattern P2).
  columns:
  - name: gig_worker_profile_id
    type: UUID
    domain: identifier
    desc: Worker whose time is held.
    sens: Internal
  - name: gig_assignment_id
    type: UUID
    domain: identifier
    desc: Owning assignment.
    'null': true
    null_why: NULL when the slot belongs to time off.
    sens: Internal
  - name: gig_time_off_id
    type: UUID
    domain: identifier
    desc: Owning time off.
    'null': true
    null_why: NULL when the slot belongs to an assignment.
    sens: Internal
  - name: slot_start_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Slot start, UTC, on the 15-min grid; slot spans start..start+15 min.
    sens: Internal
  constraints:
  - name: uq_gig_slot_gig_worker_profile_id_slot_start_at
    type: unique
    columns:
    - gig_worker_profile_id
    - slot_start_at
    desc: No two holds of the same worker at the same instant (B35).
  - name: ck_gig_slot_grid
    type: check
    expr: (extract(epoch FROM slot_start_at)::INT8 % 900) = 0
    desc: 15-minute grid.
  - name: ck_gig_slot_one_owner
    type: check
    expr: (gig_assignment_id IS NULL) <> (gig_time_off_id IS NULL)
    desc: Exactly one owner.
  indexes:
  - name: idx_gig_slot_gig_assignment_id
    columns:
    - gig_assignment_id
    desc: Release slots on cancellation.
    where: gig_assignment_id IS NOT NULL
  - name: idx_gig_slot_gig_time_off_id
    columns:
    - gig_time_off_id
    desc: Release slots on time-off edit.
    where: gig_time_off_id IS NOT NULL
  - name: idx_gig_slot_slot_start_at
    columns:
    - slot_start_at
    desc: Past-slot sweeps (hash-sharded).
    hash: true
    bucket_count: 16
  fks:
  - name: fk_gig_slot_gig_worker_profile_id
    columns:
    - gig_worker_profile_id
    ref: gig_worker_profile
    on_delete: CASCADE
    on_update: RESTRICT
    desc: Slots follow profile.
  - name: fk_gig_slot_assignment_worker
    columns:
    - gig_assignment_id
    - gig_worker_profile_id
    ref: gig_assignment
    on_delete: CASCADE
    on_update: RESTRICT
    desc: Slot worker must equal assignment worker.
    ref_columns:
    - id
    - gig_worker_profile_id
  - name: fk_gig_slot_time_off_worker
    columns:
    - gig_time_off_id
    - gig_worker_profile_id
    ref: gig_time_off
    on_delete: CASCADE
    on_update: RESTRICT
    desc: Slot worker must equal time-off worker.
    ref_columns:
    - id
    - gig_worker_profile_id
  audit: created_only
  ttl:
    expire_after: 90 days
    column: slot_start_at
