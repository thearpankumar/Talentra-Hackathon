- name: gig_availability_rule
  kind: entity
  delete_policy: soft
  volume: medium
  tier: '1'
  milestones:
  - B26
  - B35
  retention: Soft delete; superseded rules kept 1 year by effective_to_date, then purged.
  description: Recurring weekly availability of a worker (local time).
  columns:
  - name: gig_worker_profile_id
    type: UUID
    domain: identifier
    desc: Worker.
    sens: Internal
  - name: gig_weekday_id
    type: UUID
    domain: enum_ref
    desc: Day of week.
    sens: Internal
  - name: local_start_time
    type: TIME
    domain: time_of_day
    desc: Start in worker's time zone.
    sens: Internal
  - name: local_end_time
    type: TIME
    domain: time_of_day
    desc: End in worker's time zone.
    sens: Internal
  - name: effective_from_date
    type: DATE
    domain: date
    desc: First date the rule applies.
    sens: Internal
  - name: effective_to_date
    type: DATE
    domain: date
    desc: Last date the rule applies.
    'null': true
    null_why: NULL = open-ended.
    sens: Internal
  constraints:
  - name: ck_gig_availability_rule_times
    type: check
    expr: local_end_time > local_start_time
    desc: End after start within the day.
  - name: ck_gig_availability_rule_dates
    type: check
    expr: effective_to_date IS NULL OR effective_to_date >= effective_from_date
    desc: End not before start.
  indexes:
  - name: uq_gig_availability_rule_gig_worker_profile_id_gig_weekday_id_local_start_time
    columns:
    - gig_worker_profile_id
    - gig_weekday_id
    - local_start_time
    desc: Same-day windows must differ in start (exact non-overlap by TXN check).
    unique: true
    where: effective_to_date IS NULL AND deleted_at IS NULL
  fks:
  - name: fk_gig_availability_rule_gig_worker_profile_id
    columns:
    - gig_worker_profile_id
    ref: gig_worker_profile
    on_delete: CASCADE
    on_update: RESTRICT
    desc: Follows profile.
  - name: fk_gig_availability_rule_gig_weekday_id
    columns:
    - gig_weekday_id
    ref: gig_weekday
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Lookup.
    index_exempt: low-cardinality lookup; lookup rows are never deleted so no child-side scan is needed
- name: gig_availability_window
  kind: entity
  delete_policy: soft
  volume: medium
  tier: '1'
  milestones:
  - B26
  - B35
  retention: Soft delete; purged 90 days after window_end_at.
  description: One-off extra availability window (beyond recurring rules).
  columns:
  - name: gig_worker_profile_id
    type: UUID
    domain: identifier
    desc: Worker.
    sens: Internal
  - name: window_start_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Start (15-min grid).
    sens: Internal
  - name: window_end_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: End (15-min grid).
    sens: Internal
  - name: note
    type: STRING(300)
    domain: free_text
    desc: Worker note.
    'null': true
    null_why: NULL = none.
    sens: Internal
  constraints:
  - name: ck_gig_availability_window_range
    type: check
    expr: window_end_at > window_start_at
    desc: End after start.
  - name: ck_gig_availability_window_grid
    type: check
    expr: (extract(epoch FROM window_start_at)::INT8 % 900) = 0 AND (extract(epoch FROM window_end_at)::INT8 % 900) = 0
    desc: 15-minute grid.
  - name: ck_gig_availability_window_max_length
    type: check
    expr: window_end_at - window_start_at <= INTERVAL '31 days'
    desc: Max 31 days.
  indexes:
  - name: idx_gig_availability_window_gig_worker_profile_id_window_start_at
    columns:
    - gig_worker_profile_id
    - window_start_at
    desc: Availability lookups.
    where: deleted_at IS NULL
  fks:
  - name: fk_gig_availability_window_gig_worker_profile_id
    columns:
    - gig_worker_profile_id
    ref: gig_worker_profile
    on_delete: CASCADE
    on_update: RESTRICT
    desc: Follows profile.
