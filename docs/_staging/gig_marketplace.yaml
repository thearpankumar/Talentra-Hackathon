  retention: Soft delete; on erasure request anonymise bio/coordinates/kyc_token in place (DPDP/GDPR); KYC token purged 90 days after account closure; ratings kept anonymised.
  description: Marketplace profile of a gig worker; separate from candidate_profile (D-15). One per app_user.
  columns:
  - name: app_user_id
    type: UUID
    domain: identifier
    desc: Owning user account.
    sens: Internal
  - name: headline
    type: STRING(160)
    domain: free_text
    desc: Short profile headline.
    sens: Public
  - name: bio
    type: STRING(2000)
    domain: free_text
    desc: Free-text bio.
    'null': true
    null_why: NULL = worker has not written a bio.
    sens: Personal
    pii: User-authored free text; encrypted at rest; shown to requesters per profile visibility.
  - name: hourly_rate
    type: DECIMAL(12,2)
    domain: money
    desc: Standard hourly charge rate.
    'null': true
    null_why: NULL = worker does not offer hourly pricing.
    sens: Internal
  - name: daily_rate
    type: DECIMAL(12,2)
    domain: money
    desc: Standard day charge rate.
    'null': true
    null_why: NULL = worker does not offer day pricing.
    sens: Internal
  - name: currency_id
    type: UUID
    domain: identifier
    desc: Currency of hourly_rate/daily_rate.
    sens: Internal
  - name: service_radius_km
    type: INT4
    domain: quantity
    desc: Max travel distance for on-site gigs in km.
    'null': true
    null_why: NULL = remote-only / no travel limit stated.
    sens: Internal
  - name: home_latitude
    type: DECIMAL(9,6)
    domain: latitude
    desc: Home base latitude (service-radius centre).
    'null': true
    null_why: NULL = coordinates not provided.
    sens: Personal
    pii: Stored full precision, access-controlled; requesters only see rounded (2 dp) values via vw_gig_worker_public.
  - name: home_longitude
    type: DECIMAL(9,6)
    domain: longitude
    desc: Home base longitude.
    'null': true
    null_why: NULL = coordinates not provided.
    sens: Personal
    pii: As home_latitude.
  - name: geo_source_id
    type: UUID
    domain: enum_ref
    desc: Source of the coordinates (gps, geocoded address, manual pin).
    'null': true
    null_why: NULL when no coordinates are stored.
    sens: Internal
  - name: home_city_id
    type: UUID
    domain: identifier
    desc: City of the home base.
    'null': true
    null_why: NULL = not provided.
    sens: Internal
  - name: home_country_id
    type: UUID
    domain: identifier
    desc: Country of the home base.
    sens: Internal
  - name: time_zone
    type: STRING(64)
    domain: time_zone
    desc: IANA time zone used to interpret recurring availability.
    sens: Internal
  - name: verification_status_id
    type: UUID
    domain: enum_ref
    desc: Platform verification level of the worker.
    sens: Internal
  - name: rating_avg
    type: DECIMAL(3,2)
    domain: ratio
    desc: Denormalised average star rating (0..5), maintained with gig_worker_rating_summary.
    'null': true
    null_why: NULL = no ratings yet.
    sens: Internal
  - name: rating_count
    type: INT4
    domain: quantity
    desc: Number of ratings behind rating_avg.
    default: '0'
    sens: Internal
  - name: completed_gig_count
    type: INT4
    domain: quantity
    desc: Completed assignments (denormalised).
    default: '0'
    sens: Internal
  - name: gig_availability_status_id
    type: UUID
    domain: enum_ref
    desc: Current availability switch.
    sens: Internal
  - name: kyc_token
    type: STRING(128)
    domain: token
    desc: Vendor KYC token/reference of the identity check; no document data stored.
    'null': true
    null_why: NULL = KYC not started.
    sens: Sensitive
    pii: Vendor token only (D-10); resolved at KYC vendor; never logged; column grant limited to compliance role.
  - name: kyc_verified_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: When KYC passed.
    'null': true
    null_why: NULL = not verified.
    sens: Internal
  - name: is_listed
    type: BOOL
    domain: boolean
    desc: Visible in marketplace search.
    default: 'true'
    sens: Internal
  - name: profile_completeness
    type: DECIMAL(5,2)
    domain: percentage
    desc: Profile completeness percentage.
    default: '0'
    sens: Internal
  - name: last_active_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Last activity (for search ranking).
    'null': true
    null_why: NULL = never active after signup.
    sens: Internal
  constraints:
  - name: ck_gig_worker_profile_rates
    type: check
    expr: (hourly_rate IS NULL OR hourly_rate >= 0) AND (daily_rate IS NULL OR daily_rate >= 0)
    desc: Non-negative rates.
  - name: ck_gig_worker_profile_radius
    type: check
    expr: service_radius_km IS NULL OR service_radius_km BETWEEN 0 AND 1000
    desc: Radius range.
  - name: ck_gig_worker_profile_latitude
    type: check
    expr: home_latitude IS NULL OR home_latitude BETWEEN -90 AND 90
    desc: Latitude range.
  - name: ck_gig_worker_profile_longitude
    type: check
    expr: home_longitude IS NULL OR home_longitude BETWEEN -180 AND 180
    desc: Longitude range.
  - name: ck_gig_worker_profile_geo_pair
    type: check
    expr: (home_latitude IS NULL) = (home_longitude IS NULL) AND ((home_latitude IS NULL) OR (geo_source_id IS NOT NULL))
    desc: Coordinates come as a pair with a stated source.
  - name: ck_gig_worker_profile_rating_avg
    type: check
    expr: rating_avg IS NULL OR rating_avg BETWEEN 0 AND 5
    desc: Rating range.
  - name: ck_gig_worker_profile_rating_count
    type: check
    expr: rating_count >= 0 AND completed_gig_count >= 0
    desc: Counters non-negative.
  - name: ck_gig_worker_profile_completeness
    type: check
    expr: profile_completeness BETWEEN 0 AND 100
    desc: Percentage range.
  indexes:
  - name: uq_gig_worker_profile_app_user_id
    columns:
    - app_user_id
    desc: One gig profile per user (live rows).
    unique: true
    where: deleted_at IS NULL
  - name: idx_gig_worker_profile_home_country_id_home_city_id_gig_availability_status_id
    columns:
    - home_country_id
    - home_city_id
    - gig_availability_status_id
    desc: Marketplace search by location + availability.
    where: is_listed AND deleted_at IS NULL
    storing:
    - hourly_rate
    - rating_avg
  - name: idx_gig_worker_profile_rating_avg
    columns:
    - rating_avg DESC
    desc: Top-rated browse.
    where: is_listed AND deleted_at IS NULL
  - name: idx_gig_worker_profile_home_latitude_home_longitude
    columns:
    - home_latitude
    - home_longitude
    desc: Bounding-box pre-filter for radius search (exact distance in app/search service).
    where: home_latitude IS NOT NULL AND deleted_at IS NULL
  - name: uq_gig_worker_profile_kyc_token
    columns:
    - kyc_token
    desc: Resolve webhook from KYC vendor.
    unique: true
    where: kyc_token IS NOT NULL AND deleted_at IS NULL
  - name: idx_gig_worker_profile_currency_id
    columns:
    - currency_id
    desc: Leading index for FK on currency_id (D-20).
  - name: idx_gig_worker_profile_home_city_id
    columns:
    - home_city_id
    desc: Leading index for FK on home_city_id (D-20).
  - name: idx_gig_worker_profile_geo_source_id
    columns:
    - geo_source_id
    desc: Leading index for FK on geo_source_id (D-20).
  - name: idx_gig_worker_profile_verification_status_id
    columns:
    - verification_status_id
    desc: Leading index for FK on verification_status_id (D-20).
  fks:
  - name: fk_gig_worker_profile_app_user_id
    columns:
    - app_user_id
    ref: app_user
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Account owns the profile; erasure goes via anonymisation job, not cascade.
  - name: fk_gig_worker_profile_currency_id
    columns:
    - currency_id
    ref: currency
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Reference currency.
  - name: fk_gig_worker_profile_home_city_id
    columns:
    - home_city_id
    ref: city
    on_delete: SET NULL
    on_update: RESTRICT
    desc: City may be retired.
  - name: fk_gig_worker_profile_home_country_id
    columns:
    - home_country_id
    ref: country
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Reference country.
  - name: fk_gig_worker_profile_geo_source_id
    columns:
    - geo_source_id
    ref: geo_source
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Lookup.
  - name: fk_gig_worker_profile_verification_status_id
    columns:
    - verification_status_id
    ref: verification_status
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Master lookup.
  - name: fk_gig_worker_profile_gig_availability_status_id
    columns:
    - gig_availability_status_id
    ref: gig_availability_status
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Lookup.
    index_exempt: low-cardinality lookup; lookup rows are never deleted so no child-side scan is needed
