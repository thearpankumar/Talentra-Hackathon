    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Lookup.
    index_exempt: low-cardinality lookup; lookup rows are never deleted so no child-side scan is needed
  - name: fk_gig_assignment_status_history_to_gig_assignment_status_id
    columns:
    - to_gig_assignment_status_id
