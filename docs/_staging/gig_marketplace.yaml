    where: is_active AND deleted_at IS NULL
  - name: idx_gig_search_alert_gig_worker_profile_id
    columns:
    - gig_worker_profile_id
    desc: Worker's alerts.
    where: deleted_at IS NULL
  - name: idx_gig_search_alert_job_category_id
    columns:
    - job_category_id
    desc: Leading index for FK on job_category_id (D-20).
  - name: idx_gig_search_alert_city_id
    columns:
    - city_id
    desc: Leading index for FK on city_id (D-20).
  - name: idx_gig_search_alert_currency_id
    columns:
    - currency_id
    desc: Leading index for FK on currency_id (D-20).
  fks:
  - name: fk_gig_search_alert_gig_worker_profile_id
    columns:
    - gig_worker_profile_id
    ref: gig_worker_profile
    on_delete: CASCADE
    on_update: RESTRICT
    desc: Follows profile.
  - name: fk_gig_search_alert_job_category_id
    columns:
    - job_category_id
    ref: job_category
    on_delete: SET NULL
    on_update: RESTRICT
    desc: Filter may be retired.
  - name: fk_gig_search_alert_city_id
    columns:
    - city_id
    ref: city
    on_delete: SET NULL
    on_update: RESTRICT
    desc: Filter may be retired.
  - name: fk_gig_search_alert_currency_id
    columns:
    - currency_id
    ref: currency
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Master.
  - name: fk_gig_search_alert_gig_work_mode_id
    columns:
    - gig_work_mode_id
    ref: gig_work_mode
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Lookup.
    index_exempt: low-cardinality lookup; lookup rows are never deleted so no child-side scan is needed
  - name: fk_gig_search_alert_gig_alert_frequency_id
    columns:
    - gig_alert_frequency_id
    ref: gig_alert_frequency
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Lookup.
- name: gig_report
  kind: entity
  delete_policy: soft
  volume: medium
  tier: '1'
  milestones:
  - B26
  - B29
  retention: Soft delete; kept 2 years; details anonymised on erasure.
  description: Abuse/fraud report against a gig worker or a gig request.
  columns:
  - name: reporter_app_user_id
    type: UUID
    domain: identifier
    desc: Reporter.
    sens: Internal
  - name: gig_worker_profile_id
    type: UUID
    domain: identifier
    desc: Reported worker.
    'null': true
    null_why: NULL when a request is reported.
    sens: Internal
  - name: gig_request_id
    type: UUID
    domain: identifier
    desc: Reported request.
    'null': true
    null_why: NULL when a worker is reported.
    sens: Internal
  - name: gig_report_reason_id
    type: UUID
    domain: enum_ref
    desc: Reason.
    sens: Internal
  - name: details
    type: STRING(2000)
    domain: free_text
    desc: Details.
    'null': true
    null_why: NULL = none.
    sens: Personal
    pii: Free text; encrypted at rest; admins only.
  - name: gig_report_status_id
    type: UUID
    domain: enum_ref
    desc: Moderation status.
    sens: Internal
  - name: reviewed_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Reviewed.
    'null': true
    null_why: NULL = not reviewed.
    sens: Internal
  - name: reviewed_by_app_user_id
    type: UUID
    domain: identifier
    desc: Moderator.
    'null': true
    null_why: NULL = not reviewed.
    sens: Internal
  constraints:
  - name: ck_gig_report_one_target
    type: check
    expr: (gig_worker_profile_id IS NULL) <> (gig_request_id IS NULL)
    desc: Exactly one target.
  indexes:
  - name: idx_gig_report_gig_report_status_id_created_at
    columns:
    - gig_report_status_id
    - created_at
    desc: Moderation queue.
    where: deleted_at IS NULL
  - name: idx_gig_report_gig_request_id
    columns:
    - gig_request_id
    desc: By request.
    where: gig_request_id IS NOT NULL
  - name: idx_gig_report_reporter_app_user_id
    columns:
    - reporter_app_user_id
    desc: By reporter.
  - name: idx_gig_report_gig_worker_profile_id
    columns:
    - gig_worker_profile_id
    desc: Leading index for FK on gig_worker_profile_id (D-20).
  - name: idx_gig_report_reviewed_by_app_user_id
    columns:
    - reviewed_by_app_user_id
    desc: Leading index for FK on reviewed_by_app_user_id (D-20).
  fks:
  - name: fk_gig_report_reporter_app_user_id
    columns:
    - reporter_app_user_id
    ref: app_user
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Reporter.
  - name: fk_gig_report_gig_worker_profile_id
    columns:
    - gig_worker_profile_id
    ref: gig_worker_profile
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Target.
  - name: fk_gig_report_gig_request_id
    columns:
    - gig_request_id
    ref: gig_request
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Target.
  - name: fk_gig_report_gig_report_reason_id
    columns:
    - gig_report_reason_id
    ref: gig_report_reason
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Lookup.
    index_exempt: low-cardinality lookup; lookup rows are never deleted so no child-side scan is needed
  - name: fk_gig_report_gig_report_status_id
    columns:
    - gig_report_status_id
    ref: gig_report_status
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Lookup.
  - name: fk_gig_report_reviewed_by_app_user_id
    columns:
    - reviewed_by_app_user_id
    ref: app_user
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Moderator.
views:
- name: vw_unified_demand
  kind: view
  tables:
  - job_requirement
  - gig_request
  purpose: Single demand feed across jobs and gigs for reporting/analytics (D-15 reporting trade-off).
  security: Aggregates only; tenant filter via organisation_id; no personal data.
  sql_sketch: SELECT 'job' AS demand_type, id, organisation_id, <category>, <city>, <status>, <opened_at> FROM job_requirement UNION ALL SELECT 'gig', id, organisation_id, job_category_id, city_id, gig_request_status_id,
    published_at FROM gig_request WHERE deleted_at IS NULL
- name: vw_gig_worker_public
  kind: view
  tables:
  - gig_worker_profile
  - gig_worker_rating_summary
  purpose: Requester-facing worker card with coordinates rounded to 2 dp and no KYC columns.
  security: Granted to requester role instead of the base table.
  sql_sketch: SELECT id, headline, hourly_rate, daily_rate, round(home_latitude,2), round(home_longitude,2), rating_avg, rating_count FROM gig_worker_profile WHERE is_listed AND deleted_at IS NULL
- name: vw_gig_open_request
  kind: view
  tables:
  - gig_request
  purpose: Open, visible, not-expired requests for marketplace browse.
  security: Public visibility rows only for non-invited users.
  sql_sketch: SELECT ... FROM gig_request r JOIN gig_request_status s ON s.id=r.gig_request_status_id WHERE s.code='open' AND r.deleted_at IS NULL
business_rules:
- id: BR-GIG-01
  rule: A gig worker cannot hold two overlapping windows.
  mechanism_type: SLOT_TABLE
  mechanism: gig_slot UNIQUE (gig_worker_profile_id, slot_start_at); assignment slots inserted in the same txn as the assignment (P2).
  tables:
  - gig_slot
  - gig_assignment
  milestone: B35
- id: BR-GIG-02
  rule: Windows lie on the 15-minute grid and last at most 31 days.
  mechanism_type: CHECK
  mechanism: ck_gig_assignment_grid / ck_gig_assignment_max_length (extract(epoch FROM ts)::INT8 % 900 = 0; end - start <= INTERVAL '31 days'; expected_slot_count 1..2976); same on gig_request, gig_time_off,
    gig_availability_window.
  tables:
  - gig_assignment
  - gig_request
  - gig_time_off
  - gig_availability_window
  milestone: B35
- id: BR-GIG-03
  rule: Approved time off blocks assignments and vice versa.
  mechanism_type: SLOT_TABLE
  mechanism: gig_time_off rows exploded to gig_slot with gig_time_off_id; CHECK exactly one owner; same UNIQUE catches conflicts.
  tables:
  - gig_time_off
  - gig_slot
  milestone: B35
- id: BR-GIG-04
  rule: A slot belongs to the same worker as its assignment/time off.
  mechanism_type: CHAIN_FK
  mechanism: Composite FKs (gig_assignment_id, gig_worker_profile_id) -> gig_assignment(id, gig_worker_profile_id); (gig_time_off_id, gig_worker_profile_id) -> gig_time_off.
  tables:
  - gig_slot
  milestone: B35
- id: BR-GIG-05
  rule: Cancelled assignments release their slots.
  mechanism_type: TXN_LOCK
  mechanism: 'Cancellation txn: INSERT gig_cancellation, DELETE gig_slot WHERE gig_assignment_id=?, record slots_released_count; nightly JOB verifies slots_released_at and slot count invariant.'
  tables:
  - gig_cancellation
  - gig_slot
  milestone: B35
- id: BR-GIG-06
  rule: Gig window must have end after start.
  mechanism_type: CHECK
  mechanism: ck_gig_request_window, ck_gig_assignment_window, ck_gig_availability_window_range.
  tables:
  - gig_request
  - gig_assignment
  milestone: B32
- id: BR-GIG-07
  rule: Price is fixed or rate based and the money/rate fields must match.
  mechanism_type: CHAIN_FK
  mechanism: Composite FK (gig_price_type_id, is_rate_based) -> gig_price_type(id, is_rate_based) + ck_gig_request_price_shape.
  tables:
  - gig_request
  - gig_price_type
  milestone: B32
- id: BR-GIG-08
  rule: A worker applies at most once per request.
  mechanism_type: UNIQUE
  mechanism: UNIQUE (gig_worker_profile_id, gig_request_id) on gig_application.
  tables:
  - gig_application
  milestone: B35
- id: BR-GIG-09
  rule: 'Applications flow one way: only the requester side accepts/rejects; no counter-offer.'
  mechanism_type: PRIVILEGE
  mechanism: Worker role may only INSERT and set withdrawn status; status accepted/rejected + decided_by only via requester-organisation role/stored procedure; no counter columns exist.
  tables:
  - gig_application
  milestone: B29
- id: BR-GIG-10
  rule: An assignment exists only for an accepted application of the same worker and request.
  mechanism_type: CHAIN_FK
  mechanism: Composite FK (gig_application_id, gig_request_id, gig_worker_profile_id, application_is_accepted=true) -> gig_application(id, gig_request_id, gig_worker_profile_id, is_accepted).
  tables:
  - gig_assignment
  - gig_application
  milestone: B29
- id: BR-GIG-11
  rule: One assignment per application.
  mechanism_type: UNIQUE
  mechanism: uq_gig_assignment_gig_application_id.
  tables:
  - gig_assignment
  milestone: B35
- id: BR-GIG-12
  rule: Accepted applications never exceed headcount.
  mechanism_type: TXN_LOCK
  mechanism: SELECT gig_request FOR UPDATE, increment accepted_count; ck_gig_request_headcount.
  tables:
  - gig_request
  - gig_application
  milestone: B35
- id: BR-GIG-13
  rule: A blacklisted worker cannot apply or be invited by that organisation.
  mechanism_type: TXN_LOCK
  mechanism: Apply/invite txn reads gig_requester_worker_list (organisation_id, worker) and rejects list_type=blacklist before insert.
  tables:
  - gig_requester_worker_list
  - gig_application
  - gig_invite
  milestone: B29
- id: BR-GIG-14
  rule: A worker is favourite OR blacklisted for an organisation, never both.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: uq_gig_requester_worker_list_organisation_id_gig_worker_profile_id WHERE deleted_at IS NULL; list_type lookup column switched in place.
  tables:
  - gig_requester_worker_list
  milestone: B29
- id: BR-GIG-15
  rule: Only completed assignments can be rated, once, 1..5 stars.
  mechanism_type: CHAIN_FK
  mechanism: Composite FK (gig_assignment_id, assignment_is_completed) -> gig_assignment(id,is_completed); partial unique on gig_assignment_id; ck_gig_rating_stars.
  tables:
  - gig_rating
  - gig_assignment
  milestone: B35
- id: BR-GIG-16
  rule: Only the requester organisation that owned the assignment rates it, for the right worker.
  mechanism_type: CHAIN_FK
  mechanism: Composite FKs (gig_assignment_id, organisation_id) and (gig_assignment_id, gig_worker_profile_id) on gig_rating.
  tables:
  - gig_rating
  milestone: B29
- id: BR-GIG-17
  rule: Handoff to the external system is idempotent.
  mechanism_type: UNIQUE
  mechanism: Unique handoff_idempotency_key and partial unique handoff_ref on gig_assignment.
  tables:
  - gig_assignment
  milestone: B29
- id: BR-GIG-18
  rule: Inbound external events are applied at most once.
  mechanism_type: UNIQUE
  mechanism: UNIQUE (source_system, idempotency_key) on gig_fulfilment_event; reprocessing writes gig_fulfilment_event_attempt rows only.
  tables:
  - gig_fulfilment_event
  - gig_fulfilment_event_attempt
  milestone: B29
- id: BR-GIG-19
  rule: Events and histories are immutable.
  mechanism_type: PRIVILEGE
  mechanism: 'append_only tables: INSERT/SELECT grants only (P5).'
  tables:
  - gig_fulfilment_event
  - gig_assignment_status_history
  - gig_request_status_history
  - gig_earnings_snapshot
  milestone: B29
- id: BR-GIG-20
  rule: Earnings are sourced from the external system and carry a currency and as-of time.
  mechanism_type: CHECK
  mechanism: ck_gig_assignment_earnings; gig_earnings_snapshot unique (source_system, idempotency_key); reconciliation JOB sets earnings_reconciled_at and gig_reconcile_state.
  tables:
  - gig_assignment
  - gig_earnings_snapshot
  milestone: B29
- id: BR-GIG-21
  rule: Gig worker profile is separate and unique per user.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: uq_gig_worker_profile_app_user_id WHERE deleted_at IS NULL.
  tables:
  - gig_worker_profile
  milestone: B26
- id: BR-GIG-22
  rule: Worker coordinates need a source and valid range; precise location is not exposed to others.
  mechanism_type: VIEW
  mechanism: Lat/long range CHECKs + geo_source pair CHECK; requesters read vw_gig_worker_public (2 dp).
  tables:
  - gig_worker_profile
  milestone: B75
- id: BR-GIG-23
  rule: KYC data is stored as a vendor token only.
  mechanism_type: PRIVILEGE
  mechanism: kyc_token column Sensitive; column-level grant to compliance role; no document data columns.
  tables:
  - gig_worker_profile
  milestone: B75
- id: BR-GIG-24
  rule: No bank or payment-instrument data stored for payouts.
  mechanism_type: APP_LAYER
  mechanism: gig_payout_reference holds payout_ref/channel/status/amount only; reviewed in schema review.
  tables:
  - gig_payout_reference
  milestone: B75
- id: BR-GIG-25
  rule: One open timesheet session per assignment.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: Unique index on gig_assignment_id WHERE check_out_at IS NULL AND deleted_at IS NULL.
  tables:
  - gig_timesheet_entry
  milestone: B35
- id: BR-GIG-26
  rule: A report targets exactly one of worker or request.
  mechanism_type: CHECK
  mechanism: ck_gig_report_one_target.
  tables:
  - gig_report
  milestone: B29
- id: BR-GIG-27
  rule: Requester demand and supply of gigs and jobs can be reported together.
  mechanism_type: VIEW
  mechanism: vw_unified_demand UNION ALL view feeding analytics bridge.
  tables:
  - gig_request
  - job_requirement
  milestone: B29
