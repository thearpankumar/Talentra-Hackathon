- name: gig_fulfilment_event
  kind: event
  delete_policy: append_only
  volume: very_high
  tier: '1'
  milestones:
  - B26
  - B29
  - B75
  retention: Row TTL 395 days after created_at; business effect persisted in assignment/history/earnings tables.
  description: Inbound webhook events from the external fulfilment system; immutable.
  columns:
  - name: source_system
    type: STRING(32)
    domain: code
    desc: Sender system code.
    sens: Internal
  - name: idempotency_key
    type: STRING(128)
    domain: code
    desc: Sender event id; dedup key.
    sens: Internal
  - name: gig_fulfilment_event_type_id
    type: UUID
    domain: enum_ref
    desc: Event type.
    sens: Internal
  - name: handoff_ref
    type: STRING(128)
    domain: token
    desc: Handoff reference carried by the event.
    'null': true
    null_why: NULL = event without a handoff reference.
    sens: Internal
  - name: gig_assignment_id
    type: UUID
    domain: identifier
    desc: Resolved assignment.
    'null': true
    null_why: NULL = not resolvable at receipt (unknown handoff_ref or arrived early).
    sens: Internal
  - name: occurred_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Event time at source.
    sens: Internal
  - name: received_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Receipt time.
    default: now()
    sens: Internal
  - name: schema_version
    type: INT2
    domain: quantity
    desc: Payload schema version.
    default: '1'
    sens: Internal
  - name: signature_valid
    type: BOOL
    domain: boolean
    desc: HMAC signature verified.
    default: 'true'
    sens: Internal
  - name: payload
    type: JSONB
    domain: json
    desc: 'Minimal raw payload (ids, status, amounts; contract: no names/contact data).'
    sens: Personal
    pii: Contract forbids PII; schema-validated on receipt, unknown keys dropped; encrypted at rest.
  constraints:
  - name: uq_gig_fulfilment_event_source_system_idempotency_key
    type: unique
    columns:
    - source_system
    - idempotency_key
    desc: Webhook retries are idempotent.
  - name: ck_gig_fulfilment_event_signature
    type: check
    expr: signature_valid
    desc: Only verified events are stored; rejects go to error log.
  - name: ck_gig_fulfilment_event_version
    type: check
    expr: schema_version > 0
    desc: Positive.
  indexes:
  - name: idx_gig_fulfilment_event_gig_assignment_id_occurred_at
    columns:
    - gig_assignment_id
    - occurred_at DESC
    desc: Assignment event timeline.
    where: gig_assignment_id IS NOT NULL
  - name: idx_gig_fulfilment_event_handoff_ref
    columns:
    - handoff_ref
    desc: Late resolution of unmatched events.
    where: handoff_ref IS NOT NULL
  - name: idx_gig_fulfilment_event_received_at
    columns:
    - received_at
    desc: Time scan (hash-sharded).
    hash: true
    bucket_count: 16
  fks:
  - name: fk_gig_fulfilment_event_gig_fulfilment_event_type_id
    columns:
    - gig_fulfilment_event_type_id
    ref: gig_fulfilment_event_type
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Lookup.
    index_exempt: low-cardinality lookup; lookup rows are never deleted so no child-side scan is needed
  - name: fk_gig_fulfilment_event_gig_assignment_id
    columns:
    - gig_assignment_id
    ref: gig_assignment
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Evidence.
  ttl:
    expire_after: 395 days
    column: created_at
