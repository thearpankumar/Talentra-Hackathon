    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Tenant owns request history.
  - name: fk_gig_request_requester_app_user_id
    columns:
    - requester_app_user_id
    ref: app_user
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Poster.
