    desc: Actual start.
    'null': true
    null_why: NULL = not started.
    sens: Internal
  - name: completed_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Actual completion.
    'null': true
    null_why: NULL = not completed.
    sens: Internal
  constraints:
  - name: uq_gig_assignment_gig_application_id
    type: unique
    columns:
    - gig_application_id
    desc: At most one assignment per application.
  - name: uq_gig_assignment_id_gig_worker_profile_id
    type: unique
    columns:
    - id
    - gig_worker_profile_id
    desc: Composite FK target (slot, rating, timesheet).
  - name: uq_gig_assignment_id_is_completed
    type: unique
    columns:
    - id
    - is_completed
    desc: 'Composite FK target: rating only for completed.'
  - name: uq_gig_assignment_id_organisation_id
    type: unique
    columns:
    - id
    - organisation_id
    desc: 'Composite FK target: rater tenant.'
  - name: ck_gig_assignment_window
    type: check
    expr: window_end_at > window_start_at
    desc: End after start.
  - name: ck_gig_assignment_grid
    type: check
    expr: (extract(epoch FROM window_start_at)::INT8 % 900) = 0 AND (extract(epoch FROM window_end_at)::INT8 % 900) = 0
    desc: 15-min grid.
  - name: ck_gig_assignment_max_length
    type: check
    expr: window_end_at - window_start_at <= INTERVAL '31 days' AND expected_slot_count BETWEEN 1 AND 2976
    desc: Max 31 days = 2976 slots.
  - name: ck_gig_assignment_accepted_flag
    type: check
    expr: application_is_accepted
    desc: Always accepted.
  - name: ck_gig_assignment_amount
    type: check
    expr: agreed_amount > 0
    desc: Positive.
  - name: ck_gig_assignment_earnings
    type: check
    expr: (estimated_earnings IS NULL OR estimated_earnings >= 0) AND (total_earnings IS NULL OR total_earnings >= 0) AND (projected_earnings IS NULL OR projected_earnings >= 0) AND ((estimated_earnings
      IS NULL AND total_earnings IS NULL AND projected_earnings IS NULL) OR earnings_currency_id IS NOT NULL)
    desc: Earnings figures need a currency.
  - name: ck_gig_assignment_completion
    type: check
    expr: (NOT is_completed) OR completed_at IS NOT NULL
    desc: Completed has a time.
  indexes:
  - name: uq_gig_assignment_handoff_ref
    columns:
    - handoff_ref
    desc: Webhook lookup by external ref.
    unique: true
    where: handoff_ref IS NOT NULL AND deleted_at IS NULL
  - name: uq_gig_assignment_handoff_idempotency_key
    columns:
    - handoff_idempotency_key
    desc: Idempotent handoff.
    unique: true
    where: deleted_at IS NULL
  - name: idx_gig_assignment_gig_worker_profile_id_gig_assignment_status_id
    columns:
    - gig_worker_profile_id
    - gig_assignment_status_id
    desc: Worker's work list.
    where: deleted_at IS NULL
  - name: idx_gig_assignment_gig_request_id
    columns:
    - gig_request_id
    desc: Request's assignments.
    where: deleted_at IS NULL
  - name: idx_gig_assignment_organisation_id_window_start_at
    columns:
    - organisation_id
    - window_start_at
    desc: Requester schedule.
    where: deleted_at IS NULL
  - name: idx_gig_assignment_gig_reconcile_state_id_status_reconciled_at
    columns:
    - gig_reconcile_state_id
    - status_reconciled_at
    desc: Reconciliation worker queue.
    where: NOT is_completed AND deleted_at IS NULL
  - name: idx_gig_assignment_earnings_currency_id
    columns:
    - earnings_currency_id
    desc: Leading index for FK on earnings_currency_id (D-20).
  fks:
  - name: fk_gig_assignment_accepted_application
    columns:
    - gig_application_id
    - gig_request_id
    - gig_worker_profile_id
    - application_is_accepted
    ref: gig_application
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Only an accepted application of this worker for this request can become an assignment.
    ref_columns:
    - id
    - gig_request_id
    - gig_worker_profile_id
    - is_accepted
  - name: fk_gig_assignment_request_tenant
    columns:
    - gig_request_id
    - organisation_id
    ref: gig_request
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Tenant must match request.
    ref_columns:
    - id
    - organisation_id
  - name: fk_gig_assignment_request_currency
    columns:
    - gig_request_id
    - currency_id
    ref: gig_request
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Agreed currency equals request currency.
    ref_columns:
    - id
    - currency_id
  - name: fk_gig_assignment_status_flag
    columns:
    - gig_assignment_status_id
    - is_completed
    ref: gig_assignment_status
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Status and flag agree.
    ref_columns:
    - id
    - is_completed
    index_exempt: low-cardinality lookup; lookup rows are never deleted so no child-side scan is needed
  - name: fk_gig_assignment_gig_rate_unit_id
    columns:
    - gig_rate_unit_id
    ref: gig_rate_unit
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Lookup.
    index_exempt: low-cardinality lookup; lookup rows are never deleted so no child-side scan is needed
  - name: fk_gig_assignment_gig_reconcile_state_id
    columns:
    - gig_reconcile_state_id
    ref: gig_reconcile_state
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Lookup.
  - name: fk_gig_assignment_earnings_currency_id
    columns:
    - earnings_currency_id
    ref: currency
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Master.
  no_hash_why: Human-paced writes; no sequential index leads with time (organisation_id/status lead).
