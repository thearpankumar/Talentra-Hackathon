    type: STRING(2000)
    domain: free_text
    desc: Cover note.
    'null': true
    null_why: NULL = none.
    sens: Personal
    pii: User free text; encrypted at rest; not shown to other applicants.
  - name: proposed_amount
    type: DECIMAL(12,2)
    domain: money
    desc: Worker's offered price/rate (take-it-or-leave-it).
    'null': true
    null_why: NULL = accepts listed price.
    sens: Internal
  - name: currency_id
    type: UUID
    domain: identifier
    desc: Currency of proposed_amount.
    sens: Internal
  - name: applied_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Submit time.
    default: now()
    sens: Internal
  - name: decided_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Accept/reject time.
    'null': true
    null_why: NULL = undecided.
    sens: Internal
  - name: decided_by_app_user_id
    type: UUID
    domain: identifier
    desc: Requester-side decider.
    'null': true
    null_why: NULL = undecided/system expiry.
    sens: Internal
  - name: decision_note
    type: STRING(500)
    domain: free_text
    desc: Note to worker.
    'null': true
    null_why: NULL = none.
    sens: Internal
  - name: withdrawn_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Worker withdrawal time.
    'null': true
    null_why: NULL = not withdrawn.
    sens: Internal
  constraints:
  - name: uq_gig_application_gig_worker_profile_id_gig_request_id
    type: unique
    columns:
    - gig_worker_profile_id
    - gig_request_id
    desc: One application per worker per request.
  - name: uq_gig_application_assignment_target
    type: unique
    columns:
    - id
    - gig_request_id
    - gig_worker_profile_id
    - is_accepted
    desc: Composite FK target for assignment.
  - name: ck_gig_application_amount
    type: check
    expr: proposed_amount IS NULL OR proposed_amount > 0
    desc: Positive.
  - name: ck_gig_application_decision
    type: check
    expr: (NOT is_accepted) OR (decided_at IS NOT NULL AND decided_by_app_user_id IS NOT NULL)
    desc: Accepted implies decided by a user.
  indexes:
  - name: idx_gig_application_gig_request_id_gig_application_status_id_applied_at
    columns:
    - gig_request_id
    - gig_application_status_id
    - applied_at
    desc: Requester review queue.
  - name: idx_gig_application_gig_worker_profile_id_applied_at
    columns:
    - gig_worker_profile_id
    - applied_at DESC
    desc: Worker's applications.
  - name: idx_gig_application_currency_id
    columns:
    - currency_id
    desc: Leading index for FK on currency_id (D-20).
  - name: idx_gig_application_decided_by_app_user_id
    columns:
    - decided_by_app_user_id
    desc: Leading index for FK on decided_by_app_user_id (D-20).
  fks:
  - name: fk_gig_application_gig_request_id
    columns:
    - gig_request_id
    ref: gig_request
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Applications are history.
  - name: fk_gig_application_gig_worker_profile_id
    columns:
    - gig_worker_profile_id
    ref: gig_worker_profile
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Applications are history.
  - name: fk_gig_application_status_flag
    columns:
    - gig_application_status_id
    - is_accepted
    ref: gig_application_status
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Status and flag agree.
    ref_columns:
    - id
    - is_accepted
    index_exempt: low-cardinality lookup; lookup rows are never deleted so no child-side scan is needed
  - name: fk_gig_application_currency_id
    columns:
    - currency_id
    ref: currency
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Master.
  - name: fk_gig_application_decided_by_app_user_id
    columns:
    - decided_by_app_user_id
    ref: app_user
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Decider.
  no_hash_why: Human-paced writes; indexes lead with request/worker UUID so no sequential hotspot.
