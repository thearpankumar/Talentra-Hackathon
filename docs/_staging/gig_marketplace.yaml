- name: gig_rating
  kind: entity
  delete_policy: soft
  volume: medium
  tier: '1'
  milestones:
  - B26
  - B29
  - B32
  - B35
  retention: Soft delete (moderation); anonymise reviewer text on erasure; kept while worker profile exists.
  description: Requester's rating of a completed assignment; one per assignment; only completed assignments (chain FK).
  columns:
  - name: gig_assignment_id
    type: UUID
    domain: identifier
    desc: Rated assignment.
    sens: Internal
  - name: gig_worker_profile_id
    type: UUID
    domain: identifier
    desc: Rated worker (pinned).
    sens: Internal
  - name: organisation_id
    type: UUID
    domain: identifier
    desc: Rating tenant (pinned).
    sens: Internal
  - name: rater_app_user_id
    type: UUID
    domain: identifier
    desc: Rater.
    sens: Internal
  - name: assignment_is_completed
    type: BOOL
    domain: boolean
    desc: Always true; pins assignment to completed.
    default: 'true'
    sens: Internal
  - name: stars
    type: INT2
    domain: quantity
    desc: Overall 1..5.
    sens: Internal
  - name: quality_stars
    type: INT2
    domain: quantity
    desc: Quality 1..5.
    'null': true
    null_why: NULL = not rated.
    sens: Internal
  - name: punctuality_stars
    type: INT2
    domain: quantity
    desc: Punctuality 1..5.
    'null': true
    null_why: NULL = not rated.
    sens: Internal
  - name: communication_stars
    type: INT2
    domain: quantity
    desc: Communication 1..5.
    'null': true
    null_why: NULL = not rated.
    sens: Internal
  - name: review_text
    type: STRING(2000)
    domain: free_text
    desc: Written review.
    'null': true
    null_why: NULL = stars only.
    sens: Personal
    pii: Free text may contain PII; encrypted at rest; moderated before public display.
  - name: is_public
    type: BOOL
    domain: boolean
    desc: Show on worker profile.
    default: 'true'
    sens: Internal
  - name: worker_reply
    type: STRING(1000)
    domain: free_text
    desc: Worker's public reply.
    'null': true
    null_why: NULL = no reply.
    sens: Personal
    pii: Free text; encrypted at rest.
  constraints:
  - name: ck_gig_rating_completed_flag
    type: check
    expr: assignment_is_completed
    desc: Completed only.
  - name: ck_gig_rating_stars
    type: check
    expr: stars BETWEEN 1 AND 5
    desc: 1..5.
  - name: ck_gig_rating_sub_stars
    type: check
    expr: (quality_stars IS NULL OR quality_stars BETWEEN 1 AND 5) AND (punctuality_stars IS NULL OR punctuality_stars BETWEEN 1 AND 5) AND (communication_stars IS NULL OR communication_stars BETWEEN 1
      AND 5)
    desc: 1..5.
  indexes:
  - name: uq_gig_rating_gig_assignment_id
    columns:
    - gig_assignment_id
    desc: One live rating per assignment.
    unique: true
    where: deleted_at IS NULL
  - name: idx_gig_rating_gig_worker_profile_id_created_at
    columns:
    - gig_worker_profile_id
    - created_at DESC
    desc: Profile reviews.
    where: is_public AND deleted_at IS NULL
    storing:
    - stars
  - name: idx_gig_rating_rater_app_user_id
    columns:
    - rater_app_user_id
    desc: Leading index for FK on rater_app_user_id (D-20).
  fks:
  - name: fk_gig_rating_completed_assignment
    columns:
    - gig_assignment_id
    - assignment_is_completed
    ref: gig_assignment
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Only completed assignments can be rated; assignment cannot leave completed while rated.
    ref_columns:
    - id
    - is_completed
  - name: fk_gig_rating_assignment_worker
    columns:
    - gig_assignment_id
    - gig_worker_profile_id
    ref: gig_assignment
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Worker must be the assignment's worker.
    ref_columns:
    - id
    - gig_worker_profile_id
  - name: fk_gig_rating_assignment_tenant
    columns:
    - gig_assignment_id
    - organisation_id
    ref: gig_assignment
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Rater tenant must own the assignment.
    ref_columns:
    - id
    - organisation_id
  - name: fk_gig_rating_rater_app_user_id
    columns:
    - rater_app_user_id
    ref: app_user
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Rater.
