- name: gig_request
  kind: entity
  delete_policy: soft
  volume: high
  tier: '1'
  milestones:
  - B26
  - B29
  - B32
  - B35
  retention: Soft delete; closed requests kept 3 years for dispute/tax; coordinates nulled 1 year after completion; erasure anonymises requester text.
  description: A requester's short-duration gig with window and price (fixed or rate based).
  columns:
  - name: organisation_id
    type: UUID
    domain: identifier
    desc: Requesting organisation (tenant, D-11).
    sens: Internal
  - name: requester_app_user_id
    type: UUID
    domain: identifier
    desc: User who posted.
    sens: Internal
  - name: title
    type: STRING(200)
    domain: free_text
    desc: Title.
    sens: Public
  - name: description
    type: STRING(4000)
    domain: free_text
    desc: Description.
    sens: Internal
  - name: job_category_id
    type: UUID
    domain: identifier
    desc: Shared job category.
    sens: Internal
  - name: gig_work_mode_id
    type: UUID
    domain: enum_ref
    desc: Work mode.
    sens: Internal
  - name: gig_experience_level_id
    type: UUID
    domain: enum_ref
    desc: Wanted level.
    'null': true
    null_why: NULL = any level.
    sens: Internal
  - name: city_id
    type: UUID
    domain: identifier
    desc: Location city.
    'null': true
    null_why: NULL = remote/anywhere.
    sens: Internal
  - name: country_id
    type: UUID
    domain: identifier
    desc: Country.
    sens: Internal
  - name: latitude
    type: DECIMAL(9,6)
    domain: latitude
    desc: Site latitude.
    'null': true
    null_why: NULL = remote or undisclosed.
    sens: Personal
    pii: Site may be a residence; exact point shown only to accepted workers; others see 2 dp.
  - name: longitude
    type: DECIMAL(9,6)
    domain: longitude
    desc: Site longitude.
    'null': true
    null_why: NULL = remote or undisclosed.
    sens: Personal
    pii: As latitude.
  - name: geo_source_id
    type: UUID
    domain: enum_ref
    desc: Coordinate source.
    'null': true
    null_why: NULL when no coordinates.
    sens: Internal
  - name: window_start_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Work window start (15-min grid).
    sens: Internal
  - name: window_end_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Work window end (15-min grid).
    sens: Internal
  - name: gig_price_type_id
    type: UUID
    domain: enum_ref
    desc: Pricing model.
    sens: Internal
  - name: is_rate_based
    type: BOOL
    domain: boolean
    desc: Mirror of price type flag (composite FK).
    default: 'false'
    sens: Internal
  - name: fixed_price
    type: DECIMAL(12,2)
    domain: money
    desc: Fixed price.
    'null': true
    null_why: NULL when rate based.
    sens: Internal
  - name: rate_amount
    type: DECIMAL(12,2)
    domain: money
    desc: Rate per unit.
    'null': true
    null_why: NULL when fixed price.
    sens: Internal
  - name: gig_rate_unit_id
    type: UUID
    domain: enum_ref
    desc: Rate unit.
    'null': true
    null_why: NULL when fixed price.
    sens: Internal
  - name: budget_max
    type: DECIMAL(12,2)
    domain: money
    desc: Requester budget ceiling.
    'null': true
    null_why: NULL = no stated ceiling.
    sens: Internal
  - name: currency_id
    type: UUID
    domain: identifier
    desc: Currency of all money columns.
    sens: Internal
  - name: gig_request_status_id
    type: UUID
    domain: enum_ref
    desc: Lifecycle status.
    sens: Internal
  - name: headcount
    type: INT2
    domain: quantity
    desc: Workers needed.
    default: '1'
    sens: Internal
  - name: accepted_count
    type: INT2
    domain: quantity
    desc: Accepted applications so far (maintained under row lock).
    default: '0'
    sens: Internal
  - name: gig_request_visibility_id
    type: UUID
    domain: enum_ref
    desc: Visibility.
    sens: Internal
  - name: application_deadline_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Applications close.
    'null': true
    null_why: NULL = until filled.
    sens: Internal
  - name: published_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: When opened.
    'null': true
    null_why: NULL = never published.
    sens: Internal
  constraints:
  - name: uq_gig_request_id_organisation_id
    type: unique
    columns:
    - id
    - organisation_id
    desc: Composite FK target proving tenant.
  - name: uq_gig_request_id_currency_id
    type: unique
    columns:
    - id
    - currency_id
    desc: Composite FK target pinning assignment currency to request currency.
  - name: ck_gig_request_window
    type: check
    expr: window_end_at > window_start_at
    desc: End after start.
  - name: ck_gig_request_grid
    type: check
    expr: (extract(epoch FROM window_start_at)::INT8 % 900) = 0 AND (extract(epoch FROM window_end_at)::INT8 % 900) = 0
    desc: 15-min grid.
  - name: ck_gig_request_max_length
    type: check
    expr: window_end_at - window_start_at <= INTERVAL '31 days'
    desc: 'Short-duration gigs: max 31 days (<= 2976 slots).'
  - name: ck_gig_request_price_shape
    type: check
    expr: (is_rate_based AND rate_amount IS NOT NULL AND gig_rate_unit_id IS NOT NULL AND fixed_price IS NULL) OR (NOT is_rate_based AND fixed_price IS NOT NULL AND rate_amount IS NULL AND gig_rate_unit_id
      IS NULL)
    desc: Money/rate fields consistent with price type.
  - name: ck_gig_request_money_range
    type: check
    expr: (fixed_price IS NULL OR fixed_price > 0) AND (rate_amount IS NULL OR rate_amount > 0) AND (budget_max IS NULL OR budget_max > 0)
    desc: Positive amounts.
  - name: ck_gig_request_headcount
    type: check
    expr: headcount BETWEEN 1 AND 500 AND accepted_count BETWEEN 0 AND headcount
    desc: Accepted never exceeds headcount.
  - name: ck_gig_request_latitude
    type: check
    expr: latitude IS NULL OR latitude BETWEEN -90 AND 90
    desc: Range.
  - name: ck_gig_request_longitude
    type: check
    expr: longitude IS NULL OR longitude BETWEEN -180 AND 180
    desc: Range.
  - name: ck_gig_request_geo_pair
    type: check
    expr: (latitude IS NULL) = (longitude IS NULL) AND (latitude IS NULL OR geo_source_id IS NOT NULL)
    desc: Pair with source.
  - name: ck_gig_request_deadline
    type: check
    expr: application_deadline_at IS NULL OR application_deadline_at <= window_end_at
    desc: Deadline within window.
  indexes:
  - name: idx_gig_request_gig_request_status_id_window_start_at
    columns:
    - gig_request_status_id
    - window_start_at
    desc: Open requests by start.
    where: deleted_at IS NULL
    storing:
    - job_category_id
    - city_id
  - name: idx_gig_request_job_category_id_country_id_city_id_window_start_at
    columns:
    - job_category_id
    - country_id
    - city_id
    - window_start_at
    desc: Category + location search.
    where: deleted_at IS NULL
  - name: idx_gig_request_organisation_id_gig_request_status_id
    columns:
    - organisation_id
    - gig_request_status_id
    desc: Requester dashboard.
    where: deleted_at IS NULL
  - name: idx_gig_request_title
    columns:
    - title
    desc: Trigram search (gin_trgm_ops) D-16.
    where: deleted_at IS NULL
    inverted: true
    opclass: gin_trgm_ops
  - name: idx_gig_request_requester_app_user_id
    columns:
    - requester_app_user_id
    desc: Leading index for FK on requester_app_user_id (D-20).
  - name: idx_gig_request_city_id
    columns:
    - city_id
    desc: Leading index for FK on city_id (D-20).
  - name: idx_gig_request_country_id
    columns:
    - country_id
    desc: Leading index for FK on country_id (D-20).
  - name: idx_gig_request_geo_source_id
    columns:
    - geo_source_id
    desc: Leading index for FK on geo_source_id (D-20).
  - name: idx_gig_request_currency_id
