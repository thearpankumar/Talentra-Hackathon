    sens: Internal
  - name: gig_event_process_status_id
    type: UUID
    domain: enum_ref
    desc: Outcome.
    sens: Internal
  - name: processed_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Attempt time.
    default: now()
    sens: Internal
  - name: error_code
    type: STRING(64)
    domain: code
    desc: Error code.
    'null': true
    null_why: NULL = success.
    sens: Internal
  - name: error_detail
    type: STRING(500)
    domain: free_text
    desc: Error detail (no payload copy).
    'null': true
    null_why: NULL = success.
    sens: Internal
  constraints:
  - name: uq_gig_fulfilment_event_attempt_gig_fulfilment_event_id_attempt_no
    type: unique
    columns:
    - gig_fulfilment_event_id
    - attempt_no
    desc: One row per attempt.
  - name: ck_gig_fulfilment_event_attempt_attempt
    type: check
    expr: attempt_no > 0
    desc: Positive.
  indexes:
  - name: idx_gig_fulfilment_event_attempt_processed_at
    columns:
    - processed_at
    desc: Retry/dead-letter scans (hash-sharded).
    hash: true
    bucket_count: 16
  fks:
  - name: fk_gig_fulfilment_event_attempt_gig_fulfilment_event_id
    columns:
    - gig_fulfilment_event_id
    ref: gig_fulfilment_event
    on_delete: CASCADE
    on_update: RESTRICT
    desc: Follows event TTL.
  - name: fk_gig_fulfilment_event_attempt_gig_event_process_status_id
    columns:
    - gig_event_process_status_id
    ref: gig_event_process_status
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Lookup.
    index_exempt: low-cardinality lookup; lookup rows are never deleted so no child-side scan is needed
- name: gig_search_alert
  kind: entity
  delete_policy: soft
  volume: medium
  tier: '1'
  milestones:
  - B26
  - B32
  retention: Soft delete; purged 90 days after profile erasure.
  description: Worker's saved search / job alert for gig requests.
  columns:
  - name: gig_worker_profile_id
    type: UUID
    domain: identifier
    desc: Worker.
    sens: Internal
  - name: alert_name
    type: STRING(100)
    domain: free_text
    desc: Label.
    sens: Internal
  - name: job_category_id
    type: UUID
    domain: identifier
    desc: Category filter.
    'null': true
    null_why: NULL = any.
    sens: Internal
  - name: keyword
    type: STRING(100)
    domain: free_text
    desc: Keyword filter.
    'null': true
    null_why: NULL = none.
    sens: Internal
  - name: city_id
    type: UUID
    domain: identifier
    desc: City filter.
    'null': true
    null_why: NULL = any.
    sens: Internal
  - name: min_rate
    type: DECIMAL(12,2)
    domain: money
    desc: Minimum rate filter.
    'null': true
    null_why: NULL = none.
    sens: Internal
  - name: currency_id
    type: UUID
    domain: identifier
    desc: Currency of min_rate.
    'null': true
    null_why: NULL when no rate filter.
    sens: Internal
  - name: gig_work_mode_id
    type: UUID
    domain: enum_ref
    desc: Mode filter.
    'null': true
    null_why: NULL = any.
    sens: Internal
  - name: gig_alert_frequency_id
    type: UUID
    domain: enum_ref
    desc: Frequency.
    sens: Internal
  - name: is_active
    type: BOOL
    domain: boolean
    desc: Enabled.
    default: 'true'
    sens: Internal
  - name: last_sent_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Last delivery.
    'null': true
    null_why: NULL = never.
    sens: Internal
  constraints:
  - name: ck_gig_search_alert_rate
    type: check
    expr: (min_rate IS NULL OR min_rate >= 0) AND ((min_rate IS NULL) = (currency_id IS NULL))
