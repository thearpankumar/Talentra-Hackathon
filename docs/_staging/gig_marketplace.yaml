- name: gig_timesheet_entry
  kind: event
  delete_policy: soft
  volume: very_high
  tier: '1'
  milestones:
  - B26
  - B29
  - B32
  retention: Soft delete (corrections); coordinates nulled after 180 days; rows kept 7 years.
  description: Check-in/check-out sessions of an assignment (Upwork work diary / TaskRabbit start-stop).
  columns:
  - name: gig_assignment_id
    type: UUID
    domain: identifier
    desc: Assignment.
    sens: Internal
  - name: gig_worker_profile_id
    type: UUID
    domain: identifier
    desc: Worker (pinned).
    sens: Internal
  - name: check_in_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Check-in.
    sens: Internal
  - name: check_out_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Check-out.
    'null': true
    null_why: NULL = session open.
    sens: Internal
  - name: gig_checkin_method_id
    type: UUID
    domain: enum_ref
    desc: Capture method.
    sens: Internal
  - name: check_in_latitude
    type: DECIMAL(9,6)
    domain: latitude
    desc: Check-in latitude.
    'null': true
    null_why: NULL = no location captured.
    sens: Personal
    pii: Precise worker location; access limited to parties of the assignment; nulled after 180 days.
  - name: check_in_longitude
    type: DECIMAL(9,6)
    domain: longitude
    desc: Check-in longitude.
    'null': true
    null_why: NULL = no location captured.
    sens: Personal
    pii: As latitude.
  - name: geo_source_id
    type: UUID
    domain: enum_ref
    desc: Coordinate source.
    'null': true
    null_why: NULL when no coordinates.
    sens: Internal
  - name: break_minutes
    type: INT2
    domain: quantity
    desc: Break minutes.
    default: '0'
    sens: Internal
  - name: is_approved
    type: BOOL
    domain: boolean
    desc: Requester approved the time.
    default: 'false'
    sens: Internal
  - name: approved_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Approval time.
    'null': true
    null_why: NULL = not approved.
    sens: Internal
  - name: external_entry_ref
    type: STRING(128)
    domain: code
    desc: Entry id in the fulfilment system.
    'null': true
    null_why: NULL = entered on platform.
    sens: Internal
  constraints:
  - name: ck_gig_timesheet_entry_range
    type: check
    expr: check_out_at IS NULL OR check_out_at >= check_in_at
    desc: Out not before in.
  - name: ck_gig_timesheet_entry_latitude
    type: check
    expr: check_in_latitude IS NULL OR check_in_latitude BETWEEN -90 AND 90
    desc: Range.
  - name: ck_gig_timesheet_entry_longitude
    type: check
    expr: check_in_longitude IS NULL OR check_in_longitude BETWEEN -180 AND 180
    desc: Range.
  - name: ck_gig_timesheet_entry_geo_pair
    type: check
    expr: (check_in_latitude IS NULL) = (check_in_longitude IS NULL) AND (check_in_latitude IS NULL OR geo_source_id IS NOT NULL)
    desc: Pair with source.
  - name: ck_gig_timesheet_entry_break
    type: check
    expr: break_minutes BETWEEN 0 AND 1440
    desc: Range.
  - name: ck_gig_timesheet_entry_approval
    type: check
    expr: (NOT is_approved) OR approved_at IS NOT NULL
    desc: Approved has a time.
  indexes:
  - name: uq_gig_timesheet_entry_gig_assignment_id
    columns:
    - gig_assignment_id
    desc: One open session per assignment.
    unique: true
    where: check_out_at IS NULL AND deleted_at IS NULL
  - name: idx_gig_timesheet_entry_gig_assignment_id_check_in_at
    columns:
    - gig_assignment_id
    - check_in_at
    desc: Timesheet listing.
    where: deleted_at IS NULL
  - name: uq_gig_timesheet_entry_gig_assignment_id_external_entry_ref
    columns:
    - gig_assignment_id
    - external_entry_ref
    desc: Idempotent import.
    unique: true
    where: external_entry_ref IS NOT NULL AND deleted_at IS NULL
  - name: idx_gig_timesheet_entry_check_in_at
    columns:
    - check_in_at
    desc: Time-ordered scan (hash-sharded).
    hash: true
    bucket_count: 16
  - name: idx_gig_timesheet_entry_geo_source_id
    columns:
    - geo_source_id
    desc: Leading index for FK on geo_source_id (D-20).
  fks:
  - name: fk_gig_timesheet_entry_assignment_worker
    columns:
    - gig_assignment_id
    - gig_worker_profile_id
    ref: gig_assignment
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Worker must equal assignment worker.
    ref_columns:
    - id
    - gig_worker_profile_id
  - name: fk_gig_timesheet_entry_gig_checkin_method_id
    columns:
    - gig_checkin_method_id
    ref: gig_checkin_method
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Lookup.
    index_exempt: low-cardinality lookup; lookup rows are never deleted so no child-side scan is needed
  - name: fk_gig_timesheet_entry_geo_source_id
    columns:
    - geo_source_id
    ref: geo_source
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Lookup.
