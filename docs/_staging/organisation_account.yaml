tables:
- name: organisation
  kind: entity
  delete_policy: soft
  volume: medium
  tier: '1'
  milestones: &id001
  - B25
  - B28
  - B31
  - B34
  - B75
  retention: Company identity is public business data kept while the platform operates; soft-deleted organisations are retained 7 years for invoice, audit and review integrity, then fully anonymised (legal
    name replaced, identifiers erased).
  description: 'Employer / client / consultancy / college organisation (the tenant, D-11). Company-page core: names, type, industry, size band, website, description, verification, HQ.'
  columns:
  - name: legal_name
    type: STRING(300)
    domain: free_text
    desc: Registered legal name.
    sens: Public
  - name: display_name
    type: STRING(200)
    domain: free_text
    desc: Brand / trading name shown on the company page.
    sens: Public
  - name: legal_name_normalised
    type: STRING(300)
    domain: free_text
    desc: Lower-cased legal_name for case-insensitive and trigram search/dedupe.
    sens: Public
    computed: lower(legal_name)
  - name: slug
    type: STRING(120)
    domain: free_text
    desc: URL slug of the public company page (unique among live rows).
    sens: Public
  - name: tagline
    type: STRING(200)
    domain: free_text
    desc: One-line company tagline.
    sens: Public
    'null': true
    null_why: NULL = not provided
  - name: organisation_type_id
    type: UUID
    domain: enum_ref
    desc: Kind of organisation (employer, consultancy, TPO/college, client...).
    sens: Internal
  - name: organisation_status_id
    type: UUID
    domain: enum_ref
    desc: Lifecycle status.
    sens: Internal
  - name: primary_industry_id
    type: UUID
    domain: identifier
    desc: Primary industry (master data).
    sens: Internal
    'null': true
    null_why: NULL = not yet provided
  - name: organisation_size_band_id
    type: UUID
    domain: enum_ref
    desc: Employee-count band shown publicly.
    sens: Internal
    'null': true
    null_why: NULL = unknown; not asked yet
  - name: website_url
    type: STRING(500)
    domain: url
    desc: Company website.
    sens: Public
    'null': true
    null_why: NULL = no website provided
  - name: description
    type: STRING
    domain: long_text
    desc: About-us text, written once in description_language_id.
    sens: Public
    'null': true
    null_why: NULL = not provided
    unbounded_why: Company-authored marketing text of unpredictable length
  - name: description_language_id
    type: UUID
    domain: identifier
    desc: Language of the description (Rule 7).
    sens: Internal
    'null': true
    null_why: NULL = language unknown
  - name: founded_year
    type: INT2
    domain: quantity
    desc: Year the company was founded.
    sens: Internal
    'null': true
    null_why: NULL = unknown
  - name: verification_status_id
    type: UUID
    domain: enum_ref
    desc: Current aggregate verification outcome (derived from organisation_verification; denormalised for filters).
    sens: Internal
  - name: verified_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: When the organisation last reached a verified state.
    sens: Internal
    'null': true
    null_why: NULL = never verified
  - name: claimed_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: When a representative claimed the page.
    sens: Internal
    'null': true
    null_why: NULL = unclaimed (page seeded from registry / import)
  - name: visibility_level_id
    type: UUID
    domain: enum_ref
    desc: Who can see the company page.
    sens: Internal
  - name: hq_country_id
    type: UUID
    domain: identifier
    desc: Denormalised HQ country (from the headquarter location) for search.
    sens: Internal
    'null': true
    null_why: NULL = no HQ location recorded yet
  - name: hq_city_id
    type: UUID
    domain: identifier
    desc: Denormalised HQ city (from the headquarter location).
    sens: Internal
    'null': true
    null_why: NULL = no HQ location recorded yet
  - name: logo_object_ref
    type: STRING(300)
    domain: free_text
    desc: Object-storage key of the current logo (no FK; outside DB).
    sens: Public
    'null': true
    null_why: NULL = no logo uploaded
  - name: legacy_source_ref
    type: STRING(100)
    domain: free_text
    desc: Id of this company in the legacy system (migration/sync key).
    sens: Internal
    'null': true
    null_why: NULL = created natively, not migrated
  constraints:
  - name: ck_organisation_slug_format
    type: check
    expr: slug ~ '^[a-z0-9]+(-[a-z0-9]+)*$'
    desc: Slug is lowercase kebab-case.
  - name: ck_organisation_founded_year_range
    type: check
    expr: founded_year IS NULL OR founded_year BETWEEN 1600 AND 2100
    desc: Plausible year; 'not in the future' is a job check (needs now()).
  indexes:
  - name: uq_organisation_slug
    columns:
    - slug
    desc: Public page lookup by slug.
    unique: true
    where: deleted_at IS NULL
  - name: uq_organisation_legacy_source_ref
    columns:
    - legacy_source_ref
    desc: Idempotent legacy sync key.
    unique: true
    where: legacy_source_ref IS NOT NULL AND deleted_at IS NULL
  - name: idx_organisation_legal_name_normalised
    columns:
    - legal_name_normalised
    desc: Trigram GIN (gin_trgm_ops) on normalised name for type-ahead and duplicate detection (D-16).
    inverted: true
    opclass: gin_trgm_ops
  - name: idx_organisation_organisation_type_id_organisation_status_id
    columns:
    - organisation_type_id
    - organisation_status_id
    - primary_industry_id
    desc: Directory browse by type/status/industry.
    where: deleted_at IS NULL
  - name: idx_organisation_hq_country_id_hq_city_id
    columns:
    - hq_country_id
    - hq_city_id
    desc: Employers by city for search facets.
    where: deleted_at IS NULL AND organisation_status_id IS NOT NULL
  - name: idx_organisation_organisation_status_id
    columns:
    - organisation_status_id
    desc: Leading index for FK fk_organisation_organisation_status_id (join/cascade checks).
  - name: idx_organisation_primary_industry_id
    columns:
    - primary_industry_id
    desc: Leading index for FK fk_organisation_primary_industry_id (join/cascade checks).
  - name: idx_organisation_organisation_size_band_id
    columns:
    - organisation_size_band_id
    desc: Leading index for FK fk_organisation_organisation_size_band_id (join/cascade checks).
  - name: idx_organisation_description_language_id
    columns:
    - description_language_id
    desc: Leading index for FK fk_organisation_description_language_id (join/cascade checks).
  - name: idx_organisation_verification_status_id
    columns:
    - verification_status_id
    desc: Leading index for FK fk_organisation_verification_status_id (join/cascade checks).
  - name: idx_organisation_visibility_level_id
    columns:
    - visibility_level_id
    desc: Leading index for FK fk_organisation_visibility_level_id (join/cascade checks).
  - name: idx_organisation_hq_city_id
    columns:
    - hq_city_id
    desc: Leading index for FK fk_organisation_hq_city_id (join/cascade checks).
  fks:
  - name: fk_organisation_organisation_type_id
    columns:
    - organisation_type_id
    ref: organisation_type
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: lookup values are retired not deleted
  - name: fk_organisation_organisation_status_id
    columns:
    - organisation_status_id
    ref: organisation_status
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: lookup values are retired not deleted
  - name: fk_organisation_primary_industry_id
    columns:
    - primary_industry_id
    ref: industry
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: master data referenced by live rows
  - name: fk_organisation_organisation_size_band_id
    columns:
    - organisation_size_band_id
    ref: organisation_size_band
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: lookup
  - name: fk_organisation_description_language_id
    columns:
    - description_language_id
    ref: language
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: master data
  - name: fk_organisation_verification_status_id
    columns:
    - verification_status_id
    ref: verification_status
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: lookup
  - name: fk_organisation_visibility_level_id
    columns:
