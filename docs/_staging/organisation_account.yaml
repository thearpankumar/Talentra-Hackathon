- name: account_admin
  kind: link
  delete_policy: hard
  volume: low
  tier: '1'
  milestones: *id001
  retention: Admin grant history kept 8 years after revocation for access audit; app_user erasure anonymises user reference via app_user, row retained.
  description: Effective-dated assignment of platform users as administrators of an account (Account Admin actor). At least one active admin is guaranteed.
  columns:
  - name: account_id
    type: UUID
    domain: identifier
    desc: Administered account.
    sens: Internal
  - name: admin_app_user_id
    type: UUID
    domain: identifier
    desc: Administrator (app_user).
    sens: Personal
    pii: Identifies a person; access-controlled and audited
  - name: account_admin_level_id
    type: UUID
    domain: enum_ref
    desc: Responsibility level.
    sens: Internal
  - name: is_primary_contact
    type: BOOL
    domain: boolean
    desc: True for the single primary contact of the account.
    sens: Internal
    default: 'false'
  - name: effective_from
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Grant start.
    sens: Internal
    default: now()
  - name: effective_to
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Grant end.
    sens: Internal
    'null': true
