    desc: history must survive
  - name: fk_account_admin_admin_app_user_id
    columns:
    - admin_app_user_id
    ref: app_user
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: user is soft-deleted; grants are history
  - name: fk_account_admin_account_admin_level_id
    columns:
    - account_admin_level_id
    ref: account_admin_level
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: lookup
- name: recruiter_organisation_mapping
  kind: link
  delete_policy: hard
  volume: medium
  tier: '1'
  milestones: *id001
  retention: 'Mapping history is access evidence: kept 7 years after effective_to, never updated except to close; rows never deleted before purge; recruiter erasure keeps the row (user reference anonymised
    in app_user).'
  description: OWNING TABLE for mapped recruiters. Effective-dated recruiter -> organisation mapping; non-overlap guaranteed by P1 chain FK + P3 single open row. Grants recruiter access to the organisation's
    job requirements via vw_recruiter_job_requirement.
  columns:
  - name: recruiter_app_user_id
    type: UUID
    domain: identifier
    desc: Recruiter user.
    sens: Personal
    pii: Identifies a person; access-controlled and audited
  - name: organisation_id
    type: UUID
    domain: identifier
    desc: Company the recruiter may act for.
    sens: Internal
  - name: mapping_scope_id
    type: UUID
    domain: enum_ref
    desc: Whether access includes descendant organisations.
    sens: Internal
  - name: sequence_no
    type: INT4
    domain: quantity
    desc: 1-based position in the recruiter+organisation chain (P1).
    sens: Internal
  - name: prior_recruiter_organisation_mapping_id
    type: UUID
    domain: identifier
    desc: Immediately preceding mapping of the same recruiter and organisation (P1).
    sens: Internal
    'null': true
    null_why: NULL = first mapping in the chain
  - name: prior_ended_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Copy of the predecessor's effective_to (P1 composite FK target).
    sens: Internal
    'null': true
    null_why: NULL = first mapping in the chain
  - name: effective_from
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Start of access (inclusive).
    sens: Internal
    default: now()
  - name: effective_to
    type: TIMESTAMPTZ
    domain: timestamp
    desc: End of access (exclusive).
    sens: Internal
    'null': true
    null_why: NULL = open-ended/ongoing
  - name: mapping_end_reason_id
    type: UUID
    domain: enum_ref
    desc: Why the mapping ended.
    sens: Internal
    'null': true
    null_why: NULL = mapping still open
  - name: approved_by_app_user_id
    type: UUID
    domain: identifier
    desc: Admin who approved the mapping.
    sens: Personal
    'null': true
    null_why: NULL = auto-approved via invitation acceptance
    pii: Identifies a person; audited
  constraints:
  - name: uq_recruiter_organisation_mapping_chain_target
    type: unique
    columns:
    - id
    - recruiter_app_user_id
    - organisation_id
    - effective_to
    desc: Referenced by the P1 chain composite FK (D-19).
  - name: uq_recruiter_organisation_mapping_prior_recruiter_organisation_mapping_id
    type: unique
    columns:
    - prior_recruiter_organisation_mapping_id
    desc: Each mapping has at most one successor (NULLs distinct).
  - name: uq_recruiter_organisation_mapping_recruiter_app_user_id_organisation_id_sequence_no
    type: unique
    columns:
    - recruiter_app_user_id
    - organisation_id
    - sequence_no
    desc: Chain position unique.
  - name: ck_recruiter_organisation_mapping_effective_range
    type: check
    expr: effective_to IS NULL OR effective_to > effective_from
    desc: End after start.
  - name: ck_recruiter_organisation_mapping_chain_nulls
    type: check
    expr: (prior_recruiter_organisation_mapping_id IS NULL) = (prior_ended_at IS NULL) AND (prior_recruiter_organisation_mapping_id IS NULL) = (sequence_no = 1)
    desc: First row has no predecessor; others have both.
  - name: ck_recruiter_organisation_mapping_starts_after_prior
    type: check
    expr: prior_ended_at IS NULL OR effective_from >= prior_ended_at
    desc: No overlap with predecessor.
  - name: ck_recruiter_organisation_mapping_end_reason_pair
    type: check
    expr: (effective_to IS NULL) = (mapping_end_reason_id IS NULL)
    desc: Closed rows carry a reason; open rows do not.
  indexes:
  - name: uq_recruiter_organisation_mapping_recruiter_app_user_id_organisation_id_open
    columns:
    - recruiter_app_user_id
    - organisation_id
    desc: 'P3: at most one open mapping per recruiter and organisation.'
    unique: true
    where: effective_to IS NULL
  - name: uq_recruiter_organisation_mapping_recruiter_app_user_id_organisation_id_first
    columns:
    - recruiter_app_user_id
    - organisation_id
    desc: 'P1: exactly one chain head per recruiter and organisation.'
    unique: true
    where: prior_recruiter_organisation_mapping_id IS NULL
  - name: idx_recruiter_organisation_mapping_organisation_id_recruiter_app_user_id
    columns:
    - organisation_id
    - recruiter_app_user_id
    desc: Who is mapped to a company (open rows); hot path of vw_recruiter_job_requirement.
    where: effective_to IS NULL
    storing:
    - mapping_scope_id
    - effective_from
  - name: idx_recruiter_organisation_mapping_recruiter_app_user_id_effective_from
    columns:
    - recruiter_app_user_id
    - effective_from DESC
    desc: Recruiter's mapping history.
  - name: idx_recruiter_organisation_mapping_mapping_scope_id
    columns:
    - mapping_scope_id
    desc: Leading index for FK fk_recruiter_organisation_mapping_mapping_scope_id (join/cascade checks).
  - name: idx_recruiter_organisation_mapping_mapping_end_reason_id
    columns:
    - mapping_end_reason_id
    desc: Leading index for FK fk_recruiter_organisation_mapping_mapping_end_reason_id (join/cascade checks).
  - name: idx_recruiter_organisation_mapping_approved_by_app_user_id
    columns:
    - approved_by_app_user_id
    desc: Leading index for FK fk_recruiter_organisation_mapping_approved_by_app_user_id (join/cascade checks).
  fks:
  - name: fk_recruiter_organisation_mapping_recruiter_app_user_id
    columns:
    - recruiter_app_user_id
    ref: app_user
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: history must survive
  - name: fk_recruiter_organisation_mapping_organisation_id
    columns:
    - organisation_id
    ref: organisation
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: history must survive
  - name: fk_recruiter_organisation_mapping_mapping_scope_id
    columns:
    - mapping_scope_id
    ref: mapping_scope
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: lookup
  - name: fk_recruiter_organisation_mapping_mapping_end_reason_id
    columns:
    - mapping_end_reason_id
    ref: mapping_end_reason
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: lookup
  - name: fk_recruiter_organisation_mapping_approved_by_app_user_id
    columns:
    - approved_by_app_user_id
    ref: app_user
    on_delete: SET NULL
    on_update: RESTRICT
    desc: approver erasure keeps mapping
  - name: fk_recruiter_organisation_mapping_prior_chain
    columns:
    - prior_recruiter_organisation_mapping_id
    - recruiter_app_user_id
    - organisation_id
    - prior_ended_at
    ref: recruiter_organisation_mapping
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'P1 chain: successor points at its predecessor''s (id, recruiter, organisation, effective_to); ON UPDATE RESTRICT freezes the predecessor''s end once a successor exists.'
    ref_columns:
    - id
    - recruiter_app_user_id
    - organisation_id
    - effective_to
- name: organisation_hierarchy
  kind: entity
  delete_policy: hard
  volume: medium
  tier: '1'
  milestones: *id001
  retention: Current-parent edge per organisation; history is in organisation_hierarchy_change (append-only, 7 years). Row deleted only when the organisation is purged.
  description: 'Adjacency + materialised path + level for the corporate tree (subsidiary/division/branch). Exactly one row per organisation (roots have no parent). Cycles are impossible: child level = parent
    level + 1 enforced by a self composite FK.'
  columns:
  - name: child_organisation_id
    type: UUID
    domain: identifier
    desc: The organisation placed in the tree.
    sens: Internal
  - name: parent_organisation_id
    type: UUID
    domain: identifier
    desc: Its parent.
    sens: Internal
    'null': true
    null_why: NULL = root (ultimate parent)
  - name: root_organisation_id
    type: UUID
    domain: identifier
    desc: Ultimate parent of the tree (D&B 'global ultimate'); equals child for a root.
    sens: Internal
  - name: hierarchy_level
    type: INT2
    domain: quantity
    desc: Depth from the root (root = 0).
    sens: Internal
  - name: parent_level
    type: INT2
    domain: quantity
    desc: Parent's hierarchy_level (FK target for the level chain).
    sens: Internal
    'null': true
    null_why: NULL = root has no parent
  - name: hierarchy_relationship_type_id
    type: UUID
    domain: enum_ref
    desc: Relationship to parent.
    sens: Internal
    'null': true
    null_why: NULL = root has no relationship
  - name: ownership_percent
    type: DECIMAL(5,2)
    domain: percentage
    desc: Parent's ownership share.
    sens: Internal
    'null': true
    null_why: NULL = unknown or not applicable (division/branch)
  - name: ancestor_path
    type: STRING(400)
    domain: free_text
    desc: Materialised path of ancestor ids '/root/.../parent/' for subtree prefix queries.
    sens: Internal
  - name: effective_from
    type: TIMESTAMPTZ
    domain: timestamp
    desc: When this parent link took effect.
    sens: Internal
    default: now()
  constraints:
  - name: uq_organisation_hierarchy_child_organisation_id
    type: unique
    columns:
    - child_organisation_id
    desc: One current parent per organisation (tree, not DAG).
  - name: uq_organisation_hierarchy_child_organisation_id_hierarchy_level
    type: unique
    columns:
    - child_organisation_id
    - hierarchy_level
    desc: Referenced by the level-chain FK.
  - name: ck_organisation_hierarchy_level_range
    type: check
    expr: hierarchy_level BETWEEN 0 AND 7
    desc: Depth cap 8 levels (bounds closure size and recursion).
  - name: ck_organisation_hierarchy_no_self_parent
    type: check
    expr: parent_organisation_id IS NULL OR parent_organisation_id <> child_organisation_id
    desc: No self loop.
  - name: ck_organisation_hierarchy_root_or_child
    type: check
    expr: (parent_organisation_id IS NULL) = (parent_level IS NULL) AND (parent_organisation_id IS NULL) = (hierarchy_level = 0)
    desc: Root = level 0 = no parent.
  - name: ck_organisation_hierarchy_level_increments
    type: check
    expr: parent_level IS NULL OR hierarchy_level = parent_level + 1
    desc: Strictly increasing level => acyclic.
  - name: ck_organisation_hierarchy_root_when_root
    type: check
    expr: parent_organisation_id IS NOT NULL OR root_organisation_id = child_organisation_id
    desc: A root is its own ultimate parent.
  - name: ck_organisation_hierarchy_ownership_range
    type: check
    expr: ownership_percent IS NULL OR ownership_percent BETWEEN 0 AND 100
    desc: Percentage range.
  indexes:
  - name: idx_organisation_hierarchy_parent_organisation_id_child_organisation_id
    columns:
    - parent_organisation_id
    - child_organisation_id
    desc: Direct children of a node.
  - name: idx_organisation_hierarchy_root_organisation_id_hierarchy_level
    columns:
    - root_organisation_id
    - hierarchy_level
    desc: Whole tree by level.
  - name: idx_organisation_hierarchy_ancestor_path
    columns:
    - ancestor_path
    desc: Prefix scan for subtree (STRING_PREFIX LIKE 'path%'); use varchar_pattern_ops-style prefix on CRDB by range scan.
  - name: idx_organisation_hierarchy_hierarchy_relationship_type_id
    columns:
    - hierarchy_relationship_type_id
    desc: Leading index for FK fk_organisation_hierarchy_hierarchy_relationship_type_id (join/cascade checks).
  fks:
  - name: fk_organisation_hierarchy_child_organisation_id
    columns:
    - child_organisation_id
    ref: organisation
    on_delete: CASCADE
    on_update: RESTRICT
    desc: edge is meaningless without the organisation row
  - name: fk_organisation_hierarchy_parent_organisation_id
    columns:
    - parent_organisation_id
    ref: organisation
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: a parent with children cannot be purged
  - name: fk_organisation_hierarchy_root_organisation_id
    columns:
    - root_organisation_id
    ref: organisation
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: root with descendants cannot be purged
  - name: fk_organisation_hierarchy_hierarchy_relationship_type_id
    columns:
    - hierarchy_relationship_type_id
    ref: hierarchy_relationship_type
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: lookup
  - name: fk_organisation_hierarchy_parent_level_chain
    columns:
    - parent_organisation_id
    - parent_level
    ref: organisation_hierarchy
    on_delete: RESTRICT
    on_update: NO ACTION
    desc: 'Level-chain: (parent, parent_level) must equal an existing node''s (child, hierarchy_level); with CHECK level = parent_level+1 this makes cycles unrepresentable.'
    ref_columns:
    - child_organisation_id
    - hierarchy_level
- name: organisation_hierarchy_closure
  kind: bridge
  delete_policy: hard
  volume: high
  tier: '1'
  milestones: *id001
  retention: 'Derived data: fully rebuildable from organisation_hierarchy; rows removed with the organisation; no retention beyond that.'
  description: Closure (ancestor, descendant, depth) of organisation_hierarchy for O(1) subtree/ancestor queries and for recruiter mapping scope with_descendants. Written in the same txn as the edge.
  no_hash_why: Keyed by random UUID pairs; no sequential access pattern.
  columns:
  - name: ancestor_organisation_id
    type: UUID
    domain: identifier
    desc: Ancestor (depth 0 = self).
    sens: Internal
  - name: descendant_organisation_id
    type: UUID
    domain: identifier
    desc: Descendant.
    sens: Internal
  - name: depth
    type: INT2
    domain: quantity
    desc: Distance in edges (0 = self).
    sens: Internal
  constraints:
  - name: uq_organisation_hierarchy_closure_ancestor_organisation_id_descendant_organisation_id
    type: unique
    columns:
    - ancestor_organisation_id
    - descendant_organisation_id
    desc: One row per pair.
  - name: ck_organisation_hierarchy_closure_depth_range
    type: check
    expr: depth BETWEEN 0 AND 7
    desc: Matches the hierarchy depth cap.
  - name: ck_organisation_hierarchy_closure_self_iff_zero
    type: check
    expr: (depth = 0) = (ancestor_organisation_id = descendant_organisation_id)
    desc: Self rows only at depth 0; any cycle would need a self row at depth>0.
  indexes:
  - name: idx_organisation_hierarchy_closure_descendant_organisation_id_ancestor_organisation_id
    columns:
    - descendant_organisation_id
    - ancestor_organisation_id
    desc: Ancestors of a node.
    storing:
    - depth
  fks:
  - name: fk_organisation_hierarchy_closure_ancestor_organisation_id
    columns:
    - ancestor_organisation_id
    ref: organisation
    on_delete: CASCADE
    on_update: RESTRICT
    desc: derived row
  - name: fk_organisation_hierarchy_closure_descendant_organisation_id
    columns:
    - descendant_organisation_id
    ref: organisation
    on_delete: CASCADE
    on_update: RESTRICT
    desc: derived row
- name: organisation_hierarchy_change
  kind: event
  delete_policy: append_only
  volume: low
  tier: '1'
  milestones: *id001
  retention: Hierarchy history is a legal/audit record; kept 7 years then archived; INSERT-only.
  description: Append-only log of re-parenting events (who moved which organisation from which parent to which).
  columns:
  - name: child_organisation_id
    type: UUID
    domain: identifier
    desc: Organisation moved.
    sens: Internal
  - name: from_parent_organisation_id
    type: UUID
    domain: identifier
    desc: Parent before.
    sens: Internal
    'null': true
    null_why: NULL = was a root
  - name: to_parent_organisation_id
    type: UUID
    domain: identifier
    desc: Parent after.
    sens: Internal
    'null': true
    null_why: NULL = became a root
  - name: effective_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: When the change took effect.
    sens: Internal
    default: now()
  - name: reason
    type: STRING(300)
    domain: free_text
    desc: Business reason (acquisition, restructure).
    sens: Internal
    'null': true
    null_why: NULL = not stated
  - name: change_batch_ref
    type: STRING(80)
    domain: free_text
    desc: Id of the bulk/import batch that caused the change.
    sens: Internal
    'null': true
    null_why: NULL = manual single change
  constraints: []
  indexes:
  - name: idx_organisation_hierarchy_change_child_organisation_id_effective_at
    columns:
    - child_organisation_id
    - effective_at DESC
    desc: Timeline of an organisation.
  - name: idx_organisation_hierarchy_change_from_parent_organisation_id
    columns:
    - from_parent_organisation_id
    desc: Leading index for FK fk_organisation_hierarchy_change_from_parent_organisation_id (join/cascade checks).
  - name: idx_organisation_hierarchy_change_to_parent_organisation_id
    columns:
    - to_parent_organisation_id
    desc: Leading index for FK fk_organisation_hierarchy_change_to_parent_organisation_id (join/cascade checks).
  fks:
  - name: fk_organisation_hierarchy_change_child_organisation_id
    columns:
    - child_organisation_id
    ref: organisation
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: history must survive
  - name: fk_organisation_hierarchy_change_from_parent_organisation_id
    columns:
    - from_parent_organisation_id
    ref: organisation
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: history must survive
  - name: fk_organisation_hierarchy_change_to_parent_organisation_id
    columns:
    - to_parent_organisation_id
    ref: organisation
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: history must survive
- name: organisation_identifier
  kind: entity
  delete_policy: soft
  volume: medium
  tier: '1'
  milestones: *id001
  retention: Kept while the organisation exists; after deletion ciphertext and hash are crypto-shredded (key version retired) 7 years after deleted_at.
  description: Tax and registration identifiers (GSTIN, PAN, CIN, EIN, VAT...) by country and type. Stored as ciphertext + HMAC blind index + masked display; never in clear.
  columns:
  - name: organisation_id
    type: UUID
    domain: identifier
    desc: Owning organisation.
    sens: Internal
  - name: country_id
    type: UUID
    domain: identifier
    desc: Issuing country.
    sens: Internal
  - name: tax_id_type_id
    type: UUID
    domain: identifier
    desc: Identifier type for the country (master data tax_id_type; carries the validation regex/checksum rule).
    sens: Internal
  - name: value_encrypted
    type: BYTES
    domain: encrypted
    desc: AES-256-GCM envelope-encrypted normalised identifier (D-10).
    sens: Sensitive
    pii: App-layer envelope encryption (KMS data key per tenant); decrypt only for verification calls and authorised finance/compliance roles, audited
  - name: value_lookup_hash
    type: BYTES
    domain: token
    desc: HMAC-SHA256 blind index of the normalised value (upper-case, separators stripped) for equality lookup and uniqueness.
    sens: Sensitive
    pii: Keyed HMAC (pepper in KMS), not reversible; used only for equality search
  - name: masked_value
    type: STRING(32)
    domain: tax_id
    desc: Display form with all but last 4 characters masked, e.g. XXXXXXXXXX1Z5.
    sens: Sensitive
    pii: Masked at write time; shown to employer admins and staff; full value never returned by the API
  - name: key_version
    type: INT2
    domain: quantity
    desc: Encryption key version used (rotation support).
    sens: Internal
    default: '1'
  - name: verification_status_id
    type: UUID
    domain: enum_ref
    desc: Latest verification outcome of this identifier.
    sens: Internal
  - name: is_primary
    type: BOOL
    domain: boolean
    desc: Primary identifier for invoicing in its country.
    sens: Internal
    default: 'false'
  - name: issued_date
    type: DATE
    domain: date
    desc: Registration / issue date.
    sens: Internal
    'null': true
    null_why: NULL = unknown
  - name: valid_until_date
    type: DATE
    domain: date
    desc: Validity end (licences, e.g. GST suspension).
    sens: Internal
    'null': true
