    null_why: NULL = phone-only contact
    pii: Access-controlled+audited; masked in lists; anonymised on erasure
  - name: phone
    type: STRING(16)
    domain: phone
    desc: E.164 business phone.
    sens: Personal
    'null': true
    null_why: NULL = email-only contact
    pii: Access-controlled+audited; masked in lists; anonymised on erasure
  - name: phone_country_id
    type: UUID
    domain: identifier
    desc: Country of the phone number.
    sens: Internal
    'null': true
