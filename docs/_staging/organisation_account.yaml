    desc: Leading index for FK fk_organisation_contact_app_user_id (join/cascade checks).
  - name: idx_organisation_contact_visibility_level_id
    columns:
    - visibility_level_id
    desc: Leading index for FK fk_organisation_contact_visibility_level_id (join/cascade checks).
  fks:
