  - name: job_title
    type: STRING(150)
    domain: free_text
    desc: Job title.
    sens: Personal
    'null': true
    null_why: NULL = not provided
    pii: Access-controlled; anonymised on erasure
  - name: email
    type: STRING(254)
    domain: email
    desc: Business email.
    sens: Personal
