- name: organisation_merge
  kind: entity
  delete_policy: hard
  volume: low
  tier: '1'
  milestones:
  - B25
  - B28
  - B31
  - B34
  retention: Merge records kept permanently (re-pointing evidence); never deleted.
  description: 'Duplicate-organisation merge workflow: survivor absorbs merged; a job re-points children (jobs, mappings, accounts) and writes aliases; reversible via stored re-point map.'
  columns:
  - name: survivor_organisation_id
    type: UUID
    domain: identifier
    desc: Organisation kept.
    sens: Internal
  - name: merged_organisation_id
    type: UUID
    domain: identifier
    desc: Duplicate absorbed.
    sens: Internal
  - name: merge_status_id
    type: UUID
    domain: enum_ref
    desc: Workflow state.
    sens: Internal
  - name: match_score
    type: DECIMAL(5,2)
    domain: percentage
    desc: Duplicate-detection confidence (0-100).
    sens: Internal
    'null': true
    null_why: NULL = manually proposed
  - name: match_basis
    type: JSONB
    domain: json
    desc: Evidence {matching identifier, domain, name similarity}.
    sens: Internal
    'null': true
    null_why: NULL = manual proposal
  - name: reason
    type: STRING(300)
    domain: free_text
    desc: Why merged.
    sens: Internal
    'null': true
    null_why: NULL = not stated
  - name: approved_by_app_user_id
    type: UUID
    domain: identifier
    desc: Approving admin.
    sens: Personal
    'null': true
    null_why: NULL = not yet approved
    pii: Staff identity; audited
  - name: approved_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Approval time.
    sens: Internal
    'null': true
    null_why: NULL = not yet approved
  - name: executed_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Execution time.
    sens: Internal
    'null': true
    null_why: NULL = not executed
  - name: rolled_back_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Rollback time.
    sens: Internal
    'null': true
    null_why: NULL = not rolled back
  - name: repoint_map
    type: JSONB
    domain: json
    desc: Table -> row ids re-pointed (enables rollback).
    sens: Internal
    'null': true
    null_why: NULL = not executed yet
  constraints:
  - name: ck_organisation_merge_distinct_organisations
    type: check
    expr: survivor_organisation_id <> merged_organisation_id
    desc: Cannot merge into itself.
  - name: ck_organisation_merge_match_score_range
    type: check
    expr: match_score IS NULL OR match_score BETWEEN 0 AND 100
    desc: Percentage range.
  - name: ck_organisation_merge_execution_order
    type: check
    expr: executed_at IS NULL OR approved_at IS NOT NULL
    desc: Only approved merges execute.
  - name: uq_organisation_merge_merged_organisation_id_survivor_organisation_id
    type: unique
    columns:
    - merged_organisation_id
    - survivor_organisation_id
    desc: A pair is proposed once.
  indexes:
  - name: uq_organisation_merge_merged_organisation_id
    columns:
    - merged_organisation_id
    desc: An organisation is absorbed by at most one live merge.
    unique: true
    where: executed_at IS NOT NULL AND rolled_back_at IS NULL
  - name: idx_organisation_merge_survivor_organisation_id
    columns:
    - survivor_organisation_id
    - merge_status_id
    desc: Merges into a survivor.
  - name: idx_organisation_merge_merge_status_id
