    desc: master data
- name: organisation_location
  kind: entity
  delete_policy: soft
  volume: medium
  tier: '1'
  milestones: *id001
  retention: Active rows kept while the organisation exists; soft-deleted rows purged 24 months after deleted_at; erasure requests anonymise Personal columns in place.
  description: Office / site / campus of an organisation with structured address, optional coordinates and a single headquarters flag.
  columns:
  - name: organisation_id
    type: UUID
    domain: identifier
    desc: Owning organisation (tenant).
    sens: Internal
  - name: location_label
    type: STRING(120)
    domain: free_text
    desc: Display label, e.g. 'Bengaluru - Whitefield'.
    sens: Public
  - name: address_type_id
    type: UUID
    domain: enum_ref
    desc: Kind of address (registered, office, campus...).
    sens: Internal
  - name: is_headquarters
    type: BOOL
    domain: boolean
    desc: True for the single headquarters site.
    sens: Internal
    default: 'false'
  - name: address_line1
    type: STRING(200)
    domain: free_text
    desc: Street address line 1 (business address).
    sens: Public
  - name: address_line2
    type: STRING(200)
    domain: free_text
    desc: Street address line 2.
    sens: Public
    'null': true
    null_why: NULL = not applicable / no second line
  - name: locality
    type: STRING(120)
    domain: free_text
    desc: Locality / neighbourhood / district.
    sens: Public
    'null': true
    null_why: NULL = not provided
  - name: city_id
    type: UUID
    domain: identifier
    desc: City.
    sens: Internal
  - name: state_region_id
    type: UUID
    domain: identifier
    desc: State or region.
    sens: Internal
    'null': true
    null_why: NULL = country without state level / unknown
  - name: country_id
    type: UUID
    domain: identifier
    desc: Country.
    sens: Internal
  - name: postal_code
    type: STRING(20)
    domain: free_text
    desc: Postal / PIN code.
    sens: Public
    'null': true
    null_why: NULL = not provided
  - name: latitude
    type: DECIMAL(9,6)
    domain: latitude
    desc: WGS84 latitude, 6 decimals (~0.1 m).
    sens: Public
    'null': true
    null_why: NULL = not geocoded
  - name: longitude
    type: DECIMAL(9,6)
    domain: longitude
    desc: WGS84 longitude, 6 decimals.
    sens: Public
    'null': true
    null_why: NULL = not geocoded
  - name: geo_source_id
    type: UUID
    domain: enum_ref
    desc: Source of the coordinates (geocoder / manual / device).
    sens: Internal
    'null': true
    null_why: NULL = no coordinates stored
  - name: place_ref
    type: STRING(120)
    domain: free_text
    desc: Mapping-provider place id (reference only; provider owns the data).
    sens: Internal
    'null': true
    null_why: NULL = not linked to a provider place
  - name: time_zone
    type: STRING(64)
    domain: time_zone
    desc: IANA time zone of the site, used for display.
    sens: Public
    'null': true
    null_why: NULL = inherit from city
  - name: headcount
    type: INT4
    domain: quantity
    desc: Approximate employees at the site.
    sens: Internal
    'null': true
    null_why: NULL = unknown
  - name: opened_date
    type: DATE
    domain: date
    desc: Date the site opened.
    sens: Internal
    'null': true
    null_why: NULL = unknown
  - name: closed_date
    type: DATE
    domain: date
    desc: Date the site closed.
    sens: Internal
    'null': true
    null_why: NULL = site still operating
  constraints:
  - name: uq_organisation_location_organisation_id_id
    type: unique
    columns:
    - organisation_id
    - id
    desc: Target for same-tenant composite FKs from children (D-11/D-19).
  - name: ck_organisation_location_latitude_range
    type: check
    expr: latitude IS NULL OR latitude BETWEEN -90 AND 90
    desc: Valid latitude.
  - name: ck_organisation_location_longitude_range
    type: check
    expr: longitude IS NULL OR longitude BETWEEN -180 AND 180
    desc: Valid longitude.
  - name: ck_organisation_location_coordinates_pair
    type: check
    expr: (latitude IS NULL) = (longitude IS NULL) AND (latitude IS NULL OR geo_source_id IS NOT NULL)
    desc: Both or none; stated source when present.
  - name: ck_organisation_location_closed_after_opened
    type: check
    expr: closed_date IS NULL OR opened_date IS NULL OR closed_date >= opened_date
    desc: Closed not before opened.
  indexes:
  - name: uq_organisation_location_organisation_id
    columns:
    - organisation_id
    desc: At most one live headquarters per organisation (P3).
    unique: true
    where: is_headquarters AND deleted_at IS NULL
  - name: idx_organisation_location_city_id_organisation_id
    columns:
    - city_id
    - organisation_id
    desc: Find employers with a site in a city.
    where: deleted_at IS NULL
  - name: idx_organisation_location_address_type_id
    columns:
    - address_type_id
    desc: Leading index for FK fk_organisation_location_address_type_id (join/cascade checks).
  - name: idx_organisation_location_state_region_id
    columns:
    - state_region_id
    desc: Leading index for FK fk_organisation_location_state_region_id (join/cascade checks).
  - name: idx_organisation_location_country_id
    columns:
    - country_id
    desc: Leading index for FK fk_organisation_location_country_id (join/cascade checks).
  - name: idx_organisation_location_geo_source_id
    columns:
    - geo_source_id
    desc: Leading index for FK fk_organisation_location_geo_source_id (join/cascade checks).
  fks:
  - name: fk_organisation_location_organisation_id
    columns:
    - organisation_id
    ref: organisation
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: organisation is soft-deleted; locations follow via job
  - name: fk_organisation_location_address_type_id
    columns:
    - address_type_id
    ref: address_type
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: lookup
  - name: fk_organisation_location_city_id
    columns:
    - city_id
    ref: city
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: master data
  - name: fk_organisation_location_state_region_id
    columns:
    - state_region_id
    ref: state_region
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: master data
  - name: fk_organisation_location_country_id
    columns:
    - country_id
    ref: country
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: master data
  - name: fk_organisation_location_geo_source_id
    columns:
    - geo_source_id
    ref: geo_source
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: lookup
- name: account
  kind: entity
  delete_policy: soft
  volume: medium
  tier: '1'
  milestones: *id001
  retention: Commercial account kept 8 years after closure for tax/audit; soft-deleted only after closed_at + 8 years; contact Personal columns anonymised on request.
  description: 'Billing/commercial account that groups one or more organisations: status, account manager, currency, tax residence, credit terms.'
  columns:
  - name: account_code
    type: STRING(40)
    domain: free_text
    desc: Human-readable unique account number for finance and support.
    sens: Internal
  - name: account_name
    type: STRING(200)
    domain: free_text
    desc: Account display name.
    sens: Internal
  - name: account_status_id
    type: UUID
    domain: enum_ref
    desc: Commercial status.
    sens: Internal
  - name: primary_organisation_id
    type: UUID
    domain: identifier
    desc: Lead organisation of the account.
    sens: Internal
    'null': true
    null_why: NULL = account created before its first organisation is attached
  - name: account_manager_app_user_id
    type: UUID
    domain: identifier
    desc: Internal sales/success owner (staff user).
    sens: Internal
    'null': true
    null_why: NULL = unassigned
  - name: billing_currency_id
    type: UUID
    domain: identifier
    desc: Currency invoices are issued in.
    sens: Internal
  - name: tax_residence_country_id
    type: UUID
    domain: identifier
    desc: Country of tax residence (drives GST/VAT).
    sens: Internal
  - name: payment_term_id
    type: UUID
    domain: enum_ref
    desc: Agreed payment / credit terms.
    sens: Internal
  - name: is_prepaid
    type: BOOL
    domain: boolean
    desc: True when the account buys prepaid credits only (no credit facility).
    sens: Internal
    default: 'true'
  - name: credit_limit
    type: DECIMAL(18,4)
    domain: money
    desc: Approved credit limit in billing_currency_id.
    sens: Internal
    'null': true
    null_why: NULL = no credit facility (prepaid) - see is_prepaid
  - name: billing_organisation_location_id
    type: UUID
    domain: identifier
    desc: Location used as billing address.
    sens: Internal
    'null': true
    null_why: NULL = billing address not provided yet
  - name: billing_email
    type: STRING(254)
    domain: email
    desc: Invoice recipient mailbox.
    sens: Personal
    'null': true
    null_why: NULL = not provided
    pii: Business mailbox may identify a person; access-controlled, masked outside finance, anonymised on erasure
  - name: billing_contact_name
    type: STRING(150)
    domain: person_name
    desc: Finance contact name.
    sens: Personal
    'null': true
    null_why: NULL = not provided
    pii: Access-controlled+audited; anonymised on erasure
  - name: dunning_hold
    type: BOOL
    domain: boolean
    desc: True while collection/dunning blocks new purchases.
    sens: Internal
    default: 'false'
  - name: active_admin_count
    type: INT4
    domain: quantity
    desc: Number of currently open account_admin rows; maintained in the same txn under FOR UPDATE (BR-ORG-06).
    sens: Internal
    default: '0'
  - name: activated_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: First activation.
    sens: Internal
    'null': true
    null_why: NULL = never activated (prospect)
  - name: suspended_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Latest suspension.
    sens: Internal
    'null': true
    null_why: NULL = never suspended
  - name: closed_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Closure instant.
    sens: Internal
    'null': true
    null_why: NULL = account not closed
  - name: external_billing_ref
    type: STRING(100)
    domain: free_text
    desc: Customer id in the external billing/ERP system (reference only).
    sens: Internal
    'null': true
    null_why: NULL = not synced yet
  constraints:
  - name: ck_account_credit_limit_nonneg
    type: check
    expr: credit_limit IS NULL OR credit_limit >= 0
    desc: Non-negative.
  - name: ck_account_prepaid_no_credit
    type: check
    expr: NOT is_prepaid OR credit_limit IS NULL
    desc: Prepaid accounts carry no credit limit.
  - name: ck_account_billing_email_lower
    type: check
    expr: billing_email IS NULL OR billing_email = lower(billing_email)
    desc: Lowercase email (D-07).
  - name: ck_account_admin_count_nonneg
    type: check
    expr: active_admin_count >= 0
    desc: Counter sanity.
  - name: ck_account_operational_needs_admin
    type: check
    expr: activated_at IS NULL OR closed_at IS NOT NULL OR active_admin_count >= 1
    desc: An activated, not-closed account always has at least one active admin (declarative twin of BR-ORG-06).
  - name: ck_account_closed_after_activated
    type: check
    expr: closed_at IS NULL OR activated_at IS NULL OR closed_at >= activated_at
    desc: Closed after activation.
  indexes:
  - name: uq_account_account_code
    columns:
    - account_code
    desc: Natural key of the account.
    unique: true
    where: deleted_at IS NULL
  - name: idx_account_account_status_id_account_manager_app_user_id
    columns:
    - account_status_id
    - account_manager_app_user_id
    desc: Manager worklists by status.
    where: deleted_at IS NULL
  - name: uq_account_external_billing_ref
    columns:
    - external_billing_ref
    desc: Billing-system sync key.
    unique: true
    where: external_billing_ref IS NOT NULL AND deleted_at IS NULL
  - name: idx_account_primary_organisation_id
    columns:
    - primary_organisation_id
    desc: Leading index for FK fk_account_primary_organisation_id (join/cascade checks).
  - name: idx_account_account_manager_app_user_id
    columns:
    - account_manager_app_user_id
    desc: Leading index for FK fk_account_account_manager_app_user_id (join/cascade checks).
  - name: idx_account_billing_currency_id
    columns:
    - billing_currency_id
    desc: Leading index for FK fk_account_billing_currency_id (join/cascade checks).
  - name: idx_account_tax_residence_country_id
    columns:
    - tax_residence_country_id
    desc: Leading index for FK fk_account_tax_residence_country_id (join/cascade checks).
  - name: idx_account_payment_term_id
    columns:
    - payment_term_id
    desc: Leading index for FK fk_account_payment_term_id (join/cascade checks).
  - name: idx_account_billing_organisation_location_id
    columns:
    - billing_organisation_location_id
    desc: Leading index for FK fk_account_billing_organisation_location_id (join/cascade checks).
  fks:
  - name: fk_account_account_status_id
    columns:
    - account_status_id
    ref: account_status
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: lookup
  - name: fk_account_primary_organisation_id
    columns:
    - primary_organisation_id
    ref: organisation
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: an organisation leading an account cannot be purged
  - name: fk_account_account_manager_app_user_id
    columns:
    - account_manager_app_user_id
    ref: app_user
    on_delete: SET NULL
    on_update: RESTRICT
    desc: manager leaving unassigns; account stays
  - name: fk_account_billing_currency_id
    columns:
    - billing_currency_id
    ref: currency
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: master data
  - name: fk_account_tax_residence_country_id
    columns:
    - tax_residence_country_id
    ref: country
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: master data
  - name: fk_account_payment_term_id
    columns:
    - payment_term_id
    ref: payment_term
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: lookup
  - name: fk_account_billing_organisation_location_id
    columns:
    - billing_organisation_location_id
    ref: organisation_location
    on_delete: SET NULL
    on_update: RESTRICT
    desc: dropping a location clears billing address; finance must re-pick
- name: account_organisation
  kind: link
  delete_policy: hard
  volume: medium
  tier: '1'
  milestones: *id001
  retention: Membership history kept 8 years with the account; rows are closed (effective_to), never deleted, until the account is purged.
  description: 'Effective-dated link: which account bills which organisation. One open row per organisation.'
  columns:
  - name: account_id
    type: UUID
    domain: identifier
    desc: Account.
    sens: Internal
  - name: organisation_id
    type: UUID
    domain: identifier
    desc: Organisation billed under the account.
    sens: Internal
  - name: is_billing_owner
    type: BOOL
    domain: boolean
    desc: True if this organisation is the invoicing legal entity of the account.
    sens: Internal
    default: 'false'
  - name: effective_from
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Start of membership.
    sens: Internal
    default: now()
  - name: effective_to
    type: TIMESTAMPTZ
    domain: timestamp
    desc: End of membership.
    sens: Internal
    'null': true
    null_why: NULL = open-ended/ongoing
  - name: end_note
    type: STRING(200)
    domain: free_text
    desc: Why the organisation left the account.
    sens: Internal
    'null': true
    null_why: NULL = still a member
  constraints:
  - name: ck_account_organisation_effective_range
    type: check
    expr: effective_to IS NULL OR effective_to >= effective_from
    desc: End not before start.
  - name: uq_account_organisation_account_id_organisation_id_effective_from
    type: unique
    columns:
    - account_id
    - organisation_id
    - effective_from
    desc: No duplicate start for the same pair.
  indexes:
  - name: uq_account_organisation_organisation_id
    columns:
    - organisation_id
    desc: 'P3: an organisation belongs to at most one account at a time.'
    unique: true
    where: effective_to IS NULL
  - name: idx_account_organisation_account_id_open
    columns:
    - account_id
    desc: Current organisations of an account.
    where: effective_to IS NULL
  - name: uq_account_organisation_account_id_billing_owner
    columns:
    - account_id
    desc: One billing-owner organisation per account at a time.
    unique: true
    where: is_billing_owner AND effective_to IS NULL
  fks:
  - name: fk_account_organisation_account_id
    columns:
    - account_id
