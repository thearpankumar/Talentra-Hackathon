    where: is_primary_contact AND effective_to IS NULL
  - name: idx_account_admin_admin_app_user_id_open
    columns:
    - admin_app_user_id
    desc: Which accounts does this user administer (authorisation lookup).
    where: effective_to IS NULL
  - name: idx_account_admin_account_admin_level_id
    columns:
    - account_admin_level_id
    desc: Leading index for FK fk_account_admin_account_admin_level_id (join/cascade checks).
  fks:
  - name: fk_account_admin_account_id
    columns:
    - account_id
    ref: account
    on_delete: RESTRICT
