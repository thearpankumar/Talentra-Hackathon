views:
- name: vw_recruiter_job_requirement
  kind: view
  tables:
  - job_requirement
  - recruiter_organisation_mapping
  - organisation
  - organisation_hierarchy_closure
  purpose: 'The ONLY path recruiters use to see/act on job requirements: requirements of organisations the viewing recruiter is mapped to (directly or via descendants). One row per (viewer recruiter, requirement)
    pair, so the viewer filter is MANDATORY; the single definition of this view in the model.'
  security: 'Application recruiter role has EXECUTE on fn_recruiter_job_requirement(p_viewer_app_user_id UUID) and SELECT on this view only (no grant on job_requirement). The viewer id is a function/query
    ARGUMENT injected by the data-access layer from the authenticated session, never from client input and never a custom session variable (custom variables are unverified, crdb_capabilities row 10). An
    unfiltered SELECT on the view is a fan-out over all recruiter mappings: pool roles run with statement_timeout, and the CI lint rejects SQL that references the view without the viewer predicate (test
    AT-01/AT-25). Effective dating of mappings is applied inside the view.'
  sql_sketch: |-
    CREATE VIEW vw_recruiter_job_requirement AS
    SELECT m.recruiter_app_user_id AS viewer_app_user_id, jr.*, m.id AS recruiter_organisation_mapping_id
    FROM job_requirement jr
    JOIN organisation_hierarchy_closure c ON c.descendant_organisation_id = jr.organisation_id
    JOIN recruiter_organisation_mapping m ON m.organisation_id = c.ancestor_organisation_id
         AND m.effective_from <= now() AND (m.effective_to IS NULL OR m.effective_to > now())
         AND (c.depth = 0 OR m.mapping_scope_id = (SELECT id FROM mapping_scope WHERE code = 'with_descendants'))
    JOIN organisation o ON o.id = m.organisation_id AND o.deleted_at IS NULL
         AND o.organisation_status_id = (SELECT id FROM organisation_status WHERE code = 'active')
    WHERE jr.deleted_at IS NULL;
    -- preferred access path (viewer id is an argument; no session variable):
    CREATE FUNCTION fn_recruiter_job_requirement(p_viewer_app_user_id UUID) RETURNS SETOF vw_recruiter_job_requirement
    LANGUAGE SQL STABLE AS $$ SELECT * FROM vw_recruiter_job_requirement WHERE viewer_app_user_id = p_viewer_app_user_id $$;
    -- fallback if SETOF-view-type functions are not available on the pinned image: prepared statement
    --   SELECT ... FROM vw_recruiter_job_requirement WHERE viewer_app_user_id = $1 AND ...;
- name: vw_organisation_public
  kind: view
  tables:
  - organisation
  - organisation_location
  purpose: 'Public company page projection: live, active, public-visible organisations; no identifiers, notes or internal ids.'
  security: Granted to guest/candidate roles; excludes Sensitive/Internal columns.
  sql_sketch: SELECT o.id, o.slug, o.display_name, o.tagline, o.website_url, o.description, o.organisation_size_band_id, o.primary_industry_id, o.founded_year, o.verification_status_id, o.logo_object_ref
    FROM organisation o WHERE o.deleted_at IS NULL AND o.visibility_level_id = (SELECT id FROM visibility_level WHERE code='public')
- name: vw_organisation_review_public
  kind: view
  tables:
  - organisation_review
  - organisation_review_response
  purpose: Published reviews with employer replies; reviewer id never exposed.
  security: Granted to authenticated candidates; excludes reviewer_app_user_id and moderation internals.
  sql_sketch: SELECT r.id, r.organisation_id, r.rating_overall, r.title, r.pros, r.cons, r.published_at, resp.body AS response_body FROM organisation_review r LEFT JOIN organisation_review_response resp
    ON resp.organisation_review_id = r.id AND resp.is_published AND resp.deleted_at IS NULL WHERE r.is_published AND r.deleted_at IS NULL
- name: vw_account_active_admin
  kind: view
  tables:
  - account_admin
  - account
  purpose: Current administrators of each account for authorisation checks.
  security: Internal; used by the access layer.
  sql_sketch: SELECT a.account_id, a.admin_app_user_id, a.account_admin_level_id FROM account_admin a WHERE a.effective_to IS NULL
business_rules:
- id: BR-ORG-01
  rule: A recruiter has at most one open mapping per organisation.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: Unique index uq_recruiter_organisation_mapping_recruiter_app_user_id_organisation_id_open ON (recruiter_app_user_id, organisation_id) WHERE effective_to IS NULL (P3).
  tables:
  - recruiter_organisation_mapping
  milestone: B34
- id: BR-ORG-02
  rule: Recruiter-organisation mapping periods never overlap and the chain per pair has one head.
  mechanism_type: CHAIN_FK
  mechanism: 'P1: sequence_no, prior_recruiter_organisation_mapping_id UNIQUE, composite FK (prior id, recruiter, organisation, prior_ended_at) -> (id, recruiter, organisation, effective_to) ON UPDATE RESTRICT,
    CHECK effective_from >= prior_ended_at, partial unique head WHERE prior id IS NULL.'
  tables:
  - recruiter_organisation_mapping
  milestone: B34
- id: BR-ORG-03
  rule: A recruiter may see and act only on job requirements of organisations they are currently mapped to.
  mechanism_type: VIEW
  mechanism: Recruiter role granted SELECT on vw_recruiter_job_requirement only; view joins in-force mapping (effective_from <= now() < effective_to/NULL), active organisation, closure for with_descendants
    scope; writes go through functions/queries that re-check the same predicate (app layer).
  tables:
  - recruiter_organisation_mapping
  - organisation
  - job_requirement
  - organisation_hierarchy_closure
  milestone: B34
- id: BR-ORG-04
  rule: Changing a mapping (close + reopen) is atomic.
  mechanism_type: TXN_LOCK
  mechanism: 'SERIALIZABLE txn: SELECT ... FROM organisation WHERE id=$1 FOR UPDATE; UPDATE old row effective_to/end_reason; INSERT successor with sequence_no+1; P4 serialises concurrent admin edits, P1/P3
    backstop.'
  tables:
  - recruiter_organisation_mapping
  - organisation
  milestone: B34
- id: BR-ORG-05
  rule: Mapping may be created only from an accepted invitation or by an account admin; invitations expire.
  mechanism_type: APP_LAYER
  mechanism: Accept endpoint verifies token hash, status and expires_at, then runs BR-ORG-04 txn and stores recruiter_organisation_mapping_id on the invitation; TTL purges expired rows.
  tables:
  - organisation_invitation
  - recruiter_organisation_mapping
  milestone: B34
- id: BR-ORG-06
  rule: An activated, non-closed account always has at least one active administrator.
  mechanism_type: CHECK
  mechanism: account.active_admin_count maintained in the same txn as account_admin insert/close under SELECT account FOR UPDATE; CHECK ck_account_operational_needs_admin (activated_at IS NULL OR closed_at
    IS NOT NULL OR active_admin_count >= 1); nightly job recounts open account_admin rows.
  tables:
  - account
  - account_admin
  milestone: B34
- id: BR-ORG-07
  rule: A user has at most one open admin grant per account and one primary contact.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: Partial uniques on account_admin (account_id, admin_app_user_id) WHERE effective_to IS NULL and (account_id) WHERE is_primary_contact AND effective_to IS NULL.
  tables:
  - account_admin
  milestone: B34
- id: BR-ORG-08
  rule: An organisation belongs to at most one account at a time and one billing owner per account.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: Partial unique account_organisation(organisation_id) WHERE effective_to IS NULL; (account_id) WHERE is_billing_owner AND effective_to IS NULL; close+insert in one txn (P4 on the organisation
    row).
  tables:
  - account_organisation
  milestone: B34
- id: BR-ORG-09
  rule: The organisation tree is acyclic, one parent per organisation, max 8 levels.
  mechanism_type: CHAIN_FK
  mechanism: 'organisation_hierarchy: UNIQUE(child), self composite FK (parent, parent_level) -> (child, hierarchy_level), CHECK hierarchy_level = parent_level + 1 and 0..7, CHECK parent <> child.'
  tables:
  - organisation_hierarchy
  milestone: B28
- id: BR-ORG-10
  rule: Closure table matches the tree.
  mechanism_type: JOB
  mechanism: Closure rows written in the same txn as the edge; nightly job rebuilds from organisation_hierarchy and alerts on diff; CHECK depth 0..7 and self rows only at depth 0.
  tables:
  - organisation_hierarchy_closure
  - organisation_hierarchy
  milestone: B28
- id: BR-ORG-11
  rule: At most one live headquarters per organisation.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: uq_organisation_location_organisation_id ON (organisation_id) WHERE is_headquarters AND deleted_at IS NULL.
  tables:
  - organisation_location
  milestone: B25
- id: BR-ORG-12
  rule: Organisation slug is unique among live organisations and URL-safe.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: uq_organisation_slug WHERE deleted_at IS NULL + CHECK slug ~ '^[a-z0-9]+(-[a-z0-9]+)*$'.
  tables:
  - organisation
  milestone: B31
- id: BR-ORG-13
  rule: A tax/registration number identifies one live organisation per country and type.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: uq on (country_id, tax_id_type_id, value_lookup_hash) WHERE deleted_at IS NULL; hash is HMAC-SHA256 of the normalised value; CHECK octet_length = 32.
  tables:
  - organisation_identifier
  milestone: B75
- id: BR-ORG-14
  rule: Tax/registration numbers are never stored or logged in clear text.
  mechanism_type: APP_LAYER
  mechanism: AES-GCM envelope encryption in app layer (value_encrypted, key_version), masked_value for display, HMAC blind index for lookup; decrypt privilege limited to verification service and compliance
    role; each decrypt writes audit_event.
  tables:
  - organisation_identifier
  milestone: B75
- id: BR-ORG-15
  rule: Verification requests are idempotent and recorded per attempt.
  mechanism_type: UNIQUE
  mechanism: UNIQUE(idempotency_key) and UNIQUE(organisation_id, verification_kind_id, attempt_no); vendor callbacks correlate via unique (vendor_code, vendor_reference).
  tables:
  - organisation_verification
  milestone: B31
- id: BR-ORG-16
  rule: A verified domain belongs to one live organisation.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: uq on organisation_domain(domain_name) WHERE verified_at IS NOT NULL AND deleted_at IS NULL; CHECK lowercase hostname.
  tables:
  - organisation_domain
  milestone: B31
- id: BR-ORG-17
  rule: A user may keep one live review per company and relationship; ratings are 1-5.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: uq (organisation_id, reviewer_app_user_id, reviewer_relation_id) WHERE reviewer_app_user_id IS NOT NULL AND deleted_at IS NULL; CHECKs on rating columns.
  tables:
  - organisation_review
  milestone: B31
- id: BR-ORG-18
  rule: Only moderated (approved) reviews and replies are public; the reply belongs to the same company as the review.
  mechanism_type: VIEW
  mechanism: vw_organisation_review_public filters is_published; CHECK is_published = (published_at IS NOT NULL); composite FK (organisation_id, organisation_review_id) -> review (organisation_id, id);
    unique response per review.
  tables:
  - organisation_review
  - organisation_review_response
  milestone: B31
- id: BR-ORG-19
  rule: Moderation decisions are append-only.
  mechanism_type: PRIVILEGE
  mechanism: 'organisation_review_moderation, organisation_status_history, account_status_history, organisation_hierarchy_change: INSERT/SELECT grants only (P5).'
  tables:
  - organisation_review_moderation
  - organisation_status_history
  - account_status_history
  - organisation_hierarchy_change
  milestone: B34
- id: BR-ORG-20
  rule: An agency has at most one open contract per client and cannot be its own client.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: uq (agency_organisation_id, client_organisation_id) WHERE effective_to IS NULL AND deleted_at IS NULL; CHECK agency <> client; percentages 0..100.
  tables:
  - client_relationship
  milestone: B34
- id: BR-ORG-21
  rule: An organisation can be absorbed by at most one executed merge and never into itself.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: uq (merged_organisation_id) WHERE executed_at IS NOT NULL AND rolled_back_at IS NULL; CHECK survivor <> merged; CHECK executed requires approved_at.
  tables:
  - organisation_merge
  milestone: B28
- id: BR-ORG-22
  rule: Department tree is acyclic and tenant-safe.
  mechanism_type: CHAIN_FK
  mechanism: Composite FK (organisation_id, parent id, parent_level) -> (organisation_id, id, department_level) and CHECK department_level = parent_level + 1.
  tables:
  - organisation_department
  milestone: B28
- id: BR-ORG-23
  rule: Organisation status changes are logged in the same transaction.
  mechanism_type: APP_LAYER
  mechanism: Status update + INSERT organisation_status_history in one txn (append-only table gives tamper evidence); sensitive actions also emit audit_event.
  tables:
  - organisation
  - organisation_status_history
  milestone: B34
- id: BR-ORG-24
  rule: Only one open invitation per email and organisation; tokens stored hashed.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: uq (organisation_id, invited_email) WHERE accepted_at IS NULL AND revoked_at IS NULL; UNIQUE(token_hash); TTL on expires_at.
  tables:
  - organisation_invitation
  milestone: B34
- id: BR-ORG-25
  rule: Contacts have at least one channel and E.164 phones.
  mechanism_type: CHECK
  mechanism: CHECK reachable (email OR phone), phone ~ E.164 regex, phone/phone_country_id both-or-none.
  tables:
  - organisation_contact
  milestone: B31
