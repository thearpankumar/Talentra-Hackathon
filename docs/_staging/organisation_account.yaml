    unique: true
    where: reviewer_app_user_id IS NOT NULL AND deleted_at IS NULL
  - name: idx_organisation_review_organisation_id_published_at
    columns:
    - organisation_id
    - published_at DESC
    desc: Public review list per company.
    where: is_published AND deleted_at IS NULL
    storing:
    - rating_overall
    - helpful_count
  - name: idx_organisation_review_moderation_status_id_created_at
    columns:
    - moderation_status_id
    - created_at
    desc: Moderation queue (oldest first).
    hash: true
    bucket_count: 8
    where: deleted_at IS NULL
  - name: idx_organisation_review_reviewer_app_user_id
    columns:
    - reviewer_app_user_id
    desc: My reviews / erasure.
    where: reviewer_app_user_id IS NOT NULL
  - name: idx_organisation_review_reviewer_relation_id
    columns:
    - reviewer_relation_id
    desc: Leading index for FK fk_organisation_review_reviewer_relation_id (join/cascade checks).
  - name: idx_organisation_review_employment_type_id
    columns:
    - employment_type_id
    desc: Leading index for FK fk_organisation_review_employment_type_id (join/cascade checks).
  - name: idx_organisation_review_job_role_id
    columns:
    - job_role_id
    desc: Leading index for FK fk_organisation_review_job_role_id (join/cascade checks).
  - name: idx_organisation_review_recommendation_answer_id
    columns:
    - recommendation_answer_id
    desc: Leading index for FK fk_organisation_review_recommendation_answer_id (join/cascade checks).
  - name: idx_organisation_review_language_id
    columns:
    - language_id
    desc: Leading index for FK fk_organisation_review_language_id (join/cascade checks).
  fks:
  - name: fk_organisation_review_organisation_id
    columns:
    - organisation_id
    ref: organisation
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: reviews follow organisation purge
  - name: fk_organisation_review_reviewer_app_user_id
    columns:
    - reviewer_app_user_id
    ref: app_user
    on_delete: SET NULL
    on_update: RESTRICT
    desc: keep review anonymously after erasure
  - name: fk_organisation_review_reviewer_relation_id
    columns:
    - reviewer_relation_id
    ref: reviewer_relation
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: lookup
  - name: fk_organisation_review_employment_type_id
    columns:
    - employment_type_id
    ref: employment_type
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: master data
  - name: fk_organisation_review_job_role_id
    columns:
    - job_role_id
    ref: job_role
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: master data
  - name: fk_organisation_review_recommendation_answer_id
    columns:
    - recommendation_answer_id
