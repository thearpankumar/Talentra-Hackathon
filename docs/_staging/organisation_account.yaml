  constraints:
  - name: ck_account_admin_effective_range
    type: check
    expr: effective_to IS NULL OR effective_to >= effective_from
    desc: End not before start.
  - name: ck_account_admin_revocation_pair
    type: check
    expr: (effective_to IS NULL) = (revocation_reason IS NULL OR effective_to IS NULL)
    desc: Reason only on ended grants.
