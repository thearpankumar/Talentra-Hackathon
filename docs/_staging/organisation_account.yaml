- name: organisation_verification
  kind: event
  delete_policy: hard
  volume: medium
  tier: '1'
  milestones: *id001
  retention: Verification evidence kept 7 years from checked_at; vendor tokens purged after 90 days; corrections are new attempts.
  description: 'Company registration & tax verification boundary (docket Section 6): one row per request/attempt to the external vendor with idempotency key, vendor reference, outcome and expiry. Vendor
    owns truth; we store status + identifiers used.'
  columns:
  - name: organisation_id
    type: UUID
    domain: identifier
    desc: Organisation being verified.
    sens: Internal
  - name: organisation_identifier_id
    type: UUID
    domain: identifier
    desc: Identifier used for the lookup.
    sens: Internal
    'null': true
    null_why: NULL = non-identifier check (domain, address)
  - name: verification_kind_id
    type: UUID
    domain: enum_ref
    desc: What is being verified.
    sens: Internal
  - name: verification_status_id
    type: UUID
    domain: enum_ref
    desc: Outcome (pending / verified / failed / unavailable ...).
    sens: Internal
  - name: vendor_code
    type: STRING(40)
    domain: code
    desc: Verification vendor/registry used (e.g. mca_api, gstn_api).
    sens: Internal
  - name: vendor_reference
    type: STRING(120)
    domain: free_text
    desc: Vendor's request/transaction reference.
    sens: Internal
    'null': true
    null_why: NULL = request not yet accepted by vendor (vendor down / queued)
  - name: idempotency_key
    type: STRING(100)
    domain: free_text
    desc: Client-generated key; vendor retries and our retries with the same key cannot create duplicates.
    sens: Internal
  - name: attempt_no
    type: INT2
    domain: quantity
    desc: 1-based attempt counter per organisation and kind.
    sens: Internal
    default: '1'
  - name: requested_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: When the request was sent.
    sens: Internal
    default: now()
  - name: checked_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: When the vendor returned an outcome.
    sens: Internal
    'null': true
    null_why: NULL = no outcome yet
  - name: expires_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: When the outcome must be re-checked.
    sens: Internal
    'null': true
    null_why: NULL = outcome has no expiry or not yet determined
  - name: retry_after_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Earliest next attempt after a transient vendor failure.
    sens: Internal
    'null': true
    null_why: NULL = no retry scheduled
  - name: registered_name_returned
    type: STRING(300)
    domain: free_text
    desc: Legal name as returned by the registry (for name matching).
    sens: Internal
    'null': true
    null_why: NULL = not returned
  - name: name_match_score
    type: DECIMAL(5,2)
    domain: ratio
    desc: Similarity (0-100) between submitted and returned legal name.
    sens: Internal
    'null': true
    null_why: NULL = not computed
  - name: outcome_detail
    type: STRING(300)
    domain: free_text
    desc: Vendor message / failure reason (no raw ID numbers).
    sens: Internal
    'null': true
    null_why: NULL = none
  - name: vendor_token
    type: STRING(200)
    domain: token
    desc: Opaque vendor token/handle of the verification record.
    sens: Sensitive
    'null': true
    null_why: NULL = vendor returns no token
    pii: Opaque vendor token stored encrypted at storage layer; never shown; purged after 90 days
  - name: requested_by_app_user_id
    type: UUID
    domain: identifier
    desc: User who triggered it.
    sens: Personal
    'null': true
    null_why: NULL = automatic re-check job
    pii: Identifies a person; audited
  constraints:
  - name: uq_organisation_verification_idempotency_key
    type: unique
    columns:
    - idempotency_key
    desc: Duplicate vendor/retry submissions collapse to one row.
  - name: uq_organisation_verification_organisation_id_verification_kind_id_attempt_no
    type: unique
    columns:
    - organisation_id
    - verification_kind_id
    - attempt_no
    desc: Attempt sequence.
  - name: ck_organisation_verification_score_range
    type: check
    expr: name_match_score IS NULL OR name_match_score BETWEEN 0 AND 100
    desc: Percentage range.
  - name: ck_organisation_verification_checked_after_requested
    type: check
    expr: checked_at IS NULL OR checked_at >= requested_at
    desc: Outcome after request.
  - name: ck_organisation_verification_expires_after_checked
    type: check
    expr: expires_at IS NULL OR checked_at IS NULL OR expires_at >= checked_at
    desc: Expiry after check.
  indexes:
  - name: idx_organisation_verification_organisation_id_verification_kind_id_requested_at
    columns:
    - organisation_id
    - verification_kind_id
    - requested_at DESC
    desc: Latest outcome per kind.
  - name: idx_organisation_verification_expires_at
    columns:
    - expires_at
    desc: Re-verification job.
    where: expires_at IS NOT NULL
  - name: uq_organisation_verification_vendor_code_vendor_reference
    columns:
    - vendor_code
    - vendor_reference
    desc: Vendor callback correlation.
    unique: true
    where: vendor_reference IS NOT NULL
  - name: idx_organisation_verification_organisation_identifier_id
    columns:
    - organisation_identifier_id
    desc: Leading index for FK fk_organisation_verification_identifier_same_org (join/cascade checks).
  - name: idx_organisation_verification_verification_kind_id
    columns:
    - verification_kind_id
    desc: Leading index for FK fk_organisation_verification_verification_kind_id (join/cascade checks).
  - name: idx_organisation_verification_verification_status_id
    columns:
    - verification_status_id
    desc: Leading index for FK fk_organisation_verification_verification_status_id (join/cascade checks).
  - name: idx_organisation_verification_requested_by_app_user_id
    columns:
    - requested_by_app_user_id
    desc: Leading index for FK fk_organisation_verification_requested_by_app_user_id (join/cascade checks).
  fks:
  - name: fk_organisation_verification_organisation_id
    columns:
    - organisation_id
    ref: organisation
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: evidence must survive
  - name: fk_organisation_verification_identifier_same_org
    columns:
    - organisation_identifier_id
    - organisation_id
    ref: organisation_identifier
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: identifier must belong to the same organisation (tenant-safe)
    ref_columns:
    - id
    - organisation_id
  - name: fk_organisation_verification_verification_kind_id
    columns:
    - verification_kind_id
    ref: verification_kind
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: lookup
  - name: fk_organisation_verification_verification_status_id
    columns:
    - verification_status_id
    ref: verification_status
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: lookup
  - name: fk_organisation_verification_requested_by_app_user_id
    columns:
    - requested_by_app_user_id
    ref: app_user
    on_delete: SET NULL
    on_update: RESTRICT
    desc: requester erasure keeps evidence
- name: organisation_document
  kind: entity
  delete_policy: soft
  volume: medium
  tier: '1'
  milestones: *id001
  retention: KYC documents kept 7 years after verification; files in object storage deleted with row purge; erasure of directors' personal data inside documents handled by deleting the file.
