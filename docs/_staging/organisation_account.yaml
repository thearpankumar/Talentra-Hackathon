- name: client_relationship
  kind: entity
  delete_policy: soft
  volume: medium
  tier: '1'
  milestones:
  - B25
  - B28
  - B31
  - B34
  retention: Commercial terms retained 8 years after termination (contract/tax), then purged.
  description: Staffing agency/consultancy -> client company relationship with contract dates and commercial terms. Gates which client jobs an agency's recruiters may post for (together with recruiter mapping).
  columns:
  - name: agency_organisation_id
    type: UUID
    domain: identifier
    desc: Consultancy / agency organisation.
    sens: Internal
  - name: client_organisation_id
    type: UUID
    domain: identifier
    desc: Client company.
    sens: Internal
  - name: client_relationship_status_id
    type: UUID
    domain: enum_ref
    desc: State.
    sens: Internal
  - name: contract_reference
    type: STRING(100)
    domain: free_text
    desc: Contract / MSA number.
    sens: Internal
    'null': true
    null_why: NULL = no signed contract (prospect)
  - name: effective_from
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Contract start.
    sens: Internal
    default: now()
  - name: effective_to
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Contract end.
    sens: Internal
    'null': true
    null_why: NULL = open-ended/ongoing
  - name: fee_model_id
    type: UUID
    domain: enum_ref
    desc: Fee model.
    sens: Internal
    'null': true
    null_why: NULL = not agreed yet
  - name: fee_percent
    type: DECIMAL(5,2)
    domain: percentage
    desc: Fee as percentage of annual CTC (placement_percent model).
    sens: Internal
    'null': true
    null_why: NULL = not a percentage model
  - name: margin_percent
    type: DECIMAL(5,2)
    domain: percentage
    desc: Agency margin/markup on the client's bill rate.
    sens: Internal
    'null': true
    null_why: NULL = not applicable or not disclosed
  - name: payment_term_id
    type: UUID
    domain: enum_ref
    desc: Payment terms with this client.
    sens: Internal
    'null': true
    null_why: NULL = defaults to account terms
  - name: guarantee_days
    type: INT2
    domain: quantity
    desc: Replacement guarantee period.
    sens: Internal
    'null': true
    null_why: NULL = no guarantee
  - name: is_exclusive
    type: BOOL
    domain: boolean
    desc: Agency holds exclusivity for this client.
    sens: Internal
    default: 'false'
  constraints:
  - name: ck_client_relationship_distinct_parties
    type: check
    expr: agency_organisation_id <> client_organisation_id
    desc: No self-client.
  - name: ck_client_relationship_effective_range
    type: check
    expr: effective_to IS NULL OR effective_to >= effective_from
    desc: End not before start.
  - name: ck_client_relationship_fee_percent_range
    type: check
    expr: fee_percent IS NULL OR fee_percent BETWEEN 0 AND 100
    desc: Percentage range.
  - name: ck_client_relationship_margin_percent_range
    type: check
    expr: margin_percent IS NULL OR margin_percent BETWEEN 0 AND 100
    desc: Percentage range.
  - name: ck_client_relationship_guarantee_range
    type: check
    expr: guarantee_days IS NULL OR guarantee_days BETWEEN 0 AND 730
    desc: Plausible guarantee.
  indexes:
  - name: uq_client_relationship_agency_organisation_id_client_organisation_id
    columns:
    - agency_organisation_id
    - client_organisation_id
    desc: 'P3: one open contract per agency/client pair.'
    unique: true
    where: effective_to IS NULL AND deleted_at IS NULL
  - name: idx_client_relationship_client_organisation_id_effective_to
    columns:
    - client_organisation_id
    - effective_to
    desc: Agencies serving a client.
    where: deleted_at IS NULL
  - name: idx_client_relationship_client_relationship_status_id
    columns:
    - client_relationship_status_id
    desc: Leading index for FK fk_client_relationship_client_relationship_status_id (join/cascade checks).
  - name: idx_client_relationship_fee_model_id
    columns:
    - fee_model_id
    desc: Leading index for FK fk_client_relationship_fee_model_id (join/cascade checks).
  - name: idx_client_relationship_payment_term_id
    columns:
    - payment_term_id
    desc: Leading index for FK fk_client_relationship_payment_term_id (join/cascade checks).
  fks:
  - name: fk_client_relationship_agency_organisation_id
    columns:
    - agency_organisation_id
    ref: organisation
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: kept
  - name: fk_client_relationship_client_organisation_id
    columns:
    - client_organisation_id
    ref: organisation
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: kept
  - name: fk_client_relationship_client_relationship_status_id
    columns:
    - client_relationship_status_id
    ref: client_relationship_status
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: lookup
  - name: fk_client_relationship_fee_model_id
    columns:
    - fee_model_id
    ref: fee_model
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: lookup
  - name: fk_client_relationship_payment_term_id
    columns:
    - payment_term_id
    ref: payment_term
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: lookup
- name: organisation_department
  kind: entity
  delete_policy: soft
  volume: medium
  tier: '1'
  milestones:
  - B25
  - B28
  - B31
  retention: Active rows kept while the organisation exists; soft-deleted rows purged 24 months after deleted_at; erasure requests anonymise Personal columns in place.
  description: Internal departments/teams/business units (hiring-manager targeting, job requirement owner). Tree acyclicity uses the same level-chain FK trick as the organisation tree. Not an access-control
    construct.
  columns:
  - name: organisation_id
    type: UUID
    domain: identifier
    desc: Organisation (tenant).
    sens: Internal
  - name: parent_organisation_department_id
    type: UUID
    domain: identifier
    desc: Parent unit.
    sens: Internal
    'null': true
    null_why: NULL = top-level unit
  - name: department_level
    type: INT2
    domain: quantity
    desc: Depth (top level = 0).
    sens: Internal
  - name: parent_level
    type: INT2
    domain: quantity
    desc: Parent's department_level.
    sens: Internal
    'null': true
    null_why: NULL = top-level unit
  - name: department_kind_id
    type: UUID
    domain: enum_ref
    desc: Kind of unit.
    sens: Internal
  - name: department_name
    type: STRING(150)
    domain: free_text
    desc: Name.
    sens: Public
  - name: cost_centre_code
    type: STRING(30)
    domain: code
    desc: Finance cost-centre code.
    sens: Internal
    'null': true
    null_why: NULL = no cost centre
  - name: organisation_location_id
    type: UUID
    domain: identifier
    desc: Main site of the unit.
    sens: Internal
    'null': true
    null_why: NULL = not site-specific
  - name: is_active
    type: BOOL
    domain: boolean
    desc: Unit in use.
    sens: Internal
    default: 'true'
  constraints:
  - name: uq_organisation_department_organisation_id_id_department_level
    type: unique
    columns:
    - organisation_id
    - id
    - department_level
    desc: Level-chain FK target.
  - name: uq_organisation_department_organisation_id_id
    type: unique
    columns:
    - organisation_id
    - id
    desc: Same-tenant target (job requirement owner).
  - name: ck_organisation_department_level_range
    type: check
    expr: department_level BETWEEN 0 AND 5
    desc: Depth cap.
  - name: ck_organisation_department_parent_chain_nulls
    type: check
    expr: (parent_organisation_department_id IS NULL) = (parent_level IS NULL) AND (parent_level IS NULL) = (department_level = 0)
    desc: Top level iff no parent.
  - name: ck_organisation_department_level_increments
    type: check
    expr: parent_level IS NULL OR department_level = parent_level + 1
    desc: Strictly increasing level => acyclic.
  indexes:
  - name: uq_organisation_department_organisation_id_department_name
    columns:
    - organisation_id
    - department_name
    desc: Unique live name per organisation.
    unique: true
    where: deleted_at IS NULL
  - name: idx_organisation_department_department_kind_id
    columns:
    - department_kind_id
    desc: Leading index for FK fk_organisation_department_department_kind_id (join/cascade checks).
  fks:
  - name: fk_organisation_department_organisation_id
    columns:
    - organisation_id
    ref: organisation
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: kept with organisation
  - name: fk_organisation_department_department_kind_id
    columns:
    - department_kind_id
    ref: department_kind
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: lookup
  - name: fk_organisation_department_parent_chain
    columns:
    - organisation_id
    - parent_organisation_department_id
    - parent_level
    ref: organisation_department
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Parent must be in the same organisation and exactly one level above (acyclic, tenant-safe).
    ref_columns:
    - organisation_id
    - id
    - department_level
  - name: fk_organisation_department_location_same_org
    columns:
    - organisation_id
    - organisation_location_id
    ref: organisation_location
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: site must belong to the same organisation
    ref_columns:
    - organisation_id
    - id
- name: organisation_invitation
  kind: entity
  delete_policy: hard
  volume: medium
  tier: '1'
  milestones:
  - B25
  - B28
  - B34
  - B75
  retention: 'TTL: rows deleted 180 days after expires_at; accepted invitations are evidenced by the mapping and audit_event.'
  description: Invitation for a recruiter to join an organisation; acceptance creates a recruiter_organisation_mapping row (P1/P3).
  ttl:
    expire_after: 180 days
    column: expires_at
  columns:
  - name: organisation_id
    type: UUID
    domain: identifier
    desc: Inviting organisation.
    sens: Internal
  - name: invited_email
    type: STRING(254)
    domain: email
    desc: Invitee email.
    sens: Personal
    pii: Access-controlled; deleted by TTL; masked in admin lists
  - name: invitation_status_id
    type: UUID
    domain: enum_ref
    desc: State.
    sens: Internal
  - name: mapping_scope_id
    type: UUID
    domain: enum_ref
    desc: Scope of the mapping to create.
    sens: Internal
  - name: token_hash
    type: STRING(100)
