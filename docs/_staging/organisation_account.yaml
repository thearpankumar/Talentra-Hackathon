- name: organisation_review
  kind: entity
  delete_policy: soft
  volume: high
  tier: '1'
  milestones:
  - B25
  - B31
  - B75
  retention: Reviews kept while the company exists; on reviewer erasure reviewer_app_user_id is set NULL and text retained anonymously; rejected reviews purged after 12 months.
  description: 'User-generated company review (Glassdoor/AmbitionBox style): overall + dimension ratings, pros/cons, relationship to company, moderation lifecycle. Reference benchmarks/ratings from external
    providers live in tier3_reference.'
  columns:
  - name: organisation_id
    type: UUID
    domain: identifier
    desc: Reviewed company.
    sens: Internal
  - name: reviewer_app_user_id
    type: UUID
    domain: identifier
    desc: Reviewer.
    sens: Personal
    'null': true
    null_why: NULL = reviewer erased/anonymised
    pii: Never exposed publicly (anonymous by default); audited access; set NULL on erasure
  - name: reviewer_relation_id
    type: UUID
    domain: enum_ref
    desc: Relationship to the company.
    sens: Internal
  - name: employment_type_id
    type: UUID
    domain: enum_ref
    desc: Employment type of the reviewer.
    sens: Internal
    'null': true
    null_why: NULL = not stated (interviewee/other)
  - name: job_role_id
    type: UUID
    domain: identifier
    desc: Reviewer's role.
    sens: Internal
    'null': true
    null_why: NULL = not stated
  - name: organisation_location_id
    type: UUID
    domain: identifier
    desc: Site reviewed.
    sens: Internal
    'null': true
    null_why: NULL = not stated
  - name: rating_overall
    type: INT2
    domain: quantity
    desc: Overall rating 1-5.
    sens: Internal
  - name: rating_culture
    type: INT2
    domain: quantity
    desc: Culture and values 1-5.
    sens: Internal
    'null': true
    null_why: NULL = dimension not rated
  - name: rating_work_life
    type: INT2
    domain: quantity
    desc: Work-life balance 1-5.
    sens: Internal
    'null': true
    null_why: NULL = dimension not rated
  - name: rating_compensation
    type: INT2
    domain: quantity
    desc: Compensation and benefits 1-5.
    sens: Internal
    'null': true
    null_why: NULL = dimension not rated
  - name: rating_management
    type: INT2
    domain: quantity
    desc: Senior management 1-5.
    sens: Internal
    'null': true
    null_why: NULL = dimension not rated
  - name: rating_career
    type: INT2
    domain: quantity
    desc: Career opportunities 1-5.
    sens: Internal
    'null': true
    null_why: NULL = dimension not rated
  - name: recommendation_answer_id
    type: UUID
    domain: enum_ref
    desc: Would recommend to a friend.
    sens: Internal
  - name: title
    type: STRING(200)
    domain: free_text
    desc: Review headline.
    sens: Personal
    pii: Free text may contain PII; moderated, encrypted at rest (D-17)
  - name: pros
    type: STRING
    domain: long_text
    desc: What the reviewer liked.
    sens: Personal
    pii: Free text may contain PII; moderated, encrypted at rest (D-17)
    unbounded_why: User-written review text; length varies and is bounded by the application (max 5,000 chars), not by schema
  - name: cons
    type: STRING
    domain: long_text
    desc: What could be better.
    sens: Personal
    pii: Free text may contain PII; moderated, encrypted at rest (D-17)
    unbounded_why: User-written review text; length varies and is bounded by the application (max 5,000 chars), not by schema
  - name: advice_to_management
    type: STRING
    domain: long_text
    desc: Advice to leadership.
    sens: Personal
    'null': true
    null_why: NULL = not provided
    pii: Free text may contain PII; moderated, encrypted at rest (D-17)
    unbounded_why: User-written review text; length varies and is bounded by the application (max 5,000 chars), not by schema
  - name: language_id
    type: UUID
    domain: identifier
    desc: Language the review was written in.
    sens: Internal
    'null': true
    null_why: NULL = not detected
  - name: tenure_months
    type: INT2
    domain: quantity
    desc: Months spent at the company.
    sens: Internal
    'null': true
    null_why: NULL = not stated
  - name: is_anonymous
    type: BOOL
    domain: boolean
    desc: Hide reviewer identity publicly.
    sens: Internal
    default: 'true'
  - name: is_employment_verified
    type: BOOL
    domain: boolean
    desc: Reviewer proved employment (verified domain email / payslip token).
    sens: Internal
    default: 'false'
  - name: moderation_status_id
    type: UUID
    domain: enum_ref
    desc: Moderation state.
    sens: Internal
  - name: is_published
    type: BOOL
    domain: boolean
    desc: Visible publicly (approved and not removed).
    sens: Internal
    default: 'false'
  - name: published_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Publication time.
    sens: Internal
    'null': true
    null_why: NULL = not published
  - name: helpful_count
    type: INT4
    domain: quantity
    desc: Denormalised helpful votes (batched update).
    sens: Internal
    default: '0'
  constraints:
  - name: uq_organisation_review_organisation_id_id
    type: unique
    columns:
    - organisation_id
    - id
    desc: Same-tenant composite target for review_response.
  - name: ck_organisation_review_rating_overall_range
    type: check
    expr: rating_overall BETWEEN 1 AND 5
    desc: 1-5.
  - name: ck_organisation_review_rating_dimensions_range
    type: check
    expr: (rating_culture IS NULL OR rating_culture BETWEEN 1 AND 5) AND (rating_work_life IS NULL OR rating_work_life BETWEEN 1 AND 5) AND (rating_compensation IS NULL OR rating_compensation BETWEEN 1
      AND 5) AND (rating_management IS NULL OR rating_management BETWEEN 1 AND 5) AND (rating_career IS NULL OR rating_career BETWEEN 1 AND 5)
    desc: 1-5 each.
  - name: ck_organisation_review_tenure_range
    type: check
    expr: tenure_months IS NULL OR tenure_months BETWEEN 0 AND 720
    desc: Plausible tenure.
  - name: ck_organisation_review_published_pair
    type: check
    expr: is_published = (published_at IS NOT NULL)
    desc: Flag matches timestamp.
  indexes:
  - name: uq_organisation_review_organisation_id_reviewer_app_user_id_reviewer_relation_id
    columns:
    - organisation_id
    - reviewer_app_user_id
    - reviewer_relation_id
