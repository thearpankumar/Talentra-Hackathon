    desc: SHA-256 hex of the one-time invitation token.
    sens: Sensitive
    pii: Only the hash is stored; raw token sent once by email
  - name: invited_by_app_user_id
    type: UUID
    domain: identifier
    desc: Inviter.
    sens: Personal
    pii: Identifies a person; audited
  - name: invitee_app_user_id
    type: UUID
    domain: identifier
    desc: Invitee user once matched.
    sens: Personal
    'null': true
    null_why: NULL = invitee has no account yet
    pii: Identifies a person; audited
  - name: recruiter_organisation_mapping_id
    type: UUID
    domain: identifier
    desc: Mapping created on acceptance.
    sens: Internal
    'null': true
    null_why: NULL = not accepted
  - name: resend_count
    type: INT2
    domain: quantity
    desc: Resends.
    sens: Internal
    default: '0'
  - name: expires_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Expiry.
    sens: Internal
  - name: accepted_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Acceptance.
    sens: Internal
    'null': true
    null_why: NULL = not accepted
  - name: revoked_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Revocation.
    sens: Internal
    'null': true
    null_why: NULL = not revoked
  constraints:
  - name: uq_organisation_invitation_token_hash
    type: unique
    columns:
    - token_hash
    desc: Token lookup.
  - name: ck_organisation_invitation_invited_email_lower
    type: check
    expr: invited_email = lower(invited_email)
    desc: Lowercase email.
  - name: ck_organisation_invitation_single_outcome
    type: check
    expr: accepted_at IS NULL OR revoked_at IS NULL
    desc: Accepted xor revoked.
  - name: ck_organisation_invitation_resend_range
    type: check
    expr: resend_count BETWEEN 0 AND 10
    desc: Resend cap.
  indexes:
  - name: uq_organisation_invitation_organisation_id_invited_email
    columns:
    - organisation_id
    - invited_email
    desc: One open invitation per email and organisation.
    unique: true
    where: accepted_at IS NULL AND revoked_at IS NULL
  - name: idx_organisation_invitation_invited_email
    columns:
    - invited_email
    desc: Inbox lookup at sign-up.
    where: accepted_at IS NULL AND revoked_at IS NULL
  - name: idx_organisation_invitation_invitation_status_id
    columns:
    - invitation_status_id
    desc: Leading index for FK fk_organisation_invitation_invitation_status_id (join/cascade checks).
  - name: idx_organisation_invitation_mapping_scope_id
    columns:
    - mapping_scope_id
    desc: Leading index for FK fk_organisation_invitation_mapping_scope_id (join/cascade checks).
  - name: idx_organisation_invitation_invited_by_app_user_id
    columns:
    - invited_by_app_user_id
    desc: Leading index for FK fk_organisation_invitation_invited_by_app_user_id (join/cascade checks).
  - name: idx_organisation_invitation_invitee_app_user_id
    columns:
    - invitee_app_user_id
    desc: Leading index for FK fk_organisation_invitation_invitee_app_user_id (join/cascade checks).
  - name: idx_organisation_invitation_recruiter_organisation_mapping_id
    columns:
    - recruiter_organisation_mapping_id
    desc: Leading index for FK fk_organisation_invitation_recruiter_organisation_mapping_id (join/cascade checks).
  fks:
  - name: fk_organisation_invitation_organisation_id
    columns:
    - organisation_id
    ref: organisation
    on_delete: CASCADE
    on_update: RESTRICT
    desc: invitations meaningless without the organisation
  - name: fk_organisation_invitation_invitation_status_id
    columns:
    - invitation_status_id
    ref: invitation_status
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: lookup
  - name: fk_organisation_invitation_mapping_scope_id
    columns:
    - mapping_scope_id
    ref: mapping_scope
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: lookup
  - name: fk_organisation_invitation_invited_by_app_user_id
    columns:
    - invited_by_app_user_id
    ref: app_user
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: inviter retained as user soft-deleted
  - name: fk_organisation_invitation_invitee_app_user_id
    columns:
    - invitee_app_user_id
    ref: app_user
    on_delete: SET NULL
    on_update: RESTRICT
    desc: invitee erasure
  - name: fk_organisation_invitation_recruiter_organisation_mapping_id
    columns:
