  - name: time_extension_seconds
    desc: Accessibility accommodation.
    sens: Internal
    type: INT4
    domain: quantity
    default: '0'
  - name: raw_score
    desc: Points earned.
    sens: Internal
    type: DECIMAL(8,2)
    domain: measure
    'null': true
    null_why: NULL = ungraded.
  - name: max_score
    desc: Points possible.
    sens: Internal
    type: DECIMAL(8,2)
    domain: measure
    'null': true
    null_why: NULL = ungraded.
  - name: score_percent
    desc: Score as percentage.
    sens: Internal
    type: DECIMAL(5,2)
    domain: percentage
    'null': true
    null_why: NULL = ungraded.
  - name: graded_at
    desc: Grading completion time.
    sens: Internal
    type: TIMESTAMPTZ
    domain: timestamp
    'null': true
    null_why: NULL = ungraded.
  - name: is_passed
    desc: Pass outcome; meaningful only once graded_at is set.
    sens: Internal
    type: BOOL
    domain: boolean
    default: 'false'
  - name: ability_estimate
