tables:
- name: course_instructor_profile
  kind: entity
  delete_policy: soft
  volume: low
  tier: X
  milestones:
  - B4
  - B12
  - B20
  retention: Catalogue data is retained while the course exists; retired courses keep rows for certificates already issued; learner-linked data follows candidate erasure.
  description: Instructor / author identity for catalogue courses and articles (external or platform-native); optionally linked to a candidate profile.
  columns:
  - name: display_name
    desc: Public instructor name.
    sens: Personal
    type: STRING(150)
    domain: free_text
    pii: public byline by consent; hidden on erasure
  - name: headline
    desc: Short professional headline.
    sens: Internal
    type: STRING(200)
    domain: free_text
    'null': true
    null_why: NULL = none supplied.
  - name: bio
    desc: Instructor biography.
    sens: Internal
    type: STRING
    domain: long_text
    unbounded_why: Long-form editorial or user text of unpredictable length.
    'null': true
    null_why: NULL = none supplied.
  - name: photo_url
    desc: Avatar URL.
    sens: Internal
    type: STRING(500)
    domain: url
    'null': true
    null_why: NULL = no photo.
  - name: candidate_profile_id
    desc: Linked platform profile if the instructor is a member.
    sens: Internal
    type: UUID
    domain: identifier
    'null': true
    null_why: NULL = external instructor.
  - name: course_provider_id
    desc: Provider the instructor teaches for.
    sens: Internal
    type: UUID
    domain: identifier
    'null': true
    null_why: NULL = independent.
  - name: external_instructor_ref
    desc: Provider-side instructor id (idempotent sync).
    sens: Internal
    type: STRING(100)
    domain: free_text
    'null': true
    null_why: NULL = platform-native.
  - name: is_verified
    desc: Platform-verified expert.
    sens: Internal
    type: BOOL
    domain: boolean
    default: 'false'
  - name: average_rating
    desc: Cached average instructor rating 0..5.
    sens: Internal
    type: DECIMAL(3,2)
    domain: measure
    'null': true
    null_why: NULL = no ratings yet.
  - name: language_id
    type: UUID
    domain: identifier
    'null': true
    null_why: NULL = language of the free text is unknown (not stated by the author, not detected).
    sens: Internal
    desc: Language the free text of this row was written in, where known (Rule 7); the text is stored once in that language.
  constraints:
  - name: ck_course_instructor_profile_rating_range
    type: check
    expr: average_rating IS NULL OR average_rating BETWEEN 0 AND 5
    desc: Rating scale 0..5.
  indexes:
  - name: uq_course_instructor_profile_course_provider_id_external_instructor_ref
    columns:
    - course_provider_id
    - external_instructor_ref
    unique: true
    where: deleted_at IS NULL AND external_instructor_ref IS NOT NULL
    desc: One row per provider-side instructor.
  - name: idx_course_instructor_profile_display_name
    columns:
    - display_name
    desc: Instructor name lookup.
    where: deleted_at IS NULL
  - name: idx_course_instructor_profile_candidate_profile_id
    columns:
    - candidate_profile_id
    desc: 'Leading index for FK fk_course_instructor_profile_candidate_profile_id: child lookups and parent-side checks.'
  fks:
  - name: fk_course_instructor_profile_candidate_profile_id
    columns:
    - candidate_profile_id
    ref: candidate_profile
    ref_columns:
    - id
    on_delete: SET NULL
    on_update: RESTRICT
    desc: 'Optional context link to candidate_profile: cleared if the parent is physically removed.'
  - name: fk_course_instructor_profile_course_provider_id
    columns:
    - course_provider_id
    ref: course_provider
    ref_columns:
    - id
    on_delete: SET NULL
    on_update: RESTRICT
    desc: 'Optional context link to course_provider: cleared if the parent is physically removed.'
  - name: fk_course_instructor_profile_language_id
    columns:
    - language_id
    ref: language
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Language master data is never deleted (retired via is_active).
    index_exempt: master data language rows are never deleted, so no child scan is needed
- name: course_instructor
  kind: link
  delete_policy: hard
  volume: low
  tier: X
  milestones:
  - B4
  - B12
  - B20
  retention: Follows the course row; no independent retention.
  description: Link course to its instructors with role and display order.
  columns:
  - name: course_id
    desc: Course taught.
    sens: Internal
    type: UUID
    domain: identifier
  - name: course_instructor_profile_id
    desc: Instructor.
    sens: Internal
    type: UUID
    domain: identifier
  - name: course_instructor_role_id
    desc: Role on the course.
    sens: Internal
    type: UUID
    domain: enum_ref
  - name: display_order
    desc: Ordering of instructors on the course page.
    sens: Internal
    type: INT2
    domain: quantity
    default: '1'
  constraints:
  - name: uq_course_instructor_course_id_course_instructor_profile_id
    type: unique
    columns:
    - course_id
    - course_instructor_profile_id
    desc: An instructor appears once per course.
  indexes:
  - name: idx_course_instructor_course_instructor_profile_id
    columns:
    - course_instructor_profile_id
    desc: Courses per instructor.
  fks:
  - name: fk_course_instructor_course_id
    columns:
    - course_id
    ref: course
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: 'Child data of course: follows its parent.'
  - name: fk_course_instructor_course_instructor_profile_id
    columns:
    - course_instructor_profile_id
    ref: course_instructor_profile
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: 'Child data of course_instructor_profile: follows its parent.'
  - name: fk_course_instructor_course_instructor_role_id
    columns:
    - course_instructor_role_id
    ref: course_instructor_role
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'Lookup course_instructor_role: retire values instead of deleting.'
    index_exempt: low-cardinality lookup; RESTRICT check is a point read on the lookup PK
- name: course_module
  kind: entity
  delete_policy: soft
  volume: medium
  tier: X
  milestones:
  - B4
  - B12
  - B20
  retention: Catalogue data is retained while the course exists; retired courses keep rows for certificates already issued; learner-linked data follows candidate erasure.
  description: Section/module of a course (LinkedIn Learning chapter, Coursera week).
  columns:
  - name: course_id
    desc: Owning course.
    sens: Internal
    type: UUID
    domain: identifier
  - name: sequence_no
    desc: Order within the course, 1-based.
    sens: Internal
    type: INT2
    domain: quantity
  - name: title
    desc: Module title.
    sens: Internal
    type: STRING(200)
    domain: free_text
  - name: summary
    desc: Module synopsis.
    sens: Internal
    type: STRING(1000)
    domain: free_text
    'null': true
    null_why: NULL = none.
  - name: estimated_minutes
    desc: Estimated study time.
    sens: Internal
    type: INT4
    domain: quantity
    'null': true
    null_why: NULL = unknown.
  constraints:
  - name: ck_course_module_sequence_pos
    type: check
    expr: sequence_no >= 1
    desc: Positive sequence.
  indexes:
  - name: uq_course_module_course_id_sequence_no
    columns:
    - course_id
    - sequence_no
    unique: true
    where: deleted_at IS NULL
    desc: Unique ordering within the course.
  fks:
  - name: fk_course_module_course_id
    columns:
    - course_id
    ref: course
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: 'Child data of course: follows its parent.'
- name: course_lesson
  kind: entity
  delete_policy: soft
  volume: high
  tier: X
  milestones:
  - B4
  - B12
  - B20
  retention: Catalogue data is retained while the course exists; retired courses keep rows for certificates already issued; learner-linked data follows candidate erasure.
  description: 'Lesson inside a module: video, reading, quiz, lab or live session.'
  no_hash_why: Random UUIDv4 PK and every secondary index leads with a high-cardinality entity key; no sequential-time index, so no write hotspot.
  columns:
  - name: course_module_id
    desc: Owning module.
    sens: Internal
    type: UUID
    domain: identifier
  - name: sequence_no
    desc: Order within the module, 1-based.
    sens: Internal
    type: INT2
    domain: quantity
  - name: title
    desc: Lesson title.
    sens: Internal
    type: STRING(200)
    domain: free_text
  - name: learning_content_type_id
    desc: Content kind.
    sens: Internal
    type: UUID
    domain: enum_ref
  - name: duration_seconds
    desc: Media length or estimate in seconds.
    sens: Internal
    type: INT4
    domain: duration
    'null': true
    null_why: NULL = not time-based.
  - name: content_url
    desc: Hosted content location (reference only; media is external).
    sens: Internal
    type: STRING(1000)
    domain: url
    'null': true
    null_why: NULL = no hosted content (live/quiz).
  - name: quiz_question_bank_id
    desc: Question bank used if the lesson is a quiz.
    sens: Internal
    type: UUID
    domain: identifier
    'null': true
    null_why: NULL = not a quiz lesson.
  - name: is_preview
    desc: Free preview before enrolment.
    sens: Internal
    type: BOOL
    domain: boolean
    default: 'false'
  - name: is_mandatory
    desc: Required for completion.
    sens: Internal
    type: BOOL
    domain: boolean
    default: 'true'
  - name: external_lesson_ref
    desc: Provider-side lesson id.
    sens: Internal
    type: STRING(100)
    domain: free_text
    'null': true
    null_why: NULL = platform-native.
  constraints:
  - name: ck_course_lesson_sequence_pos
    type: check
    expr: sequence_no >= 1
    desc: Positive sequence.
  - name: ck_course_lesson_duration_nonneg
    type: check
    expr: duration_seconds IS NULL OR duration_seconds >= 0
    desc: No negative durations.
  indexes:
  - name: uq_course_lesson_course_module_id_sequence_no
    columns:
    - course_module_id
    - sequence_no
    unique: true
    where: deleted_at IS NULL
    desc: Unique ordering within the module.
  - name: idx_course_lesson_quiz_question_bank_id
    columns:
    - quiz_question_bank_id
    desc: 'Leading index for FK fk_course_lesson_quiz_question_bank_id: child lookups and parent-side checks.'
  fks:
  - name: fk_course_lesson_course_module_id
    columns:
    - course_module_id
    ref: course_module
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: 'Child data of course_module: follows its parent.'
  - name: fk_course_lesson_learning_content_type_id
    columns:
    - learning_content_type_id
    ref: learning_content_type
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'Lookup learning_content_type: retire values instead of deleting.'
    index_exempt: low-cardinality lookup; RESTRICT check is a point read on the lookup PK
  - name: fk_course_lesson_quiz_question_bank_id
    columns:
    - quiz_question_bank_id
    ref: question_bank
    ref_columns:
    - id
    on_delete: SET NULL
    on_update: RESTRICT
    desc: 'Optional context link to question_bank: cleared if the parent is physically removed.'
