    desc: Percentage range 0..100.
  - name: ck_assessment_session_integrity_score_range
    type: check
    expr: integrity_score IS NULL OR integrity_score BETWEEN 0 AND 100
    desc: Percentage range 0..100.
  - name: ck_assessment_session_score_range
    type: check
    expr: raw_score IS NULL OR max_score IS NULL OR raw_score BETWEEN 0 AND max_score
    desc: Score within bounds.
  - name: ck_assessment_session_submit_after_start
    type: check
    expr: submitted_at IS NULL OR started_at IS NOT NULL AND submitted_at >= started_at
