    - assessment_blueprint_id
    ref: assessment_blueprint
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'Reference to assessment_blueprint: parent cannot be removed while referenced (retire instead).'
  - name: fk_assessment_session_assessment_attempt_id
    columns:
    - assessment_attempt_id
    ref: assessment_attempt
    ref_columns:
    - id
    on_delete: SET NULL
    on_update: RESTRICT
    desc: 'Optional context link to assessment_attempt: cleared if the parent is physically removed.'
  - name: fk_assessment_session_assessment_session_status_id
    columns:
