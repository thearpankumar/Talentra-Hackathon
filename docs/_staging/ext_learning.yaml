- name: skill_gap_report
  kind: snapshot
  delete_policy: soft
  volume: high
  tier: X
  milestones:
  - B4
  - B12
  - B20
  retention: Retained while the parent exists; anonymised in place on candidate erasure request (DPDP/GDPR); soft-deleted rows purged after 24 months.
  description: Generated analysis of the gap between a candidate profile and a target role or job requirement.
  no_hash_why: Random UUIDv4 PK and every secondary index leads with a high-cardinality entity key; no sequential-time index, so no write hotspot.
  columns:
  - name: candidate_profile_id
    desc: Candidate analysed.
    sens: Internal
    type: UUID
    domain: identifier
  - name: target_job_role_id
    desc: Target role.
    sens: Internal
    type: UUID
    domain: identifier
    'null': true
    null_why: NULL = analysed against a specific requirement.
  - name: target_job_requirement_id
    desc: Target requirement.
    sens: Internal
    type: UUID
    domain: identifier
    'null': true
    null_why: NULL = analysed against a generic role.
  - name: gap_report_status_id
    desc: State.
    sens: Internal
    type: UUID
    domain: enum_ref
  - name: generated_at
    desc: Generation time.
    sens: Internal
    type: TIMESTAMPTZ
    domain: timestamp
    default: now()
  - name: match_percent
    desc: Overall skill match.
    sens: Internal
    type: DECIMAL(5,2)
    domain: percentage
    'null': true
    null_why: NULL = not computed (failed/generating).
  - name: model_version
    desc: Matching model/taxonomy version.
