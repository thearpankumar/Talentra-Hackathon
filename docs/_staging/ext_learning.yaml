    domain: enum_ref
  - name: proctoring_mode_id
    desc: Proctoring applied.
    sens: Internal
    type: UUID
    domain: enum_ref
  - name: language_id
    desc: Language of delivery.
    sens: Internal
    type: UUID
    domain: identifier
  - name: scheduled_at
    desc: Booked start.
    sens: Internal
    type: TIMESTAMPTZ
    domain: timestamp
    'null': true
    null_why: NULL = on-demand sitting.
  - name: started_at
    desc: Actual start.
    sens: Internal
    type: TIMESTAMPTZ
    domain: timestamp
    'null': true
    null_why: NULL = not started.
  - name: deadline_at
    desc: Hard end computed from timer plus accommodations.
    sens: Internal
    type: TIMESTAMPTZ
    domain: timestamp
    'null': true
    null_why: NULL = not started.
  - name: submitted_at
    desc: Submission time.
    sens: Internal
    type: TIMESTAMPTZ
    domain: timestamp
    'null': true
