  - name: discrimination_index
    desc: IRT a / point-biserial discrimination.
    sens: Internal
    type: DECIMAL(6,4)
    domain: measure
    'null': true
    null_why: NULL = not yet calibrated.
  - name: correct_rate
    desc: Observed share answering correctly.
    sens: Internal
    type: DECIMAL(5,2)
    domain: percentage
    'null': true
    null_why: NULL = too few responses.
