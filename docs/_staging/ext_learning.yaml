  description: Inbound provider event; idempotent by (integration, external event id) and replayable.
  ttl:
    expire_after: 90 days
    column: expires_at
  columns:
  - name: learning_provider_integration_id
    desc: Integration it arrived on.
    sens: Internal
    type: UUID
    domain: identifier
  - name: external_event_ref
    desc: Provider event id (idempotency key).
    sens: Internal
    type: STRING(150)
    domain: free_text
  - name: provider_sync_event_type_id
    desc: Event type.
    sens: Internal
    type: UUID
    domain: enum_ref
  - name: provider_sync_status_id
    desc: Processing state.
    sens: Internal
    type: UUID
    domain: enum_ref
  - name: payload
    desc: Raw provider payload.
    sens: Personal
    type: JSONB
    domain: json
    pii: may contain learner identifiers; access-controlled, 90-day TTL
  - name: received_at
    desc: Receipt time.
    sens: Internal
    type: TIMESTAMPTZ
    domain: timestamp
    default: now()
  - name: processed_at
    desc: Processing time.
    sens: Internal
    type: TIMESTAMPTZ
    domain: timestamp
    'null': true
    null_why: NULL = not processed.
  - name: attempt_count
    desc: Processing attempts.
    sens: Internal
    type: INT2
    domain: quantity
    default: '0'
  - name: failure_reason
    desc: Last failure.
    sens: Internal
    type: STRING(500)
    domain: free_text
    'null': true
    null_why: NULL = no failure.
  - name: expires_at
    desc: Row-level TTL expiry.
    sens: Internal
    type: TIMESTAMPTZ
    domain: timestamp
    default: now() + INTERVAL '90 days'
  constraints:
  - name: uq_course_sync_event_learning_provider_integration_id_external_event_ref
    type: unique
    columns:
    - learning_provider_integration_id
    - external_event_ref
    desc: Replay of the same provider event is ignored (idempotency).
  indexes:
  - name: idx_course_sync_event_provider_sync_status_id_received_at
    columns:
    - provider_sync_status_id
    - received_at
    desc: Retry queue.
    where: provider_sync_status_id IS NOT NULL AND processed_at IS NULL
  - name: idx_course_sync_event_received_at
    columns:
    - received_at
    desc: Time-ordered ingestion.
    hash: true
    bucket_count: 16
  fks:
  - name: fk_course_sync_event_learning_provider_integration_id
    columns:
    - learning_provider_integration_id
    ref: learning_provider_integration
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: 'Child data of learning_provider_integration: follows its parent.'
  - name: fk_course_sync_event_provider_sync_event_type_id
    columns:
    - provider_sync_event_type_id
    ref: provider_sync_event_type
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'Lookup provider_sync_event_type: retire values instead of deleting.'
    index_exempt: low-cardinality lookup; RESTRICT check is a point read on the lookup PK
  - name: fk_course_sync_event_provider_sync_status_id
    columns:
