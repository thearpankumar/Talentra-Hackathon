- name: certificate
  kind: entity
  delete_policy: soft
  volume: high
  tier: X
  milestones:
  - B4
  - B12
  - B20
  retention: Kept for the credential lifetime plus 7 years; revoked rows retained; holder data anonymised on erasure (verification still resolves validity only).
  description: Digital certificate issued for a course, path or assessment, publicly verifiable by code.
  columns:
  - name: candidate_profile_id
    desc: Holder.
    sens: Internal
    type: UUID
    domain: identifier
  - name: certificate_template_id
    desc: Template rendered.
    sens: Internal
    type: UUID
    domain: identifier
  - name: certificate_status_id
    desc: State.
    sens: Internal
    type: UUID
    domain: enum_ref
  - name: serial_no
    desc: Human-readable serial number.
    sens: Internal
    type: STRING(40)
    domain: code
  - name: verification_code
    desc: Random public verification code (printed on the certificate / QR).
    sens: Internal
    type: STRING(32)
    domain: code
  - name: title
    desc: Credential title.
    sens: Internal
    type: STRING(200)
    domain: free_text
  - name: course_id
    desc: Source course.
    sens: Internal
    type: UUID
    domain: identifier
    'null': true
    null_why: NULL = other source.
  - name: learning_path_id
    desc: Source path.
    sens: Internal
    type: UUID
    domain: identifier
    'null': true
    null_why: NULL = other source.
  - name: assessment_attempt_id
    desc: Source assessment attempt.
    sens: Internal
    type: UUID
    domain: identifier
    'null': true
    null_why: NULL = other source.
  - name: skill_id
    desc: Skill certified.
    sens: Internal
    type: UUID
    domain: identifier
    'null': true
    null_why: NULL = multi-skill.
  - name: score_percent
    desc: Score achieved.
    sens: Internal
    type: DECIMAL(5,2)
    domain: percentage
    'null': true
    null_why: NULL = non-scored.
  - name: issued_at
    desc: Issue time.
    sens: Internal
    type: TIMESTAMPTZ
    domain: timestamp
    default: now()
  - name: expires_at
    desc: Expiry.
    sens: Internal
    type: TIMESTAMPTZ
    domain: timestamp
    'null': true
    null_why: NULL = does not expire.
  - name: content_hash
    desc: SHA-256 of canonical certificate content (tamper evidence).
    sens: Internal
    type: STRING(64)
    domain: code
  - name: candidate_certification_id
    desc: Profile certification entry created from it.
    sens: Internal
    type: UUID
    domain: identifier
    'null': true
    null_why: NULL = holder has not added it to profile.
  - name: candidate_media_file_id
    desc: Rendered PDF file.
    sens: Internal
    type: UUID
    domain: identifier
    'null': true
    null_why: NULL = not rendered yet.
  - name: revoked_at
    desc: Revocation time.
    sens: Internal
    type: TIMESTAMPTZ
    domain: timestamp
    'null': true
    null_why: NULL = not revoked.
  - name: certificate_revocation_reason_id
    desc: Revocation reason.
    sens: Internal
    type: UUID
    domain: enum_ref
    'null': true
    null_why: NULL = not revoked.
  constraints:
  - name: ck_certificate_score_percent_range
    type: check
    expr: score_percent IS NULL OR score_percent BETWEEN 0 AND 100
    desc: Percentage range 0..100.
  - name: ck_certificate_expiry_after_issue
    type: check
    expr: expires_at IS NULL OR expires_at >= issued_at
    desc: Expiry after issue.
  - name: ck_certificate_one_source
    type: check
    expr: num_nonnulls(course_id, learning_path_id, assessment_attempt_id) <= 1
    desc: At most one source.
  - name: ck_certificate_revoked_consistent
    type: check
    expr: (revoked_at IS NULL) = (certificate_revocation_reason_id IS NULL)
    desc: Reason present iff revoked.
  indexes:
  - name: uq_certificate_serial_no
    columns:
    - serial_no
    unique: true
    where: deleted_at IS NULL
    desc: Serial unique.
  - name: uq_certificate_verification_code
    columns:
    - verification_code
    unique: true
    where: deleted_at IS NULL
    desc: Public verification code unique (impossible to reuse).
  - name: idx_certificate_candidate_profile_id_issued_at
    columns:
    - candidate_profile_id
    - issued_at DESC
    desc: Holder wallet.
    where: deleted_at IS NULL
  - name: idx_certificate_course_id
    columns:
    - course_id
    desc: Certificates per course.
    where: course_id IS NOT NULL
  - name: idx_certificate_learning_path_id
    columns:
    - learning_path_id
    desc: Certificates per path.
    where: learning_path_id IS NOT NULL
  - name: idx_certificate_assessment_attempt_id
    columns:
    - assessment_attempt_id
    desc: Certificates per attempt.
    where: assessment_attempt_id IS NOT NULL
  - name: idx_certificate_issued_at
    columns:
    - issued_at
    desc: Time-ordered issuance scan.
    hash: true
    bucket_count: 16
  - name: idx_certificate_certificate_template_id
