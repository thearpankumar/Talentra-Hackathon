views:
- name: vw_course_catalogue_public
  kind: view
  tables:
  - course_list_price
  - course_review
  - course_skill
  purpose: Public catalogue with current price and average rating.
  security: SELECT for application read role; excludes soft-deleted rows.
  sql_sketch: SELECT c.id, c.title, p.list_amount, avg(r.rating) FROM course c LEFT JOIN course_list_price p ON p.course_id=c.id AND p.valid_to IS NULL LEFT JOIN course_review r ON r.course_id=c.id AND
    r.content_review_status_id=<approved> GROUP BY ...
- name: vw_candidate_learning_transcript
  kind: view
  tables:
  - learning_path_enrolment
  - certificate
  - candidate_skill_badge
  purpose: Per learner transcript of completed courses, paths, certificates and badges.
  security: Row filter by owner (candidate) or consented recruiter; certificates revoked are flagged not hidden.
  sql_sketch: UNION ALL of completed enrolments, path enrolments, certificates, badges for one candidate_profile_id
- name: vw_certificate_public_verification
  kind: view
  tables:
  - certificate
  - certificate_template
  purpose: Minimal public verification result by verification_code (validity, title, issue date, masked holder).
  security: Exposes no contact data; granted to the anonymous verification service role only.
  sql_sketch: SELECT verification_code, title, issued_at, expires_at, certificate_status_id FROM certificate WHERE deleted_at IS NULL
- name: vw_assessment_item_statistics
  kind: view
  tables:
  - assessment_answer
  - quiz_question
  purpose: 'Item analysis: facility, discrimination inputs and distractor frequency per question.'
  security: Assessment authors only (PRIVILEGE).
  sql_sketch: SELECT quiz_question_id, count(*), avg(is_correct::int), avg(time_spent_seconds) FROM assessment_answer WHERE graded_at IS NOT NULL GROUP BY 1
- name: vw_mentor_directory
  kind: view
  tables:
  - mentor_profile
  - mentor_skill
  - mentor_focus
  purpose: Searchable active mentors accepting requests.
  security: Excludes suspended mentors and private fields.
  sql_sketch: SELECT ... FROM mentor_profile WHERE deleted_at IS NULL AND is_accepting_requests
- name: vw_employer_learning_compliance
  kind: view
  tables:
  - learning_assignment
  purpose: Per organisation overdue/mandatory assignment status.
  security: Filtered by organisation_id of the caller (tenant isolation).
  sql_sketch: SELECT organisation_id, status, count(*) FROM learning_assignment WHERE is_mandatory GROUP BY 1,2
- name: vw_learning_leaderboard_latest
  kind: view
  tables:
  - leaderboard_snapshot
  - leaderboard_entry
  purpose: Latest snapshot per scope with anonymisation applied.
  security: Masks names where is_anonymised.
  sql_sketch: latest computed_at per (scope,period,scope_key) joined to entries
business_rules:
- id: BR-LRN-01
  rule: A certificate verification code and serial number are globally unique and never reused.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: uq_certificate_verification_code and uq_certificate_serial_no (WHERE deleted_at IS NULL); codes are random 32-char values generated app-side.
  tables:
  - certificate
  milestone: B20
- id: BR-LRN-02
  rule: A certificate has at most one source (course, path or assessment attempt) and a revoked certificate always carries a revocation reason.
  mechanism_type: CHECK
  mechanism: ck_certificate_one_source (num_nonnulls<=1); ck_certificate_revoked_consistent ((revoked_at IS NULL)=(reason IS NULL)).
  tables:
  - certificate
  milestone: B20
- id: BR-LRN-03
  rule: Certificate verification attempts and shares are immutable history.
  mechanism_type: PRIVILEGE
  mechanism: INSERT/SELECT only grants on certificate_verification and certificate_share; corrections are new rows (P5).
  tables:
  - certificate_verification
  - certificate_share
  milestone: B20
- id: BR-LRN-04
  rule: A learner has at most one progress row per lesson and one enrolment per learning path.
  mechanism_type: UNIQUE
  mechanism: uq_lesson_progress_candidate_profile_id_course_lesson_id; uq_learning_path_enrolment_learning_path_id_candidate_profile_id (partial, deleted_at IS NULL).
  tables:
  - lesson_progress
  - learning_path_enrolment
  milestone: B20
- id: BR-LRN-05
  rule: A learning path step is exactly one of a course or an assessment, with unique ordering.
  mechanism_type: CHECK
  mechanism: ck_learning_path_item_one_target ((course_id IS NOT NULL) <> (assessment_id IS NOT NULL)); uq(learning_path_id, sequence_no).
  tables:
  - learning_path_item
  milestone: B20
- id: BR-LRN-06
  rule: A course cannot be its own prerequisite and prerequisites are stated once.
  mechanism_type: CHECK
  mechanism: ck_course_prerequisite_not_self; uq(course_id, prerequisite_course_id). Longer cycles detected by an app-layer graph check on write.
  tables:
  - course_prerequisite
  milestone: B20
- id: BR-LRN-07
  rule: Prices are effective-dated; a course has at most one current price per market and access model.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: uq_course_list_price_course_id_country_id_course_access_model_id_current (course_id, country_id, course_access_model_id WHERE valid_to IS NULL AND deleted_at IS NULL) plus uq_course_list_price_course_id_country_id_course_access_model_id_valid_from and ck_course_list_price_valid_range; current row = valid_to IS NULL located by partial index; closing the old row and opening
    the new one run in one txn (P4).
  tables:
  - course_list_price
  milestone: B20
- id: BR-LRN-08
  rule: An offer discounts by percentage or fixed amount, never both, and a fixed amount needs a currency.
  mechanism_type: CHECK
  mechanism: ck_course_offer_discount_one_form; ck_course_offer_amount_needs_currency; offer_code partial unique.
  tables:
  - course_offer
  milestone: B20
- id: BR-LRN-09
  rule: One question item version is unique within its bank; edits create a new version row.
  mechanism_type: UNIQUE
  mechanism: uq_quiz_question_question_bank_id_item_code_version_no (partial); supersedes_quiz_question_id chain.
  tables:
  - quiz_question
  milestone: B20
- id: BR-LRN-10
  rule: Question text exists once per language and every option label once per language.
  mechanism_type: UNIQUE
  mechanism: uq_quiz_question_translation_quiz_question_id_language_id; uq_quiz_question_option_translation_quiz_question_option_id_language_id.
  tables:
  - quiz_question_translation
  - quiz_question_option_translation
  milestone: B20
- id: BR-LRN-11
  rule: Only one blueprint version per assessment is active at a time.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: uq_assessment_blueprint_assessment_id WHERE is_active AND deleted_at IS NULL; activation swaps in one txn (P3/P4).
  tables:
  - assessment_blueprint
  milestone: B20
- id: BR-LRN-12
  rule: A question is served at most once per sitting and each choice is selected at most once per answer.
  mechanism_type: UNIQUE
  mechanism: uq_assessment_answer_assessment_session_id_quiz_question_id; uq_assessment_answer_option_assessment_answer_id_quiz_question_option_id.
  tables:
  - assessment_answer
  - assessment_answer_option
  milestone: B20
- id: BR-LRN-13
  rule: A sitting is submitted only after it started, and scores lie within 0..max.
  mechanism_type: CHECK
  mechanism: ck_assessment_session_submit_after_start; ck_assessment_session_score_range.
  tables:
  - assessment_session
  milestone: B20
- id: BR-LRN-14
  rule: Answers after the sitting deadline are rejected.
  mechanism_type: TXN_LOCK
  mechanism: Submit txn does SELECT ... FOR UPDATE on assessment_session, compares now() with deadline_at (start + blueprint time + time_extension_seconds) and inserts/updates answers only when in time.
  tables:
  - assessment_session
  - assessment_answer
  milestone: B20
- id: BR-LRN-15
  rule: Proctoring signals are append-only and carry a severity and time offset.
  mechanism_type: PRIVILEGE
  mechanism: INSERT/SELECT-only grant on proctoring_event; evidence references purged by a 90-day JOB leaving type/time (P5).
  tables:
  - proctoring_event
  milestone: B20
- id: BR-LRN-16
  rule: Result details are unique per sitting, section and skill.
  mechanism_type: UNIQUE
  mechanism: uq_assessment_result_detail_assessment_session_id_assessment_section_id_skill_id.
  tables:
  - assessment_result_detail
  milestone: B20
- id: BR-LRN-17
  rule: A candidate holds a given skill badge once; badges expire no earlier than awarded.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: uq_candidate_skill_badge_candidate_profile_id_skill_badge_id (WHERE deleted_at IS NULL); ck_candidate_skill_badge_expiry_after_award.
  tables:
  - candidate_skill_badge
  milestone: B20
- id: BR-LRN-18
  rule: A mentor lists at most one profile per member and cannot start two sessions at the same instant.
  mechanism_type: UNIQUE
  mechanism: uq_mentor_profile_candidate_profile_id; uq_mentorship_session_mentor_profile_id_scheduled_at (partial). Interval overlap is an extension (P2 slot table).
  tables:
  - mentor_profile
  - mentorship_session
  milestone: B20
- id: BR-LRN-19
  rule: A mentee has at most one open request per mentor.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: uq_mentorship_request_mentee_candidate_profile_id_mentor_profile_id WHERE deleted_at IS NULL AND responded_at IS NULL.
  tables:
  - mentorship_request
  milestone: B20
- id: BR-LRN-20
  rule: Mentoring fee and currency are present together; ratings are 1..5; feedback unique per author and session.
  mechanism_type: CHECK
  mechanism: ck_mentorship_session_fee_pair; ck_mentorship_feedback_rating_range; uq_mentorship_feedback_mentorship_session_id_author_candidate_profile_id.
  tables:
  - mentorship_session
  - mentorship_feedback
  milestone: B20
- id: BR-LRN-21
  rule: Mentor availability windows are well-formed and not duplicated.
  mechanism_type: CHECK
  mechanism: ck_mentor_availability_window_order; ck_mentor_availability_weekday_range; uq(mentor_profile_id, weekday_no, window_start_time).
  tables:
  - mentor_availability
  milestone: B20
- id: BR-LRN-22
  rule: Article slugs are globally unique and each article has one text per language.
  mechanism_type: UNIQUE
  mechanism: uq_article_slug (partial); uq_article_translation_article_id_language_id (partial).
  tables:
  - article
  - article_translation
  milestone: B20
- id: BR-LRN-23
  rule: Article views are append-only and expire by TTL after 730 days.
  mechanism_type: TTL
  mechanism: article_view ttl_expiration_expression on expires_at; INSERT-only grants.
  tables:
  - article_view
  milestone: B20
- id: BR-LRN-24
  rule: A gap report has one line per skill and requires a target role or requirement.
  mechanism_type: CHECK
  mechanism: uq_skill_gap_item_skill_gap_report_id_skill_id; ck_skill_gap_report_one_target (num_nonnulls>=1).
  tables:
  - skill_gap_report
  - skill_gap_item
  milestone: B20
- id: BR-LRN-25
  rule: A recommendation points to exactly one course, path or assessment.
  mechanism_type: CHECK
  mechanism: ck_learning_recommendation_one_target (num_nonnulls = 1).
  tables:
  - learning_recommendation
  milestone: B20
- id: BR-LRN-26
  rule: An employer assignment targets exactly one item and is scoped to the assigning organisation.
  mechanism_type: CHECK
  mechanism: ck_learning_assignment_one_target; every read goes through vw_employer_learning_compliance filtered by organisation_id (D-11).
  tables:
  - learning_assignment
  milestone: B20
- id: BR-LRN-27
  rule: 'Provider sync events are idempotent: the same provider event id is processed once per integration.'
  mechanism_type: UNIQUE
  mechanism: uq_course_sync_event_learning_provider_integration_id_external_event_ref; consumer uses INSERT ... ON CONFLICT DO NOTHING and checks affected rows.
  tables:
  - course_sync_event
  milestone: B20
- id: BR-LRN-28
  rule: A provider has at most one live integration; credentials are references only.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: uq_learning_provider_integration_course_provider_id (WHERE deleted_at IS NULL); credential_vault_ref holds a vault pointer, never a secret.
  tables:
  - learning_provider_integration
  milestone: B20
- id: BR-LRN-29
  rule: A learner has one roll-up row per day and one streak row; longest streak is never below current.
  mechanism_type: CHECK
  mechanism: uq_learning_activity_day_candidate_profile_id_activity_date; uq_learning_streak_candidate_profile_id; ck_learning_streak_longest_ge_current.
  tables:
  - learning_activity_day
  - learning_streak
  milestone: B20
- id: BR-LRN-30
  rule: Activity emission is replay-safe.
  mechanism_type: UNIQUE
  mechanism: uq_learning_activity_event_idempotency_key (non-partial).
  tables:
  - learning_activity_event
  milestone: B20
- id: BR-LRN-31
  rule: A leaderboard snapshot is unique per scope, period, scope key and window; a learner appears once per snapshot.
  mechanism_type: UNIQUE
  mechanism: uq_leaderboard_snapshot_...; uq_leaderboard_entry_leaderboard_snapshot_id_candidate_profile_id.
  tables:
  - leaderboard_snapshot
  - leaderboard_entry
  milestone: B20
- id: BR-LRN-32
  rule: A course review is one per learner per course and publishes only after moderation.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: uq_course_review_course_id_candidate_profile_id (partial); listing indexes filter content_review_status approved.
  tables:
  - course_review
  milestone: B20
