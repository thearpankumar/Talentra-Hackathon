    desc: Declared difficulty band.
    sens: Internal
    type: UUID
    domain: enum_ref
  - name: question_status_id
    desc: Lifecycle state.
    sens: Internal
    type: UUID
    domain: enum_ref
  - name: primary_skill_id
    desc: Main skill measured.
    sens: Internal
    type: UUID
    domain: identifier
    'null': true
    null_why: NULL = generic/aptitude.
  - name: points
    desc: Maximum points.
    sens: Internal
    type: DECIMAL(6,2)
    domain: measure
    default: '1'
  - name: time_limit_seconds
    desc: Suggested time limit.
    sens: Internal
    type: INT4
    domain: quantity
    'null': true
