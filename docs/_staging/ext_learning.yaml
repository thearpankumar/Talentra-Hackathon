  - name: idx_course_offer_course_provider_id
    columns:
    - course_provider_id
    desc: 'Leading index for FK fk_course_offer_course_provider_id: child lookups and parent-side checks.'
  - name: idx_course_offer_currency_id
    columns:
    - currency_id
    desc: 'Leading index for FK fk_course_offer_currency_id: child lookups and parent-side checks.'
  fks:
  - name: fk_course_offer_course_id
    columns:
    - course_id
    ref: course
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: 'Child data of course: follows its parent.'
  - name: fk_course_offer_learning_path_id
    columns:
    - learning_path_id
    ref: learning_path
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: 'Child data of learning_path: follows its parent.'
  - name: fk_course_offer_course_provider_id
