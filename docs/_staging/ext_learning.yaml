  - name: integrity_score
    desc: Proctoring integrity score 0..100.
    sens: Internal
    type: DECIMAL(5,2)
    domain: percentage
    'null': true
    null_why: NULL = no proctoring.
  - name: proctoring_flag_count
    desc: Count of warning/critical signals (cached).
    sens: Internal
    type: INT4
    domain: quantity
    default: '0'
  - name: client_ip
    desc: IP at start.
    sens: Personal
    type: INET
    domain: ip_address
    'null': true
    null_why: NULL = not captured.
