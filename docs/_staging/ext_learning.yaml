- name: course_offer
  kind: config
  delete_policy: soft
  volume: low
  tier: X
  milestones:
  - B4
  - B12
  - B20
  retention: Kept 7 years for invoice reconciliation.
  description: Promotional offer or discount rule applied to course prices.
  columns:
  - name: course_id
    desc: Course targeted.
    sens: Internal
    type: UUID
    domain: identifier
    'null': true
    null_why: NULL = applies to a path, a provider or all courses.
  - name: learning_path_id
    desc: Path targeted.
    sens: Internal
    type: UUID
    domain: identifier
    'null': true
    null_why: NULL = not path-specific.
  - name: course_provider_id
    desc: Provider-wide offer.
    sens: Internal
    type: UUID
    domain: identifier
    'null': true
    null_why: NULL = not provider-wide.
  - name: course_offer_kind_id
    desc: Offer type.
    sens: Internal
    type: UUID
    domain: enum_ref
  - name: offer_code
    desc: Redeemable code.
    sens: Internal
    type: STRING(40)
    domain: code
    'null': true
    null_why: NULL = automatic offer.
  - name: discount_percent
    desc: Percentage discount.
    sens: Internal
    type: DECIMAL(5,2)
    domain: percentage
    'null': true
    null_why: NULL = fixed amount instead.
  - name: discount_amount
    desc: Fixed discount.
    sens: Internal
    type: DECIMAL(12,2)
    domain: money
    'null': true
    null_why: NULL = percentage instead.
  - name: currency_id
    desc: Currency of fixed discount.
    sens: Internal
    type: UUID
    domain: identifier
    'null': true
    null_why: NULL = percentage discount.
  - name: max_redemptions
    desc: Redemption cap.
    sens: Internal
    type: INT4
    domain: quantity
    'null': true
    null_why: NULL = unlimited.
  - name: redeemed_count
    desc: Redemptions so far (cached).
    sens: Internal
    type: INT4
    domain: quantity
    default: '0'
  - name: valid_from
    desc: Offer start.
    sens: Internal
    type: TIMESTAMPTZ
    domain: timestamp
    default: now()
  - name: valid_to
    desc: Offer end.
    sens: Internal
    type: TIMESTAMPTZ
    domain: timestamp
    'null': true
    null_why: NULL = open-ended.
  constraints:
  - name: ck_course_offer_discount_percent_range
    type: check
    expr: discount_percent IS NULL OR discount_percent BETWEEN 0 AND 100
    desc: Percentage range 0..100.
  - name: ck_course_offer_discount_amount_nonneg
    type: check
    expr: discount_amount IS NULL OR discount_amount >= 0
    desc: Non-negative amount.
  - name: ck_course_offer_valid_range
    type: check
    expr: valid_to IS NULL OR valid_to >= valid_from
    desc: End not before start.
  - name: ck_course_offer_discount_one_form
    type: check
    expr: (discount_percent IS NOT NULL) <> (discount_amount IS NOT NULL)
    desc: Exactly one of percent or fixed discount.
  - name: ck_course_offer_amount_needs_currency
    type: check
    expr: discount_amount IS NULL OR currency_id IS NOT NULL
    desc: Fixed discount needs currency.
  - name: ck_course_offer_target_present
    type: check
    expr: num_nonnulls(course_id, learning_path_id, course_provider_id) <= 1
    desc: At most one specific target.
  indexes:
  - name: uq_course_offer_offer_code
    columns:
