- name: candidate_contact_attempt
  kind: event
  delete_policy: append_only
  volume: very_high
  tier: '1'
  milestones:
  - B46
  - B76
  retention: TTL 24 months; contacts to blocked candidates are retained as evidence of suppression.
  description: Log of every attempt to contact a candidate, including suppressed ones.
  ttl:
    expire_after: 24 months
    column: attempted_at
  columns:
  - name: candidate_profile_id
    desc: Reference to the parent or owning row.
    sens: Internal
    type: UUID
    domain: identifier
  - name: contacter_app_user_id
    desc: Recruiter/consultant/employer.
    sens: Internal
    type: UUID
    domain: identifier
  - name: organisation_id
    desc: Contacter tenant.
    sens: Internal
    type: UUID
    domain: identifier
    'null': true
    null_why: NULL = independent consultant.
  - name: notification_channel_id
    desc: Channel.
    sens: Internal
    type: UUID
    domain: enum_ref
  - name: contact_attempt_outcome_id
    desc: Outcome; suppressed_blocked when a block applied.
    sens: Internal
    type: UUID
    domain: enum_ref
  - name: outreach_recipient_id
    desc: Originating bulk outreach.
    sens: Internal
    type: UUID
    domain: identifier
    'null': true
    null_why: NULL = one-to-one contact.
  - name: sourcing_request_id
    desc: Request context.
    sens: Internal
    type: UUID
    domain: identifier
    'null': true
    null_why: NULL = not under a sourcing request.
  - name: block_checked_at
    desc: When the block/consent check ran (always before send).
    sens: Internal
    type: TIMESTAMPTZ
    domain: timestamp
  - name: attempted_at
    desc: Attempt time.
    sens: Internal
    type: TIMESTAMPTZ
    domain: timestamp
    default: now()
  constraints:
  - name: ck_candidate_contact_attempt_check_before_attempt
    type: check
    expr: block_checked_at <= attempted_at
    desc: Block check precedes the attempt.
  indexes:
  - name: idx_candidate_contact_attempt_candidate_profile_id_attempted_at
    columns:
    - candidate_profile_id
    - attempted_at DESC
    desc: Frequency cap / candidate view of who contacted them.
  - name: idx_candidate_contact_attempt_contacter_app_user_id_attempted_at
    columns:
    - contacter_app_user_id
    - attempted_at DESC
    desc: Activity of a recruiter.
  - name: idx_candidate_contact_attempt_attempted_at
    columns:
    - attempted_at
    desc: Sharded time scan.
    hash: true
    bucket_count: 16
  - name: idx_candidate_contact_attempt_organisation_id
    columns:
    - organisation_id
    desc: Tenant activity.
    where: organisation_id IS NOT NULL
  - name: idx_candidate_contact_attempt_outreach_recipient_id
    columns:
    - outreach_recipient_id
    desc: From bulk outreach.
    where: outreach_recipient_id IS NOT NULL
  - name: idx_candidate_contact_attempt_sourcing_request_id
    columns:
    - sourcing_request_id
    desc: Under request.
    where: sourcing_request_id IS NOT NULL
  - name: idx_candidate_contact_attempt_notification_channel_id
    columns:
    - notification_channel_id
    desc: Leading index for FK fk_candidate_contact_attempt_notification_channel_id (child lookup / FK check).
  - name: idx_candidate_contact_attempt_contact_attempt_outcome_id
    columns:
    - contact_attempt_outcome_id
    desc: Leading index for FK fk_candidate_contact_attempt_contact_attempt_outcome_id (child lookup / FK check).
  fks:
  - name: fk_candidate_contact_attempt_candidate_profile_id
    columns:
    - candidate_profile_id
    ref: candidate_profile
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: candidate_profile_id -> candidate_profile; delete rule RESTRICT (see table description)
  - name: fk_candidate_contact_attempt_contacter_app_user_id
    columns:
    - contacter_app_user_id
    ref: app_user
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: contacter_app_user_id -> app_user; delete rule RESTRICT (see table description)
  - name: fk_candidate_contact_attempt_organisation_id
    columns:
    - organisation_id
    ref: organisation
    ref_columns:
