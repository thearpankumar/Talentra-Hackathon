tables:
- name: consultant_profile
  kind: entity
  delete_policy: soft
  volume: medium
  tier: '1'
  milestones:
  - B37
  - B40
  - B76
  retention: Soft-deleted on deactivation; anonymised (display_name, headline) on erasure request.
  description: Freelance recruiter (consultant) profile; one per user.
  columns:
  - name: app_user_id
    desc: The consultant user account.
    sens: Internal
    type: UUID
    domain: identifier
  - name: organisation_id
    desc: Agency organisation, if the consultant works for one.
    sens: Internal
    type: UUID
    domain: identifier
    'null': true
    null_why: NULL = independent freelancer.
  - name: display_name
    desc: Public display name.
    sens: Personal
    type: STRING(150)
    domain: person_name
    pii: shown to employers after a request is accepted
  - name: headline
    desc: One-line pitch.
    sens: Internal
    type: STRING(200)
    domain: free_text
    'null': true
    null_why: NULL = not provided.
  - name: years_experience
    desc: Years of recruiting experience.
    sens: Internal
    type: INT4
    domain: quantity
    'null': true
    null_why: NULL = not disclosed.
  - name: commission_model_id
    desc: Preferred commission model.
    sens: Internal
    type: UUID
    domain: enum_ref
  - name: default_commission_percentage
    desc: Default commission % of annual CTC.
    sens: Internal
    type: DECIMAL(5,2)
    domain: percentage
    'null': true
    null_why: NULL = model is not percentage-based.
  - name: default_fixed_fee
    desc: Default fixed fee per hire.
    sens: Internal
    type: DECIMAL(18,4)
    domain: money
    'null': true
    null_why: NULL = model is not fixed-fee.
  - name: currency_id
    desc: Currency of the fixed fee.
    sens: Internal
    type: UUID
    domain: identifier
  - name: verification_status_id
    desc: Platform verification of the consultant.
    sens: Internal
    type: UUID
    domain: enum_ref
  - name: verified_at
    desc: When verified.
    sens: Internal
    type: TIMESTAMPTZ
    domain: timestamp
    'null': true
    null_why: NULL = not verified.
  - name: is_accepting_requests
    desc: Open to new sourcing requests.
    sens: Internal
    type: BOOL
    domain: boolean
    default: 'true'
  - name: rating_average
    desc: Average of consultant_rating scores (0..5, derived).
    sens: Internal
    type: DECIMAL(9,2)
    domain: measure
    'null': true
    null_why: NULL = no ratings yet.
  - name: rating_count
    desc: Number of ratings (derived).
    sens: Internal
    type: INT4
    domain: quantity
    default: '0'
  constraints:
  - name: uq_consultant_profile_id_app_user_id
    type: unique
    columns:
    - id
    - app_user_id
    desc: Target of composite FK from sourcing_request.
  - name: ck_consultant_profile_commission_pct_range
    type: check
    expr: default_commission_percentage IS NULL OR (default_commission_percentage >= 0 AND default_commission_percentage <= 100)
    desc: Percentage 0..100.
  - name: ck_consultant_profile_rating_range
    type: check
    expr: rating_average IS NULL OR (rating_average >= 0 AND rating_average <= 5)
    desc: Rating 0..5.
  - name: ck_consultant_profile_fee_nonneg
    type: check
    expr: default_fixed_fee IS NULL OR default_fixed_fee >= 0
    desc: Non-negative fee.
  indexes:
  - name: uq_consultant_profile_app_user_id
    columns:
    - app_user_id
    unique: true
    where: deleted_at IS NULL
    desc: One live consultant profile per user.
  - name: idx_consultant_profile_verification_status_id_is_accepting_requests
    columns:
    - verification_status_id
    - is_accepting_requests
    desc: Directory of verifiable, available consultants.
    where: deleted_at IS NULL
  - name: idx_consultant_profile_organisation_id
    columns:
    - organisation_id
    desc: Agency roster.
    where: organisation_id IS NOT NULL
  - name: idx_consultant_profile_currency_id
    columns:
    - currency_id
    desc: FK index.
  - name: idx_consultant_profile_commission_model_id
    columns:
    - commission_model_id
    desc: Leading index for FK fk_consultant_profile_commission_model_id (child lookup / FK check).
  fks:
  - name: fk_consultant_profile_app_user_id
    columns:
    - app_user_id
    ref: app_user
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: app_user_id -> app_user; delete rule RESTRICT (see table description)
  - name: fk_consultant_profile_organisation_id
    columns:
    - organisation_id
    ref: organisation
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: organisation_id -> organisation; delete rule RESTRICT (see table description)
  - name: fk_consultant_profile_commission_model_id
    columns:
    - commission_model_id
    ref: commission_model
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: commission_model_id -> commission_model; delete rule RESTRICT (see table description)
  - name: fk_consultant_profile_currency_id
    columns:
    - currency_id
    ref: currency
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: currency_id -> currency; delete rule RESTRICT (see table description)
  - name: fk_consultant_profile_verification_status_id
    columns:
    - verification_status_id
    ref: verification_status
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: verification_status_id -> verification_status; delete rule RESTRICT (see table description)
- name: consultant_specialisation
  kind: entity
  delete_policy: hard
  volume: low
  tier: '1'
  milestones:
  - B37
  retention: Deleted with the consultant profile.
  description: Job categories and industries a consultant specialises in.
  columns:
  - name: consultant_profile_id
    desc: Consultant.
    sens: Internal
    type: UUID
    domain: identifier
  - name: job_category_id
    desc: Category.
    sens: Internal
    type: UUID
    domain: identifier
  - name: industry_id
    desc: Industry focus.
    sens: Internal
    type: UUID
    domain: identifier
    'null': true
    null_why: NULL = any industry within the category.
  - name: years_in_domain
    desc: Years in the domain.
    sens: Internal
    type: INT4
    domain: quantity
    'null': true
    null_why: NULL = not stated.
  constraints:
  - name: uq_consultant_specialisation_consultant_profile_id_job_category_id_industry_id
    type: unique
    columns:
    - consultant_profile_id
    - job_category_id
    - industry_id
    desc: No duplicate specialisation.
  indexes:
  - name: idx_consultant_specialisation_job_category_id
    columns:
    - job_category_id
    desc: Find consultants by category.
  - name: idx_consultant_specialisation_industry_id
    columns:
    - industry_id
    desc: Find consultants by industry.
    where: industry_id IS NOT NULL
  fks:
  - name: fk_consultant_specialisation_consultant_profile_id
    columns:
    - consultant_profile_id
    ref: consultant_profile
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: consultant_profile_id -> consultant_profile; delete rule CASCADE (see table description)
  - name: fk_consultant_specialisation_job_category_id
    columns:
    - job_category_id
    ref: job_category
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: job_category_id -> job_category; delete rule RESTRICT (see table description)
  - name: fk_consultant_specialisation_industry_id
    columns:
    - industry_id
    ref: industry
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: industry_id -> industry; delete rule RESTRICT (see table description)
- name: consultant_desk
  kind: entity
  delete_policy: soft
  volume: low
  tier: '1'
  milestones:
  - B37
  retention: Soft-deleted; purged with profile.
  description: A recruiting desk (geography + domain) a consultant operates.
  columns:
  - name: consultant_profile_id
    desc: Consultant.
    sens: Internal
    type: UUID
    domain: identifier
  - name: desk_name
    desc: Desk name, e.g. Pune IT contract.
    sens: Internal
    type: STRING(120)
    domain: free_text
  - name: country_id
    desc: Country covered.
    sens: Internal
    type: UUID
    domain: identifier
  - name: job_category_id
    desc: Category covered.
    sens: Internal
    type: UUID
    domain: identifier
    'null': true
    null_why: NULL = all categories.
  constraints: []
  indexes:
  - name: uq_consultant_desk_consultant_profile_id_desk_name
    columns:
    - consultant_profile_id
    - desk_name
    unique: true
    where: deleted_at IS NULL
    desc: Unique desk name per consultant.
  - name: idx_consultant_desk_country_id
    columns:
    - country_id
    desc: Desks by country.
  - name: idx_consultant_desk_job_category_id
    columns:
    - job_category_id
    desc: Desks by category.
    where: job_category_id IS NOT NULL
  fks:
  - name: fk_consultant_desk_consultant_profile_id
    columns:
    - consultant_profile_id
    ref: consultant_profile
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: consultant_profile_id -> consultant_profile; delete rule CASCADE (see table description)
  - name: fk_consultant_desk_country_id
    columns:
    - country_id
    ref: country
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: country_id -> country; delete rule RESTRICT (see table description)
  - name: fk_consultant_desk_job_category_id
    columns:
    - job_category_id
    ref: job_category
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: job_category_id -> job_category; delete rule RESTRICT (see table description)
- name: consultant_job_openness
  kind: entity
  delete_policy: soft
  volume: medium
  tier: '1'
  milestones:
  - B37
  - B46
  - B76
  retention: Soft-deleted; kept 7 years for fee dispute evidence.
  description: A job requirement opened to consultants for a time window (all verified consultants or one named consultant).
  columns:
  - name: job_requirement_id
    desc: Requirement made available to consultants.
    sens: Internal
    type: UUID
    domain: identifier
  - name: organisation_id
    desc: Tenant owning the requirement.
    sens: Internal
    type: UUID
    domain: identifier
  - name: consultant_profile_id
    desc: Specific consultant invited.
    sens: Internal
    type: UUID
    domain: identifier
    'null': true
    null_why: NULL = open to all verified consultants.
  - name: opened_by_app_user_id
    desc: Employer/recruiter who opened it.
    sens: Internal
    type: UUID
    domain: identifier
  - name: valid_from
    desc: Window start.
    sens: Internal
    type: TIMESTAMPTZ
    domain: timestamp
    default: now()
  - name: valid_to
    desc: Window end.
    sens: Internal
    type: TIMESTAMPTZ
    domain: timestamp
    'null': true
    null_why: NULL = open-ended/ongoing until closed.
  - name: closed_at
    desc: When closed (flag turned off or job closed).
    sens: Internal
    type: TIMESTAMPTZ
    domain: timestamp
    'null': true
    null_why: NULL = still open.
  - name: max_consultants
    desc: Max concurrent consultants.
    sens: Internal
    type: INT4
    domain: quantity
    'null': true
    null_why: NULL = unlimited.
  - name: offered_commission_percentage
    desc: Fee offered as % of CTC.
    sens: Internal
    type: DECIMAL(5,2)
    domain: percentage
    'null': true
    null_why: NULL = not percentage-based.
  - name: offered_fixed_fee
    desc: Fixed fee offered.
    sens: Internal
    type: DECIMAL(18,4)
    domain: money
    'null': true
    null_why: NULL = not fixed-fee.
  - name: currency_id
    desc: Currency of the fixed fee.
    sens: Internal
    type: UUID
    domain: identifier
  constraints:
  - name: uq_consultant_job_openness_job_requirement_id_id
    type: unique
    columns:
    - job_requirement_id
    - id
    desc: Target of composite FK from sourcing_request (request must reference openness of the same requirement).
  - name: ck_consultant_job_openness_valid_range
    type: check
    expr: valid_to IS NULL OR valid_to >= valid_from
    desc: Window order.
  - name: ck_consultant_job_openness_closed_range
    type: check
    expr: closed_at IS NULL OR closed_at >= valid_from
    desc: Close after open.
  - name: ck_consultant_job_openness_commission_pct_range
    type: check
    expr: offered_commission_percentage IS NULL OR (offered_commission_percentage >= 0 AND offered_commission_percentage <= 100)
    desc: Percentage 0..100.
  - name: ck_consultant_job_openness_max_consultants_positive
    type: check
    expr: max_consultants IS NULL OR max_consultants > 0
    desc: Positive when set.
  indexes:
  - name: uq_consultant_job_openness_job_requirement_id
    columns:
    - job_requirement_id
    unique: true
    where: consultant_profile_id IS NULL AND closed_at IS NULL AND deleted_at IS NULL
    desc: At most one open all-consultants window per requirement.
  - name: uq_consultant_job_openness_job_requirement_id_consultant_profile_id
    columns:
    - job_requirement_id
    - consultant_profile_id
    unique: true
    where: consultant_profile_id IS NOT NULL AND closed_at IS NULL AND deleted_at IS NULL
    desc: At most one open invitation per consultant per requirement.
  - name: idx_consultant_job_openness_organisation_id_closed_at
    columns:
    - organisation_id
    - closed_at
    desc: Tenant listing.
  - name: idx_consultant_job_openness_consultant_profile_id
    columns:
    - consultant_profile_id
    desc: Invitations of a consultant.
    where: consultant_profile_id IS NOT NULL
