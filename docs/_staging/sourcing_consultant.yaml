    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: organisation_id -> organisation; delete rule RESTRICT (see table description)
  - name: fk_outreach_batch_sourcing_request_id
    columns:
    - sourcing_request_id
