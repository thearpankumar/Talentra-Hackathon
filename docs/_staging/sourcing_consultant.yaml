    domain: identifier
    'null': true
    null_why: NULL = employer/recruiter batch.
  - name: job_requirement_id
    desc: Job being promoted.
    sens: Internal
    type: UUID
    domain: identifier
    'null': true
    null_why: NULL = general talent outreach.
  - name: is_consultant_sender
    desc: True when sent by a consultant (requires sourcing_request_id).
    sens: Internal
    type: BOOL
    domain: boolean
    default: 'false'
  - name: notification_channel_id
    desc: Channel (email, SMS, in-app, chat).
    sens: Internal
    type: UUID
    domain: enum_ref
  - name: outreach_template_id
    desc: Template used.
    sens: Internal
    type: UUID
    domain: identifier
