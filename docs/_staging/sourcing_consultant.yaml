    desc: Consultant batches only under a sourcing request (open-to-consultants rule).
  - name: ck_outreach_batch_credits_nonneg
    type: check
    expr: credits_per_recipient >= 0 AND credits_reserved >= 0 AND recipient_count >= 0
    desc: Non-negative counts.
  - name: ck_outreach_batch_completed_range
    type: check
    expr: completed_at IS NULL OR started_at IS NOT NULL
    desc: Cannot complete without start.
