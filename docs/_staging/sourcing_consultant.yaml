    on_delete: RESTRICT
    on_update: RESTRICT
    desc: organisation_id -> organisation; delete rule RESTRICT (see table description)
  - name: fk_candidate_contact_attempt_notification_channel_id
    columns:
    - notification_channel_id
    ref: notification_channel
    ref_columns:
