views:
- name: vw_consultant_open_requirement
  kind: view
  tables:
  - consultant_job_openness
  - job_requirement
  - consultant_profile
  purpose: Only requirements currently open to consultants for the calling consultant (all-consultants windows or personal invitations).
  security: Consultant app role can SELECT only this view, never job_requirement; filter by session consultant_profile.
  sql_sketch: SELECT o.* FROM consultant_job_openness o WHERE o.closed_at IS NULL AND o.deleted_at IS NULL AND o.valid_from <= now() AND (o.valid_to IS NULL OR o.valid_to > now()) AND (o.consultant_profile_id
    IS NULL OR o.consultant_profile_id = current_consultant_profile())
- name: vw_outreach_eligible_candidate
  kind: view
  tables:
  - candidate_profile
  - outreach_batch
  purpose: 'Candidates a sender may contact: not blocked (user_block/organisation_block), consent present, not contacted recently.'
  security: Outreach insert path reads only this view; blocked rows never visible to the sender.
  sql_sketch: SELECT cp.id FROM candidate_profile cp WHERE NOT EXISTS (SELECT 1 FROM user_block b WHERE b.candidate_profile_id=cp.id AND b.blocked_app_user_id=$sender) AND NOT EXISTS (SELECT 1 FROM organisation_block
    ob WHERE ob.candidate_profile_id=cp.id AND ob.organisation_id=$org)
- name: vw_sourcing_request_summary
  kind: view
  tables:
  - sourcing_request
  - sourcing_submission
  - sourcing_commission
  purpose: Request with submission and hire counts and commission total.
  security: Employer tenant and consultant parties only.
  sql_sketch: SELECT sr.id, count(ss.id) AS submissions FROM sourcing_request sr LEFT JOIN sourcing_submission ss ON ss.sourcing_request_id = sr.id GROUP BY sr.id
business_rules:
- id: BR-SRC-01
  rule: A consultant may only work on requirements open to consultants.
  mechanism_type: CHAIN_FK
  mechanism: sourcing_request has composite FK (job_requirement_id, consultant_job_openness_id) -> consultant_job_openness(job_requirement_id, id) [UNIQUE(job_requirement_id,id)], so a request can only
    point to an openness row of the same requirement; partial uniques allow one live all-consultant window and one live invitation per consultant per requirement. All consultant read access goes through
    vw_consultant_open_requirement (closed_at IS NULL, window valid).
  tables:
  - sourcing_request
  - consultant_job_openness
  milestone: B46
- id: BR-SRC-02
  rule: Openness rows exist only for requirements with is_open_to_consultants = true.
  mechanism_type: TXN_LOCK
  mechanism: 'Open txn: SELECT is_open_to_consultants FROM job_requirement WHERE id=$1 FOR UPDATE; abort if false; INSERT consultant_job_openness. Close txn (flag set false or job closed): same lock, UPDATE
    consultant_job_openness SET closed_at=now() WHERE job_requirement_id=$1 AND closed_at IS NULL; UPDATE sourcing_request SET closed_at=now(), sourcing_request_status_id=closed WHERE job_requirement_id=$1
    AND closed_at IS NULL; retry on 40001. Hardening option: a trigger on job_requirement; not relied upon (D-01).'
  tables:
  - consultant_job_openness
  - sourcing_request
  - job_requirement
  milestone: B46
- id: BR-SRC-03
  rule: One live sourcing request per consultant per requirement.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: uq_sourcing_request_job_requirement_id_consultant_profile_id UNIQUE (job_requirement_id, consultant_profile_id) WHERE closed_at IS NULL AND deleted_at IS NULL.
  tables:
  - sourcing_request
  milestone: B37
- id: BR-SRC-04
  rule: Consultant identity on a request is consistent.
  mechanism_type: CHAIN_FK
  mechanism: Composite FK (consultant_profile_id, consultant_app_user_id) -> consultant_profile(id, app_user_id).
  tables:
  - sourcing_request
  - consultant_profile
  milestone: B37
- id: BR-SRC-05
  rule: Acceptance/decline decisions are append-only and reasoned.
  mechanism_type: PRIVILEGE
  mechanism: sourcing_request_decision INSERT/SELECT grants only; status on sourcing_request updated in the same txn; declines carry sourcing_decision_reason_id (app-validated, NULL only for acceptances).
    Audit event written for every decision.
  tables:
  - sourcing_request_decision
  - sourcing_request
  milestone: B43
- id: BR-SRC-06
  rule: Blocked candidates are never contacted by outreach.
  mechanism_type: VIEW
  mechanism: 'Recipient admission: INSERT INTO outreach_recipient SELECT ... FROM vw_outreach_eligible_candidate e WHERE e.id = ANY($candidates) (NOT EXISTS user_block / organisation_block for sender user,
    tenant and consultant); rejected candidates INSERT INTO outreach_exclusion(reason blocked/opted_out/no_consent). Dispatcher re-runs the same predicate immediately before send; on hit sets outreach_delivery_status=suppressed
    and logs candidate_contact_attempt(suppressed_blocked). ck_candidate_contact_attempt_check_before_attempt proves the check ran.'
  tables:
  - outreach_recipient
  - outreach_exclusion
  - candidate_contact_attempt
  milestone: B46
- id: BR-SRC-07
  rule: A candidate appears once per batch.
  mechanism_type: UNIQUE
  mechanism: uq_outreach_recipient_outreach_batch_id_candidate_profile_id UNIQUE (outreach_batch_id, candidate_profile_id).
  tables:
  - outreach_recipient
  milestone: B37
- id: BR-SRC-08
  rule: Consultant outreach requires a sourcing request.
  mechanism_type: CHECK
  mechanism: 'ck_outreach_batch_consultant_needs_request: NOT is_consultant_sender OR sourcing_request_id IS NOT NULL; the request must be live (app guard in dispatch txn re-reads sourcing_request.closed_at
    IS NULL FOR SHARE).'
  tables:
  - outreach_batch
  milestone: B46
- id: BR-SRC-09
  rule: Outreach credits are charged idempotently against the wallet.
  mechanism_type: TXN_LOCK
  mechanism: 'Batch scheduling txn: SELECT wallet ... FOR UPDATE (subscriptions module); insert wallet_ledger_entry (reserve) and outreach_credit_usage(reserve, wallet_ledger_entry_id, idempotency_key);
    per delivery consume; unused released; reply refund as new row (refund_on_reply) within configurable window. uq_outreach_credit_usage_idempotency_key blocks double charge on retry; wallet CHECK balance
    >= 0 blocks overspend (D-14).'
  tables:
  - outreach_credit_usage
  - outreach_batch
  milestone: B43
- id: BR-SRC-10
  rule: Message bodies are retained only for the audit window.
  mechanism_type: TTL
  mechanism: outreach_message TTL 90 days (rendered_at); outreach_reply 180 days; candidate_search_history and candidate_contact_attempt 24 months; saved_search_run 180 days.
  tables:
  - outreach_message
  - outreach_reply
  - candidate_search_history
  - candidate_contact_attempt
  - saved_search_run
  milestone: B43
- id: BR-SRC-11
  rule: A candidate can be submitted to an employer only with consent.
  mechanism_type: FK
  mechanism: sourcing_submission.user_consent_id NOT NULL FK -> user_consent; app validates consent type and not withdrawn at submit; unique (sourcing_request_id, candidate_profile_id) live.
  tables:
  - sourcing_submission
  milestone: B40
- id: BR-SRC-12
  rule: Sourcing shortlists reference the jobs-module shortlist.
  mechanism_type: FK
  mechanism: sourcing_shortlist.job_shortlist_id NOT NULL FK -> job_shortlist, partial unique per live row; items unique per (shortlist, candidate).
  tables:
  - sourcing_shortlist
  - sourcing_shortlist_item
  milestone: B40
- id: BR-SRC-13
  rule: Recruiters cannot register candidates.
  mechanism_type: PRIVILEGE
  mechanism: Recruiter/consultant roles have no INSERT on candidate_profile; every candidate reference in this module is an FK to an existing candidate_profile.
  tables:
  - outreach_recipient
  - sourcing_shortlist_item
  - talent_pool_member
  milestone: B46
- id: BR-SRC-14
  rule: Fee and percentage values are bounded.
  mechanism_type: CHECK
  mechanism: Percentages CHECK 0..100; fixed fees >= 0; sourcing_request requires at least one fee term (ck_sourcing_request_fee_present).
  tables:
  - sourcing_request
  - sourcing_commission
  - consultant_job_openness
  milestone: B40
- id: BR-SRC-15
  rule: Candidate private data of recruiters is tenant-scoped and erasable.
  mechanism_type: APP_LAYER
  mechanism: candidate_note, candidate_rating, candidate_tag_assignment, talent_pool_member rows are filtered by organisation_id/author in the access layer and deleted/anonymised by the erasure job; blocked-candidate
    sweep job removes pool memberships and shortlist items of senders the candidate blocks.
  tables:
  - candidate_note
  - candidate_rating
  - candidate_tag_assignment
  - talent_pool_member
  milestone: B46
- id: BR-SRC-16
  rule: Commission is posted once per hire.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: uq_sourcing_commission_sourcing_submission_id WHERE deleted_at IS NULL; invoice_id filled when invoiced; corrections soft-delete + new row (ledger entry in subscriptions).
  tables:
  - sourcing_commission
  milestone: B40
