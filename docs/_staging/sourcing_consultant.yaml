    sens: Internal
    type: JSONB
    domain: json
    'null': true
    null_why: NULL = hand-picked recipients.
  - name: credits_per_recipient
    desc: Credits charged per delivered message (1 for email, more for InMail-like).
    sens: Internal
    type: INT4
    domain: quantity
    default: '1'
  - name: credits_reserved
    desc: Credits reserved at scheduling.
    sens: Internal
    type: INT4
    domain: quantity
    default: '0'
  - name: recipient_count
    desc: Recipients admitted (after exclusions).
    sens: Internal
    type: INT4
    domain: quantity
    default: '0'
  - name: scheduled_at
    desc: Planned send time.
    sens: Internal
    type: TIMESTAMPTZ
    domain: timestamp
    'null': true
    null_why: NULL = send immediately.
  - name: started_at
    desc: Dispatch start.
    sens: Internal
    type: TIMESTAMPTZ
    domain: timestamp
    'null': true
    null_why: NULL = not started.
  - name: completed_at
