- name: sourcing_request
  kind: entity
  delete_policy: soft
  volume: medium
  tier: '1'
  milestones:
  - B37
  - B40
  - B46
  - B76
  retention: Soft-deleted; kept 7 years (fee evidence); erasure of linked candidates handled in children.
  description: An employer/recruiter asks a consultant to source candidates for a job requirement (only for requirements open to consultants).
  columns:
  - name: job_requirement_id
    desc: Requirement to source for (composite FK to openness).
    sens: Internal
    type: UUID
    domain: identifier
  - name: consultant_job_openness_id
    desc: Openness row proving the requirement is open to consultants.
    sens: Internal
    type: UUID
    domain: identifier
  - name: organisation_id
    desc: Requesting tenant.
    sens: Internal
    type: UUID
    domain: identifier
  - name: requested_by_app_user_id
    desc: Employer/recruiter making the request.
    sens: Internal
    type: UUID
    domain: identifier
  - name: consultant_profile_id
    desc: Consultant asked.
    sens: Internal
    type: UUID
    domain: identifier
  - name: consultant_app_user_id
    desc: Consultant user (bound to profile by composite FK).
    sens: Internal
    type: UUID
    domain: identifier
  - name: sourcing_request_status_id
    desc: Current status.
    sens: Internal
    type: UUID
    domain: enum_ref
  - name: positions_to_fill
    desc: Number of hires wanted.
    sens: Internal
    type: INT4
    domain: quantity
    default: '1'
  - name: commission_model_id
    desc: Agreed commission model.
    sens: Internal
    type: UUID
    domain: enum_ref
  - name: fee_commission_percentage
    desc: Agreed commission % of CTC.
    sens: Internal
    type: DECIMAL(5,2)
    domain: percentage
    'null': true
    null_why: NULL = not percentage-based.
  - name: fee_fixed_amount
    desc: Agreed fixed fee.
    sens: Internal
    type: DECIMAL(18,4)
    domain: money
    'null': true
    null_why: NULL = not fixed-fee.
  - name: currency_id
    desc: Currency of the fixed fee.
    sens: Internal
    type: UUID
    domain: identifier
  - name: response_due_at
    desc: Deadline for consultant to accept/decline.
    sens: Internal
    type: TIMESTAMPTZ
    domain: timestamp
  - name: submission_deadline_date
    desc: Deadline to submit candidates.
    sens: Internal
    type: DATE
    domain: date
    'null': true
    null_why: NULL = no deadline set.
  - name: brief_note
    desc: Instructions to the consultant.
    sens: Internal
    type: STRING(2000)
    domain: free_text
    'null': true
    null_why: NULL = none.
  - name: closed_at
    desc: When the request ended.
    sens: Internal
    type: TIMESTAMPTZ
    domain: timestamp
    'null': true
    null_why: NULL = live.
  constraints:
  - name: uq_sourcing_request_id_consultant_profile_id
    type: unique
    columns:
    - id
    - consultant_profile_id
    desc: Target for child consistency checks.
  - name: ck_sourcing_request_positions_positive
    type: check
    expr: positions_to_fill > 0
    desc: Positive count.
  - name: ck_sourcing_request_closed_range
    type: check
    expr: closed_at IS NULL OR closed_at >= created_at
    desc: Close after create.
  - name: ck_sourcing_request_fee_pct_range
    type: check
    expr: fee_commission_percentage IS NULL OR (fee_commission_percentage >= 0 AND fee_commission_percentage <= 100)
    desc: Percentage 0..100.
  - name: ck_sourcing_request_fee_fixed_nonneg
    type: check
    expr: fee_fixed_amount IS NULL OR fee_fixed_amount >= 0
    desc: Non-negative.
  - name: ck_sourcing_request_fee_present
    type: check
    expr: fee_commission_percentage IS NOT NULL OR fee_fixed_amount IS NOT NULL
    desc: A fee term must be agreed.
  indexes:
  - name: uq_sourcing_request_job_requirement_id_consultant_profile_id
    columns:
    - job_requirement_id
    - consultant_profile_id
    unique: true
    where: closed_at IS NULL AND deleted_at IS NULL
    desc: One live request per consultant per requirement.
  - name: idx_sourcing_request_consultant_profile_id_sourcing_request_status_id
    columns:
    - consultant_profile_id
    - sourcing_request_status_id
    desc: Consultant inbox.
    where: deleted_at IS NULL
  - name: idx_sourcing_request_organisation_id_sourcing_request_status_id
    columns:
    - organisation_id
    - sourcing_request_status_id
    desc: Tenant list.
    where: deleted_at IS NULL
  - name: idx_sourcing_request_consultant_job_openness_id
    columns:
    - consultant_job_openness_id
    desc: Requests per openness.
  - name: idx_sourcing_request_requested_by_app_user_id
    columns:
    - requested_by_app_user_id
    desc: By requester.
  - name: idx_sourcing_request_consultant_app_user_id
    columns:
    - consultant_app_user_id
    desc: By consultant user.
  - name: idx_sourcing_request_response_due_at
    columns:
    - response_due_at
    desc: Expiry job.
    where: closed_at IS NULL
  - name: idx_sourcing_request_currency_id
    columns:
    - currency_id
    desc: FK index.
  - name: idx_sourcing_request_sourcing_request_status_id
    columns:
    - sourcing_request_status_id
    desc: Leading index for FK fk_sourcing_request_sourcing_request_status_id (child lookup / FK check).
  - name: idx_sourcing_request_commission_model_id
    columns:
    - commission_model_id
    desc: Leading index for FK fk_sourcing_request_commission_model_id (child lookup / FK check).
  fks:
  - name: fk_sourcing_request_organisation_id
    columns:
    - organisation_id
    ref: organisation
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: organisation_id -> organisation; delete rule RESTRICT (see table description)
  - name: fk_sourcing_request_requested_by_app_user_id
    columns:
    - requested_by_app_user_id
    ref: app_user
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: requested_by_app_user_id -> app_user; delete rule RESTRICT (see table description)
  - name: fk_sourcing_request_sourcing_request_status_id
    columns:
    - sourcing_request_status_id
    ref: sourcing_request_status
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: sourcing_request_status_id -> sourcing_request_status; delete rule RESTRICT (see table description)
  - name: fk_sourcing_request_commission_model_id
    columns:
    - commission_model_id
    ref: commission_model
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: commission_model_id -> commission_model; delete rule RESTRICT (see table description)
  - name: fk_sourcing_request_currency_id
    columns:
    - currency_id
    ref: currency
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: currency_id -> currency; delete rule RESTRICT (see table description)
  - name: fk_sourcing_request_job_requirement_id_openness
    columns:
    - job_requirement_id
    - consultant_job_openness_id
    ref: consultant_job_openness
    ref_columns:
    - job_requirement_id
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Request references an openness row of the same requirement (open-to-consultants rule, BR-SRC-01).
  - name: fk_sourcing_request_consultant_profile_id_user
    columns:
    - consultant_profile_id
    - consultant_app_user_id
    ref: consultant_profile
    ref_columns:
    - id
    - app_user_id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Consultant user matches the profile.
  - name: fk_sourcing_request_job_requirement_id
    columns:
    - job_requirement_id
    ref: job_requirement
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Requirement being sourced; RESTRICT to keep fee evidence.
