- name: device_trust_challenge
  kind: entity
  delete_policy: hard
  volume: high
  tier: '1'
  milestones:
  - B45
  retention: TTL 30 days after expires_at.
  description: Challenge issued to prove possession of a new/untrusted device.
  ttl:
    expire_after: 30 days
    column: expires_at
  columns:
  - name: device_id
    desc: Device being verified.
    sens: Internal
    type: UUID
    domain: identifier
  - name: app_user_id
    desc: User.
    sens: Internal
    type: UUID
    domain: identifier
  - name: trust_challenge_type_id
    desc: Challenge type.
    sens: Internal
    type: UUID
    domain: enum_ref
  - name: trust_challenge_status_id
    desc: State.
    sens: Internal
    type: UUID
    domain: enum_ref
  - name: code_hash
    desc: Hash of the one-time code.
    sens: Sensitive
    type: BYTES
    domain: secret_hash
    pii: argon2id hash; never stored in clear
  - name: attempt_count
    desc: Wrong attempts so far.
    sens: Internal
    type: INT4
    domain: quantity
    default: '0'
  - name: ip_address
    desc: IP when issued.
    sens: Personal
    type: INET
    domain: ip_address
    pii: TTL 30 days after expiry
  - name: issued_at
    desc: Issue time.
    sens: Internal
    type: TIMESTAMPTZ
    domain: timestamp
    default: now()
  - name: expires_at
    desc: Expiry time.
    sens: Internal
    type: TIMESTAMPTZ
    domain: timestamp
  - name: solved_at
    desc: When solved.
    sens: Internal
    type: TIMESTAMPTZ
    domain: timestamp
    'null': true
    null_why: NULL = unsolved.
  constraints:
  - name: ck_device_trust_challenge_expiry_range
    type: check
    expr: expires_at >= issued_at
    desc: Expiry after issue.
  - name: ck_device_trust_challenge_attempt_nonneg
    type: check
    expr: attempt_count >= 0
    desc: Non-negative.
  indexes:
  - name: idx_device_trust_challenge_device_id_issued_at
    columns:
    - device_id
    - issued_at DESC
    desc: Challenges of a device.
  - name: idx_device_trust_challenge_app_user_id
    columns:
    - app_user_id
    desc: By user.
  - name: idx_device_trust_challenge_issued_at
    columns:
    - issued_at
    desc: Sharded time scan.
    hash: true
    bucket_count: 8
  - name: idx_device_trust_challenge_trust_challenge_type_id
    columns:
    - trust_challenge_type_id
    desc: Leading index for FK fk_device_trust_challenge_trust_challenge_type_id (child lookup / FK check).
  - name: idx_device_trust_challenge_trust_challenge_status_id
    columns:
    - trust_challenge_status_id
    desc: Leading index for FK fk_device_trust_challenge_trust_challenge_status_id (child lookup / FK check).
  fks:
  - name: fk_device_trust_challenge_device_id
    columns:
    - device_id
    ref: device
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: device_id -> device; delete rule RESTRICT (see table description)
  - name: fk_device_trust_challenge_app_user_id
    columns:
    - app_user_id
    ref: app_user
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: app_user_id -> app_user; delete rule RESTRICT (see table description)
  - name: fk_device_trust_challenge_trust_challenge_type_id
    columns:
    - trust_challenge_type_id
    ref: trust_challenge_type
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: trust_challenge_type_id -> trust_challenge_type; delete rule RESTRICT (see table description)
  - name: fk_device_trust_challenge_trust_challenge_status_id
    columns:
    - trust_challenge_status_id
    ref: trust_challenge_status
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: trust_challenge_status_id -> trust_challenge_status; delete rule RESTRICT (see table description)
- name: push_registration
  kind: entity
  delete_policy: hard
  volume: high
  tier: '1'
  milestones:
  - B45
  retention: Deleted with its device; invalidated tokens purged after 30 days.
  description: Push notification token bound to a device.
  columns:
  - name: device_id
    desc: Device.
    sens: Internal
    type: UUID
    domain: identifier
  - name: push_provider_id
    desc: Provider.
    sens: Internal
    type: UUID
    domain: enum_ref
  - name: push_token
    desc: Provider token, envelope-encrypted.
    sens: Sensitive
    type: BYTES
    domain: encrypted
    pii: AES-GCM envelope encryption
  - name: push_token_hash
    desc: SHA-256 of the token for dedupe.
    sens: Sensitive
    type: BYTES
    domain: secret_hash
    pii: hash only
  - name: registered_at
    desc: Registration time.
    sens: Internal
    type: TIMESTAMPTZ
    domain: timestamp
    default: now()
  - name: last_refreshed_at
    desc: Last token refresh.
    sens: Internal
    type: TIMESTAMPTZ
    domain: timestamp
    'null': true
    null_why: NULL = never refreshed.
  - name: invalidated_at
    desc: When provider reported invalid.
    sens: Internal
    type: TIMESTAMPTZ
    domain: timestamp
    'null': true
    null_why: NULL = still valid.
  constraints: []
  indexes:
  - name: uq_push_registration_push_provider_id_push_token_hash
    columns:
    - push_provider_id
    - push_token_hash
    unique: true
    where: invalidated_at IS NULL
    desc: One live registration per token.
  - name: idx_push_registration_device_id
    columns:
    - device_id
    desc: Tokens of a device.
    where: invalidated_at IS NULL
  - name: idx_push_registration_registered_at
    columns:
    - registered_at
    desc: Sharded time scan.
    hash: true
    bucket_count: 8
  fks:
  - name: fk_push_registration_device_id
    columns:
    - device_id
    ref: device
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: device_id -> device; delete rule CASCADE (see table description)
  - name: fk_push_registration_push_provider_id
    columns:
    - push_provider_id
    ref: push_provider
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: push_provider_id -> push_provider; delete rule RESTRICT (see table description)
views:
- name: vw_login_history
  kind: view
  tables:
  - login_attempt
  - device
  - device_session
  purpose: 'Per-user login history: attempts with device platform and session end for the account owner and licence admin.'
  security: security_invoker semantics via app role grants; users see only own rows (app_user_id = session user); licence admins see rows of their licence; IP masked for non-owners.
  sql_sketch: SELECT la.app_user_id, la.attempted_at, la.login_outcome_id, la.ip_address, d.device_platform_id, ds.ended_at, ds.session_end_reason_id FROM login_attempt la LEFT JOIN device d ON d.id = la.device_id
    LEFT JOIN device_session ds ON ds.device_id = la.device_id AND ds.started_at >= la.attempted_at AND ds.started_at < la.attempted_at + interval '1 minute' WHERE la.app_user_id IS NOT NULL
- name: vw_active_device_session
  kind: view
  tables:
  - device_session
  - licence_seat
  purpose: 'Active (counted) sessions: ended_at IS NULL AND expires_at > now().'
  security: Read-only to app role; used by "my devices" and admin console.
  sql_sketch: SELECT * FROM device_session WHERE ended_at IS NULL AND expires_at > now()
- name: vw_licence_seat_availability
  kind: view
  tables:
  - licence
  - licence_seat_slot
  - licence_seat
  purpose: Free seats and used devices per licence.
  security: Licence admins of the licence only.
  sql_sketch: SELECT l.id, l.max_users, count(s.id) AS used FROM licence l LEFT JOIN licence_seat s ON s.licence_id = l.id AND s.revoked_at IS NULL AND s.deleted_at IS NULL GROUP BY l.id
business_rules:
- id: BR-LIC-01
  rule: Every licence has a positive max_users and max_devices_per_user.
  mechanism_type: CHECK
  mechanism: 'ck_licence_max_users_positive: max_users > 0; ck_licence_max_devices_positive: max_devices_per_user BETWEEN 1 AND 100; both INT4 NOT NULL explicit columns.'
  tables:
  - licence
  milestone: B36
- id: BR-LIC-02
  rule: A licence cannot have more live seats than max_users.
  mechanism_type: SLOT_TABLE
  mechanism: licence_seat_slot rows 1..max_users per licence, UNIQUE(licence_id, slot_no). licence_seat claims one slot; partial unique uq_licence_seat_licence_seat_slot_id WHERE revoked_at IS NULL AND
    deleted_at IS NULL; composite FK (licence_id, licence_seat_slot_id) -> licence_seat_slot(licence_id, id) keeps the slot in the same licence. Declarative twin of BR-LIC-03.
  tables:
  - licence
  - licence_seat_slot
  - licence_seat
  milestone: B36
- id: BR-LIC-03
  rule: Seat assignment serialises per licence.
  mechanism_type: TXN_LOCK
  mechanism: 'Txn: (1) SELECT id,max_users,seats_in_use,licence_status_id FROM licence WHERE id=$1 FOR UPDATE; (2) require status active and now() within validity; (3) SELECT id FROM licence_seat_slot WHERE
    licence_id=$1 AND NOT is_retired AND id NOT IN (SELECT licence_seat_slot_id FROM licence_seat WHERE licence_id=$1 AND revoked_at IS NULL AND deleted_at IS NULL) ORDER BY slot_no LIMIT 1; (4) none ->
    reject (seat_limit_reached, audit_event); (5) INSERT licence_seat (conflict on live user seat = already seated); INSERT device_slot rows 1..max_devices_per_user; UPDATE licence SET seats_in_use=seats_in_use+1;
    (6) COMMIT; retry the whole txn on SQLSTATE 40001.'
  tables:
  - licence
  - licence_seat_slot
  - licence_seat
  - device_slot
  milestone: B36
- id: BR-LIC-04
  rule: One live seat per user per licence.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: uq_licence_seat_licence_id_app_user_id UNIQUE (licence_id, app_user_id) WHERE revoked_at IS NULL AND deleted_at IS NULL.
  tables:
  - licence_seat
  milestone: B36
- id: BR-LIC-05
  rule: A user cannot hold more active sessions than max_devices_per_user.
  mechanism_type: SLOT_TABLE
  mechanism: 'device_slot rows 1..max_devices_per_user per seat; device_session claims one; uq_device_session_device_slot_id UNIQUE (device_slot_id) WHERE ended_at IS NULL (D-13). Composite FKs force slot/seat/user/device
    consistency: (licence_seat_id, device_slot_id)->device_slot(licence_seat_id,id); (licence_seat_id, app_user_id)->licence_seat(id,app_user_id); (device_id, app_user_id)->device(id,app_user_id). A device
    holds at most one active session (uq_device_session_device_id).'
  tables:
  - device_slot
  - device_session
  - licence_seat
  - device
  milestone: B39
- id: BR-LIC-06
  rule: Login enforces the limit at the point of login with exact SQL steps.
  mechanism_type: TXN_LOCK
  mechanism: 'BEGIN (SERIALIZABLE). 1) SELECT l.id, l.licence_status_id, l.valid_from, l.valid_to, l.max_devices_per_user, l.device_limit_policy_id, l.session_idle_timeout_minutes, l.session_max_lifetime_hours,
    s.id AS seat_id FROM licence l JOIN licence_seat s ON s.licence_id=l.id WHERE s.app_user_id=$user AND s.revoked_at IS NULL AND s.deleted_at IS NULL AND l.id=$lic FOR UPDATE OF s (locks only this user''s
    seat row; no seat/active licence -> INSERT login_attempt(no_seat|licence_inactive), COMMIT, deny). 2) IP allowlist: if licence.require_ip_allowlist, check licence_ip_allowlist (ip_network >>= $ip) else
    deny(ip_blocked). 3) Release stale: UPDATE device_session SET ended_at=now(), session_end_reason_id=<absolute_expiry|idle_timeout> WHERE licence_seat_id=$seat AND ended_at IS NULL AND (expires_at<=now()
    OR last_activity_at < now()-make_interval(mins=>idle)). 4) Device: INSERT INTO device(...) ON CONFLICT (app_user_id, device_fingerprint_hash) WHERE deleted_at IS NULL DO UPDATE SET last_seen_at=now()
    RETURNING id, revoked_at; revoked -> login_attempt(device_revoked), COMMIT, deny. 5) Same-device re-login: UPDATE device_session SET ended_at=now(), session_end_reason_id=<replaced> WHERE device_id=$dev
    AND ended_at IS NULL. 6) Claim: SELECT ds.id FROM device_slot ds WHERE ds.licence_seat_id=$seat AND NOT ds.is_retired AND NOT EXISTS (SELECT 1 FROM device_session x WHERE x.device_slot_id=ds.id AND
    x.ended_at IS NULL) ORDER BY ds.slot_no LIMIT 1. 7) No free slot: deny_new -> INSERT login_attempt(device_limit_denied) RETURNING id; INSERT audit_event(action=device_limit_exceeded); INSERT device_limit_violation(...);
    COMMIT the evidence; return 403. replace_oldest -> pick session with min(last_activity_at) of the seat, UPDATE it ended (end_reason=replaced), INSERT violation + audit_event, reuse its slot. 8) INSERT
    identity_session(...) RETURNING id; INSERT device_session(identity_session_id, app_user_id, device_id, licence_seat_id, device_slot_id, expires_at=now()+max_lifetime ...); UPDATE licence_seat SET last_login_at=now();
    INSERT login_attempt(success); COMMIT. Contention: lock is per seat (one user), so only that user''s concurrent logins queue; slot unique index is the guard if a bug skipped the lock. On 40001 or unique
    violation on uq_device_session_device_slot_id the client retries the whole txn (max 5, 20-200 ms jittered backoff); request_ref + uq_login_attempt_request_ref_login_outcome_id make retries idempotent.'
  tables:
  - licence
  - licence_seat
  - device
  - device_slot
  - device_session
  - login_attempt
  - device_limit_violation
  - licence_ip_allowlist
  milestone: B39
- id: BR-LIC-07
  rule: An attempt to exceed the device limit is recorded in the audit trail.
  mechanism_type: TXN_LOCK
  mechanism: 'Step 7 of BR-LIC-06 inserts audit_event + device_limit_violation(audit_event_id FK) + login_attempt in a txn that commits (the denial is not rolled back). ck_device_limit_violation_count_at_limit:
    active_session_count >= max_devices_allowed.'
  tables:
  - device_limit_violation
  - login_attempt
  milestone: B39
- id: BR-LIC-08
  rule: How an active session is counted and released.
  mechanism_type: JOB
  mechanism: 'Counted iff ended_at IS NULL (it holds a device_slot). Released by (a) logout/revoke: UPDATE ended_at,end_reason; (b) login txn step 3 lazy release; (c) JOB every 1 minute: UPDATE device_session
    SET ended_at=expires_at, session_end_reason_id=absolute_expiry WHERE ended_at IS NULL AND expires_at<=now() (index idx_device_session_expires_at, hash-sharded) and idle sessions via last_activity_at;
    (d) TTL purge of ended rows 13 months. ck_device_session_end_reason_consistent keeps reason and ended_at together. Heartbeats update last_activity_at at most once per 60 s.'
  tables:
  - device_session
  milestone: B39
- id: BR-LIC-09
  rule: Revoking a device or session is an auditable action.
  mechanism_type: APP_LAYER
  mechanism: 'Revoke txn: UPDATE device SET revoked_at=now(); UPDATE device_session SET ended_at=now(), session_end_reason_id=<revoked_by_*> WHERE device_id=$d AND ended_at IS NULL; INSERT device_revocation
    (+ session_revocation per ended session, uq_session_revocation_device_session_id); INSERT audit_event; all in one txn; FK audit_event_id NOT NULL guarantees an audit row.'
  tables:
  - device
  - device_session
  - device_revocation
  - session_revocation
  milestone: B42
- id: BR-LIC-10
  rule: Revocation, violation and login history are append-only.
  mechanism_type: PRIVILEGE
  mechanism: App roles have INSERT/SELECT only on login_attempt, device_revocation, session_revocation, device_limit_violation, licence_status_history, licence_usage_snapshot; no UPDATE/DELETE grants; TTL
    job runs as the TTL system role (P5/P6).
  tables:
  - login_attempt
  - device_revocation
  - session_revocation
  - device_limit_violation
  - licence_status_history
  milestone: B42
- id: BR-LIC-11
  rule: Session user must equal seat user and device owner.
  mechanism_type: CHAIN_FK
  mechanism: Composite FKs on device_session (see BR-LIC-05) referencing UNIQUE(id, app_user_id) on licence_seat and device.
  tables:
  - device_session
  - licence_seat
  - device
  milestone: B39
- id: BR-LIC-12
  rule: Login attempts for unknown users are logged without a user.
  mechanism_type: CHECK
  mechanism: login_attempt.app_user_id NULL (null_why) with identifier_hmac stored; attempts are rate-limited by idx on (ip_address, attempted_at).
  tables:
  - login_attempt
  milestone: B36
- id: BR-LIC-13
  rule: High-volume log tables expire automatically.
  mechanism_type: TTL
  mechanism: login_attempt 24 months (attempted_at); session_activity_sample 30 days; device_session 13 months after ended_at (NULL never expires); device_trust_challenge 30 days after expires_at. CRDB
    ttl_expire_after / ttl_expiration_expression; ttl_job_cron staggered nightly.
  tables:
  - login_attempt
  - session_activity_sample
  - device_session
  - device_trust_challenge
  milestone: B45
- id: BR-LIC-14
  rule: Reducing max_users or max_devices_per_user never kills held slots.
  mechanism_type: JOB
  mechanism: Limit-change txn locks licence FOR UPDATE, marks surplus slots is_retired; free retired slots are not claimable (step 6 filters NOT is_retired); seats/sessions in retired slots drain naturally
    or are revoked by an admin action (BR-LIC-09).
  tables:
  - licence
  - licence_seat_slot
  - device_slot
  milestone: B45
- id: BR-LIC-15
  rule: Licence validity and status gate logins.
  mechanism_type: APP_LAYER
  mechanism: Step 1 of BR-LIC-06 requires licence_status = active AND valid_from <= now() AND (valid_to IS NULL OR valid_to > now()); expiry JOB moves status to expired and ends sessions (end_reason licence_inactive)
    and writes licence_status_history.
  tables:
  - licence
  - licence_status_history
  milestone: B45
- id: BR-LIC-16
  rule: A push token is registered once.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: uq_push_registration_push_provider_id_push_token_hash WHERE invalidated_at IS NULL.
  tables:
  - push_registration
  milestone: B45
