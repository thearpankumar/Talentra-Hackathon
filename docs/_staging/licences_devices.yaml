tables:
- name: licence
  kind: entity
  delete_policy: soft
  volume: low
  tier: '1'
  milestones:
  - B36
  - B76
  retention: Soft-deleted when cancelled and past legal retention; licence rows retained 8 years for invoicing history; no PII.
  description: 'A commercial licence owned by an account/organisation: how many users (seats) and devices per user it allows. Parent of subscriptions; seats hang off it.'
  columns:
  - name: licence_code
    desc: Human-readable licence number (unique among live licences).
    sens: Internal
    type: STRING(32)
    domain: code
  - name: account_id
    desc: Paying account that owns the licence.
    sens: Internal
    type: UUID
    domain: identifier
  - name: organisation_id
    desc: Tenant organisation using the licence.
    sens: Internal
    type: UUID
    domain: identifier
    'null': true
    null_why: NULL = individual/consultant licence not tied to an organisation.
  - name: licence_status_id
    desc: Current lifecycle status.
    sens: Internal
    type: UUID
    domain: enum_ref
  - name: max_users
    desc: Maximum number of concurrently assigned seats (users).
    sens: Internal
    type: INT4
    domain: quantity
  - name: max_devices_per_user
    desc: Maximum number of active sessions/devices a single user may hold under this licence.
    sens: Internal
    type: INT4
    domain: quantity
  - name: device_limit_policy_id
    desc: Policy applied when a login would exceed max_devices_per_user.
    sens: Internal
    type: UUID
    domain: enum_ref
  - name: seats_in_use
    desc: Denormalised count of live seats; maintained under the licence row lock; must equal count of live licence_seat.
    sens: Internal
    type: INT4
    domain: quantity
    default: '0'
  - name: session_idle_timeout_minutes
    desc: Idle minutes after which a session expires.
    sens: Internal
    type: INT4
    domain: quantity
    default: '30'
  - name: session_max_lifetime_hours
    desc: Absolute session lifetime in hours.
    sens: Internal
    type: INT4
    domain: quantity
    default: '24'
  - name: valid_from
    desc: Start of validity (UTC).
    sens: Internal
    type: TIMESTAMPTZ
    domain: timestamp
  - name: valid_to
    desc: End of validity (UTC).
    sens: Internal
    type: TIMESTAMPTZ
    domain: timestamp
    'null': true
    null_why: NULL = open-ended/ongoing until cancelled.
  - name: require_ip_allowlist
    desc: True = logins must match licence_ip_allowlist.
    sens: Internal
    type: BOOL
    domain: boolean
    default: 'false'
  constraints:
  - name: ck_licence_max_users_positive
    type: check
    expr: max_users > 0
    desc: 'Docket Rule 9: positive max users.'
  - name: ck_licence_max_devices_positive
    type: check
    expr: max_devices_per_user > 0 AND max_devices_per_user <= 100
    desc: 'Docket Rule 9: positive max devices (sanity ceiling 100).'
  - name: ck_licence_seats_in_use_range
    type: check
    expr: seats_in_use >= 0 AND seats_in_use <= max_users
    desc: Counter never exceeds max_users (declarative backstop).
  - name: ck_licence_valid_range
    type: check
    expr: valid_to IS NULL OR valid_to >= valid_from
    desc: Validity window order.
  - name: ck_licence_session_timeouts
    type: check
    expr: session_idle_timeout_minutes > 0 AND session_max_lifetime_hours > 0
    desc: Positive timeouts.
  indexes:
  - name: uq_licence_licence_code
    columns:
    - licence_code
    unique: true
    where: deleted_at IS NULL
    desc: Licence number unique among live licences.
  - name: idx_licence_account_id_licence_status_id
    columns:
    - account_id
    - licence_status_id
    desc: Account licence listing by status.
  - name: idx_licence_organisation_id
    columns:
    - organisation_id
    desc: Licences of an organisation.
    where: organisation_id IS NOT NULL
  - name: idx_licence_licence_status_id_valid_to
    columns:
    - licence_status_id
    - valid_to
    desc: Expiry sweep job.
    where: deleted_at IS NULL
  - name: idx_licence_device_limit_policy_id
    columns:
    - device_limit_policy_id
    desc: Leading index for FK fk_licence_device_limit_policy_id (child lookup / FK check).
  fks:
  - name: fk_licence_account_id
    columns:
    - account_id
    ref: account
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: account_id -> account; delete rule RESTRICT (see table description)
  - name: fk_licence_organisation_id
    columns:
    - organisation_id
    ref: organisation
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: organisation_id -> organisation; delete rule RESTRICT (see table description)
  - name: fk_licence_licence_status_id
    columns:
    - licence_status_id
    ref: licence_status
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: licence_status_id -> licence_status; delete rule RESTRICT (see table description)
  - name: fk_licence_device_limit_policy_id
    columns:
    - device_limit_policy_id
    ref: device_limit_policy
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: device_limit_policy_id -> device_limit_policy; delete rule RESTRICT (see table description)
- name: licence_seat_slot
  kind: entity
  delete_policy: hard
  volume: low
  tier: '1'
  milestones:
  - B36
  - B76
  retention: Deleted with its licence; created/retired by the licence limit change txn.
  description: Pre-allocated seat slots 1..max_users per licence; a seat claims one slot (declarative seat-limit twin).
  columns:
  - name: licence_id
    desc: Owning licence.
    sens: Internal
    type: UUID
    domain: identifier
  - name: slot_no
    desc: Slot number, 1..max_users at creation time.
    sens: Internal
    type: INT4
    domain: quantity
  - name: is_retired
    desc: True when max_users was reduced; retired slots are never reused but kept while a seat holds them.
    sens: Internal
    type: BOOL
    domain: boolean
    default: 'false'
  constraints:
  - name: uq_licence_seat_slot_licence_id_slot_no
    type: unique
    columns:
    - licence_id
    - slot_no
    desc: One row per slot number per licence.
  - name: uq_licence_seat_slot_licence_id_id
    type: unique
    columns:
    - licence_id
    - id
    desc: Target of composite FK from licence_seat.
  - name: ck_licence_seat_slot_slot_no_positive
    type: check
    expr: slot_no > 0
    desc: Slot numbers start at 1.
  indexes: []
  fks:
  - name: fk_licence_seat_slot_licence_id
    columns:
    - licence_id
    ref: licence
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: licence_id -> licence; delete rule CASCADE (see table description)
- name: licence_seat
  kind: entity
  delete_policy: soft
  volume: medium
  tier: '1'
  milestones:
  - B36
  - B76
  retention: Soft-deleted on user erasure; seat history kept for licence audit 7 years then purged.
  description: Allocation of one licence seat to one user (one live seat per user per licence).
  columns:
  - name: licence_id
    desc: Licence the seat belongs to.
    sens: Internal
    type: UUID
    domain: identifier
  - name: licence_seat_slot_id
    desc: Claimed seat slot (same licence, composite FK).
    sens: Internal
    type: UUID
    domain: identifier
  - name: app_user_id
    desc: User holding the seat.
    sens: Internal
    type: UUID
    domain: identifier
  - name: seat_status_id
    desc: Seat status.
    sens: Internal
    type: UUID
    domain: enum_ref
  - name: assigned_at
    desc: When the seat was assigned.
    sens: Internal
    type: TIMESTAMPTZ
    domain: timestamp
    default: now()
  - name: assigned_by_app_user_id
    desc: Admin who assigned the seat.
    sens: Internal
    type: UUID
    domain: identifier
    'null': true
    null_why: NULL = system/self-provisioned.
  - name: revoked_at
    desc: When the seat was released.
    sens: Internal
    type: TIMESTAMPTZ
    domain: timestamp
    'null': true
    null_why: NULL = seat still live.
  - name: last_login_at
    desc: Most recent successful login on this seat.
    sens: Internal
    type: TIMESTAMPTZ
    domain: timestamp
    'null': true
    null_why: NULL = never logged in.
  constraints:
  - name: uq_licence_seat_id_app_user_id
    type: unique
    columns:
    - id
    - app_user_id
    desc: Target of composite FK from device_session (session user == seat user).
  - name: ck_licence_seat_revoked_range
    type: check
    expr: revoked_at IS NULL OR revoked_at >= assigned_at
    desc: Release after assignment.
  indexes:
  - name: uq_licence_seat_licence_id_app_user_id
    columns:
    - licence_id
    - app_user_id
    unique: true
    where: revoked_at IS NULL AND deleted_at IS NULL
    desc: One live seat per user per licence.
  - name: uq_licence_seat_licence_seat_slot_id
    columns:
    - licence_seat_slot_id
    unique: true
    where: revoked_at IS NULL AND deleted_at IS NULL
    desc: 'One live seat per slot: seat count <= max_users.'
  - name: idx_licence_seat_app_user_id_seat_status_id
    columns:
    - app_user_id
    - seat_status_id
    desc: My licences lookup at login.
    where: revoked_at IS NULL
  - name: idx_licence_seat_seat_status_id
    columns:
    - seat_status_id
    desc: Leading index for FK fk_licence_seat_seat_status_id (child lookup / FK check).
  - name: idx_licence_seat_assigned_by_app_user_id
    columns:
    - assigned_by_app_user_id
    desc: Leading index for FK fk_licence_seat_assigned_by_app_user_id (child lookup / FK check).
  fks:
  - name: fk_licence_seat_licence_id
    columns:
    - licence_id
    ref: licence
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: licence_id -> licence; delete rule RESTRICT (see table description)
  - name: fk_licence_seat_app_user_id
    columns:
    - app_user_id
    ref: app_user
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: app_user_id -> app_user; delete rule RESTRICT (see table description)
  - name: fk_licence_seat_seat_status_id
    columns:
    - seat_status_id
    ref: seat_status
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: seat_status_id -> seat_status; delete rule RESTRICT (see table description)
  - name: fk_licence_seat_assigned_by_app_user_id
    columns:
    - assigned_by_app_user_id
    ref: app_user
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: assigned_by_app_user_id -> app_user; delete rule RESTRICT (see table description)
  - name: fk_licence_seat_licence_seat_slot_id_licence_id
    columns:
    - licence_id
    - licence_seat_slot_id
    ref: licence_seat_slot
    ref_columns:
    - licence_id
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Slot must belong to the same licence.
- name: licence_user_invitation
  kind: entity
  delete_policy: hard
  volume: low
  tier: '1'
  milestones:
  - B36
  retention: Purged 90 days after closed_at (job).
  description: Invitation for a person to take a seat on a licence.
  columns:
  - name: licence_id
    desc: Licence offering the seat.
    sens: Internal
    type: UUID
    domain: identifier
  - name: invited_email
    desc: Invitee email (lowercase).
    sens: Personal
    type: STRING(254)
    domain: email
    pii: masked outside licence admins; purged 90 days after close
  - name: invited_app_user_id
    desc: Existing user matched to the email.
    sens: Internal
    type: UUID
    domain: identifier
    'null': true
    null_why: NULL = no account yet.
  - name: licence_invitation_status_id
    desc: Status.
    sens: Internal
    type: UUID
    domain: enum_ref
  - name: token_hash
