    domain: identifier
  - name: licence_seat_id
    desc: Seat the session runs under.
    sens: Internal
    type: UUID
    domain: identifier
  - name: device_slot_id
    desc: Claimed device slot.
    sens: Internal
    type: UUID
    domain: identifier
  - name: started_at
    desc: Session start.
    sens: Internal
    type: TIMESTAMPTZ
    domain: timestamp
    default: now()
  - name: last_activity_at
    desc: Last activity (heartbeat, sampled).
    sens: Internal
    type: TIMESTAMPTZ
    domain: timestamp
    default: now()
  - name: expires_at
    desc: Absolute expiry; at or after this the session no longer counts.
    sens: Internal
    type: TIMESTAMPTZ
    domain: timestamp
  - name: ended_at
    desc: End time; slot is free once set.
    sens: Internal
    type: TIMESTAMPTZ
    domain: timestamp
    'null': true
    null_why: NULL = session active.
  - name: session_end_reason_id
    desc: Why it ended.
    sens: Internal
    type: UUID
    domain: enum_ref
    'null': true
    null_why: NULL = session active.
  - name: ip_address
    desc: IP at login.
    sens: Personal
    type: INET
    domain: ip_address
    pii: retained for security audit 13 months then TTL
  - name: authentication_method_id
    desc: How the user authenticated.
    sens: Internal
    type: UUID
    domain: enum_ref
  constraints:
  - name: uq_device_session_identity_session_id
    type: unique
    columns:
    - identity_session_id
    desc: One device session per identity session.
  - name: ck_device_session_ended_range
    type: check
    expr: ended_at IS NULL OR ended_at >= started_at
    desc: End after start.
  - name: ck_device_session_end_reason_consistent
    type: check
    expr: (ended_at IS NULL) = (session_end_reason_id IS NULL)
    desc: Reason present iff ended.
  - name: ck_device_session_expiry_range
    type: check
    expr: expires_at >= started_at
    desc: Expiry after start.
  - name: ck_device_session_activity_range
    type: check
    expr: last_activity_at >= started_at
    desc: Activity after start.
  indexes:
  - name: uq_device_session_device_slot_id
    columns:
    - device_slot_id
    unique: true
    where: ended_at IS NULL
    desc: 'Each slot held by at most one active session: enforces max_devices_per_user (D-13).'
  - name: uq_device_session_device_id
    columns:
    - device_id
    unique: true
    where: ended_at IS NULL
    desc: A device has at most one active session.
  - name: idx_device_session_app_user_id_started_at
    columns:
    - app_user_id
    - started_at DESC
    desc: User session history.
  - name: idx_device_session_licence_seat_id
    columns:
    - licence_seat_id
    desc: Active session count per seat.
    where: ended_at IS NULL
    storing:
    - device_slot_id
    - expires_at
    - last_activity_at
  - name: idx_device_session_expires_at
    columns:
    - expires_at
    desc: 'Expiry job: find active sessions past expiry.'
    where: ended_at IS NULL
    hash: true
    bucket_count: 16
  - name: idx_device_session_started_at
    columns:
    - started_at
    desc: Time-ordered scans, sharded.
    hash: true
    bucket_count: 16
  - name: idx_device_session_session_end_reason_id
    columns:
    - session_end_reason_id
    desc: Leading index for FK fk_device_session_session_end_reason_id (child lookup / FK check).
  - name: idx_device_session_authentication_method_id
    columns:
    - authentication_method_id
    desc: Leading index for FK fk_device_session_authentication_method_id (child lookup / FK check).
  fks:
  - name: fk_device_session_identity_session_id
    columns:
    - identity_session_id
    ref: identity_session
    ref_columns:
    - id
    on_delete: SET NULL
    on_update: RESTRICT
    desc: 'SET NULL: the parent is removed by its row-level TTL (CockroachDB TTL jobs fail while a RESTRICT child exists); the child row survives with the reference cleared (decision F-01).'
  - name: fk_device_session_session_end_reason_id
    columns:
    - session_end_reason_id
    ref: session_end_reason
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: session_end_reason_id -> session_end_reason; delete rule RESTRICT (see table description)
  - name: fk_device_session_authentication_method_id
    columns:
    - authentication_method_id
    ref: authentication_method
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: authentication_method_id -> authentication_method; delete rule RESTRICT (see table description)
  - name: fk_device_session_device_slot_id_licence_seat_id
    columns:
    - licence_seat_id
    - device_slot_id
    ref: device_slot
    ref_columns:
    - licence_seat_id
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Slot belongs to the same seat.
  - name: fk_device_session_licence_seat_id_app_user_id
    columns:
    - licence_seat_id
    - app_user_id
    ref: licence_seat
    ref_columns:
    - id
    - app_user_id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Session user equals the seat user.
  - name: fk_device_session_device_id_app_user_id
    columns:
    - device_id
    - app_user_id
    ref: device
    ref_columns:
    - id
    - app_user_id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Device belongs to the session user.
