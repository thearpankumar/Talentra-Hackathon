  - name: device_platform_id
    desc: Platform.
    sens: Internal
    type: UUID
    domain: enum_ref
  - name: device_model
    desc: Reported model.
    sens: Internal
    type: STRING(100)
    domain: free_text
    'null': true
    null_why: NULL = not reported (web).
  - name: os_version
    desc: OS/browser version.
    sens: Internal
    type: STRING(50)
    domain: free_text
    'null': true
    null_why: NULL = not reported.
  - name: app_version
    desc: App build version.
    sens: Internal
    type: STRING(30)
    domain: free_text
    'null': true
    null_why: NULL = web client.
  - name: device_label
    desc: User-given name.
    sens: Internal
    type: STRING(100)
    domain: free_text
    'null': true
    null_why: NULL = user has not named it.
  - name: is_trusted
    desc: Passed a trust challenge.
    sens: Internal
    type: BOOL
    domain: boolean
    default: 'false'
  - name: trusted_at
    desc: When trust was granted.
    sens: Internal
    type: TIMESTAMPTZ
    domain: timestamp
    'null': true
    null_why: NULL = not trusted.
  - name: first_seen_at
    desc: First registration.
    sens: Internal
    type: TIMESTAMPTZ
    domain: timestamp
    default: now()
  - name: last_seen_at
    desc: Last successful login/activity.
    sens: Internal
    type: TIMESTAMPTZ
    domain: timestamp
    default: now()
  - name: last_ip_address
    desc: Last IP seen.
    sens: Personal
    type: INET
    domain: ip_address
    'null': true
    null_why: NULL = unknown.
