- name: login_attempt
  kind: event
  delete_policy: append_only
  volume: very_high
  tier: '1'
  milestones:
  - B36
  - B39
  - B76
  retention: TTL 24 months on attempted_at; erasure nulls app_user_id/ip via anonymise job exception-logged.
  description: Append-only record of every login attempt, success or failure (very high volume).
  ttl:
    expire_after: 24 months
    column: attempted_at
  columns:
  - name: app_user_id
    desc: User matched, if any.
    sens: Internal
    type: UUID
    domain: identifier
    'null': true
    null_why: NULL = submitted identifier matched no user (outcome unknown_user).
  - name: identifier_hmac
    desc: Keyed hash of the submitted login identifier (email/phone), to correlate attacks on unknown users.
    sens: Personal
    type: BYTES
    domain: secret_hash
    pii: HMAC-SHA256 keyed hash only
  - name: login_outcome_id
    desc: Success or failure reason.
    sens: Internal
    type: UUID
    domain: enum_ref
