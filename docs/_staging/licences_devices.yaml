    desc: Limit in force (snapshot of licence.max_devices_per_user).
    sens: Internal
    type: INT4
    domain: quantity
  - name: device_limit_policy_id
    desc: Policy applied (deny_new or replace_oldest).
    sens: Internal
    type: UUID
    domain: enum_ref
  - name: replaced_device_session_id
    desc: Session signed out under replace_oldest.
    sens: Internal
    type: UUID
    domain: identifier
    'null': true
    null_why: NULL = login denied (deny_new).
  - name: login_attempt_id
    desc: The attempt row recorded with device_limit_denied/success.
    sens: Internal
    type: UUID
    domain: identifier
    'null': true
    null_why: NULL = the login_attempt row was expired by its 24-month TTL; the violation row is self-describing.
  - name: audit_event_id
    desc: Audit trail row (docket Rule 9).
    sens: Internal
    type: UUID
    domain: identifier
    'null': true
    null_why: NULL = the audit_event row aged out of its 400-day TTL; the violation row is self-describing.
  - name: occurred_at
    desc: Time of the attempt.
    sens: Internal
    type: TIMESTAMPTZ
    domain: timestamp
    default: now()
  constraints:
  - name: ck_device_limit_violation_count_at_limit
    type: check
    expr: active_session_count >= max_devices_allowed
    desc: Only recorded when the limit was reached.
  indexes:
  - name: idx_device_limit_violation_licence_seat_id_occurred_at
    columns:
    - licence_seat_id
    - occurred_at DESC
    desc: Violations per seat.
  - name: idx_device_limit_violation_app_user_id_occurred_at
