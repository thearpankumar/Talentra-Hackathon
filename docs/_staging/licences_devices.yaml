    - app_user_id
    - occurred_at DESC
    desc: Violations per user.
  - name: idx_device_limit_violation_device_id
    columns:
    - device_id
    desc: Violations per device.
    where: device_id IS NOT NULL
  - name: idx_device_limit_violation_replaced_device_session_id
    columns:
    - replaced_device_session_id
    desc: Reverse lookup.
    where: replaced_device_session_id IS NOT NULL
  - name: idx_device_limit_violation_login_attempt_id
    columns:
    - login_attempt_id
    desc: Join to attempt.
  - name: idx_device_limit_violation_audit_event_id
    columns:
    - audit_event_id
    desc: Join to audit.
  - name: idx_device_limit_violation_device_limit_policy_id
    columns:
    - device_limit_policy_id
    desc: Leading index for FK fk_device_limit_violation_device_limit_policy_id (child lookup / FK check).
  fks:
  - name: fk_device_limit_violation_licence_seat_id
    columns:
    - licence_seat_id
    ref: licence_seat
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: licence_seat_id -> licence_seat; delete rule RESTRICT (see table description)
  - name: fk_device_limit_violation_app_user_id
    columns:
    - app_user_id
    ref: app_user
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: app_user_id -> app_user; delete rule RESTRICT (see table description)
  - name: fk_device_limit_violation_device_id
    columns:
    - device_id
    ref: device
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: device_id -> device; delete rule RESTRICT (see table description)
  - name: fk_device_limit_violation_device_limit_policy_id
    columns:
    - device_limit_policy_id
    ref: device_limit_policy
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: device_limit_policy_id -> device_limit_policy; delete rule RESTRICT (see table description)
  - name: fk_device_limit_violation_replaced_device_session_id
