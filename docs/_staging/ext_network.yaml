- name: connection_request
  kind: entity
  delete_policy: hard
  volume: very_high
  tier: X
  milestones:
  - B48
  - B51
  - B54
  retention: Resolved requests purged 12 months after responded_at; open requests expire after 30 days; erased with either user.
  description: Directed invitation to connect (LinkedIn invitation with a note of up to 300 characters). At most one open request per unordered pair; cooldown after decline/ignore.
  no_hash_why: Primary access is by user uuid (random); only expiry scan is time ordered and has a hash index.
  columns:
  - name: requester_app_user_id
    type: UUID
    domain: identifier
    sens: Internal
    desc: Person sending the request.
  - name: recipient_app_user_id
    type: UUID
    domain: identifier
    sens: Internal
    desc: Person receiving the request.
  - name: connection_request_status_id
    type: UUID
    domain: enum_ref
    sens: Internal
    desc: Current state.
  - name: connection_origin_id
    type: UUID
    domain: enum_ref
    sens: Internal
    desc: Surface the request was sent from.
  - name: note_text
    type: STRING(300)
    domain: free_text
    'null': true
    null_why: NULL = no note was added.
    sens: Personal
    pii: User-authored text; access-controlled to the two parties; erased on erasure
    desc: Optional personal note (<=300 chars as on LinkedIn).
  - name: is_pending
    type: BOOL
    domain: boolean
    default: 'false'
    sens: Internal
    desc: True while the request is open; drives the one-open-request partial unique.
  - name: pair_low_key
    type: UUID
    domain: identifier
    sens: Internal
    desc: Smaller of the two user ids (canonical pair).
    computed: LEAST(requester_app_user_id, recipient_app_user_id)
  - name: pair_high_key
    type: UUID
    domain: identifier
    sens: Internal
    desc: Larger of the two user ids (canonical pair).
    computed: GREATEST(requester_app_user_id, recipient_app_user_id)
  - name: sent_at
    type: TIMESTAMPTZ
    domain: timestamp
    default: now()
    sens: Internal
    desc: When sent.
  - name: responded_at
    type: TIMESTAMPTZ
    domain: timestamp
    'null': true
    null_why: NULL = still pending.
    sens: Internal
    desc: When accepted/declined/ignored/withdrawn.
  - name: expires_at
    type: TIMESTAMPTZ
    domain: timestamp
    'null': true
    null_why: NULL = never expires (recruiter InMail-style requests).
    sens: Internal
    desc: Auto-expiry instant.
  - name: cooldown_ends_at
    type: TIMESTAMPTZ
    domain: timestamp
    'null': true
    null_why: NULL = no cooldown applies.
    sens: Internal
    desc: Earliest instant the requester may re-invite after decline/ignore.
  constraints:
  - name: ck_connection_request_not_self
    type: check
    expr: requester_app_user_id <> recipient_app_user_id
    desc: Cannot invite oneself.
  - name: ck_connection_request_response_after_sent
    type: check
    expr: responded_at IS NULL OR responded_at >= sent_at
    desc: Response cannot predate the send.
  - name: ck_connection_request_pending_has_no_response
    type: check
    expr: NOT is_pending OR responded_at IS NULL
    desc: Open requests carry no response time.
  indexes:
  - columns:
    - pair_low_key
    - pair_high_key
    desc: At most one open request per unordered pair (blocks A->B plus B->A races).
    unique: true
    where: is_pending
    name: uq_connection_request_pair_low_key_pair_high_key_open
  - columns:
    - recipient_app_user_id
    - sent_at DESC
    desc: Invitation inbox.
    where: is_pending
    storing:
    - requester_app_user_id
    name: idx_connection_request_recipient_app_user_id_sent_at_inbox
  - columns:
    - requester_app_user_id
    - sent_at DESC
    desc: Sent invitations list.
    name: idx_connection_request_requester_app_user_id_sent_at
  - columns:
    - expires_at
    desc: Expiry sweeper scan.
    hash: true
    bucket_count: 16
    name: idx_connection_request_expires_at
  - name: idx_connection_request_connection_request_status_id
    columns:
    - connection_request_status_id
    desc: Leading index for FK connection_request_status_id (D-20).
  - name: idx_connection_request_connection_origin_id
    columns:
    - connection_origin_id
    desc: Leading index for FK connection_origin_id (D-20).
  fks:
  - name: fk_connection_request_requester_app_user_id
    columns:
    - requester_app_user_id
    ref: app_user
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: Child data follows the parent row.
  - name: fk_connection_request_recipient_app_user_id
    columns:
    - recipient_app_user_id
    ref: app_user
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: Child data follows the parent row.
  - name: fk_connection_request_connection_request_status_id
    columns:
    - connection_request_status_id
    ref: connection_request_status
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Lookup value; retired values stay referenced.
  - name: fk_connection_request_connection_origin_id
    columns:
    - connection_origin_id
    ref: connection_origin
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Lookup value; retired values stay referenced.
- name: connection_request_quota
  kind: entity
  delete_policy: hard
  volume: high
  tier: X
  milestones:
  - B48
  - B51
  - B54
  retention: Rows older than 13 weeks purged.
  description: Weekly invitation allowance per member (LinkedIn caps weekly invites); enforced by a conditional UPDATE inside the send transaction.
  no_hash_why: Keyed by user uuid first.
  columns:
  - name: app_user_id
    type: UUID
    domain: identifier
    sens: Internal
    desc: Sender.
  - name: week_start_date
    type: DATE
    domain: date
    sens: Internal
    desc: Monday (UTC) of the quota week.
  - name: sent_count
    type: INT4
    domain: quantity
    default: '0'
    sens: Internal
    desc: Requests sent this week.
  - name: limit_count
    type: INT4
    domain: quantity
    sens: Internal
    desc: Allowance for the week (plan dependent).
  constraints:
  - name: uq_connection_request_quota_app_user_id_week_start_date
    type: unique
    columns:
    - app_user_id
    - week_start_date
    desc: Natural key (app_user_id, week_start_date).
  - name: ck_connection_request_quota_bounds
    type: check
    expr: sent_count >= 0 AND limit_count > 0 AND sent_count <= limit_count
    desc: Counter never exceeds the limit.
  indexes:
  - columns:
    - week_start_date
    desc: Retention sweep.
    hash: true
    bucket_count: 8
    name: idx_connection_request_quota_week_start_date
  fks:
  - name: fk_connection_request_quota_app_user_id
    columns:
    - app_user_id
    ref: app_user
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: Child data follows the parent row.
- name: connection
  kind: link
  delete_policy: hard
  volume: very_high
  tier: X
  milestones:
  - B48
  - B51
  - B54
  retention: Deleted on disconnect, block or erasure of either user (history kept in connection_event).
  description: Undirected first-degree edge stored ONCE with canonical ordering (lo < hi). Adjacency of user U = rows with lo=U union rows with hi=U, served by two covering indexes, never by mirrored rows.
    Scale target 10M users x 500 = 2.5B rows.
  no_hash_why: All index keys lead with random user uuids, spreading writes; no time-ordered global index exists.
  columns:
  - name: lo_app_user_id
    type: UUID
    domain: identifier
    sens: Internal
    desc: Member with the smaller uuid.
  - name: hi_app_user_id
    type: UUID
    domain: identifier
    sens: Internal
    desc: Member with the larger uuid.
  - name: connection_origin_id
    type: UUID
    domain: enum_ref
    sens: Internal
    desc: How the edge was created.
  - name: initiator_app_user_id
    type: UUID
    domain: identifier
    sens: Internal
    desc: Which side sent the request (must be lo or hi).
  - name: connection_request_id
    type: UUID
    domain: identifier
    'null': true
    null_why: NULL = edge created without a request (import, merge, auto-accept) or request already purged.
    sens: Internal
    desc: Request that produced the edge.
  - name: connected_at
    type: TIMESTAMPTZ
    domain: timestamp
    default: now()
    sens: Internal
    desc: Connection instant.
  constraints:
  - name: uq_connection_lo_app_user_id_hi_app_user_id
    type: unique
    columns:
    - lo_app_user_id
    - hi_app_user_id
    desc: Natural key (lo_app_user_id, hi_app_user_id).
  - name: ck_connection_canonical_order
    type: check
    expr: lo_app_user_id < hi_app_user_id
    desc: Canonical order makes (A,B) and (B,A) the same row.
  - name: ck_connection_initiator_is_member
    type: check
    expr: initiator_app_user_id IN (lo_app_user_id, hi_app_user_id)
    desc: Initiator is one of the endpoints.
  indexes:
  - columns:
    - lo_app_user_id
    - connected_at DESC
    desc: 'Adjacency, low side: neighbours = hi_app_user_id.'
    storing:
    - hi_app_user_id
    name: idx_connection_lo_app_user_id_connected_at_adj
  - columns:
    - hi_app_user_id
    - connected_at DESC
    desc: 'Adjacency, high side: neighbours = lo_app_user_id.'
    storing:
    - lo_app_user_id
    name: idx_connection_hi_app_user_id_connected_at_adj
  - columns:
    - connection_request_id
    desc: Lookup edge by originating request.
    where: connection_request_id IS NOT NULL
    name: idx_connection_connection_request_id
  - name: idx_connection_connection_origin_id
    columns:
    - connection_origin_id
    desc: Leading index for FK connection_origin_id (D-20).
  - name: idx_connection_initiator_app_user_id
    columns:
    - initiator_app_user_id
    desc: Leading index for FK initiator_app_user_id (D-20).
  fks:
  - name: fk_connection_lo_app_user_id
    columns:
    - lo_app_user_id
    ref: app_user
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: Child data follows the parent row.
  - name: fk_connection_hi_app_user_id
    columns:
    - hi_app_user_id
    ref: app_user
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: Child data follows the parent row.
  - name: fk_connection_connection_origin_id
    columns:
    - connection_origin_id
    ref: connection_origin
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Lookup value; retired values stay referenced.
  - name: fk_connection_initiator_app_user_id
    columns:
    - initiator_app_user_id
    ref: app_user
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: Child data follows the parent row.
  - name: fk_connection_connection_request_id
    columns:
    - connection_request_id
    ref: connection_request
    ref_columns:
    - id
    on_delete: SET NULL
    on_update: RESTRICT
    desc: Link is dropped when the referenced row goes; this row stays.
