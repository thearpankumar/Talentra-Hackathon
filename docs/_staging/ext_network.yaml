- name: public_profile_slug
  kind: entity
  delete_policy: hard
  volume: high
  tier: X
  milestones:
  - B48
  - B51
  - B54
  retention: Redirect rows released after 90 days into history; erased with the member.
  description: Vanity URL (e.g. /in/jane-doe-4f2a) of a member. Current slug plus old slugs kept as redirects; a slug is globally unique across current and redirect rows.
  no_hash_why: Keyed by random uuid.
  columns:
  - name: app_user_id
    type: UUID
    domain: identifier
    sens: Internal
    desc: Owner.
  - name: slug
    type: STRING(100)
    domain: code
    sens: Internal
    desc: Lowercase slug.
  - name: slug_status_id
    type: UUID
    domain: enum_ref
    sens: Internal
    desc: Active/redirect.
  - name: is_current
    type: BOOL
    domain: boolean
    default: 'false'
    sens: Internal
    desc: True for the single current slug of the member.
  - name: claimed_at
    type: TIMESTAMPTZ
    domain: timestamp
    default: now()
    sens: Internal
    desc: Claim time.
  - name: redirect_expires_at
    type: TIMESTAMPTZ
    domain: timestamp
    'null': true
    null_why: NULL = current slug.
    sens: Internal
    desc: When a redirect row is released.
  constraints:
  - name: uq_public_profile_slug_slug
    type: unique
    columns:
    - slug
    desc: Natural key (slug).
  - name: ck_public_profile_slug_slug_format
    type: check
    expr: slug ~ '^[a-z0-9][a-z0-9-]{2,99}$'
    desc: URL-safe slug.
  - name: ck_public_profile_slug_redirect_has_expiry
    type: check
    expr: is_current OR redirect_expires_at IS NOT NULL
    desc: Old slugs expire.
  indexes:
  - columns:
    - app_user_id
    desc: One current slug per member.
    unique: true
    where: is_current
    name: uq_public_profile_slug_app_user_id_current
  - columns:
    - redirect_expires_at
    desc: Release job.
    where: NOT is_current
    name: idx_public_profile_slug_redirect_expires_at_due
  - name: idx_public_profile_slug_slug_status_id
    columns:
    - slug_status_id
    desc: Leading index for FK slug_status_id (D-20).
  fks:
  - name: fk_public_profile_slug_app_user_id
    columns:
    - app_user_id
    ref: app_user
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: Child data follows the parent row.
  - name: fk_public_profile_slug_slug_status_id
    columns:
    - slug_status_id
    ref: slug_status
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Lookup value; retired values stay referenced.
