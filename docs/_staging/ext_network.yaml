    columns:
    - hi_app_user_id
    ref: app_user
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: Child data follows the parent row.
  - name: fk_connection_event_connection_event_type_id
    columns:
    - connection_event_type_id
    ref: connection_event_type
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Lookup value; retired values stay referenced.
  - name: fk_connection_event_actor_app_user_id
    columns:
