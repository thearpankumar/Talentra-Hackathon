  - B54
  retention: Deleted when the member withdraws discoverability, changes the contact, or is erased.
  description: HMAC of a member's verified email or phone so uploaded address-book hashes can be matched without storing plaintext contacts. Present only for members who allow discovery.
  no_hash_why: Hash values are uniformly random.
