- name: network_invitation
  kind: entity
  delete_policy: hard
  volume: high
  tier: X
  milestones:
  - B48
  - B51
  - B54
  retention: Contact details anonymised 90 days after close; row purged after 24 months.
  description: Invitation to a non-member to join and connect (email/SMS/WhatsApp). Distinct from profile.referral which owns referral rewards; optional link via referral_id.
  columns:
  - name: inviter_app_user_id
    type: UUID
    domain: identifier
    sens: Internal
    desc: Inviting member.
  - name: network_invitation_channel_id
    type: UUID
    domain: enum_ref
    sens: Internal
    desc: Channel.
  - name: network_invitation_status_id
    type: UUID
    domain: enum_ref
    sens: Internal
    desc: State.
  - name: invitee_email
    type: STRING(254)
    domain: email
    'null': true
    null_why: NULL = phone-only invitation.
    sens: Personal
    pii: Anonymised after close; masked in support tools
    desc: Invitee email.
  - name: invitee_phone
    type: STRING(16)
    domain: phone
    'null': true
    null_why: NULL = email-only invitation.
    sens: Personal
    pii: Anonymised after close; masked in support tools
    desc: Invitee phone (E.164).
  - name: invitee_phone_country_id
    type: UUID
    domain: identifier
    'null': true
    null_why: NULL when no phone.
    sens: Internal
    desc: Country of the phone number.
  - name: invite_link_id
    type: UUID
    domain: identifier
    'null': true
    null_why: NULL = direct invitation without a link.
    sens: Internal
    desc: Link used.
  - name: referral_id
    type: UUID
    domain: identifier
    'null': true
    null_why: NULL = pure networking invitation.
    sens: Internal
    desc: Linked employee/candidate referral.
  - name: joined_app_user_id
    type: UUID
    domain: identifier
    'null': true
    null_why: NULL = not joined.
    sens: Internal
    desc: Account created by the invitee.
  - name: is_open
    type: BOOL
    domain: boolean
    default: 'false'
    sens: Internal
    desc: True while the invitation can still convert.
  - name: reminder_count
    type: INT2
    domain: quantity
    default: '0'
    sens: Internal
    desc: Reminders sent.
  - name: sent_at
    type: TIMESTAMPTZ
    domain: timestamp
    default: now()
    sens: Internal
    desc: Sent time.
  - name: accepted_at
    type: TIMESTAMPTZ
    domain: timestamp
    'null': true
    null_why: NULL = not accepted.
    sens: Internal
    desc: Join time.
  - name: expires_at
    type: TIMESTAMPTZ
    domain: timestamp
    'null': true
    null_why: NULL = no expiry.
    sens: Internal
    desc: Expiry.
  constraints:
  - name: ck_network_invitation_email_lower
    type: check
    expr: invitee_email IS NULL OR invitee_email = lower(invitee_email)
    desc: Lowercase email.
  - name: ck_network_invitation_phone_e164
    type: check
    expr: invitee_phone IS NULL OR invitee_phone ~ '^\+[1-9][0-9]{6,14}$'
    desc: E.164 phone.
  - name: ck_network_invitation_phone_country
    type: check
    expr: invitee_phone IS NULL OR invitee_phone_country_id IS NOT NULL
    desc: Country accompanies phone.
  - name: ck_network_invitation_has_contact
    type: check
    expr: num_nonnulls(invitee_email, invitee_phone) >= 1
    desc: At least one contact point.
  indexes:
  - columns:
    - inviter_app_user_id
    - invitee_email
    desc: One open invitation per inviter and email.
    unique: true
    where: is_open AND invitee_email IS NOT NULL
    name: uq_network_invitation_inviter_app_user_id_invitee_email_open
  - columns:
    - invitee_email
    desc: Join-time matching.
    where: invitee_email IS NOT NULL
    name: idx_network_invitation_invitee_email_match
  - columns:
    - joined_app_user_id
    desc: Attribution lookup.
    where: joined_app_user_id IS NOT NULL
    name: idx_network_invitation_joined_app_user_id
  - columns:
    - sent_at
