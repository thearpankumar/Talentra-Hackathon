  kind: staging
  delete_policy: hard
  volume: very_high
  tier: X
  milestones:
  - B48
  - B51
  - B54
  retention: TTL 30 days after upload.
  description: One uploaded contact reduced to identifier hashes (no names, no plaintext).
  ttl:
    expire_after: 1 hour
    column: expires_at
  columns:
  - name: contact_import_id
    type: UUID
