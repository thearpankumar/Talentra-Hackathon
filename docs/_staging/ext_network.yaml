- name: contact_import
  kind: entity
  delete_policy: hard
  volume: high
  tier: X
  milestones:
  - B48
  - B51
  - B54
  retention: Entries TTL 30 days; batch row purged 12 months after upload or on erasure.
  description: One address-book upload batch (Google/Outlook/CSV). Raw hashed entries are short-lived; the batch row keeps counts for funnel analysis.
  no_hash_why: Keyed by user uuid first.
  columns:
  - name: app_user_id
    type: UUID
    domain: identifier
    sens: Internal
    desc: Uploader.
  - name: contact_import_source_id
    type: UUID
    domain: enum_ref
    sens: Internal
    desc: Source.
  - name: contact_import_status_id
    type: UUID
    domain: enum_ref
    sens: Internal
    desc: Processing state.
  - name: user_consent_id
    type: UUID
    domain: identifier
    sens: Internal
    desc: Consent record authorising the upload (Section 5 consent).
  - name: file_digest
    type: STRING(64)
    domain: secret_hash
    'null': true
    null_why: NULL = streamed API import without a file.
    sens: Internal
    desc: SHA-256 of the uploaded file for duplicate detection.
  - name: total_contacts
    type: INT4
    domain: quantity
    default: '0'
    sens: Internal
    desc: Contacts parsed.
  - name: matched_contacts
    type: INT4
    domain: quantity
    default: '0'
    sens: Internal
    desc: Contacts that matched members.
  - name: invited_contacts
    type: INT4
    domain: quantity
    default: '0'
    sens: Internal
    desc: Contacts later invited.
  - name: uploaded_at
    type: TIMESTAMPTZ
    domain: timestamp
    default: now()
    sens: Internal
    desc: Upload time.
  - name: processed_at
    type: TIMESTAMPTZ
    domain: timestamp
    'null': true
    null_why: NULL = not yet processed.
    sens: Internal
    desc: Matching finished.
  constraints:
  - name: ck_contact_import_counts
    type: check
    expr: matched_contacts <= total_contacts AND invited_contacts <= total_contacts
    desc: Counts are consistent.
  indexes:
  - columns:
    - app_user_id
    - uploaded_at DESC
    desc: Member import history.
    name: idx_contact_import_app_user_id_uploaded_at
  - columns:
    - file_digest
    desc: Duplicate upload detection.
    where: file_digest IS NOT NULL
