views:
- name: vw_connection_adjacency
  kind: view
  tables:
  - connection
  purpose: Presents the canonical edge as a directed adjacency list (both directions) without storing two rows.
  security: Internal; app role reads via this view only; never exposes created_by.
  sql_sketch: SELECT lo_app_user_id AS app_user_id, hi_app_user_id AS neighbour_app_user_id, connected_at FROM connection UNION ALL SELECT hi_app_user_id, lo_app_user_id, connected_at FROM connection
- name: vw_pending_connection_request
  kind: view
  tables:
  - connection_request
  purpose: Open invitations not yet expired, for inbox and sent lists.
  security: Rows visible only to requester or recipient (predicate on session user in the data-access layer).
  sql_sketch: SELECT * FROM connection_request WHERE is_pending AND (expires_at IS NULL OR expires_at > now())
- name: vw_public_profile_indexable
  kind: view
  tables:
  - public_profile_setting
  - public_profile_slug
  purpose: 'Members whose public page may be indexed: page enabled, no robots_noindex and privacy_setting.allow_search_engine_indexing; feeds sitemap_entry.'
  security: Internal job role only.
  sql_sketch: SELECT s.app_user_id, g.slug FROM public_profile_setting s JOIN privacy_setting p ON p.app_user_id = s.app_user_id JOIN public_profile_slug g ON g.app_user_id = s.app_user_id AND g.is_current
    WHERE s.is_public_page_enabled AND NOT s.robots_noindex AND p.allow_search_engine_indexing
- name: vw_upcoming_event
  kind: view
  tables:
  - event
  purpose: Published future events for discovery, excluding soft-deleted rows.
  security: Public columns only (no join_url).
  sql_sketch: SELECT id, title, starts_at, ends_at, event_format_id, city_id FROM event WHERE deleted_at IS NULL AND starts_at > now()
- name: vw_active_user_signal
  kind: view
  tables:
  - user_signal
  purpose: Signals currently in force (open-ended or not yet ended).
  security: Audience filtered by visibility_level_id in the application layer.
  sql_sketch: SELECT * FROM user_signal WHERE starts_at <= now() AND (ends_at IS NULL OR ends_at > now())
- name: mv_event_rsvp_headcount
  kind: materialized
  tables:
  - event_rsvp
  purpose: Going/maybe counts per event for listing pages; refreshed every few minutes (manual REFRESH, CRDB has no auto refresh).
  security: Aggregate only.
  sql_sketch: SELECT event_id, event_rsvp_status_id, count(*) AS rsvp_count, sum(1 + guest_count) AS seats FROM event_rsvp GROUP BY event_id, event_rsvp_status_id
business_rules:
- id: BR-NET-01
  rule: A connection is stored once per unordered pair.
  mechanism_type: CHECK
  mechanism: ck_connection_canonical_order (lo_app_user_id < hi_app_user_id) + uq_connection_lo_app_user_id_hi_app_user_id; the application sorts the two ids before insert.
  tables:
  - connection
  milestone: B48
- id: BR-NET-02
  rule: No self connections or self requests.
  mechanism_type: CHECK
  mechanism: ck_connection_request_not_self; ck_connection_canonical_order excludes lo=hi.
  tables:
  - connection
  - connection_request
  milestone: B48
- id: BR-NET-03
  rule: At most one open connection request per unordered pair, in either direction.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: Computed STORED pair_low_key/pair_high_key; unique index (pair_low_key,pair_high_key) WHERE is_pending.
  tables:
  - connection_request
  milestone: B48
- id: BR-NET-04
  rule: Accepting a request atomically creates the edge, closes the request and writes a connection_event.
  mechanism_type: TXN_LOCK
  mechanism: 'One transaction: SELECT request FOR UPDATE; INSERT connection ON CONFLICT DO NOTHING; UPDATE request SET is_pending=false, responded_at; INSERT connection_event; retry on 40001.'
  tables:
  - connection_request
  - connection
  - connection_event
  milestone: B48
- id: BR-NET-05
  rule: Weekly invitation quota is never exceeded.
  mechanism_type: CHECK
  mechanism: ck_connection_request_quota_bounds (sent_count <= limit_count); send txn runs UPDATE ... SET sent_count=sent_count+1 WHERE sent_count < limit_count and aborts when 0 rows.
  tables:
  - connection_request_quota
  milestone: B48
- id: BR-NET-06
  rule: Blocked users cannot connect or send requests; blocking removes the edge.
  mechanism_type: TXN_LOCK
  mechanism: Send/accept txn reads user_block (effective_to IS NULL, both directions) and aborts; block txn deletes connection, closes connection_request, deletes cache rows and inserts connection_event(removed_by_block).
  tables:
  - connection
  - connection_request
  - network_second_degree
  - mutual_connection_cache
  milestone: B48
- id: BR-NET-07
  rule: After a decline or ignore the requester cannot re-invite before cooldown_ends_at.
  mechanism_type: APP_LAYER
  mechanism: Send txn rejects when an earlier request for the pair has cooldown_ends_at > now(); the value is set when the response is recorded.
  tables:
  - connection_request
  milestone: B48
- id: BR-NET-08
  rule: Caches expire and never decide correctness.
  mechanism_type: TTL
  mechanism: ttl on network_second_degree, mutual_connection_cache, pymk_candidate(+reason); expiry column expires_at; hash-sharded idx on expires_at; ttl_job_cron >= gc.ttlseconds.
  tables:
  - network_second_degree
  - mutual_connection_cache
  - pymk_candidate
  - pymk_candidate_reason
  milestone: B48
- id: BR-NET-09
  rule: Address-book upload requires recorded consent; raw hashes are deleted after 30 days.
  mechanism_type: FK
  mechanism: fk_contact_import_user_consent_id (RESTRICT, NOT NULL) + TTL on contact_import_entry.expires_at.
  tables:
  - contact_import
  - contact_import_entry
  milestone: B48
- id: BR-NET-10
  rule: Contacts are stored only as peppered HMAC hashes; at least one hash per entry; no duplicates in a batch.
  mechanism_type: CHECK
  mechanism: ck_contact_import_entry_has_identifier; partial uniques uq_contact_import_entry_contact_import_id_email_hash_email / _phone.
  tables:
  - contact_import_entry
  milestone: B48
- id: BR-NET-11
  rule: A member can be matched by address books only if they allowed discoverability.
  mechanism_type: APP_LAYER
  mechanism: Matching joins contact_match_key; row exists only while discoverability consent is on; withdrawal deletes rows.
  tables:
  - contact_match_key
  milestone: B48
- id: BR-NET-12
  rule: One open invitation per inviter and email; invitation needs a contact point; phone is E.164 with country.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: uq_network_invitation_inviter_app_user_id_invitee_email_open WHERE is_open; ck_network_invitation_has_contact/_phone_e164/_phone_country/_email_lower.
  tables:
  - network_invitation
  milestone: B48
- id: BR-NET-13
  rule: A topic follow targets exactly one of hashtag, skill, industry and is unique per follower.
  mechanism_type: CHECK
  mechanism: ck_user_topic_follow_one_target + three partial unique indexes per target column.
  tables:
  - user_topic_follow
  milestone: B48
- id: BR-NET-14
  rule: Only one open endorsement request per skill and person; likewise per relationship for recommendations.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: Partial unique WHERE is_pending on endorsement_request and recommendation_request.
  tables:
  - endorsement_request
  - recommendation_request
  milestone: B48
- id: BR-NET-15
  rule: A newsletter belongs to exactly one owner (member or page); live slugs unique; issue numbers unique.
  mechanism_type: CHECK
  mechanism: ck_newsletter_one_owner; uq partial indexes on slug and (newsletter_id,issue_no) WHERE deleted_at IS NULL.
  tables:
  - newsletter
  - newsletter_issue
  milestone: B48
- id: BR-NET-16
  rule: Events end after they start; sessions, tickets windows and rooms are ordered ranges.
  mechanism_type: CHECK
  mechanism: ck_event_ends_after_starts, ck_event_session_ends_after_starts, ck_event_ticket_type_sales_window, ck_live_room_planned_order.
  tables:
  - event
  - event_session
  - event_ticket_type
  - live_room
  milestone: B48
- id: BR-NET-17
  rule: RSVPs cannot exceed event capacity.
  mechanism_type: TXN_LOCK
  mechanism: RSVP txn does SELECT event FOR UPDATE, counts going seats (event_rsvp), compares to capacity, inserts or marks waitlisted; uq_event_rsvp_event_id_attendee_app_user_id prevents duplicates.
  tables:
  - event
  - event_rsvp
  milestone: B48
- id: BR-NET-18
  rule: A ticket price and currency are both present or both absent; paid tickets reference a payment order.
  mechanism_type: CHECK
  mechanism: ck_event_ticket_type_price_with_currency; event_ticket.payment_order_id NOT NULL enforced by application for paid kinds.
  tables:
  - event_ticket_type
  - event_ticket
  milestone: B48
- id: BR-NET-19
  rule: One check-in per attendee per event (and per session).
  mechanism_type: PARTIAL_UNIQUE
  mechanism: Partial uniques on event_attendance WHERE event_session_id IS NULL / IS NOT NULL.
  tables:
  - event_attendance
  milestone: B48
- id: BR-NET-20
  rule: Event reminders are dispatched once.
  mechanism_type: UNIQUE
  mechanism: uq_event_reminder_event_id_attendee_app_user_id_remind_at; dispatcher sets sent_at in the same txn as notification insert.
  tables:
  - event_reminder
  milestone: B48
- id: BR-NET-21
  rule: A page has at most one pinned update; reactions are one per member and update.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: uq_organisation_update_organisation_id_pinned WHERE is_pinned AND deleted_at IS NULL; uq_organisation_update_reaction_organisation_update_id_reactor_app_user_id.
  tables:
  - organisation_update
  - organisation_update_reaction
  milestone: B48
- id: BR-NET-22
  rule: One alumni membership per institution and member; class year plausible.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: uq_alumni_membership_institution_id_alumnus_app_user_id_pair; ck_alumni_membership_year_range.
  tables:
  - alumni_membership
  milestone: B48
- id: BR-NET-23
  rule: A member holds one active badge per type and issuer; revoked or expired badges are not shown.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: Computed issuer_key + unique (app_user_id,badge_type_id,issuer_key) WHERE revoked_at IS NULL; display filters expires_at.
  tables:
  - user_badge
  milestone: B48
- id: BR-NET-24
  rule: One open signal per type and member.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: uq_user_signal_app_user_id_network_signal_type_id_open WHERE ends_at IS NULL.
  tables:
  - user_signal
  milestone: B48
- id: BR-NET-25
  rule: A vanity slug is unique across current and redirecting slugs and not reserved.
  mechanism_type: UNIQUE
  mechanism: uq_public_profile_slug_slug; ck_public_profile_slug_slug_format; claim txn checks reserved_slug (uq slug) before insert.
  tables:
  - public_profile_slug
  - reserved_slug
  milestone: B48
- id: BR-NET-26
  rule: Exactly one current slug per member; old slugs redirect until released.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: uq_public_profile_slug_app_user_id_current WHERE is_current; ck_public_profile_slug_redirect_has_expiry; release job moves rows to public_profile_slug_history.
  tables:
  - public_profile_slug
  - public_profile_slug_history
  milestone: B48
- id: BR-NET-27
  rule: Slug changes are rate limited.
  mechanism_type: APP_LAYER
  mechanism: Change txn counts public_profile_slug_history rows for the member in the trailing 30 days via idx_..._app_user_id_changed_at_rate.
  tables:
  - public_profile_slug_history
  milestone: B48
- id: BR-NET-28
  rule: A page is indexable only if the public page is enabled, robots_noindex is false and privacy_setting.allow_search_engine_indexing is true.
  mechanism_type: VIEW
  mechanism: vw_public_profile_indexable is the only source for sitemap_entry generation; privacy change deletes the member's sitemap_entry in the same txn.
  tables:
  - public_profile_setting
  - sitemap_entry
  milestone: B48
- id: BR-NET-29
  rule: A sitemap entry targets exactly one entity and sits in a shard of <=50,000 URLs.
  mechanism_type: CHECK
  mechanism: ck_sitemap_entry_one_target; shard assignment by the writer job.
  tables:
  - sitemap_entry
  milestone: B48
- id: BR-NET-30
  rule: Profile visitors honour the owner's and visitor's viewing mode.
  mechanism_type: APP_LAYER
  mechanism: Writer stores visitor_app_user_id NULL for private mode (aggregated row) and profile_visit_mode_id hidden_by_setting when the owner disabled the feature; reads filter by plan window.
  tables:
  - profile_visitor_daily
  milestone: B48
- id: BR-NET-31
  rule: Share-link codes are unique and unguessable; expired links stop resolving.
  mechanism_type: UNIQUE
  mechanism: uq_profile_share_link_short_code; resolver checks is_active and expires_at.
  tables:
  - profile_share_link
  milestone: B48
- id: BR-NET-32
  rule: Graph counters are recomputed, never incremented under contention; negative values impossible.
  mechanism_type: CHECK
  mechanism: ck_network_graph_stat_non_negative; periodic job rewrites the row.
  tables:
  - network_graph_stat
  milestone: B48
