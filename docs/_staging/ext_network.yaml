  - name: email_hash
    type: BYTES
    domain: secret_hash
    'null': true
    null_why: NULL = phone-only contact.
    sens: Personal
    pii: HMAC-SHA256 with pepper; plaintext never stored
    desc: HMAC of the contact's email.
  - name: phone_hash
    type: BYTES
    domain: secret_hash
    'null': true
    null_why: NULL = email-only contact.
    sens: Personal
    pii: HMAC-SHA256 with pepper; plaintext never stored
    desc: HMAC of the contact's phone.
  - name: matched_app_user_id
    type: UUID
    domain: identifier
    'null': true
    null_why: NULL = no member matched (yet).
    sens: Internal
    desc: Matched member.
  - name: is_invited
    type: BOOL
    domain: boolean
    default: 'false'
    sens: Internal
    desc: True once an invitation was sent to this contact.
