  - name: idx_contact_import_contact_import_source_id
    columns:
    - contact_import_source_id
    desc: Leading index for FK contact_import_source_id (D-20).
  - name: idx_contact_import_contact_import_status_id
    columns:
    - contact_import_status_id
    desc: Leading index for FK contact_import_status_id (D-20).
  - name: idx_contact_import_user_consent_id
    columns:
    - user_consent_id
    desc: Leading index for FK user_consent_id (D-20).
  fks:
