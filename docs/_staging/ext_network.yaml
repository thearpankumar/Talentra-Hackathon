- name: network_second_degree
  kind: snapshot
  delete_policy: hard
  volume: very_high
  tier: X
  milestones:
  - B48
  - B51
  - B54
  retention: TTL 3 days; only members active in the last 30 days are materialised.
  description: Materialised capped second-degree reach per ACTIVE member (top-N by mutual count) with TTL; avoids 500x500 fan-out joins at read time.
  ttl:
    expire_after: 1 hour
    column: expires_at
  columns:
  - name: app_user_id
    type: UUID
    domain: identifier
    sens: Internal
    desc: Viewer.
  - name: reach_app_user_id
    type: UUID
    domain: identifier
    sens: Internal
    desc: Person at distance degree_level.
  - name: via_app_user_id
    type: UUID
    domain: identifier
    sens: Internal
    desc: One sample bridging connection.
  - name: degree_level
    type: INT2
    domain: quantity
    sens: Internal
    desc: Graph distance (2 or 3).
  - name: mutual_count
    type: INT4
    domain: quantity
    sens: Internal
    desc: Number of bridging connections.
  - name: computed_at
    type: TIMESTAMPTZ
    domain: timestamp
    default: now()
    sens: Internal
    desc: Computation time.
  - name: expires_at
    type: TIMESTAMPTZ
    domain: timestamp
    default: now() + INTERVAL '3 days'
    sens: Internal
    desc: Row-level TTL column.
  constraints:
  - name: uq_network_second_degree_app_user_id_reach_app_user_id
    type: unique
    columns:
    - app_user_id
    - reach_app_user_id
    desc: Natural key (app_user_id, reach_app_user_id).
  - name: ck_network_second_degree_degree
    type: check
    expr: degree_level IN (2, 3)
    desc: Only 2nd/3rd degree cached.
  indexes:
  - columns:
    - app_user_id
    - mutual_count DESC
    desc: Ranked reach list.
    storing:
    - reach_app_user_id
    name: idx_network_second_degree_app_user_id_mutual_count
  - columns:
    - reach_app_user_id
    desc: Invalidate on block/erasure.
    name: idx_network_second_degree_reach_app_user_id
  - columns:
    - via_app_user_id
    desc: Invalidate when a bridge disconnects.
    name: idx_network_second_degree_via_app_user_id
  - columns:
    - expires_at
    desc: TTL scan.
    hash: true
    bucket_count: 32
    name: idx_network_second_degree_expires_at
  fks:
  - name: fk_network_second_degree_app_user_id
    columns:
    - app_user_id
    ref: app_user
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: Child data follows the parent row.
  - name: fk_network_second_degree_reach_app_user_id
    columns:
    - reach_app_user_id
    ref: app_user
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: Child data follows the parent row.
  - name: fk_network_second_degree_via_app_user_id
    columns:
    - via_app_user_id
    ref: app_user
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: Child data follows the parent row.
