  - columns:
    - contact_import_id
    - phone_hash
    desc: Dedupe phone within a batch.
    unique: true
    where: phone_hash IS NOT NULL
    name: uq_contact_import_entry_contact_import_id_phone_hash_phone
  - columns:
    - email_hash
    desc: 'Reverse match: who holds my email in their contacts.'
    where: email_hash IS NOT NULL
    name: idx_contact_import_entry_email_hash_rev
  - columns:
    - phone_hash
    desc: Reverse match by phone.
    where: phone_hash IS NOT NULL
    name: idx_contact_import_entry_phone_hash_rev
  - columns:
    - expires_at
