    type: UUID
    domain: enum_ref
    sens: Internal
    desc: Email or phone.
  - name: match_hash
    type: BYTES
    domain: secret_hash
    sens: Sensitive
    pii: HMAC with pepper held in KMS; not reversible without the key
    desc: HMAC-SHA256 of the normalised identifier with a server pepper.
  - name: verified_at
    type: TIMESTAMPTZ
    domain: timestamp
    sens: Internal
    desc: When the identifier was verified.
  constraints:
  - name: uq_contact_match_key_contact_match_kind_id_match_hash
