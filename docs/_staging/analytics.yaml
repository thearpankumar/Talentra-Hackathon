    en: Hours
    hi: घंटे
    sort: 40
  - code: amount
    en: Money amount
    hi: राशि
    sort: 50
  - code: credits
    en: Credits
    hi: क्रेडिट
    sort: 60
- name: dim_kpi_grain
  description: Reporting grain at which a KPI aggregate is refreshed.
  milestones:
  - B55
  values:
  - code: daily
    en: Daily
    hi: दैनिक
    sort: 10
  - code: weekly
    en: Weekly
    hi: साप्ताहिक
    sort: 20
  - code: monthly
    en: Monthly
    hi: मासिक
    sort: 30
  - code: cohort
    en: Cohort
    hi: समूह
    sort: 40
tables:
- name: dim_etl_run
  kind: dim
  delete_policy: hard
  volume: medium
  tier: '1'
  milestones:
  - B49
  - B52
  - B58
  retention: Run history kept 3 years then archived; never deleted while a fact row still references the run.
  description: 'Grain: one row per analytic load or aggregate refresh run of one pipeline over one source window. Kimball ''audit dimension'': every fact/aggregate/dimension row points to the run that wrote
    it (lineage), and a restatement run points to the run it supersedes. ETL = extract-transform-load.'
  columns:
  - name: pipeline_code
    type: STRING(64)
    domain: code
    desc: Name of the pipeline, for example 'fact_application_event' or 'agg_funnel_daily'.
    sens: Internal
  - name: run_key
    type: STRING(150)
    domain: code
    desc: 'Deterministic idempotency key: pipeline_code|window_from|window_to|run_type. A re-triggered job finds its own row.'
    sens: Internal
  - name: dim_etl_run_type_id
    type: UUID
    domain: enum_ref
    desc: Incremental, backfill, restatement or full rebuild.
    sens: Internal
  - name: dim_etl_run_status_id
    type: UUID
    domain: enum_ref
    desc: Running, succeeded, failed, partial or abandoned.
    sens: Internal
  - name: started_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Run start (UTC).
    sens: Internal
    default: now()
  - name: finished_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Run end (UTC).
    sens: Internal
    'null': true
    null_why: NULL while the run is still running
  - name: source_window_from_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Lower bound (inclusive) of the source change window processed.
    sens: Internal
  - name: source_window_to_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: 'Upper bound (exclusive) of the source window: the watermark advanced to on success.'
    sens: Internal
  - name: snapshot_as_of_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: The AS OF SYSTEM TIME instant at which source tables were read (follower_read_timestamp() at run start).
    sens: Internal
  - name: rows_read
    type: INT8
    domain: quantity
    desc: Rows read from source.
    sens: Internal
    default: '0'
  - name: rows_inserted
    type: INT8
    domain: quantity
    desc: Rows inserted into the target.
    sens: Internal
    default: '0'
  - name: rows_updated
    type: INT8
    domain: quantity
    desc: Rows updated (SCD2 close-outs, aggregate upserts, accumulating-snapshot milestones).
    sens: Internal
    default: '0'
  - name: rows_rejected
    type: INT8
    domain: quantity
    desc: Rows rejected by data-quality rules and routed to the reject log.
    sens: Internal
    default: '0'
  - name: attempt_no
    type: INT2
    domain: quantity
    desc: Attempt counter for retried runs.
    sens: Internal
    default: '1'
  - name: code_version
    type: STRING(40)
    domain: code
    desc: Git revision of the ETL code, for reproducibility.
    sens: Internal
  - name: error_message
    type: STRING(2000)
    domain: free_text
    desc: Failure detail (no row payloads, to avoid PII).
    sens: Internal
    'null': true
    null_why: NULL when the run did not fail
  - name: restated_dim_etl_run_id
    type: UUID
    domain: identifier
    desc: Run superseded by this restatement run.
    sens: Internal
    'null': true
    null_why: NULL unless run_type is restatement
  constraints:
  - name: ck_dim_etl_run_window_range
    type: check
    expr: source_window_to_at >= source_window_from_at
    desc: Window must not be inverted
  - name: ck_dim_etl_run_finished_range
    type: check
    expr: finished_at IS NULL OR finished_at >= started_at
    desc: Run cannot finish before it starts
  - name: uq_dim_etl_run_run_key
    type: unique
    columns:
    - run_key
    desc: Idempotent run registration.
  - name: ck_dim_etl_run_counts_nonneg
    type: check
    expr: rows_read >= 0 AND rows_inserted >= 0 AND rows_updated >= 0 AND rows_rejected >= 0 AND attempt_no >= 0
    desc: Counters are never negative
  indexes:
  - name: idx_dim_etl_run_pipeline_code_started_at
    columns:
    - pipeline_code
    - started_at DESC
    desc: Latest runs of a pipeline (ops dashboard, watermark resume).
  - name: idx_dim_etl_run_restated_dim_etl_run_id
    columns:
    - restated_dim_etl_run_id
    desc: 'Foreign-key leading index: parent-to-children lookups for this star key.'
  fks:
  - name: fk_dim_etl_run_dim_etl_run_type_id
    columns:
    - dim_etl_run_type_id
    ref: dim_etl_run_type
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: lookup values are retired, never deleted'
    index_exempt: lookup with a handful of values; no reverse lookup needed
  - name: fk_dim_etl_run_dim_etl_run_status_id
    columns:
    - dim_etl_run_status_id
    ref: dim_etl_run_status
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: lookup values are retired, never deleted'
    index_exempt: lookup with a handful of values; no reverse lookup needed
  - name: fk_dim_etl_run_restated_dim_etl_run_id
    columns:
    - restated_dim_etl_run_id
    ref: dim_etl_run
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: dimension members are retained for the life of the facts that reference them'
- name: dim_etl_watermark
  kind: config
  delete_policy: hard
  volume: low
  tier: '1'
  milestones:
  - B52
  - B58
  retention: Configuration; one row per pipeline for the life of the pipeline.
  description: 'Grain: one row per pipeline holding the high-water mark of source changes already loaded. Advanced inside the same transaction that commits a successful run.'
  columns:
  - name: pipeline_code
    type: STRING(64)
    domain: code
    desc: Pipeline name (matches dim_etl_run.pipeline_code).
    sens: Internal
  - name: source_table_code
    type: STRING(64)
    domain: code
    desc: OLTP table or changefeed topic the pipeline reads.
    sens: Internal
  - name: last_watermark_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Source change time up to which data is loaded.
    sens: Internal
    'null': true
    null_why: NULL = pipeline has never run
  - name: last_successful_dim_etl_run_id
    type: UUID
    domain: identifier
    desc: Run that last advanced the watermark.
    sens: Internal
    'null': true
    null_why: NULL = pipeline has never run
  - name: late_arrival_window
    type: INTERVAL
    domain: duration
    desc: How far behind the watermark the incremental window re-reads to catch late-arriving source rows.
    sens: Internal
    default: '''48:00:00''::INTERVAL'
  - name: is_paused
    type: BOOL
    domain: boolean
    desc: True stops scheduled runs (operator switch).
    sens: Internal
    default: 'false'
  constraints:
  - name: uq_dim_etl_watermark_pipeline_code
    type: unique
    columns:
    - pipeline_code
    desc: One watermark per pipeline.
  indexes:
  - name: idx_dim_etl_watermark_last_successful_dim_etl_run_id
    columns:
    - last_successful_dim_etl_run_id
    desc: 'Foreign-key leading index: parent-to-children lookups for this star key.'
  fks:
  - name: fk_dim_etl_watermark_last_successful_dim_etl_run_id
    columns:
    - last_successful_dim_etl_run_id
    ref: dim_etl_run
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: dimension members are retained for the life of the facts that reference them'
- name: dim_kpi_definition
  kind: dim
  delete_policy: hard
  volume: low
  tier: '1'
  milestones:
  - B49
  - B55
  retention: Reference; versioned by SCD1 overwrite with history in audit columns; never deleted.
  description: 'Grain: one row per KPI. Machine-readable catalogue of the KPI definitions, formulas, units and the aggregate table that serves each.'
  columns:
  - name: kpi_code
    type: STRING(40)
    domain: code
    desc: Stable KPI code, for example K01_time_to_fill.
    sens: Internal
  - name: kpi_name
    type: STRING(150)
    domain: free_text
    desc: Business name of the KPI.
    sens: Public
  - name: definition
    type: STRING(2000)
    domain: free_text
    desc: Plain-language definition including inclusion and exclusion rules.
    sens: Internal
  - name: formula
    type: STRING(2000)
    domain: free_text
    desc: Exact formula (SQL-style) over the serving aggregate columns.
    sens: Internal
  - name: dim_kpi_unit_id
    type: UUID
    domain: enum_ref
    desc: Unit of the KPI value.
    sens: Internal
  - name: dim_kpi_grain_id
    type: UUID
    domain: enum_ref
    desc: Grain at which the KPI is refreshed.
    sens: Internal
  - name: serving_table_code
    type: STRING(64)
    domain: code
    desc: Aggregate table that serves the KPI.
    sens: Internal
  - name: is_higher_better
    type: BOOL
    domain: boolean
    desc: True when a larger value is an improvement.
    sens: Internal
    default: 'true'
  - name: is_active
    type: BOOL
    domain: boolean
    desc: False = KPI retired from dashboards.
    sens: Internal
    default: 'true'
  constraints:
  - name: uq_dim_kpi_definition_kpi_code
    type: unique
    columns:
    - kpi_code
    desc: Natural key.
  fks:
  - name: fk_dim_kpi_definition_dim_kpi_unit_id
    columns:
    - dim_kpi_unit_id
    ref: dim_kpi_unit
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: lookup values are retired, never deleted'
    index_exempt: lookup with a handful of values; no reverse lookup needed
  - name: fk_dim_kpi_definition_dim_kpi_grain_id
    columns:
    - dim_kpi_grain_id
    ref: dim_kpi_grain
    ref_columns:
    - id
