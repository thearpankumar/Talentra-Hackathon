- name: fact_subscription_daily_snapshot
  kind: fact
  delete_policy: append_only
  volume: high
  tier: '1'
  milestones:
  - B49
  - B52
  - B55
  - B58
  retention: Append-only history. Kept 7 years in-cluster (financial facts 8 years); older months are exported through the changefeed to the warehouse and removed by the monthly archive job. No PII is held,
    so erasure requests need no fact rewrite (dimension rows are anonymised).
  description: 'Grain: one row per subscription x day (periodic snapshot of active, grace and scheduled-cancel states); source of monthly recurring revenue and churn.'
  columns:
  - name: dim_date_id
    type: UUID
    domain: identifier
    desc: Snapshot date.
    sens: Internal
  - name: load_dim_etl_run_id
    type: UUID
    domain: identifier
    desc: 'Audit dimension: the ETL run that inserted (or last rewrote) this row; lineage and restatement tracking.'
    sens: Internal
  - name: subscription_id
    type: UUID
    domain: identifier
    desc: subscription.id (copy).
    sens: Internal
    external_ref: true
  - name: dim_organisation_id
    type: UUID
    domain: identifier
    desc: Subscriber organisation version.
    sens: Internal
  - name: dim_plan_id
    type: UUID
    domain: identifier
    desc: Plan version in force.
    sens: Internal
  - name: monthly_recurring_value_amount
    type: DECIMAL(18,4)
    domain: money
    desc: MRR contribution that day (0 amount when not active, which is a true zero).
    sens: Internal
  - name: seats_licensed
    type: INT4
    domain: quantity
    desc: Licensed seats.
    sens: Internal
    default: '0'
  - name: seats_assigned
    type: INT4
    domain: quantity
    desc: Seats allocated to users.
    sens: Internal
    default: '0'
  - name: days_to_expiry
    type: INT4
    domain: duration
    desc: Days until the current period ends.
    sens: Internal
    'null': true
    null_why: NULL = already expired or evergreen
  - name: is_active
    type: BOOL
    domain: boolean
    desc: Subscription is in an active paid period.
    sens: Internal
    default: 'false'
  - name: is_in_grace
    type: BOOL
    domain: boolean
    desc: Past period end but within the grace window.
    sens: Internal
    default: 'false'
  - name: is_cancel_scheduled
    type: BOOL
    domain: boolean
    desc: Cancellation scheduled at period end.
    sens: Internal
    default: 'false'
  - name: snapshot_date
    type: DATE
    domain: date
    desc: Calendar date copy of the dim_date key. UUID keys are not time-ordered, so range scans and hash-sharded time indexes use this column; the loader guarantees it equals dim_date.full_date.
