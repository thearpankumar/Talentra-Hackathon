    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: dimension members are retained for the life of the facts that reference them'
  - name: fk_dim_candidate_signup_dim_date_id
    columns:
    - signup_dim_date_id
    ref: dim_date
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: dimension members are retained for the life of the facts that reference them'
  - name: fk_dim_candidate_dim_placeholder_kind_id
    columns:
    - dim_placeholder_kind_id
    ref: dim_placeholder_kind
