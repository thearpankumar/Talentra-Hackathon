- name: agg_data_quality_result
  kind: agg
  delete_policy: hard
  volume: medium
  tier: '1'
  milestones:
  - B52
  - B58
  retention: Kept 13 months.
  description: 'Grain: one row per data-quality check executed in one ETL run (row-count reconciliation, referential completeness, grain uniqueness). Failed checks block aggregate publication.'
  audit: created_only
  columns:
  - name: checked_dim_etl_run_id
    type: UUID
    domain: identifier
    desc: Run the check belongs to.
    sens: Internal
  - name: check_code
    type: STRING(64)
    domain: code
    desc: Check identifier, for example fact_orphan_dimension_keys.
    sens: Internal
  - name: target_table_code
    type: STRING(64)
    domain: code
    desc: Table checked.
    sens: Internal
  - name: rows_checked
    type: INT8
    domain: quantity
    desc: Rows examined.
    sens: Internal
    default: '0'
  - name: rows_failed
    type: INT8
    domain: quantity
    desc: Rows that failed.
    sens: Internal
    default: '0'
  - name: is_blocking
    type: BOOL
    domain: boolean
    desc: Failure prevents publishing the run output.
    sens: Internal
    default: 'true'
  - name: is_passed
    type: BOOL
    domain: boolean
    desc: Check passed.
    sens: Internal
    default: 'false'
  - name: last_refreshed_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Time the check was executed.
    sens: Internal
    default: now()
  constraints:
  - name: uq_agg_data_quality_result_run_check
    type: unique
    columns:
    - checked_dim_etl_run_id
    - check_code
    - target_table_code
    desc: One result per run, check and table.
  - name: ck_agg_data_quality_result_counts_nonneg
    type: check
    expr: rows_checked >= 0 AND rows_failed >= 0
    desc: Counters are never negative
  fks:
  - name: fk_agg_data_quality_result_checked_dim_etl_run_id
    columns:
    - checked_dim_etl_run_id
    ref: dim_etl_run
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: dimension members are retained for the life of the facts that reference them'
views:
- name: vw_unified_demand_daily
  kind: view
  tables:
  - fact_job_posting_daily
  - fact_gig_request_daily
  - dim_demand_type
  - dim_job_category
  - dim_location
  - dim_date
  purpose: 'Unified labour demand across job requirements and gig requests (docket gig-vs-job reporting trade-off): one row per demand item per day with open positions, applications, and job category/location/date
    conformed.'
  security: analytics_reader SELECT only; contains no PII
  sql_sketch: SELECT d.full_date, 'job_requirement' AS demand_kind, f.dim_job_requirement_id AS demand_ref, f.dim_job_category_id, f.dim_location_id, f.positions_open, f.applications_in_day FROM fact_job_posting_daily
    f JOIN dim_date d ON d.id = f.dim_date_id UNION ALL SELECT d.full_date, 'gig_request', g.gig_request_id::UUID, g.dim_job_category_id, g.dim_location_id, g.positions_open, g.applications_in_day FROM
    fact_gig_request_daily g JOIN dim_date d ON d.id = g.dim_date_id
- name: vw_dim_candidate_current
  kind: view
  tables:
  - dim_candidate
  purpose: Current version of each candidate (is_current) excluding erased rows, for supply dashboards.
  security: analytics_reader; Personal key hidden from BI role by column grant
  sql_sketch: SELECT * FROM dim_candidate WHERE is_current AND NOT is_erased
- name: vw_dim_organisation_current
  kind: view
  tables:
  - dim_organisation
  purpose: Current organisation version.
  security: analytics_reader
  sql_sketch: SELECT * FROM dim_organisation WHERE is_current
- name: vw_dim_job_requirement_current
  kind: view
  tables:
  - dim_job_requirement
  purpose: Current requirement version.
  security: analytics_reader
  sql_sketch: SELECT * FROM dim_job_requirement WHERE is_current
- name: vw_dim_user_current
  kind: view
  tables:
  - dim_user
  purpose: Current employer-side user version.
  security: analytics_reader
  sql_sketch: SELECT * FROM dim_user WHERE is_current AND NOT is_erased
- name: vw_kpi_catalogue
  kind: view
  tables:
  - dim_kpi_definition
  - dim_kpi_unit
  - dim_kpi_grain
  purpose: KPI definitions with unit and grain labels for the dashboard glossary.
  security: analytics_reader
  sql_sketch: SELECT k.kpi_code, k.kpi_name, k.formula, u.name_i18n->>'en' AS unit FROM dim_kpi_definition k JOIN dim_kpi_unit u ON u.id = k.dim_kpi_unit_id WHERE k.is_active
- name: vw_pipeline_latency
  kind: view
  tables:
  - fact_application_pipeline
  - dim_job_type
  - dim_source
  purpose: Mean lags of the accumulating snapshot by source and job type (time-to-hire drill-down).
  security: analytics_reader
  sql_sketch: SELECT dim_source_id, dim_job_type_id, avg(lag_applied_to_offer_accepted_days) FROM fact_application_pipeline WHERE is_hired GROUP BY 1,2
- name: vw_etl_freshness
  kind: view
  tables:
  - dim_etl_watermark
  - dim_etl_run
  purpose: Per-pipeline watermark lag and last run status for freshness monitoring and the publish gate.
  security: analytics_reader and operators
  sql_sketch: SELECT w.pipeline_code, now() - w.last_watermark_at AS lag, r.dim_etl_run_status_id FROM dim_etl_watermark w LEFT JOIN dim_etl_run r ON r.id = w.last_successful_dim_etl_run_id
- name: mv_funnel_last_90_days
  kind: materialized
  tables:
  - agg_funnel_daily
  - dim_date
  purpose: 'Dashboard tile: 90-day funnel by job category; refreshed by scheduled job after the publish gate (REFRESH MATERIALIZED VIEW ... AS OF SYSTEM TIME follower_read_timestamp()).'
  security: analytics_reader
  sql_sketch: SELECT dim_job_category_id, sum(applications) applications, sum(joined) joined FROM agg_funnel_daily WHERE period_date >= current_date - 90 GROUP BY 1
- name: mv_kpi_summary_monthly
  kind: materialized
  tables:
  - agg_time_to_fill_monthly
  - agg_offer_acceptance_monthly
  - agg_cost_per_hire_monthly
  - agg_revenue_monthly
  purpose: 'Executive KPI sheet: K01, K05, K06, K14 per month; refreshed hourly.'
  security: analytics_reader
  sql_sketch: SELECT period_date, ... FROM agg_time_to_fill_monthly t JOIN agg_offer_acceptance_monthly o USING (period_date) ...
- name: mv_recruiter_leaderboard_30d
  kind: materialized
  tables:
  - agg_recruiter_activity_daily
  - dim_user
  purpose: Recruiter response rate and activity ranking over 30 days.
  security: analytics_reader; display names resolved in the application under RBAC
  sql_sketch: SELECT recruiter_dim_user_id, sum(first_response_within_sla)::DECIMAL / nullif(sum(applications_received),0) AS response_rate FROM agg_recruiter_activity_daily WHERE period_date >= current_date
    - 30 GROUP BY 1
- name: mv_mrr_trend
  kind: materialized
  tables:
  - agg_revenue_monthly
  - dim_plan
  purpose: MRR movement by plan (new, expansion, contraction, churn).
  security: analytics_reader, finance role
  sql_sketch: SELECT period_date, dim_plan_id, sum(closing_mrr_amount) FROM agg_revenue_monthly GROUP BY 1,2
- name: mv_wallet_cover_risk
  kind: materialized
  tables:
  - agg_wallet_burn_daily
  - fact_wallet_transaction
  purpose: Organisations whose days of cover is below 7 (upsell and churn-risk list).
  security: analytics_reader, account managers
  sql_sketch: SELECT dim_organisation_id, closing balance / avg 7-day burn AS days_of_cover FROM fact_wallet_transaction ... HAVING days_of_cover < 7
- name: vw_gig_vs_job_fill
  kind: view
  tables:
  - agg_gig_fill_rate_weekly
  - agg_time_to_fill_monthly
  - dim_demand_type
  purpose: Side-by-side fill rate and speed for gigs vs jobs per category.
  security: analytics_reader
  sql_sketch: SELECT 'gig' kind, period_date, dim_job_category_id, fill_rate FROM agg_gig_fill_rate_weekly UNION ALL SELECT 'job', period_date, dim_job_category_id, fill_rate FROM agg_time_to_fill_monthly
business_rules:
- id: BR-ANA-01
  rule: At most one current version exists per natural key of every SCD2 dimension.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: CREATE UNIQUE INDEX uq_dim_candidate_candidate_profile_id ON dim_candidate (candidate_profile_id) WHERE is_current; same on dim_organisation, dim_user, dim_job_requirement, dim_gig_worker,
    dim_plan.
  tables:
  - dim_candidate
  - dim_organisation
  - dim_user
  - dim_job_requirement
  - dim_gig_worker
  - dim_plan
  milestone: B58
- id: BR-ANA-02
  rule: SCD2 intervals are valid and is_current agrees with an open-ended valid_to.
  mechanism_type: CHECK
  mechanism: CHECK (valid_to IS NULL OR valid_to >= valid_from) and CHECK ((is_current AND valid_to IS NULL) OR (NOT is_current AND valid_to IS NOT NULL)).
  tables:
  - dim_candidate
  - dim_organisation
  - dim_user
  - dim_job_requirement
  - dim_gig_worker
  - dim_plan
  milestone: B58
- id: BR-ANA-03
  rule: 'SCD2 change is applied atomically: close the old version and insert the new one in one transaction.'
  mechanism_type: TXN_LOCK
  mechanism: BEGIN; SELECT ... FROM dim_x WHERE natural_key = $1 AND is_current FOR UPDATE; UPDATE ... SET valid_to = $change, is_current = false; INSERT new version with version_no + 1; COMMIT; client
    retries on SQLSTATE 40001. The partial unique index (BR-ANA-01) makes a concurrent duplicate insert fail.
  tables:
  - dim_candidate
  - dim_organisation
  - dim_job_requirement
  milestone: B58
- id: BR-ANA-04
  rule: Every fact and aggregate row references a dimension member, never NULL for unknown; unknown vs not applicable are different placeholder rows.
  mechanism_type: FK
  mechanism: NOT NULL dimension FK columns with ON DELETE RESTRICT; reserved placeholder members have dim_placeholder_kind_id set; loaders substitute the placeholder instead of NULL.
  tables:
  - fact_application_event
  - fact_search_event
  - fact_profile_view
  - fact_wallet_transaction
  milestone: B52
- id: BR-ANA-05
  rule: Dimension members cannot be deleted while facts reference them.
  mechanism_type: FK
  mechanism: All fact->dimension and aggregate->dimension FKs are ON DELETE RESTRICT ON UPDATE RESTRICT.
  tables:
  - fact_application_pipeline
  - agg_funnel_daily
  - agg_revenue_monthly
  milestone: B52
- id: BR-ANA-06
  rule: Event facts are append-only; corrections are new rows referencing the same source.
  mechanism_type: PRIVILEGE
  mechanism: REVOKE UPDATE, DELETE ON fact_* FROM analytics_etl, analytics_reader; GRANT INSERT, SELECT. Accumulating snapshots (fact_application_pipeline, fact_gig_assignment, fact_support_ticket, fact_outreach_recipient)
    keep UPDATE for analytics_etl only. Archival deletes run under a separate analytics_archive role.
  tables:
  - fact_application_event
  - fact_wallet_transaction
  - fact_payment
  - fact_search_event
  milestone: B58
- id: BR-ANA-07
  rule: A source event is loaded at most once.
  mechanism_type: UNIQUE
  mechanism: UNIQUE (source_ref) on event facts; loader uses INSERT ... ON CONFLICT (source_ref) DO NOTHING.
  tables:
  - fact_application_event
  - fact_profile_view
  - fact_notification_delivery
  - fact_wallet_transaction
  - fact_payment
  milestone: B58
- id: BR-ANA-08
  rule: Periodic snapshots hold one row per entity per day.
  mechanism_type: UNIQUE
  mechanism: UNIQUE (entity key, dim_date_id) on fact_job_posting_daily, fact_gig_request_daily, fact_subscription_daily_snapshot, fact_candidate_activity_daily, fact_licence_seat_daily; loader upserts.
  tables:
  - fact_job_posting_daily
  - fact_gig_request_daily
  - fact_subscription_daily_snapshot
  - fact_candidate_activity_daily
  - fact_licence_seat_daily
  milestone: B58
- id: BR-ANA-09
  rule: Accumulating snapshots have one row per lifecycle and milestone lags are non-negative.
  mechanism_type: UNIQUE
  mechanism: UNIQUE (natural key) plus CHECK (lag_x IS NULL OR lag_x >= 0); milestone updates are INSERT ... ON CONFLICT (natural key) DO UPDATE SET milestone columns where the new value is later than the
    old.
  tables:
  - fact_application_pipeline
  - fact_gig_assignment
  - fact_support_ticket
  - fact_outreach_recipient
  milestone: B58
- id: BR-ANA-10
  rule: Aggregates have exactly one row per grain cell; refresh is idempotent.
  mechanism_type: UNIQUE
  mechanism: UNIQUE constraint uq_<agg>_grain over all grain dimension keys (currency included for money); INSERT ... ON CONFLICT (grain columns) DO UPDATE re-aggregating the affected cells.
  tables:
  - agg_funnel_daily
  - agg_revenue_monthly
  - agg_wallet_burn_daily
  milestone: B58
- id: BR-ANA-11
  rule: Every aggregate row records which run produced it and when.
  mechanism_type: FK
  mechanism: NOT NULL load_dim_etl_run_id FK to dim_etl_run (RESTRICT) and last_refreshed_at on every agg_/fact_/dim_ row.
  tables:
  - agg_funnel_daily
  - dim_etl_run
  milestone: B52
- id: BR-ANA-12
  rule: A load run is registered once per window and pipeline.
  mechanism_type: UNIQUE
  mechanism: UNIQUE (run_key) on dim_etl_run where run_key = pipeline|window_from|window_to|type; INSERT ... ON CONFLICT returns the existing run.
  tables:
  - dim_etl_run
  milestone: B58
- id: BR-ANA-13
  rule: The watermark only moves forward and only with a successful run.
  mechanism_type: TXN_LOCK
  mechanism: UPDATE dim_etl_watermark SET last_watermark_at = $to WHERE pipeline_code = $p AND (last_watermark_at IS NULL OR last_watermark_at < $to) in the same transaction as the run status update to
    succeeded.
  tables:
  - dim_etl_watermark
  - dim_etl_run
  milestone: B58
- id: BR-ANA-14
  rule: Late-arriving facts are re-read through a lookback window.
  mechanism_type: JOB
  mechanism: Incremental window = (last_watermark_at - late_arrival_window, snapshot_as_of_at]; affected grain cells recomputed from facts.
  tables:
  - dim_etl_watermark
  - agg_funnel_daily
  milestone: B58
- id: BR-ANA-15
  rule: Closed periods are only restated by an explicit restatement run.
  mechanism_type: JOB
  mechanism: Restatement run (dim_etl_run_type = restatement, restated_dim_etl_run_id set) is the only job allowed to rewrite cells older than the lookback; prior values exported first.
  tables:
  - dim_etl_run
  - agg_revenue_monthly
  milestone: B58
- id: BR-ANA-16
  rule: Aggregates are published only after blocking data-quality checks pass.
  mechanism_type: JOB
  mechanism: Publish step refreshes mv_* only when no agg_data_quality_result row with is_blocking and not is_passed exists for the run.
  tables:
  - agg_data_quality_result
  milestone: B58
- id: BR-ANA-17
  rule: Analytics reads use follower reads and do not block OLTP writes.
  mechanism_type: APP_LAYER
  mechanism: ETL and dashboard sessions run SELECT ... AS OF SYSTEM TIME follower_read_timestamp() and REFRESH MATERIALIZED VIEW ... AS OF SYSTEM TIME follower_read_timestamp() with a dedicated role, pool
    and statement_timeout.
  tables:
  - dim_etl_run
  milestone: B52
- id: BR-ANA-18
  rule: Facts and aggregates can be exported to a warehouse without schema change.
  mechanism_type: JOB
  mechanism: CREATE CHANGEFEED FOR TABLE fact_..., agg_... INTO sink WITH updated, resolved; sink de-duplicates on source_ref / grain key; enabled when OLAP load affects OLTP latency.
  tables:
  - fact_application_event
  - agg_funnel_daily
  milestone: B52
- id: BR-ANA-19
  rule: High-volume time-ordered facts use hash-sharded indexes.
  mechanism_type: APP_LAYER
  mechanism: CREATE INDEX ... USING HASH WITH (bucket_count = 8..32) on event_at / snapshot_date / valid_from of every high or very_high fact and dimension.
  tables:
  - fact_search_event
  - fact_notification_delivery
  - fact_application_event
  milestone: B58
- id: BR-ANA-20
  rule: Rates and ratios are ratios in 0..1 and NULL (not 0) when the denominator is zero.
  mechanism_type: CHECK
  mechanism: CHECK (col IS NULL OR (col >= 0 AND col <= 1)) per ratio column (NRR 0..10).
  tables:
  - agg_funnel_daily
  - agg_notification_performance_daily
  milestone: B55
- id: BR-ANA-21
  rule: No direct PII in analytics; erasure anonymises dimensions in place.
  mechanism_type: JOB
  mechanism: Erasure job replaces dim_candidate/dim_user/dim_gig_worker natural key with gen_random_uuid(), sets is_erased, nulls erased_at attributes and generalises bands on all versions; facts unchanged.
  tables:
  - dim_candidate
  - dim_user
  - dim_gig_worker
  milestone: B77
- id: BR-ANA-22
  rule: Analytics access is read-only for reporting roles.
  mechanism_type: PRIVILEGE
  mechanism: GRANT SELECT on analytics objects to analytics_reader; no access to OLTP PII tables; only analytics_etl writes.
  tables:
  - dim_candidate
  - fact_profile_view
  milestone: B77
- id: BR-ANA-23
  rule: Fact date keys equal the event date in the business time zone.
  mechanism_type: JOB
  mechanism: Loader resolves dim_date_id from (event_at AT TIME ZONE 'Asia/Kolkata')::DATE; reconciliation check compares snapshot_date to dim_date.full_date.
  tables:
  - fact_application_event
  - fact_job_posting_daily
  milestone: B58
- id: BR-ANA-24
  rule: Wallet balance mirrors are never negative and ledger moves are non-zero.
  mechanism_type: CHECK
  mechanism: CHECK (credits_delta <> 0) and CHECK (balance_after_credits >= 0) on fact_wallet_transaction.
  tables:
  - fact_wallet_transaction
  milestone: B58
- id: BR-ANA-25
  rule: Bridge weights allocate each owner across its skills.
  mechanism_type: APP_LAYER
  mechanism: weighting_factor per row 0..1 (CHECK); loader sets 1/n per owner so sums equal 1; reconciliation check asserts the sum.
  tables:
  - bridge_job_requirement_skill
  - bridge_candidate_skill
  milestone: B58
