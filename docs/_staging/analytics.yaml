- name: fact_search_event
  kind: fact
  delete_policy: append_only
  volume: very_high
  tier: '1'
  milestones:
  - B49
  - B52
  - B55
  - B58
  - B77
  retention: Append-only history. Kept 7 years in-cluster (financial facts 8 years); older months are exported through the changefeed to the warehouse and removed by the monthly archive job. No PII is held,
    so erasure requests need no fact rewrite (dimension rows are anonymised).
  description: 'Grain: one row per executed search request (candidate job search, recruiter candidate search, gig search). Query text is not stored, only a one-way hash.'
  ttl:
    expire_after: 13 months
    column: event_at
  columns:
  - name: event_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Event time (UTC).
    sens: Internal
  - name: dim_date_id
    type: UUID
    domain: identifier
    desc: Event date in the business time zone.
    sens: Internal
  - name: dim_time_of_day_id
    type: UUID
    domain: identifier
    desc: Event minute of day in the business time zone.
    sens: Internal
  - name: load_dim_etl_run_id
    type: UUID
    domain: identifier
    desc: 'Audit dimension: the ETL run that inserted (or last rewrote) this row; lineage and restatement tracking.'
    sens: Internal
  - name: dim_search_surface_id
    type: UUID
    domain: identifier
    desc: Search surface.
    sens: Internal
  - name: dim_device_platform_id
    type: UUID
    domain: identifier
    desc: Platform.
    sens: Internal
  - name: dim_candidate_id
    type: UUID
    domain: identifier
    desc: Searching candidate version.
    sens: Internal
    'null': true
    null_why: NULL = search made by an employer-side user
  - name: dim_user_id
    type: UUID
    domain: identifier
    desc: Searching employer-side user.
    sens: Internal
    'null': true
    null_why: NULL = search made by a candidate or guest
  - name: dim_location_id
    type: UUID
    domain: identifier
    desc: Location filter used.
    sens: Internal
    'null': true
    null_why: NULL = no location filter
  - name: dim_job_category_id
    type: UUID
    domain: identifier
    desc: Category filter used.
    sens: Internal
    'null': true
    null_why: NULL = no category filter
  - name: query_hash
    type: STRING(64)
    domain: token
    desc: SHA-256 of the normalised keyword string (dedupe and reformulation detection without storing text).
    sens: Personal
    'null': true
    null_why: NULL = browse/filter-only search with no keywords
    pii: One-way hash; keyword text may contain names so it is never stored in analytics
  - name: result_count
    type: INT4
    domain: quantity
    desc: Results returned.
    sens: Internal
    default: '0'
  - name: results_viewed_count
    type: INT4
    domain: quantity
    desc: Result cards that entered the viewport.
    sens: Internal
    default: '0'
  - name: click_count
    type: INT4
    domain: quantity
    desc: Result clicks.
    sens: Internal
    default: '0'
  - name: applied_count
    type: INT4
    domain: quantity
    desc: Applications started from this search (attribution window 30 minutes).
    sens: Internal
    default: '0'
  - name: first_click_position
    type: INT2
    domain: quantity
    desc: Rank of the first clicked result (1 = top).
    sens: Internal
    'null': true
    null_why: NULL = no click
  - name: latency_ms
    type: INT4
    domain: duration
    desc: Server latency of the request.
    sens: Internal
  - name: filter_count
    type: INT2
    domain: quantity
    desc: Filters applied.
    sens: Internal
    default: '0'
  - name: is_zero_result
    type: BOOL
    domain: boolean
    desc: No results returned.
    sens: Internal
    default: 'false'
  - name: is_reformulation
    type: BOOL
    domain: boolean
    desc: Same session issued a different query within 60 seconds.
    sens: Internal
    default: 'false'
  - name: source_ref
    type: STRING(100)
    domain: code
    desc: Natural identifier of the source OLTP row/event (copied, not FK-enforced); idempotency key of the load.
    sens: Internal
  constraints:
  - name: uq_fact_search_event_source_ref
    type: unique
    columns:
    - source_ref
    desc: 'Idempotent load: re-delivery of the same source event cannot create a duplicate fact row.'
  - name: ck_fact_search_event_click_position_positive
    type: check
    expr: first_click_position IS NULL OR first_click_position >= 1
    desc: Rank starts at 1
  - name: ck_fact_search_event_counts_nonneg
    type: check
    expr: result_count >= 0 AND results_viewed_count >= 0 AND click_count >= 0 AND applied_count >= 0 AND filter_count >= 0
    desc: Counters are never negative
