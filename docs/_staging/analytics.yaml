- name: dim_date
  kind: dim
  delete_policy: hard
  volume: low
  tier: '1'
  milestones:
  - B49
  - B52
  - B55
  retention: Pre-generated calendar; never deleted.
  description: 'Grain: one row per calendar date (business time zone Asia/Kolkata), 2015-01-01 to 2050-12-31. Conformed date dimension used by every fact in several roles. Key is a deterministic UUIDv5
    of the ISO date so loaders resolve it without a lookup.'
  columns:
  - name: full_date
    type: DATE
    domain: date
    desc: The calendar date.
    sens: Internal
  - name: year_number
    type: INT4
    domain: quantity
    desc: Calendar year.
    sens: Public
  - name: quarter_number
    type: INT2
    domain: quantity
    desc: Calendar quarter 1..4.
    sens: Public
  - name: month_number
    type: INT2
    domain: quantity
    desc: Calendar month 1..12.
    sens: Public
  - name: day_of_month_number
    type: INT2
    domain: quantity
    desc: Day of month 1..31.
    sens: Public
  - name: day_of_year_number
    type: INT2
    domain: quantity
    desc: Day of year 1..366.
    sens: Public
  - name: iso_year_number
    type: INT4
    domain: quantity
    desc: ISO-8601 week-numbering year.
    sens: Public
  - name: iso_week_number
    type: INT2
    domain: quantity
    desc: ISO-8601 week 1..53.
    sens: Public
  - name: iso_day_of_week_number
    type: INT2
    domain: quantity
    desc: ISO weekday 1 (Mon) .. 7 (Sun).
    sens: Public
  - name: fiscal_year_number
    type: INT4
    domain: quantity
    desc: Fiscal year (April-March, labelled by the year in which it ends).
    sens: Public
  - name: fiscal_quarter_number
    type: INT2
    domain: quantity
    desc: Fiscal quarter 1..4 (Q1 = Apr-Jun).
    sens: Public
  - name: fiscal_month_number
    type: INT2
    domain: quantity
    desc: Fiscal month 1..12 (1 = April).
    sens: Public
  - name: month_name
    type: STRING(16)
    domain: code
    desc: English month name for display.
    sens: Public
  - name: day_name
    type: STRING(16)
    domain: code
    desc: English weekday name for display.
    sens: Public
  - name: year_month_label
    type: STRING(7)
    domain: code
    desc: YYYY-MM label for charts.
    sens: Public
  - name: week_start_date
    type: DATE
    domain: date
    desc: Monday of the ISO week.
    sens: Public
  - name: month_start_date
    type: DATE
    domain: date
    desc: First day of the month.
    sens: Public
  - name: quarter_start_date
    type: DATE
    domain: date
    desc: First day of the calendar quarter.
    sens: Public
  - name: fiscal_year_start_date
    type: DATE
    domain: date
    desc: First day (1 April) of the fiscal year.
    sens: Public
  - name: is_weekend
    type: BOOL
    domain: boolean
    desc: Saturday or Sunday.
    sens: Public
    default: 'false'
  - name: is_month_end
    type: BOOL
    domain: boolean
    desc: Last day of the month.
    sens: Public
    default: 'false'
  - name: is_business_day
    type: BOOL
    domain: boolean
    desc: Not a weekend and not a national holiday of the home market (India); per-country holidays are in bridge_date_country_holiday.
    sens: Public
    default: 'true'
  constraints:
  - name: ck_dim_date_quarter_number_range
    type: check
    expr: quarter_number >= 1 AND quarter_number <= 4
    desc: Calendar value in range
  - name: ck_dim_date_month_number_range
    type: check
    expr: month_number >= 1 AND month_number <= 12
    desc: Calendar value in range
  - name: ck_dim_date_day_of_month_number_range
    type: check
    expr: day_of_month_number >= 1 AND day_of_month_number <= 31
    desc: Calendar value in range
  - name: ck_dim_date_day_of_year_number_range
    type: check
    expr: day_of_year_number >= 1 AND day_of_year_number <= 366
    desc: Calendar value in range
  - name: ck_dim_date_iso_week_number_range
    type: check
    expr: iso_week_number >= 1 AND iso_week_number <= 53
    desc: Calendar value in range
  - name: ck_dim_date_iso_day_of_week_number_range
    type: check
    expr: iso_day_of_week_number >= 1 AND iso_day_of_week_number <= 7
    desc: Calendar value in range
  - name: ck_dim_date_fiscal_quarter_number_range
    type: check
    expr: fiscal_quarter_number >= 1 AND fiscal_quarter_number <= 4
    desc: Calendar value in range
  - name: ck_dim_date_fiscal_month_number_range
    type: check
    expr: fiscal_month_number >= 1 AND fiscal_month_number <= 12
    desc: Calendar value in range
  - name: uq_dim_date_full_date
    type: unique
    columns:
    - full_date
    desc: 'Natural key: one row per calendar date.'
  - name: ck_dim_date_week_start_monday
    type: check
    expr: week_start_date <= full_date
    desc: Week start cannot follow the date
  indexes:
  - name: idx_dim_date_month_start_date
    columns:
    - month_start_date
    desc: Roll-up of a month's days.
  - name: idx_dim_date_week_start_date
    columns:
    - week_start_date
    desc: Roll-up of a week's days.
