- name: dim_candidate
  kind: dim
  delete_policy: hard
  volume: very_high
  tier: '1'
  milestones:
  - B49
  - B52
  - B55
  - B58
  - B77
  retention: 'SCD2 history kept 10 years. On an erasure request the current and all prior versions are anonymised in place by the erasure job: natural key replaced with a random UUID, is_erased = true,
    attributes generalised; facts keep their surrogate keys.'
  description: 'Grain: one row per candidate profile VERSION (SCD Type 2). A new row is written when a tracked attribute changes (see notes for the maintenance algorithm). PII-minimised: no name, email,
    phone, address, date of birth or free text; only banded and coded attributes. The natural key candidate_profile_id is a copy (not FK-enforced) so analytics survives OLTP hard deletes and erasure.'
  columns:
  - name: candidate_profile_id
    type: UUID
    domain: identifier
    desc: 'Natural key: candidate_profile.id (copy, not FK-enforced by design: analytic keys must outlive OLTP deletes and be loadable without cross-table locks).'
    sens: Personal
    pii: Pseudonymous UUID only; no contact data in analytics; replaced by a random UUID on erasure; access limited to the analytics role.
    external_ref: true
  - name: version_no
    type: INT4
    domain: quantity
    desc: SCD2 version counter for this natural key, starting at 1.
    sens: Internal
    default: '1'
  - name: valid_from
    type: TIMESTAMPTZ
    domain: timestamp
    desc: 'SCD2: instant this version became effective (UTC), taken from the source change time.'
    sens: Internal
    default: now()
  - name: valid_to
    type: TIMESTAMPTZ
    domain: timestamp
    desc: 'SCD2: instant this version was superseded (exclusive).'
    sens: Internal
    'null': true
    null_why: NULL = this is the current (open-ended) version
  - name: is_current
    type: BOOL
    domain: boolean
    desc: 'SCD2: true for exactly one version per natural key.'
    sens: Internal
    default: 'true'
  - name: hash_diff
    type: STRING(64)
    domain: code
    desc: SHA-256 hex of the normalised Type-2 attribute set; the ETL compares it to the incoming row to detect change.
    sens: Internal
  - name: gender_code
    type: STRING(32)
    domain: code
    desc: Self-declared gender code, coarse; used only for aggregated diversity reporting with minimum cell size 10.
    sens: Personal
    'null': true
    null_why: NULL = not declared (unknown); not_applicable members are not used for candidates
    pii: Optional, self-declared; only exposed in aggregates with k>=10 suppression
  - name: age_band_code
    type: STRING(16)
    domain: code
    desc: Age band (for example 18_24, 25_34) computed in ETL from date of birth; date of birth itself is never copied.
    sens: Personal
    'null': true
    null_why: NULL = date of birth not provided
    pii: Banded (not exact); aggregate-only exposure
  - name: experience_band_code
    type: STRING(16)
    domain: code
    desc: Total experience band (fresher, 1_3, 3_5, 5_10, 10_plus).
    sens: Internal
    'null': true
    null_why: NULL = experience not provided
  - name: highest_qualification_code
    type: STRING(40)
    domain: code
    desc: Highest qualification code.
    sens: Internal
    'null': true
    null_why: NULL = no qualification entered
  - name: current_job_role_code
    type: STRING(64)
    domain: code
    desc: Current or most recent job role code.
    sens: Internal
    'null': true
    null_why: NULL = no work history (fresher)
  - name: current_dim_industry_id
    type: UUID
    domain: identifier
    desc: Industry of current or most recent employment.
    sens: Internal
    'null': true
    null_why: NULL = no work history
  - name: home_dim_location_id
    type: UUID
    domain: identifier
    desc: Home city member of dim_location.
    sens: Internal
    'null': true
    null_why: NULL = location not provided
  - name: acquisition_dim_source_id
    type: UUID
    domain: identifier
    desc: Acquisition source of the account.
    sens: Internal
  - name: signup_dim_date_id
    type: UUID
    domain: identifier
    desc: Date the candidate registered.
    sens: Internal
  - name: preferred_language_code
    type: STRING(16)
    domain: code
    desc: UI language preference (language tag).
    sens: Internal
    'null': true
    null_why: NULL = no preference stated
  - name: profile_completion_band_code
    type: STRING(16)
    domain: code
    desc: Profile completion band (0_25, 25_50, 50_80, 80_100).
    sens: Internal
  - name: expected_salary_band_code
    type: STRING(24)
    domain: code
    desc: Expected annual salary band in INR-equivalent terms.
    sens: Internal
    'null': true
    null_why: NULL = salary expectation undisclosed
  - name: is_open_to_work
    type: BOOL
    domain: boolean
    desc: Candidate has switched on 'open to work'.
    sens: Internal
    default: 'false'
  - name: is_active_candidate
    type: BOOL
    domain: boolean
    desc: Activity within the last 90 days at version time.
    sens: Internal
    default: 'false'
  - name: is_erased
    type: BOOL
    domain: boolean
    desc: True after the erasure job anonymised this row.
    sens: Internal
    default: 'false'
  - name: erased_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: When the row was anonymised.
    sens: Internal
    'null': true
    null_why: NULL = not erased
  - name: dim_placeholder_kind_id
    type: UUID
    domain: enum_ref
    desc: Non-NULL only for the reserved placeholder members (unknown / not_applicable) that facts point to instead of NULL keys.
    sens: Internal
    'null': true
    null_why: NULL = a real dimension member; set only on the two reserved placeholder members
  - name: load_dim_etl_run_id
    type: UUID
    domain: identifier
    desc: 'Audit dimension: the ETL run that inserted (or last rewrote) this row; lineage and restatement tracking.'
    sens: Internal
  constraints:
  - name: ck_dim_candidate_valid_range
    type: check
    expr: valid_to IS NULL OR valid_to >= valid_from
    desc: SCD2 interval must not be inverted
  - name: ck_dim_candidate_current_flag
    type: check
    expr: (is_current AND valid_to IS NULL) OR (NOT is_current AND valid_to IS NOT NULL)
    desc: is_current and open-ended valid_to must agree
  - name: ck_dim_candidate_version_positive
    type: check
    expr: version_no >= 1
    desc: versions start at 1
  - name: uq_dim_candidate_version
    type: unique
    columns:
    - candidate_profile_id
    - version_no
    desc: One row per natural key and version number.
  indexes:
  - name: uq_dim_candidate_candidate_profile_id
    columns:
    - candidate_profile_id
    desc: At most one current version per natural key (SCD2 invariant, partial unique).
    unique: true
    where: is_current
  - name: idx_dim_candidate_candidate_profile_id_valid_from
    columns:
    - candidate_profile_id
    - valid_from DESC
    desc: 'As-of lookup: find the version effective at a past instant for late-arriving facts.'
    storing:
    - is_current
  - name: idx_dim_candidate_valid_from
    columns:
    - valid_from
    desc: 'Change-capture scan: versions created since the last ETL watermark, hash-sharded to avoid a hot tail.'
    hash: true
    bucket_count: 16
  - name: idx_dim_candidate_current_dim_industry_id
    columns:
    - current_dim_industry_id
    desc: 'Foreign-key leading index: parent-to-children lookups for this star key.'
  - name: idx_dim_candidate_home_dim_location_id
    columns:
    - home_dim_location_id
    desc: 'Foreign-key leading index: parent-to-children lookups for this star key.'
  - name: idx_dim_candidate_acquisition_dim_source_id
    columns:
    - acquisition_dim_source_id
    desc: 'Foreign-key leading index: parent-to-children lookups for this star key.'
  - name: idx_dim_candidate_signup_dim_date_id
    columns:
    - signup_dim_date_id
    desc: 'Foreign-key leading index: parent-to-children lookups for this star key.'
  fks:
  - name: fk_dim_candidate_current_dim_industry_id
    columns:
    - current_dim_industry_id
    ref: dim_industry
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: dimension members are retained for the life of the facts that reference them'
  - name: fk_dim_candidate_home_dim_location_id
    columns:
    - home_dim_location_id
    ref: dim_location
    ref_columns:
    - id
