    domain: enum_ref
    desc: Non-NULL only for the reserved placeholder members (unknown / not_applicable) that facts point to instead of NULL keys.
    sens: Internal
    'null': true
    null_why: NULL = a real dimension member; set only on the two reserved placeholder members
  - name: load_dim_etl_run_id
    type: UUID
    domain: identifier
    desc: 'Audit dimension: the ETL run that inserted (or last rewrote) this row; lineage and restatement tracking.'
    sens: Internal
  - name: currency_id
    type: UUID
    domain: identifier
    desc: Currency of every money column in this row (FK currency).
    sens: Internal
  constraints:
  - name: ck_dim_plan_valid_range
    type: check
    expr: valid_to IS NULL OR valid_to >= valid_from
    desc: SCD2 interval must not be inverted
  - name: ck_dim_plan_current_flag
    type: check
    expr: (is_current AND valid_to IS NULL) OR (NOT is_current AND valid_to IS NOT NULL)
    desc: is_current and open-ended valid_to must agree
  - name: ck_dim_plan_version_positive
    type: check
    expr: version_no >= 1
    desc: versions start at 1
  - name: uq_dim_plan_version
    type: unique
    columns:
    - subscription_plan_id
    - version_no
    desc: One row per natural key and version number.
  - name: ck_dim_plan_counts_nonneg
    type: check
    expr: included_credits >= 0
    desc: Counters are never negative
  indexes:
  - name: uq_dim_plan_subscription_plan_id
    columns:
    - subscription_plan_id
    desc: At most one current version per natural key (SCD2 invariant, partial unique).
    unique: true
    where: is_current
  - name: idx_dim_plan_subscription_plan_id_valid_from
    columns:
    - subscription_plan_id
    - valid_from DESC
    desc: 'As-of lookup: find the version effective at a past instant for late-arriving facts.'
    storing:
    - is_current
  - name: idx_dim_plan_valid_from
    columns:
    - valid_from
    desc: 'Change-capture scan: versions created since the last ETL watermark, hash-sharded to avoid a hot tail.'
    hash: true
    bucket_count: 16
  fks:
  - name: fk_dim_plan_dim_placeholder_kind_id
    columns:
    - dim_placeholder_kind_id
    ref: dim_placeholder_kind
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: lookup values are retired, never deleted'
    index_exempt: lookup with a handful of values; no reverse lookup needed
  - name: fk_dim_plan_load_dim_etl_run_id
    columns:
    - load_dim_etl_run_id
    ref: dim_etl_run
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: dimension members are retained for the life of the facts that reference them'
    index_exempt: 'dimension surrogate FK on an analytic table: dimension rows are never deleted (RESTRICT) and star joins drive from the fact side, so a reverse-lookup index would only add write amplification'
  - name: fk_dim_plan_currency_id
    columns:
    - currency_id
    ref: currency
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: currencies are never deleted'
    index_exempt: currency has ~20 rows; no reverse lookup needed
