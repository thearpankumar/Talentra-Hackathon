- name: agg_funnel_daily
  kind: agg
  delete_policy: hard
  volume: high
  tier: '1'
  milestones:
  - B49
  - B52
  - B55
  - B58
  retention: Derived and rebuildable from facts; 25 months of grain retained in-cluster, older cells dropped after warehouse export. Truncate-and-rebuild is always safe.
  description: 'Grain: application date x job category x location x source x job type: funnel counts by application cohort (K03, K04). Counts are restated as applications progress (see refresh rules).'
  audit: created_only
  columns:
  - name: applied_dim_date_id
    type: UUID
    domain: identifier
    desc: 'Grain dimension: dim_date (applied).'
    sens: Internal
  - name: dim_job_category_id
    type: UUID
    domain: identifier
    desc: 'Grain dimension: dim_job_category.'
    sens: Internal
  - name: dim_location_id
    type: UUID
    domain: identifier
    desc: 'Grain dimension: dim_location.'
    sens: Internal
  - name: dim_source_id
    type: UUID
    domain: identifier
    desc: 'Grain dimension: dim_source.'
    sens: Internal
  - name: dim_job_type_id
    type: UUID
    domain: identifier
    desc: 'Grain dimension: dim_job_type.'
    sens: Internal
  - name: applications
    type: INT8
    domain: quantity
    desc: Applications in the cohort.
    sens: Internal
    default: '0'
  - name: viewed
    type: INT8
    domain: quantity
    desc: Reached viewed.
    sens: Internal
    default: '0'
  - name: shortlisted
    type: INT8
    domain: quantity
    desc: Reached shortlisted.
    sens: Internal
    default: '0'
  - name: interviewed
    type: INT8
    domain: quantity
    desc: Reached interviewed.
    sens: Internal
    default: '0'
  - name: offered
    type: INT8
    domain: quantity
    desc: Reached offered.
    sens: Internal
    default: '0'
  - name: offer_accepted
    type: INT8
    domain: quantity
    desc: Offer accepted.
    sens: Internal
    default: '0'
  - name: joined
    type: INT8
    domain: quantity
    desc: Joined.
    sens: Internal
    default: '0'
  - name: rejected
    type: INT8
    domain: quantity
    desc: Rejected.
    sens: Internal
    default: '0'
  - name: withdrawn
    type: INT8
    domain: quantity
    desc: Withdrawn.
    sens: Internal
    default: '0'
  - name: view_rate
    type: DECIMAL(9,6)
    domain: ratio
    desc: viewed / applications.
    sens: Internal
    'null': true
    null_why: NULL = undefined because the denominator is zero in this grain cell; this is not the same as 0%
  - name: shortlist_rate
    type: DECIMAL(9,6)
    domain: ratio
    desc: shortlisted / applications.
    sens: Internal
    'null': true
    null_why: NULL = undefined because the denominator is zero in this grain cell; this is not the same as 0%
  - name: interview_rate
    type: DECIMAL(9,6)
    domain: ratio
    desc: interviewed / shortlisted.
    sens: Internal
    'null': true
    null_why: NULL = undefined because the denominator is zero in this grain cell; this is not the same as 0%
  - name: offer_rate
    type: DECIMAL(9,6)
    domain: ratio
    desc: offered / interviewed.
    sens: Internal
    'null': true
    null_why: NULL = undefined because the denominator is zero in this grain cell; this is not the same as 0%
  - name: offer_acceptance_rate
