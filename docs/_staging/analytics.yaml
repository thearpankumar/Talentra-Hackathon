- name: fact_job_posting_daily
  kind: fact
  delete_policy: append_only
  volume: very_high
  tier: '1'
  milestones:
  - B49
  - B52
  - B55
  - B58
  retention: Append-only history. Kept 7 years in-cluster (financial facts 8 years); older months are exported through the changefeed to the warehouse and removed by the monthly archive job. No PII is held,
    so erasure requests need no fact rewrite (dimension rows are anonymised).
  description: 'Grain: one row per job requirement x day while the requirement is published (periodic snapshot). Positions and counters are cumulative-to-date or in-day as named.'
  columns:
  - name: dim_date_id
    type: UUID
    domain: identifier
    desc: Snapshot date.
    sens: Internal
  - name: dim_job_requirement_id
    type: UUID
    domain: identifier
    desc: Requirement version in force that day.
    sens: Internal
  - name: dim_organisation_id
    type: UUID
    domain: identifier
    desc: Poster organisation version.
    sens: Internal
  - name: dim_job_category_id
    type: UUID
    domain: identifier
    desc: Job category.
    sens: Internal
  - name: dim_location_id
    type: UUID
    domain: identifier
    desc: Work location.
    sens: Internal
  - name: load_dim_etl_run_id
    type: UUID
    domain: identifier
    desc: 'Audit dimension: the ETL run that inserted (or last rewrote) this row; lineage and restatement tracking.'
    sens: Internal
  - name: days_open
    type: INT4
    domain: duration
    desc: Days since publication at snapshot time.
    sens: Internal
  - name: positions_open
    type: INT4
    domain: quantity
    desc: Positions still unfilled.
    sens: Internal
    default: '0'
  - name: positions_filled_cumulative
    type: INT4
    domain: quantity
    desc: Positions filled to date.
    sens: Internal
    default: '0'
  - name: views_in_day
    type: INT8
    domain: quantity
    desc: Listing views that day.
    sens: Internal
    default: '0'
  - name: applications_in_day
    type: INT8
    domain: quantity
    desc: New applications that day.
    sens: Internal
    default: '0'
  - name: applications_cumulative
    type: INT8
    domain: quantity
    desc: Applications to date.
    sens: Internal
    default: '0'
  - name: shortlisted_cumulative
    type: INT8
    domain: quantity
    desc: Shortlisted to date.
    sens: Internal
    default: '0'
  - name: offers_cumulative
    type: INT8
    domain: quantity
    desc: Offers extended to date.
    sens: Internal
    default: '0'
  - name: credits_consumed_in_day
    type: INT8
    domain: quantity
    desc: Credits burned on this posting that day.
    sens: Internal
    default: '0'
  - name: is_visible_to_consultants
    type: BOOL
    domain: boolean
    desc: Open to consultants that day.
    sens: Internal
    default: 'false'
  - name: snapshot_date
    type: DATE
    domain: date
    desc: Calendar date copy of the dim_date key. UUID keys are not time-ordered, so range scans and hash-sharded time indexes use this column; the loader guarantees it equals dim_date.full_date.
    sens: Internal
  constraints:
  - name: uq_fact_job_posting_daily_grain
    type: unique
    columns:
    - dim_job_requirement_id
    - dim_date_id
    desc: 'One snapshot per requirement and day: idempotent daily load.'
  - name: ck_fact_job_posting_daily_counts_nonneg
    type: check
    expr: positions_open >= 0 AND positions_filled_cumulative >= 0 AND views_in_day >= 0 AND applications_in_day >= 0 AND applications_cumulative >= 0 AND shortlisted_cumulative >= 0 AND offers_cumulative
      >= 0 AND credits_consumed_in_day >= 0
    desc: Counters are never negative
  indexes:
  - name: idx_fact_job_posting_daily_snapshot_date
    columns:
    - snapshot_date
    desc: Date-range scans for KPI roll-ups without a hot tail.
    hash: true
    bucket_count: 16
  - name: idx_fact_job_posting_daily_dim_organisation_id_dim_date_id
    columns:
    - dim_organisation_id
    - dim_date_id
    desc: Per-employer posting trend.
  fks:
  - name: fk_fact_job_posting_daily_dim_date_id
    columns:
    - dim_date_id
    ref: dim_date
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: dimension members are retained for the life of the facts that reference them'
    index_exempt: 'dimension surrogate FK on an analytic table: dimension rows are never deleted (RESTRICT) and star joins drive from the fact side, so a reverse-lookup index would only add write amplification'
  - name: fk_fact_job_posting_daily_dim_job_requirement_id
    columns:
    - dim_job_requirement_id
    ref: dim_job_requirement
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: dimension members are retained for the life of the facts that reference them'
  - name: fk_fact_job_posting_daily_dim_organisation_id
    columns:
    - dim_organisation_id
    ref: dim_organisation
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: dimension members are retained for the life of the facts that reference them'
    index_exempt: 'dimension surrogate FK on an analytic table: dimension rows are never deleted (RESTRICT) and star joins drive from the fact side, so a reverse-lookup index would only add write amplification'
  - name: fk_fact_job_posting_daily_dim_job_category_id
    columns:
    - dim_job_category_id
    ref: dim_job_category
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: dimension members are retained for the life of the facts that reference them'
    index_exempt: 'dimension surrogate FK on an analytic table: dimension rows are never deleted (RESTRICT) and star joins drive from the fact side, so a reverse-lookup index would only add write amplification'
  - name: fk_fact_job_posting_daily_dim_location_id
    columns:
    - dim_location_id
    ref: dim_location
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: dimension members are retained for the life of the facts that reference them'
    index_exempt: 'dimension surrogate FK on an analytic table: dimension rows are never deleted (RESTRICT) and star joins drive from the fact side, so a reverse-lookup index would only add write amplification'
  - name: fk_fact_job_posting_daily_load_dim_etl_run_id
    columns:
