    desc: One snapshot per subscription and day.
  - name: ck_fact_subscription_daily_snapshot_counts_nonneg
    type: check
    expr: seats_licensed >= 0 AND seats_assigned >= 0
    desc: Counters are never negative
  indexes:
  - name: idx_fact_subscription_daily_snapshot_snapshot_date
    columns:
    - snapshot_date
    desc: 'Hash-sharded time index (16 buckets): incremental ETL watermark scans and recent-window reads without a hot range on append-heavy time order.'
    hash: true
    bucket_count: 16
  - name: idx_fact_subscription_daily_snapshot_dim_organisation_id
    columns:
    - dim_organisation_id
    desc: 'Foreign-key leading index: parent-to-children lookups for this star key.'
  fks:
  - name: fk_fact_subscription_daily_snapshot_dim_date_id
    columns:
    - dim_date_id
    ref: dim_date
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: dimension members are retained for the life of the facts that reference them'
    index_exempt: 'dimension surrogate FK on an analytic table: dimension rows are never deleted (RESTRICT) and star joins drive from the fact side, so a reverse-lookup index would only add write amplification'
  - name: fk_fact_subscription_daily_snapshot_load_dim_etl_run_id
    columns:
    - load_dim_etl_run_id
    ref: dim_etl_run
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: dimension members are retained for the life of the facts that reference them'
    index_exempt: 'dimension surrogate FK on an analytic table: dimension rows are never deleted (RESTRICT) and star joins drive from the fact side, so a reverse-lookup index would only add write amplification'
  - name: fk_fact_subscription_daily_snapshot_dim_organisation_id
    columns:
    - dim_organisation_id
    ref: dim_organisation
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'RESTRICT: dimension members are retained for the life of the facts that reference them'
  - name: fk_fact_subscription_daily_snapshot_dim_plan_id
    columns:
