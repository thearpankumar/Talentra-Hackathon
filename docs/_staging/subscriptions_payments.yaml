- name: spend_limit
  kind: config
  delete_policy: soft
  volume: low
  tier: X
  milestones:
  - B38
  - B44
  retention: While in force + 2 years.
  description: 'Spend control: max credits/amount per window for an organisation, user or licence; checked in the debit txn.'
  columns:
  - name: organisation_id
    type: UUID
    domain: identifier
    desc: Organisation the limit belongs to.
    sens: Internal
  - name: spend_limit_scope_id
    type: UUID
    domain: enum_ref
    desc: organisation / user / licence.
    sens: Internal
  - name: target_app_user_id
    type: UUID
    domain: identifier
    desc: User limited.
    sens: Internal
    'null': true
    null_why: NULL unless scope is user.
  - name: licence_id
    type: UUID
    domain: identifier
    desc: Licence limited.
    sens: Internal
    'null': true
    null_why: NULL unless scope is licence.
  - name: spend_limit_period_id
    type: UUID
    domain: enum_ref
    desc: Window length.
    sens: Internal
  - name: max_credits
    type: INT8
    domain: quantity
    desc: Credit cap per window.
    sens: Internal
    'null': true
    null_why: NULL = no credit cap (money cap only).
  - name: max_amount
    type: DECIMAL(18,4)
    domain: money
    desc: Money cap per window.
    sens: Internal
    'null': true
    null_why: NULL = no money cap.
  - name: currency_id
    type: UUID
    domain: identifier
    desc: Currency of max_amount.
    sens: Internal
  - name: is_hard_block
    type: BOOL
    domain: boolean
    desc: True = refuse; false = warn and notify admins.
    sens: Internal
    default: 'true'
  - name: effective_from_date
    type: DATE
    domain: date
    desc: Limit start.
    sens: Internal
  - name: effective_to_date
    type: DATE
    domain: date
    desc: Limit end.
    sens: Internal
    'null': true
    null_why: NULL = open-ended.
  constraints:
  - name: ck_spend_limit_dates
    type: check
    expr: effective_to_date IS NULL OR effective_to_date >= effective_from_date
    desc: End not before start.
  - name: ck_spend_limit_some_cap
    type: check
    expr: max_credits IS NOT NULL OR max_amount IS NOT NULL
    desc: At least one cap.
  - name: ck_spend_limit_caps_pos
    type: check
    expr: (max_credits IS NULL OR max_credits > 0) AND (max_amount IS NULL OR max_amount > 0)
    desc: Positive caps.
  indexes:
  - name: idx_spend_limit_organisation_id_effective_from_date
    columns:
