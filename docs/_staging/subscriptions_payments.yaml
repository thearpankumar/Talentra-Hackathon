- name: payment_method_token
  kind: entity
  delete_policy: soft
  volume: medium
  tier: '1'
  milestones:
  - B38
  - B44
  - B76
  retention: Removed on customer request/expiry; token revoked at gateway; purged 90 days after soft delete.
  description: 'Gateway-issued reusable instrument token (no PAN, no bank account): last4 and expiry for display only.'
  columns:
  - name: organisation_id
    type: UUID
    domain: identifier
    desc: Owner of the instrument.
    sens: Internal
  - name: payment_gateway_id
    type: UUID
    domain: enum_ref
    desc: Gateway that issued the token.
    sens: Internal
  - name: payment_method_kind_id
    type: UUID
    domain: enum_ref
    desc: Instrument family.
    sens: Internal
  - name: token_ref
    type: STRING(200)
    domain: token
    desc: Opaque gateway token / customer-source id.
    sens: Sensitive
    pii: vendor token only; AES-GCM app-layer encrypted at rest; never logged; useless outside our gateway account
  - name: last4
    type: STRING(4)
    domain: code
    desc: Last 4 digits for display.
    sens: Personal
    'null': true
    null_why: NULL for UPI/netbanking (no digits).
    pii: display-only masked data; access-controlled; shown to org billing admins only
  - name: expiry_month
    type: INT2
    domain: quantity
    desc: Card expiry month 1..12.
    sens: Internal
    'null': true
    null_why: NULL for non-card instruments.
  - name: expiry_year
    type: INT2
    domain: quantity
    desc: Card expiry year.
    sens: Internal
    'null': true
    null_why: NULL for non-card instruments.
  - name: is_default
    type: BOOL
    domain: boolean
    desc: Default instrument for auto-renewal.
    sens: Internal
    default: 'false'
  - name: revoked_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Token revoked at gateway.
    sens: Internal
    'null': true
    null_why: NULL = still valid.
  constraints:
  - name: uq_payment_method_token_gateway_token
    type: unique
    columns:
    - payment_gateway_id
    - token_ref
    desc: A gateway token is stored once.
  - name: ck_payment_method_token_expiry_range
    type: check
    expr: (expiry_month IS NULL OR (expiry_month BETWEEN 1 AND 12)) AND (expiry_month IS NULL) = (expiry_year IS NULL)
    desc: Valid month; month/year together.
  indexes:
  - name: uq_payment_method_token_organisation_id_default
    columns:
    - organisation_id
    desc: One default instrument per org.
    unique: true
    where: is_default AND deleted_at IS NULL
  fks:
  - name: fk_payment_method_token_organisation_id
    columns:
    - organisation_id
    ref: organisation
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: financial/history row must block deletion of its parent
  - name: fk_payment_method_token_payment_gateway_id
    columns:
    - payment_gateway_id
    ref: payment_gateway
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: lookup values are retired via is_active, never deleted
    index_exempt: low-cardinality lookup; never filtered alone; lookup rows are never deleted
  - name: fk_payment_method_token_payment_method_kind_id
    columns:
    - payment_method_kind_id
    ref: payment_method_kind
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
