- name: coupon
  kind: entity
  delete_policy: soft
  volume: low
  tier: X
  milestones:
  - B38
  - B44
  retention: Kept 8 years after expiry (redemptions reference it).
  description: 'Promotion code: percent/amount discount or bonus credits, validity, redemption caps.'
  columns:
  - name: coupon_code
    type: STRING(40)
    domain: code
    desc: Redeemable code, stored uppercase.
    sens: Internal
  - name: discount_type_id
    type: UUID
    domain: enum_ref
    desc: Discount mechanic.
    sens: Internal
  - name: percent_off
    type: DECIMAL(5,2)
    domain: percentage
    desc: Percent discount.
    sens: Internal
    'null': true
    null_why: NULL unless discount type is percent_off.
  - name: amount_off
    type: DECIMAL(18,4)
    domain: money
    desc: Fixed discount (needs currency_id).
    sens: Internal
    'null': true
    null_why: NULL unless discount type is amount_off.
  - name: currency_id
    type: UUID
    domain: identifier
    desc: Currency of amount_off.
    sens: Internal
    'null': true
    null_why: NULL unless amount_off is set.
  - name: bonus_credits
    type: INT8
    domain: quantity
    desc: Credits granted.
    sens: Internal
    'null': true
    null_why: NULL unless discount type is bonus_credits.
  - name: valid_from
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Validity start.
    sens: Internal
  - name: valid_to
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Validity end.
    sens: Internal
    'null': true
    null_why: NULL = no expiry.
  - name: max_redemptions
    type: INT4
    domain: quantity
    desc: Global redemption cap.
    sens: Internal
    'null': true
    null_why: NULL = unlimited.
  - name: redemption_count
    type: INT4
    domain: quantity
    desc: Redemptions so far; incremented under row lock.
    sens: Internal
    default: '0'
  - name: per_organisation_limit
    type: INT4
    domain: quantity
    desc: Max redemptions per organisation.
    sens: Internal
    default: '1'
  constraints:
  - name: uq_coupon_coupon_code
    type: unique
    columns:
    - coupon_code
    desc: Natural key.
  - name: ck_coupon_valid_range
    type: check
    expr: valid_to IS NULL OR valid_to >= valid_from
    desc: End not before start.
  - name: ck_coupon_percent_range
    type: check
    expr: percent_off IS NULL OR (percent_off >= 0 AND percent_off <= 100)
    desc: 0..100.
  - name: ck_coupon_cap
    type: check
    expr: max_redemptions IS NULL OR redemption_count <= max_redemptions
    desc: Cap enforced.
  - name: ck_coupon_amount_has_currency
    type: check
    expr: (amount_off IS NULL) = (currency_id IS NULL)
    desc: Amount and currency together.
  - name: ck_coupon_code_upper
    type: check
    expr: coupon_code = upper(coupon_code)
    desc: Uppercase codes.
  indexes:
  - name: idx_coupon_currency_id
    columns:
    - currency_id
    desc: FK leading index (parent lookups / delete checks)
    where: currency_id IS NOT NULL
  fks:
  - name: fk_coupon_discount_type_id
    columns:
    - discount_type_id
    ref: discount_type
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: lookup values are retired via is_active, never deleted
    index_exempt: low-cardinality lookup; never filtered alone; lookup rows are never deleted
  - name: fk_coupon_currency_id
    columns:
    - currency_id
    ref: currency
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: financial/history row must block deletion of its parent
