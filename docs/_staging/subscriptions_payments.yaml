- name: wallet
  kind: entity
  delete_policy: soft
  volume: medium
  tier: '1'
  milestones:
  - B38
  - B41
  - B44
  - B47
  retention: Never deleted while a ledger exists; closed wallets kept 8 years; balance reconciles to ledger.
  description: Prepaid credit wallet per owner and currency; holds current balance and ledger_sequence (hot row, locked FOR UPDATE for every movement). Unit = CREDITS (see notes).
  columns:
  - name: owner_organisation_id
    type: UUID
    domain: identifier
    desc: Owning organisation (employer wallets).
    sens: Internal
    'null': true
    null_why: NULL when the wallet belongs to a user (exactly one owner).
  - name: owner_app_user_id
    type: UUID
    domain: identifier
    desc: Owning user (individual consultant/gig requester wallets).
    sens: Internal
    'null': true
    null_why: NULL when the wallet belongs to an organisation.
  - name: currency_id
    type: UUID
    domain: identifier
    desc: Currency in which credits are purchased/refunded (credits are not fungible across currencies).
    sens: Internal
  - name: wallet_status_id
    type: UUID
    domain: enum_ref
    desc: active/frozen/closed.
    sens: Internal
  - name: credit_balance
    type: INT8
    domain: quantity
    desc: Current spendable credits (= sum of ledger deltas).
    sens: Internal
    default: '0'
  - name: ledger_sequence
    type: INT8
    domain: quantity
    desc: Sequence number of the last ledger entry (0 = none); incremented in the same txn.
    sens: Internal
    default: '0'
  - name: low_balance_threshold
    type: INT8
    domain: quantity
    desc: Credits below which a low-balance notification fires.
    sens: Internal
    'null': true
    null_why: NULL = no alert configured.
  - name: last_entry_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Time of the last ledger entry.
    sens: Internal
    'null': true
    null_why: NULL = no entries yet.
  constraints:
  - name: ck_wallet_balance_nonneg
    type: check
    expr: credit_balance >= 0
    desc: 'D-14: balance never negative.'
  - name: ck_wallet_sequence_nonneg
    type: check
    expr: ledger_sequence >= 0
    desc: Sequence non-negative.
  - name: ck_wallet_one_owner
    type: check
    expr: num_nonnulls(owner_organisation_id, owner_app_user_id) = 1
    desc: Exactly one owner.
  indexes:
  - name: uq_wallet_owner_organisation_id_currency
    columns:
    - owner_organisation_id
    - currency_id
    desc: One live wallet per organisation+currency.
    unique: true
    where: owner_organisation_id IS NOT NULL AND deleted_at IS NULL
  - name: uq_wallet_owner_app_user_id_currency
    columns:
    - owner_app_user_id
    - currency_id
    desc: One live wallet per user+currency.
    unique: true
    where: owner_app_user_id IS NOT NULL AND deleted_at IS NULL
  - name: idx_wallet_currency_id
    columns:
    - currency_id
    desc: FK leading index (parent lookups / delete checks)
  fks:
  - name: fk_wallet_owner_organisation_id
    columns:
    - owner_organisation_id
    ref: organisation
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: financial/history row must block deletion of its parent
  - name: fk_wallet_owner_app_user_id
    columns:
    - owner_app_user_id
    ref: app_user
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: financial/history row must block deletion of its parent
  - name: fk_wallet_currency_id
    columns:
    - currency_id
    ref: currency
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: financial/history row must block deletion of its parent
  - name: fk_wallet_wallet_status_id
    columns:
    - wallet_status_id
    ref: wallet_status
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: lookup values are retired via is_active, never deleted
    index_exempt: low-cardinality lookup; never filtered alone; lookup rows are never deleted
- name: wallet_ledger_entry
  kind: ledger
  delete_policy: append_only
  volume: very_high
  tier: '1'
  milestones:
  - B38
  - B41
  - B44
  - B47
  - B76
  retention: Append-only forever (8 years minimum, legal hold); never TTL'd; cold-archived after 2 years via changefeed, rows retained.
  description: Single-entry signed credit movement of a wallet; hash-chained; gapless sequence per wallet; corrections via reversal entries only.
  columns:
  - name: wallet_id
    type: UUID
    domain: identifier
    desc: Wallet moved.
    sens: Internal
  - name: sequence_no
    type: INT8
    domain: quantity
    desc: Per-wallet gapless sequence (= wallet.ledger_sequence after the txn).
    sens: Internal
  - name: prev_sequence_no
    type: INT8
    domain: quantity
    desc: Previous sequence_no (composite self-FK proves it exists, so no gaps).
    sens: Internal
    'null': true
    null_why: NULL only for sequence_no = 1.
  - name: ledger_entry_type_id
    type: UUID
    domain: enum_ref
    desc: recharge/consumption_*/refund/adjustment/expiry/reversal/promo_grant.
    sens: Internal
  - name: credits_delta
    type: INT8
    domain: quantity
    desc: 'Signed credits: positive credits the wallet, negative debits it.'
    sens: Internal
  - name: is_debit
    type: BOOL
    domain: boolean
    desc: True when credits_delta < 0 (explicit so the sign is checkable against type rules).
    sens: Internal
    default: 'false'
  - name: balance_after
    type: INT8
    domain: quantity
    desc: Wallet balance after this entry (running balance).
    sens: Internal
  - name: idempotency_key
    type: STRING(120)
    domain: token
    desc: Caller-supplied key (e.g. 'dl:{org}:{candidate}:{request}'); replays return the original row.
    sens: Internal
  - name: actor_app_user_id
    type: UUID
    domain: identifier
    desc: User who triggered it (recruiter); drives spend limits.
    sens: Internal
    'null': true
    null_why: NULL = system (gateway webhook, expiry job).
  - name: reverses_wallet_ledger_entry_id
    type: UUID
    domain: identifier
    desc: Entry this one reverses.
    sens: Internal
    'null': true
    null_why: NULL unless this is a reversal.
  - name: has_fk_reference
    type: BOOL
    domain: boolean
    desc: True when exactly one explicit reference FK below is set; false for entries referenced from the other side (profile_download) or manual adjustments.
    sens: Internal
    default: 'true'
  - name: payment_order_id
    type: UUID
    domain: identifier
    desc: Recharge payment this credit came from.
    sens: Internal
    'null': true
    null_why: NULL unless the reference is a payment order.
  - name: refund_id
    type: UUID
    domain: identifier
    desc: Refund this movement implements.
    sens: Internal
    'null': true
    null_why: NULL unless the reference is a refund.
  - name: outreach_batch_id
    type: UUID
    domain: identifier
    desc: Outreach batch consuming credits.
    sens: Internal
    'null': true
    null_why: NULL unless the reference is an outreach batch.
  - name: job_requirement_id
    type: UUID
    domain: identifier
    desc: Job posting consuming credits.
    sens: Internal
    'null': true
    null_why: NULL unless the reference is a job posting.
  - name: coupon_redemption_id
    type: UUID
    domain: identifier
    desc: Coupon that granted bonus credits.
    sens: Internal
    'null': true
    null_why: NULL unless the reference is a coupon.
  - name: wallet_expiry_bucket_id
    type: UUID
    domain: identifier
    desc: Bucket that expired.
    sens: Internal
    'null': true
    null_why: NULL unless this is an expiry entry.
  - name: adjustment_note
    type: STRING(300)
    domain: free_text
    desc: Operator justification for a manual adjustment.
    sens: Internal
    'null': true
    null_why: NULL except adjustment/promo entries.
  - name: prev_hash
    type: BYTES
    domain: blob
    desc: row_hash of the previous entry of this wallet (tamper-evident chain).
    sens: Internal
    'null': true
    null_why: NULL only for sequence_no = 1.
  - name: row_hash
    type: BYTES
    domain: blob
    desc: SHA-256 over (prev_hash, wallet_id, sequence_no, type, credits_delta, balance_after, idempotency_key, created_at).
    sens: Internal
  constraints:
  - name: uq_wallet_ledger_entry_wallet_id_sequence_no
    type: unique
    columns:
    - wallet_id
    - sequence_no
    desc: D-14 per-wallet sequence; also composite FK target.
  - name: uq_wallet_ledger_entry_idempotency_key
    type: unique
    columns:
    - idempotency_key
    desc: D-14 global idempotency.
  - name: uq_wallet_ledger_entry_reverses_wallet_ledger_entry_id
    type: unique
    columns:
    - reverses_wallet_ledger_entry_id
    desc: An entry is reversed at most once (NULLs distinct).
  - name: ck_wallet_ledger_entry_delta_nonzero
    type: check
    expr: credits_delta <> 0
    desc: No empty movements.
  - name: ck_wallet_ledger_entry_sign_flag
    type: check
    expr: (is_debit AND credits_delta < 0) OR ((NOT is_debit) AND credits_delta > 0)
    desc: is_debit matches the sign.
  - name: ck_wallet_ledger_entry_balance_nonneg
    type: check
    expr: balance_after >= 0
    desc: Ledger can never record a negative balance.
  - name: ck_wallet_ledger_entry_seq_pos
    type: check
    expr: sequence_no > 0 AND (sequence_no = 1) = (prev_sequence_no IS NULL) AND (prev_sequence_no IS NULL OR prev_sequence_no = sequence_no - 1)
    desc: Gapless predecessor.
  - name: ck_wallet_ledger_entry_hash_chain
    type: check
    expr: (sequence_no = 1) = (prev_hash IS NULL)
    desc: Genesis entry has no prev_hash.
  - name: ck_wallet_ledger_entry_single_reference
    type: check
    expr: num_nonnulls(payment_order_id, refund_id, outreach_batch_id, job_requirement_id, coupon_redemption_id, wallet_expiry_bucket_id, reverses_wallet_ledger_entry_id) = CASE WHEN has_fk_reference THEN
      1 ELSE 0 END
    desc: Exactly-one-of explicit reference (or none when referenced from the other side).
  indexes:
  - name: idx_wallet_ledger_entry_created_at
    columns:
    - created_at
    desc: Time-ordered scans (reconciliation/export) without a hot range.
    hash: true
    bucket_count: 16
  - name: idx_wallet_ledger_entry_actor_app_user_id_created_at
    columns:
    - actor_app_user_id
    - created_at DESC
    desc: Per-user spend-limit window sums and statements.
    where: actor_app_user_id IS NOT NULL
  - name: idx_wallet_ledger_entry_payment_order_id
    columns:
    - payment_order_id
    desc: FK leading index (parent lookups / delete checks)
    where: payment_order_id IS NOT NULL
  - name: idx_wallet_ledger_entry_refund_id
    columns:
    - refund_id
    desc: FK leading index (parent lookups / delete checks)
    where: refund_id IS NOT NULL
  - name: idx_wallet_ledger_entry_outreach_batch_id
    columns:
    - outreach_batch_id
    desc: FK leading index (parent lookups / delete checks)
    where: outreach_batch_id IS NOT NULL
  - name: idx_wallet_ledger_entry_job_requirement_id
    columns:
    - job_requirement_id
    desc: FK leading index (parent lookups / delete checks)
    where: job_requirement_id IS NOT NULL
  - name: idx_wallet_ledger_entry_coupon_redemption_id
    columns:
    - coupon_redemption_id
    desc: FK leading index (parent lookups / delete checks)
    where: coupon_redemption_id IS NOT NULL
  - name: idx_wallet_ledger_entry_wallet_expiry_bucket_id
    columns:
    - wallet_expiry_bucket_id
    desc: FK leading index (parent lookups / delete checks)
    where: wallet_expiry_bucket_id IS NOT NULL
  fks:
  - name: fk_wallet_ledger_entry_wallet_id
    columns:
    - wallet_id
    ref: wallet
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: financial/history row must block deletion of its parent
  - name: fk_wallet_ledger_entry_ledger_entry_type_id
    columns:
    - ledger_entry_type_id
    ref: ledger_entry_type
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: lookup values are retired via is_active, never deleted
    index_exempt: low-cardinality lookup; never filtered alone; lookup rows are never deleted
  - name: fk_wallet_ledger_entry_actor_app_user_id
    columns:
    - actor_app_user_id
    ref: app_user
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: financial/history row must block deletion of its parent
  - name: fk_wallet_ledger_entry_reverses_wallet_ledger_entry_id
    columns:
    - reverses_wallet_ledger_entry_id
    ref: wallet_ledger_entry
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: financial/history row must block deletion of its parent
  - name: fk_wallet_ledger_entry_payment_order_id
    columns:
    - payment_order_id
    ref: payment_order
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: financial/history row must block deletion of its parent
  - name: fk_wallet_ledger_entry_refund_id
    columns:
    - refund_id
    ref: refund
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: financial/history row must block deletion of its parent
  - name: fk_wallet_ledger_entry_outreach_batch_id
    columns:
    - outreach_batch_id
    ref: outreach_batch
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: financial/history row must block deletion of its parent
  - name: fk_wallet_ledger_entry_job_requirement_id
    columns:
    - job_requirement_id
    ref: job_requirement
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: financial/history row must block deletion of its parent
  - name: fk_wallet_ledger_entry_coupon_redemption_id
    columns:
    - coupon_redemption_id
    ref: coupon_redemption
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: financial/history row must block deletion of its parent
  - name: fk_wallet_ledger_entry_wallet_expiry_bucket_id
    columns:
    - wallet_expiry_bucket_id
    ref: wallet_expiry_bucket
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: financial/history row must block deletion of its parent
  - name: fk_wallet_ledger_entry_prev_entry
    columns:
