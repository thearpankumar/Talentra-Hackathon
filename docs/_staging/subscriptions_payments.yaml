views:
- name: vw_subscription_period_overlap
  kind: view
  tables:
  - subscription_period
  purpose: 'Validation query for BR-SUB-03: must return 0 rows.'
  security: Internal; finance/ops read-only role.
  sql_sketch: SELECT a.licence_id, a.id AS period_a, b.id AS period_b FROM subscription_period a JOIN subscription_period b ON a.licence_id=b.licence_id AND a.id < b.id AND a.period_start_date < b.period_end_date
    AND b.period_start_date < a.period_end_date WHERE a.period_start_date < a.period_end_date AND b.period_start_date < b.period_end_date
- name: vw_wallet_balance_drift
  kind: view
  tables:
  - wallet
  - wallet_ledger_entry
  purpose: Wallets whose stored balance/sequence differ from the ledger (expect 0 rows).
  security: Internal; finance read-only.
  sql_sketch: SELECT w.id, w.credit_balance, SUM(l.credits_delta) AS ledger_sum, w.ledger_sequence, MAX(l.sequence_no) AS max_seq FROM wallet w LEFT JOIN wallet_ledger_entry l ON l.wallet_id=w.id GROUP
    BY w.id, w.credit_balance, w.ledger_sequence HAVING w.credit_balance <> COALESCE(SUM(l.credits_delta),0) OR w.ledger_sequence <> COALESCE(MAX(l.sequence_no),0)
- name: vw_invoice_number_gap
  kind: view
  tables:
  - invoice
  - invoice_number_series
  purpose: Gaps in issued invoice numbers per series (expect 0 rows).
  security: Internal; finance read-only.
  sql_sketch: SELECT invoice_number_series_id, MAX(invoice_number) - COUNT(*) AS missing FROM invoice WHERE invoice_number IS NOT NULL GROUP BY invoice_number_series_id HAVING MAX(invoice_number) <> COUNT(*)
- name: vw_organisation_download_spend
  kind: view
  tables:
  - profile_download
  - wallet_ledger_entry
  purpose: Credits spent per organisation/day on profile downloads (B68 module query).
  security: Internal; org admins see own tenant only.
  sql_sketch: SELECT organisation_id, date_trunc('day', downloaded_at) AS day, COUNT(*) AS downloads, SUM(credits_charged) AS credits FROM profile_download GROUP BY 1,2
business_rules:
- id: BR-SUB-01
  rule: One live subscription per licence.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: UNIQUE INDEX uq_subscription_licence_id_live ON subscription(licence_id) WHERE ended_at IS NULL AND deleted_at IS NULL.
  tables:
  - subscription
  milestone: B47
- id: BR-SUB-02
  rule: A subscription's periods carry the same licence as the subscription.
  mechanism_type: FK
  mechanism: Composite FK (subscription_id, licence_id) -> subscription(id, licence_id) backed by UNIQUE uq_subscription_id_licence.
  tables:
  - subscription
  - subscription_period
  milestone: B47
- id: BR-SUB-03
  rule: Subscription periods of a licence never overlap.
  mechanism_type: CHAIN_FK
  mechanism: 'P1: sequence_no, prior_period_id UNIQUE, prior_period_end_date, composite FK (prior_period_id, licence_id, prior_period_end_date) -> subscription_period(id, licence_id, period_end_date) ON
    UPDATE RESTRICT (+ UNIQUE(id, period_end_date) and UNIQUE(id, licence_id, period_end_date)); CHECK period_start_date >= prior_period_end_date; CHECK start <= end; partial UNIQUE (licence_id) WHERE prior_period_id
    IS NULL; UNIQUE(licence_id, sequence_no); prior_period_id excluded from UPDATE grants.'
  tables:
  - subscription_period
  milestone: B47
- id: BR-SUB-04
  rule: Only the last period of a licence may be shortened on early cancellation; the shortening is recorded.
  mechanism_type: CHAIN_FK
  mechanism: ON UPDATE RESTRICT on the composite FK blocks changing period_end_date of any period that has a successor; CHECK ck_subscription_period_shorten_pair requires original_period_end_date/shortened_at
    together and original >= new end. Scheduled uninvoiced tail periods are hard-deleted first.
  tables:
  - subscription_period
  milestone: B47
- id: BR-SUB-05
  rule: Renewal creates the next period, the payment order and the status history row in one transaction.
  mechanism_type: TXN_LOCK
  mechanism: 'Txn: SELECT subscription FOR UPDATE; INSERT subscription_period(prior = tail); INSERT payment_order; INSERT subscription_status_history; UNIQUE(prior_period_id) and UNIQUE(licence_id, sequence_no)
    make concurrent renewals fail with 23505.'
  tables:
  - subscription_period
  - payment_order
  - subscription_status_history
  milestone: B47
- id: BR-SUB-06
  rule: Wallet balance can never be negative; one wallet per owner and currency; exactly one owner.
  mechanism_type: CHECK
  mechanism: CHECK credit_balance >= 0; CHECK num_nonnulls(owner_organisation_id, owner_app_user_id) = 1; partial UNIQUE (owner_organisation_id, currency_id) / (owner_app_user_id, currency_id) WHERE deleted_at
    IS NULL.
  tables:
  - wallet
  milestone: B47
- id: BR-SUB-07
  rule: The wallet ledger is append-only; corrections are reversal rows referencing the original; a row is reversed at most once.
  mechanism_type: PRIVILEGE
  mechanism: 'App roles: GRANT INSERT, SELECT only (no UPDATE/DELETE) on wallet_ledger_entry; UNIQUE(reverses_wallet_ledger_entry_id); self FK reverses_wallet_ledger_entry_id RESTRICT; CHECK single_reference.'
  tables:
  - wallet_ledger_entry
  milestone: B47
- id: BR-SUB-08
  rule: Every wallet movement is serialised per wallet, sequenced gaplessly, idempotent and balance-checked.
  mechanism_type: TXN_LOCK
  mechanism: 'Debit txn: replay check by idempotency_key; SELECT wallet FOR UPDATE; check balance/spend limits; seq=ledger_sequence+1; INSERT ledger (balance_after, hashes); FIFO lots FOR UPDATE; UPDATE
    wallet; COMMIT; retry on 40001. Backstops: UNIQUE(wallet_id, sequence_no), UNIQUE(idempotency_key), CHECK credit_balance >= 0, composite self-FK (wallet_id, prev_sequence_no) -> (wallet_id, sequence_no).'
  tables:
  - wallet
  - wallet_ledger_entry
  - wallet_expiry_bucket
  - wallet_bucket_consumption
  milestone: B47
- id: BR-SUB-09
  rule: Ledger sign matches the entry; no empty movement; ledger balance never negative.
  mechanism_type: CHECK
  mechanism: ck_wallet_ledger_entry_sign_flag, delta_nonzero, balance_nonneg.
  tables:
  - wallet_ledger_entry
  milestone: B47
- id: BR-SUB-10
  rule: 'Ledger tamper evidence: hash chain per wallet.'
  mechanism_type: APP_LAYER
  mechanism: row_hash = SHA-256(prev_hash || canonical row); CHECK genesis has NULL prev_hash; nightly verifier job recomputes chains; changefeed to immutable sink (P5).
  tables:
  - wallet_ledger_entry
  milestone: B47
- id: BR-SUB-11
  rule: Wallet credit lots are consumed first-expiring-first and never over-consumed.
  mechanism_type: CHECK
  mechanism: CHECK credits_remaining BETWEEN 0 AND credits_granted; FIFO via index (wallet_id, expires_at) WHERE credits_remaining > 0 with FOR UPDATE in the debit txn; expiry job writes `expiry` ledger
    rows referencing the bucket.
  tables:
  - wallet_expiry_bucket
  - wallet_bucket_consumption
  milestone: B47
- id: BR-SUB-12
  rule: Invoice numbers are unique and gapless per series; drafts have no number.
  mechanism_type: TXN_LOCK
  mechanism: Issue txn locks invoice_number_series row FOR UPDATE, increments next_number, sets invoice_number; UNIQUE(invoice_number_series_id, invoice_number); CHECK number/label/issued_at/issue_date
    all NULL or all set.
  tables:
  - invoice
  - invoice_number_series
  - credit_note
  milestone: B47
- id: BR-SUB-13
  rule: Invoice arithmetic and settlement bounds are enforced.
  mechanism_type: CHECK
  mechanism: total = subtotal + tax; 0 <= amount_paid <= total; line net = quantity*unit_price; tax line within 0.01 of base*rate; rate 0..100.
  tables:
  - invoice
  - invoice_line
  - invoice_tax_line
  milestone: B47
- id: BR-SUB-14
  rule: Payment orders and refunds are idempotent; webhooks are deduplicated.
  mechanism_type: UNIQUE
  mechanism: UNIQUE(idempotency_key) on payment_order and refund; UNIQUE(payment_gateway_id, gateway_order_ref); UNIQUE(payment_gateway_id, gateway_event_ref) on payment_event.
  tables:
  - payment_order
  - refund
  - payment_event
  milestone: B47
- id: BR-SUB-15
  rule: Total refunds of an order never exceed the amount paid; refund approver differs from requester.
  mechanism_type: TXN_LOCK
  mechanism: 'Refund txn: SELECT payment_order FOR UPDATE; SUM(refund.amount) + new <= order.amount; CHECK approved_by <> requested_by; credit clawback writes a `refund` ledger row under the wallet lock.'
  tables:
  - refund
  - payment_order
  - wallet_ledger_entry
  milestone: B47
- id: BR-SUB-16
  rule: No card, bank or VPA data is stored; only gateway tokens and masked display data.
  mechanism_type: APP_LAYER
  mechanism: Schema has no PAN/CVV/account columns; payment_method_token.token_ref encrypted (Sensitive); payment_event.payload allow-list sanitised, encrypted, TTL 540 days; code review and a column-name
    lint block additions.
  tables:
  - payment_method_token
  - payment_event
  - payment_order
  milestone: B76
- id: BR-SUB-17
  rule: At most one default payment instrument per organisation.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: UNIQUE INDEX uq_payment_method_token_organisation_id_default (organisation_id) WHERE is_default AND deleted_at IS NULL.
  tables:
  - payment_method_token
  milestone: B47
- id: BR-SUB-18
  rule: 'Each profile download is paid by exactly one of: ledger deduction, free quota, or free repeat of a paid download; credits charged iff a ledger row exists.'
  mechanism_type: CHECK
  mechanism: ck_profile_download_payer_exactly_one (num_nonnulls = 1) and credits_consistent; UNIQUE(wallet_ledger_entry_id) and UNIQUE(idempotency_key).
  tables:
  - profile_download
  milestone: B47
- id: BR-SUB-19
  rule: Profile download history is append-only and carries actor, subject, time and credit deduction.
  mechanism_type: PRIVILEGE
  mechanism: INSERT/SELECT grants only; NOT NULL actor_app_user_id, candidate_profile_id, downloaded_at; hash-sharded time index.
  tables:
  - profile_download
  milestone: B47
- id: BR-SUB-20
  rule: Free-quota usage never exceeds the entitlement limit.
  mechanism_type: TXN_LOCK
  mechanism: SELECT subscription_entitlement FOR UPDATE then UPDATE used_count+1; CHECK used_count >= 0 AND (limit_value IS NULL OR used_count <= limit_value) as backstop.
  tables:
  - subscription_entitlement
  - plan_entitlement
  milestone: B47
- id: BR-SUB-21
  rule: Coupons honour validity, caps and per-organisation limits.
  mechanism_type: TXN_LOCK
  mechanism: Redemption txn locks coupon row FOR UPDATE; checks valid_from/valid_to, per_organisation_limit via coupon_id+organisation_id index; CHECK redemption_count <= max_redemptions.
  tables:
  - coupon
  - coupon_redemption
  milestone: B47
- id: BR-SUB-22
  rule: Spend limits are enforced at debit time.
  mechanism_type: TXN_LOCK
  mechanism: 'Inside the debit txn: SUM(credits_delta) of the actor/licence/org in the window via idx_wallet_ledger_entry_actor_app_user_id_created_at compared with spend_limit.max_credits; hard block aborts
    the txn.'
  tables:
  - spend_limit
  - wallet_ledger_entry
  milestone: B47
- id: BR-SUB-23
  rule: Price/rate/tax histories do not overlap ambiguously.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: UNIQUE (plan_version_id, currency_id, billing_interval_id); UNIQUE (credit_pack_id, currency_id, effective_from_date); partial UNIQUE default rate card per action; tax_rate partial uniques
    per component/start; end >= start CHECKs.
  tables:
  - plan_price
  - credit_pack_price
  - credit_rate_card
  - tax_rate
  milestone: B47
- id: BR-SUB-24
  rule: Only one non-withdrawn cancellation per subscription.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: UNIQUE INDEX uq_subscription_cancellation_subscription_id_open (subscription_id) WHERE withdrawn_at IS NULL AND deleted_at IS NULL.
  tables:
  - subscription_cancellation
  milestone: B47
- id: BR-SUB-25
  rule: Subscription status changes are recorded.
  mechanism_type: APP_LAYER
  mechanism: Status update and INSERT subscription_status_history happen in one txn (service layer); nightly job asserts latest history.to_status = subscription.status.
  tables:
  - subscription
  - subscription_status_history
  milestone: B47
- id: BR-SUB-26
  rule: Tax registration numbers are stored encrypted with a blind index and validated before storage.
  mechanism_type: APP_LAYER
  mechanism: tax_number_encrypted (AES-GCM, KMS) + tax_number_hmac; partial UNIQUE (country_id, tax_id_type_id, tax_number_hmac) WHERE deleted_at IS NULL; GSTIN regex+checksum validated in the service.
  tables:
  - tax_registration
  milestone: B76
- id: BR-SUB-27
  rule: 'Reconciliation: settled gateway totals must match paid orders; exceptions must be resolved by a named user.'
  mechanism_type: JOB
  mechanism: Daily reconciliation_run per gateway; reconciliation_item per payment with match_state; CHECK resolved_at/resolved_by together; alert if exception_count > 0 for > 2 days.
  tables:
  - reconciliation_run
  - reconciliation_item
  milestone: B47
- id: BR-SUB-28
  rule: FX rates are append-only history; invoices cite the rate used.
  mechanism_type: PRIVILEGE
  mechanism: INSERT/SELECT only on currency_exchange_rate; invoice.currency_exchange_rate_id FK; CHECK rate > 0 and base <> quote.
  tables:
  - currency_exchange_rate
  - invoice
  milestone: B47
- id: BR-SUB-29
  rule: Row-level TTL purges raw webhook payloads after 540 days only.
  mechanism_type: TTL
  mechanism: ttl_expiration_expression on payment_event.received_at (540 days); payment_event_outcome and orders keep the audit trail.
  tables:
  - payment_event
  milestone: B76
- id: BR-SUB-30
  rule: Consultant payout net equals commission minus TDS.
  mechanism_type: CHECK
  mechanism: ck_consultant_payout_math; rate 0..100; payout_ref tokenised (Sensitive).
  tables:
  - consultant_payout
  milestone: B47
