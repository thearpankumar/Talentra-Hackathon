- name: invoice_tax_line
  kind: entity
  delete_policy: hard
  volume: high
  tier: '1'
  milestones:
  - B38
  - B44
  retention: Same as the invoice line.
  description: Tax per invoice line and component (CGST+SGST or IGST or VAT) with the rate applied.
  columns:
  - name: invoice_line_id
    type: UUID
    domain: identifier
    desc: Line taxed.
    sens: Internal
  - name: tax_component_id
    type: UUID
    domain: enum_ref
    desc: Component.
    sens: Internal
  - name: tax_rate_id
    type: UUID
    domain: identifier
    desc: Rate row applied (traceability).
    sens: Internal
  - name: rate_percent
    type: DECIMAL(5,2)
    domain: percentage
    desc: Rate snapshot.
    sens: Internal
  - name: taxable_amount
    type: DECIMAL(18,4)
    domain: money
    desc: Base the tax is computed on.
    sens: Internal
  - name: tax_amount
    type: DECIMAL(18,4)
    domain: money
    desc: Tax charged.
    sens: Internal
  - name: currency_id
    type: UUID
    domain: identifier
    desc: Currency (equals invoice).
    sens: Internal
  constraints:
  - name: uq_invoice_tax_line_line_component
    type: unique
    columns:
    - invoice_line_id
    - tax_component_id
    desc: One row per component per line.
  - name: ck_invoice_tax_line_rate_range
    type: check
    expr: rate_percent >= 0 AND rate_percent <= 100
    desc: 0..100.
  - name: ck_invoice_tax_line_tax_math
    type: check
    expr: abs(tax_amount - taxable_amount * rate_percent / 100) <= 0.01
    desc: Tax equals base x rate within one minor unit.
  indexes:
  - name: idx_invoice_tax_line_tax_rate_id
    columns:
    - tax_rate_id
    desc: FK leading index (parent lookups / delete checks)
