    domain: money
    desc: Order amount, tax-inclusive, as sent to the gateway.
    sens: Internal
  - name: currency_id
    type: UUID
    domain: identifier
    desc: Currency of the amount.
    sens: Internal
  - name: gateway_order_ref
    type: STRING(100)
    domain: token
    desc: Gateway's order reference (e.g. order_xxx).
    sens: Internal
    'null': true
    null_why: NULL until the gateway order is created (local row is written first).
  - name: idempotency_key
    type: STRING(120)
    domain: token
    desc: Client/server key making order creation replay-safe.
    sens: Internal
  - name: created_by_app_user_id
    type: UUID
    domain: identifier
    desc: User who initiated checkout.
    sens: Internal
    'null': true
    null_why: NULL = system (auto-renewal).
  - name: expires_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Order expiry instant.
    sens: Internal
    'null': true
    null_why: NULL = no expiry.
  - name: paid_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Instant the gateway confirmed payment.
    sens: Internal
    'null': true
    null_why: NULL = not paid.
  - name: failure_code
    type: STRING(64)
    domain: code
    desc: Gateway failure code (normalised).
    sens: Internal
    'null': true
    null_why: NULL unless failed.
  constraints:
  - name: uq_payment_order_idempotency_key
    type: unique
