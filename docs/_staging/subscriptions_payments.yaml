  - name: idx_spend_limit_licence_id
    columns:
    - licence_id
    desc: FK leading index (parent lookups / delete checks)
    where: licence_id IS NOT NULL
  - name: idx_spend_limit_currency_id
    columns:
    - currency_id
    desc: FK leading index (parent lookups / delete checks)
