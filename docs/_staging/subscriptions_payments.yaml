- name: payment_order
  kind: entity
  delete_policy: soft
  volume: high
  tier: '1'
  milestones:
  - B38
  - B41
  - B44
  - B47
  - B76
  retention: 'Financial: 8 years; gateway payload never stored here; erasure N/A (legal obligation), contact data lives elsewhere.'
  description: 'Our record of an order for money at an external gateway: references, status, amount only - no card/bank data (integration boundary, docket sec. 6).'
  columns:
  - name: organisation_id
    type: UUID
    domain: identifier
    desc: Paying organisation.
    sens: Internal
  - name: wallet_id
    type: UUID
    domain: identifier
    desc: Wallet to credit on payment (recharge).
    sens: Internal
    'null': true
    null_why: NULL unless purpose is wallet_recharge.
  - name: subscription_id
    type: UUID
    domain: identifier
    desc: Subscription being paid.
    sens: Internal
    'null': true
    null_why: NULL unless purpose is subscription_fee.
  - name: credit_pack_id
    type: UUID
    domain: identifier
    desc: Pack purchased.
    sens: Internal
    'null': true
    null_why: NULL unless a pack recharge.
  - name: invoice_id
    type: UUID
    domain: identifier
    desc: Invoice settled.
    sens: Internal
    'null': true
    null_why: NULL until an invoice exists for the order.
  - name: payment_purpose_id
    type: UUID
    domain: enum_ref
    desc: Why the money is collected.
    sens: Internal
  - name: payment_gateway_id
    type: UUID
    domain: enum_ref
    desc: Gateway used.
    sens: Internal
  - name: payment_order_status_id
    type: UUID
    domain: enum_ref
    desc: Current status (changes driven by verified webhooks).
    sens: Internal
  - name: amount
