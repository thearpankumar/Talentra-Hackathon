  delete_policy: append_only
  volume: high
  tier: '1'
  milestones:
  - B38
  - B41
  - B44
  - B47
  - B76
  retention: Sanitised payload kept 540 days by row TTL, then gone; processing metadata survives in payment_event_outcome and the order.
  description: Inbound gateway webhook stored once (idempotent on gateway_event_ref); processing result recorded in payment_event_outcome.
  columns:
  - name: payment_gateway_id
    type: UUID
    domain: enum_ref
    desc: Source gateway.
    sens: Internal
  - name: gateway_event_ref
    type: STRING(120)
    domain: token
    desc: Gateway event id used for dedupe.
    sens: Internal
  - name: event_type
    type: STRING(64)
    domain: code
    desc: Gateway event name (e.g. payment.captured).
    sens: Internal
  - name: payment_order_id
    type: UUID
    domain: identifier
    desc: Matched order.
    sens: Internal
    'null': true
    null_why: NULL when unmatched at receipt.
  - name: payload
    type: JSONB
    domain: json
    desc: Sanitised JSON body (card/bank/VPA fields stripped before insert).
    sens: Sensitive
    pii: allow-listed fields only; stripped of card/bank/VPA data at ingestion; encrypted at rest; TTL 540 days
  - name: signature_valid
    type: BOOL
    domain: boolean
    desc: HMAC signature verification result.
    sens: Internal
    default: 'false'
  - name: received_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Receipt instant.
    sens: Internal
  constraints:
  - name: uq_payment_event_gateway_event_ref
    type: unique
    columns:
    - payment_gateway_id
    - gateway_event_ref
    desc: Idempotent webhook ingestion.
  indexes:
  - name: idx_payment_event_received_at
    columns:
    - received_at
    desc: Time-ordered scans.
    hash: true
    bucket_count: 16
  - name: idx_payment_event_payment_order_id_received_at
    columns:
    - payment_order_id
    - received_at
    desc: Events of an order.
    where: payment_order_id IS NOT NULL
  fks:
  - name: fk_payment_event_payment_gateway_id
    columns:
    - payment_gateway_id
    ref: payment_gateway
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: lookup values are retired via is_active, never deleted
    index_exempt: low-cardinality lookup; never filtered alone; lookup rows are never deleted
  - name: fk_payment_event_payment_order_id
    columns:
    - payment_order_id
    ref: payment_order
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: financial/history row must block deletion of its parent
  ttl:
    expire_after: 540 days
    column: received_at
- name: payment_event_outcome
  kind: event
  delete_policy: append_only
  volume: high
  tier: '1'
  milestones:
  - B38
  - B44
  retention: Append-only; 8 years (lean rows).
  description: Result of processing a webhook event (one row per processing try); keeps payment_event immutable.
  columns:
  - name: payment_event_id
    type: UUID
    domain: identifier
    desc: Event processed.
    sens: Internal
    'null': true
    null_why: NULL = the raw payment_event row aged out of its 540-day TTL; the outcome row keeps provider reference and result.
  - name: webhook_outcome_id
    type: UUID
    domain: enum_ref
    desc: Processing result.
    sens: Internal
  - name: processed_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Processing instant.
    sens: Internal
  - name: detail
    type: STRING(300)
    domain: free_text
    desc: Short diagnostic.
    sens: Internal
    'null': true
    null_why: NULL on clean success.
  constraints: []
  indexes:
  - name: idx_payment_event_outcome_payment_event_id_processed_at
    columns:
    - payment_event_id
    - processed_at
    desc: Outcomes of an event.
  - name: idx_payment_event_outcome_processed_at
    columns:
    - processed_at
    desc: Time scans.
    hash: true
    bucket_count: 16
  fks:
  - name: fk_payment_event_outcome_payment_event_id
    columns:
    - payment_event_id
    ref: payment_event
    ref_columns:
    - id
    on_delete: SET NULL
    on_update: RESTRICT
    desc: 'SET NULL: the parent is removed by its row-level TTL (CockroachDB TTL jobs fail while a RESTRICT child exists); the child row survives with the reference cleared (decision F-01).'
  - name: fk_payment_event_outcome_webhook_outcome_id
    columns:
    - webhook_outcome_id
    ref: webhook_outcome
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: lookup values are retired via is_active, never deleted
    index_exempt: low-cardinality lookup; never filtered alone; lookup rows are never deleted
