    desc: Replay-safe order creation.
  - name: uq_payment_order_gateway_order_ref
    type: unique
    columns:
    - payment_gateway_id
    - gateway_order_ref
    desc: Gateway reference unique per gateway (NULLs distinct).
  - name: ck_payment_order_amount_pos
    type: check
    expr: amount > 0
    desc: Orders are positive.
  - name: ck_payment_order_paid_after_created
    type: check
    expr: paid_at IS NULL OR paid_at >= created_at
    desc: Payment cannot precede the order.
  indexes:
