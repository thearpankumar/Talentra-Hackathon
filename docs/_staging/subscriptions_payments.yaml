- name: invoice
  kind: entity
  delete_policy: soft
  volume: high
  tier: '1'
  milestones:
  - B38
  - B41
  - B44
  - B47
  retention: 'Statutory: 8 years minimum; voided invoices keep their number.'
  description: Tax invoice; number assigned at issue from invoice_number_series (gapless); totals; snapshot of buyer identity.
  columns:
  - name: organisation_id
    type: UUID
    domain: identifier
    desc: Customer.
    sens: Internal
  - name: subscription_id
    type: UUID
    domain: identifier
    desc: Subscription billed.
    sens: Internal
    'null': true
    null_why: NULL for pure wallet-recharge invoices.
  - name: invoice_number_series_id
    type: UUID
    domain: identifier
    desc: Series the number comes from.
    sens: Internal
  - name: invoice_number
    type: INT8
    domain: quantity
    desc: Number within the series, assigned at issue.
    sens: Internal
    'null': true
    null_why: NULL while draft (numbers are never reserved for drafts, keeping the series gapless).
  - name: invoice_label
    type: STRING(40)
    domain: code
    desc: Printed number prefix/FY/number, e.g. TLG/IN/2026-27/000123.
    sens: Internal
    'null': true
    null_why: NULL while draft.
  - name: invoice_status_id
    type: UUID
    domain: enum_ref
    desc: Lifecycle status.
    sens: Internal
  - name: billing_address_id
    type: UUID
    domain: identifier
    desc: Buyer address (also snapshotted in address_snapshot).
    sens: Internal
  - name: buyer_tax_registration_id
    type: UUID
    domain: identifier
    desc: Buyer tax registration used.
    sens: Internal
    'null': true
    null_why: NULL = unregistered buyer (B2C).
  - name: seller_tax_registration_id
    type: UUID
    domain: identifier
    desc: Seller registration (our GSTIN).
    sens: Internal
  - name: place_of_supply_state_region_id
    type: UUID
    domain: identifier
    desc: GST place of supply.
    sens: Internal
    'null': true
    null_why: NULL for non-GST jurisdictions.
  - name: address_snapshot
    type: JSONB
    domain: json
    desc: Buyer name/address/tax text frozen at issue.
    sens: Personal
    pii: copied from billing_address; access-controlled; retained for the statutory period, anonymised only after it
  - name: currency_id
    type: UUID
    domain: identifier
    desc: Invoice currency.
    sens: Internal
  - name: currency_exchange_rate_id
    type: UUID
    domain: identifier
    desc: FX rate used for GST INR conversion / base-currency reporting.
    sens: Internal
    'null': true
    null_why: NULL = invoice already in the reporting currency.
  - name: subtotal_amount
    type: DECIMAL(18,4)
    domain: money
    desc: Sum of line net amounts.
    sens: Internal
  - name: tax_amount
    type: DECIMAL(18,4)
    domain: money
    desc: Sum of tax lines.
    sens: Internal
  - name: total_amount
    type: DECIMAL(18,4)
    domain: money
    desc: subtotal + tax.
    sens: Internal
  - name: amount_paid
    type: DECIMAL(18,4)
    domain: money
    desc: Settled so far.
    sens: Internal
    default: '0'
  - name: issue_date
    type: DATE
    domain: date
    desc: Issue date.
    sens: Internal
    'null': true
    null_why: NULL while draft.
  - name: due_date
    type: DATE
    domain: date
    desc: Payment due date.
    sens: Internal
    'null': true
    null_why: NULL while draft or for prepaid invoices.
  - name: issued_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Issue instant.
    sens: Internal
    'null': true
    null_why: NULL while draft.
  - name: voided_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Void instant.
    sens: Internal
    'null': true
    null_why: NULL = not voided.
  constraints:
  - name: uq_invoice_series_number
    type: unique
    columns:
    - invoice_number_series_id
    - invoice_number
    desc: Gapless-per-series uniqueness (NULL drafts distinct).
  - name: uq_invoice_invoice_label
    type: unique
    columns:
    - invoice_label
    desc: Printed label unique.
  - name: ck_invoice_totals
    type: check
    expr: total_amount = subtotal_amount + tax_amount AND subtotal_amount >= 0 AND tax_amount >= 0
    desc: Arithmetic integrity.
  - name: ck_invoice_paid_bounds
    type: check
    expr: amount_paid >= 0 AND amount_paid <= total_amount
    desc: Cannot overpay an invoice (overpayment goes to wallet/credit note).
  - name: ck_invoice_number_issued
    type: check
    expr: (invoice_number IS NULL) = (issued_at IS NULL) AND (invoice_number IS NULL) = (invoice_label IS NULL) AND (invoice_number IS NULL) = (issue_date IS NULL)
    desc: Number, label, issue date and instant appear together at issue.
  - name: ck_invoice_due_after_issue
    type: check
    expr: due_date IS NULL OR issue_date IS NULL OR due_date >= issue_date
    desc: Due not before issue.
  indexes:
  - name: idx_invoice_organisation_id_created_at
    columns:
    - organisation_id
    - created_at DESC
    desc: Customer invoice list.
  - name: idx_invoice_due_date_open
    columns:
    - due_date
    desc: Overdue/dunning scan.
    where: voided_at IS NULL AND due_date IS NOT NULL
  - name: idx_invoice_created_at
    columns:
    - created_at
    desc: Time scans.
    hash: true
    bucket_count: 8
  - name: idx_invoice_subscription_id
    columns:
    - subscription_id
    desc: FK leading index (parent lookups / delete checks)
    where: subscription_id IS NOT NULL
  - name: idx_invoice_billing_address_id
    columns:
    - billing_address_id
    desc: FK leading index (parent lookups / delete checks)
  - name: idx_invoice_buyer_tax_registration_id
    columns:
    - buyer_tax_registration_id
    desc: FK leading index (parent lookups / delete checks)
    where: buyer_tax_registration_id IS NOT NULL
  - name: idx_invoice_seller_tax_registration_id
    columns:
    - seller_tax_registration_id
    desc: FK leading index (parent lookups / delete checks)
  - name: idx_invoice_place_of_supply_state_region_id
    columns:
    - place_of_supply_state_region_id
    desc: FK leading index (parent lookups / delete checks)
    where: place_of_supply_state_region_id IS NOT NULL
  - name: idx_invoice_currency_id
    columns:
    - currency_id
    desc: FK leading index (parent lookups / delete checks)
  - name: idx_invoice_currency_exchange_rate_id
    columns:
    - currency_exchange_rate_id
    desc: FK leading index (parent lookups / delete checks)
    where: currency_exchange_rate_id IS NOT NULL
  fks:
  - name: fk_invoice_organisation_id
    columns:
    - organisation_id
    ref: organisation
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: financial/history row must block deletion of its parent
  - name: fk_invoice_subscription_id
    columns:
    - subscription_id
    ref: subscription
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: financial/history row must block deletion of its parent
  - name: fk_invoice_invoice_number_series_id
    columns:
    - invoice_number_series_id
    ref: invoice_number_series
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: financial/history row must block deletion of its parent
  - name: fk_invoice_invoice_status_id
    columns:
    - invoice_status_id
    ref: invoice_status
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: lookup values are retired via is_active, never deleted
    index_exempt: low-cardinality lookup; never filtered alone; lookup rows are never deleted
  - name: fk_invoice_billing_address_id
    columns:
    - billing_address_id
    ref: billing_address
    ref_columns:
    - id
