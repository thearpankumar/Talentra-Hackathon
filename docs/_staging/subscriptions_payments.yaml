- name: wallet_expiry_bucket
  kind: entity
  delete_policy: hard
  volume: high
  tier: '1'
  milestones:
  - B38
  - B44
  retention: Zero-remaining buckets purged 2 years after expiry (the ledger keeps the truth).
  description: Credit grant lot with expiry; consumed FIFO by earliest expires_at; remaining credits mutate (derived state).
  columns:
  - name: wallet_id
    type: UUID
    domain: identifier
    desc: Wallet holding the lot.
    sens: Internal
  - name: source_wallet_ledger_entry_id
    type: UUID
    domain: identifier
    desc: Ledger credit entry that created the lot.
    sens: Internal
  - name: credits_granted
    type: INT8
    domain: quantity
    desc: Credits in the lot.
    sens: Internal
  - name: credits_remaining
    type: INT8
