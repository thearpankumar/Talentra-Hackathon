tables:
- name: subscription_plan
  kind: entity
  delete_policy: soft
  volume: low
  tier: '1'
  milestones:
  - B38
  - B44
  retention: Commercial catalogue; retired plans kept (is_active=false) while any subscription references them; 8 years after last subscription for tax/audit.
  description: Sellable plan family (e.g. Recruiter Pro). Immutable commercial terms live in plan_version; this row is the stable identity.
  columns:
  - name: plan_code
    type: STRING(40)
    domain: code
    desc: Stable machine code of the plan (e.g. recruiter_pro).
    sens: Internal
  - name: name_i18n
    type: JSONB
    domain: json
    desc: 'Display name per UI language {language_tag: text}; must contain ''en''.'
    sens: Public
  - name: plan_audience_id
    type: UUID
    domain: enum_ref
    desc: Customer segment the plan targets.
    sens: Internal
  - name: is_active
    type: BOOL
    domain: boolean
    desc: False = no longer sold; existing subscriptions continue.
    sens: Internal
    default: 'true'
  - name: is_public
    type: BOOL
    domain: boolean
    desc: True = listed on the public pricing page; false = custom/enterprise negotiated.
    sens: Internal
    default: 'true'
  constraints:
  - name: uq_subscription_plan_plan_code
    type: unique
    columns:
    - plan_code
    desc: Natural key of the plan (soft-deleted rows keep their code reserved).
  - name: ck_subscription_plan_name_has_en
    type: check
    expr: name_i18n ? 'en'
    desc: Default language present.
  indexes: []
  fks:
  - name: fk_subscription_plan_plan_audience_id
    columns:
    - plan_audience_id
    ref: plan_audience
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: lookup values are retired via is_active, never deleted
    index_exempt: low-cardinality lookup; never filtered alone; lookup rows are never deleted
- name: plan_version
  kind: config
  delete_policy: hard
  volume: low
  tier: '1'
  milestones:
  - B38
  - B44
  - B47
  retention: Never deleted once referenced by a subscription; superseded by a newer version; 8 years.
  description: Versioned, immutable terms of a plan (limits, trial, credits included). Subscriptions snapshot a version so later price/limit changes never alter running contracts.
  columns:
  - name: subscription_plan_id
    type: UUID
    domain: identifier
    desc: Plan family this version belongs to.
    sens: Internal
  - name: version_no
    type: INT4
    domain: quantity
    desc: Monotonic version number within the plan.
    sens: Internal
  - name: effective_from_date
    type: DATE
    domain: date
    desc: First date the version can be sold.
    sens: Internal
  - name: effective_to_date
    type: DATE
    domain: date
    desc: Last date the version can be sold.
    sens: Internal
    'null': true
    null_why: NULL = open-ended (still sellable).
  - name: max_users
    type: INT4
    domain: quantity
    desc: Seats (users) per licence included.
    sens: Internal
  - name: max_devices_per_user
    type: INT4
    domain: quantity
    desc: Devices per user included (feeds licence limits, rule group 9).
    sens: Internal
  - name: included_credits
    type: INT8
    domain: quantity
    desc: Credits granted into the wallet at each period start (0 = none).
    sens: Internal
    default: '0'
  - name: trial_days
    type: INT4
    domain: quantity
    desc: Free-trial length in days (0 = no trial).
    sens: Internal
    default: '0'
  constraints:
  - name: uq_plan_version_subscription_plan_id_version_no
    type: unique
    columns:
    - subscription_plan_id
    - version_no
    desc: One row per plan version number.
  - name: ck_plan_version_dates
    type: check
    expr: effective_to_date IS NULL OR effective_to_date >= effective_from_date
    desc: End not before start.
  - name: ck_plan_version_limits_positive
    type: check
    expr: max_users > 0 AND max_devices_per_user > 0 AND included_credits >= 0 AND trial_days >= 0 AND version_no > 0
    desc: Positive limits (rule group 9).
  indexes: []
  fks:
  - name: fk_plan_version_subscription_plan_id
    columns:
    - subscription_plan_id
    ref: subscription_plan
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: financial/history row must block deletion of its parent
- name: plan_price
  kind: config
  delete_policy: hard
  volume: low
  tier: '1'
  milestones:
  - B38
  - B44
  retention: Kept with the plan version for invoice reproducibility; 8 years.
  description: Price point of a plan version per currency and billing interval (the price-list lookup).
  columns:
  - name: plan_version_id
    type: UUID
    domain: identifier
    desc: Plan version priced.
    sens: Internal
  - name: currency_id
    type: UUID
    domain: identifier
    desc: Currency of the price.
    sens: Internal
  - name: billing_interval_id
    type: UUID
    domain: enum_ref
    desc: Billing cadence this price applies to.
    sens: Internal
  - name: amount
    type: DECIMAL(18,4)
    domain: money
    desc: List price per interval, tax-exclusive.
    sens: Internal
  constraints:
  - name: uq_plan_price_version_currency_interval
    type: unique
    columns:
    - plan_version_id
    - currency_id
    - billing_interval_id
    desc: One price per version/currency/interval.
  - name: ck_plan_price_amount_nonneg
    type: check
    expr: amount >= 0
    desc: Free tiers allowed, never negative.
  indexes:
  - name: idx_plan_price_currency_id
    columns:
    - currency_id
    desc: FK leading index (parent lookups / delete checks)
  fks:
  - name: fk_plan_price_plan_version_id
    columns:
    - plan_version_id
    ref: plan_version
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: financial/history row must block deletion of its parent
  - name: fk_plan_price_currency_id
    columns:
    - currency_id
    ref: currency
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: financial/history row must block deletion of its parent
  - name: fk_plan_price_billing_interval_id
    columns:
    - billing_interval_id
    ref: billing_interval
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: lookup values are retired via is_active, never deleted
    index_exempt: low-cardinality lookup; never filtered alone; lookup rows are never deleted
- name: subscription
  kind: entity
  delete_policy: soft
  volume: medium
  tier: '1'
  milestones:
  - B38
  - B41
  - B44
  - B47
  retention: 'Financial record: kept 8 years after end (tax law); org erasure anonymises contacts only, never deletes the contract.'
  description: A customer organisation's contract for a plan version, bound to exactly one licence; status, renewal mode, price snapshot, cancellation flag.
  columns:
  - name: organisation_id
    type: UUID
    domain: identifier
    desc: Customer (tenant) organisation.
    sens: Internal
  - name: account_id
    type: UUID
    domain: identifier
    desc: Customer account that owns the contract.
    sens: Internal
  - name: licence_id
    type: UUID
    domain: identifier
    desc: Licence this subscription provisions (seats/devices come from it).
    sens: Internal
  - name: plan_version_id
    type: UUID
    domain: identifier
    desc: Plan version snapshot bought.
    sens: Internal
  - name: subscription_status_id
    type: UUID
    domain: enum_ref
    desc: Current lifecycle status (history in subscription_status_history).
    sens: Internal
  - name: renewal_mode_id
    type: UUID
    domain: enum_ref
    desc: auto_renew / manual_renew / fixed_term.
    sens: Internal
  - name: billing_interval_id
    type: UUID
    domain: enum_ref
    desc: Billing cadence agreed.
    sens: Internal
  - name: currency_id
    type: UUID
    domain: identifier
    desc: Contract currency.
    sens: Internal
  - name: recurring_amount
    type: DECIMAL(18,4)
    domain: money
    desc: Tax-exclusive amount per interval snapshotted from plan_price (after negotiated discount).
    sens: Internal
  - name: payment_method_token_id
    type: UUID
    domain: identifier
    desc: Default instrument for auto-renewal.
    sens: Internal
    'null': true
    null_why: NULL = invoiced/manual payment, no stored instrument.
  - name: started_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Contract start instant.
    sens: Internal
  - name: trial_ends_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: End of free trial.
    sens: Internal
    'null': true
    null_why: NULL = no trial.
  - name: cancel_at_period_end
    type: BOOL
    domain: boolean
    desc: True when cancellation is scheduled for the end of the current period.
    sens: Internal
    default: 'false'
  - name: ended_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Instant the contract ended (cancelled/expired).
    sens: Internal
    'null': true
    null_why: NULL = still live.
  constraints:
  - name: uq_subscription_id_licence
    type: unique
    columns:
    - id
    - licence_id
    desc: Composite FK target so periods prove they carry the subscription's licence.
  - name: ck_subscription_recurring_nonneg
    type: check
    expr: recurring_amount >= 0
    desc: No negative price.
  - name: ck_subscription_ended_after_start
    type: check
    expr: ended_at IS NULL OR ended_at >= started_at
    desc: End not before start.
  indexes:
  - name: uq_subscription_licence_id_live
    columns:
    - licence_id
    desc: At most one live subscription per licence.
    unique: true
    where: ended_at IS NULL AND deleted_at IS NULL
  - name: idx_subscription_organisation_id_status
    columns:
    - organisation_id
    - subscription_status_id
    desc: Org billing page / dunning lists.
  - name: idx_subscription_account_id
    columns:
    - account_id
    desc: FK leading index (parent lookups / delete checks)
  - name: idx_subscription_plan_version_id
    columns:
    - plan_version_id
    desc: FK leading index (parent lookups / delete checks)
  - name: idx_subscription_currency_id
    columns:
    - currency_id
    desc: FK leading index (parent lookups / delete checks)
  - name: idx_subscription_payment_method_token_id
    columns:
    - payment_method_token_id
    desc: FK leading index (parent lookups / delete checks)
    where: payment_method_token_id IS NOT NULL
  fks:
  - name: fk_subscription_organisation_id
    columns:
    - organisation_id
    ref: organisation
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: financial/history row must block deletion of its parent
  - name: fk_subscription_account_id
    columns:
    - account_id
    ref: account
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: financial/history row must block deletion of its parent
  - name: fk_subscription_licence_id
    columns:
    - licence_id
    ref: licence
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: financial/history row must block deletion of its parent
  - name: fk_subscription_plan_version_id
    columns:
    - plan_version_id
    ref: plan_version
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: financial/history row must block deletion of its parent
  - name: fk_subscription_subscription_status_id
    columns:
    - subscription_status_id
    ref: subscription_status
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: lookup values are retired via is_active, never deleted
    index_exempt: low-cardinality lookup; never filtered alone; lookup rows are never deleted
  - name: fk_subscription_renewal_mode_id
    columns:
    - renewal_mode_id
    ref: renewal_mode
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: lookup values are retired via is_active, never deleted
    index_exempt: low-cardinality lookup; never filtered alone; lookup rows are never deleted
  - name: fk_subscription_billing_interval_id
    columns:
    - billing_interval_id
    ref: billing_interval
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: lookup values are retired via is_active, never deleted
    index_exempt: low-cardinality lookup; never filtered alone; lookup rows are never deleted
  - name: fk_subscription_currency_id
    columns:
    - currency_id
    ref: currency
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: financial/history row must block deletion of its parent
  - name: fk_subscription_payment_method_token_id
    columns:
    - payment_method_token_id
    ref: payment_method_token
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: financial/history row must block deletion of its parent
- name: subscription_period
  kind: entity
  delete_policy: hard
  volume: medium
  tier: '1'
  milestones:
  - B38
  - B41
  - B47
  retention: Entitlement/billing history kept 8 years with the subscription; hard DELETE only for never-invoiced future 'scheduled' tail rows (cancellation).
  description: One contiguous billing/entitlement period [period_start_date, period_end_date) of a licence. Non-overlap per licence via P1 CHAIN_FK (see notes).
  columns:
  - name: subscription_id
    type: UUID
    domain: identifier
    desc: Owning subscription.
    sens: Internal
  - name: licence_id
    type: UUID
    domain: identifier
    desc: Denormalised licence (must equal the subscription's; enforced by composite FK) - the chain key.
    sens: Internal
  - name: sequence_no
    type: INT4
    domain: quantity
    desc: 1-based position of the period in the licence's chain.
    sens: Internal
  - name: period_start_date
    type: DATE
    domain: date
    desc: Inclusive first day of the period.
    sens: Internal
  - name: period_end_date
    type: DATE
    domain: date
    desc: EXCLUSIVE end (= renewal date); the next period starts on or after this date.
    sens: Internal
  - name: prior_period_id
    type: UUID
    domain: identifier
    desc: Predecessor period in the same licence chain.
    sens: Internal
    'null': true
    null_why: NULL only for the first period of a licence.
  - name: prior_period_end_date
    type: DATE
    domain: date
    desc: Copy of the predecessor's period_end_date, FK-pinned so the predecessor's end cannot move while a successor exists.
    sens: Internal
    'null': true
    null_why: NULL only for the first period (same as prior_period_id).
  - name: subscription_period_status_id
    type: UUID
    domain: enum_ref
    desc: scheduled/active/completed/cancelled.
    sens: Internal
  - name: plan_version_id
    type: UUID
    domain: identifier
    desc: Plan version in force for this period.
    sens: Internal
  - name: billed_amount
    type: DECIMAL(18,4)
    domain: money
    desc: Tax-exclusive amount billed for the period.
    sens: Internal
  - name: currency_id
    type: UUID
    domain: identifier
    desc: Currency of billed_amount.
    sens: Internal
  - name: invoice_id
    type: UUID
    domain: identifier
    desc: Invoice that billed this period.
    sens: Internal
    'null': true
    null_why: NULL until invoiced (scheduled/trial/free periods).
  - name: original_period_end_date
    type: DATE
    domain: date
    desc: End date before an early-cancellation shortening.
    sens: Internal
    'null': true
    null_why: NULL = never shortened.
  - name: shortened_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Instant the tail period was shortened/cancelled early.
    sens: Internal
    'null': true
    null_why: NULL = never shortened.
  constraints:
  - name: uq_subscription_period_id_period_end_date
    type: unique
    columns:
    - id
    - period_end_date
    desc: Non-partial unique required as composite-FK target (D-12 P1 / D-19).
  - name: uq_subscription_period_id_licence_end
    type: unique
    columns:
    - id
    - licence_id
    - period_end_date
    desc: 'Stronger FK target: also pins the licence so a chain can never hop licences.'
  - name: uq_subscription_period_prior_period_id
    type: unique
    columns:
    - prior_period_id
    desc: A period has at most one successor (no branching); NULLs distinct.
  - name: uq_subscription_period_licence_id_sequence_no
    type: unique
    columns:
    - licence_id
    - sequence_no
    desc: Chain position unique per licence.
  - name: ck_subscription_period_dates
    type: check
    expr: period_start_date <= period_end_date
    desc: End not before start (zero length = cancelled before it began).
  - name: ck_subscription_period_chain_pair
    type: check
    expr: (prior_period_id IS NULL) = (prior_period_end_date IS NULL)
    desc: Predecessor id and end date are both set or both NULL.
  - name: ck_subscription_period_chain_first
    type: check
    expr: (sequence_no = 1) = (prior_period_id IS NULL)
    desc: Only sequence 1 is the root.
  - name: ck_subscription_period_no_overlap_prior
    type: check
    expr: prior_period_end_date IS NULL OR period_start_date >= prior_period_end_date
    desc: Starts at/after predecessor's end (core non-overlap).
  - name: ck_subscription_period_not_self_prior
    type: check
    expr: prior_period_id IS NULL OR prior_period_id <> id
    desc: No self loop.
  - name: ck_subscription_period_shorten_pair
    type: check
    expr: (original_period_end_date IS NULL) = (shortened_at IS NULL) AND (original_period_end_date IS NULL OR original_period_end_date >= period_end_date)
    desc: Shortening only ever moves the end earlier and is recorded.
  - name: ck_subscription_period_amount_nonneg
    type: check
    expr: billed_amount >= 0
    desc: No negative billing.
  indexes:
  - name: uq_subscription_period_licence_id_first
    columns:
    - licence_id
    desc: Exactly one first period per licence (chain root).
    unique: true
    where: prior_period_id IS NULL
  - name: idx_subscription_period_subscription_id_start
    columns:
    - subscription_id
    - period_start_date DESC
    desc: Periods of a subscription, newest first.
  - name: idx_subscription_period_period_end_date
    columns:
    - period_end_date
    desc: 'Renewal job: periods ending soon.'
  - name: idx_subscription_period_plan_version_id
    columns:
    - plan_version_id
    desc: FK leading index (parent lookups / delete checks)
  - name: idx_subscription_period_currency_id
    columns:
    - currency_id
    desc: FK leading index (parent lookups / delete checks)
  - name: idx_subscription_period_invoice_id
    columns:
    - invoice_id
    desc: FK leading index (parent lookups / delete checks)
    where: invoice_id IS NOT NULL
  fks:
  - name: fk_subscription_period_subscription_id
    columns:
    - subscription_id
    ref: subscription
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: financial/history row must block deletion of its parent
  - name: fk_subscription_period_licence_id
    columns:
    - licence_id
    ref: licence
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: financial/history row must block deletion of its parent
  - name: fk_subscription_period_subscription_period_status_id
    columns:
    - subscription_period_status_id
    ref: subscription_period_status
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: lookup values are retired via is_active, never deleted
    index_exempt: low-cardinality lookup; never filtered alone; lookup rows are never deleted
  - name: fk_subscription_period_plan_version_id
    columns:
    - plan_version_id
    ref: plan_version
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: financial/history row must block deletion of its parent
  - name: fk_subscription_period_currency_id
    columns:
    - currency_id
    ref: currency
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: financial/history row must block deletion of its parent
  - name: fk_subscription_period_invoice_id
    columns:
    - invoice_id
    ref: invoice
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: financial/history row must block deletion of its parent
  - name: fk_subscription_period_prior_period
    columns:
    - prior_period_id
    - licence_id
    - prior_period_end_date
    ref: subscription_period
    ref_columns:
    - id
    - licence_id
    - period_end_date
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'P1 CHAIN_FK: MATCH SIMPLE skips the check on the first period (NULLs); ON UPDATE RESTRICT freezes the predecessor''s period_end_date while a successor exists.'
  - name: fk_subscription_period_subscription_licence
    columns:
    - subscription_id
    - licence_id
    ref: subscription
    ref_columns:
    - id
    - licence_id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: Period's licence must equal its subscription's licence.
