  - name: fk_candidate_profile_completion_snapshot_profile_strength_id
    columns:
    - profile_strength_id
    ref: profile_strength
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'Reference to profile_strength: parent cannot be deleted while referenced (soft-delete/retire instead).'
    index_exempt: low-cardinality lookup; never navigated from the lookup side, RESTRICT check is a point read on the lookup PK
  ttl:
    expire_after: 18 months
    column: computed_at
- name: candidate_profile_view
  kind: event
  delete_policy: append_only
  volume: very_high
  tier: '2'
  milestones: *id001
  retention: Append-only (INSERT/SELECT grants only). Row-level TTL purges rows 24 months after viewed_at; the credit deduction itself lives permanently in wallet_ledger_entry. Candidate erasure keeps rows
    (they reference the anonymised tombstone; ip_address is NULLed).
  description: 'Append-only history of which employer/recruiter viewed which candidate profile, from where, and under which credit deduction (docket Rule 10: actor, subject, timestamp, deduction).'
  columns:
  - name: candidate_profile_id
    type: UUID
    domain: identifier
    desc: Viewed candidate (subject).
    sens: Internal
  - name: viewer_app_user_id
    type: UUID
    domain: identifier
    desc: Recruiter/employer user who viewed (actor).
    sens: Personal
    'null': true
    null_why: NULL for system/service viewers (e.g. sourcing batch, API integration).
    pii: 'Personal: access-controlled and audited; owner and entitled recruiters only; anonymised in place on erasure'
  - name: viewer_organisation_id
    type: UUID
    domain: identifier
    desc: Tenant on whose behalf the view happened.
    sens: Internal
    'null': true
    null_why: NULL for platform staff / individual viewers.
  - name: view_source_id
    type: UUID
    domain: enum_ref
    desc: Search, job application, recommended, outreach...
    sens: Internal
  - name: job_requirement_id
    type: UUID
    domain: identifier
    desc: Job context of the view.
    sens: Internal
    'null': true
    null_why: NULL = no job context (open search).
  - name: wallet_ledger_entry_id
    type: UUID
    domain: identifier
    desc: Credit deduction ledger entry for this view.
    sens: Internal
    'null': true
    null_why: NULL = free view (no credit deducted).
  - name: viewed_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: When the profile was viewed (UTC).
    sens: Internal
    default: now()
  - name: is_contact_revealed
    type: BOOL
    domain: boolean
    desc: Phone/email were revealed in this view.
    sens: Internal
    default: 'false'
  - name: is_viewer_anonymous
    type: BOOL
    domain: boolean
    desc: Viewer chose to appear anonymously to the candidate (still recorded for audit).
    sens: Internal
    default: 'false'
  - name: dwell_seconds
    type: INT4
    domain: quantity
    desc: Time spent on the profile.
    sens: Internal
    'null': true
    null_why: NULL = not measured.
  - name: search_session_ref
    type: STRING(64)
    domain: free_text
    desc: Correlation id of the search session in the search service (external).
    sens: Internal
    'null': true
    null_why: NULL = not from search.
  - name: client_ip
    type: INET
    domain: ip_address
    desc: Viewer IP address.
    sens: Personal
    'null': true
    null_why: NULL after erasure/minimisation.
    pii: 'Personal: access-controlled; NULLed after 90 days by minimisation job.'
  constraints:
  - name: ck_candidate_profile_view_dwell_nonneg
    type: check
    expr: dwell_seconds IS NULL OR dwell_seconds >= 0
    desc: Non-negative duration.
  indexes:
  - name: uq_candidate_profile_view_wallet_ledger_entry_id
    columns:
    - wallet_ledger_entry_id
    unique: true
    where: wallet_ledger_entry_id IS NOT NULL
    desc: One credit deduction pays for at most one view.
  - name: idx_candidate_profile_view_candidate_profile_id_viewed_at
    columns:
    - candidate_profile_id
    - viewed_at DESC
    desc: '''Who viewed my profile'' feed.'
  - name: idx_candidate_profile_view_viewer_organisation_id_viewed_at
    columns:
    - viewer_organisation_id
    - viewed_at DESC
    desc: Tenant view history and credit-usage reports.
    where: viewer_organisation_id IS NOT NULL
  - name: idx_candidate_profile_view_viewer_app_user_id_viewed_at
    columns:
    - viewer_app_user_id
    - viewed_at DESC
    desc: Viewer activity audit.
    where: viewer_app_user_id IS NOT NULL
  - name: idx_candidate_profile_view_viewed_at
    columns:
    - viewed_at
    desc: Time-ordered scans (analytics ETL, TTL job); hash-sharded to avoid a sequential-key hot range.
    hash: true
    bucket_count: 32
  - name: idx_candidate_profile_view_job_requirement_id
    columns:
    - job_requirement_id
    desc: Views by job.
    where: job_requirement_id IS NOT NULL
  fks:
  - name: fk_candidate_profile_view_candidate_profile_id
    columns:
    - candidate_profile_id
    ref: candidate_profile
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'Reference to candidate_profile: parent cannot be deleted while referenced (soft-delete/retire instead).'
  - name: fk_candidate_profile_view_viewer_app_user_id
    columns:
    - viewer_app_user_id
    ref: app_user
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'Reference to app_user: parent cannot be deleted while referenced (soft-delete/retire instead).'
  - name: fk_candidate_profile_view_viewer_organisation_id
    columns:
    - viewer_organisation_id
    ref: organisation
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'Reference to organisation: parent cannot be deleted while referenced (soft-delete/retire instead).'
  - name: fk_candidate_profile_view_view_source_id
    columns:
    - view_source_id
    ref: view_source
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'Reference to view_source: parent cannot be deleted while referenced (soft-delete/retire instead).'
    index_exempt: low-cardinality lookup; never navigated from the lookup side, RESTRICT check is a point read on the lookup PK
  - name: fk_candidate_profile_view_job_requirement_id
    columns:
    - job_requirement_id
    ref: job_requirement
    ref_columns:
    - id
    on_delete: SET NULL
    on_update: RESTRICT
    desc: 'Optional context link to job_requirement: cleared if the parent is physically removed.'
  - name: fk_candidate_profile_view_wallet_ledger_entry_id
    columns:
    - wallet_ledger_entry_id
    ref: wallet_ledger_entry
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'Reference to wallet_ledger_entry: parent cannot be deleted while referenced (soft-delete/retire instead).'
  ttl:
    expire_after: 24 months
    column: viewed_at
- name: candidate_activity_log
