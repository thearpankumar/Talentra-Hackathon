  constraints:
  - name: ck_profile_completion_rule_weight_range
    type: check
    expr: weight BETWEEN 0 AND 100
    desc: Percentage range.
  - name: ck_profile_completion_rule_window
    type: check
    expr: valid_to IS NULL OR valid_to >= valid_from
    desc: End not before start.
  - name: ck_profile_completion_rule_target_present
    type: check
    expr: profile_section_type_id IS NOT NULL OR profile_field_code IS NOT NULL
    desc: Rule targets a section or a field.
  - name: ck_profile_completion_rule_min_items_pos
    type: check
    expr: min_item_count > 0
    desc: Positive minimum.
  indexes:
  - name: uq_profile_completion_rule_rule_set_version_rule_code
    columns:
    - rule_set_version
    - rule_code
    unique: true
    where: deleted_at IS NULL
    desc: Rule codes unique within a version.
  fks:
  - name: fk_profile_completion_rule_profile_section_type_id
    columns:
    - profile_section_type_id
    ref: profile_section_type
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'Reference to profile_section_type: parent cannot be deleted while referenced (soft-delete/retire instead).'
    index_exempt: low-cardinality lookup; never navigated from the lookup side, RESTRICT check is a point read on the lookup PK
- name: candidate_profile_completion_snapshot
  kind: snapshot
  delete_policy: append_only
  volume: very_high
  tier: '2'
  milestones:
  - B4
  - B12
  - B16
  retention: TTL 18 months (row-level TTL); latest score stays on candidate_profile; erased with the profile.
  description: History of computed completeness scores with per-rule breakdown (append-only).
  columns:
  - name: candidate_profile_id
    type: UUID
    domain: identifier
    desc: Owning candidate_profile.
    sens: Internal
  - name: rule_set_version
    type: INT4
    domain: quantity
    desc: Rule set used.
    sens: Internal
  - name: score
    type: DECIMAL(5,2)
    domain: percentage
    desc: Completeness 0..100.
    sens: Internal
  - name: profile_strength_id
    type: UUID
    domain: enum_ref
    desc: Strength band at the time.
    sens: Internal
  - name: breakdown
    type: JSONB
    domain: json
    desc: 'Per-rule points {rule_code: points} and missing rules.'
