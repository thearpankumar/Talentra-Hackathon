    where: completed_at IS NULL AND scheduled_date IS NOT NULL
  fks:
  - name: fk_candidate_erasure_request_candidate_profile_id
    columns:
    - candidate_profile_id
    ref: candidate_profile
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'Reference to candidate_profile: parent cannot be deleted while referenced (soft-delete/retire instead).'
  - name: fk_candidate_erasure_request_erasure_trigger_id
    columns:
    - erasure_trigger_id
    ref: erasure_trigger
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'Reference to erasure_trigger: parent cannot be deleted while referenced (soft-delete/retire instead).'
    index_exempt: low-cardinality lookup; never navigated from the lookup side, RESTRICT check is a point read on the lookup PK
  - name: fk_candidate_erasure_request_erasure_request_status_id
    columns:
    - erasure_request_status_id
    ref: erasure_request_status
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'Reference to erasure_request_status: parent cannot be deleted while referenced (soft-delete/retire instead).'
    index_exempt: low-cardinality lookup; never navigated from the lookup side, RESTRICT check is a point read on the lookup PK
  no_hash_why: Low-rate compliance table.
views:
- name: vw_candidate_profile_recruiter
  kind: view
  tables:
  - candidate_profile
  - salary_disclosure
  - candidate_experience
  purpose: 'Recruiter-facing profile card: hides birth_date, masks salaries unless disclosed and contact unless is_contact_visible_to_recruiters.'
  security: Recruiter roles get SELECT on the view only; base table column privileges revoked.
  sql_sketch: SELECT p.id, p.display_name, p.headline, CASE WHEN d.code='disclosed' THEN p.current_salary_amount END AS current_salary_amount, CASE WHEN p.is_contact_visible_to_recruiters THEN p.contact_email
    END AS contact_email FROM candidate_profile p JOIN salary_disclosure d ON d.id=p.current_salary_disclosure_id WHERE p.deleted_at IS NULL AND p.is_searchable
- name: vw_candidate_search_document
  kind: view
  tables:
  - candidate_profile
  - candidate_skill
  - candidate_experience
  - candidate_education
  purpose: Denormalised document per searchable candidate consumed by the search-service changefeed (D-16).
  security: Service account only.
  sql_sketch: SELECT p.id, p.headline, p.current_city_id, array_agg(s.skill_id) AS skill_ids FROM candidate_profile p LEFT JOIN candidate_skill s ON s.candidate_profile_id=p.id AND s.deleted_at IS NULL
    WHERE p.is_searchable AND p.deleted_at IS NULL GROUP BY p.id
business_rules:
- id: BR-PRF-01
  rule: A user has exactly one candidate profile.
  mechanism_type: UNIQUE
  mechanism: UNIQUE constraint uq_candidate_profile_app_user_id on candidate_profile(app_user_id), non-partial so an anonymised tombstone still occupies the slot.
  tables:
  - candidate_profile
  milestone: B20
- id: BR-PRF-02
  rule: Phone numbers are E.164 with a country; emails lowercase.
  mechanism_type: CHECK
  mechanism: CHECK contact_phone ~ '^\+[1-9][0-9]{6,14}$', (phone IS NULL)=(phone_country_id IS NULL), email = lower(email) on candidate_profile, candidate_contact_phone, candidate_contact_email, referral.
  tables:
  - candidate_profile
  - candidate_contact_phone
  - candidate_contact_email
  - referral
  milestone: B20
- id: BR-PRF-03
  rule: At most one primary phone, email, current address and photo per candidate.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: Unique indexes ... (candidate_profile_id) WHERE is_primary / WHERE is_current / WHERE is_profile_photo on the respective tables.
  tables:
  - candidate_contact_phone
  - candidate_contact_email
  - candidate_address
  - candidate_media_file
  milestone: B20
- id: BR-PRF-04
  rule: candidate_profile.contact_phone/contact_email mirror the primary multi-value row.
  mechanism_type: TXN_LOCK
  mechanism: 'Same transaction: SELECT candidate_profile ... FOR UPDATE, flip is_primary rows, UPDATE the mirror; nightly JOB compares mirror vs primary and repairs drift.'
  tables:
  - candidate_profile
  - candidate_contact_phone
  - candidate_contact_email
  milestone: B20
- id: BR-PRF-05
  rule: Expected minimum salary never exceeds maximum; salaries are non-negative; amounts need currency and period.
  mechanism_type: CHECK
  mechanism: ck_candidate_profile_salary_min_max, _salary_nonneg, _salary_currency.
  tables:
  - candidate_profile
  milestone: B20
- id: BR-PRF-06
  rule: Undisclosed salary is never shown or treated as zero.
  mechanism_type: VIEW
  mechanism: vw_candidate_profile_recruiter returns amounts only when salary_disclosure.code = 'disclosed' (CASE ... END); recruiter roles have no SELECT on the base table's salary columns (column-level
    GRANT).
  tables:
  - candidate_profile
  milestone: B20
- id: BR-PRF-07
  rule: 'Date ranges: end not before start; ongoing/current items have no end date.'
  mechanism_type: CHECK
  mechanism: CHECK end_date >= start_date and NOT is_current/is_ongoing OR end_date IS NULL on education, experience, project, volunteer, certification, patent, address, work_authorisation.
  tables:
  - candidate_education
  - candidate_experience
  - candidate_project
  - candidate_volunteer_experience
  - candidate_certification
  - candidate_patent
  - candidate_address
  - candidate_work_authorisation
  milestone: B20
- id: BR-PRF-08
  rule: A skill appears once per profile; an endorser endorses a skill once.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: uq_candidate_skill_candidate_profile_id_skill_id (WHERE deleted_at IS NULL); UNIQUE (candidate_skill_id, endorser_app_user_id).
  tables:
  - candidate_skill
  - candidate_skill_endorsement
  milestone: B20
- id: BR-PRF-09
  rule: Self-endorsement and self-recommendation are forbidden.
  mechanism_type: APP_LAYER
  mechanism: INSERT ... SELECT guarded by NOT EXISTS (candidate_profile.app_user_id = author/endorser) in the same txn; nightly JOB reports violations (cross-table, no declarative form in CockroachDB).
  tables:
  - candidate_skill_endorsement
  - candidate_recommendation
  milestone: B20
- id: BR-PRF-10
  rule: 'A project belongs to exactly one owner: candidate or gig worker; a gig assignment link requires a gig owner and yields one project.'
  mechanism_type: CHECK
  mechanism: ck_candidate_project_exactly_one_owner, ck_candidate_project_gig_link_needs_worker, partial UNIQUE on gig_assignment_id.
  tables:
  - candidate_project
  milestone: B20
- id: BR-PRF-11
  rule: Resume versions form a linear chain with unique version numbers.
  mechanism_type: CHAIN_FK
  mechanism: root_resume_id/parent_resume_id self-FKs (RESTRICT), CHECK version_chain, UNIQUE(root_resume_id, version_no), UNIQUE(parent_resume_id) so each version has one successor.
  tables:
  - resume
  milestone: B20
- id: BR-PRF-12
  rule: One default resume per candidate.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: uq_resume_candidate_profile_id_default ON resume(candidate_profile_id) WHERE is_default AND deleted_at IS NULL; switching default done in one txn.
  tables:
  - resume
  milestone: B20
- id: BR-PRF-13
  rule: Resume/media files are downloadable only after a clean virus scan.
  mechanism_type: APP_LAYER
  mechanism: Download service joins candidate_media_file.scan_status_id = 'clean'; pending/infected files are never served; index idx_candidate_media_file_scan_status_id_created_at drives the scan queue.
  tables:
  - candidate_media_file
  - resume
  milestone: B20
- id: BR-PRF-14
  rule: Raw national id numbers are never stored; one active profile per id.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: No id-number column exists; only vendor_token and id_number_hmac (keyed HMAC). Unique index (country_id, document_type_id, id_number_hmac) WHERE is_active_binding; UNIQUE request_idempotency_key.
  tables:
  - candidate_identity_verification
  milestone: B20
- id: BR-PRF-15
  rule: Profile view and activity history is append-only; a credit deduction pays for one view.
  mechanism_type: PRIVILEGE
  mechanism: App role has INSERT/SELECT only on candidate_profile_view, candidate_activity_log, candidate_shortlist_history, candidate_profile_completion_snapshot; TTL job (system role) is the only deleter;
    UNIQUE (wallet_ledger_entry_id) WHERE NOT NULL.
  tables:
  - candidate_profile_view
  - candidate_activity_log
  - candidate_shortlist_history
  - candidate_profile_completion_snapshot
  milestone: B20
- id: BR-PRF-16
  rule: View/activity/shortlist history expires after its retention period.
  mechanism_type: TTL
  mechanism: 'Row-level TTL: ttl_expiration_expression on viewed_at (24 months), occurred_at (24 months / 36 months), computed_at (18 months); leaf tables only (inbound FKs would block TTL deletes).'
  tables:
  - candidate_profile_view
  - candidate_activity_log
  - candidate_shortlist_history
  - candidate_profile_completion_snapshot
  milestone: B20
- id: BR-PRF-17
  rule: A saved candidate is unique per tenant (general) and per tenant+job; folders belong to the same tenant.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: Two partial unique indexes on candidate_shortlist_item (job_requirement_id IS NULL / IS NOT NULL) + composite FK (organisation_id, candidate_shortlist_folder_id) -> candidate_shortlist_folder(organisation_id,
    id).
  tables:
  - candidate_shortlist_item
  - candidate_shortlist_folder
  milestone: B20
- id: BR-PRF-18
  rule: Every shortlist change leaves a history row in the same transaction.
  mechanism_type: TXN_LOCK
  mechanism: 'Txn: SELECT item FOR UPDATE; UPDATE/soft-delete item; INSERT candidate_shortlist_history; commit. Re-adding after removal restores the soft-deleted row (action restored).'
  tables:
  - candidate_shortlist_item
  - candidate_shortlist_history
  milestone: B21
- id: BR-PRF-19
  rule: Completion rule weights of one rule-set version sum to 100.
  mechanism_type: JOB
  mechanism: Publishing job validates SUM(weight)=100 per rule_set_version inside a SERIALIZABLE txn before rules become valid (valid_to/valid_from); UNIQUE (rule_set_version, rule_code).
  tables:
  - profile_completion_rule
  milestone: B20
- id: BR-PRF-20
  rule: Completeness is a percentage 0..100 and the band follows the score.
  mechanism_type: CHECK
  mechanism: ck_candidate_profile_completeness_range, ck_candidate_profile_completion_snapshot_score_range; profile_strength set by the scoring job.
  tables:
  - candidate_profile
  - candidate_profile_completion_snapshot
  milestone: B20
- id: BR-PRF-21
  rule: Assessment attempt numbering is unique; score present iff graded; pass mark within scale.
  mechanism_type: CHECK
  mechanism: UNIQUE(candidate_profile_id, assessment_id, attempt_no); ck_assessment_attempt_score_when_graded, ck_assessment_scores.
  tables:
  - assessment_attempt
  - assessment
  milestone: B20
- id: BR-PRF-22
  rule: A candidate has one enrolment per course; provider sync is idempotent.
  mechanism_type: UNIQUE
  mechanism: UNIQUE(candidate_profile_id, course_id) WHERE deleted_at IS NULL; partial UNIQUE external_enrolment_ref.
  tables:
  - course_enrolment
  milestone: B20
- id: BR-PRF-23
  rule: No self-referral; one referrer per referee; referral codes unique.
  mechanism_type: CHECK
  mechanism: ck_referral_not_self; partial UNIQUE (referee_app_user_id); partial UNIQUE (referral_code).
  tables:
  - referral
  milestone: B20
- id: BR-PRF-24
  rule: A referral reward is granted once (idempotent) and backed by one ledger entry.
  mechanism_type: UNIQUE
  mechanism: UNIQUE idempotency_key; UNIQUE (referral_id, beneficiary_app_user_id, reward_type_id); partial UNIQUE (wallet_ledger_entry_id). Grant txn locks the wallet row FOR UPDATE (D-14).
  tables:
  - referral_reward
  milestone: B20
- id: BR-PRF-25
  rule: A recommendation is unique per author and recipient.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: unique index on (candidate_profile_id, author_app_user_id) WHERE deleted_at IS NULL.
  tables:
  - candidate_recommendation
  milestone: B20
- id: BR-PRF-26
  rule: A follow targets exactly one of company or person, once.
  mechanism_type: CHECK
  mechanism: ck_candidate_follow_exactly_one_target + two partial UNIQUE indexes.
  tables:
  - candidate_follow
  milestone: B20
- id: BR-PRF-27
  rule: At most one open open-to-work signal per candidate.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: uq_candidate_open_to_work_signal_candidate_profile_id_open WHERE valid_to IS NULL; closing sets valid_to, new signal inserts a new row.
  tables:
  - candidate_open_to_work_signal
  milestone: B20
- id: BR-PRF-28
  rule: Imports are idempotent and legacy records map to one profile.
  mechanism_type: UNIQUE
  mechanism: UNIQUE (candidate_profile_id, import_source_id, payload_sha256); partial UNIQUE candidate_profile.legacy_candidate_ref.
  tables:
  - profile_import
  - candidate_profile
  milestone: B20
- id: BR-PRF-29
  rule: Special-category declarations require a consent record and are never used for ranking.
  mechanism_type: FK
  mechanism: candidate_diversity_declaration.user_consent_id NOT NULL FK + UNIQUE; consent withdrawal job hard-deletes the row; column privileges restrict reads to the owner and compliance role.
  tables:
  - candidate_diversity_declaration
  milestone: B20
- id: BR-PRF-30
  rule: Erasure = anonymise in place; inactivity purge after 36 months.
  mechanism_type: JOB
  mechanism: 'Daily job reads candidate_erasure_request (scheduled_date <= today, no legal hold): NULL/overwrite PII columns in one SERIALIZABLE txn per profile, delete hard child rows, set anonymised_at+deleted_at,
    write result_counts. Inactivity job opens requests for last_active_at < now() - interval ''36 months'' after 30-day warning.'
  tables:
  - candidate_erasure_request
  - candidate_profile
  milestone: B21
- id: BR-PRF-31
  rule: Only one open erasure request per profile.
  mechanism_type: PARTIAL_UNIQUE
  mechanism: partial unique index on candidate_profile_id WHERE completed_at IS NULL AND deleted_at IS NULL.
  tables:
  - candidate_erasure_request
  milestone: B20
- id: BR-PRF-32
  rule: Preference rows are unique per candidate and value.
  mechanism_type: UNIQUE
  mechanism: UNIQUE (candidate_profile_id, <value>_id) on the five candidate_preferred_* tables; UNIQUE candidate_job_preference(candidate_profile_id).
  tables:
  - candidate_preferred_location
  - candidate_preferred_role
  - candidate_preferred_industry
  - candidate_preferred_employment_type
  - candidate_preferred_work_type
  - candidate_job_preference
  milestone: B20
- id: BR-PRF-33
  rule: Languages unique per candidate; section configuration unique per section.
  mechanism_type: UNIQUE
  mechanism: UNIQUE (candidate_profile_id, language_id); UNIQUE (candidate_profile_id, profile_section_type_id).
  tables:
  - candidate_language
  - candidate_profile_section
  milestone: B20
