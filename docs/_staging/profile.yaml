- name: candidate_project
  kind: entity
  delete_policy: soft
  volume: high
  tier: '1'
  milestones: *id001
  retention: Erased on verified erasure request (anonymise-in-place within 30 days, unless legal hold) and after 36 months of candidate inactivity (inactivity_purge job, 30-day warning notification first).
    Soft-deleted rows are hard-purged 90 days after deleted_at.
  description: 'Profile projects of candidates AND gig workers (Tier 1 ''Profile projects'': role, duration, outcome). One table with a nullable owner pair (candidate_profile_id XOR gig_worker_profile_id)
    enforced by CHECK; completed gig assignments can be linked for verified projects.'
  columns:
  - name: candidate_profile_id
    type: UUID
    domain: identifier
    desc: Owning candidate_profile.
    sens: Internal
    'null': true
    null_why: NULL when the project belongs to a gig worker (gig_worker_profile_id set); exactly one owner is enforced by CHECK.
  - name: gig_worker_profile_id
    type: UUID
    domain: identifier
    desc: Gig worker owning a gig project.
    sens: Internal
    'null': true
    null_why: NULL when the project belongs to a candidate profile.
  - name: gig_assignment_id
    type: UUID
    domain: identifier
    desc: Completed gig assignment that evidences this project.
    sens: Internal
    'null': true
    null_why: NULL = self-reported / not gig-evidenced.
  - name: candidate_experience_id
    type: UUID
    domain: identifier
    desc: Job during which the project was done.
    sens: Internal
    'null': true
    null_why: NULL = personal/academic/freelance project.
  - name: project_origin_id
    type: UUID
    domain: enum_ref
    desc: Self-reported, gig assignment, platform job...
    sens: Internal
  - name: title
    type: STRING(200)
    domain: free_text
    desc: Project title.
    sens: Internal
  - name: role_title
    type: STRING(150)
    domain: free_text
    desc: Candidate's role in the project.
    sens: Internal
  - name: client_name
    type: STRING(200)
    domain: free_text
    desc: Client or sponsor.
    sens: Internal
    'null': true
    null_why: NULL = internal/personal project.
  - name: description
    type: STRING(2000)
    domain: free_text
    desc: What the project was.
    sens: Personal
    'null': true
    null_why: NULL = none.
    pii: 'Personal: access-controlled and audited; owner and entitled recruiters only; anonymised in place on erasure'
  - name: outcome
    type: STRING(1000)
    domain: free_text
    desc: Result / impact achieved.
    sens: Internal
    'null': true
    null_why: NULL = not stated.
  - name: start_date
    type: DATE
    domain: date
    desc: Start date.
    sens: Internal
    'null': true
    null_why: NULL = unknown.
  - name: end_date
    type: DATE
    domain: date
    desc: End date.
    sens: Internal
    'null': true
    null_why: NULL = ongoing / open-ended.
  - name: is_ongoing
    type: BOOL
    domain: boolean
    desc: Project still running.
    sens: Internal
    default: 'false'
  - name: team_size
    type: INT2
    domain: quantity
    desc: Team size.
    sens: Internal
    'null': true
    null_why: NULL = unknown.
  - name: project_url
    type: STRING(500)
    domain: url
    desc: Public link to the work.
    sens: Internal
    'null': true
    null_why: NULL = none.
  - name: verification_status_id
    type: UUID
    domain: enum_ref
    desc: Verification state (gig-assignment-linked rows are system verified).
    sens: Internal
  - name: is_public
    type: BOOL
    domain: boolean
    desc: Visible on profile.
    sens: Internal
    default: 'true'
  constraints:
  - name: ck_candidate_project_exactly_one_owner
    type: check
    expr: (candidate_profile_id IS NOT NULL) <> (gig_worker_profile_id IS NOT NULL)
    desc: Project belongs to exactly one of candidate or gig worker.
  - name: ck_candidate_project_gig_link_needs_worker
    type: check
    expr: gig_assignment_id IS NULL OR gig_worker_profile_id IS NOT NULL
    desc: A gig assignment link requires a gig-worker owner.
  - name: ck_candidate_project_dates
    type: check
    expr: end_date IS NULL OR start_date IS NULL OR end_date >= start_date
    desc: End not before start.
  - name: ck_candidate_project_ongoing
    type: check
    expr: NOT is_ongoing OR end_date IS NULL
    desc: Ongoing project has no end date.
  - name: ck_candidate_project_team_size_pos
    type: check
    expr: team_size IS NULL OR team_size > 0
    desc: Positive team size.
  indexes:
  - name: idx_candidate_project_candidate_profile_id
    columns:
    - candidate_profile_id
    desc: Candidate's projects.
    where: candidate_profile_id IS NOT NULL AND deleted_at IS NULL
  - name: idx_candidate_project_gig_worker_profile_id
    columns:
    - gig_worker_profile_id
    desc: Gig worker's projects.
    where: gig_worker_profile_id IS NOT NULL AND deleted_at IS NULL
  - name: uq_candidate_project_gig_assignment_id
    columns:
    - gig_assignment_id
    unique: true
    where: deleted_at IS NULL AND (gig_assignment_id IS NOT NULL)
    desc: A gig assignment yields at most one project.
  - name: idx_candidate_project_candidate_experience_id
    columns:
    - candidate_experience_id
    desc: Projects of a job.
    where: candidate_experience_id IS NOT NULL
  fks:
  - name: fk_candidate_project_candidate_profile_id
    columns:
    - candidate_profile_id
    ref: candidate_profile
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: 'Dependent row of candidate_profile: removed with its parent.'
  - name: fk_candidate_project_gig_worker_profile_id
    columns:
    - gig_worker_profile_id
    ref: gig_worker_profile
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: 'Dependent row of gig_worker_profile: removed with its parent.'
  - name: fk_candidate_project_gig_assignment_id
    columns:
    - gig_assignment_id
    ref: gig_assignment
    ref_columns:
    - id
    on_delete: SET NULL
    on_update: RESTRICT
    desc: 'Optional context link to gig_assignment: cleared if the parent is physically removed.'
  - name: fk_candidate_project_candidate_experience_id
    columns:
    - candidate_experience_id
    ref: candidate_experience
    ref_columns:
    - id
    on_delete: SET NULL
    on_update: RESTRICT
    desc: 'Optional context link to candidate_experience: cleared if the parent is physically removed.'
  - name: fk_candidate_project_project_origin_id
    columns:
    - project_origin_id
    ref: project_origin
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'Reference to project_origin: parent cannot be deleted while referenced (soft-delete/retire instead).'
    index_exempt: low-cardinality lookup; never navigated from the lookup side, RESTRICT check is a point read on the lookup PK
  - name: fk_candidate_project_verification_status_id
    columns:
    - verification_status_id
    ref: verification_status
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'Reference to verification_status: parent cannot be deleted while referenced (soft-delete/retire instead).'
    index_exempt: low-cardinality lookup; never navigated from the lookup side, RESTRICT check is a point read on the lookup PK
