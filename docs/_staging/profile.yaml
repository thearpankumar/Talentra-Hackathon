- name: resume
  kind: entity
  delete_policy: soft
  volume: very_high
  tier: '1'
  milestones: *id001
  retention: Erased on verified erasure request (anonymise-in-place within 30 days, unless legal hold) and after 36 months of candidate inactivity (inactivity_purge job, 30-day warning notification first).
    Soft-deleted rows are hard-purged 90 days after deleted_at. Resume bodies are personal data and are cleared (body_text/content_json NULLed) on anonymisation.
  description: 'Resume versions of a candidate: uploaded file or built from a template, with version chain, default flag and searchable text.'
  columns:
  - name: candidate_profile_id
    type: UUID
    domain: identifier
    desc: Owning candidate_profile.
    sens: Internal
  - name: resume_template_id
    type: UUID
    domain: identifier
    desc: Template used by the builder.
    sens: Internal
    'null': true
    null_why: NULL = uploaded file / no template.
  - name: resume_format_id
    type: UUID
    domain: enum_ref
    desc: File or render format.
    sens: Internal
  - name: resume_origin_id
    type: UUID
    domain: enum_ref
    desc: Uploaded, built, generated...
    sens: Internal
  - name: candidate_media_file_id
    type: UUID
    domain: identifier
    desc: Stored file of this resume.
    sens: Internal
    'null': true
    null_why: NULL = built in app and not yet rendered to a file.
  - name: root_resume_id
    type: UUID
    domain: identifier
    desc: First version of this resume lineage.
    sens: Internal
    'null': true
    null_why: NULL = this row is the first version.
  - name: parent_resume_id
    type: UUID
    domain: identifier
    desc: Version this one was derived from.
    sens: Internal
    'null': true
    null_why: NULL = first version.
  - name: version_no
    type: INT4
    domain: quantity
    desc: 1 for the first version, 2.. for later ones in the same lineage.
    sens: Internal
    default: '1'
  - name: title
    type: STRING(150)
    domain: free_text
    desc: Name the candidate gives the resume (e.g. 'Data roles').
    sens: Internal
  - name: language_id
    type: UUID
    domain: identifier
    desc: Language the resume is written in.
    sens: Internal
    'null': true
    null_why: NULL = not detected.
  - name: body_text
    type: STRING
    domain: long_text
    desc: Plain text extracted from the resume for search and parsing.
    sens: Personal
    'null': true
    null_why: NULL = no text extracted (yet).
    pii: Contains full CV PII; encrypted at rest at storage layer (D-17); never logged; recruiter access via credit-gated download only.
    unbounded_why: Resume bodies are explicitly allowed unbounded text by Rule 3; length driven by user content (typically 5-50 KB).
  - name: content_json
    type: JSONB
    domain: json
    desc: Structured builder content (sections, bullets) when built in app.
    sens: Personal
    'null': true
    null_why: NULL = file-based resume.
    pii: Same PII as body_text; encrypted at rest.
  - name: page_count
    type: INT2
    domain: quantity
    desc: Pages when rendered.
    sens: Internal
    'null': true
    null_why: NULL = unknown.
  - name: is_default
    type: BOOL
    domain: boolean
    desc: Resume shown/sent by default.
    sens: Internal
    default: 'false'
  - name: is_visible_to_recruiters
    type: BOOL
    domain: boolean
    desc: Recruiters may download/see this resume.
    sens: Internal
    default: 'true'
  - name: last_rendered_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Last time a file was rendered from content_json.
    sens: Internal
    'null': true
    null_why: NULL = never rendered / uploaded file.
  constraints:
  - name: ck_resume_version_chain
    type: check
    expr: (root_resume_id IS NULL AND parent_resume_id IS NULL AND version_no = 1) OR (root_resume_id IS NOT NULL AND parent_resume_id IS NOT NULL AND version_no > 1)
    desc: First version has no ancestors; later versions have both pointers and version_no > 1.
  - name: ck_resume_has_content
    type: check
    expr: candidate_media_file_id IS NOT NULL OR content_json IS NOT NULL OR body_text IS NOT NULL
    desc: A resume has a file or content.
  indexes:
  - name: uq_resume_root_resume_id_version_no
    columns:
    - root_resume_id
    - version_no
    unique: true
    where: deleted_at IS NULL AND (root_resume_id IS NOT NULL)
    desc: Version numbers are unique within a lineage.
  - name: uq_resume_parent_resume_id
    columns:
    - parent_resume_id
    unique: true
    where: deleted_at IS NULL AND (parent_resume_id IS NOT NULL)
    desc: A version has at most one successor (linear history).
  - name: uq_resume_candidate_profile_id_default
    columns:
    - candidate_profile_id
    unique: true
    where: deleted_at IS NULL AND (is_default)
    desc: One default resume per candidate.
  - name: idx_resume_candidate_profile_id_created_at
    columns:
    - candidate_profile_id
    - created_at DESC
    desc: Resume list newest first.
    where: deleted_at IS NULL
  - name: idx_resume_resume_template_id
    columns:
    - resume_template_id
    desc: Template usage statistics.
    where: resume_template_id IS NOT NULL
  - name: idx_resume_candidate_media_file_id
    columns:
    - candidate_media_file_id
    desc: 'Leading index for FK fk_resume_candidate_media_file_id: child lookups by parent and parent-side RESTRICT/CASCADE checks.'
  - name: idx_resume_language_id
    columns:
    - language_id
    desc: 'Leading index for FK fk_resume_language_id: child lookups by parent and parent-side RESTRICT/CASCADE checks.'
  fks:
  - name: fk_resume_candidate_profile_id
    columns:
    - candidate_profile_id
    ref: candidate_profile
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: 'Dependent row of candidate_profile: removed with its parent.'
  - name: fk_resume_resume_template_id
    columns:
    - resume_template_id
    ref: resume_template
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'Reference to resume_template: parent cannot be deleted while referenced (soft-delete/retire instead).'
  - name: fk_resume_resume_format_id
    columns:
    - resume_format_id
    ref: resume_format
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'Reference to resume_format: parent cannot be deleted while referenced (soft-delete/retire instead).'
    index_exempt: low-cardinality lookup; never navigated from the lookup side, RESTRICT check is a point read on the lookup PK
  - name: fk_resume_resume_origin_id
    columns:
    - resume_origin_id
    ref: resume_origin
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'Reference to resume_origin: parent cannot be deleted while referenced (soft-delete/retire instead).'
    index_exempt: low-cardinality lookup; never navigated from the lookup side, RESTRICT check is a point read on the lookup PK
  - name: fk_resume_candidate_media_file_id
    columns:
    - candidate_media_file_id
