  retention: Erased on verified erasure request (anonymise-in-place within 30 days, unless legal hold) and after 36 months of candidate inactivity (inactivity_purge job, 30-day warning notification first).
    Soft-deleted rows are hard-purged 90 days after deleted_at.
  description: A candidate's attempt at an assessment with score, percentile, outcome and proctoring flags; verified skills link back here.
  columns:
  - name: candidate_profile_id
    type: UUID
    domain: identifier
    desc: Owning candidate_profile.
    sens: Internal
  - name: assessment_id
    type: UUID
    domain: identifier
    desc: Assessment taken.
    sens: Internal
  - name: attempt_status_id
    type: UUID
    domain: enum_ref
    desc: In progress / graded / invalidated...
    sens: Internal
  - name: attempt_no
    type: INT2
    domain: quantity
    desc: 1-based attempt number for this candidate and assessment.
    sens: Internal
    default: '1'
  - name: started_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Start time.
    sens: Internal
    default: now()
  - name: submitted_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Submission time.
    sens: Internal
    'null': true
    null_why: NULL = not submitted.
  - name: graded_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Grading time.
    sens: Internal
    'null': true
    null_why: NULL = not graded (score unknown).
  - name: score_value
    type: DECIMAL(8,2)
    domain: measure
    desc: Score achieved.
    sens: Internal
    'null': true
    null_why: NULL until graded (unknown, not zero).
  - name: percentile
    type: DECIMAL(5,2)
    domain: percentage
    desc: Percentile among all takers.
    sens: Internal
    'null': true
    null_why: NULL until graded or cohort too small.
  - name: is_passed
    type: BOOL
    domain: boolean
    desc: Passed (meaningful only when graded_at is set).
    sens: Internal
    default: 'false'
  - name: awarded_proficiency_level_id
    type: UUID
    domain: enum_ref
    desc: Level awarded by the assessment.
    sens: Internal
    'null': true
    null_why: NULL = no level awarded.
  - name: result_expires_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: When the result lapses.
    sens: Internal
    'null': true
    null_why: NULL = does not expire.
  - name: proctoring_flags
    type: JSONB
    domain: json
    desc: Proctoring events (tab switches, face absence).
    sens: Internal
    'null': true
    null_why: NULL = not proctored.
  - name: external_attempt_ref
    type: STRING(100)
    domain: free_text
    desc: Provider-side attempt id (idempotent result sync).
    sens: Internal
    'null': true
    null_why: NULL = in-house.
  - name: show_on_profile
    type: BOOL
    domain: boolean
    desc: Display the result on the profile.
    sens: Internal
    default: 'true'
  constraints:
  - name: ck_assessment_attempt_percentile_range
    type: check
    expr: percentile IS NULL OR percentile BETWEEN 0 AND 100
    desc: Percentage range.
  - name: ck_assessment_attempt_order
    type: check
    expr: (submitted_at IS NULL OR submitted_at >= started_at) AND (graded_at IS NULL OR submitted_at IS NOT NULL)
    desc: Time order started <= submitted <= graded.
  - name: ck_assessment_attempt_score_when_graded
    type: check
    expr: (graded_at IS NULL) = (score_value IS NULL)
    desc: Score present iff graded.
  - name: ck_assessment_attempt_score_nonneg
    type: check
    expr: score_value IS NULL OR score_value >= 0
    desc: Non-negative score.
  - name: ck_assessment_attempt_attempt_pos
    type: check
    expr: attempt_no > 0
    desc: Positive attempt number.
  indexes:
  - name: uq_assessment_attempt_candidate_profile_id_assessment_id_a_e083
    columns:
    - candidate_profile_id
    - assessment_id
    - attempt_no
    unique: true
    where: deleted_at IS NULL
    desc: Attempt numbers are unique per candidate and assessment.
  - name: uq_assessment_attempt_external_attempt_ref
    columns:
    - external_attempt_ref
    unique: true
    where: deleted_at IS NULL AND (external_attempt_ref IS NOT NULL)
    desc: Idempotent provider sync.
  - name: idx_assessment_attempt_assessment_id_score_value
    columns:
    - assessment_id
    - score_value DESC
    desc: Leaderboards / percentile computation.
    where: deleted_at IS NULL AND graded_at IS NOT NULL
  - name: idx_assessment_attempt_candidate_profile_id_started_at
    columns:
    - candidate_profile_id
    - started_at DESC
    desc: A candidate's attempts newest first.
    where: deleted_at IS NULL
  fks:
  - name: fk_assessment_attempt_candidate_profile_id
    columns:
    - candidate_profile_id
    ref: candidate_profile
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
    desc: 'Dependent row of candidate_profile: removed with its parent.'
  - name: fk_assessment_attempt_assessment_id
    columns:
    - assessment_id
    ref: assessment
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'Reference to assessment: parent cannot be deleted while referenced (soft-delete/retire instead).'
  - name: fk_assessment_attempt_attempt_status_id
    columns:
    - attempt_status_id
    ref: attempt_status
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'Reference to attempt_status: parent cannot be deleted while referenced (soft-delete/retire instead).'
    index_exempt: low-cardinality lookup; never navigated from the lookup side, RESTRICT check is a point read on the lookup PK
  - name: fk_assessment_attempt_awarded_proficiency_level_id
    columns:
    - awarded_proficiency_level_id
    ref: proficiency_level
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'Reference to proficiency_level: parent cannot be deleted while referenced (soft-delete/retire instead).'
    index_exempt: low-cardinality lookup; never navigated from the lookup side, RESTRICT check is a point read on the lookup PK
