  - name: missing_rule_count
    type: INT2
    domain: quantity
    desc: Rules not satisfied.
    sens: Internal
    default: '0'
  - name: computed_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: When the score was computed.
    sens: Internal
    default: now()
  constraints:
  - name: ck_candidate_profile_completion_snapshot_score_range
    type: check
