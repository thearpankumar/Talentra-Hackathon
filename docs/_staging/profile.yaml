    on_update: RESTRICT
    desc: 'Dependent row of candidate_profile: removed with its parent.'
  - name: fk_candidate_contact_phone_phone_country_id
    columns:
    - phone_country_id
    ref: country
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'Reference to country: parent cannot be deleted while referenced (soft-delete/retire instead).'
  - name: fk_candidate_contact_phone_phone_type_id
    columns:
    - phone_type_id
    ref: phone_type
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'Reference to phone_type: parent cannot be deleted while referenced (soft-delete/retire instead).'
