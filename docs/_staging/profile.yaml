- name: profile_import
  kind: entity
  delete_policy: hard
  volume: high
  tier: X
  milestones: *id001
  retention: Raw payload cleared after 30 days; run metadata kept 24 months for audit; deleted with the profile.
  description: Import/sync run from LinkedIn export, legacy systems, CSV or ATS into a profile, with idempotency, conflict policy and result counts.
  columns:
  - name: candidate_profile_id
    type: UUID
    domain: identifier
    desc: Owning candidate_profile.
    sens: Internal
  - name: import_source_id
    type: UUID
    domain: enum_ref
    desc: Source of the data.
    sens: Internal
  - name: import_status_id
    type: UUID
    domain: enum_ref
    desc: Run status.
    sens: Internal
  - name: sync_conflict_policy_id
    type: UUID
    domain: enum_ref
    desc: Conflict rule for fields that differ.
    sens: Internal
  - name: source_account_ref
    type: STRING(200)
    domain: free_text
    desc: Identifier in the source system (public profile URL/id).
    sens: Personal
    'null': true
    null_why: NULL = file upload without source id.
    pii: 'Personal: access-controlled and audited; owner and entitled recruiters only; anonymised in place on erasure'
  - name: legacy_record_ref
