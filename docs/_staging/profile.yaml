    - computed_at DESC
    desc: Score history of a profile.
  - name: idx_candidate_profile_completion_snapshot_computed_at
    columns:
    - computed_at
    desc: Time-ordered scan for trend jobs; hash-sharded against sequential hot spot.
    hash: true
    bucket_count: 16
  fks:
  - name: fk_candidate_profile_completion_snapshot_candidate_profile_id
    columns:
    - candidate_profile_id
    ref: candidate_profile
    ref_columns:
    - id
    on_delete: CASCADE
    on_update: RESTRICT
