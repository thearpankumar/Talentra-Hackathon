    desc: One platform profile per legacy record (sync key).
  - name: idx_candidate_profile_total_experience_months
    columns:
    - total_experience_months
    desc: Experience-range filter.
    where: deleted_at IS NULL AND is_searchable
  - name: idx_candidate_profile_nationality_country_id
    columns:
    - nationality_country_id
    desc: 'Leading index for FK fk_candidate_profile_nationality_country_id: child lookups by parent and parent-side RESTRICT/CASCADE checks.'
  - name: idx_candidate_profile_profile_language_id
