  - name: idx_candidate_profile_contact_phone_country_id
    columns:
    - contact_phone_country_id
    desc: 'Leading index for FK fk_candidate_profile_contact_phone_country_id: child lookups by parent and parent-side RESTRICT/CASCADE checks.'
  fks:
  - name: fk_candidate_profile_app_user_id
    columns:
    - app_user_id
    ref: app_user
    ref_columns:
    - id
    on_delete: RESTRICT
    on_update: RESTRICT
    desc: 'Reference to app_user: parent cannot be deleted while referenced (soft-delete/retire instead).'
  - name: fk_candidate_profile_gender_id
