tables:
- name: candidate_profile
  kind: entity
  delete_policy: soft
  volume: high
  tier: '1'
  milestones: &id001
  - B4
  - B5
  - B8
  - B9
  - B12
  - B13
  - B16
  - B17
  - B20
  - B21
  retention: 'Erased on verified erasure request (anonymise-in-place within 30 days, unless legal hold) and after 36 months of candidate inactivity (inactivity_purge job, 30-day warning notification first).
    Erasure = anonymise-in-place: names, birth date, headline, summary, contact, photo key, salary and location fields are overwritten (NULLed or replaced by neutral tokens), anonymised_at is set and deleted_at
    set; the row id is kept so history (views, downloads, ledger references) stays referentially intact. Row itself is retained as a tombstone for 7 years for audit/legal.'
  description: 'Master record of a candidate (1:1 with app_user): identity, headline, current location, availability, salary expectations with disclosure semantics, visibility, completeness and denormalised
    search fields. Child tables hold the repeating sections.'
  columns:
  - name: app_user_id
    type: UUID
    domain: identifier
    desc: Account that owns this profile (exactly one profile per user).
    sens: Internal
  - name: given_name
    type: STRING(150)
    domain: person_name
    desc: Given (first) name; no script/order assumption.
    sens: Personal
    pii: 'Personal: access-controlled and audited; owner and entitled recruiters only; anonymised in place on erasure'
  - name: family_name
    type: STRING(150)
    domain: person_name
    desc: Family (last) name.
    sens: Personal
    'null': true
    null_why: NULL = person has a single name (mononym); not unknown.
    pii: 'Personal: access-controlled and audited; owner and entitled recruiters only; anonymised in place on erasure'
  - name: display_name
    type: STRING(150)
    domain: person_name
    desc: Name shown publicly (may differ from legal name).
    sens: Personal
    pii: 'Personal: access-controlled and audited; owner and entitled recruiters only; anonymised in place on erasure'
  - name: birth_date
    type: DATE
    domain: date
    desc: Date of birth; hidden from recruiters by default and never used for filtering (age-discrimination risk).
    sens: Personal
    'null': true
    null_why: NULL = not provided (optional field).
    pii: 'Personal: access-controlled and audited; owner and entitled recruiters only; anonymised in place on erasure'
  - name: gender_id
    type: UUID
    domain: enum_ref
    desc: Self-declared gender (master lookup).
    sens: Personal
    'null': true
    null_why: NULL = not provided / prefers not to say.
    pii: 'Personal: access-controlled and audited; owner and entitled recruiters only; anonymised in place on erasure'
  - name: nationality_country_id
    type: UUID
    domain: identifier
    desc: Country of citizenship.
    sens: Personal
    'null': true
    null_why: NULL = not provided.
    pii: 'Personal: access-controlled and audited; owner and entitled recruiters only; anonymised in place on erasure'
  - name: headline
    type: STRING(220)
    domain: free_text
    desc: 'Short professional headline (LinkedIn: 220 chars).'
    sens: Internal
    'null': true
    null_why: NULL = not written yet.
  - name: resume_headline
    type: STRING(250)
    domain: free_text
    desc: Naukri-style resume headline shown on search cards.
    sens: Internal
    'null': true
    null_why: NULL = not written yet.
  - name: summary
    type: STRING(2600)
    domain: free_text
    desc: About / profile summary (LinkedIn limit 2600 chars). Free text in the language given by profile_language_id.
    sens: Personal
    'null': true
    null_why: NULL = not written yet.
    pii: 'Personal: access-controlled and audited; owner and entitled recruiters only; anonymised in place on erasure'
  - name: profile_language_id
    type: UUID
    domain: identifier
    desc: Language the free-text sections were entered in (Rule 7).
    sens: Internal
    'null': true
    null_why: NULL = language not detected/known.
  - name: current_country_id
    type: UUID
    domain: identifier
    desc: Country of current residence.
    sens: Personal
    'null': true
    null_why: NULL = not provided.
    pii: 'Personal: access-controlled and audited; owner and entitled recruiters only; anonymised in place on erasure'
  - name: current_state_region_id
    type: UUID
    domain: identifier
    desc: State/region of current residence.
    sens: Personal
    'null': true
    null_why: NULL = not provided.
    pii: 'Personal: access-controlled and audited; owner and entitled recruiters only; anonymised in place on erasure'
  - name: current_city_id
    type: UUID
    domain: identifier
    desc: City of current residence (primary search filter).
    sens: Personal
    'null': true
    null_why: NULL = not provided.
    pii: 'Personal: access-controlled and audited; owner and entitled recruiters only; anonymised in place on erasure'
  - name: time_zone
    type: STRING(64)
    domain: time_zone
    desc: IANA time zone for scheduling and display.
    sens: Internal
    'null': true
    null_why: NULL = not known; derive from city.
  - name: availability_status_id
    type: UUID
    domain: enum_ref
    desc: Availability to join.
    sens: Internal
    'null': true
    null_why: NULL = candidate has not stated availability.
  - name: notice_period_days
    type: INT2
    domain: quantity
    desc: Notice period in days; 0 = can join immediately (a real value, not 'missing').
    sens: Internal
    'null': true
    null_why: NULL = unknown / not stated.
  - name: earliest_start_date
    type: DATE
    domain: date
    desc: Earliest date the candidate can start.
    sens: Internal
    'null': true
    null_why: NULL = not stated.
  - name: current_salary_amount
    type: DECIMAL(18,4)
    domain: money
    desc: Current fixed compensation per salary_period_id, in salary_currency_id. NULL unless current_salary_disclosure_id = disclosed (recruiter view masks it unless disclosed).
    sens: Personal
    'null': true
    null_why: NULL = unknown OR not disclosed OR not applicable; the disclosure column tells which (D-09).
    pii: 'Personal: access-controlled and audited; owner and entitled recruiters only; anonymised in place on erasure'
  - name: expected_salary_min
    type: DECIMAL(18,4)
    domain: money
    desc: Lower bound of expected compensation.
    sens: Personal
    'null': true
    null_why: NULL = unknown, undisclosed or not applicable; see expected_salary_disclosure_id.
    pii: 'Personal: access-controlled and audited; owner and entitled recruiters only; anonymised in place on erasure'
  - name: expected_salary_max
    type: DECIMAL(18,4)
    domain: money
    desc: Upper bound of expected compensation.
    sens: Personal
    'null': true
    null_why: NULL = open-ended / unknown; see expected_salary_disclosure_id.
    pii: 'Personal: access-controlled and audited; owner and entitled recruiters only; anonymised in place on erasure'
  - name: salary_currency_id
    type: UUID
    domain: identifier
    desc: Currency of all salary amounts on this row.
    sens: Internal
    'null': true
    null_why: NULL only when no salary amount is held.
  - name: salary_period_id
    type: UUID
    domain: enum_ref
    desc: Period the amounts are quoted for (month/year/hour).
    sens: Internal
    'null': true
    null_why: NULL only when no salary amount is held.
  - name: current_salary_disclosure_id
    type: UUID
    domain: enum_ref
    desc: Disclosure state of current salary (disclosed / undisclosed / not applicable).
    sens: Internal
  - name: expected_salary_disclosure_id
    type: UUID
    domain: enum_ref
    desc: Disclosure state of expected salary.
    sens: Internal
  - name: current_job_title
    type: STRING(150)
    domain: free_text
    desc: Denormalised title of the current/most recent experience (search card).
    sens: Internal
    'null': true
    null_why: NULL = no experience recorded (fresher).
  - name: current_employer_name
    type: STRING(200)
    domain: free_text
    desc: Denormalised current employer name.
    sens: Internal
    'null': true
    null_why: NULL = no current employer.
  - name: total_experience_months
    type: INT2
    domain: quantity
    desc: Denormalised total professional experience in months (0 = fresher).
    sens: Internal
    'null': true
    null_why: NULL = not computed yet.
  - name: visibility_level_id
    type: UUID
    domain: enum_ref
    desc: Who may discover/view this profile (public, recruiters only, private).
    sens: Internal
  - name: is_searchable
    type: BOOL
    domain: boolean
    desc: False hides the profile from recruiter search entirely.
    sens: Internal
    default: 'true'
  - name: is_contact_visible_to_recruiters
    type: BOOL
    domain: boolean
    desc: True lets recruiters see phone/email without a credit-gated reveal.
    sens: Internal
    default: 'false'
  - name: is_open_to_work
    type: BOOL
    domain: boolean
    desc: Denormalised flag of an active open_to_work_signal.
    sens: Internal
    default: 'false'
  - name: completeness_score
    type: DECIMAL(5,2)
    domain: percentage
    desc: Profile completeness 0..100 (latest snapshot).
    sens: Internal
    default: '0'
  - name: profile_strength_id
    type: UUID
    domain: enum_ref
    desc: Strength band derived from completeness_score.
    sens: Internal
    'null': true
    null_why: NULL = not computed yet.
  - name: completeness_calculated_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: When completeness_score was last computed.
    sens: Internal
    'null': true
    null_why: NULL = never computed.
  - name: profile_photo_object_key
    type: STRING(512)
    domain: free_text
    desc: 'Denormalised object-storage key of the current profile photo (source of truth: candidate_media_file.is_profile_photo).'
    sens: Personal
    'null': true
    null_why: NULL = no photo.
    pii: 'Personal: access-controlled and audited; owner and entitled recruiters only; anonymised in place on erasure'
  - name: contact_phone
    type: STRING(16)
    domain: phone
    desc: Primary phone, E.164 (mirror of the primary candidate_contact_phone row).
    sens: Personal
    'null': true
    null_why: NULL = no phone supplied.
    pii: 'Personal: access-controlled and audited; owner and entitled recruiters only; anonymised in place on erasure'
  - name: contact_phone_country_id
    type: UUID
    domain: identifier
    desc: Country calling-code country of contact_phone.
    sens: Personal
    'null': true
    null_why: NULL iff contact_phone is NULL.
    pii: 'Personal: access-controlled and audited; owner and entitled recruiters only; anonymised in place on erasure'
  - name: contact_phone_verified_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: OTP verification time of contact_phone.
    sens: Internal
    'null': true
    null_why: NULL = not verified.
  - name: contact_email
    type: STRING(254)
    domain: email
    desc: Primary contact email, lowercase (mirror of the primary candidate_contact_email row).
    sens: Personal
    'null': true
    null_why: NULL = none supplied.
    pii: 'Personal: access-controlled and audited; owner and entitled recruiters only; anonymised in place on erasure'
  - name: contact_email_verified_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Verification time of contact_email.
    sens: Internal
    'null': true
    null_why: NULL = not verified.
  - name: import_source_id
    type: UUID
    domain: enum_ref
    desc: Where the profile originated (native sign-up or legacy/imported).
    sens: Internal
  - name: legacy_candidate_ref
    type: STRING(64)
    domain: free_text
    desc: Record id in a legacy candidate system (natural key for sync; *_ref because it is external).
    sens: Internal
    'null': true
    null_why: NULL = native profile with no legacy origin.
  - name: last_active_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Last login/activity (drives inactivity retention and recency ranking).
    sens: Internal
    'null': true
    null_why: NULL = never active after registration.
  - name: last_profile_update_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Last user-initiated profile edit (ignores system rewrites).
    sens: Internal
    'null': true
    null_why: NULL = never edited.
  - name: anonymised_at
    type: TIMESTAMPTZ
    domain: timestamp
    desc: Set when the erasure job anonymised this row in place.
    sens: Internal
    'null': true
    null_why: NULL = not anonymised.
  constraints:
  - name: uq_candidate_profile_app_user_id
    type: unique
    columns:
    - app_user_id
    desc: One profile per account (1:1 with app_user); non-partial so an erased tombstone still blocks re-use.
  - name: ck_candidate_profile_contact_phone_e164
    type: check
    expr: contact_phone IS NULL OR contact_phone ~ '^\+[1-9][0-9]{6,14}$'
    desc: E.164 phone.
  - name: ck_candidate_profile_contact_phone_country
    type: check
    expr: (contact_phone IS NULL) = (contact_phone_country_id IS NULL)
    desc: Phone and its country come together.
  - name: ck_candidate_profile_contact_email_lower
    type: check
    expr: contact_email IS NULL OR contact_email = lower(contact_email)
    desc: Emails are stored lowercase.
  - name: ck_candidate_profile_completeness_range
    type: check
    expr: completeness_score BETWEEN 0 AND 100
    desc: Percentage 0..100.
  - name: ck_candidate_profile_notice_period_range
    type: check
    expr: notice_period_days IS NULL OR notice_period_days BETWEEN 0 AND 365
    desc: Sane notice period.
  - name: ck_candidate_profile_experience_months_range
    type: check
    expr: total_experience_months IS NULL OR total_experience_months BETWEEN 0 AND 1200
    desc: 0..100 years.
  - name: ck_candidate_profile_salary_nonneg
    type: check
    expr: COALESCE(current_salary_amount, 0) >= 0 AND COALESCE(expected_salary_min, 0) >= 0 AND COALESCE(expected_salary_max, 0) >= 0
    desc: Salaries are never negative.
  - name: ck_candidate_profile_salary_min_max
    type: check
    expr: expected_salary_min IS NULL OR expected_salary_max IS NULL OR expected_salary_min <= expected_salary_max
    desc: Minimum expected salary does not exceed maximum.
  - name: ck_candidate_profile_salary_currency
    type: check
    expr: (current_salary_amount IS NULL AND expected_salary_min IS NULL AND expected_salary_max IS NULL) OR (salary_currency_id IS NOT NULL AND salary_period_id IS NOT NULL)
    desc: Any salary amount needs currency and period.
  - name: ck_candidate_profile_anonymised_deleted
    type: check
    expr: anonymised_at IS NULL OR deleted_at IS NOT NULL
    desc: An anonymised row is also soft-deleted.
  indexes:
  - name: idx_candidate_profile_current_city_id_availability_status_id
    columns:
